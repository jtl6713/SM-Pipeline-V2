name: Inspect Make Exact Runner Patterns
on:
  push:
    branches: [main]
    paths: ['deploy/inspect-make-exact-runner-patterns.txt']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRIDGE_WORKER: chicagoshining-repair-control-bridge
    steps:
      - name: Inspect R4 and TTD0 read-only
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS "$ROOT/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/subdomain.json
          SUB=$(jq -er '.result.subdomain' /tmp/subdomain.json)
          URL="https://$BRIDGE_WORKER.$SUB.workers.dev/control"
          SECRET=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          for pair in 'r4:5556716' 'ttd0:5613069'; do
            name=${pair%%:*}; id=${pair##*:}
            jq -n --argjson id "$id" '{action:"inspect_make_scenario",confirm:"INSPECT-MAKE-MODULES-V1",scenario_id:$id}' >/tmp/$name-request.json
            code=$(curl -sS --max-time 120 -o /tmp/$name.json -w '%{http_code}' -X POST "$URL" -H "Authorization: Bearer $SECRET" -H 'Content-Type: application/json' --data-binary @/tmp/$name-request.json || true)
            test "$code" = '200'
            jq -e '.bridge_ok==true and .upstream_status==200 and .upstream_json.ok==true' /tmp/$name.json >/dev/null
            jq -c --arg name "$name" '{name:$name,scenario_id:.upstream_json.inspected.scenario_id,scenario_name:.upstream_json.inspected.scenario_name,active:.upstream_json.inspected.scenario_active,modules:[.upstream_json.inspected.modules[]|{id:.module.id,module:.module.module,name:(.module.metadata.designer.name//null),route_path:.route_path}]}' /tmp/$name.json
          done
          unset SECRET
      - name: Upload read-only module definitions
        uses: actions/upload-artifact@v4
        with:
          name: make-exact-runner-patterns-${{ github.run_id }}
          path: |
            /tmp/r4.json
            /tmp/ttd0.json
          retention-days: 30
