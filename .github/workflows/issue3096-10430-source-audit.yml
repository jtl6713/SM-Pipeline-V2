name: Issue 3096 exact 10430 source byte audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'repair/scripts/issue3096-10430-source-audit.py'
      - '.github/workflows/issue3096-10430-source-audit.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue3096-10430-source-audit.yml'
permissions:
  contents: read
  statuses: read
concurrency:
  group: issue3096-10430-source-audit
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile repair/scripts/issue3096-10430-source-audit.py
          python -m pip install -q pillow
          python - <<'PY'
          import ast
          from pathlib import Path
          text=Path('repair/scripts/issue3096-10430-source-audit.py').read_text()
          ast.parse(text)
          for forbidden in ('requests.post','requests.patch','requests.put','requests.delete','update_record(','put_object(','/jobs/studio-produce/resume'):
              assert forbidden not in text
          assert 'drive.download_file' in text
          assert 'ISSUE3096_SOURCE_AUDIT=' in text
          print('EXACT_SOURCE_AUDIT_STATIC_PASS')
          PY
  audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Protected read-only exact source byte inspection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
          OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
          OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
        run: |
          set -euo pipefail
          # Do not compete with the Runner cutover for its Ops lease.
          for i in $(seq 1 90); do
            status=$(curl -fsS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" | jq -r '[.statuses[] | select(.context=="production/pipeline-runner")][0].state // "pending"')
            [[ "$status" != failure && "$status" != error ]] || exit 1
            [[ "$status" == success ]] && break
            sleep 5
          done
          test "$status" = success
          BASE=https://ops.chicagoshining.com
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            [[ -n "$candidate" ]] || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then selected="$candidate"; break; fi
          done
          test -n "$selected"
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          source=Path('repair/scripts/issue3096-10430-source-audit.py')
          sha=os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}',sha)
          expected=hashlib.sha256(source.read_bytes()).hexdigest()
          url=f'https://raw.githubusercontent.com/jtl6713/SM-Pipeline-V2/{sha}/{source.as_posix()}'
          command=("$ErrorActionPreference='Stop';"
            "$tmp=Join-Path $env:TEMP ('issue3096-source-audit-'+[guid]::NewGuid().ToString('N')+'.py');"
            f"Invoke-WebRequest -Uri '{url}' -OutFile $tmp -UseBasicParsing -TimeoutSec 55;"
            f"if((Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant() -ne '{expected}'){{throw 'audit_source_hash_mismatch'}};"
            "try{& python $tmp;if($LASTEXITCODE -ne 0){throw 'audit_python_failed'}}finally{Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue}")
          Path('/tmp/request.json').write_text(json.dumps({'command':command,'confirm':True}))
          PY
          job=''
          for attempt in $(seq 1 36); do
            code=$(curl -sS --max-time 20 -o /tmp/start.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $selected" -H 'Content-Type: application/json' --data-binary @/tmp/request.json || true)
            if [[ "$code" == 202 ]]; then job=$(jq -er '.job.id' /tmp/start.json); break; fi
            [[ "$code" == 409 ]] || { echo "audit_ops_http=$code"; exit 1; }
            sleep 5
          done
          test -n "$job"
          echo "audit_job_id=$job"
          for attempt in $(seq 1 90); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $selected" "$BASE/api/jobs/$job" -o /tmp/status.json
            state=$(jq -r '.job.status' /tmp/status.json)
            [[ "$state" == ok || "$state" == failed ]] && break
            sleep 3
          done
          python - <<'PY'
          import json,re
          from pathlib import Path
          job=json.loads(Path('/tmp/status.json').read_text())['job']
          out=job.get('log','').partition('\n\n')[2]
          lines=[line for line in out.splitlines() if line.startswith('ISSUE3096_SOURCE_AUDIT=')]
          if job['status']!='ok':
              print('audit_failure_codes='+str(sorted(set(re.findall(r'\b(?:governor_unavailable|wrong_authority|output_revision_changed|source_identity_changed|manifest_changed|slide_revision_changed|byte_budget|RuntimeError|ImportError|audit_python_failed)\b',out)))))
              raise SystemExit('protected_audit_failed')
          assert len(lines)==1,'audit_receipt_incomplete'
          receipt=json.loads(lines[0].split('=',1)[1])
          assert receipt['output']==10430 and len(receipt['rows'])==2
          assert all(receipt[key]==0 for key in ('output_writes','provider_writes','r2_writes'))
          print(lines[0])
          PY
