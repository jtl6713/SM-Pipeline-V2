name: Video Compressor Exact Test

on:
  push:
    paths:
      - '.github/workflows/video-compressor-exact-test.yml'
  workflow_dispatch:

jobs:
  exact-compression-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install FFmpeg validation tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Submit exact Output 242 compression test
        id: submit
        shell: bash
        run: |
          set -euo pipefail
          API='https://compress.chicagoshining.com'
          PAYLOAD=$(cat <<'JSON'
          {
            "download_url": "https://media.chicagoshining.com/studio/previews/recUFUsOZjtFpD9ea/current.mp4",
            "record_id": "recUFUsOZjtFpD9ea",
            "asset_name": "studio-PR-20260823141353-WG3ZOT-youtube-standard-video.mp4",
            "output_filename": "output-242-local-compression-test.mp4",
            "target_mb": 20,
            "max_width": 1080,
            "max_height": 1920,
            "audio_kbps": 128
          }
          JSON
          )
          curl --fail-with-body --silent --show-error -H 'Content-Type: application/json' -d "$PAYLOAD" "$API/compress" > submit.json
          cat submit.json
          JOB_ID=$(python -c "import json; print(json.load(open('submit.json'))['job_id'])")
          STATUS_URL=$(python -c "import json; print(json.load(open('submit.json'))['status_url'])")
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "status_url=$STATUS_URL" >> "$GITHUB_OUTPUT"

      - name: Poll until complete
        shell: bash
        env:
          STATUS_URL: ${{ steps.submit.outputs.status_url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 120); do
            curl --fail-with-body --silent --show-error "$STATUS_URL" > status.json
            cat status.json
            STATUS=$(python -c "import json; print(json.load(open('status.json'))['status'])")
            if [ "$STATUS" = "complete" ]; then
              break
            fi
            if [ "$STATUS" = "failed" ]; then
              echo 'Compression job failed.' >&2
              exit 1
            fi
            sleep 10
          done
          python - <<'PY'
          import json
          d=json.load(open('status.json'))
          assert d.get('status')=='complete', d
          assert d.get('ok') is True, d
          assert d.get('target_met') is True, d
          assert float(d.get('output_size_mb',999)) <= 20.0, d
          print('PASS compression result:', json.dumps(d, indent=2))
          PY

      - name: Download and validate output
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_URL=$(python -c "import json; print(json.load(open('status.json'))['output_url'])")
          curl --fail-with-body --location --silent --show-error "$OUTPUT_URL" -o compressed.mp4
          python - <<'PY'
          import os
          size=os.path.getsize('compressed.mp4')
          print('Downloaded bytes:', size)
          assert size > 100000, size
          assert size <= 20*1024*1024, size
          PY
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,width,height -of json compressed.mp4 | tee ffprobe.json
          python - <<'PY'
          import json
          d=json.load(open('ffprobe.json'))
          streams=d.get('streams') or []
          assert any(s.get('codec_type')=='video' and s.get('codec_name')=='h264' for s in streams), d
          fmt=d.get('format') or {}
          assert float(fmt.get('duration') or 0) > 0, d
          print('PASS independent ffprobe validation')
          PY

      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-compressor-output-242-test
          path: |
            submit.json
            status.json
            compressed.mp4
            ffprobe.json
          if-no-files-found: ignore
