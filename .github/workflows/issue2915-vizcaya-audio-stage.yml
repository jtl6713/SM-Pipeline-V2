name: Issue 2915 Stage Vizcaya Story Replacement Audio
on:
  pull_request:
    paths:
      - 'repair/scripts/issue2915-vizcaya-audio-stage.py'
      - '.github/workflows/issue2915-vizcaya-audio-stage.yml'
  push:
    branches: [main]
    paths:
      - 'repair/scripts/issue2915-vizcaya-audio-stage.py'
      - '.github/workflows/issue2915-vizcaya-audio-stage.yml'
permissions:
  contents: read
concurrency:
  group: issue2915-vizcaya-audio-stage
  cancel-in-progress: false
jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise original audio synthesis and safety contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile repair/scripts/issue2915-vizcaya-audio-stage.py
          python3 - <<'PY'
          import ast,math,sys,tempfile,wave
          from array import array
          from pathlib import Path
          s=Path('repair/scripts/issue2915-vizcaya-audio-stage.py').read_text()
          tree=ast.parse(s)
          for required in ['resource_slot','circuit_open','recovery_read_only_active','studio_write_source','5628','video_stream_changed','old_audio_removed','source_writes','provider_writes','factory_approvals','drive_preview_bytes_differ','human_audio_visual_review_pending','source_changed_after_stage','"-map","0:v:0","-map","[mix]"']:
              assert required in s, required
          for forbidden in ['api.airtable.com','graph.facebook.com','media_publish','requests.post','requests.patch','requests.delete','requests.put']:
              assert forbidden not in s, forbidden
          scope=dict(math=math,sys=sys,wave=wave,array=array)
          subset=ast.Module(body=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='generate_bed'],type_ignores=[])
          exec(compile(subset,'original-bed','exec'),scope)
          with tempfile.TemporaryDirectory() as d:
              p=Path(d)/'bed.wav'; q=Path(d)/'bed2.wav'
              scope['generate_bed'](p,3);scope['generate_bed'](q,3)
              assert p.read_bytes()==q.read_bytes()
              with wave.open(str(p),'rb') as f:
                  assert f.getframerate()==24000 and f.getnframes()==72000
                  pcm=array('h',f.readframes(f.getnframes()))
                  assert max(abs(x) for x in pcm)>100 and max(abs(x) for x in pcm)<5000
          print('ISSUE2915_ORIGINAL_AUDIO_STATIC_SAFE')
          PY
  stage-owned-media:
    if: github.event_name == 'push'
    needs: static-safety
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate existing Ops runner without exposing credential
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C";do
            [[ -n "$candidate" ]] || continue
            http=$(curl -sS --max-time 20 -o /tmp/issue2915-ops-catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" 'https://ops.chicagoshining.com/api/catalog' || true)
            if [[ "$http" == 200 ]] && jq -e '.ok==true' /tmp/issue2915-ops-catalog.json >/dev/null;then
              echo "::add-mask::$candidate"
              echo "ISSUE2915_OPS_TOKEN=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'Vizcaya R2 staging blocked: Ops unavailable; no media state changed'; exit 1
      - name: Build pinned SHA256 source execution request for original owner runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,json,pathlib
          src=pathlib.Path('repair/scripts/issue2915-vizcaya-audio-stage.py')
          expected=hashlib.sha256(src.read_bytes()).hexdigest()
          sha=os.environ['GITHUB_SHA']
          assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha)
          url=f'https://raw.githubusercontent.com/jtl6713/SM-Pipeline-V2/{sha}/{src.as_posix()}'
          command=(
              "$ErrorActionPreference='Stop';"
              "$py=Get-Command python -ErrorAction SilentlyContinue;"
              "if(-not $py){throw 'ops_python_missing'};"
              "$tmp=Join-Path $env:TEMP 'issue2915-vizcaya-audio-stage.py';"
              f"$srcUrl='{url}';"
              "Invoke-WebRequest -Uri $srcUrl -Method Get -OutFile $tmp -UseBasicParsing -TimeoutSec 55;"
              "$actual=(Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant();"
              f"if($actual -ne '{expected}'){{throw 'exact_stage_source_checksum_mismatch'}};"
              "try{& python $tmp;"
              "if($LASTEXITCODE -ne 0){throw ('vizcaya_audio_python_stage_exit_'+$LASTEXITCODE)}}"
              "finally{Remove-Item $tmp -Force -ErrorAction SilentlyContinue}"
          )
          pathlib.Path('/tmp/issue2915-ops-request.json').write_text(json.dumps({'command':command,'confirm':True}))
          print('IMMUTABLE_ISSUE2915_STAGE_SOURCE_PINNED')
          PY
      - name: Stage replacement Vizcaya Story audio, no output writes
        shell: bash
        run: |
          set -euo pipefail
          accepted=false
          for slot in $(seq 1 32);do
            code=$(curl -sS --max-time 30 -o /tmp/issue2915-ops-start.json -w '%{http_code}' \
              -X POST 'https://ops.chicagoshining.com/api/shell' \
              -H "Authorization: Bearer $ISSUE2915_OPS_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @/tmp/issue2915-ops-request.json || true)
            if [[ "$code" == 200 || "$code" == 202 ]];then accepted=true;break;fi
            if [[ "$code" != 409 ]];then echo "R2 owner runner returned $code";exit 2;fi
            sleep 12
          done
          [[ "$accepted" == true ]] || { echo 'Ops shell busy; no second stage scheduled';exit 2; }
          job=$(jq -er '.job.id // .jobId' /tmp/issue2915-ops-start.json)
          for tick in $(seq 1 480);do
            curl -fsS --max-time 30 -H "Authorization: Bearer $ISSUE2915_OPS_TOKEN" \
              "https://ops.chicagoshining.com/api/jobs/$job" -o /tmp/issue2915-ops-job.json
            status=$(jq -r '.job.status // empty' /tmp/issue2915-ops-job.json)
            if [[ "$status" == ok ]];then
              jq -r '.job.log // ""' /tmp/issue2915-ops-job.json | grep '^ISSUE2915_STORY_STAGE=' | tail -1 \
                | sed 's/^ISSUE2915_STORY_STAGE=//' > /tmp/issue2915-story-stage.json
              jq -e '.verified==true and .output==5628 and .source_writes==0 and .provider_writes==0 and .factory_approvals==0 and .old_audio_removed==true and .video_stream_unchanged==true and .human_audio_visual_review_pending==true' /tmp/issue2915-story-stage.json >/dev/null
              jq -c '{verified,output,candidate_url,sha256,source_sha256,narration_sha256,source_updated_at,video_stream_unchanged,old_audio_removed,instrumental_provenance,duration,narration_duration,audio_rms_db,audio_peak,human_audio_visual_review_pending,source_writes,provider_writes,factory_approvals}' /tmp/issue2915-story-stage.json
              exit 0
            elif [[ "$status" == failed ]];then
              echo 'Vizcaya audio stage failed; no automatic source/approval/provider changes'
              jq -r '.job.log // ""' /tmp/issue2915-ops-job.json | tail -n 23 \
                | sed -E 's#[A-Za-z0-9_./+=-]{28,}#[redacted]#g' \
                | grep -Ev 'Authorization:|Bearer |SUPABASE_SERVICE_ROLE_KEY|R2_UPLOAD_WORKER_SECRET|GOOGLE_REFRESH_TOKEN' || true
              exit 3
            fi
            sleep 4
          done
          echo 'R2 audio staging job incomplete; do not set public statuses Ready'; exit 4
      - name: Preserve exact audio/video CDN evidence for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue2915-vizcaya-audio-stage
          path: /tmp/issue2915-story-stage.json
          retention-days: 30
          if-no-files-found: warn
