name: Verify Supabase Production Bindings (Read Only)

on:
  pull_request:
    paths:
      - '.github/workflows/verify-supabase-production-readonly.yml'
      - 'repair/scripts/production_supabase_identity_audit*.py'
      - 'repair/scripts/airtable_retirement_evidence_gate*.py'
      - 'docs/supabase-migration/phase7/media_atomic_upsert_readonly_preflight.sql'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Enter AUDIT-SUPABASE-PRODUCTION (read only; no deploys or revocation)'
        required: true
        type: string
      mode:
        description: 'Discover a candidate project or verify an independently approved production project'
        required: true
        type: choice
        options: [discover, verify]
        default: discover

permissions:
  contents: read

jobs:
  premerge-static:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate project discovery and fail-closed evidence contracts (no secrets)
        run: |
          python -m unittest discover -s repair/scripts -p 'production_supabase_identity_audit_test.py' -v
          python -m unittest discover -s repair/scripts -p 'airtable_retirement_evidence_gate_test.py' -v
          python -m py_compile repair/scripts/production_supabase_identity_audit.py repair/scripts/airtable_retirement_evidence_gate.py
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'AUDIT-SUPABASE-PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STUDIO_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.STUDIO_PRODUCTION_SUPABASE_PROJECT_REF }}
      STUDIO_AUDIT_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Audit active Cloudflare binding names and types
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          mkdir -p /tmp/sm-prod-audit
          for target in chicagoshining-studio-api chicagoshining-studio-variant-service chicagoshining-tiktok-auth-la; do
            curl -fsS --retry 2 "$API/$target/deployments" -H "$AUTH" -o /tmp/sm-prod-audit/deployments.json
            version=$(jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id' /tmp/sm-prod-audit/deployments.json)
            curl -fsS --retry 2 "$API/$target/versions/$version" -H "$AUTH" -o /tmp/sm-prod-audit/version.json
            jq -e '.success==true' /tmp/sm-prod-audit/version.json >/dev/null
            if [[ "$target" == "chicagoshining-studio-api" ]]; then
              python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('repair/scripts')))
          from production_supabase_identity_audit import inspect_studio_bindings, assert_approved_target
          payload=json.loads(Path('/tmp/sm-prod-audit/version.json').read_text())
          bindings=((payload.get('result') or {}).get('resources') or {}).get('bindings') or []
          summary=inspect_studio_bindings(bindings, os.environ.get('SUPABASE_URL'))
          Path('/tmp/sm-prod-audit/project-discovery.json').write_text(json.dumps(summary,indent=2))
          print('active_worker_candidate_project_ref='+str(summary['candidate_project_ref'] or 'unavailable'))
          print('candidate_is_known_nonproduction='+str(summary['candidate_is_known_nonproduction']))
          if not summary['worker_supabase_binding_types_valid']:
              raise SystemExit('Active Studio Worker lacks valid Supabase URL and server-secret bindings')
          if os.environ.get('STUDIO_AUDIT_MODE') == 'verify':
              assert_approved_target(bindings,
                  os.environ.get('STUDIO_PRODUCTION_SUPABASE_PROJECT_REF'),
                  os.environ.get('SUPABASE_URL'))
              print('production_project_configuration_match=VERIFIED')
          else:
              print('production_project_configuration_match=UNVERIFIED_DISCOVERY_ONLY')
          PY
            fi
            jq -c --arg worker "$target" '
              (.result.resources.bindings // []) as $b |
              {
                worker: $worker,
                binding_names_types: ($b | map({name,type}) | sort_by(.name)),
                deprecated_airtable_pat_present: any($b[]; .name=="AIRTABLE_PAT")
              }
            ' /tmp/sm-prod-audit/version.json >>/tmp/sm-prod-audit/binding-types.jsonl
          done
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(x) for x in Path('/tmp/sm-prod-audit/binding-types.jsonl').read_text().splitlines()]
          by={r['worker']: {b['name']:b['type'] for b in r['binding_names_types']} for r in rows}
          studio=by['chicagoshining-studio-api']
          variant=by['chicagoshining-studio-variant-service']
          tiktok=by['chicagoshining-tiktok-auth-la']
          ok=(studio.get('SUPABASE_URL')=='plain_text'
              and studio.get('SUPABASE_SERVICE_ROLE_KEY')=='secret_text'
              and studio.get('STUDIO_MEDIA')=='r2_bucket'
              and variant.get('IMAGES')=='images'
              and variant.get('STUDIO_VARIANT_SERVICE_TOKEN')=='secret_text'
              and tiktok.get('TIKTOK_AUTH')=='kv_namespace'
              and tiktok.get('TIKTOK_CLIENT_SECRET')=='secret_text')
          report={
            'ok':bool(ok), 'supabase_primary_binding_contract':bool(ok),
            'audit_mode': __import__('os').environ.get('STUDIO_AUDIT_MODE'),
            'independent_production_ownership_verified':False,
            'project_discovery':json.loads(Path('/tmp/sm-prod-audit/project-discovery.json').read_text()),
            'retired_pat_still_bound': {r['worker']:r['deprecated_airtable_pat_present'] for r in rows},
            'verified_worker_count':len(rows),
            'credentials_values_collected':False,
            'audit_only':True,
          }
          Path('/tmp/sm-prod-audit/report.json').write_text(json.dumps(report,indent=2))
          print('production_binding_contract=' + ('PASS' if ok else 'FAIL'))
          print('legacy_pat_presence_checked=PASS')
          if not ok:
            raise SystemExit('Required production binding missing or type mismatch')
          PY
          rm -f /tmp/sm-prod-audit/deployments.json /tmp/sm-prod-audit/version.json
      - name: Read-only Supabase REST connectivity probe
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$STUDIO_AUDIT_MODE" != "verify" ]]; then
            echo 'supabase_rest_probe=SKIPPED_CANDIDATE_DISCOVERY_ONLY'
            exit 0
          fi
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          python - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('repair/scripts')))
          from studio_api_binding_contract import assert_production_supabase_target
          assert_production_supabase_target(
              os.environ.get('SUPABASE_URL'),
              os.environ.get('STUDIO_PRODUCTION_SUPABASE_PROJECT_REF'),
          )
          print('github_supabase_project_identity=VERIFIED')
          PY
          code=$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL%/}/rest/v1/media_assets?select=airtable_record_id&limit=0" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY")
          test "$code" = '200'
          echo 'supabase_rest_connectivity=PASS'
      - name: Save sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-readonly-${{ github.run_id }}
          path: /tmp/sm-prod-audit/report.json
          if-no-files-found: ignore
          retention-days: 14
