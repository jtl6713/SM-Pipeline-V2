name: Deploy Studio API Worker Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/cloudflare-worker-production.txt'

permissions:
  contents: read

concurrency:
  group: chicagoshining-studio-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Worker source
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/studio-api/worker.js
          grep -q 'chicagoshining-studio-api' apps/studio-api/worker.js
          cp apps/studio-api/worker.js /tmp/studio-worker.mjs
          node --check /tmp/studio-worker.mjs

      - name: Capture pre-deploy Worker backup
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/chicagoshining-studio-api/content/v2" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o /tmp/worker-before.js
          test -s /tmp/worker-before.js
          sha256sum /tmp/worker-before.js > /tmp/worker-before.sha256

      - name: Save pre-deploy backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicagoshining-studio-api-before-${{ github.run_id }}
          path: |
            /tmp/worker-before.js
            /tmp/worker-before.sha256
          retention-days: 30

      - name: Deploy Worker code without changing bindings or configuration
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS \
            -o /tmp/worker-deploy-result.json \
            -w '%{http_code}' \
            -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/chicagoshining-studio-api/content" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F 'worker.js=@apps/studio-api/worker.js;type=application/javascript+module')
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "Cloudflare Worker content update failed with HTTP $HTTP_CODE" >&2
            jq '{success,errors,messages}' /tmp/worker-deploy-result.json >&2 || true
            exit 1
          fi
          jq -e '.success == true' /tmp/worker-deploy-result.json >/dev/null

      - name: Verify deployed Worker source matches GitHub
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/chicagoshining-studio-api/content/v2" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -D /tmp/worker-after-headers.txt \
            -o /tmp/worker-after-body.bin

          python3 - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          import re

          headers = Path('/tmp/worker-after-headers.txt').read_bytes()
          body = Path('/tmp/worker-after-body.bin').read_bytes()
          text_headers = headers.decode('latin-1', errors='replace')
          matches = re.findall(r'(?im)^content-type:\s*(.+?)\r?$', text_headers)
          content_type = matches[-1].strip() if matches else ''
          out = Path('/tmp/worker-after.js')

          if content_type.lower().startswith('multipart/'):
              msg = BytesParser(policy=default).parsebytes(
                  f'Content-Type: {content_type}\r\nMIME-Version: 1.0\r\n\r\n'.encode() + body
              )
              candidates = []
              for part in msg.iter_parts():
                  ctype = part.get_content_type().lower()
                  filename = part.get_filename() or ''
                  payload = part.get_payload(decode=True) or b''
                  if 'javascript' in ctype or filename.lower().endswith(('.js', '.mjs')):
                      candidates.append((filename, ctype, payload))
              if not candidates:
                  raise SystemExit('No JavaScript module found in Worker multipart response')
              preferred = next(
                  (x for x in candidates if x[0] in ('worker.js', 'index.js', 'src/index.js')),
                  candidates[0],
              )
              out.write_bytes(preferred[2])
          else:
              out.write_bytes(body)
          PY

          test -s /tmp/worker-after.js
          cmp --silent apps/studio-api/worker.js /tmp/worker-after.js || {
            echo 'Post-deploy source does not exactly match the extracted Cloudflare Worker module.' >&2
            echo "GitHub:    $(sha256sum apps/studio-api/worker.js | cut -d' ' -f1)" >&2
            echo "Cloudflare: $(sha256sum /tmp/worker-after.js | cut -d' ' -f1)" >&2
            exit 1
          }
          {
            echo '### Studio API Worker production deployment: PASS'
            echo "- Source SHA-256: $(sha256sum apps/studio-api/worker.js | cut -d' ' -f1)"
            echo '- Existing Worker configuration/bindings were not modified by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
