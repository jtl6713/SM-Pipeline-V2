name: Check Studio Worker Syntax
on:
  push:
    branches: [main]
    paths: ['deploy/check-studio-worker-syntax.txt']
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Node syntax check
        run: node --check apps/studio-api/worker.js
