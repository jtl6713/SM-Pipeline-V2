name: Incident 2670 - Scoped producer-only NYC canary
on:
  push:
    branches: [main]
    paths:
      - 'deploy/incident-2670-producer-canary.txt'
permissions:
  contents: read
concurrency:
  group: incident-2670-producer-canary
  cancel-in-progress: false
jobs:
  one-producer-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - name: Verify deployed runner remains in recovery with governor and publisher fence
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 https://pipeline.chicagoshining.com/health -o /tmp/2670-health.json
          jq -e '.ok==true and .recovery_read_only==true and .workload_governor_enabled==true and .recovery_producer_only_enabled==false and .i1_durable_jobs==false and .studio_write_source=="supabase" and .airtable_activity.any_activity==false' /tmp/2670-health.json >/dev/null
          echo "producer_canary_preflight=PASS"
      - name: Stage and restart only runner, then admit one fresh NYC draft
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://ops.chicagoshining.com
          TOKEN=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            test -n "$candidate" || continue
            code=$(curl -sS --max-time 20 -o /tmp/2670-catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/2670-catalog.json >/dev/null 2>&1; then TOKEN="$candidate"; break; fi
          done
          test -n "$TOKEN" || { echo 'ops_auth_unavailable'; exit 1; }
          run_shell() {
            local script="$1" expected="$2"
            SCRIPT_PATH="$script" python - <<'PY'
          import json, os
          from pathlib import Path
          Path("/tmp/2670-shell.json").write_text(json.dumps({"command": Path(os.environ["SCRIPT_PATH"]).read_text(encoding="utf-8"), "confirm": True}))
          PY
            local code job state
            for attempt in $(seq 1 30); do
              code=$(curl -sS --max-time 30 -o /tmp/2670-create.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/2670-shell.json || true)
              if [[ "$code" == 202 ]]; then break; fi
              if [[ "$code" != 409 ]]; then echo "ops_shell_start_failed=$code"; exit 1; fi
              sleep 3
            done
            [[ "$code" == 202 ]] || { echo 'ops_shell_busy_timeout'; exit 1; }
            job=$(jq -r '.job.id // empty' /tmp/2670-create.json)
            test -n "$job"
            for attempt in $(seq 1 80); do
              curl -fsS --max-time 25 -H "Authorization: Bearer $TOKEN" "$BASE/api/jobs/$job" -o /tmp/2670-status.json
              state=$(jq -r '.job.status // empty' /tmp/2670-status.json)
              if [[ "$state" == ok ]]; then
                jq -r '.job.log // ""' /tmp/2670-status.json | grep -E '^((recovery_stage|canary_submission|canary_runner|canary_job_state|canary_circuit|canary_rollback)=)' || true
                jq -e --arg marker "$expected" '.job.log | contains($marker)' /tmp/2670-status.json >/dev/null
                return 0
              fi
              if [[ "$state" == failed ]]; then
                echo 'ops_shell_failed'
                jq -r '.job.log // ""' /tmp/2670-status.json | grep -E 'Exception|Error|throw|FAILED|failed|unexpected|mismatch' | tail -10 || true
                return 1
              fi
              sleep 3
            done
            echo "ops_shell_status_timeout"; return 1
          }
          cat > /tmp/2670-stage.ps1 <<'PS'
          $ErrorActionPreference = 'Stop'
          $envPath = 'D:\Content Creation\ChicagoShining Pipeline\Services\pipeline-runner\service\.env'
          if (-not (Test-Path -LiteralPath $envPath)) { throw 'runner_env_missing' }
          function Get-Value([string]$name) {
            $match = @(Get-Content -LiteralPath $envPath | Where-Object {$_ -match ('^\s*' + [regex]::Escape($name) + '\s*=')}) | Select-Object -Last 1
            if (-not $match) { return '' }
            return ([string]$match -split '=',2)[1].Trim().Trim('"').Trim("'")
          }
          function Is-True([string]$key) { return ((Get-Value $key) -match '^(1|true|yes)$') }
          if (-not (Is-True 'PIPELINE_RUNNER_RECOVERY_READ_ONLY') -or -not (Is-True 'STUDIO_WORKLOAD_GOVERNOR_ENABLED')) {throw 'existing_read_only_or_governor_missing'}
          foreach($key in @('I1_DURABLE_ENABLED','RENDERING_REVIEW_AUTO_DISPATCH_ENABLED','NATIVE_GALLERY_AUTO_EXECUTE_ENABLED','STUDIO_SIDE_EFFECT_OUTBOX_ENABLED')) {
            if (Is-True $key) {throw "background_consumer_enabled_$key"}
          }
          if ([int](Get-Value 'STUDIO_MAX_PRODUCER_JOBS') -ne 1) {throw 'producer_cap_not_one'}
          $dbPath=Get-Value 'STUDIO_GOVERNOR_DB_PATH'
          if (-not $dbPath -or $dbPath -notmatch 'RuntimeData' -or -not (Test-Path -LiteralPath $dbPath)) {throw 'durable_governor_path_invalid'}
          $h=Invoke-RestMethod -Uri 'http://127.0.0.1:3350/health' -TimeoutSec 20
          if (-not $h.ok -or -not $h.recovery_read_only -or -not $h.workload_governor_enabled -or $h.recovery_producer_only_enabled -or $h.i1_durable_jobs -or $h.airtable_activity.any_activity) {throw 'live_recovery_gate_mismatch'}
          $secret=Get-Value 'PIPELINE_RUNNER_SHARED_SECRET'
          if (-not $secret) {throw 'runner_shared_secret_missing'}
          $w=Invoke-RestMethod -Uri 'http://127.0.0.1:3350/admin/workload' -Headers @{'X-Pipeline-Secret'=$secret} -TimeoutSec 20
          if (-not $w.enabled -or -not $w.admission_paused -or $w.active_jobs -ne 0 -or $w.queued_jobs -ne 0 -or $w.paused_jobs -ne 0 -or $w.database_circuit_open -or $w.max_jobs -ne 1) {throw 'governor_preflight_not_quiet'}
          $backup="$envPath.producer-canary-$(Get-Date -Format yyyyMMdd-HHmmss).bak"
          Copy-Item -LiteralPath $envPath -Destination $backup -ErrorAction Stop
          $lines=@(Get-Content -LiteralPath $envPath)
          function Set-EnvValue([string]$key, [string]$value) {
            $found=$false
            $next=New-Object System.Collections.Generic.List[string]
            foreach($line in $script:lines) {
              if ($line -match ('^\s*' + [regex]::Escape($key) + '\s*=')) {
                if(-not $found){$next.Add("$key=$value");$found=$true}
              } else {$next.Add([string]$line)}
            }
            if(-not $found){$next.Add("$key=$value")}
            $script:lines=@($next.ToArray())
          }
          Set-EnvValue 'PIPELINE_RUNNER_RECOVERY_PRODUCER_ONLY' 'true'
          Set-EnvValue 'PIPELINE_RUNNER_RECOVERY_PRODUCER_TARGET' 'recR4EQcshFZ4fNL0'
          [IO.File]::WriteAllLines($envPath, [string[]]$lines, (New-Object System.Text.UTF8Encoding($false)))
          Write-Output 'recovery_stage=exact_nyc_canary_configured_with_backup'
          PS
          run_shell /tmp/2670-stage.ps1 'recovery_stage=exact_nyc_canary_configured_with_backup'
          code=''
          for attempt in $(seq 1 30); do
            code=$(curl -sS --max-time 30 -o /tmp/2670-restart.json -w '%{http_code}' -X POST "$BASE/api/run" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data '{"action":"restart-one","service":"pipeline-runner","confirm":true}' || true)
            if [[ "$code" == 202 ]]; then break; fi
            if [[ "$code" != 409 ]]; then echo "runner_restart_failed_http=$code"; exit 1; fi
            sleep 3
          done
          [[ "$code" == 202 ]] || { echo 'runner_restart_busy_timeout'; exit 1; }
          restart_job=$(jq -r '.job.id // empty' /tmp/2670-restart.json)
          test -n "$restart_job"
          restarted=false
          for attempt in $(seq 1 90); do
            curl -fsS --max-time 25 -H "Authorization: Bearer $TOKEN" "$BASE/api/jobs/$restart_job" -o /tmp/2670-restart-status.json
            state=$(jq -r '.job.status // empty' /tmp/2670-restart-status.json)
            if [[ "$state" == ok ]]; then restarted=true; break; fi
            if [[ "$state" == failed ]]; then echo 'runner_restart_operation_failed'; exit 1; fi
            sleep 3
          done
          [[ "$restarted" == true ]] || { echo 'runner_restart_timeout'; exit 1; }
          echo 'runner_exact_canary_restart=PASS'
          cat > /tmp/2670-admit.ps1 <<'PS'
          $ErrorActionPreference = 'Stop'
          $envPath = 'D:\Content Creation\ChicagoShining Pipeline\Services\pipeline-runner\service\.env'
          function Get-Value([string]$name) {
            $match = @(Get-Content -LiteralPath $envPath | Where-Object {$_ -match ('^\s*' + [regex]::Escape($name) + '\s*=')}) | Select-Object -Last 1
            if (-not $match) {throw "missing_required_env_$name"}
            return ([string]$match -split '=',2)[1].Trim().Trim('"').Trim("'")
          }
          $h=Invoke-RestMethod -Uri 'http://127.0.0.1:3350/health' -TimeoutSec 20
          if (-not $h.ok -or -not $h.recovery_read_only -or -not $h.workload_governor_enabled -or -not $h.recovery_producer_only_enabled -or $h.recovery_producer_scope -ne 'exact_request' -or $h.i1_durable_jobs -or $h.airtable_activity.any_activity) {throw 'post_restart_runner_fence_mismatch'}
          $secret=Get-Value 'PIPELINE_RUNNER_SHARED_SECRET'
          $headers=@{'X-Pipeline-Secret'=$secret}
          $w=Invoke-RestMethod -Uri 'http://127.0.0.1:3350/admin/workload' -Headers $headers -TimeoutSec 20
          if (-not $w.enabled -or $w.admission_paused -or $w.active_jobs -ne 0 -or $w.queued_jobs -ne 0 -or $w.database_circuit_open -or $w.max_jobs -ne 1) {throw 'post_restart_governor_not_idle'}
          $sb=(Get-Value 'SUPABASE_URL').TrimEnd('/')
          $key=Get-Value 'SUPABASE_SERVICE_ROLE_KEY'
          $sbHeaders=@{apikey=$key; Authorization="Bearer $key"}
          $id='recR4EQcshFZ4fNL0'
          $requestRows=@(Invoke-RestMethod -Uri "$sb/rest/v1/production_requests?airtable_record_id=eq.$id&select=id,request_status,production_job,master_asset_status,output_plan_status,variant_status&limit=1" -Headers $sbHeaders -TimeoutSec 20)
          if ($requestRows.Count -ne 1) {throw 'exact_request_missing'}
          $request=$requestRows[0]
          if ($request.request_status -ne 'Draft' -or $request.master_asset_status -ne 'Ready' -or $request.output_plan_status -ne 'Ready' -or $request.variant_status -ne 'Preparing') {throw 'canary_record_state_changed'}
          $linkRows=@(Invoke-RestMethod -Uri "$sb/rest/v1/production_request_outputs?production_request_id=eq.$($request.id)&select=platform_output_id" -Headers $sbHeaders -TimeoutSec 20)
          if ($linkRows.Count -ne 2 -or @($linkRows | Where-Object {$_.platform_output_id}).Count -ne 0) {throw 'canary_has_unexpected_output_identity'}
          $payload=@{production_request_record_id=$id; resume=$false} | ConvertTo-Json -Compress
          $result=Invoke-RestMethod -Uri 'http://127.0.0.1:3350/jobs/studio-produce' -Method POST -Headers $headers -ContentType 'application/json' -Body $payload -TimeoutSec 30
          if (-not $result.ok -or -not $result.accepted -or $result.production_request_record_id -ne $id) {throw 'canary_submission_not_accepted'}
          Write-Output 'canary_submission=accepted'
          Start-Sleep -Seconds 12
          $after=Invoke-RestMethod -Uri 'http://127.0.0.1:3350/admin/workload' -Headers $headers -TimeoutSec 20
          $health=Invoke-RestMethod -Uri 'http://127.0.0.1:3350/health' -TimeoutSec 20
          if ($after.database_circuit_open -or $after.active_jobs -gt 1 -or -not $health.recovery_read_only -or -not $health.recovery_producer_only_enabled) {throw 'canary_governor_or_fence_unhealthy'}
          Write-Output ("canary_runner={0}" -f $health.ok)
          Write-Output ("canary_job_state=active:{0};queued:{1};paused:{2}" -f $after.active_jobs,$after.queued_jobs,$after.paused_jobs)
          Write-Output 'canary_circuit=closed'
          PS
          run_shell /tmp/2670-admit.ps1 'canary_circuit=closed'
          echo 'producer_one_exact_nyc_canary=ACCEPTED; publishing_fence_kept'
