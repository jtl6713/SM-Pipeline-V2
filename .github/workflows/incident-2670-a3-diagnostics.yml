name: Incident 2670 - Read-only A3 runner logs
on:
  push:
    branches: [main]
    paths: ['deploy/incident-2670-a3-diagnostics.txt']
permissions:
  contents: read
jobs:
  read-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - name: Read bounded Windows runner error context through audited Ops API
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ops.chicagoshining.com"
          selected=""
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            [[ -n "$candidate" ]] || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == "200" ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null; then selected="$candidate"; break; fi
          done
          test -n "$selected"
          cat > /tmp/runner-a3-diagnostics.ps1 <<'PS'
          $ErrorActionPreference='Stop'
          $p='D:\Content Creation\ChicagoShining Pipeline\Deployment Logs\Local Services\hidden-pipeline-runner.err.log'
          if (!(Test-Path -LiteralPath $p)) { throw 'runner_log_not_found' }
          $lines=Get-Content -LiteralPath $p -Tail 420
          $found=@($lines | Select-String -Pattern 'a3|classif|Traceback|Exception|ERROR|Supabase|OperationalError|AttributeError|HTTPError' -Context 2,6)
          $safe=@($found | Select-Object -Last 25 | ForEach-Object {
            $_.ToString() -replace '(?i)sk-[a-z0-9_-]{12,}','[REDACTED]' -replace '(?i)Bearer\s+[^\s]+','Bearer [REDACTED]' -replace '(?i)(secret|token|password)[=:]\s*[^\s]{8,}','$1=[REDACTED]'
          })
          Write-Output 'a3_runner_log_found=true'
          $safe | Select-Object -Last 45
          PS
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/runner-a3-diagnostics.json').write_text(json.dumps({'command':Path('/tmp/runner-a3-diagnostics.ps1').read_text(),'confirm':True}),encoding='utf-8')
          PY
          code=$(curl -sS --max-time 20 -o /tmp/jobcreate.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $selected" -H 'Content-Type: application/json' --data-binary @/tmp/runner-a3-diagnostics.json || true)
          [[ "$code" == "202" ]] || { echo "ops_log_http=$code"; exit 1; }
          id=$(jq -r '.job.id // empty' /tmp/jobcreate.json)
          test -n "$id"
          for _ in $(seq 1 40); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $selected" "$BASE/api/jobs/$id" > /tmp/job.json
            state=$(jq -r '.job.status // empty' /tmp/job.json)
            if [[ "$state" == "ok" ]]; then
              jq -r '.job.log // ""' /tmp/job.json | tail -n 65
              jq -e '.job.log | contains("a3_runner_log_found=true")' /tmp/job.json >/dev/null
              exit 0
            fi
            [[ "$state" != "failed" ]] || { echo "diagnostic_failed"; jq -r '.job.log // ""' /tmp/job.json | tail -n 50; exit 1; }
            sleep 2
          done
          echo 'diagnostic_timeout'; exit 1
