name: Audit held Chicago V2 Worker claim 403 without credentials
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chicago-review-worker-claim-403-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Read-only Worker route access probe with no claim body or auth
        shell: bash
        run: |
          set -euo pipefail
          for route in 'https://studio.chicagoshining.com/api/internal/rendering-review/claim-render-job' 'https://api.chicagoshining.com/api/internal/rendering-review/claim-render-job'; do
            host=${route#https://}; host=${host%%/*}
            code=$(curl -sS --max-time 15 --max-redirs 0 -o /tmp/review-route-body -w '%{http_code}' "$route" || true)
            mime=$(file -b --mime-type /tmp/review-route-body 2>/dev/null || true)
            error=$(jq -r '.error // .code // "none"' /tmp/review-route-body 2>/dev/null || echo 'not_json')
            echo "review_claim_route_probe_host=$host http=$code mime=$mime error=$error no_post=true"
          done
      - name: Read-only service token identity probe to protected claim route
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CF_ACCESS_CLIENT_ID" || -z "$CF_ACCESS_CLIENT_SECRET" ]]; then
            echo 'review_claim_access_token_pair_in_actions=absent'
          else
            code=$(curl -sS --max-time 15 --max-redirs 0 -o /tmp/review-service-body -w '%{http_code}' \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              'https://studio.chicagoshining.com/api/internal/rendering-review/claim-render-job' || true)
            mime=$(file -b --mime-type /tmp/review-service-body 2>/dev/null || true)
            error=$(jq -r '.error // .code // "none"' /tmp/review-service-body 2>/dev/null || echo 'not_json')
            echo "review_claim_access_token_pair_in_actions=present http=$code mime=$mime error=$error no_post=true"
          fi
      - name: Inspect only active Worker binding names and five boolean gates
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/chicagoshining-studio-api"
          curl -fsS --max-time 20 "$API/deployments" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/review-deploy.json
          VER=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/review-deploy.json)
          curl -fsS --max-time 20 "$API/versions/$VER" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/review-bindings.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/review-bindings.json').read_text())
          if d.get('success') is not True: raise SystemExit('binding_metadata_unavailable')
          bindings=(d.get('result') or {}).get('resources',{}).get('bindings',[])
          names={b.get('name'):b for b in bindings if isinstance(b,dict)}
          flags=('RENDERING_REVIEW_JOB_CLAIM_ENABLED',
                 'RENDERING_REVIEW_RENDER_OUTBOX_VERIFIED',
                 'RENDERING_REVIEW_INTEGRATION_VERIFIED',
                 'RENDERING_REVIEW_DISPATCH_FENCE_VERIFIED',
                 'RENDERING_REVIEW_MANUAL_ADMISSION_ENABLED')
          out={
           'production_version_metadata_available':True,
           'render_claim_secret_bound':names.get('RENDERING_REVIEW_RENDER_JOB_SHARED_SECRET',{}).get('type') in ('secret_text','secret_text_store','secret'),
           'render_claim_secret_binding_present':'RENDERING_REVIEW_RENDER_JOB_SHARED_SECRET' in names,
           'flags':{k:('true' if names.get(k,{}).get('type')=='plain_text' and names[k].get('text')=='true'
                       else 'false_or_unset') for k in flags},
          }
          print('review_claim_403_audit='+json.dumps(out,sort_keys=True))
          PY
          rm -f /tmp/review-bindings.json /tmp/review-deploy.json
