name: Audit held Chicago V2 Worker claim 403 without credentials
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chicago-review-worker-claim-403-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect only active Worker binding names and five boolean gates
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/chicagoshining-studio-api"
          curl -fsS --max-time 20 "$API/deployments" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/review-deploy.json
          VER=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/review-deploy.json)
          curl -fsS --max-time 20 "$API/versions/$VER" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/review-bindings.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/review-bindings.json').read_text())
          if d.get('success') is not True: raise SystemExit('binding_metadata_unavailable')
          bindings=(d.get('result') or {}).get('resources',{}).get('bindings',[])
          names={b.get('name'):b for b in bindings if isinstance(b,dict)}
          flags=('RENDERING_REVIEW_JOB_CLAIM_ENABLED',
                 'RENDERING_REVIEW_RENDER_OUTBOX_VERIFIED',
                 'RENDERING_REVIEW_INTEGRATION_VERIFIED',
                 'RENDERING_REVIEW_DISPATCH_FENCE_VERIFIED',
                 'RENDERING_REVIEW_MANUAL_ADMISSION_ENABLED')
          out={
           'production_version_metadata_available':True,
           'render_claim_secret_bound':names.get('RENDERING_REVIEW_RENDER_JOB_SHARED_SECRET',{}).get('type') in ('secret_text','secret_text_store','secret'),
           'render_claim_secret_binding_present':'RENDERING_REVIEW_RENDER_JOB_SHARED_SECRET' in names,
           'flags':{k:('true' if names.get(k,{}).get('type')=='plain_text' and names[k].get('text')=='true'
                       else 'false_or_unset') for k in flags},
          }
          print('review_claim_403_audit='+json.dumps(out,sort_keys=True))
          PY
          rm -f /tmp/review-bindings.json /tmp/review-deploy.json
