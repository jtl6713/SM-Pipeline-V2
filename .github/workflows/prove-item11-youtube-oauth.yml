name: Prove Item 11 YouTube OAuth Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/prove-item11-youtube-oauth.txt'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Refresh YouTube OAuth and read private Output 151 without uploading
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m py_compile repair/scripts/prove-item11-youtube-oauth.py
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:CLOUDFLARE_API_TOKEN \
            -in deploy/credential-envelope/private.pem.enc \
            -out /tmp/key.pem
          base64 -d deploy/credential-envelope/airtable_pat.ciphertext.b64 >/tmp/pat.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/key.pem \
            -in /tmp/pat.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out /tmp/pat.txt
          export AIRTABLE_PAT="$(tr -d '\r\n' </tmp/pat.txt)"
          export ITEM11_EVIDENCE="/tmp/item11-oauth-proof.json"
          python repair/scripts/prove-item11-youtube-oauth.py
          jq -e '.passed == true and .upload_attempted == false and .yt_orch_active == false and .make_scenario_runs == 0' \
            /tmp/item11-oauth-proof.json >/dev/null

      - name: Upload sanitized Item 11 OAuth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item11-youtube-oauth-${{ github.run_id }}
          path: /tmp/item11-oauth-proof.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Destroy transient credentials
        if: always()
        run: rm -f /tmp/key.pem /tmp/pat.enc /tmp/pat.txt /tmp/item11-oauth-proof.json
