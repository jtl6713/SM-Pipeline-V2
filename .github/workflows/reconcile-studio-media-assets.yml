name: Reconcile Studio Media Assets
# Pages the full Media Assets table into Supabase. Inserts missing named rows.
# Does not overwrite an existing row and does not turn off Airtable asset reads.
# Requires an explicit Trigger line in deploy/reconcile-studio-media-assets.txt.
on:
  push:
    branches: [main]
    paths:
      - "deploy/reconcile-studio-media-assets.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chicagoshining-studio-api-media-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      VERIFY_BRIDGE: chicagoshining-media-reconcile
    steps:
      - uses: actions/checkout@v4
      - name: Page Media Assets into Supabase through service binding
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if ! grep -q 'Trigger reconcile STUDIO_ASSETS media_only media_reconcile now' deploy/reconcile-studio-media-assets.txt; then
            echo "media_reconcile_skipped=NO_TRIGGER"
            exit 0
          fi
          umask 077
          TOKEN=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )
          cat >/tmp/verify-worker.js <<EOF
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== "/$TOKEN") return new Response("Not found", {status:404});
              const mode = url.searchParams.get("mode") || "sync";
              if (mode === "health") {
                const health = await env.STUDIO_API.fetch(new Request("https://studio.chicagoshining.com/api/health", {
                  headers: {
                    "Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com",
                    "Origin":"https://studio.chicagoshining.com",
                    "Accept":"application/json"
                  }
                }));
                return new Response(await health.text(), {status:health.status,headers:{"Content-Type":"application/json","Cache-Control":"no-store"}});
              }
              const internal = new Request("https://studio.chicagoshining.com/api/ops/supabase/sync", {
                method: "POST",
                headers: {
                  "Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com",
                  "Origin":"https://studio.chicagoshining.com",
                  "Accept":"application/json",
                  "Content-Type":"application/json"
                },
                body: JSON.stringify({
                  media_only: true,
                  media_reconcile: true,
                  media_offset: url.searchParams.get("offset") || ""
                })
              });
              const response = await env.STUDIO_API.fetch(internal);
              return new Response(await response.text(), {status:response.status,headers:{"Content-Type":"application/json","Cache-Control":"no-store"}});
            }
          };
          EOF
          cat >/tmp/verify-metadata.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF
          node --check /tmp/verify-worker.js
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$API_ROOT/workers/scripts/$VERIFY_BRIDGE" -H "$AUTH" >/dev/null || true
          code=$(curl -sS -o /tmp/verify-upload.json -w '%{http_code}' -X PUT "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/content" -H "$AUTH" \
            -F 'metadata=@/tmp/verify-metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/verify-worker.js;type=application/javascript+module;filename=worker.js')
          test "$code" -ge 200 -a "$code" -lt 300
          curl -fsS -X POST "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/subdomain" -H "$AUTH" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' >/tmp/verify-subdomain.json
          curl -fsS "$API_ROOT/workers/subdomain" -H "$AUTH" -o /tmp/account-subdomain.json
          SUBDOMAIN=$(jq -er '.result.subdomain' /tmp/account-subdomain.json)
          URL="https://$VERIFY_BRIDGE.$SUBDOMAIN.workers.dev/$TOKEN"
          READY=0
          for i in $(seq 1 90); do
            CODE=$(curl -sS --max-time 45 -o /tmp/health.json -w '%{http_code}' "$URL?mode=health" || true)
            if [[ "$CODE" == "200" ]] && jq -e '.ok==true and ((.version|tostring|contains("0.10.827-media-asset-reconcile")) or (.studio_supabase_media_reconcile_v1==true))' /tmp/health.json >/dev/null 2>&1; then
              READY=1
              break
            fi
            echo "waiting for Worker 0.10.827 media reconcile (try $i code=$CODE version=$(jq -r '.version // empty' /tmp/health.json 2>/dev/null || true))"
            sleep 8
          done
          test "$READY" = "1"
          echo "worker_ready=$(jq -r '.version' /tmp/health.json)"
          OFFSET=""
          DONE=false
          INSERTED=0
          SCANNED=0
          for i in $(seq 1 400); do
            if [[ -n "$OFFSET" ]]; then
              CODE=$(curl -sS --max-time 180 -G --data-urlencode "mode=sync" --data-urlencode "offset=$OFFSET" -o /tmp/sync.json -w '%{http_code}' "$URL" || true)
            else
              CODE=$(curl -sS --max-time 180 -G --data-urlencode "mode=sync" -o /tmp/sync.json -w '%{http_code}' "$URL" || true)
            fi
            echo "sync_http_page_$i=$CODE"
            if [[ "$CODE" != "200" ]] || ! jq -e '.sync.media_assets.ok==true and .sync.media_assets.mode=="reconcile"' /tmp/sync.json >/dev/null 2>&1; then
              echo "sync_summary=$(jq -c '{ok, status:(.sync.status // null), media:(.sync.media_assets // null), error:(.sync.error // .error // null)}' /tmp/sync.json 2>/dev/null || true)"
              sleep 15
              continue
            fi
            PAGE_INSERTED=$(jq -r '.sync.media_assets.media_assets // 0' /tmp/sync.json)
            PAGE_SCANNED=$(jq -r '.sync.media_assets.scanned // 0' /tmp/sync.json)
            DONE=$(jq -r '.sync.media_assets.done // false' /tmp/sync.json)
            INSERTED=$((INSERTED + PAGE_INSERTED))
            SCANNED=$((SCANNED + PAGE_SCANNED))
            echo "media_reconcile_page=$i scanned_page=$PAGE_SCANNED inserted_page=$PAGE_INSERTED done=$DONE"
            if [[ "$DONE" == "true" ]]; then
              break
            fi
            OFFSET=$(jq -r '.sync.media_assets.offset // empty' /tmp/sync.json)
            if [[ -z "$OFFSET" ]]; then
              echo "media_reconcile_missing_offset=FAIL"
              exit 1
            fi
          done
          test "$DONE" = "true"
          echo "media_asset_reconcile=PASS scanned=$SCANNED inserted=$INSERTED"
          curl -sS -X DELETE "$API_ROOT/workers/scripts/$VERIFY_BRIDGE" -H "$AUTH" >/dev/null || true
