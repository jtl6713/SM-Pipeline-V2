name: Put Studio API ElevenLabs Secret

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chicagoshining-studio-api-production
  cancel-in-progress: false

jobs:
  put:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      TARGET_WORKER: chicagoshining-studio-api
    steps:
      - name: Put ELEVENLABS_API_KEY on the live Worker
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ELEVENLABS_API_KEY"
          export API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          payload = json.dumps({
              "name": "ELEVENLABS_API_KEY",
              "text": os.environ["ELEVENLABS_API_KEY"],
              "type": "secret_text",
          }).encode()
          req = urllib.request.Request(
              os.environ["API"] + "/secrets",
              data=payload,
              method="PUT",
              headers={
                  "Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"],
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  body = json.loads(response.read().decode())
          except urllib.error.HTTPError as error:
              raise SystemExit(f"Cloudflare secret put HTTP {error.code}")
          result = body.get("result") or {}
          if body.get("success") is not True or result.get("name") != "ELEVENLABS_API_KEY" or result.get("type") != "secret_text":
              raise SystemExit("Cloudflare secret put did not confirm ELEVENLABS_API_KEY")
          print("secret_put=PASS")
          PY
          curl -fsS "$API/secrets" -H "$AUTH" -o /tmp/secret-list.json
          curl -fsS "$API/deployments" -H "$AUTH" -o /tmp/deployments.json
          ACTIVE=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/deployments.json)
          curl -fsS "$API/versions/$ACTIVE" -H "$AUTH" -o /tmp/active-version.json
          python - <<'PY'
          import json, sys
          from pathlib import Path
          listed = json.loads(Path("/tmp/secret-list.json").read_text())
          names = sorted(str(x.get("name") or "") for x in (listed.get("result") or []) if x.get("name"))
          if "AIRTABLE_PAT" not in names or "ELEVENLABS_API_KEY" not in names:
              raise SystemExit(f"secret name list missing required names: {names}")
          active = json.loads(Path("/tmp/active-version.json").read_text()).get("result") or {}
          bindings = (active.get("resources") or {}).get("bindings") or []
          got = {str(b.get("name") or ""): str(b.get("type") or "") for b in bindings}
          if got.get("ELEVENLABS_API_KEY") != "secret_text":
              raise SystemExit("active version missing ELEVENLABS_API_KEY secret_text")
          if got.get("AIRTABLE_PAT") != "secret_text" or got.get("STUDIO_MEDIA") != "r2_bucket":
              raise SystemExit("core bindings drifted while putting ElevenLabs secret")
          out = {
              "worker": "chicagoshining-studio-api",
              "active_version_id": active.get("id"),
              "version_number": active.get("number"),
              "secret_names": names,
              "elevenlabs_present": True,
              "binding_count": len(got),
              "bindings": [{"name": k, "type": v} for k, v in sorted(got.items())],
          }
          Path("/tmp/elevenlabs-secret-put-sanitized.json").write_text(json.dumps(out, indent=2, sort_keys=True))
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elevenlabs-secret-put-${{ github.run_id }}
          path: /tmp/elevenlabs-secret-put-sanitized.json
          if-no-files-found: ignore
          retention-days: 30
