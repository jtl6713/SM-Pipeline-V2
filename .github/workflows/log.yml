name: Log Commit

on:
  push:
    branches: ["main"]

jobs:
  log:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
      - run: npm install ./ai-activity-logger
      - run: node scripts/log_activity.js "GitHub commit: ${{ github.sha }}"
        env:
          AI_ACTIVITY_AGENT_ID: "13"
          AI_ACTIVITY_TASK_ID: "1"
