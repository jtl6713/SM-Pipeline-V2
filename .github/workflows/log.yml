name: Log Commit

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install ./ai-activity-logger
      - run: node scripts/log_activity.js "GitHub commit: ${{ github.sha }}"
        env:
          AI_ACTIVITY_AGENT_ID: "13"
          AI_ACTIVITY_TASK_ID: "1"
