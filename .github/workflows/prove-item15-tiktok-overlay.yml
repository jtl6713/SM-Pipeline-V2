name: Prove Item 15 TikTok Per-Photo Overlay Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/prove-item15-tiktok-overlay.txt'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6

      - name: Assert TikTok overlay contract, timing, safe area, and idempotency
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/tiktok-overlay/contract.test.mjs
          python -m py_compile repair/scripts/prove-item15-tiktok-overlay.py
          export ITEM15_EVIDENCE="/tmp/item15-tiktok-overlay-proof.json"
          python repair/scripts/prove-item15-tiktok-overlay.py
          jq -e '.passed == true and .make_scenario_runs == 0 and .tiktok_drafts_created == 0 and .ttd_orch_pulsed == false and .recipe == "tiktok-title-overlay-v1" and .safe_area.top == 285' \
            /tmp/item15-tiktok-overlay-proof.json >/dev/null

      - name: Upload Item 15 overlay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item15-tiktok-overlay-${{ github.run_id }}
          path: /tmp/item15-tiktok-overlay-proof.json
          if-no-files-found: ignore
          retention-days: 30
