tinct new staged URL/name, both old and new R2 versions reachable;\n  - the workflow stopped before the deliberate failure phase only because the Make organization rate limit returned HTTP 429. Evidence: https://github.com/jtl6713/SM-Pipeline-V2/actions/runs/31966191634\n- Final isolated one-run failure proof after rate-window cooldown: deliberate invalid `Final_File_ID` reached terminal `ERROR`; prior revised `Publish_Asset_URL`, `Publish_Asset_File_Name`, and ready timestamp remained unchanged and reachable; AP0 ended OFF; publisher orchestrators were OFF before and after; 17 control operations. Evidence: https://github.com/jtl6713/SM-Pipeline-V2/actions/runs/31966308015\n- Disposable Airtable Output 157 and its copied Drive master were deleted after proof.\n- Two versioned R2 proof objects are intentionally retained for Item 12 lifecycle/cleanup evidence because no unverified deletion path was used.\n\n### Safety accounting for AP0 behavioral proof\n\n| Measure | Actual |\n| --- | ---: |\n| Production Platform Output mutations | 0 |\n| Disposable Platform Output records | 1 created / 1 deleted |\n| Disposable Drive copies | 1 created / 1 deleted |\n| AP0 successful baseline/full staging executions | 2 |\n| AP0 unchanged no-op executions | 1 |\n| AP0 deliberate failed-revision executions | 1 |\n| Platform publishing orchestrator executions | 0 |\n| Platform posts/drafts/videos created | 0 |\n| Versioned R2 proof objects retained | 2 |\n\n**Gate remains:** Items 1–5 are not all closed because renderer transitions (Item 3) and genuine hard Test Mode (Item 5) remain open. Do not begin Item 6 or broad E2E acceptance yet.\n'''
