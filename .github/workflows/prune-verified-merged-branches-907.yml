name: P0 907 Prune Verified Merged-Only Branches

on:
  push:
    branches: [main]
    paths: ['deploy/branch-prune-907.txt']
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - name: Remove only exact-known no-ahead branches with no open PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          headers={"Authorization": "Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}
          allowed=["diagnostic/miami-factory-batch-stall-readonly","feat/factory-approval-stage-latency","feat/factory-approval-stage-timing","feat/home-overview-force-refresh","feature/factory-batch-approval-20261016","feature/factory-batch-multi-reel-v2","feature/visual-timeline-phase1-rebase-20261017","feature/visual-voiceover-final-20261017","feature/visual-voiceover-final-current-20261017","fix/atomic-mae-rollout-readiness","fix/factory-all-platforms-rollout-migration-20261017","fix/factory-cloudflare-keepvars-contract-v2-20261017","fix/live-canary-report-http-errors","perf/factory-parallel-lanes-v1","verify/visual-rerender-concurrency-ci-20261017","verify/visual-voiceover-ci-20261017","verify/visual-voiceover-ci-concurrency-final-20261017","verify/visual-voiceover-ci-final-20261017","ops/vizcaya-photo-acceptance-20261019"]
          expected_legacy="ffba5d372ee5af0124a97cf4b4612a0993cf5448"
          expected_ops="3cc86fdc1e3eb517325d014eb1f98d08d80397a7"
          def api(path, method="GET"):
              request=urllib.request.Request("https://api.github.com/repos/"+repo+"/"+path,headers=headers,method=method)
              with urllib.request.urlopen(request, timeout=30) as r:
                  data=r.read().decode()
                  return json.loads(data) if data.strip() else {}
          open_prs=api("pulls?state=open&per_page=100")
          open_heads={pr["head"]["ref"] for pr in open_prs if pr["head"]["repo"] and pr["head"]["repo"]["full_name"]==repo}
          deleted=[]
          skipped=[]
          for branch in allowed:
              if branch in open_heads:
                  skipped.append((branch,"open_pr")); continue
              q=urllib.parse.quote(branch,safe="/")
              try:
                  current=api("branches/"+q)
              except urllib.error.HTTPError as e:
                  if e.code==404:
                      skipped.append((branch,"already_absent")); continue
                  raise
              sha=current["commit"]["sha"]
              expected=expected_ops if branch.startswith("ops/") else expected_legacy
              if sha!=expected or current.get("protected"):
                  skipped.append((branch,"head_changed_or_protected")); continue
              compare=api("compare/main..."+q)
              if compare["ahead_by"]!=0:
                  skipped.append((branch,"contains_unmerged_commits")); continue
              # Final lease/recheck so a recent push is never deleted based on old inspection.
              again=api("branches/"+q)
              if again["commit"]["sha"]!=expected or again.get("protected"):
                  skipped.append((branch,"concurrent_branch_change")); continue
              api("git/refs/heads/"+q,method="DELETE")
              deleted.append(branch)
          print("deleted_count="+str(len(deleted)))
          for branch in deleted: print("deleted="+branch)
          for branch,reason in skipped: print("kept="+branch+" reason="+reason)
          # Any API/permission failure exits nonzero and is visible in the Action logs.
          
          PY
