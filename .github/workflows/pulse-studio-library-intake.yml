name: Pulse Studio Library Intake

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chicagoshining-pulse-studio-library-intake
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      BRIDGE_WORKER: chicagoshining-e2e-intake-bridge
      BRIDGE_RETRY_MAX: "12"
      BRIDGE_RETRY_SLEEP_S: "3"
    steps:
      - uses: actions/checkout@v6

      - name: Capture production version
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/before.json
          jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/before.json >/tmp/active-before.txt

      - name: Build and upload one-time service bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, secrets
          from pathlib import Path
          token = secrets.token_urlsafe(36)
          Path("/tmp/token").write_text(token)
          specs = [{"name": "library-intake", "method": "POST", "path": "/api/operations/intake", "body": {}}]
          js = '''export default {async fetch(request,env){const u=new URL(request.url);if(u.pathname===ROUTE+"/ready")return Response.json({ok:true,ready:true},{headers:{"Cache-Control":"no-store"}});if(u.pathname!==ROUTE)return new Response("Not found",{status:404});const specs=SPECS,results=[];for(const s of specs){const m=String(s.method||"GET").toUpperCase(),h=new Headers({"Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com","Accept":"application/json","Origin":"https://studio.chicagoshining.com","Content-Type":"application/json"});const r=await env.STUDIO_API.fetch(new Request("https://studio.chicagoshining.com"+s.path,{method:m,headers:h,body:JSON.stringify(s.body??{})}));const t=await r.text();let p;try{p=t?JSON.parse(t):null}catch{p={raw:t.slice(0,4000)}}results.push({name:s.name||s.path,path:s.path,method:m,status:r.status,ok:r.ok,triggered:p&&p.triggered,body:p});}return Response.json({ok:results.every(x=>x.ok),results},{headers:{"Cache-Control":"no-store"}})}};'''
          js = js.replace("ROUTE", json.dumps("/" + token)).replace("SPECS", json.dumps(specs, separators=(",", ":")))
          Path("/tmp/worker.js").write_text(js)
          PY
          node --check /tmp/worker.js
          printf '%s' '{"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"chicagoshining-studio-api"}]}' >/tmp/meta.json
          curl -sS -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null || true
          code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER/content" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata=@/tmp/meta.json;type=application/json' \
            -F 'worker.js=@/tmp/worker.js;type=application/javascript+module;filename=worker.js')
          test "$code" -ge 200 -a "$code" -lt 300 && jq -e '.success==true' /tmp/upload.json >/dev/null
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' -o /tmp/sub.json
          jq -e '.success==true and .result.enabled==true' /tmp/sub.json >/dev/null
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/account-sub.json
          jq -er '.result.subdomain' /tmp/account-sub.json >/tmp/subdomain

      - name: Wait for bridge and pulse intake
        shell: bash
        run: |
          set -euo pipefail
          URL="https://$BRIDGE_WORKER.$(cat /tmp/subdomain).workers.dev/$(cat /tmp/token)"
          ready=000
          for i in $(seq 1 "$BRIDGE_RETRY_MAX"); do
            ready=$(curl -sS --max-time 20 -o /tmp/ready.json -w '%{http_code}' "$URL/ready" || true)
            echo "bridge_ready_attempt=$i/$BRIDGE_RETRY_MAX http=$ready"
            [[ "$ready" == "200" ]] && break
            if [[ "$i" -eq "$BRIDGE_RETRY_MAX" ]]; then
              echo "bridge gave up after ${BRIDGE_RETRY_MAX} attempts last_http=$ready"
              exit 1
            fi
            sleep "$BRIDGE_RETRY_SLEEP_S"
          done
          code=$(curl -sS --max-time 120 -o /tmp/result.json -w '%{http_code}' "$URL" || true)
          echo "bridge_http=$code"
          test "$code" -eq 200
          jq '{ok,results:[.results[]|{name,path,method,status,ok,triggered}]}' /tmp/result.json
          jq -e '.ok==true and .results[0].triggered=="a2-python" and .results[0].status!=409' /tmp/result.json >/dev/null

      - name: Delete temporary bridge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/delete.json || true

      - name: Verify production unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(cat /tmp/active-before.txt)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/after.json
          AFTER=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/after.json)
          echo "production_unchanged=$([[ "$BEFORE" == "$AFTER" ]] && echo true || echo false)"
          test "$BEFORE" = "$AFTER"
