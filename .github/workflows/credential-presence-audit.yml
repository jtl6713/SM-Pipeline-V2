name: Audit Deployment Credential Presence

on:
  push:
    branches: [main]
    paths:
      - 'deploy/credential-presence-audit.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Report presence only
        env:
          AIRTABLE_PAT_CANDIDATE: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_TOKEN_CANDIDATE: ${{ secrets.AIRTABLE_TOKEN }}
          ELEVENLABS_API_KEY_CANDIDATE: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_KEY_CANDIDATE: ${{ secrets.ELEVENLABS_KEY }}
          CF_TOKEN_CANDIDATE: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_CANDIDATE: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          names=[
            'AIRTABLE_PAT_CANDIDATE','AIRTABLE_TOKEN_CANDIDATE',
            'ELEVENLABS_API_KEY_CANDIDATE','ELEVENLABS_KEY_CANDIDATE',
            'CF_TOKEN_CANDIDATE','CF_ACCOUNT_CANDIDATE'
          ]
          out={n:bool(os.environ.get(n,'')) for n in names}
          print(json.dumps(out,sort_keys=True))
          PY
