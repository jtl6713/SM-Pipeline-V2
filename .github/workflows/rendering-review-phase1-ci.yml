name: Rendering Review Phase 1 Storage & Gate CI

on:
  pull_request:
    paths:
      - 'apps/studio-api/rendering-review-airtable-contract.*'
      - 'apps/studio-api/rendering-review-policy.*'
      - 'apps/studio-api/rendering-review-held-redo.*'
      - 'apps/studio-api/rendering-review-factory-handoff.*'
      - 'apps/studio-api/rendering-review-factory-gate.*'
      - 'apps/studio-api/rendering-review-factory-preview.*'
      - 'apps/studio-api/michigan-review-preview-cache.*'
      - 'apps/studio-api/creative-master-registry.*'
      - 'apps/studio-api/creative-master-propagation.*'
      - 'apps/studio-api/creative-master-factory-guard.*'
      - 'apps/studio-api/worker-functions-04.mjs'
      - 'apps/studio-api/rendering-review-workspace.*'
      - 'apps/studio-web/rendering-review-queue.test.mjs'
      - 'apps/studio-api/worker.js'
      - '.github/workflows/rendering-review-phase1-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-storage-and-dispatch-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate parser
        run: |
          node --check apps/studio-api/rendering-review-airtable-contract.mjs
          node --check apps/studio-api/rendering-review-airtable-contract.test.mjs
          node --check apps/studio-api/rendering-review-held-redo.mjs
          node --check apps/studio-api/rendering-review-held-redo.test.mjs
          node --check apps/studio-api/rendering-review-factory-handoff.mjs
          node --check apps/studio-api/rendering-review-factory-gate.mjs
          node --check apps/studio-api/rendering-review-factory-gate.test.mjs
          node --check apps/studio-api/rendering-review-factory-preview.mjs
          node --check apps/studio-api/michigan-review-preview-cache.mjs
          node --check apps/studio-api/creative-master-registry.mjs
          node --check apps/studio-api/creative-master-propagation.mjs
          node --check apps/studio-api/creative-master-factory-guard.mjs
          node --check apps/studio-api/rendering-review-workspace.mjs
          node --check apps/studio-api/worker.js
      - name: Isolated storage and dispatch guard contracts
        run: node --test apps/studio-api/rendering-review-held-redo.test.mjs apps/studio-api/rendering-review-airtable-contract.test.mjs apps/studio-api/rendering-review-policy.test.mjs apps/studio-api/rendering-review-coordinator.test.mjs apps/studio-api/rendering-review-factory-handoff.test.mjs apps/studio-api/rendering-review-factory-gate.test.mjs apps/studio-api/rendering-review-factory-preview.test.mjs apps/studio-api/michigan-review-preview-cache.test.mjs apps/studio-api/rendering-review-approval-http.test.mjs apps/studio-api/creative-master-registry.test.mjs apps/studio-api/creative-master-propagation.test.mjs apps/studio-api/creative-master-factory-guard.test.mjs apps/studio-api/rendering-review-workspace.test.mjs apps/studio-web/rendering-review-queue.test.mjs
