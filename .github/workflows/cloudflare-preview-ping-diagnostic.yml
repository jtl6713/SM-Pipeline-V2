name: Cloudflare Preview Ping Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-preview-ping-diagnostic.yml'
      - 'deploy/cloudflare-preview-ping-diagnostic.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: chicagoshining-studio-api
      PREVIEW_ALIAS: e2e-ping
    steps:
      - uses: actions/checkout@v6

      - name: Capture current active Worker source and runtime
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/extract_worker.py <<'PY'
          import re,sys
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          hp,bp,op=sys.argv[1:4]
          headers=Path(hp).read_text(encoding='latin-1',errors='replace'); body=Path(bp).read_bytes()
          ms=re.findall(r'(?im)^content-type:\s*([^\r\n]+)',headers); ct=ms[-1].strip() if ms else ''
          if 'multipart/' not in ct.lower(): Path(op).write_bytes(body); raise SystemExit(0)
          msg=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode('latin-1')+body)
          for part in msg.walk():
              if not part.is_multipart() and (part.get_filename()=='worker.js' or part.get_param('name',header='content-disposition')=='worker.js'):
                  Path(op).write_bytes(part.get_payload(decode=True)); break
          else: raise SystemExit('worker.js not found')
          PY
          curl -fsS -D /tmp/live.headers \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/content/v2" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/live.multipart
          python /tmp/extract_worker.py /tmp/live.headers /tmp/live.multipart /tmp/live.js
          node --check /tmp/live.js
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/deployments.json
          ACTIVE_VERSION=$(jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id' /tmp/deployments.json)
          echo "$ACTIVE_VERSION" >/tmp/active-version.txt
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/versions/$ACTIVE_VERSION" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/version.json
          jq -e '.success==true' /tmp/version.json >/dev/null
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/subdomain.json
          jq -er '.result.subdomain' /tmp/subdomain.json >/tmp/subdomain.txt

      - name: Build one-time no-subrequest preview Worker
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(24))
          PY
          )
          printf '%s' "$TOKEN" >/tmp/path-token.txt
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('/tmp/live.js').read_text(encoding='utf-8')
          token=Path('/tmp/path-token.txt').read_text()
          marker='      const url = new URL(request.url);\n'
          if marker not in src: raise SystemExit('URL marker not found')
          route='/__github_e2e_preview_ping_'+token
          injected=f'''      const url = new URL(request.url);\n      if (url.pathname === {json.dumps(route)}) {{\n        return new Response(JSON.stringify({{ok:true,kind:"inactive-version-preview-ping"}}), {{status:200,headers:{{"Content-Type":"application/json","Cache-Control":"no-store"}}}});\n      }}\n'''
          Path('/tmp/preview.js').write_text(src.replace(marker,injected,1),encoding='utf-8')
          PY
          node --check /tmp/preview.js

      - name: Upload inactive preview version with alias
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_VERSION=$(cat /tmp/active-version.txt)
          jq --arg alias "$PREVIEW_ALIAS" --arg version "$ACTIVE_VERSION" '
            .result.resources.script_runtime as $rt |
            {main_module:"worker.js", annotations:{"workers/alias":$alias,"workers/message":"ChicagoShining E2E inactive preview ping diagnostic"}}
            + (if $rt.compatibility_date then {compatibility_date:$rt.compatibility_date} else {} end)
            + {compatibility_flags:($rt.compatibility_flags // [])}
          ' /tmp/version.json >/tmp/metadata.json
          code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/versions" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata=@/tmp/metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/preview.js;type=application/javascript+module;filename=worker.js')
          echo "upload_http=$code"
          if [[ "$code" -lt 200 || "$code" -ge 300 ]]; then jq '{success,errors,messages}' /tmp/upload.json >&2 || cat /tmp/upload.json >&2; exit 1; fi
          jq -e '.success==true' /tmp/upload.json >/dev/null
          jq '{success,result:{id:.result.id,number:.result.number,metadata:{hasPreview:.result.metadata.hasPreview}}}' /tmp/upload.json

      - name: Invoke inactive preview alias
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN=$(cat /tmp/subdomain.txt)
          TOKEN=$(cat /tmp/path-token.txt)
          URL="https://$PREVIEW_ALIAS-$WORKER_NAME.$SUBDOMAIN.workers.dev/__github_e2e_preview_ping_$TOKEN"
          code=$(curl -sS --retry 3 --retry-delay 2 -o /tmp/result.txt -w '%{http_code}' "$URL")
          echo "preview_http=$code"
          cat /tmp/result.txt
          test "$code" -eq 200
          jq -e '.ok==true and .kind=="inactive-version-preview-ping"' /tmp/result.txt >/dev/null

      - name: Verify active deployment unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(cat /tmp/active-version.txt)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/deployments-after.json
          AFTER=$(jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id' /tmp/deployments-after.json)
          echo "active_unchanged=$([[ "$BEFORE" == "$AFTER" ]] && echo true || echo false)"
          test "$BEFORE" = "$AFTER"
