name: Issue 2888 protected post-deploy Factory preview verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue2888-protected-service-binding-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: issue2888-protected-service-binding-preview
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      DEPLOY_RUN: '45307630884'
      VERIFY_BRIDGE: chicagoshining-2888-verify-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - name: Require successful exact production Worker release
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOY_RUN" -o /tmp/deploy-run.json
            jq -e '.head_sha=="64ff2e443952ad7700b5189f3f1a68b0b5d02dc3" and .name=="Deploy Studio API Worker Production"' /tmp/deploy-run.json >/dev/null
            if [[ "$(jq -r .status /tmp/deploy-run.json)" == completed ]]; then
              jq -e '.conclusion=="success"' /tmp/deploy-run.json >/dev/null
              echo issue2888_exact_production_release=PASS
              exit 0
            fi
            sleep 8
          done
          echo '::error::Production release did not reach successful completion'
          exit 1
      - name: Create exact-scope temporary diagnostic bridge
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          python - <<'PY'
          import json,re,secrets,time
          from pathlib import Path
          # Reuse the established production deployment's trusted service-binding
          # verification identity; never grant Cloudflare Access service tokens a role.
          deployment=Path('.github/workflows/deploy-cloudflare-worker-production.yml').read_text()
          m=re.search(r'"Cf-Access-Authenticated-User-Email":"([^"]+)"',deployment)
          assert m and '@' in m.group(1)
          token=secrets.token_urlsafe(40)
          Path('/tmp/2888-token').write_text(token)
          source=r"""
          const TOKEN=__TOKEN__;
          const EXPIRES=__EXPIRES__;
          const REVIEW_USER=__REVIEW_USER__;
          const exact=new Map([
            ["rec1PDreUDoe2AcPV",17892121],["rec1kjgusW1fX9BOp",17892121],
            ["recidhGcJSfOlxMsc",17892121],["recaV78on0RSfqb31",2194946],
            ["recgeicEbdlbmQiv5",2194946],["recy1CzV4MJQycBMq",2194946],
            ["recfwDzGh6St6WB9f",895259],
          ]);
          const known=/^FACTORY_2618_[A-Z0-9_]+$/;
          const response=(data)=>Response.json(data,{headers:{"Cache-Control":"private, no-store"}});
          async function check(env,id,size,start,first){
            const end=start+63;
            const req=new Request("https://studio.chicagoshining.com/api/factory/outputs/"+id+"/preview",{
              method:"GET",headers:{"Cf-Access-Authenticated-User-Email":REVIEW_USER,
                "Origin":"https://studio.chicagoshining.com","Accept":"video/mp4","Range":"bytes="+start+"-"+end},
            });
            let res;
            try{res=await env.STUDIO_API.fetch(req);}catch{return {ok:false,status:0,reason:"SERVICE_BINDING_REQUEST_FAILED"};}
            const type=(res.headers.get("Content-Type")||"").split(";")[0].trim();
            const range=res.headers.get("Content-Range")||"";
            const source=res.headers.get("X-Studio-Preview-Source")||"";
            const length=Number(res.headers.get("Content-Length")||0);
            if(res.status!==206||type!=="video/mp4"||range!=="bytes "+start+"-"+end+"/"+size||
              source!=="issue2618-verified-private-r2"||length!==64){
              let reason="UNEXPECTED_PREVIEW_RESPONSE";
              if(type==="application/json"&&res.status>=400){
                try{
                  const data=await res.json();
                  if(known.test(String(data?.error||"")))reason=data.error;
                  else if(res.status===401||res.status===403)reason="STUDIO_AUTH_REJECTED";
                }catch{}
              }else{try{await res.body?.cancel();}catch{}}
              return {ok:false,status:res.status,reason};
            }
            const bytes=new Uint8Array(await res.arrayBuffer());
            const ftyp=first?String.fromCharCode(...bytes.slice(4,8))==="ftyp":true;
            return {ok:bytes.length===64&&ftyp,status:res.status,reason:bytes.length!==64?"INVALID_RANGE_LENGTH":!ftyp?"MP4_HEADER_NOT_FTYP":"VERIFIED_RANGE",byte_count:bytes.length,range_verified:true};
          }
          export default {
            async fetch(request,env){
              const u=new URL(request.url),parts=u.pathname.split("/");
              if(Date.now()>EXPIRES||request.method!=="GET"||parts.length!==4||parts[1]!==TOKEN||parts[2]!=="probe"||!exact.has(parts[3])||u.search)
                return new Response("Not found",{status:404});
              const id=parts[3],size=exact.get(id);
              const first=await check(env,id,size,0,true);
              const seek=first.ok?await check(env,id,size,size-64,false):null;
              // Never return media bytes, credentials, source URLs, or raw errors.
              return response({output:id,ok:first.ok&&seek?.ok===true,first,seek});
            }
          };
          """
          source=source.replace('__TOKEN__',json.dumps(token)).replace('__EXPIRES__',str(int((time.time()+900)*1000))).replace('__REVIEW_USER__',json.dumps(m.group(1)))
          Path('/tmp/2888-bridge.mjs').write_text(source)
          Path('/tmp/2888-metadata.json').write_text(json.dumps({"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"chicagoshining-studio-api"}]}))
          PY
          TOKEN=$(cat /tmp/2888-token)
          echo "::add-mask::$TOKEN"
          node --check /tmp/2888-bridge.mjs
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS --max-time 45 -X PUT "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/content" -H "$AUTH" \
            -F 'metadata=@/tmp/2888-metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/2888-bridge.mjs;type=application/javascript+module;filename=worker.js' \
            -o /tmp/2888-upload.json
          jq -e '.success==true' /tmp/2888-upload.json >/dev/null
          curl -fsS --max-time 30 -X POST "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/subdomain" -H "$AUTH" \
            -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' \
            -o /tmp/2888-subdomain.json
          jq -e '.success==true and .result.enabled==true' /tmp/2888-subdomain.json >/dev/null
          curl -fsS --max-time 30 -H "$AUTH" "$API_ROOT/workers/subdomain" -o /tmp/2888-account.json
      - name: Probe first MP4 header and tail seek on all seven exact outputs
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN=$(jq -er '.result.subdomain' /tmp/2888-account.json)
          TOKEN=$(cat /tmp/2888-token)
          echo "::add-mask::$TOKEN"
          failures=0
          for id in rec1PDreUDoe2AcPV recaV78on0RSfqb31 recfwDzGh6St6WB9f rec1kjgusW1fX9BOp recidhGcJSfOlxMsc recgeicEbdlbmQiv5 recy1CzV4MJQycBMq; do
            code=000
            for i in $(seq 1 25); do
              code=$(curl -sS --max-time 100 --max-filesize 4096 -o /tmp/2888-result.json -w '%{http_code}' \
                "https://$VERIFY_BRIDGE.$SUBDOMAIN.workers.dev/$TOKEN/probe/$id" || true)
              if [[ "$code" == "200" ]]; then break; fi
              if [[ "$code" == "404" ]] && grep -Fq 'error code: 1042' /tmp/2888-result.json; then sleep 3; continue; fi
              break
            done
            if [[ "$code" == 200 ]] && jq -e --arg id "$id" '.output==$id and (.first.status|type=="number")' /tmp/2888-result.json >/dev/null; then
              jq -c '{output,ok,first:{status:.first.status,reason:.first.reason,byte_count:.first.byte_count},seek:(if .seek then {status:.seek.status,reason:.seek.reason,byte_count:.seek.byte_count} else null end)}' /tmp/2888-result.json
              if ! jq -e '.ok==true' /tmp/2888-result.json >/dev/null; then failures=$((failures+1)); fi
            else
              echo "issue2888_bridge_probe_failed id=$id http=$code"
              failures=$((failures+1))
            fi
          done
          echo "issue2888_failed_outputs=$failures/7"
          test "$failures" -eq 0
      - name: Delete short-lived verification bridge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$VERIFY_BRIDGE" \
            -o /tmp/2888-delete.json -w '%{http_code}')
          if [[ "$code" == 404 ]]; then exit 0; fi
          test "$code" -ge 200 -a "$code" -lt 300
          jq -e '.success==true' /tmp/2888-delete.json >/dev/null
