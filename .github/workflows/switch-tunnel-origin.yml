name: Switch Tunnel Origin

on:
  workflow_dispatch:
    inputs:
      service:
        description: Hostname key from deploy/cloud-vm/hostname-map.json
        required: true
        type: choice
        options:
          - watermark
          - voiceover
          - compressor
          - frames
          - timing
          - pipeline
          - youtube
          - remotion
      origin:
        description: Connector side that should answer localhost for this hostname
        required: true
        type: choice
        options:
          - windows
          - vm
      origin_url:
        description: Optional private origin override (Tailscale dual-run)
        required: false
        type: string
      skip_verify:
        description: Skip public /health after the ingress patch
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Patch one tunnel hostname
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          args=(
            --service "${{ inputs.service }}"
            --origin "${{ inputs.origin }}"
          )
          if [[ -n "${{ inputs.origin_url }}" ]]; then
            args+=(--origin-url "${{ inputs.origin_url }}")
          fi
          if [[ "${{ inputs.skip_verify }}" == "true" ]]; then
            args+=(--skip-verify)
          fi
          python3 deploy/cloud-vm/switch_tunnel_origin.py "${args[@]}"
