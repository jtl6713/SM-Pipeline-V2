name: Incident 2670 read-only governed recovery inventory
on:
  push:
    branches: [main]
    paths: ['deploy/incident-2670-readonly-audit.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: incident-2670-readonly-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Parse Windows PowerShell audit before any production admission
        shell: pwsh
        run: |
          $file='.github/scripts/incident-2670-readonly-consumer-audit.ps1'
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $file),[ref]$tokens,[ref]$errors)
          if($errors.Count -gt 0){
            foreach($error in $errors){
              $safeId=([string]$error.ErrorId -replace '[^A-Za-z0-9_-]','')
              Write-Output ('incident2670_powershell_parser_failure='+$safeId+
                ':line_'+$error.Extent.StartLineNumber)
            }
            throw 'readonly_audit_powershell_parse_failed'
          }
          Write-Output 'incident2670_powershell_parse=PASS'
      - name: Inspect production Runner health before Ops access
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 https://pipeline.chicagoshining.com/health -o /tmp/runner-health.json
          jq -e '.ok==true and .recovery_read_only==false and
            .recovery_producer_only_enabled==false and .workload_governor_enabled==true and
            .studio_write_source=="supabase" and .supabase_pipeline_writes==true and
            .airtable_activity.ok==true and .airtable_activity.any_activity==false' /tmp/runner-health.json >/dev/null
          echo 'incident2670_public_runner_authority=PASS'
      - name: Collect authenticated loopback workload and consumer flags (GET only)
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          selected=''
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C"; do
            [[ -n "$candidate" ]] || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then
              selected="$candidate"; break
            fi
          done
          test -n "$selected" || { echo 'incident2670_ops_authority=UNAVAILABLE'; exit 1; }
          echo "::add-mask::$selected"
          python - <<'PY'
          import json
          from pathlib import Path
          command=Path('.github/scripts/incident-2670-readonly-consumer-audit.ps1').read_text(encoding='utf-8')
          assert len(command)<8000, 'Ops shell command must stay below 8k'
          Path('/tmp/workload-audit.json').write_text(json.dumps({'command':command,'confirm':True}))
          PY
          code=$(curl -sS --max-time 30 -o /tmp/start.json -w '%{http_code}' \
            -X POST "$BASE/api/shell" -H "Authorization: Bearer $selected" \
            -H 'Content-Type: application/json' --data-binary @/tmp/workload-audit.json || true)
          if [[ "$code" != 202 && "$code" != 200 ]]; then
            echo "incident2670_ops_admission_http=$code"; exit 1
          fi
          job=$(jq -r '.job.id // .jobId // empty' /tmp/start.json)
          test -n "$job"
          for attempt in $(seq 1 45); do
            curl -fsS --max-time 20 -o /tmp/status.json -H "Authorization: Bearer $selected" "$BASE/api/jobs/$job"
            state=$(jq -r '.job.status // empty' /tmp/status.json)
            if [[ "$state" == ok ]]; then
              jq -r '.job.log // ""' /tmp/status.json | grep '^incident2670_audit=' | tail -1 > /tmp/audit-line.txt
              test -s /tmp/audit-line.txt
              sed 's/^incident2670_audit=//' /tmp/audit-line.txt | jq -e \
                '.enabled==true and .scope=="single_windows_host" and
                 .max_jobs>=1 and .max_jobs<=8 and
                 .optional_outbox_enabled==false' >/tmp/audit-safe.json
              echo 'incident2670_readonly_governor_consumer_audit=PASS'
              cat /tmp/audit-safe.json
              exit 0
            fi
            if [[ "$state" == failed ]]; then
              # Only our static phase names are safe to report from remote logs.
              phase=$(jq -r '.job.log // ""' /tmp/status.json |
                grep -oE 'incident2670_failure_phase=(read_env|governor_get|review_get|gallery_get|readback_validation|outbox_validation|summary_serialization)' |
                tail -1 || true)
              echo "incident2670_ops_readonly_probe=FAILED_NO_MUTATION"
              echo "incident2670_readonly_failure_phase=${phase:-unclassified}"
              # Only fixed classification labels from stderr; remote logs contain
              # script source and must never be printed in full.
              reason=$(jq -r '.job.log // ""' /tmp/status.json |
                grep -oE 'ParserError|CommandNotFoundException|runner_env_missing|runner_secret_unavailable|runner_secret_invalid|consumer_or_governor_readback_invalid|outbox_config_ambiguous|optional_outbox_must_remain_disabled|Cannot find path|Unable to connect to the remote server|Unexpected token|Missing closing' |
                tail -1 || true)
              case "$reason" in
                ParserError|CommandNotFoundException|runner_env_missing|runner_secret_unavailable|runner_secret_invalid|consumer_or_governor_readback_invalid|outbox_config_ambiguous|optional_outbox_must_remain_disabled)
                  echo "incident2670_remote_failure_category=$reason" ;;
                "Cannot find path") echo 'incident2670_remote_failure_category=PATH_UNAVAILABLE' ;;
                "Unable to connect to the remote server") echo 'incident2670_remote_failure_category=LOOPBACK_CONNECTIVITY' ;;
                "Unexpected token"|"Missing closing") echo 'incident2670_remote_failure_category=POWERSHELL_SYNTAX' ;;
                *) echo 'incident2670_remote_failure_category=UNKNOWN' ;;
              esac
              exit 1
            fi
            sleep 3
          done
          echo 'incident2670_ops_readonly_probe=TIMEOUT'
          exit 1
