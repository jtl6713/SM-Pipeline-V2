name: Validate Studio Worker Source Split
on:
  push:
    branches:
      - refactor/split-studio-api-worker-20261015
  pull_request:
    paths:
      - 'apps/studio-api/**'
      - '.github/workflows/validate-studio-worker-split.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    # Pin 24.04 + Node 22: ubuntu-latest/26 ships Node 24 whose default
    # --test reporter no longer emits TAP "# tests / # pass / # fail" lines.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module sizes and JS syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          names = [Path('apps/studio-api/worker.js'), *sorted(Path('apps/studio-api').glob('worker-functions-*.mjs'))]
          assert len(names)==5, [str(x) for x in names]
          for p in names:
              size=p.stat().st_size
              print(f'{p}: {size} bytes')
              assert 0<size<1000000, f'{p} exceeds the GitHub Contents API limit'
          worker = names[0].read_text()
          extracts = set(re.findall(r'/\*__STUDIO_WORKER_EXTRACT:([^*]+)__\*/', worker))
          missing = []
          nonexported = []
          for p in names[1:]:
              source = p.read_text()
              ends = re.findall(r'/\*__STUDIO_WORKER_END:([^*]+)__\*/', source)
              exported = set(re.findall(r'^export (?:async )?function ([A-Za-z_$][\w$]*)\(', source, re.M))
              missing.extend(f'{p.name}:{name}' for name in ends if name not in extracts)
              nonexported.extend(f'{p.name}:{name}' for name in ends if name not in exported)
          assert not missing, 'worker.js missing split reconstruction markers: ' + ', '.join(missing)
          assert not nonexported, 'split reconstruction functions must be exported: ' + ', '.join(nonexported)
          print(f'worker_split_reconstruction_markers=PASS count={len(extracts)}')
          PY
          node --check apps/studio-api/worker.js
          node --check apps/studio-api/schedule-reservation-authority.mjs
          node --check apps/studio-api/schedule-reservation-transaction.mjs
          for file in apps/studio-api/worker-functions-*.mjs; do node --check "$file"; done
      - name: Run existing Studio API tests
        shell: bash
        run: |
          set -euo pipefail
          if node --test --test-reporter=tap apps/studio-api/*.test.mjs >/tmp/studio-api-regression.log 2>&1; then
            grep -E '^# tests |^# pass |^# fail ' /tmp/studio-api-regression.log | tail -3
          else
            echo "::error::Studio API test failures; compact diagnostic listing follows"
            grep -n -B 2 -A 16 -E '^not ok [0-9]+' /tmp/studio-api-regression.log | head -120 || true
            echo '--- all failed subtest names ---'
            grep -E '^not ok [0-9]+' /tmp/studio-api-regression.log || true
            echo "--- final test summary ---"
            grep -E '^# tests |^# pass |^# fail ' /tmp/studio-api-regression.log | tail -3 || true
            exit 1
          fi
      - name: Wrangler bundle dry run (no deploy)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/studio-split-validate
          cp apps/studio-api/worker.js /tmp/studio-split-validate/
          cp apps/studio-api/*.mjs /tmp/studio-split-validate/
          rm -f /tmp/studio-split-validate/*.test.mjs
          cd /tmp/studio-split-validate
          npm init -y >/dev/null
          npm install --no-save wrangler@4.123.0
          cat > wrangler.jsonc <<'EOF'
          {
            "name": "studio-worker-split-validation",
            "main": "worker.js",
            "compatibility_date": "2026-08-02",
            "workers_dev": false,
            "vars": {"STUDIO_SCHEDULE_RESERVATION_AUTHORITY_ENABLED":"false"},
            "r2_buckets": [{"binding":"STUDIO_MEDIA","bucket_name":"dummy"}],
            "durable_objects": {"bindings":[{"name":"STUDIO_SCHEDULE_RESERVATIONS","class_name":"ScheduleReservationLane"},{"name":"STUDIO_PROFILE_SUMMARIES","class_name":"StudioProfileSummary"}]},
            "exports": {"ScheduleReservationLane":{"type":"durable-object","storage":"sqlite"},"StudioProfileSummary":{"type":"durable-object","storage":"sqlite"}}
          }
          EOF
          ./node_modules/.bin/wrangler deploy --config wrangler.jsonc --dry-run
