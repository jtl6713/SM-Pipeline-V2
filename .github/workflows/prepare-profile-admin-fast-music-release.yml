name: Prepare Profile Admin Fast Music UI Release
on:
  push:
    branches: [fix/profile-admin-fast-loading-20261019]
    paths:
      - '.github/workflows/prepare-profile-admin-fast-music-release.yml'
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/profile-admin-fast-loading-20261019
          persist-credentials: true
      - name: Version HTML, app bundle and existing regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old = '0.6.722-manual-ideas-no-cap'
          new = '0.6.723-profile-fast-music'
          html = Path('apps/studio-web/index.html')
          app = Path('apps/studio-web/assets/app-item4-1008.js')
          a = html.read_text(encoding='utf-8')
          b = app.read_text(encoding='utf-8')
          if a.count(old) < 20 or ('item4-' + old) not in b or 'UI build 0.6.722' not in a:
              raise SystemExit('Unexpected Studio release baseline, refusing drift')
          html.write_text(a.replace(old,new).replace('UI build 0.6.722','UI build 0.6.723'),encoding='utf-8')
          app.write_text(b.replace('item4-' + old,'item4-' + new),encoding='utf-8')
          changed = 0
          for p in Path('apps/studio-web').rglob('*.test.mjs'):
              before = p.read_text(encoding='utf-8')
              after = before.replace(old,new)
              after = after.replace(old.replace('.',chr(92)+'.'),new.replace('.',chr(92)+'.'))
              after = after.replace('0.6.722','0.6.723')
              after = after.replace('0'+chr(92)+'.6'+chr(92)+'.722','0'+chr(92)+'.6'+chr(92)+'.723')
              if after != before:
                  p.write_text(after,encoding='utf-8')
                  changed += 1
          print('updated release regression files',changed)
          if changed < 10: raise SystemExit('Partial release-contract test update')
          PY
          node apps/studio-web/ui-release-contract.mjs
          node --test apps/studio-web/ui-release-contract.test.mjs apps/studio-web/profile-admin-fast-music.test.mjs apps/studio-web/operations-profile-audio-preview.test.mjs
      - name: Commit version on PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u apps/studio-web
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Release UI 0.6.723: fast profile music preview"
          git push origin HEAD:fix/profile-admin-fast-loading-20261019
