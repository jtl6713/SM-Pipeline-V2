name: PR 1135 Conflict Resolution
# Re-run after aligning status-only policy and canonical history route tests.
on:
  push:
    branches: [feature/autonomous-publication-recovery-20261024]
    paths: ['.github/workflows/pr-1135-finish-merge.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge main and resolve only three audited conflicts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feature/autonomous-publication-recovery-20261024"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          BASE_SHA=$(git rev-parse origin/main)
          echo "merge_base_main=$BASE_SHA"
          git -c rerere.enabled=false merge --no-commit --no-ff origin/main || true
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          unmerged=set(subprocess.check_output(
              ["git","diff","--name-only","--diff-filter=U"],text=True).splitlines())
          expected={"apps/studio-api/exception-recovery-history.mjs",
                    "apps/studio-api/worker.js",
                    "apps/studio-web/index.html"}
          if unmerged!=expected:
              raise SystemExit(f"Unexpected conflict set, refusing unsafe merge: {sorted(unmerged)}")
          def git_stage(stage,path):
              return subprocess.check_output(["git","show",f":{stage}:{path}"],text=True)
          # The shared history module is semantically identical except that
          # main uses a local constant rather than importing an extra module.
          history="apps/studio-api/exception-recovery-history.mjs"
          ours=git_stage(2,history)
          theirs=git_stage(3,history)
          assert ours.replace('import { RECOVERY_SIGNATURE } from "./exception-recovery-autonomous.mjs";',
                              'const RECOVERY_SIGNATURE = "AUTONOMOUS-PUBLICATION-RECONCILIATION";') == theirs
          Path(history).write_text(theirs)
          # The Worker must keep the cron hook from the PR while respecting
          # the existing admin-only history route already installed in main.
          worker="apps/studio-api/worker.js"
          text=Path(worker).read_text()
          regex=re.compile(r'^<<<<<<< HEAD\n(.*?)^=======\n(.*?)^>>>>>>> origin/main\n',re.M|re.S)
          conflicts=list(regex.finditer(text))
          if len(conflicts)!=2:raise SystemExit(f"Expected two Worker conflict hunks, got {len(conflicts)}")
          def choose_worker(match):
              left,right=match.group(1),match.group(2)
              if "studioPublicationRecoveryCron," in left and not right.strip():
                  return left
              if "isAdminPublicationRecoveryHistoryRoute" in left and "isAdminExceptionHistoryRoute" in right:
                  return right
              raise SystemExit("Unexpected Worker merge hunk, refusing automatic choice")
          text=regex.sub(choose_worker,text)
          text=text.replace("isAdminPublicationRecoveryHistoryRoute","isAdminExceptionHistoryRoute")
          # Main and the PR both installed a read-only history GET handler.
          handler=re.compile(
              r'(?m)^      if \(isAdminExceptionHistoryRoute\) \{\n'
              r'        requirePermission\(authorization, "tenant_admin"\);\n'
              r'        if \(request\.method !== "GET"\) throw new HttpError\(405, "Method not allowed"\);\n'
              r'        return getStudioPublicationRecoveryHistory\(request, env\);\n'
              r'      \}\n')
          found=list(handler.finditer(text))
          if len(found) not in (1,2):raise SystemExit("Unexpected history route count")
          if len(found)==2:text=text[:found[1].start()]+text[found[1].end():]
          if text.count("const isAdminExceptionHistoryRoute =")!=1:
              raise SystemExit("History route declared incorrectly")
          if text.count("if (isAdminExceptionHistoryRoute)")!=1:
              raise SystemExit("History route duplication remains")
          if text.count("ctx.waitUntil(studioPublicationRecoveryCron(env)")!=1:
              raise SystemExit("Recovery cron hook missing or duplicated")
          if text.count("  studioPublicationRecoveryCron,")!=1:
              raise SystemExit("Worker cron import missing or duplicated")
          # Source split must have exactly one marker per extraction function.
          for marker in [
              "/*__STUDIO_WORKER_EXTRACT:studioPublicationRecoveryCron__*/",
              "/*__STUDIO_WORKER_EXTRACT:getStudioPublicationRecoveryHistory__*/"]:
              if text.count(marker)==2:
                  pos=text.rfind(marker)
                  text=text[:pos]+text[pos+len(marker):]
              if text.count(marker)!=1:raise SystemExit("Worker extraction marker invalid: "+marker)
          assert "<<<<<<<" not in text and ">>>>>>>" not in text
          Path(worker).write_text(text)
          # Keep newer 0.6.759 Studio release contract from main, while
          # adding the new Recovery footer and cache-busted recovery assets.
          html="apps/studio-web/index.html"
          text=git_stage(3,html)
          replacements={
              'exception-recovery.css?v=0.6.759-exception-recovery"':
                  'exception-recovery.css?v=0.6.759-exception-recovery&recovery=v1"',
              'exception-recovery.js?v=0.6.759-exception-recovery&age=hm-v1"':
                  'exception-recovery.js?v=0.6.759-exception-recovery&age=hm-v1&recovery=v1"',
              '<span id="qualityAgentBuildLabel">Quality Agent v2</span>':
                  '<span id="qualityAgentBuildLabel">Quality Agent v2</span> <span id="publicationRecoveryBuildLabel">Recovery v1</span>',
          }
          for left,right in replacements.items():
              if text.count(left)!=1:raise SystemExit("Unexpected UI asset/footer anchor: "+left)
              text=text.replace(left,right,1)
          if 'UI build 0.6.759' not in text or 'UI build 0.6.758' in text:
              raise SystemExit("Old UI release marker present")
          if "<<<<<<<" in text or ">>>>>>>" in text:
              raise SystemExit("HTML conflict marker remains")
          Path(html).write_text(text)
          # A clean textual merge can still introduce duplicate module imports
          # or two definitions of the same function. Keep the PR's working
          # autonomous history implementation, not the older disabled stub.
          api="apps/studio-api/worker-functions-04.mjs"
          text=Path(api).read_text()
          duplicate='import { normalizeRecoveryHistory } from "./exception-recovery-history.mjs";\n'
          combined='import { recoveryAuditFields, normalizeRecoveryHistory } from "./exception-recovery-history.mjs";'
          if text.count(duplicate)!=1 or text.count(combined)!=1:
              raise SystemExit("Unexpected autonomous history import layout")
          text=text.replace(duplicate,"",1)
          history_pattern=re.compile(
              r'(?s)export async function getStudioPublicationRecoveryHistory\(request,env\) \{\n'
              r'.*?\n\}\n/\*__STUDIO_WORKER_END:getStudioPublicationRecoveryHistory__\*/\n')
          blocks=list(history_pattern.finditer(text))
          if len(blocks)!=2:
              raise SystemExit("Expected exactly old read-only stub and new durable-history handler")
          old=[m for m in blocks if 'automation:{policy:{inspect:false,mutate:false},runtime:null}' in m.group()]
          new=[m for m in blocks if 'automation:await publicationRecoveryStatus(env)' in m.group()]
          if len(old)!=1 or len(new)!=1:raise SystemExit("History implementation changed unexpectedly")
          text=text[:old[0].start()]+text[old[0].end():]
          if text.count("export async function getStudioPublicationRecoveryHistory(")!=1:
              raise SystemExit("Duplicate history handler remains")
          Path(api).write_text(text)
          print("resolved=history_constant,worker_cron_and_admin_route,latest_ui_plus_recovery_assets,history_api_stub")
          PY
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          node --check apps/studio-api/worker.js
          node --check apps/studio-api/worker-functions-04.mjs
          node --check apps/studio-web/assets/exception-recovery.js
          node apps/studio-web/ui-release-contract.mjs >/dev/null
          node --test apps/studio-api/exception-recovery-autonomous.test.mjs apps/studio-api/exception-recovery-background.test.mjs apps/studio-api/exception-recovery-profile-chain.test.mjs
          # Remove one-shot maintenance workflows from the resulting PR.
          git rm -f .github/workflows/pr-1135-merge-diagnostic.yml .github/workflows/pr-1135-finish-merge.yml
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA" || { echo "main changed during merge"; exit 1; }
          git commit -m "Merge current main into autonomous recovery; preserve recent UI and admin history"
          git push origin HEAD:feature/autonomous-publication-recovery-20261024
          echo "pr_1135_merge_resolution=PUSHED"
