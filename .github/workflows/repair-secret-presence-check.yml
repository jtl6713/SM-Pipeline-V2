name: Check Repair Deployment Secret Presence

on:
  push:
    branches: [main]
    paths:
      - 'deploy/repair-secret-presence-check.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      AIRTABLE_PAT_CANDIDATE: ${{ secrets.AIRTABLE_PAT }}
      ELEVENLABS_API_KEY_CANDIDATE: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - name: Report names only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          a=bool(os.environ.get('AIRTABLE_PAT_CANDIDATE',''))
          e=bool(os.environ.get('ELEVENLABS_API_KEY_CANDIDATE',''))
          print(f'AIRTABLE_PAT_present={str(a).lower()}')
          print(f'ELEVENLABS_API_KEY_present={str(e).lower()}')
          if not (a and e): raise SystemExit(2)
          PY
