name: Diagnose Scripted Short Proposal 500
on:
  push:
    branches: [fix/scripted-short-proposal-500]
    paths: ['.github/workflows/diagnose-scripted-short-proposal-500.yml']
permissions:
  contents: read
jobs:
  proposal-readonly-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Reproduce POST propose safely against live Studio API; do not accept or publish
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          DIAG_WORKER="studio-scripted-proposal-diagnose"
          TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          trap 'curl -fsS -X DELETE "$API_ROOT/workers/scripts/$DIAG_WORKER" -H "$AUTH" >/dev/null 2>&1 || true' EXIT
          cat >/tmp/proposal-diagnostic-worker.js <<EOF
          export default {
            async fetch(request,env) {
              if (new URL(request.url).pathname !== "/$TOKEN") return new Response("Not found",{status:404});
              const prompt="Educate on the history of Battery Park City area of lower Manhattan. You don't have to be brief. Utilize the battery park images that are uploaded into the system.";
              try {
              const requestedProfile = url.searchParams.get("wrong") === "1" ? "recT2rbKX3MF7cVFU" : "recgtK8Z7eNADNtVy";
              const response=await env.STUDIO_API.fetch(new Request("https://studio.chicagoshining.com/api/scripted-short/propose?profile=" + requestedProfile,{
                method:"POST",
                headers:{
                  "Content-Type":"application/json",
                  "Accept":"application/json",
                  "Origin":"https://studio.chicagoshining.com",
                  "Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com"
                },
                body:JSON.stringify({prompt})
              }));
              let payload={};
              try {payload=await response.json();} catch {}
              return Response.json({
                status:response.status,
                ok:Boolean(payload.ok),
                error:String(payload.error||"").slice(0,300),
                scene_count:Number(payload.scene_count||0),
                owned_count:Number(payload.owned_count||0),
                required_location:payload.asset_policy?.location||null,
                verification:payload.asset_validation?.verified??null
              },{headers:{"Cache-Control":"no-store"}});
              } catch(error) { return Response.json({status:597,ok:false,error:"service_binding_exception: "+String(error?.message||error).slice(0,300)},{headers:{"Cache-Control":"no-store"}}); }
            }
          };
          EOF
          cat >/tmp/proposal-diagnostic-metadata.json <<EOF
          {"main_module":"proposal-diagnostic-worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"chicagoshining-studio-api"}]}
          EOF
          node --check /tmp/proposal-diagnostic-worker.js
          code=$(curl -sS -o /tmp/proposal-upload.json -w '%{http_code}' -X PUT "$API_ROOT/workers/scripts/$DIAG_WORKER/content" -H "$AUTH" \
            -F 'metadata=@/tmp/proposal-diagnostic-metadata.json;type=application/json' \
            -F 'proposal-diagnostic-worker.js=@/tmp/proposal-diagnostic-worker.js;type=application/javascript+module;filename=proposal-diagnostic-worker.js')
          test "$code" -ge 200 -a "$code" -lt 300
          jq -e '.success==true' /tmp/proposal-upload.json >/dev/null
          curl -fsS -X POST "$API_ROOT/workers/scripts/$DIAG_WORKER/subdomain" -H "$AUTH" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' >/dev/null
          curl -fsS "$API_ROOT/workers/subdomain" -H "$AUTH" -o /tmp/subdomain.json
          SUBDOMAIN=$(jq -er '.result.subdomain' /tmp/subdomain.json)
          URL="https://$DIAG_WORKER.$SUBDOMAIN.workers.dev/$TOKEN"
          for i in $(seq 1 12); do
            code=$(curl -sS --max-time 85 -o /tmp/proposal-result.json -w '%{http_code}' "$URL" || true)
            if [[ "$code" == "200" ]] && jq -e 'has("status")' /tmp/proposal-result.json >/dev/null 2>&1; then break; fi
            sleep 3
          done
          echo "proposal_probe_http=$code"
          if [[ "$code" == "200" ]]; then jq '{status,ok,error,scene_count,owned_count,required_location,verification}' /tmp/proposal-result.json; else head -c 140 /tmp/proposal-result.json; fi
          test "$code" = "200"
          jq -e '.status==200 and .ok==true and .required_location=="battery park" and .scene_count>=6 and .owned_count==.scene_count and .verification==.scene_count' /tmp/proposal-result.json >/dev/null
          echo "nyc_battery_park_browser_profile_canary=PASS"
          negative_code=$(curl -sS --max-time 90 -o /tmp/proposal-negative.json -w '%{http_code}' "$URL?wrong=1" || true)
          echo "wrong_profile_bridge_http=$negative_code"
          jq '{status,ok,error}' /tmp/proposal-negative.json
          test "$negative_code" = "200"
          jq -e '.status==409 and .ok==false and (.error|contains("No verified battery park assets"))' /tmp/proposal-negative.json >/dev/null
          echo "wrong_profile_409_handled_without_1101=PASS"
