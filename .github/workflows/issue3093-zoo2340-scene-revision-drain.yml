name: Issue 3093 exact Zoo scene revision checkpoint
on:
  pull_request:
    branches: [main]
    paths:
      - 'repair/scripts/issue3093-zoo2340-scene-revision-drain.py'
      - '.github/workflows/issue3093-zoo2340-scene-revision-drain.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue3093-zoo2340-scene-revision-drain.yml'
      - 'repair/scripts/issue3093-zoo2340-scene-revision-drain.py'
permissions:
  contents: read
  statuses: write
concurrency:
  group: chicagoshining-studio-api-production-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile repair/scripts/issue3093-zoo2340-scene-revision-drain.py
          python - <<'PY'
          import ast
          from pathlib import Path
          text=Path('repair/scripts/issue3093-zoo2340-scene-revision-drain.py').read_text()
          ast.parse(text)
          assert 'smv1-maintenance' in text and 'Issue3093_Repair_Drain' in text
          assert 'finally:' in text and 'publication_fence' in text
          assert '/jobs/studio-produce/resume' not in text
          print('EXACT_ZOO3093_DRAIN_STATIC_PASS')
          PY
  audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - name: Verify protected Runner deployment includes both narration fixes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA=acac0190ec698d939e7f51d2eba4d088339d0324
          state=$(curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$SHA/status" | jq -r '[.statuses[] | select(.context=="production/pipeline-runner")][0].state // "missing"')
          test "$state" = success
      - name: Verify scheduler still paused before exact recovery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PYTHONPATH=repair/scripts python - <<'PY'
          from issue3159_cron_containment import call,schedules
          assert schedules(call('GET'))==[]
          print('zoo3093_pre_crons=[]')
          PY
      - name: Exact one-shot Zoo Miami recovery through protected Ops
        shell: bash
        env:
          OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
          OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
          OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
        run: |
          set -euo pipefail
          BASE=https://ops.chicagoshining.com
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            [[ -n "$candidate" ]] || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then selected="$candidate"; break; fi
          done
          test -n "$selected"
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          source=Path('repair/scripts/issue3093-zoo2340-scene-revision-drain.py')
          sha=os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}',sha)
          expected=hashlib.sha256(source.read_bytes()).hexdigest()
          url=f'https://raw.githubusercontent.com/jtl6713/SM-Pipeline-V2/{sha}/{source.as_posix()}'
          command=("$ErrorActionPreference='Stop';"
            "$tmp=Join-Path $env:TEMP ('issue3093-zoo2340-'+[guid]::NewGuid().ToString('N')+'.py');"
            f"Invoke-WebRequest -Uri '{url}' -OutFile $tmp -UseBasicParsing -TimeoutSec 55;"
            f"if((Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant() -ne '{expected}'){{throw 'audit_source_hash_mismatch'}};"
            "try{& python $tmp;if($LASTEXITCODE -ne 0){throw 'audit_python_failed'}}finally{Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue}")
          Path('/tmp/request.json').write_text(json.dumps({'command':command,'confirm':True}))
          PY
          job=''
          for attempt in $(seq 1 3); do
            code=$(curl -sS --max-time 20 -o /tmp/start.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $selected" -H 'Content-Type: application/json' --data-binary @/tmp/request.json || true)
            if [[ "$code" == 202 ]]; then job=$(jq -er '.job.id' /tmp/start.json); break; fi
            [[ "$code" == 409 ]] || { echo "audit_ops_http=$code"; exit 1; }
            sleep 5
          done
          test -n "$job"
          echo "audit_job_id=$job"
          for attempt in $(seq 1 120); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $selected" "$BASE/api/jobs/$job" -o /tmp/status.json
            state=$(jq -r '.job.status' /tmp/status.json)
            [[ "$state" == ok || "$state" == failed ]] && break
            sleep 3
          done
          python - <<'PY'
          import json,re
          from pathlib import Path
          job=json.loads(Path('/tmp/status.json').read_text())['job']
          out=job.get('log','')
          lines=out.splitlines()
          for line in lines:
              if line.startswith(('ZOO3093_DRAIN_READY=','ZOO3093_REVISION_READY=','ZOO3093_MAINTENANCE_RELEASED=','ZOO3093_RECOVERY_PROOF=','ZOO3093_DRAIN_ERROR=')):
                  print(line)
          if job['status']!='ok': raise SystemExit('zoo_revision_checkpoint_incomplete')
          proofs=[line for line in lines if line.startswith('ZOO3093_RECOVERY_PROOF=')]
          assert len(proofs)==1
          proof=json.loads(proofs[0].split('=',1)[1])
          assert proof['outputs']==6 and proof['queue_preserved'] and not proof['publication_authorized']
          PY
      - name: Verify final scheduler remains paused
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PYTHONPATH=repair/scripts python - <<'PY'
          from issue3159_cron_containment import call,schedules
          assert schedules(call('GET'))==[]
          print('zoo3093_post_crons=[]')
          PY
      - name: Record protected evidence status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          STATE=failure
          if [[ "$RESULT" == success ]]; then STATE=success; fi
          jq -nc --arg state "$STATE" --arg url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:"production/issue3093-zoo2340-scene-revision-drain",target_url:$url,description:"Exact Zoo scene revision checkpoint"}' >/tmp/media-status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --data-binary @/tmp/media-status.json >/dev/null
