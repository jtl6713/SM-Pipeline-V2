name: Rendering Review Publication Guards CI
on:
  pull_request:
    paths:
      - 'apps/studio-api/worker-functions-03.mjs'
      - 'apps/studio-api/worker-functions-04.mjs'
      - 'apps/studio-api/rendering-review-entry-guards.test.mjs'
      - 'services/pipeline-runner/ap1_ig/**'
      - 'services/pipeline-runner/publish/rendering_review.py'
      - 'services/pipeline-runner/tests/test_rendering_review_publication.py'
      - '.github/workflows/rendering-review-publication-guards-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test apps/studio-api/rendering-review*.test.mjs
      - run: python -m unittest discover -s services/pipeline-runner/tests -p test_rendering_review_publication.py -v
        env:
          PYTHONPATH: services/pipeline-runner
