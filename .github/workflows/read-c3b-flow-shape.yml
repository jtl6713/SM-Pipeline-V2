name: Read C3B Flow Shape
on:
  push:
    branches: [main]
    paths: ['deploy/read-c3b-flow-shape.txt']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env: {CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'}
    steps:
      - uses: actions/checkout@v6
      - name: Read C3B router topology
        shell: bash
        run: |
          set -euo pipefail; umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:CLOUDFLARE_API_TOKEN -in deploy/credential-envelope/private.pem.enc -out /tmp/key.pem
          base64 -d deploy/credential-envelope/airtable_pat.ciphertext.b64 >/tmp/pat.enc
          openssl pkeyutl -decrypt -inkey /tmp/key.pem -in /tmp/pat.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -out /tmp/pat.txt
          PAT=$(cat /tmp/pat.txt)
          python - <<'PY' >/tmp/q
          import urllib.parse
          f="AND({Active}=1,OR({Setting_Name}='MAKE_API_TOKEN',{Setting_Name}='MAKE_API_BASE_URL'))"
          print(urllib.parse.urlencode([('filterByFormula',f),('fields[]','Setting_Name'),('fields[]','Setting_Value')]))
          PY
          curl -fsS "https://api.airtable.com/v0/appe33zkZn35yirTL/tblpHPWeEkyJaF7ql?$(cat /tmp/q)" -H "Authorization: Bearer $PAT" -o /tmp/settings
          python - <<'PY'
          import json,urllib.request
          d=json.load(open('/tmp/settings')); v={r['fields']['Setting_Name']:r['fields']['Setting_Value'] for r in d['records']}; base=str(v['MAKE_API_BASE_URL']).strip().rstrip('/'); tok=str(v['MAKE_API_TOKEN']).strip()
          q=urllib.request.Request(base+'/scenarios/5592384/blueprint?draft=false',headers={'Authorization':'Token '+tok,'User-Agent':'SM-Pipeline-Audit/1.0'})
          with urllib.request.urlopen(q,timeout=30) as h: raw=json.loads(h.read().decode())
          b=raw.get('blueprint') or (raw.get('response') or {}).get('blueprint') or raw
          if isinstance(b,str): b=json.loads(b)
          def compact(flow):
            out=[]
            for n in flow or []:
              x={'id':n.get('id'),'module':n.get('module'),'name':str(((n.get('metadata') or {}).get('designer') or {}).get('name') or ''),'filter':n.get('filter'),'routes':[]}
              for r in n.get('routes') or []: x['routes'].append(compact(r.get('flow') or []))
              out.append(x)
            return out
          print(json.dumps(compact(b.get('flow') or []),separators=(',',':')))
          PY
      - name: Destroy credentials
        if: always()
        run: rm -f /tmp/key.pem /tmp/pat.enc /tmp/pat.txt /tmp/q /tmp/settings
