name: Incident 2853 exact governed Python producer probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/incident-2853-bryant-python-probe.yml'
      - '.github/scripts/incident-2853-bryant-python-probe.ps1'
      - 'deploy/incident-2853-bryant-python-probe.txt'
      - 'services/pipeline-runner/tests/test_2670_workload_governor.py'
      - 'services/pipeline-runner/tests/test_2853_bryant_probe_contract.py'
      - 'services/pipeline-runner/tests/test_studio_native_gallery_2873.py'
  push:
    branches: [main]
    paths:
      - 'deploy/incident-2853-bryant-python-probe.txt'

permissions:
  contents: read

concurrency:
  group: incident-2853-exact-python-probe
  cancel-in-progress: false

jobs:
  exact-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Parse exact protected script and validate source contracts
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.github/scripts/incident-2853-bryant-python-probe.ps1'),
            [ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){throw 'incident2853_probe_script_parse_invalid'}
          Write-Output 'incident2853_probe_script_parse=PASS'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test exact gallery recovery and governor before production
        env:
          STUDIO_WORKLOAD_GOVERNOR_ENABLED: 'false'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest -r services/pipeline-runner/requirements.txt
          (cd services/pipeline-runner && python -m pytest -q \
            tests/test_2853_bryant_probe_contract.py \
            tests/test_studio_native_gallery_2873.py \
            tests/test_2670_workload_governor.py)

      - name: Execute exactly one protected nonpublishing governed probe
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
          OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
          OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            [[ -n "$candidate" ]] || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then
              selected="$candidate"; break
            fi
          done
          test -n "$selected"
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          source = Path('.github/scripts/incident-2853-bryant-python-probe.ps1')
          commit = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('invalid_pinned_source_commit')
          expected = hashlib.sha256(source.read_bytes()).hexdigest()
          url = f'https://raw.githubusercontent.com/jtl6713/SM-Pipeline-V2/{commit}/{source.as_posix()}'
          command = (
              "$ErrorActionPreference='Stop';"
              "$tmp=Join-Path $env:TEMP ('bryant-recovery-'+[guid]::NewGuid().ToString('N')+'.ps1');"
              f"Invoke-WebRequest -Uri '{url}' -OutFile $tmp -UseBasicParsing -TimeoutSec 55;"
              f"if((Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant() -ne '{expected}'){{throw 'incident2853_pinned_source_hash_mismatch'}};"
              "try{& $tmp -NormalClosedRecovery}finally{Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue}"
          )
          if len(command) > 7800:
              raise SystemExit('incident2853_ops_command_too_large')
          Path('/tmp/probe.json').write_text(
              json.dumps({'command': command, 'confirm': True}, separators=(',', ':')),
              encoding='utf-8',
          )
          PY
          job=''
          for attempt in $(seq 1 60); do
            code=$(curl -sS --max-time 30 -o /tmp/start.json -w '%{http_code}' \
              -X POST "$BASE/api/shell" -H "Authorization: Bearer $selected" \
              -H 'Content-Type: application/json' --data-binary @/tmp/probe.json || true)
            if [[ "$code" == 202 || "$code" == 200 ]]; then
              job=$(jq -r '.job.id // .jobId // empty' /tmp/start.json)
              [[ -n "$job" ]] && break
            fi
            [[ "$code" == 409 ]] || { echo "incident2853_ops_submit_http=$code"; exit 1; }
            sleep 5
          done
          test -n "$job"
          echo "incident2853_ops_job_id=$job"
          for attempt in $(seq 1 500); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $selected" \
              "$BASE/api/jobs/$job" -o /tmp/status.json
            state=$(jq -r '.job.status // empty' /tmp/status.json)
            if [[ "$state" == ok ]]; then
              jq -r '.job.log // ""' /tmp/status.json | grep '^incident2853_' | tail -12
              jq -e '.job.log|contains("incident2853_probe=PASS_NORMAL_RECOVERY_CIRCUIT_CLOSED") and contains("incident2853_bryant_factory_packages=PASS_10853_10854_HUMAN_REVIEW_REQUIRED")' /tmp/status.json >/dev/null
              exit 0
            fi
            if [[ "$state" == failed ]]; then
              echo 'incident2853_protected_probe=FAILED_NO_RETRY'
              jq -r '.job.log // ""' /tmp/status.json | grep -oE 'incident2853_[A-Za-z0-9_]+' | sort -u | tail -20 || true
              exit 1
            fi
            sleep 3
          done
          echo 'incident2853_protected_probe=TIMEOUT_NO_RETRY'
          exit 1
