name: Issue 2563 Read-only Live Factory Recovery Census
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue2563-live-factory-census.yml'
      - 'deploy/issue2563-live-factory-census.txt'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STUDIO_PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.STUDIO_PRODUCTION_SUPABASE_PROJECT_REF }}
      TARGET_WORKER: chicagoshining-studio-api
      VERIFY_BRIDGE: chicagoshining-studio-issue2563-census
    steps:
      - uses: actions/checkout@v6
      - name: Read live Worker deployment and Supabase project binding, no writes
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER"
          curl -fsS "$API/deployments" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/current.json
          VERSION=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/current.json)
          echo "active_worker_version=$VERSION"
          curl -fsS "$API/versions/$VERSION" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/version.json
          python3 - <<'PY'
          import json,os
          rows=json.load(open('/tmp/version.json'))['result']['resources']['bindings']
          vals={r.get('name'):r.get('text') for r in rows if r.get('type')=='plain_text'}
          target=os.environ.get('STUDIO_PRODUCTION_SUPABASE_PROJECT_REF') or ''
          url=str(vals.get('SUPABASE_URL') or '')
          if not target or target not in url: raise SystemExit('Live Supabase project does not match independently configured production target')
          print('production_supabase_project_identity=PASS')
          print('studio_write_source='+str(vals.get('STUDIO_WRITE_SOURCE') or 'not_set'))
          print('studio_factory_read_source='+str(vals.get('STUDIO_FACTORY_OPS_READ_SOURCE') or 'not_set'))
          PY
      - name: Install an ephemeral GET-only bridge (never changes main Worker)
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(openssl rand -hex 32)
          printf '%s' "$TOKEN" >/tmp/issue2563-token
          cat >/tmp/issue2563-bridge.js <<EOF
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if(url.pathname !== "/$TOKEN/factory") return new Response("Not found",{status:404});
              try {
                const upstream = await env.STUDIO_API.fetch(new Request(
                  "https://studio.chicagoshining.com/api/factory/desk",
                  {method:"GET",headers:{
                    "Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com",
                    "Origin":"https://studio.chicagoshining.com",
                    "Accept":"application/json"
                  }}
                ));
                const body = await upstream.json().catch(()=>({}));
                const cards = Object.values(body.lanes||{}).flat().filter(c=>c && c.meta_repair_required===true);
                const ids = cards.map(c=>String(c.id||""));
                const allHeld = cards.every(c=>c.do_not_publish===true && c.auto_publish_enabled===false && c.can_approve===false && c.can_retry===false && c.can_publish===false);
                return Response.json({
                  worker_http:upstream.status, factory_ok:body.ok===true,
                  read_source:body.read_source||null,
                  recovery_cards:cards.length, unique_cards:(new Set(ids)).size,
                  facebook:cards.filter(c=>c.platform==="Facebook").length,
                  instagram:cards.filter(c=>c.platform==="Instagram").length,
                  manual_total:(body.lanes?.manual||[]).length,
                  all_held:allHeld, warning:body.warning||null,
                  output_number_sample:cards.slice(0,3).map(c=>c.output_id),
                },{headers:{"Cache-Control":"no-store"}});
              } catch(error) {
                return Response.json({worker_http:502,factory_ok:false,error_type:"service_binding_error"},{status:502});
              }
            }
          };
          EOF
          cat >/tmp/issue2563-metadata.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF
          node --check /tmp/issue2563-bridge.js
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          code=$(curl -sS -o /tmp/issue2563-upload.json -w '%{http_code}' -X PUT "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/content" -H "$AUTH" -F 'metadata=@/tmp/issue2563-metadata.json;type=application/json' -F 'worker.js=@/tmp/issue2563-bridge.js;type=application/javascript+module;filename=worker.js')
          test "$code" -ge 200 -a "$code" -lt 300
          jq -e '.success==true' /tmp/issue2563-upload.json >/dev/null
          curl -fsS -X POST "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/subdomain" -H "$AUTH" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' -o /tmp/issue2563-subdomain.json
          jq -e '.success==true' /tmp/issue2563-subdomain.json >/dev/null
      - name: Measure true Factory recovery cards from active production Worker
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS "$API_ROOT/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/issue2563-account.json
          SUBDOMAIN=$(jq -er '.result.subdomain' /tmp/issue2563-account.json)
          TOKEN=$(cat /tmp/issue2563-token)
          URL="https://$VERIFY_BRIDGE.$SUBDOMAIN.workers.dev/$TOKEN/factory"
          CODE=000
          for attempt in 1 2 3 4 5 6; do
            CODE=$(curl -sS --max-time 100 -o /tmp/issue2563-factory.json -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then break; fi
            if [ "$CODE" = "404" ] && grep -Fq "error code: 1042" /tmp/issue2563-factory.json; then sleep 8; continue; fi
            break
          done
          echo "factory_bridge_http=$CODE"
          if jq -e . /tmp/issue2563-factory.json >/dev/null 2>&1; then
            jq -c '{worker_http,factory_ok,read_source,recovery_cards,unique_cards,facebook,instagram,manual_total,all_held,warning,output_number_sample,error_type}' /tmp/issue2563-factory.json
          else
            echo "factory_api_returned_non_json_error"
          fi
          test "$CODE" = 200
          jq -e '.worker_http==200 and .factory_ok==true and .read_source=="supabase" and .recovery_cards==118 and .unique_cards==118 and .facebook==62 and .instagram==56 and .all_held==true and .manual_total>=118' /tmp/issue2563-factory.json >/dev/null
          echo "live_factory_118_visible=PASS"
      - name: Remove ephemeral bridge, including after failed audit
        if: always()
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            curl -sS -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$VERIFY_BRIDGE" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null || true
          fi
