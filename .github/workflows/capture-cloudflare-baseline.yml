name: Capture Cloudflare Live Baseline

# One-time/read-only capture of currently deployed Cloudflare code into GitHub.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-cloudflare-baseline.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Capture deployed Studio API Worker
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cf-worker
          mkdir -p /tmp/cf-worker
          cd /tmp/cf-worker
          npx --yes wrangler@latest init --from-dash chicagoshining-studio-api --yes
          SOURCE_DIR="$(find /tmp/cf-worker -maxdepth 3 -type f \( -name 'wrangler.toml' -o -name 'wrangler.json' -o -name 'wrangler.jsonc' \) -printf '%h\n' | head -n1)"
          if [ -z "$SOURCE_DIR" ]; then
            echo 'Unable to locate the Worker project generated by wrangler init --from-dash.' >&2
            exit 1
          fi
          rm -rf "$SOURCE_DIR/node_modules" "$SOURCE_DIR/.git" "$SOURCE_DIR/.wrangler"
          find "$SOURCE_DIR" -maxdepth 2 -type f \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' \) -delete
          mkdir -p "$GITHUB_WORKSPACE/apps/studio-api"
          find "$GITHUB_WORKSPACE/apps/studio-api" -mindepth 1 -maxdepth 1 ! -name 'README.md' -exec rm -rf {} +
          cp -a "$SOURCE_DIR"/. "$GITHUB_WORKSPACE/apps/studio-api"/
          printf 'Captured from Cloudflare Worker: chicagoshining-studio-api\nCaptured at: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$GITHUB_WORKSPACE/apps/studio-api/LIVE-BASELINE.txt"

      - name: Capture currently served Studio Pages files
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://chicagoshining-studio.pages.dev'
          DEST="$GITHUB_WORKSPACE/apps/studio-web"
          mkdir -p "$DEST"
          curl -fsSL "$BASE/" -o "$DEST/index.html"
          node - "$DEST/index.html" <<'NODE' > /tmp/page-assets.txt
          const fs = require('fs');
          const html = fs.readFileSync(process.argv[2], 'utf8');
          const found = new Set();
          for (const m of html.matchAll(/(?:src|href)=["']([^"'#?]+)["']/gi)) {
            let p = m[1];
            if (/^(?:https?:|data:|mailto:|javascript:)/i.test(p)) continue;
            if (!p.startsWith('/')) p = '/' + p.replace(/^\.\//, '');
            if (p === '/') continue;
            found.add(p);
          }
          for (const p of [...found].sort()) console.log(p);
          NODE
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            mkdir -p "$DEST/$(dirname "${path#/}")"
            curl -fsSL "$BASE$path" -o "$DEST/${path#/}"
          done < /tmp/page-assets.txt
          printf 'Captured from Cloudflare Pages project: chicagoshining-studio\nSource URL: %s\nCaptured at: %s\n' "$BASE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$DEST/LIVE-BASELINE.txt"

      - name: Guard against credential files
        shell: bash
        run: |
          set -euo pipefail
          if find apps/studio-api apps/studio-web -type f \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' \) | grep -q .; then
            echo 'Credential file detected; refusing to commit.' >&2
            exit 1
          fi

      - name: Commit captured baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SM Pipeline Cloudflare Capture'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/studio-api apps/studio-web
          if git diff --cached --quiet; then
            echo 'No source changes to capture.'
            exit 0
          fi
          git commit -m 'Capture live Cloudflare Worker and Pages baseline'
          git push
