name: Capture Cloudflare Live Baseline

# Read-only capture of currently deployed Cloudflare code into GitHub.
# Source-sync trigger: 2026-10-06 promoted-profile-drift investigation.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-cloudflare-baseline.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Capture deployed Studio API Worker source
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/apps/studio-api"
          mkdir -p "$DEST"
          # Live Worker content is a Wrangler bundle. Never wipe modular source
          # (*.mjs) or replace worker.js with that bundle — that made 0.10.457+
          # production deploys fail at `test -s` for sibling modules.

          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/chicagoshining-studio-api/content/v2" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -D /tmp/worker-headers.txt \
            -o /tmp/worker-body.bin

          python3 - <<'PY'
          from email.parser import BytesParser
          from email.policy import default
          from pathlib import Path
          import re

          headers = Path('/tmp/worker-headers.txt').read_bytes()
          body = Path('/tmp/worker-body.bin').read_bytes()
          text_headers = headers.decode('latin-1', errors='replace')
          matches = re.findall(r'(?im)^content-type:\s*(.+?)\r?$', text_headers)
          content_type = matches[-1].strip() if matches else ''
          out = Path('apps/studio-api/LIVE-CAPTURE-worker.js')

          if content_type.lower().startswith('multipart/'):
              msg = BytesParser(policy=default).parsebytes(
                  f'Content-Type: {content_type}\r\nMIME-Version: 1.0\r\n\r\n'.encode() + body
              )
              candidates = []
              for part in msg.iter_parts():
                  ctype = part.get_content_type().lower()
                  filename = part.get_filename() or ''
                  payload = part.get_payload(decode=True) or b''
                  if 'javascript' in ctype or filename.lower().endswith(('.js', '.mjs')):
                      candidates.append((filename, ctype, payload))
              if not candidates:
                  raise SystemExit('No JavaScript module found in Worker multipart response')
              preferred = next((x for x in candidates if x[0] in ('worker.js','index.js','src/index.js')), candidates[0])
              out.write_bytes(preferred[2])
          else:
              out.write_bytes(body)
          PY

          test -s "$DEST/LIVE-CAPTURE-worker.js"
          if ! grep -qE 'export default|addEventListener\(|chicagoshining-studio-api' "$DEST/LIVE-CAPTURE-worker.js"; then
            echo 'Captured Worker content does not look like Studio API source.' >&2
            exit 1
          fi
          printf 'Captured from Cloudflare Worker: chicagoshining-studio-api\nCapture method: Workers Scripts Content API /content/v2\nCaptured at: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$DEST/LIVE-BASELINE.txt"

      - name: Capture currently served Studio Pages files
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://chicagoshining-studio.pages.dev'
          DEST="$GITHUB_WORKSPACE/apps/studio-web"
          mkdir -p "$DEST"
          rm -rf "$DEST/assets" "$DEST/api"
          curl -fsSL "$BASE/" -o "$DEST/index.html"

          node - "$DEST/index.html" <<'NODE' > /tmp/page-assets.txt
          const fs = require('fs');
          const html = fs.readFileSync(process.argv[2], 'utf8');
          const found = new Set();
          const addRef = (raw) => {
            let p = String(raw || '').trim();
            if (!p || /^(?:https?:|data:|mailto:|javascript:)/i.test(p)) return;
            p = p.split('#')[0].split('?')[0];
            if (!p.startsWith('/')) p = '/' + p.replace(/^\.\//, '');
            if (!p.startsWith('/assets/')) return;
            found.add(p);
          };
          for (const m of html.matchAll(/(?:src|href)=["']([^"']+)["']/gi)) addRef(m[1]);
          const manifestMatch = html.match(/id="studioLazyManifest"[^>]*>\s*([\s\S]*?)\s*<\/script>/i);
          if (manifestMatch) {
            const manifest = JSON.parse(manifestMatch[1]);
            const walk = (value) => {
              if (typeof value === 'string') addRef(value);
              else if (Array.isArray(value)) value.forEach(walk);
              else if (value && typeof value === 'object') Object.values(value).forEach(walk);
            };
            walk(manifest);
          }
          for (const p of [...found].sort()) console.log(p);
          NODE

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            mkdir -p "$DEST/$(dirname "${path#/}")"
            curl -fsSL "$BASE$path" -o "$DEST/${path#/}"
          done < /tmp/page-assets.txt

          test -n "$(find "$DEST/assets" -maxdepth 1 -type f -name 'app-*.js' -print -quit)"
          test -n "$(find "$DEST/assets" -maxdepth 1 -type f -name '*.css' -print -quit)"
          printf 'Captured from Cloudflare Pages project: chicagoshining-studio\nSource URL: %s\nCaptured at: %s\n' "$BASE" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$DEST/LIVE-BASELINE.txt"

      - name: Guard against credential files
        shell: bash
        run: |
          set -euo pipefail
          if find apps/studio-api apps/studio-web -type f \( -name '.env' -o -name '.env.*' -o -name '.dev.vars' -o -name '.dev.vars.*' \) | grep -q .; then
            echo 'Credential file detected; refusing to commit.' >&2
            exit 1
          fi

      - name: Commit corrected live baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SM Pipeline Cloudflare Capture'
          git config user.email 'actions@users.noreply.github.com'
          git add -A apps/studio-api apps/studio-web
          if git diff --cached --quiet; then
            echo 'No source changes to capture.'
            exit 0
          fi
          git commit -m 'Correct live Cloudflare Worker and Pages baseline'
          git push
