name: Apply Top-Five Repair Safety Patch

on:
  push:
    branches: [repair/top5-safety-20260816]
    paths:
      - 'deploy/repair-safety-v1.patch'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sm-pipeline-top5-safety-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v6
        with:
          ref: repair/top5-safety-20260816
          fetch-depth: 0

      - name: Verify exact Worker baseline
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/studio-api/worker.js
          ACTUAL=$(git hash-object apps/studio-api/worker.js)
          EXPECTED=54cdbd566bdbe969a292819a71f414c234da7338
          echo "worker_blob=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Apply and validate safety patch
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy/repair-safety-v1.patch
          echo '7306b18841af5407f4fe217a6e25695e2cf3d6d8f839b3e23e07e1be9a3ce288  deploy/repair-safety-v1.patch' | sha256sum -c -
          git apply --check deploy/repair-safety-v1.patch
          git apply deploy/repair-safety-v1.patch
          node --check apps/studio-api/worker.js
          grep -q 'repair_activation_leases_v1: true' apps/studio-api/worker.js
          grep -q 'repair_exact_output_test_mode_v1: true' apps/studio-api/worker.js
          grep -q 'Standalone ACTIVATE/RUN is intentionally disabled' apps/studio-api/worker.js
          grep -q 'pulse_admin_bridge' apps/studio-api/worker.js
          git diff --check

      - name: Commit validated Worker safety layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SM Pipeline Repair Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/studio-api/worker.js
          if git diff --cached --quiet; then
            echo 'No Worker change required.'
            exit 0
          fi
          git commit -m 'Add leased repair control and exact-output test mode'
          git push origin HEAD:repair/top5-safety-20260816
