name: Repair Lease Watchdog V2

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'deploy/repair-lease-watchdog-v2.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sm-pipeline-repair-lease-watchdog-v2
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      BRIDGE_WORKER: chicagoshining-repair-watchdog-v2-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Capture production Worker identity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/deployments-before.json
          jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/deployments-before.json >/tmp/active-before.txt

      - name: Build one-time watchdog bridge
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(python - <<'PY'
          import secrets; print(secrets.token_urlsafe(36))
          PY
          ); printf '%s' "$TOKEN" >/tmp/path-token.txt
          cat >/tmp/worker.js <<EOF
          export default {async fetch(request,env){const u=new URL(request.url);if(u.pathname==="/$TOKEN/ready")return Response.json({ok:true,ready:true},{headers:{"Cache-Control":"no-store"}});if(u.pathname!=="/$TOKEN/execute")return new Response("Not found",{status:404});const r=await env.STUDIO_API.fetch(new Request("https://studio.chicagoshining.com/api/admin/repair/control",{method:"POST",headers:{"Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com","Origin":"https://studio.chicagoshining.com","Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({action:"sweep"})}));return new Response(await r.text(),{status:r.status,headers:{"Content-Type":"application/json","Cache-Control":"no-store"}})}};
          EOF
          cat >/tmp/metadata.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF
          node --check /tmp/worker.js

      - name: Upload temporary watchdog bridge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$ROOT/workers/scripts/$BRIDGE_WORKER" -H "$AUTH" >/dev/null || true
          code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X PUT "$ROOT/workers/scripts/$BRIDGE_WORKER/content" -H "$AUTH" -F 'metadata=@/tmp/metadata.json;type=application/json' -F 'worker.js=@/tmp/worker.js;type=application/javascript+module;filename=worker.js')
          test "$code" -ge 200 -a "$code" -lt 300; jq -e '.success==true' /tmp/upload.json >/dev/null
          curl -fsS -X POST "$ROOT/workers/scripts/$BRIDGE_WORKER/subdomain" -H "$AUTH" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' >/dev/null
          curl -fsS "$ROOT/workers/subdomain" -H "$AUTH" -o /tmp/account-subdomain.json

      - name: Wait for bridge readiness
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN=$(jq -er '.result.subdomain' /tmp/account-subdomain.json); TOKEN=$(cat /tmp/path-token.txt); URL="https://$BRIDGE_WORKER.$SUBDOMAIN.workers.dev/$TOKEN/ready"
          ready=false
          for i in $(seq 1 20); do code=$(curl -sS --max-time 20 -o /tmp/ready.json -w '%{http_code}' "$URL" || true); if [[ "$code" == '200' ]] && jq -e '.ok==true and .ready==true' /tmp/ready.json >/dev/null 2>&1; then ready=true; break; fi; sleep 2; done
          test "$ready" = true

      - name: Sweep expired or exhausted leases once after transport readiness
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN=$(jq -er '.result.subdomain' /tmp/account-subdomain.json); TOKEN=$(cat /tmp/path-token.txt); URL="https://$BRIDGE_WORKER.$SUBDOMAIN.workers.dev/$TOKEN/execute"
          got_json=false
          for i in $(seq 1 12); do
            code=$(curl -sS --max-time 90 -o /tmp/result.json -w '%{http_code}' "$URL" || true)
            if [[ "$code" == '200' ]] && jq -e '.ok==true and .action=="sweep"' /tmp/result.json >/dev/null 2>&1; then got_json=true; break; fi
            if jq -e 'type=="object" and has("ok")' /tmp/result.json >/dev/null 2>&1; then break; fi
            sleep 2
          done
          test "$got_json" = true
          jq -c '{ok,action,swept_count:(.swept|length),swept}' /tmp/result.json

      - name: Delete temporary watchdog bridge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE "$ROOT/workers/scripts/$BRIDGE_WORKER" -H "$AUTH")
          if [[ "$code" != '404' && ( "$code" -lt 200 || "$code" -ge 300 ) ]]; then exit 1; fi

      - name: Verify production Worker unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$API/deployments" -H "$AUTH" -o /tmp/deployments-after.json
          test "$(cat /tmp/active-before.txt)" = "$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/deployments-after.json)"

      - name: Upload bounded watchdog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-lease-watchdog-v2-${{ github.run_id }}
          path: /tmp/result.json
          if-no-files-found: ignore
          retention-days: 14
