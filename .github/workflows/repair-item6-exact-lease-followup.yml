name: Repair Item6 Exact Lease Follow-up

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-item6-exact-lease-followup.yml'

permissions:
  contents: write

concurrency:
  group: item6-exact-lease-followup-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Await repair-control route handlers inside outer error boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/studio-api/worker.js')
          s = p.read_text()
          old_get = '        if (request.method === "GET") return adminRepairControlStatus(request, env);'
          new_get = '        if (request.method === "GET") return await adminRepairControlStatus(request, env);'
          old_post = '        return adminRepairControl(request, env, authorization);'
          new_post = '        return await adminRepairControl(request, env, authorization);'
          if s.count(old_get) != 1:
              raise SystemExit(f'Expected one non-awaited repair GET route, found {s.count(old_get)}')
          if s.count(old_post) != 1:
              raise SystemExit(f'Expected one non-awaited repair POST route, found {s.count(old_post)}')
          s = s.replace(old_get, new_get, 1).replace(old_post, new_post, 1)
          p.write_text(s)
          if s.count(new_get) != 1 or s.count(new_post) != 1:
              raise SystemExit('Awaited repair route boundary not installed exactly once')
          a = s.index('async function repairFindLease(env, input) {')
          b = s.index('\nasync function repairReserveBudget', a)
          exact = s[a:b]
          if 'const exactMarker' not in exact or 'Correlation_ID' not in exact:
              raise SystemExit('Exact lease address implementation missing')
          if 'repairLeaseRecords(env, scenarioId)' in exact:
              raise SystemExit('Scenario-list follow-up lookup unexpectedly restored')
          print('repair_get_async_rejection_caught=PASS')
          print('repair_post_async_rejection_caught=PASS')
          print('exact_lease_lookup_preserved=PASS')
          PY
          node --check apps/studio-api/worker.js
          git diff --check
          git diff -- apps/studio-api/worker.js

      - name: Commit authoritative source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio-api/worker.js
          git commit -m 'fix(item6): catch async repair-control failures'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Deploy exact committed source with rollback
        shell: bash
        run: |
          set -euo pipefail
          if ! bash repair/scripts/deploy-item6-studio-controller-v2.sh; then
            git revert --no-edit "${{ steps.commit.outputs.sha }}"
            git push origin HEAD:main
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${{ steps.commit.outputs.sha }}"

      - name: Save deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item6-exact-lease-followup-repair-${{ github.run_id }}
          path: |
            /tmp/item6v2-bindings-before.json
            /tmp/item6v2-bindings-after.json
            /tmp/item6v2-session.json
            /tmp/item6v2-source-sha256.txt
            /tmp/item6v2-active-before.txt
            /tmp/item6v2-active-after.txt
            /tmp/item6v2-dry-run.log
            /tmp/item6v2-deploy.log
          if-no-files-found: ignore
          retention-days: 30
