name: Repair Item6 Exact Lease Follow-up

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-item6-exact-lease-followup.yml'

permissions:
  contents: write

concurrency:
  group: item6-exact-lease-followup-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Consolidate stale lease cleanup on acquire
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/studio-api/worker.js')
          s=p.read_text()
          a=s.index('async function repairAcquireLease(env, input, authorization) {')
          ae=s.index('\nasync function repairFindLease',a)
          block=s[a:ae]
          old='  await repairSweepExpiredLeases(env, scenarioId);\n  const overlaps = (await repairLeaseRecords(env, scenarioId)).map(repairLeaseState).filter((l) => l.lease_id !== leaseId);\n  if (overlaps.length) throw new HttpError(409, `Scenario ${scenarioId} already has an active repair lease`);\n'
          new='''  const existingLeases = (await repairLeaseRecords(env, scenarioId)).map(repairLeaseState).filter((l) => l.lease_id !== leaseId);\n  const nowMs = Date.now();\n  const staleLeases = existingLeases.filter((l) => {\n    const expiry = repairIsoMs(l.expires_at);\n    const exhausted = l.operations_used >= Number(l.contract.max_operations || 0) || l.runs_used >= Number(l.contract.max_runs || 0);\n    return (Number.isFinite(expiry) && expiry <= nowMs) || exhausted;\n  });\n  const activeOverlaps = existingLeases.filter((l) => !staleLeases.includes(l));\n  if (activeOverlaps.length) throw new HttpError(409, `Scenario ${scenarioId} already has an active repair lease`);\n  if (staleLeases.length) {\n    const staleWithRuns = staleLeases.filter((l) => l.runs_used > 0);\n    let stopped = null;\n    if (staleWithRuns.length) {\n      try { stopped = await phase6StopScenarioVerified(env, scenarioId, 2); }\n      catch (e) { throw new HttpError(502, `Could not verify scenario ${scenarioId} inactive before replacing stale repair lease: ${e instanceof Error ? e.message : String(e)}`); }\n      if (stopped?.inactive !== true) throw new HttpError(502, `Could not verify scenario ${scenarioId} inactive before replacing stale repair lease`);\n    }\n    for (const stale of staleLeases) {\n      await repairCloseLease(env, stale, "expired", {\n        reason: stale.runs_used > 0 ? "lease-expired-before-reacquire-scenario-stopped" : "lease-expired-before-reacquire-no-runs",\n        scenario_stopped: stale.runs_used > 0 ? stopped?.inactive === true : null,\n        replacement_lease_id: leaseId,\n        replacement_test_run_id: testRunId,\n      });\n    }\n  }\n'''
          if block.count(old)!=1: raise SystemExit(f'Expected acquire sweep block once, found {block.count(old)}')
          block=block.replace(old,new,1)
          s=s[:a]+block+s[ae:]
          f=s.index('async function repairFindLease(env, input) {'); fe=s.index('\nasync function repairReserveBudget',f)
          if 'repairSweepExpiredLeases' in s[f:fe]: raise SystemExit('repairFindLease must remain sweep-free')
          if 'await repairSweepExpiredLeases(env, scenarioId);' in block: raise SystemExit('Acquire still invokes sweep')
          if 'lease-expired-before-reacquire-no-runs' not in block: raise SystemExit('Consolidated cleanup missing')
          if 'return respond(request, env, { ok: true, action, swept: await repairSweepExpiredLeases(env) });' not in s: raise SystemExit('Global maintenance sweep missing')
          p.write_text(s)
          print('consolidated_acquire_cleanup=PASS')
          PY
          node --check apps/studio-api/worker.js
          git diff --check
      - name: Commit authoritative source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio-api/worker.js
          git commit -m 'fix(item6): consolidate stale lease cleanup on acquire'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main
      - name: Deploy exact committed source with rollback
        shell: bash
        run: |
          set -euo pipefail
          if ! bash repair/scripts/deploy-item6-studio-controller-v2.sh; then
            git revert --no-edit "${{ steps.commit.outputs.sha }}"
            git push origin HEAD:main
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${{ steps.commit.outputs.sha }}"
      - name: Save deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item6-exact-lease-followup-repair-${{ github.run_id }}
          path: |
            /tmp/item6v2-bindings-before.json
            /tmp/item6v2-bindings-after.json
            /tmp/item6v2-session.json
            /tmp/item6v2-source-sha256.txt
            /tmp/item6v2-active-before.txt
            /tmp/item6v2-active-after.txt
            /tmp/item6v2-dry-run.log
            /tmp/item6v2-deploy.log
          if-no-files-found: ignore
          retention-days: 30
