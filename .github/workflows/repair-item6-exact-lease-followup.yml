name: Repair Item6 Exact Lease Follow-up

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-item6-exact-lease-followup.yml'

permissions:
  contents: write

concurrency:
  group: item6-exact-lease-followup-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Surgically patch exact lease lookup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/studio-api/worker.js')
          s=p.read_text()
          start=s.index('async function repairFindLease(env, input) {')
          end=s.index('\nasync function repairReserveBudget', start)
          block=s[start:end]
          needle='  await repairSweepExpiredLeases(env);\n'
          if block.count(needle) != 1:
              raise SystemExit(f'Expected exactly one global sweep in repairFindLease, found {block.count(needle)}')
          block=block.replace(needle,'',1)
          s2=s[:start]+block+s[end:]
          astart=s2.index('async function repairAcquireLease(env, input, authorization) {')
          aend=s2.index('\nasync function repairFindLease', astart)
          acquire=s2[astart:aend]
          if 'await repairSweepExpiredLeases(env);' not in acquire:
              raise SystemExit('Acquire path no longer contains required global expiry sweep')
          if 'await repairSweepExpiredLeases(env);' in block:
              raise SystemExit('Exact repairFindLease still contains global sweep')
          p.write_text(s2)
          print('exact_followup_sweep_removed=PASS')
          print('acquire_sweep_preserved=PASS')
          PY
          node --check apps/studio-api/worker.js
          git diff --check
          git diff -- apps/studio-api/worker.js

      - name: Commit authoritative source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio-api/worker.js
          git commit -m 'fix(item6): make exact lease follow-ups exact'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Deploy exact committed source with rollback
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          if ! bash repair/scripts/deploy-item6-studio-controller-v2.sh; then
            echo 'deploy_failed_reverting_source=1'
            git revert --no-edit "${{ steps.commit.outputs.sha }}"
            git push origin HEAD:main
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${{ steps.commit.outputs.sha }}"
          echo 'source_and_live_deploy=PASS'

      - name: Save deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item6-exact-lease-followup-repair-${{ github.run_id }}
          path: |
            /tmp/item6v2-bindings-before.json
            /tmp/item6v2-bindings-after.json
            /tmp/item6v2-session.json
            /tmp/item6v2-source-sha256.txt
            /tmp/item6v2-active-before.txt
            /tmp/item6v2-active-after.txt
            /tmp/item6v2-dry-run.log
            /tmp/item6v2-deploy.log
          if-no-files-found: ignore
          retention-days: 30
