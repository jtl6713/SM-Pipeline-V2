name: One-shot Studio covers 1857 1858 publish to R2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/studio-replace-covers-1857-1858-20261030.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-shot-cover-1857-1858
  cancel-in-progress: false

jobs:
  replace-covers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Download and validate EXACT approved 9x16 covers from existing public Drive file IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/studio-cover-repair
          while IFS=' ' read -r cid drive_id expected_hash; do
            test -n "$cid" || continue
            curl -fsSL --retry 3 --max-time 50 \
              "https://drive.google.com/uc?export=download&id=${drive_id}&confirm=t" \
              -o "/tmp/studio-cover-repair/${cid}.jpg"
            printf '%s  %s\n' "$expected_hash" "/tmp/studio-cover-repair/${cid}.jpg" | sha256sum -c -
            MIME="$(file -b --mime-type "/tmp/studio-cover-repair/${cid}.jpg")"
            test "$MIME" = image/jpeg
            python3 - "$cid" <<'PY'
          import sys
          from pathlib import Path
          b=Path('/tmp/studio-cover-repair/'+sys.argv[1]+'.jpg').read_bytes()
          assert b[:2]==bytes.fromhex('ffd8') and b[-2:]==bytes.fromhex('ffd9')
          assert 100_000 < len(b) < 3_000_000
          print(f'cover_validated={sys.argv[1]} size={len(b)}')
          PY
          done <<'COVERS'
          1857 1ip_rWjQbBKAolgORjfEks_jBgDhB8n96 113a568e7e360d5c90e6541a01d5091c79476ca940db0358ddabaf83b068472b
          1858 17XOAQ_SRQfosgGyRaofaA3KFDwpDy7WV 57d1b6fb6f36df30dcae2e0e8cc94f4054cddaeea50acb148287d10607afb974
          COVERS

      - name: Discover authoritative live R2 bucket without changing Worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/chicagoshining-studio-api"
          curl -fsS "$API/deployments" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/studio-cover-repair/deployments.json
          VERSION="$(jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id' /tmp/studio-cover-repair/deployments.json)"
          curl -fsS "$API/versions/$VERSION" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/studio-cover-repair/version.json
          BUCKET="$(jq -er '.result.resources.bindings[] | select(.name=="STUDIO_MEDIA" and .type=="r2_bucket") | (.bucket_name // .bucket)' /tmp/studio-cover-repair/version.json)"
          test -n "$BUCKET"
          # The public media hostname uses the upload Worker bucket, which may
          # differ from the Studio API worker's private STUDIO_MEDIA binding.
          UPLOAD_API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/chicagoshining-r2-upload"
          curl -fsS "$UPLOAD_API/deployments" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/studio-cover-repair/upload-deployments.json
          UPLOAD_VERSION="$(jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id' /tmp/studio-cover-repair/upload-deployments.json)"
          curl -fsS "$UPLOAD_API/versions/$UPLOAD_VERSION" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/studio-cover-repair/upload-version.json
          PUBLIC_BUCKET="$(jq -er '[.result.resources.bindings[] | select(.type=="r2_bucket") | select(.name=="PUBLISH_BUCKET" or .name=="STUDIO_MEDIA" or .name=="MEDIA_BUCKET" or .name=="BUCKET")] | sort_by(if .name=="PUBLISH_BUCKET" then 0 elif .name=="STUDIO_MEDIA" then 1 elif .name=="MEDIA_BUCKET" then 2 else 3 end) | first | (.bucket_name // .bucket)' /tmp/studio-cover-repair/upload-version.json)"
          test -n "$PUBLIC_BUCKET"
          echo "STUDIO_MEDIA_BUCKET=$PUBLIC_BUCKET" >> "$GITHUB_ENV"
          echo "public_r2_bucket_discovered=PASS"
          if [[ "$BUCKET" == "$PUBLIC_BUCKET" ]]; then
            echo "Production Studio and public upload buckets match."
          else
            echo "Production Studio and public upload use distinct R2 buckets."
          fi

      - name: Create temporary least-privilege R2-bound Worker and send only two verified covers
        shell: bash
        run: |
          set -euo pipefail
          WORKER="chicagoshining-studio-cover-1857-1858-once"
          printf '%s' "$WORKER" > /tmp/studio-cover-repair/worker-name
          openssl rand -hex 32 > /tmp/studio-cover-repair/one-time-token
          python3 - <<'PY'
          from pathlib import Path
          token=Path('/tmp/studio-cover-repair/one-time-token').read_text().strip()
          js="""const secret = "__SECRET__";
          const items = {
            "1857": {key:"studio/previews/thumbnails/recPFH9PAvFcFmk6k/cover-20261030-revised-9x16.jpg", sha:"113a568e7e360d5c90e6541a01d5091c79476ca940db0358ddabaf83b068472b"},
            "1858": {key:"studio/previews/thumbnails/recaqlkDfkQRQAlxw/cover-20261030-revised-9x16.jpg", sha:"57d1b6fb6f36df30dcae2e0e8cc94f4054cddaeea50acb148287d10607afb974"}
          };
          export default {async fetch(request,env) {
            const id = new URL(request.url).pathname.replace(/^\\//,"");
            const item=items[id];
            if (request.method !== "PUT" || !item) return new Response("Not found",{status:404});
            if (request.headers.get("X-One-Shot-Token") !== secret) return new Response("Forbidden",{status:403});
            if (request.headers.get("Content-Type") !== "image/jpeg") return new Response("Bad type",{status:415});
            const bytes=await request.arrayBuffer();
            if (bytes.byteLength < 100000 || bytes.byteLength > 3000000) return new Response("Bad size",{status:400});
            const hash=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes)),x=>x.toString(16).padStart(2,"0")).join("");
            if (hash !== item.sha) return new Response("SHA256 mismatch",{status:409});
            await env.STUDIO_MEDIA.put(item.key,bytes,{httpMetadata:{contentType:"image/jpeg",cacheControl:"public, max-age=300"},customMetadata:{purpose:"one-shot-authorized-studio-thumbnail-replacement", contentId:id}});
            return Response.json({ok:true,id,key:item.key,sha:hash});
          }};
          """
          Path('/tmp/studio-cover-repair/worker.js').write_text(js.replace('__SECRET__',token))
          PY
          metadata="$(jq -cn --arg bucket "$STUDIO_MEDIA_BUCKET" '{main_module:"worker.js",bindings:[{name:"STUDIO_MEDIA",type:"r2_bucket",bucket_name:$bucket}]}')"
          code="$(curl -sS -o /tmp/studio-cover-repair/worker-create.json -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F "metadata=$metadata;type=application/json" \
            -F "worker.js=@/tmp/studio-cover-repair/worker.js;type=application/javascript+module")"
          if [[ "$code" -lt 200 || "$code" -ge 300 ]]; then
            echo "Temporary Worker creation failed with HTTP $code" >&2
            jq '{success,errors,messages}' /tmp/studio-cover-repair/worker-create.json >&2 || true
            exit 1
          fi
          jq -e '.success==true' /tmp/studio-cover-repair/worker-create.json >/dev/null
          # A newly uploaded Worker script version is not necessarily active.
          # Explicitly deploy it at 100% before enabling its workers.dev route.
          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/versions" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o /tmp/studio-cover-repair/versions.json
          VERSION_ID="$(jq -er '(.result.items // .result.versions // .result | if type == "array" then . else [] end) | sort_by(.number // 0) | last | .id' /tmp/studio-cover-repair/versions.json)"
          jq -cn --arg v "$VERSION_ID" '{strategy:"percentage",versions:[{version_id:$v,percentage:100}]}' \
            > /tmp/studio-cover-repair/deploy-payload.json
          deploy_code="$(curl -sS -o /tmp/studio-cover-repair/deploy-result.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/studio-cover-repair/deploy-payload.json)"
          if [[ "$deploy_code" -lt 200 || "$deploy_code" -ge 300 ]]; then
            echo "Temporary Worker deployment failed HTTP $deploy_code" >&2
            jq '{success,errors,messages}' /tmp/studio-cover-repair/deploy-result.json >&2 || true
            exit 1
          fi
          jq -e '.success == true' /tmp/studio-cover-repair/deploy-result.json >/dev/null
          echo "temporary_cover_worker_deployed=PASS"
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' \
            -o /tmp/studio-cover-repair/subdomain.json
          jq -e '.success==true and .result.enabled==true' /tmp/studio-cover-repair/subdomain.json >/dev/null
          for cid in 1857 1858; do
            code="000"
            for attempt in $(seq 1 15); do
              code="$(curl -sS -o "/tmp/studio-cover-repair/upload-$cid.json" -w '%{http_code}' \
                -X PUT "https://$WORKER.joseph-t-logan.workers.dev/$cid" \
                -H "X-One-Shot-Token: $(cat /tmp/studio-cover-repair/one-time-token)" \
                -H 'Content-Type: image/jpeg' \
                --data-binary "@/tmp/studio-cover-repair/$cid.jpg" || true)"
              if [[ "$code" == "200" ]]; then break; fi
              # Brand-new Workers.dev routes may initially return 404/1042
              # while the route propagates; never retry unauthorized requests.
              if [[ "$code" != "404" && "$code" != "503" && "$code" != "000" ]]; then break; fi
              echo "temporary_worker_route_propagating=$cid attempt=$attempt status=$code"
              sleep 5
            done
            if [[ "$code" != "200" ]]; then
              echo "Temporary Worker cover upload failed for $cid with HTTP $code" >&2
              head -c 400 "/tmp/studio-cover-repair/upload-$cid.json" >&2 || true
              exit 1
            fi
            jq -e --arg id "$cid" '.ok == true and .id == $id' "/tmp/studio-cover-repair/upload-$cid.json" >/dev/null
            echo "r2_cover_uploaded=$cid"
          done

      - name: Verify exactly matching public CDN bytes before Airtable can reference covers
        shell: bash
        run: |
          set -euo pipefail
          while IFS=' ' read -r cid rec expected_hash; do
            test -n "$cid" || continue
            key="studio/previews/thumbnails/$rec/cover-20261030-revised-9x16.jpg"
            url="https://media.chicagoshining.com/$key"
            old_url="https://media.chicagoshining.com/studio/previews/thumbnails/$rec/cover-9x16.png"
            old_status="$(curl -sSL -o /tmp/studio-cover-repair/old-$cid.png -w '%{http_code}' "$old_url" || true)"
            echo "old_public_cover_http=$cid:$old_status"
            status="000"
            for attempt in $(seq 1 8); do
              status="$(curl -sSL -o "/tmp/studio-cover-repair/public-$cid.jpg" -w '%{http_code}' "$url" || true)"
              if [[ "$status" == "200" ]]; then break; fi
              echo "new_public_cover_http=$cid:$status attempt=$attempt"
              sleep 4
            done
            test "$status" = "200"
            printf '%s  %s\n' "$expected_hash" "/tmp/studio-cover-repair/public-$cid.jpg" | sha256sum -c -
            echo "public_cover_verified=$cid url=$url"
            echo "- $cid: $url (SHA-256 verified)" >> "$GITHUB_STEP_SUMMARY"
          done <<'RECORDS'
          1857 recPFH9PAvFcFmk6k 113a568e7e360d5c90e6541a01d5091c79476ca940db0358ddabaf83b068472b
          1858 recaqlkDfkQRQAlxw 57d1b6fb6f36df30dcae2e0e8cc94f4054cddaeea50acb148287d10607afb974
          RECORDS
          echo "Public cover delivery PASS. Airtable updates are a separate, manually verified step." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary upload Worker regardless of outcome
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/studio-cover-repair/worker-name ]]; then exit 0; fi
          WORKER="$(cat /tmp/studio-cover-repair/worker-name)"
          code="$(curl -sS -o /tmp/studio-cover-repair/worker-delete.json -w '%{http_code}' -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          if [[ "$code" -lt 200 || "$code" -ge 300 ]]; then
            echo "SECURITY: Temporary Worker cleanup failed HTTP $code" >&2
            jq '{success,errors,messages}' /tmp/studio-cover-repair/worker-delete.json >&2 || true
            exit 1
          fi
          jq -e '.success==true' /tmp/studio-cover-repair/worker-delete.json >/dev/null
          echo "temporary_cover_worker_removed=PASS"
