name: Read Item 5 Controller Context

on:
  push:
    branches: [main]
    paths: ['deploy/read-item5-controller-context.txt']

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Extract only relevant controller ranges
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/studio-api/worker.js')
          s=p.read_text(encoding='utf-8')
          needles=[
            'const REPAIR_CONTROL_SCENARIOS',
            'async function adminRepairControl(',
            'pulse_r4_scheduled_selector',
            'async function phase6StopScenarioVerified',
            'async function phase6MakeApiJson',
            'confirmed=true',
            'function repairLeaseState',
            'async function repairReserveBudget',
          ]
          out=[]
          for needle in needles:
            pos=s.find(needle)
            out.append('\n===== '+needle+' =====\n')
            if pos<0:
              out.append('NOT FOUND\n')
              continue
            start=max(0,pos-2500); end=min(len(s),pos+7500)
            out.append(s[start:end])
            out.append('\n')
          Path('/tmp/item5-controller-context.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: item5-controller-context-${{ github.run_id }}
          path: /tmp/item5-controller-context.txt
          retention-days: 7
