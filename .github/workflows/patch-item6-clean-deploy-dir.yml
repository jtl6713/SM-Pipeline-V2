name: Patch Item6 Clean Deploy Dir

on:
  push:
    branches: [main]
    paths: ['deploy/patch-item6-clean-deploy-dir.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Separate Wrangler install from Worker source
        shell: bash
        run: |
          set -euo pipefail
          python repair/scripts/patch-item6-clean-deploy-dir.py
          bash -n repair/scripts/deploy-item6-studio-controller.sh
          git diff --check
          grep -q '/tmp/item6-worker-deploy' repair/scripts/deploy-item6-studio-controller.sh
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SM Pipeline Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add repair/scripts/deploy-item6-studio-controller.sh
          git diff --cached --quiet && exit 0
          git commit -m 'item6: isolate Worker source from Wrangler dependencies'
          git push origin HEAD:main
