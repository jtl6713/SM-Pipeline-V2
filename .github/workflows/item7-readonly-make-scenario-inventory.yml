name: Item7 Readonly Make Scenario Inventory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/item7-readonly-make-scenario-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      BRIDGE_WORKER: chicagoshining-item7-inventory-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - name: Build exact-version read-only bridge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$ROOT/workers/scripts/$TARGET_WORKER/deployments" -H "$AUTH" -o /tmp/deployments-before.json
          ACTIVE=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|select(.percentage==100)|.version_id' /tmp/deployments-before.json)
          printf '%s' "$ACTIVE" >/tmp/active.txt
          TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          printf '%s' "$TOKEN" >/tmp/token.txt
          cat >/tmp/bridge.js <<EOF
          export default {async fetch(request,env){
            const u=new URL(request.url);
            if(u.pathname==="/$TOKEN/ready") return Response.json({ok:true});
            if(u.pathname!=="/$TOKEN/execute") return new Response("Not found",{status:404});
            const command={action:"list_make_scenarios_compact",confirm:"LIST-MAKE-SCENARIOS-COMPACT-V1"};
            const r=await env.STUDIO_API.fetch(new Request("https://studio-api.internal/api/admin/repair/control",{method:"POST",headers:{"Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com","Origin":"https://studio.chicagoshining.com","Content-Type":"application/json","Accept":"application/json","Cloudflare-Workers-Version-Overrides":"$TARGET_WORKER=\"$ACTIVE\""},body:JSON.stringify(command)}));
            return new Response(await r.text(),{status:r.status,headers:{"Content-Type":r.headers.get("Content-Type")||"application/json","Cache-Control":"no-store"}});
          }};
          EOF
          cat >/tmp/metadata.json <<EOF
          {"main_module":"bridge.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF
          node --check /tmp/bridge.js
      - name: Execute inventory
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -X PUT "$ROOT/workers/scripts/$BRIDGE_WORKER/content" -H "$AUTH" -F 'metadata=@/tmp/metadata.json;type=application/json' -F 'bridge.js=@/tmp/bridge.js;type=application/javascript+module;filename=bridge.js' -o /tmp/upload.json
          jq -e '.success==true' /tmp/upload.json >/dev/null
          curl -fsS -X POST "$ROOT/workers/scripts/$BRIDGE_WORKER/subdomain" -H "$AUTH" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' >/dev/null
          curl -fsS "$ROOT/workers/subdomain" -H "$AUTH" -o /tmp/subdomain.json
          SUB=$(jq -er '.result.subdomain' /tmp/subdomain.json); T=$(cat /tmp/token.txt)
          for i in $(seq 1 20); do code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' "https://$BRIDGE_WORKER.$SUB.workers.dev/$T/ready" || true); [[ "$code" == 200 ]] && break; sleep 1; done
          test "$code" = 200
          code=$(curl -sS --max-time 120 -o /tmp/inventory.json -w '%{http_code}' "https://$BRIDGE_WORKER.$SUB.workers.dev/$T/execute" || true)
          echo "inventory_http=$code"
          test "$code" = 200
          jq -e '.ok==true and .action=="list_make_scenarios_compact"' /tmp/inventory.json >/dev/null
          jq -c '.inventory' /tmp/inventory.json
          echo '--- render/review candidates ---'
          jq -c '[.inventory.scenarios[]? | select((.name|ascii_downcase|test("(^|[^a-z])(r2|r3|r4|r5|rr1)([^a-z]|$)|render|review|asset selection|render prep|poll")))]' /tmp/inventory.json
      - name: Delete bridge and verify production unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$ROOT/workers/scripts/$BRIDGE_WORKER" -H "$AUTH" >/dev/null || true
          curl -fsS "$ROOT/workers/scripts/$TARGET_WORKER/deployments" -H "$AUTH" -o /tmp/deployments-after.json
          test "$(cat /tmp/active.txt)" = "$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/deployments-after.json)"
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item7-make-scenario-inventory-${{ github.run_id }}
          path: |
            /tmp/inventory.json
            /tmp/deployments-before.json
            /tmp/deployments-after.json
          if-no-files-found: ignore
          retention-days: 30
