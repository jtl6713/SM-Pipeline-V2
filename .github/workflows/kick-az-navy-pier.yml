name: Kick AZ Navy Pier Compress/Advance

on:
  push:
    branches: [main]
    paths:
      - 'deploy/kick-az-navy-pier.txt'
      - '.github/workflows/kick-az-navy-pier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kick-az-navy-pier
  cancel-in-progress: false

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      VERIFY_BRIDGE: chicagoshining-az-navy-kick
    steps:
      - uses: actions/checkout@v6

      - name: Wait for Worker version az-mains-queued then phased kick via service binding
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          TOKEN=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )
          printf '%s' "$TOKEN" >/tmp/verify-token.txt
          cat >/tmp/verify-worker.js <<EOF
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== "/$TOKEN") return new Response("Not found", {status:404});
              const want = url.searchParams.get("mode") || "kick";
              const phase = url.searchParams.get("phase") || "auto";
              const path = want === "health"
                ? "/api/health"
                : "/api/ops/az-navy-pier-kick?phase=" + encodeURIComponent(phase);
              const method = want === "health" ? "GET" : "POST";
              const internal = new Request("https://studio.chicagoshining.com" + path, {
                method,
                headers:{
                  "Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com",
                  "Origin":"https://studio.chicagoshining.com",
                  "Accept":"application/json",
                  "Content-Type":"application/json"
                },
                body: method === "POST" ? "{}" : undefined
              });
              const response = await env.STUDIO_API.fetch(internal);
              return new Response(await response.text(), {status:response.status,headers:{"Content-Type":"application/json","Cache-Control":"no-store"}});
            }
          };
          EOF
          cat >/tmp/verify-metadata.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF
          node --check /tmp/verify-worker.js
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$API_ROOT/workers/scripts/$VERIFY_BRIDGE" -H "$AUTH" >/dev/null || true
          code=$(curl -sS -o /tmp/verify-upload.json -w '%{http_code}' -X PUT "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/content" -H "$AUTH" \
            -F 'metadata=@/tmp/verify-metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/verify-worker.js;type=application/javascript+module;filename=worker.js')
          test "$code" -ge 200 -a "$code" -lt 300
          curl -fsS -X POST "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/subdomain" -H "$AUTH" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' >/tmp/verify-subdomain.json
          curl -fsS "$API_ROOT/workers/subdomain" -H "$AUTH" -o /tmp/account-subdomain.json
          SUBDOMAIN=$(jq -er '.result.subdomain' /tmp/account-subdomain.json)
          URL="https://$VERIFY_BRIDGE.$SUBDOMAIN.workers.dev/$TOKEN"

          READY=0
          for i in $(seq 1 50); do
            CODE=$(curl -sS --max-time 45 -o /tmp/health.json -w '%{http_code}' "$URL?mode=health" || true)
            if [[ "$CODE" == "200" ]] && jq -e '.ok==true and (.version|tostring|contains("az-mains-queued"))' /tmp/health.json >/dev/null 2>&1; then
              READY=1
              break
            fi
            echo "waiting for Worker az-mains-queued (try $i code=$CODE version=$(jq -r '.version // empty' /tmp/health.json 2>/dev/null || true))"
            sleep 6
          done
          test "$READY" = "1"
          echo "worker_ready=$(jq -r '.version' /tmp/health.json)"

          FINAL_OK=0
          TOTAL_APPROVED=0
          for k in $(seq 1 24); do
            # Prefer phase=approve (one destination per invoke). Retry 500 subrequest aborts.
            PHASE="approve"
            if [[ "$k" -eq 1 ]]; then PHASE="auto"; fi
            KICK_CODE=$(curl -sS --max-time 180 -o /tmp/az-kick.json -w '%{http_code}' "$URL?mode=kick&phase=$PHASE" || true)
            echo "kick_try=$k phase=$PHASE kick_http=$KICK_CODE"
            cat /tmp/az-kick.json || true
            if [[ "$KICK_CODE" != "200" ]]; then
              echo "non-200 kick; retrying"
              sleep 4
              continue
            fi
            jq -e '.diagnostic.requestId=="reca7v6zi1b9QNanJ"' /tmp/az-kick.json >/dev/null
            python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/az-kick.json').read_text())
          d=data.get('diagnostic') or {}
          advance=data.get('advance') or {}
          approved=int(advance.get('approved_count') or d.get('approved_count') or 0) if isinstance(advance, dict) or d else 0
          if isinstance(advance, dict):
            approved=max(approved, int(advance.get('approved_count') or 0))
          remaining_approve=int(advance.get('remaining_approve') or 0) if isinstance(advance, dict) else 0
          waiting=str((advance.get('waiting') if isinstance(advance, dict) else None) or d.get('waiting') or '')
          skipped=str(advance.get('skipped') or '') if isinstance(advance, dict) else ''
          print('advance=', advance)
          print('approved_count=', approved)
          print('remaining_approve=', remaining_approve)
          print('waiting=', waiting)
          print('skipped=', skipped)
          Path('/tmp/az-kick-summary.env').write_text(
            f"WAITING={waiting}\n"
            f"APPROVED={approved}\n"
            f"REMAINING_APPROVE={remaining_approve}\n"
            f"SKIPPED={skipped}\n"
            f"ADVANCE_OK={1 if isinstance(advance, dict) and advance.get('ok') else 0}\n"
          )
          PY
            # shellcheck source=/tmp/az-kick-summary.env
            . /tmp/az-kick-summary.env
            TOTAL_APPROVED=$((TOTAL_APPROVED + APPROVED))
            if [[ "${SKIPPED:-}" == "already_queued" || "${SKIPPED:-}" == "mains_queued" ]]; then
              FINAL_OK=1
              break
            fi
            if [[ "${TOTAL_APPROVED:-0}" -gt 0 ]]; then
              FINAL_OK=1
              break
            fi
            # Stories remotioning after mains are queued is success for AZ.
            # remaining_approve=0 means no ready mains left to schedule this invoke.
            if [[ "${WAITING:-}" == "story_render" && ( "${ADVANCE_OK:-0}" == "1" || "${REMAINING_APPROVE:-0}" == "0" ) ]]; then
              FINAL_OK=1
              break
            fi
            if [[ -n "${WAITING:-}" ]]; then
              echo "still waiting on ${WAITING}; continuing (total_approved=${TOTAL_APPROVED})"
              sleep 3
              continue
            fi
            sleep 2
          done
          test "$FINAL_OK" = "1"

      - name: Upload kick evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: az-navy-pier-kick-${{ github.run_id }}
          path: /tmp/az-kick.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete kick bridge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$API_ROOT/workers/scripts/$VERIFY_BRIDGE" -H "$AUTH" >/dev/null || true
