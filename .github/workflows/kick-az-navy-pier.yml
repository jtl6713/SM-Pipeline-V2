name: Kick AZ Navy Pier Compress/Advance

on:
  push:
    branches: [main]
    paths:
      - 'deploy/kick-az-navy-pier.txt'
      - '.github/workflows/kick-az-navy-pier.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kick-az-navy-pier
  cancel-in-progress: false

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      VERIFY_BRIDGE: chicagoshining-az-navy-kick
    steps:
      - uses: actions/checkout@v6

      - name: Wait for Worker version az-navy-unstick then kick via service binding
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          TOKEN=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )
          printf '%s' "$TOKEN" >/tmp/verify-token.txt
          cat >/tmp/verify-worker.js <<EOF
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== "/$TOKEN") return new Response("Not found", {status:404});
              const want = url.searchParams.get("mode") || "kick";
              const path = want === "health" ? "/api/health" : "/api/ops/az-navy-pier-kick";
              const method = want === "health" ? "GET" : "POST";
              const internal = new Request("https://studio.chicagoshining.com" + path, {
                method,
                headers:{
                  "Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com",
                  "Origin":"https://studio.chicagoshining.com",
                  "Accept":"application/json",
                  "Content-Type":"application/json"
                },
                body: method === "POST" ? "{}" : undefined
              });
              const response = await env.STUDIO_API.fetch(internal);
              return new Response(await response.text(), {status:response.status,headers:{"Content-Type":"application/json","Cache-Control":"no-store"}});
            }
          };
          EOF
          cat >/tmp/verify-metadata.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF
          node --check /tmp/verify-worker.js
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$API_ROOT/workers/scripts/$VERIFY_BRIDGE" -H "$AUTH" >/dev/null || true
          code=$(curl -sS -o /tmp/verify-upload.json -w '%{http_code}' -X PUT "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/content" -H "$AUTH" \
            -F 'metadata=@/tmp/verify-metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/verify-worker.js;type=application/javascript+module;filename=worker.js')
          test "$code" -ge 200 -a "$code" -lt 300
          curl -fsS -X POST "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/subdomain" -H "$AUTH" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' >/tmp/verify-subdomain.json
          curl -fsS "$API_ROOT/workers/subdomain" -H "$AUTH" -o /tmp/account-subdomain.json
          SUBDOMAIN=$(jq -er '.result.subdomain' /tmp/account-subdomain.json)
          URL="https://$VERIFY_BRIDGE.$SUBDOMAIN.workers.dev/$TOKEN"

          READY=0
          for i in $(seq 1 40); do
            CODE=$(curl -sS --max-time 45 -o /tmp/health.json -w '%{http_code}' "$URL?mode=health" || true)
            if [[ "$CODE" == "200" ]] && jq -e '.ok==true and (.version|tostring|contains("az-navy-unstick"))' /tmp/health.json >/dev/null 2>&1; then
              READY=1
              break
            fi
            echo "waiting for Worker az-navy-unstick (try $i code=$CODE version=$(jq -r '.version // empty' /tmp/health.json 2>/dev/null || true))"
            sleep 6
          done
          test "$READY" = "1"
          echo "worker_ready=$(jq -r '.version' /tmp/health.json)"

          KICK_CODE=$(curl -sS --max-time 120 -o /tmp/az-kick.json -w '%{http_code}' "$URL?mode=kick" || true)
          echo "kick_http=$KICK_CODE"
          cat /tmp/az-kick.json
          test "$KICK_CODE" = "200"
          jq -e '.ok==true and .diagnostic.requestId=="reca7v6zi1b9QNanJ"' /tmp/az-kick.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/az-kick.json').read_text())
          d=data.get('diagnostic') or {}
          print('request_status=', d.get('request_status'))
          print('needs_compress=', d.get('needs_compress'))
          print('masters_ready=', d.get('masters_ready'))
          print('plan_status=', d.get('plan_status'))
          print('content=', d.get('content'))
          print('compress=', data.get('compress'))
          print('advance=', data.get('advance'))
          assets=d.get('assets') or []
          for a in assets:
              print('asset=', a)
          PY

      - name: Upload kick evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: az-navy-pier-kick-${{ github.run_id }}
          path: /tmp/az-kick.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Delete kick bridge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$API_ROOT/workers/scripts/$VERIFY_BRIDGE" -H "$AUTH" >/dev/null || true
