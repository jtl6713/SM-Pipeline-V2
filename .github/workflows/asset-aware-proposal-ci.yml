name: Asset-Aware Proposal and QA Regression
on:
  pull_request:
    paths:
      - 'apps/studio-api/scripted-short-asset-policy.mjs'
      - 'apps/studio-api/scripted-short-asset-policy.test.mjs'
      - 'apps/studio-api/scripted-short-title.mjs'
      - 'apps/studio-api/scripted-short-title.test.mjs'
      - 'apps/studio-api/scripted-short-title-explicit.test.mjs'
      - 'apps/studio-api/worker-functions-02.mjs'
      - 'apps/studio-api/quality-checks.mjs'
      - 'apps/studio-api/quality-checks.test.mjs'
      - '.github/workflows/asset-aware-proposal-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-proposal-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and location-aware asset regression
        run: |
          set -euo pipefail
          node --check apps/studio-api/scripted-short-title.mjs
          node --check apps/studio-api/scripted-short-asset-policy.mjs
          node --check apps/studio-api/worker-functions-02.mjs
          node --test apps/studio-api/scripted-short-asset-policy.test.mjs apps/studio-api/quality-checks.test.mjs apps/studio-api/scripted-short-title.test.mjs apps/studio-api/scripted-short-title-explicit.test.mjs
