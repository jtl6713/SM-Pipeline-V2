name: Verify Miami Instagram Atomic Scheduling Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-scoped-schedule-reservation-canary.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter VERIFY-MIAMI-IG-ATOMIC-SCHEDULING'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: live-synthetic-schedule-reservation-canary
  cancel-in-progress: false

jobs:
  canary:
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'VERIFY-MIAMI-IG-ATOMIC-SCHEDULING' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CANARY_WORKER_NAME: studio-schedule-reservation-synthetic-canary
      EXPECTED_LANE: recpNlNn6U6eq0M9r::instagram
    steps:
      - uses: actions/checkout@v4
      - name: Confirm exact Miami Instagram production activation and isolated canary cleanup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$AUTH" "$API/chicagoshining-studio-api/deployments" -o /tmp/miami-deployments-before.json
          jq -e '.success==true' /tmp/miami-deployments-before.json >/dev/null
          ACTIVE="$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/miami-deployments-before.json)"
          curl -fsS -H "$AUTH" "$API/chicagoshining-studio-api/versions/$ACTIVE" -o /tmp/miami-version-before.json
          jq -e --arg lane "$EXPECTED_LANE" '
            .success==true and
            ([.result.resources.bindings[]? | select(.name=="STUDIO_SCHEDULE_RESERVATION_AUTHORITY_ENABLED" and .type=="plain_text" and .text=="true")] | length)==1 and
            ([.result.resources.bindings[]? | select(.name=="STUDIO_SCHEDULE_RESERVATION_LANE_ALLOWLIST" and .type=="plain_text" and .text==$lane)] | length)==1 and
            ([.result.resources.bindings[]? | select(.name=="STUDIO_SCHEDULE_RESERVATIONS" and .type=="durable_object_namespace")] | length)==1
          ' /tmp/miami-version-before.json >/dev/null
          CODE="$(curl -sS -o /tmp/miami-canary-preflight.json -w '%{http_code}' -H "$AUTH" "$API/$CANARY_WORKER_NAME/settings")"
          test "$CODE" = "404" || { echo "synthetic_canary_worker_preexisting=YES; refusing to overwrite"; exit 1; }
          echo "VERIFIED_ACTIVE_VERSION=$ACTIVE" >> "$GITHUB_ENV"
          echo "miami_instagram_active_allowlist=PASS"
          echo "other_profiles_and_platforms_excluded_by_exact_allowlist=PASS"
          echo "isolated_synthetic_worker_absent_before=PASS"
      - name: Validate synthetic-only harness
        run: |
          set -euo pipefail
          node --check apps/studio-api/schedule-reservation-live-canary.mjs
          node --check apps/studio-api/schedule-reservation-live-canary-worker.mjs
          node --test apps/studio-api/schedule-reservation-live-canary.test.mjs
      - name: Deploy isolated ephemeral Worker, run live namespace checks, remove Worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save wrangler@4.123.0
          ROOT="$PWD"
          mkdir -p /tmp/synthetic-schedule-canary
          cp apps/studio-api/schedule-reservation-live-canary-worker.mjs /tmp/synthetic-schedule-canary/worker.mjs
          cp apps/studio-api/schedule-reservation-live-canary.mjs /tmp/synthetic-schedule-canary/
          cp apps/studio-api/schedule-reservation-authority.mjs /tmp/synthetic-schedule-canary/
          cp apps/studio-api/schedule-reservation-transaction.mjs /tmp/synthetic-schedule-canary/
          cd /tmp/synthetic-schedule-canary
          cat >wrangler.jsonc <<'EOF'
          {
            "name": "studio-schedule-reservation-synthetic-canary",
            "main": "worker.mjs",
            "compatibility_date": "2026-10-01",
            "workers_dev": true,
            "durable_objects": {
              "bindings": [{
                "name": "STUDIO_SCHEDULE_RESERVATIONS",
                "class_name": "ScheduleReservationLane",
                "script_name": "chicagoshining-studio-api"
              }]
            },
            "vars": {"STUDIO_SCHEDULE_RESERVATION_AUTHORITY_ENABLED": "false"}
          }
          EOF
          TOKEN="$(openssl rand -hex 32)"
          cleanup() {
            cd "$ROOT"
            "$ROOT/node_modules/.bin/wrangler" delete --config /tmp/synthetic-schedule-canary/wrangler.jsonc --name "$CANARY_WORKER_NAME" --force >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          "$ROOT/node_modules/.bin/wrangler" deploy --name "$CANARY_WORKER_NAME" --config wrangler.jsonc >/tmp/canary-deploy.log 2>&1
          printf '%s' "$TOKEN" | "$ROOT/node_modules/.bin/wrangler" secret put CANARY_TOKEN --config wrangler.jsonc --name "$CANARY_WORKER_NAME" >/dev/null
          SUBDOMAIN="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')"
          test -n "$SUBDOMAIN" && test "$SUBDOMAIN" != null
          NONCE="$(openssl rand -hex 12)"
          RESULT="$(curl -sS --retry 4 --retry-delay 2 -X POST "https://$CANARY_WORKER_NAME.$SUBDOMAIN.workers.dev/run" -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data "{\"nonce\":\"$NONCE\"}")"
          if ! echo "$RESULT" | jq -e 'type == "object"' >/dev/null 2>&1; then
            echo "canary_response_format=non_json"
            echo "canary_response_bytes=${#RESULT}"
            exit 1
          fi
          echo "$RESULT" | jq -c '{ok, error_code, message, schema, live_namespace, production_flag_unchanged, external_write, airtable_writes, publishing_calls, results}'
          echo "$RESULT" | jq -e '.ok == true' >/dev/null
          echo "$RESULT" | jq -e '.ok == true and .live_namespace == true and .production_flag_unchanged == true and .airtable_writes == 0 and .publishing_calls == 0 and ([.results[] | select(.pass != true)] | length == 0)' >/dev/null
          echo "live_sqlite_synthetic_canary=PASS"
          echo "$RESULT" | jq -c '{schema, live_namespace, production_flag_unchanged, external_write, airtable_writes, publishing_calls, results}'

      - name: Confirm production version and Miami-only scope unchanged and canary Worker removed
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$AUTH" "$API/chicagoshining-studio-api/deployments" -o /tmp/miami-deployments-after.json
          ACTIVE="$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/miami-deployments-after.json)"
          test "$ACTIVE" = "$VERIFIED_ACTIVE_VERSION" || { echo "production_version_changed_during_canary=FAIL"; exit 1; }
          curl -fsS -H "$AUTH" "$API/chicagoshining-studio-api/versions/$ACTIVE" -o /tmp/miami-version-after.json
          jq -e --arg lane "$EXPECTED_LANE" '
            .success==true and
            ([.result.resources.bindings[]? | select(.name=="STUDIO_SCHEDULE_RESERVATION_AUTHORITY_ENABLED" and .type=="plain_text" and .text=="true")] | length)==1 and
            ([.result.resources.bindings[]? | select(.name=="STUDIO_SCHEDULE_RESERVATION_LANE_ALLOWLIST" and .type=="plain_text" and .text==$lane)] | length)==1 and
            ([.result.resources.bindings[]? | select(.name=="STUDIO_SCHEDULE_RESERVATIONS" and .type=="durable_object_namespace")] | length)==1
          ' /tmp/miami-version-after.json >/dev/null
          CODE="$(curl -sS -o /tmp/miami-canary-postflight.json -w '%{http_code}' -H "$AUTH" "$API/$CANARY_WORKER_NAME/settings")"
          test "$CODE" = "404" || { echo "synthetic_canary_worker_cleanup=FAILED"; exit 1; }
          echo "production_version_unchanged=PASS"
          echo "miami_instagram_only_activation=PASS"
          echo "synthetic_canary_worker_removed=PASS"
          echo "no_airtable_writes_or_publishing=PASS"
