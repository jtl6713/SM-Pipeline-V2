name: Update Ledger Item 3 Prepared

on:
  push:
    branches: [main]
    paths:
      - deploy/update-ledger-item3-prepared-v1.txt

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Record authoritative Item 3 preparation checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('repair/SM_PIPELINE_21_ITEM_LEDGER.md')
          s = p.read_text()
          lines = s.splitlines()
          row = "| 3 | Renderer native overlap transitions | **Partial — authoritative live source verified; native overlap patch prepared; runtime acceptance pending** | Authoritative 2026-08-17 renderer snapshot was taken from `D:\\Content Creation\\ChicagoShining Pipeline\\Services\\Remotion_Renderer`. Current defect is confirmed: `ChicagoShiningPhotoSequence` uses back-to-back `Sequence` blocks with per-scene opacity/transform transitions, so adjacent scenes do not overlap. A guarded patch replaces interscene faux transitions with Remotion `TransitionSeries`, exact-duration compensation, native fade/slide presentations, transition-context zoom scaling, bounded clip audio, preserved first-scene intro reveal behavior, and service version `2026-08-17-native-overlap-transitions`. Installer v1 and v2 both failed safely before renderer restart/acceptance rendering and rolled back. V3 records the pre-change full-project ESLint fingerprint and requires zero new lint errors, then requires clean TypeScript compile and Remotion bundle gates. | Run the v3 hash-gated local installer; require no-new-lint, typecheck/build, exact `/health` version, 135-frame/4.5s A/V preservation, red→green fade overlap and green→blue slide overlap pixel proof, then inspect the emitted evidence ZIP before marking Complete. |"
          found = False
          for i, line in enumerate(lines):
              if line.startswith('| 3 |'):
                  lines[i] = row
                  found = True
                  break
          if not found:
              raise SystemExit('Item 3 ledger row not found')
          out = '\n'.join(lines)
          old_hash = '5e90a90f0c039232d8b9b2a9e6373b322292826991035318a8b35624f6a2ed73'
          new_hash = '07337fdbb3d4a6a925a069b8f6ab2f42609e2ff365a3e1f510089aeb9950b063'
          out = out.replace(old_hash, new_hash)
          out = out.replace('SM_Pipeline_V2_Item3_Native_Overlap_Repair_2026-08-17.zip', 'SM_Pipeline_V2_Item3_Native_Overlap_Repair_2026-08-17_v3.zip')
          old_sentence = 'The installer hash-checks the uploaded authoritative snapshot, backs up modified files, pins `@remotion/transitions@4.0.484`, runs lint/build, restarts only the renderer, and rolls back on a failed gate.'
          new_sentence = 'Installer v1 stopped safely on Windows PowerShell stderr promotion during npm and rolled back. Installer v2 reached the full-project lint gate, exposed six pre-existing authoritative-source lint errors, then rolled back before renderer restart/acceptance rendering. V3 hash-checks the authoritative snapshot, captures the pre-change full-project ESLint fingerprint, requires zero new lint errors, then requires `npx tsc --noEmit` and `npm run build`, restarts only the renderer, and rolls back on any failed gate.'
          out = out.replace(old_sentence, new_sentence)
          old_runtime = 'Runtime acceptance is intentionally still pending.'
          if 'V3 runtime acceptance is intentionally still pending.' not in out:
              out = out.replace(old_runtime, 'V3 runtime acceptance is intentionally still pending.')
          p.write_text(out.rstrip() + '\n')
          PY
          git diff --check
          grep -Fq '| 3 | Renderer native overlap transitions | **Partial — authoritative live source verified' repair/SM_PIPELINE_21_ITEM_LEDGER.md
          grep -Fq '07337fdbb3d4a6a925a069b8f6ab2f42609e2ff365a3e1f510089aeb9950b063' repair/SM_PIPELINE_21_ITEM_LEDGER.md
          grep -Fq 'requires zero new lint errors' repair/SM_PIPELINE_21_ITEM_LEDGER.md
          grep -Fq 'Installer v2 reached the full-project lint gate' repair/SM_PIPELINE_21_ITEM_LEDGER.md
          if git diff --quiet -- repair/SM_PIPELINE_21_ITEM_LEDGER.md; then
            echo 'Ledger already current.'
            exit 0
          fi
          git config user.name 'SM Pipeline Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add repair/SM_PIPELINE_21_ITEM_LEDGER.md
          git commit -m 'ledger: record Item 3 v3 validation harness'
          git push
