name: Diagnose Chicago Producer transport (GET and rejected POST only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chicago-review-producer-transport-diagnostic.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Probe Runner route without authorization (cannot create proposals)
        shell: bash
        run: |
          set -euo pipefail
          for path in health jobs/rendering-review/propose; do
            safe=${path//\//-}
            if [[ "$path" == "health" ]]; then
              status=$(curl -sS --max-time 18 --max-redirs 0 -D "/tmp/${safe}.headers" -o "/tmp/${safe}.body" -w '%{http_code}' "https://pipeline.chicagoshining.com/$path" || true)
            else
              status=$(curl -sS --max-time 18 --max-redirs 0 -D "/tmp/${safe}.headers" -o "/tmp/${safe}.body" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' "https://pipeline.chicagoshining.com/$path" || true)
            fi
            echo "runner_path=$safe status=$status mime=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {print $2}' "/tmp/${safe}.headers" | tr -d '\r' | tail -1)"
            if jq -e 'type=="object"' "/tmp/${safe}.body" >/dev/null 2>&1; then
              jq -cr '{ok,error,service,version}' "/tmp/${safe}.body" | head -c 400
              echo
            else
              echo "runner_response_non_json=true"
            fi
          done
      - name: Inspect active Worker Runner binding shape without secrets
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/chicagoshining-studio-api"
          curl -fsS --max-time 15 "$API/deployments" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/deploy.json
          VERSION=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/deploy.json)
          curl -fsS --max-time 15 "$API/versions/$VERSION" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/bindings.json
          jq -cr '
            [.result.resources.bindings[] | select(.name=="PIPELINE_RUNNER_URL" or .name=="PIPELINE_RUNNER_SHARED_SECRET" or .name=="CF_ACCESS_CLIENT_ID" or .name=="CF_ACCESS_CLIENT_SECRET") |
              {name,type,host:(if .name=="PIPELINE_RUNNER_URL" and .type=="plain_text" then (.text|tostring|sub("^https?://";"")|split("/")[0]) else null end)}]
          ' /tmp/bindings.json
          test "$(jq '[.result.resources.bindings[]|select(.name=="PIPELINE_RUNNER_SHARED_SECRET")]|length' /tmp/bindings.json)" = "1"
      - name: Probe Runner with Cloudflare Access service token only (no Runner secret)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CF_ACCESS_CLIENT_ID" || -z "$CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "access_probe_credentials_not_configured=true"
            exit 0
          fi
          status=$(curl -sS --max-time 18 --max-redirs 0 -o /tmp/access-probe.json -w '%{http_code}' \
            -X POST -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H 'Content-Type: application/json' -d '{}' \
            https://pipeline.chicagoshining.com/jobs/rendering-review/propose || true)
          echo "runner_with_access_probe_http=$status"
          if jq -e 'type=="object"' /tmp/access-probe.json >/dev/null 2>&1; then
            jq -cr '{ok,error}' /tmp/access-probe.json
          else
            echo "runner_with_access_response_non_json=true"
          fi

      - name: Probe exact held Reel with synthetic read-only Producer direction via protected Ops
        shell: bash
        env:
          OPS_TOKEN: ${{ secrets.OPS_DASHBOARD_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$OPS_TOKEN"
          cat >/tmp/rr-probe.ps1 <<'PS1'
          $ErrorActionPreference='Stop'
          $p=Join-Path (Get-Location) 'Services\pipeline-runner\service\.env'
          if(-not (Test-Path -LiteralPath $p)){throw 'protected_runner_env_missing'}
          $line=Get-Content -LiteralPath $p | Where-Object {$_ -match '^PIPELINE_RUNNER_SHARED_SECRET\s*='} | Select-Object -First 1
          if(-not $line){throw 'protected_runner_secret_missing'}
          $secret=($line -split '=',2)[1].Trim().Trim('"').Trim([char]39)
          if($secret.Length -lt 24){throw 'protected_runner_secret_not_set'}
          $body=@{
            output_id='rec0uVrVeiUM6shp9'
            session_id='rrsession_5db47c3f652bf0f80162c4e933cb8b7a913c92c888fec796'
            expected_version=2
            direction='There is a still embedded of nighttime view of the river. Please replace that with a daytime view or even better a sunrise view if we have one.'
          } | ConvertTo-Json -Compress
          $sw=[System.Diagnostics.Stopwatch]::StartNew()
          Add-Type -AssemblyName System.Net.Http
          $http=[System.Net.Http.HttpClient]::new()
          $http.Timeout=[TimeSpan]::FromSeconds(145)
          try{
            $req=[System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Post,'https://pipeline.chicagoshining.com/jobs/rendering-review/propose')
            $req.Content=[System.Net.Http.StringContent]::new($body,[System.Text.Encoding]::UTF8,'application/json')
            [void]$req.Headers.TryAddWithoutValidation('X-Pipeline-Secret',$secret)
            $resp=$http.SendAsync($req).GetAwaiter().GetResult()
            $status=[int]$resp.StatusCode
            $mime=[string]$resp.Content.Headers.ContentType.MediaType
            $raw=$resp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
            $code='unknown';$ok=$false;$renderQueued='unknown'
            try{
              $data=$raw|ConvertFrom-Json
              $code=[string]$data.error
              if(-not $code){$code='none'}
              $ok=($data.ok -eq $true)
              $renderQueued=[string]$data.render_queued
            }catch{}
            Write-Output ("producer_probe_http="+$status+" elapsed_sec="+[int]$sw.Elapsed.TotalSeconds+" mime="+$mime+" code="+$code+" ok="+$ok+" render_queued="+$renderQueued)
            if($status -eq 200 -and $ok -and $data.proposal.candidate){
              $candidate=$data.proposal.candidate
              $details=([string]$candidate.explanation)+' '+(@($candidate.changes) -join ' ')
              $existingMention=($details -match '(?i)(riverwalk 8|morning riverwalk|existing morning|already owned)')
              $scenes=@($candidate.timeline)
              $sourceMorningId='e7eafa73de3e460782'
              $usesOwnedMorning=@($scenes | Where-Object { @($_.asset_ids) -contains $sourceMorningId }).Count -gt 0
              Write-Output ("producer_existing_photo_mentioned="+[bool]$existingMention+" timeline_uses_owned_morning="+[bool]$usesOwnedMorning+" scene_count="+[int]$scenes.Count+" requirements="+[int]@($candidate.requirements).Count)
            }
            if($status -eq 200 -and $ok -and $data.render_queued -eq $false -and $data.publication_changed -eq $false){
              Write-Output 'producer_probe_safe_candidate=true no_persistence=true'
              Write-Output ("producer_probe_timeline_scenes="+[int]@($data.proposal.candidate.timeline).Count+" requirements="+[int]@($data.proposal.candidate.requirements).Count)
            }
          }catch{
            Write-Output ("producer_probe_transport_failure_elapsed="+[int]$sw.Elapsed.TotalSeconds+" class="+$_.Exception.GetType().Name)
          }finally{
            if($status -ne 200){
            $localSw=[System.Diagnostics.Stopwatch]::StartNew()
            try{
              $localReq=[System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Post,'http://127.0.0.1:3350/jobs/rendering-review/propose')
              $localReq.Content=[System.Net.Http.StringContent]::new($body,[System.Text.Encoding]::UTF8,'application/json')
              [void]$localReq.Headers.TryAddWithoutValidation('X-Pipeline-Secret',$secret)
              $localResp=$http.SendAsync($localReq).GetAwaiter().GetResult()
              $localRaw=$localResp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              $localCode='unknown';$localOk=$false
              try{$localJson=$localRaw|ConvertFrom-Json
                $localCode=[string]$localJson.error
                $localOk=($localJson.ok -eq $true)
              }catch{}
              Write-Output ("producer_loopback_http="+[int]$localResp.StatusCode+" mime="+[string]$localResp.Content.Headers.ContentType.MediaType+" error="+$localCode+" ok="+$localOk+" elapsed_sec="+[int]$localSw.Elapsed.TotalSeconds)
            }catch{
              Write-Output ("producer_loopback_transport_failure="+$_.Exception.GetType().Name+" elapsed_sec="+[int]$localSw.Elapsed.TotalSeconds)
            }
            }else{ Write-Output "producer_loopback_skipped_after_public_success=true" }
            $http.Dispose()
          }
          PS1
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/rr-probe-job.json').write_text(json.dumps({
            "command":Path('/tmp/rr-probe.ps1').read_text(),"confirm":True}))
          PY
          status=$(curl -sS --max-time 20 -o /tmp/rr-probe-start.json -w '%{http_code}' \
            -X POST 'https://ops.chicagoshining.com/api/shell' \
            -H "Authorization: Bearer $OPS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/rr-probe-job.json || true)
          echo "producer_ops_probe_submit_http=$status"
          test "$status" = "202" -o "$status" = "200"
          JOB=$(jq -r '.job.id // .jobId // empty' /tmp/rr-probe-start.json)
          test -n "$JOB"
          for i in $(seq 1 65); do
            curl -fsS --max-time 15 -H "Authorization: Bearer $OPS_TOKEN" \
              "https://ops.chicagoshining.com/api/jobs/$JOB" -o /tmp/rr-probe-result.json
            state=$(jq -r '.job.status // empty' /tmp/rr-probe-result.json)
            if [[ "$state" == "ok" || "$state" == "failed" ]]; then
              echo "producer_ops_probe_job=$state"
              jq -r '.job.log // ""' /tmp/rr-probe-result.json | grep -E '^producer_probe_http=|^producer_probe_transport_failure|^producer_loopback_|^producer_ops_probe_' | tail -10 || true
              test "$state" = "ok"
              exit 0
            fi
            sleep 4
          done
          echo 'producer_ops_probe_job_timeout=true'
          exit 1

