name: Deploy R2 Upload Worker Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/r2-upload-worker/worker.js'
      - 'deploy/r2-upload-worker-production.txt'
      - '.github/workflows/deploy-r2-upload-worker-production.yml'

permissions:
  contents: read

concurrency:
  group: chicagoshining-r2-upload-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Worker source
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/r2-upload-worker/worker.js
          grep -q 'chicagoshining-r2-upload' apps/r2-upload-worker/worker.js
          cp apps/r2-upload-worker/worker.js /tmp/r2-upload-worker.mjs
          node --check /tmp/r2-upload-worker.mjs

      - name: Capture pre-deploy Worker backup
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS \
            -o /tmp/r2-worker-before.bin \
            -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/chicagoshining-r2-upload/content/v2" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [[ "$HTTP_CODE" -ge 200 && "$HTTP_CODE" -lt 300 ]]; then
            test -s /tmp/r2-worker-before.bin
            sha256sum /tmp/r2-worker-before.bin > /tmp/r2-worker-before.sha256
          else
            printf 'No readable pre-deploy backup. HTTP %s\n' "$HTTP_CODE" > /tmp/r2-worker-before.txt
          fi

      - name: Save pre-deploy backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: chicagoshining-r2-upload-before-${{ github.run_id }}
          path: |
            /tmp/r2-worker-before.bin
            /tmp/r2-worker-before.sha256
            /tmp/r2-worker-before.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Deploy Worker code without changing bindings or configuration
        shell: bash
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS \
            -o /tmp/r2-worker-deploy-result.json \
            -w '%{http_code}' \
            -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/chicagoshining-r2-upload/content" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata={"main_module":"worker.js"};type=application/json' \
            -F 'worker.js=@apps/r2-upload-worker/worker.js;type=application/javascript+module')
          if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
            echo "Cloudflare Worker content update failed with HTTP $HTTP_CODE" >&2
            jq '{success,errors,messages}' /tmp/r2-worker-deploy-result.json >&2 || true
            exit 1
          fi
          jq -e '.success == true' /tmp/r2-worker-deploy-result.json >/dev/null

      - name: Verify deployed Worker source is readable
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/chicagoshining-r2-upload/content/v2" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -o /tmp/r2-worker-after.bin
          test -s /tmp/r2-worker-after.bin
          {
            echo '### R2 upload Worker production deployment: PASS'
            echo "- Source SHA-256: $(sha256sum apps/r2-upload-worker/worker.js | cut -d' ' -f1)"
            echo '- Existing Worker configuration/bindings were not modified by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
