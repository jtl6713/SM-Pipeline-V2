name: Densify Studio Assets Media
# One-shot POST /api/ops/supabase/sync with media_limit for Asset Manager densify.
# Requires an explicit Trigger line in deploy/densify-studio-assets-media.txt.
on:
  push:
    branches: [main]
    paths:
      - "deploy/densify-studio-assets-media.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chicagoshining-studio-api-assets-densify
  cancel-in-progress: false

jobs:
  densify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      VERIFY_BRIDGE: chicagoshining-assets-densify
    steps:
      - uses: actions/checkout@v4
      - name: POST media densify sync through service binding
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          if ! grep -q 'Trigger densify STUDIO_ASSETS media_limit=600 now' deploy/densify-studio-assets-media.txt; then
            echo "assets_densify_skipped=NO_TRIGGER"
            exit 0
          fi
          umask 077
          TOKEN=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )
          cat >/tmp/verify-worker.js <<EOF
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== "/$TOKEN") return new Response("Not found", {status:404});
              const mode = url.searchParams.get("mode") || "sync";
              if (mode === "health") {
                const health = await env.STUDIO_API.fetch(new Request("https://studio.chicagoshining.com/api/health", {
                  headers: {
                    "Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com",
                    "Origin":"https://studio.chicagoshining.com",
                    "Accept":"application/json"
                  }
                }));
                return new Response(await health.text(), {status:health.status,headers:{"Content-Type":"application/json","Cache-Control":"no-store"}});
              }
              const internal = new Request("https://studio.chicagoshining.com/api/ops/supabase/sync", {
                method: "POST",
                headers: {
                  "Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com",
                  "Origin":"https://studio.chicagoshining.com",
                  "Accept":"application/json",
                  "Content-Type":"application/json"
                },
                body: JSON.stringify({
                  output_limit: 100,
                  content_limit: 50,
                  idea_limit: 100,
                  media_limit: 600,
                  queue_limit: 50,
                  skip_transfer_queue_backfill: true
                })
              });
              const response = await env.STUDIO_API.fetch(internal);
              return new Response(await response.text(), {status:response.status,headers:{"Content-Type":"application/json","Cache-Control":"no-store"}});
            }
          };
          EOF
          cat >/tmp/verify-metadata.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF
          node --check /tmp/verify-worker.js
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$API_ROOT/workers/scripts/$VERIFY_BRIDGE" -H "$AUTH" >/dev/null || true
          code=$(curl -sS -o /tmp/verify-upload.json -w '%{http_code}' -X PUT "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/content" -H "$AUTH" \
            -F 'metadata=@/tmp/verify-metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/verify-worker.js;type=application/javascript+module;filename=worker.js')
          test "$code" -ge 200 -a "$code" -lt 300
          curl -fsS -X POST "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/subdomain" -H "$AUTH" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' >/tmp/verify-subdomain.json
          curl -fsS "$API_ROOT/workers/subdomain" -H "$AUTH" -o /tmp/account-subdomain.json
          SUBDOMAIN=$(jq -er '.result.subdomain' /tmp/account-subdomain.json)
          URL="https://$VERIFY_BRIDGE.$SUBDOMAIN.workers.dev/$TOKEN"
          READY=0
          for i in $(seq 1 90); do
            CODE=$(curl -sS --max-time 45 -o /tmp/health.json -w '%{http_code}' "$URL?mode=health" || true)
            if [[ "$CODE" == "200" ]] && jq -e '.ok==true and ((.version|tostring|contains("817-assets-densify-oneshot")) or (.studio_supabase_assets_densify_oneshot_v1==true))' /tmp/health.json >/dev/null 2>&1; then
              READY=1
              break
            fi
            echo "waiting for Worker 0.10.817 densify oneshot (try $i code=$CODE version=$(jq -r '.version // empty' /tmp/health.json 2>/dev/null || true))"
            sleep 8
          done
          test "$READY" = "1"
          echo "worker_ready=$(jq -r '.version' /tmp/health.json)"
          SYNC_OK=0
          for i in $(seq 1 6); do
            CODE=$(curl -sS --max-time 240 -o /tmp/sync.json -w '%{http_code}' "$URL?mode=sync" || true)
            echo "sync_http_attempt_$i=$CODE"
            if [[ "$CODE" == "200" ]] && jq -e '.ok==true' /tmp/sync.json >/dev/null 2>&1; then
              SYNC_OK=1
              break
            fi
            # Lease contention with half-hour cron: brief backoff then retry.
            sleep 20
          done
          test "$SYNC_OK" = "1"
          echo "assets_media_densify_sync=PASS"
          echo "media_assets=$(jq -c '.media_assets // .stamp.media_assets // {}' /tmp/sync.json)"
          curl -sS -X DELETE "$API_ROOT/workers/scripts/$VERIFY_BRIDGE" -H "$AUTH" >/dev/null || true
