name: Issue 2970 Riverwalk Held Audio Staging
on:
  pull_request:
    paths:
      - 'repair/scripts/issue2970-riverwalk-audio-stage.py'
      - '.github/workflows/issue2970-riverwalk-audio-stage.yml'
  push:
    branches: [main]
    paths:
      - 'repair/scripts/issue2970-riverwalk-audio-stage.py'
      - '.github/workflows/issue2970-riverwalk-audio-stage.yml'
permissions:
  contents: read
concurrency:
  group: issue2970-riverwalk-audio-stage
  cancel-in-progress: false
jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact held scope and no canonical or provider writes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile repair/scripts/issue2970-riverwalk-audio-stage.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path('repair/scripts/issue2970-riverwalk-audio-stage.py')
          s=p.read_text()
          t=ast.parse(s)
          for n in ['resource_slot','recovery_media_stage','circuit_open','recovery_read_only_active','studio_write_source','studio_runner_output_read_source','issue_2970_preapproval_media_qa','story_target_frames','full_voiceover','story_voiceover','source_writes','provider_writes','factory_approvals']:
              assert n in s,n
          for n in ['requests.post','requests.patch','requests.delete','requests.put','api.airtable.com','graph.facebook.com','media_publish','update_record(']:
              assert n not in s,n
          outputs=next(x.value for x in t.body if isinstance(x,ast.Assign) and any(isinstance(y,ast.Name) and y.id=='OUTPUTS' for y in x.targets))
          assert set(ast.literal_eval(outputs))==set(range(11166,11172))
          print('ISSUE2970_STATIC_PASS')
          PY
  stage-owned-media:
    if: github.event_name == 'push'
    needs: static-safety
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate existing Ops runner without exposing credential
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C";do
            [[ -n "$candidate" ]] || continue
            http=$(curl -sS --max-time 20 -o /tmp/issue2970-ops-catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" 'https://ops.chicagoshining.com/api/catalog' || true)
            if [[ "$http" == 200 ]] && jq -e '.ok==true' /tmp/issue2970-ops-catalog.json >/dev/null;then
              echo "::add-mask::$candidate"
              echo "ISSUE2970_OPS_TOKEN=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'Held Riverwalk audio staging blocked: Ops unavailable; no media state changed'; exit 1
      - name: Build pinned SHA256 source execution request for original owner runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,json,pathlib
          src=pathlib.Path('repair/scripts/issue2970-riverwalk-audio-stage.py')
          expected=hashlib.sha256(src.read_bytes()).hexdigest()
          sha=os.environ['GITHUB_SHA']
          assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha)
          url=f'https://raw.githubusercontent.com/jtl6713/SM-Pipeline-V2/{sha}/{src.as_posix()}'
          command=(
              "$ErrorActionPreference='Stop';"
              "$py=Get-Command python -ErrorAction SilentlyContinue;"
              "if(-not $py){throw 'ops_python_missing'};"
              "$tmp=Join-Path $env:TEMP 'issue2970-riverwalk-audio-stage.py';"
              f"$srcUrl='{url}';"
              "Invoke-WebRequest -Uri $srcUrl -Method Get -OutFile $tmp -UseBasicParsing -TimeoutSec 55;"
              "$actual=(Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant();"
              f"if($actual -ne '{expected}'){{throw 'exact_stage_source_checksum_mismatch'}};"
              "try{& python $tmp;"
              "if($LASTEXITCODE -ne 0){throw ('riverwalk_audio_stage_exit_'+$LASTEXITCODE)}}"
              "finally{Remove-Item $tmp -Force -ErrorAction SilentlyContinue}"
          )
          pathlib.Path('/tmp/issue2970-ops-request.json').write_text(json.dumps({'command':command,'confirm':True}))
          print('IMMUTABLE_ISSUE2970_STAGE_SOURCE_PINNED')
          PY
      - name: Stage canonical narration and owned music, no output writes
        shell: bash
        run: |
          set -euo pipefail
          accepted=false
          for slot in $(seq 1 12);do
            code=$(curl -sS --max-time 30 -o /tmp/issue2970-ops-start.json -w '%{http_code}' \
              -X POST 'https://ops.chicagoshining.com/api/shell' \
              -H "Authorization: Bearer $ISSUE2970_OPS_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @/tmp/issue2970-ops-request.json || true)
            if [[ "$code" == 200 || "$code" == 202 ]];then accepted=true;break;fi
            if [[ "$code" != 409 ]];then echo "R2 owner runner returned $code";exit 2;fi
            sleep 12
          done
          [[ "$accepted" == true ]] || { echo 'Ops shell busy; no second stage scheduled';exit 2; }
          job=$(jq -er '.job.id // .jobId' /tmp/issue2970-ops-start.json)
          for tick in $(seq 1 140);do
            curl -fsS --max-time 30 -H "Authorization: Bearer $ISSUE2970_OPS_TOKEN" \
              "https://ops.chicagoshining.com/api/jobs/$job" -o /tmp/issue2970-ops-job.json
            status=$(jq -r '.job.status // empty' /tmp/issue2970-ops-job.json)
            if [[ "$status" == ok ]];then
              jq -r '.job.log // ""' /tmp/issue2970-ops-job.json | grep '^ISSUE2970_AUDIO_STAGE=' | tail -1 \
                | sed 's/^ISSUE2970_AUDIO_STAGE=//' > /tmp/issue2970-audio-stage.json
              jq -e '.verified==true and .outputs==[11166,11167,11168,11169,11170,11171] and .content==2306 and .source_writes==0 and .provider_writes==0 and .factory_approvals==0 and .hold_preserved==true and .story_target_frames==300 and .music_rights=="Owned" and .story_voiceover.seconds<=9.8 and .story_voiceover.seconds>=2 and .full_voiceover.seconds>=41.7 and .music.seconds>=42' /tmp/issue2970-audio-stage.json >/dev/null
              jq -c . /tmp/issue2970-audio-stage.json
              exit 0
            elif [[ "$status" == failed ]];then
              echo 'Owned held Riverwalk audio stage failed; no automatic source/approval/provider changes'
              jq -r '.job.log // ""' /tmp/issue2970-ops-job.json | tail -n 23 \
                | sed -E 's#[A-Za-z0-9_./+=-]{28,}#[redacted]#g' \
                | grep -Ev 'Authorization:|Bearer |SUPABASE_SERVICE_ROLE_KEY|R2_UPLOAD_WORKER_SECRET|GOOGLE_REFRESH_TOKEN' || true
              exit 3
            fi
            sleep 4
          done
          echo 'R2 staging job incomplete; do not set public statuses Ready'; exit 4
      - name: Preserve sanitized candidate checksum and provenance receipts for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue2970-riverwalk-audio-stage
          path: /tmp/issue2970-audio-stage.json
          retention-days: 30
          if-no-files-found: warn
