name: Studio Pages Release Version Regression
on:
  pull_request:
    paths:
      - 'apps/studio-web/**'
      - '.github/workflows/studio-pages-release-version-regression.yml'
  push:
    branches: [fix/studio-pages-0743-release-tests]
    paths:
      - '.github/workflows/studio-pages-release-version-regression.yml'
permissions:
  contents: read
jobs:
  release-version-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require newer release when Studio UI runtime changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$PR_BASE_SHA^{commit}"
          git diff --name-only "$PR_BASE_SHA"...HEAD > /tmp/studio-pr-changed-files
          if ! grep -Eq '^apps/studio-web/(index\.html|assets/.*\.(js|css))$' /tmp/studio-pr-changed-files; then
            echo 'No Studio runtime asset changes; a release-version bump is not required for this PR.'
            exit 0
          fi
          BASE_INDEX=$(git show "$PR_BASE_SHA:apps/studio-web/index.html")
          BASE_VERSION=$(printf '%s\n' "$BASE_INDEX" | sed -nE 's/.*<span id="uiBuildLabel">UI build ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)
          test -n "$BASE_VERSION"
          echo "main_ui_version_at_pr_base=$BASE_VERSION"
          node apps/studio-web/ui-release-contract.mjs --assert-newer-than "$BASE_VERSION"
          echo "studio_ui_release_increase_verified=true"
      - name: Engagement queue resilience regression
        run: |
          node --check apps/studio-web/assets/engagement-1008.js
          node --test apps/studio-web/engagement.test.mjs
      - name: UI version and affected workflow regression
        run: |
          node --check apps/studio-web/assets/app-item4-1008.js
          node apps/studio-web/ui-release-contract.mjs --json
          node --test --test-reporter=./apps/studio-web/compact-ci-test-reporter.mjs apps/studio-web/compact-ci-test-reporter.test.mjs apps/studio-web/profile-feedback.test.mjs apps/studio-web/all-profiles-load.test.mjs apps/studio-web/factory-needs-eyes-layout.test.mjs apps/studio-web/factory-producer-progress.test.mjs apps/studio-web/factory-open-navigation.test.mjs apps/studio-web/factory-revision-approval.test.mjs apps/studio-web/pipeline-publish-now.test.mjs apps/studio-web/pipeline-rendering-terminal.test.mjs apps/studio-web/production-render-layout.test.mjs apps/studio-web/production-rendering-request-isolation.test.mjs apps/studio-web/asset-upload-progress.test.mjs apps/studio-web/ui-release-contract.test.mjs apps/studio-web/unified-platform-outputs.test.mjs apps/studio-web/vibe-cut-mode.test.mjs apps/studio-web/vibe-cut-passthrough-guard.test.mjs apps/studio-web/scripted-short-profile-routing.test.mjs apps/studio-web/idea-numeric-id-display.test.mjs apps/studio-web/idea-generation-partial-recovery.test.mjs apps/studio-web/exception-recovery-overdue-format.test.mjs apps/studio-web/idea-library-attach-resumable.test.mjs
