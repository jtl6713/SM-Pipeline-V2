name: Apply Studio Caption Dedupe Repair

on:
  push:
    branches: [main]
    paths:
      - 'repair/tools/patch_studio_manual_idea_progress.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply guarded caption dedupe repair
        shell: bash
        run: |
          set -euo pipefail
          python repair/tools/patch_studio_manual_idea_progress.py
          cp apps/studio-web/assets/app-item4-0619.js /tmp/studio-web.mjs
          node --check /tmp/studio-web.mjs
          grep -q 'item4-0.6.71-caption-dedupe' apps/studio-web/assets/app-item4-0619.js
          grep -q 'UI build 0.6.71' apps/studio-web/index.html
          grep -q 'const byAsset = new Map();' apps/studio-web/assets/app-item4-0619.js

      - name: Commit source repair and production Pages trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio-web/index.html apps/studio-web/assets/app-item4-0619.js deploy/cloudflare-pages-production.txt
          if ! git diff --cached --quiet; then
            git commit -m 'fix(ui): dedupe manual captions by asset'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
