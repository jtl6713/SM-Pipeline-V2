name: Pulse Speakeasy A3 Classify

# Classify Chicago Speakeasy 1 via runner A3 on the Ops host (profile already on SoR).
# Do not use /api/library/.../profile — ChicagoShining assign watermarks and
# exceeds the temporary bridge Worker wall clock (500).
# Do not rely on secrets.PIPELINE_RUNNER_SHARED_SECRET (not configured in GitHub);
# read the secret from the runner service .env via Ops shell, same as other A3 pulses.
on:
  push:
    branches: [main]
    paths:
      - 'deploy/pulse-speakeasy-classify.txt'
      - '.github/workflows/pulse-speakeasy-classify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-speakeasy-classify
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
      SPEAKEASY_ID: recEaYEwG1EGgLAmm
    steps:
      - name: Pulse Speakeasy through runner A3 via Ops
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            if [[ -z "$candidate" ]]; then continue; fi
            code=$(curl -sS --max-time 20 -o /tmp/ops-catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == "200" ]] && jq -e '.ok==true' /tmp/ops-catalog.json >/dev/null; then
              selected="$candidate"
              break
            fi
          done
          test -n "$selected"

          # PowerShell on the Ops host: health-check the runner, require the
          # Content_Profile shape fix, then foreground-pulse A3 for Speakeasy.
          SPEAKEASY_ID="$SPEAKEASY_ID" python3 - <<'PY'
          import json, os
          from pathlib import Path
          rid = os.environ["SPEAKEASY_ID"]
          ps = r'''$ErrorActionPreference = "Stop"
          $id = '@SPEAKEASY_ID@'
          $health = Invoke-RestMethod "http://127.0.0.1:3350/health" -TimeoutSec 20
          if ($health.ok -ne $true -or [string]$health.service -ne "pipeline-runner") {
            throw "runner_health_bad"
          }
          $version = [string]$health.version
          Write-Output ("runner_version=" + $version)
          if ($version -notmatch "a3-media-content-profile|a3-classify-timeout|library-upload-skip-source|library-upload-async|library-upload-wm-fallback") {
            throw ("runner version missing Content_Profile / library-upload fix: " + $version)
          }
          $envfile = Join-Path (Get-Location) "Services\pipeline-runner\service\.env"
          $line = @(Get-Content $envfile | Where-Object {$_ -match '^\s*PIPELINE_RUNNER_SHARED_SECRET\s*='}) | Select-Object -Last 1
          if (-not $line) { throw "runner_auth_missing" }
          $secret = ([string]$line -split '=', 2)[1].Trim().Trim('"', "'")
          if ($secret.Length -lt 24) { throw "runner_auth_invalid" }
          $body = @{
            extra = @{
              record_ids = @($id)
              background = $false
              trigger_a4 = $false
              wait_for_next = $false
              drain = $false
            }
          } | ConvertTo-Json -Depth 6 -Compress
          $response = Invoke-RestMethod "http://127.0.0.1:3350/stages/a3" `
            -Method POST `
            -Headers @{"X-Pipeline-Secret"=$secret} `
            -ContentType "application/json" `
            -Body $body `
            -TimeoutSec 180
          $secret = $null
          $status = [string]$response.status
          Write-Output ("a3_status=" + $status)
          $details = $response.details
          if (-not $details) { $details = $response.result }
          if (-not $details) { $details = $response }
          Write-Output ("a3_details=" + (($details | ConvertTo-Json -Depth 8 -Compress)))
          if ($status -ne "ok" -and $status -ne "skipped") {
            throw ("a3_unexpected_status=" + $status)
          }
          '''
          ps = ps.replace("@SPEAKEASY_ID@", rid)
          Path("/tmp/speakeasy-a3.ps1").write_text(ps)
          Path("/tmp/speakeasy-a3.json").write_text(json.dumps({
              "command": Path("/tmp/speakeasy-a3.ps1").read_text(),
              "confirm": True,
          }))
          PY

          code=$(curl -sS --max-time 20 -o /tmp/ops-shell-start.json -w '%{http_code}' \
            -X POST "$BASE/api/shell" \
            -H "Authorization: Bearer $selected" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/speakeasy-a3.json || true)
          echo "ops_shell_http=$code"
          if [[ "$code" != "202" && "$code" != "200" ]]; then
            echo "shell_launch_failed"
            cat /tmp/ops-shell-start.json || true
            exit 1
          fi
          job=$(jq -r '.job.id // .jobId // empty' /tmp/ops-shell-start.json)
          test -n "$job"
          echo "ops_job=$job"

          for n in $(seq 1 50); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $selected" \
              "$BASE/api/jobs/$job" -o /tmp/ops-shell-result.json
            state=$(jq -r '.job.status // empty' /tmp/ops-shell-result.json)
            if [[ "$state" == "ok" ]]; then
              jq -r '.job.log // ""' /tmp/ops-shell-result.json \
                | grep -E '^(runner_version|a3_status|a3_details)=' || true
              exit 0
            fi
            if [[ "$state" == "failed" ]]; then
              echo "speakeasy_a3_ops_failed"
              jq -r '.job.log // ""' /tmp/ops-shell-result.json \
                | grep -E '^(runner_version|a3_status|a3_details)=' || true
              jq -r '.job.log // ""' /tmp/ops-shell-result.json | tail -40 || true
              exit 1
            fi
            sleep 3
          done
          echo "speakeasy_a3_ops_timeout"
          exit 1
