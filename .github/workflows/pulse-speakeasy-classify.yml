name: Pulse Speakeasy A3 Classify

# Classify Chicago Speakeasy 1 via runner A3 (profile already on SoR).
# Do not use /api/library/.../profile — ChicagoShining assign watermarks and
# exceeds the temporary bridge Worker wall clock (500).
on:
  push:
    branches: [main]
    paths:
      - 'deploy/pulse-speakeasy-classify.txt'
      - '.github/workflows/pulse-speakeasy-classify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-speakeasy-classify
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      PIPELINE_RUNNER_SHARED_SECRET: ${{ secrets.PIPELINE_RUNNER_SHARED_SECRET }}
      RUNNER_URL: https://pipeline.chicagoshining.com
      SPEAKEASY_ID: recEaYEwG1EGgLAmm
    steps:
      - name: Pulse Speakeasy through runner A3
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCESS_CLIENT_ID:-}"
          test -n "${CF_ACCESS_CLIENT_SECRET:-}"
          test -n "${PIPELINE_RUNNER_SHARED_SECRET:-}"
          health=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            "$RUNNER_URL/health" || true)
          echo "runner_health_http=$health"
          test "$health" -eq 200
          jq -e '.ok==true and .service=="pipeline-runner"' /tmp/health.json >/dev/null
          version=$(jq -er '.version' /tmp/health.json)
          echo "runner_version=$version"
          case "$version" in
            *a3-media-content-profile*|*a3-classify-timeout*) ;;
            *)
              echo "runner version missing Content_Profile shape fix: $version" >&2
              exit 1
              ;;
          esac
          body=$(jq -cn --arg id "$SPEAKEASY_ID" '{
            extra: {
              record_ids: [$id],
              background: false,
              trigger_a4: false,
              wait_for_next: false,
              drain: false
            }
          }')
          code=$(curl -sS --max-time 180 -o /tmp/a3.json -w '%{http_code}' \
            -X POST "$RUNNER_URL/stages/a3" \
            -H "Content-Type: application/json" \
            -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            -H "X-Pipeline-Secret: $PIPELINE_RUNNER_SHARED_SECRET" \
            -d "$body" || true)
          echo "a3_http=$code"
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path("/tmp/a3.json").read_text(encoding="utf-8", errors="replace")
          print("a3_body_prefix=" + raw[:2000].replace("\n", " "))
          try:
              payload = json.loads(raw) if raw.strip() else {}
          except Exception:
              raise SystemExit("a3 response was not JSON")
          status = str(payload.get("status") or payload.get("ok") or "")
          print("a3_status=" + status)
          details = payload.get("details") or payload.get("result") or payload
          print("a3_details=" + json.dumps(details, sort_keys=True)[:1500])
          PY
          test "$code" -eq 200
          # Foreground classify returns status=ok; a concurrent Studio classify-all
          # returns skipped/already_running and queues the Speakeasy id.
          jq -e '
            (.status=="ok" or .status=="skipped")
            and (
              (.details.already_running==true)
              or (.details.classified_count // 0) >= 0
              or (.details.processed==true)
              or (.message|tostring|length) > 0
            )
          ' /tmp/a3.json >/dev/null
