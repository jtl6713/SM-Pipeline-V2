name: Deploy Item7 Exact Stage Pulse

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-item7-exact-stage-pulse.yml'

permissions:
  contents: write

concurrency:
  group: item7-exact-stage-pulse-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install exact-stage Test Mode controller
        shell: bash
        run: |
          set -euo pipefail
          python repair/scripts/patch-item7-exact-stage-controller.py
          node --check apps/studio-api/worker.js
          git diff --check
          grep -F 'repair_item7_exact_stage_pulse_v1: true' apps/studio-api/worker.js
          grep -F 'if (action === "pulse_item7_exact_stage")' apps/studio-api/worker.js
          grep -F '5569495, // R2 exact Test Mode selector pulse only' apps/studio-api/worker.js
          grep -F '5557966, // R3 exact Test Mode selector pulse only' apps/studio-api/worker.js
          grep -F '5565333, // R5 exact Test Mode selector pulse only' apps/studio-api/worker.js
          grep -F '5576363, // RR1 exact Test Mode selector pulse only' apps/studio-api/worker.js

      - name: Commit authoritative Worker source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio-api/worker.js
          git commit -m 'feat(item7): exact test pulses for scheduled render stages'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Deploy exact committed source with rollback
        shell: bash
        run: |
          set -euo pipefail
          if ! bash repair/scripts/deploy-item6-studio-controller-v2.sh; then
            git revert --no-edit "${{ steps.commit.outputs.sha }}"
            git push origin HEAD:main
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${{ steps.commit.outputs.sha }}"
          grep -F 'repair_item7_exact_stage_pulse_v1: true' /tmp/item6v2-worker-after.js
          grep -F 'if (action === "pulse_item7_exact_stage")' /tmp/item6v2-worker-after.js
          echo 'item7_active_source_markers=PASS'

      - name: Save deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item7-exact-stage-controller-${{ github.run_id }}
          path: |
            /tmp/item6v2-bindings-before.json
            /tmp/item6v2-bindings-after.json
            /tmp/item6v2-session.json
            /tmp/item6v2-source-sha256.txt
            /tmp/item6v2-active-before.txt
            /tmp/item6v2-active-after.txt
            /tmp/item6v2-dry-run.log
            /tmp/item6v2-deploy.log
            /tmp/item6v2-worker-after.js
          if-no-files-found: ignore
          retention-days: 30
