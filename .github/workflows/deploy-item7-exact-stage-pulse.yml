name: Item7 R2 Selector Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-item7-exact-stage-pulse.yml'

permissions:
  contents: write

concurrency:
  group: item7-isolated-regression
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create temporary authenticated service bridge
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          BRIDGE="chicagoshining-item7-r2-diagnostic"
          TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          cat >/tmp/bridge.js <<EOF
          export default {async fetch(request,env){const u=new URL(request.url);if(u.pathname!=="/$TOKEN")return new Response("Not found",{status:404});const body=await request.text();const r=await env.STUDIO_API.fetch(new Request("https://studio.chicagoshining.com/api/admin/repair/control",{method:"POST",headers:{"Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com","Origin":"https://studio.chicagoshining.com","Content-Type":"application/json","Accept":"application/json"},body}));return new Response(await r.text(),{status:r.status,headers:{"Content-Type":"application/json","Cache-Control":"no-store"}});}};
          EOF
          cat >/tmp/metadata.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"chicagoshining-studio-api"}]}
          EOF
          curl -sS -X DELETE "$ROOT/workers/scripts/$BRIDGE" -H "$AUTH" >/dev/null 2>&1 || true
          curl -fsS -X PUT "$ROOT/workers/scripts/$BRIDGE/content" -H "$AUTH" -F 'metadata=@/tmp/metadata.json;type=application/json' -F 'worker.js=@/tmp/bridge.js;type=application/javascript+module;filename=worker.js' -o /tmp/upload.json
          jq -e '.success==true' /tmp/upload.json >/dev/null
          curl -fsS -X POST "$ROOT/workers/scripts/$BRIDGE/subdomain" -H "$AUTH" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' -o /tmp/subdomain.json
          jq -e '.success==true and .result.enabled==true' /tmp/subdomain.json >/dev/null
          curl -fsS "$ROOT/workers/subdomain" -H "$AUTH" -o /tmp/account-subdomain.json
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "sub=$(jq -r '.result.subdomain' /tmp/account-subdomain.json)" >> "$GITHUB_OUTPUT"

      - name: Capture raw redacted R2 inspection and ledger checkpoint
        shell: bash
        env:
          BRIDGE: ${{ steps.bridge.outputs.bridge }}
          TOKEN: ${{ steps.bridge.outputs.token }}
          SUB: ${{ steps.bridge.outputs.sub }}
        run: |
          set -euo pipefail
          URL="https://$BRIDGE.$SUB.workers.dev/$TOKEN"
          curl -fsS -X POST "$URL" -H 'Content-Type: application/json' --data-binary '{"action":"inspect_make_scenario","confirm":"INSPECT-MAKE-MODULES-V1","scenario_id":5569495,"module_ids":[1]}' -o /tmp/preflight.json
          jq -e '.ok==true and .inspected.scenario_active==false and (.inspected.modules|length)==1' /tmp/preflight.json >/dev/null
          git pull --rebase origin main
          mkdir -p repair/evidence
          cp /tmp/preflight.json repair/evidence/item7-r2-selector-preflight-20260817.json
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('repair/SM_PIPELINE_21_ITEM_LEDGER.md')
          s=p.read_text()
          row='| 7 | Fresh edge-to-edge 9:16 normal-path regression | **In progress — controller proven; R2 prerequisite diagnosis active** | Controller deploy run `32060507474` PASS. Fresh CI 75 / Output 168 exact `Test_Run_ID=ITEM7_9X16_REGRESSION_RUN32060507474`, 9:16, `Do_Not_Publish=true`. First bounded R2 run `32061240553` made no target progress; R2 PASS was not recorded. Live Module 1 inspection is preserved in `repair/evidence/item7-r2-selector-preflight-20260817.json`. | Resolve only the exact R2 selector prerequisite mismatch, then retry R2 under a new one-output lease. R3 remains blocked. |'
          s,n=re.subn(r'^\| 7 \| Fresh edge-to-edge 9:16 normal-path regression \|.*$',row,s,count=1,flags=re.M)
          if n != 1: raise SystemExit('Item 7 row not found')
          marker='- R2 pending; no later Item 7 stage or publishing action has run.'
          repl='- First R2 exact pulse run `32061240553` made no target progress; no R2 PASS was recorded. R3 remained blocked.\n- Live R2 Module 1 inspection is stored at `repair/evidence/item7-r2-selector-preflight-20260817.json` for narrow fixture diagnosis.'
          if marker in s: s=s.replace(marker,repl)
          elif 'First R2 exact pulse run `32061240553`' not in s: s += '\n'+repl+'\n'
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair/evidence/item7-r2-selector-preflight-20260817.json repair/SM_PIPELINE_21_ITEM_LEDGER.md
          git commit -m 'evidence(item7): persist R2 selector diagnosis'
          git push origin HEAD:main

      - name: Remove temporary bridge
        if: always()
        shell: bash
        env:
          BRIDGE: ${{ steps.bridge.outputs.bridge }}
        run: |
          curl -sS -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null 2>&1 || true
