name: Deploy Item7 Controller Budget Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-item7-exact-stage-pulse.yml'

permissions:
  contents: write

concurrency:
  group: item7-isolated-regression
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch authoritative Worker for bounded Item7 polling and recovery
        shell: bash
        run: |
          set -euo pipefail
          python repair/scripts/patch-item7-controller-budget-recovery.py
          node --check apps/studio-api/worker.js
          git diff --check
          grep -F 'setTimeout(resolve, 6000)' apps/studio-api/worker.js
          grep -F 'max_cycles: 5, wait_ms_per_cycle: 18000' apps/studio-api/worker.js
          grep -F 'stranded_selector_recovered: strandedSelectorRecovered' apps/studio-api/worker.js

      - name: Commit repaired authoritative Worker source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio-api/worker.js
          git commit -m 'fix(item7): bound stage polling and recover stranded exact selectors'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Deploy exact committed source with Cloudflare rollback guard
        shell: bash
        run: |
          set -euo pipefail
          if ! bash repair/scripts/deploy-item6-studio-controller-v2.sh; then
            git revert --no-edit "${{ steps.commit.outputs.sha }}"
            git push origin HEAD:main
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${{ steps.commit.outputs.sha }}"
          grep -F 'setTimeout(resolve, 6000)' /tmp/item6v2-worker-after.js
          grep -F 'stranded_selector_recovered: strandedSelectorRecovered' /tmp/item6v2-worker-after.js
          echo 'item7_budget_recovery_active_source=PASS'

      - name: Update permanent ledger checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('repair/SM_PIPELINE_21_ITEM_LEDGER.md')
          s=p.read_text()
          row='| 7 | Fresh edge-to-edge 9:16 normal-path regression | **In progress — controller repaired; R2 retry pending** | Initial controller deploy `32060507474` passed, but the first exact R2 pulse hit the Cloudflare per-invocation subrequest ceiling during checkpoint polling and stranded the exact selector before rollback. Output 168 itself remained isolated and unmutated. Controller source is now repaired to poll every 6s, cap R5 at 5 cycles/lease, and recover only a stranded exact selector matching the same output + Test_Run_ID while the scenario is OFF. | Verify repaired Worker deploy, then retry R2 with a new exact lease; R3 remains blocked until R2 PASS. |'
          s,n=re.subn(r'^\| 7 \| Fresh edge-to-edge 9:16 normal-path regression \|.*$',row,s,count=1,flags=re.M)
          if n != 1: raise SystemExit('Item 7 row not found')
          note='- Controller defect found from first-pulse artifact: Cloudflare subrequest ceiling was reached during 2-second polling, preventing rollback and leaving the exact R2 selector stranded while R2 itself made no target mutation.\n- Durable controller repair: 6-second checkpoint polling, R5 max 5 cycles per lease, and same-output/same-Test_Run_ID stranded-selector recovery while scenario is verified OFF.\n'
          marker='## 2026-08-17 Item 7 exact-stage regression delta'
          if note.strip() not in s:
              pos=s.find(marker)
              if pos>=0:
                  insert=s.find('\n',pos)+1
                  s=s[:insert]+note+s[insert:]
              else:
                  s+='\n\n'+note
          p.write_text(s)
          PY
          git add repair/SM_PIPELINE_21_ITEM_LEDGER.md
          git commit -m 'docs(item7): record controller subrequest repair'
          git push origin HEAD:main

      - name: Save deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item7-controller-budget-recovery-${{ github.run_id }}
          path: |
            /tmp/item6v2-bindings-before.json
            /tmp/item6v2-bindings-after.json
            /tmp/item6v2-session.json
            /tmp/item6v2-source-sha256.txt
            /tmp/item6v2-active-before.txt
            /tmp/item6v2-active-after.txt
            /tmp/item6v2-dry-run.log
            /tmp/item6v2-deploy.log
            /tmp/item6v2-worker-after.js
          if-no-files-found: ignore
          retention-days: 30
