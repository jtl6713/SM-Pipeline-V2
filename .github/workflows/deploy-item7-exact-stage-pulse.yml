name: Item7 R2 Repaired Controller Retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-item7-exact-stage-pulse.yml'

permissions:
  contents: write

concurrency:
  group: item7-isolated-regression
  cancel-in-progress: false

jobs:
  r2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TEST_RUN_ID: ITEM7_9X16_REGRESSION_RUN32060507474
      CONTENT_RECORD_ID: recA0WClSp6SR6vvl
      OUTPUT_RECORD_ID: recByMge4QPlCOsD2
      SCENARIO_ID: '5569495'
      LEASE_ID: ITEM7-R2-RUN32060507474-L3
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Create temporary authenticated service bridge
        id: bridge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          BRIDGE="chicagoshining-item7-r2-l3"; TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')
          cat >/tmp/bridge.js <<EOF
          export default {async fetch(request,env){const u=new URL(request.url);if(u.pathname!=="/$TOKEN")return new Response("Not found",{status:404});const r=await env.STUDIO_API.fetch(new Request("https://studio.chicagoshining.com/api/admin/repair/control",{method:"POST",headers:{"Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com","Origin":"https://studio.chicagoshining.com","Content-Type":"application/json","Accept":"application/json"},body:await request.text()}));return new Response(await r.text(),{status:r.status,headers:{"Content-Type":"application/json","Cache-Control":"no-store"}});}};
          EOF
          cat >/tmp/metadata.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"chicagoshining-studio-api"}]}
          EOF
          curl -sS -X DELETE "$ROOT/workers/scripts/$BRIDGE" -H "$AUTH" >/dev/null 2>&1 || true
          curl -fsS -X PUT "$ROOT/workers/scripts/$BRIDGE/content" -H "$AUTH" -F 'metadata=@/tmp/metadata.json;type=application/json' -F 'worker.js=@/tmp/bridge.js;type=application/javascript+module;filename=worker.js' -o /tmp/upload.json
          jq -e '.success==true' /tmp/upload.json >/dev/null
          curl -fsS -X POST "$ROOT/workers/scripts/$BRIDGE/subdomain" -H "$AUTH" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' -o /tmp/subdomain.json
          curl -fsS "$ROOT/workers/subdomain" -H "$AUTH" -o /tmp/account-subdomain.json
          echo "bridge=$BRIDGE" >> "$GITHUB_OUTPUT"; echo "token=$TOKEN" >> "$GITHUB_OUTPUT"; echo "sub=$(jq -r '.result.subdomain' /tmp/account-subdomain.json)" >> "$GITHUB_OUTPUT"

      - name: Acquire exact R2 lease and pulse one cycle
        shell: bash
        env:
          BRIDGE: ${{ steps.bridge.outputs.bridge }}
          TOKEN: ${{ steps.bridge.outputs.token }}
          SUB: ${{ steps.bridge.outputs.sub }}
        run: |
          set -euo pipefail
          URL="https://$BRIDGE.$SUB.workers.dev/$TOKEN"
          curl -fsS -X POST "$URL" -H 'Content-Type: application/json' --data-binary '{"action":"inspect_make_scenario","confirm":"INSPECT-MAKE-MODULES-V1","scenario_id":5569495,"module_ids":[1]}' -o /tmp/preflight.json
          jq -e '.ok==true and .inspected.scenario_active==false' /tmp/preflight.json >/dev/null
          EXPIRES=$(date -u -d '+15 minutes' '+%Y-%m-%dT%H:%M:%SZ')
          acquire=$(jq -cn --arg tr "$TEST_RUN_ID" --arg lease "$LEASE_ID" --arg exp "$EXPIRES" --arg out "$OUTPUT_RECORD_ID" --arg ci "$CONTENT_RECORD_ID" --argjson sid "$SCENARIO_ID" '{action:"acquire",test_run_id:$tr,lease_id:$lease,scenario_id:$sid,max_runs:1,max_operations:30,expires_at:$exp,allowed_platform_output_record_ids:[$out],allowed_content_item_record_ids:[$ci],deny_fixture_record_ids:[],allow_public_publish:false}')
          curl -fsS -X POST "$URL" -H 'Content-Type: application/json' --data-binary "$acquire" -o /tmp/acquire.json
          jq -e '.ok==true' /tmp/acquire.json >/dev/null
          pulse=$(jq -cn --arg tr "$TEST_RUN_ID" --arg lease "$LEASE_ID" --arg out "$OUTPUT_RECORD_ID" --argjson sid "$SCENARIO_ID" '{action:"pulse_item7_exact_stage",test_run_id:$tr,lease_id:$lease,scenario_id:$sid,platform_output_record_id:$out,max_cycles:1}')
          code=$(curl -sS -o /tmp/pulse.json -w '%{http_code}' -X POST "$URL" -H 'Content-Type: application/json' --data-binary "$pulse")
          cat /tmp/pulse.json | jq .
          test "$code" = 200
          jq -e --arg out "$OUTPUT_RECORD_ID" '.ok==true and .stage=="R2" and .platform_output_record_id==$out and .checkpoint.asset_selection_status=="Selected" and .checkpoint.selected_assets_present==true and (.checkpoint.selected_clip_count>0) and .scenario_stopped==true and .selector_restored==true and .schedule_preserved==true and .do_not_publish_preserved==true' /tmp/pulse.json >/dev/null

      - name: Record R2 PASS in permanent ledger
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          CLIPS=$(jq -r '.checkpoint.selected_clip_count' /tmp/pulse.json)
          RECOVERED=$(jq -r '.stranded_selector_recovered' /tmp/pulse.json)
          python - "$CLIPS" "$RECOVERED" <<'PY'
          from pathlib import Path
          import re,sys
          clips,recovered=sys.argv[1:3]
          p=Path('repair/SM_PIPELINE_21_ITEM_LEDGER.md'); s=p.read_text()
          row=f'| 7 | Fresh edge-to-edge 9:16 normal-path regression | **In progress — R2 proven** | Repaired Item 7 controller deployed in run `32062013319`. Fresh CI 75 / Output 168 remains exact-Test_Run_ID isolated and `Do_Not_Publish=true`. R2 `5569495` PASS with selected clip count {clips}; stranded exact selector recovered={recovered}; scenario OFF, production selector and schedule restored. | Pulse R3 `5557966` under a fresh exact lease and require Ready-for-Render package + restoration proof. |'
          s,n=re.subn(r'^\| 7 \| Fresh edge-to-edge 9:16 normal-path regression \|.*$',row,s,count=1,flags=re.M)
          if n!=1: raise SystemExit('Item 7 row not found')
          s += f'\n- R2 repaired-controller PASS: selected clip count {clips}; stranded selector recovered={recovered}; exact production selector/schedule restored and scenario OFF. R3 is next.\n'
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair/SM_PIPELINE_21_ITEM_LEDGER.md; git commit -m 'docs(item7): record repaired-controller R2 pass'; git push origin HEAD:main

      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item7-r2-l3-${{ github.run_id }}
          path: |
            /tmp/preflight.json
            /tmp/acquire.json
            /tmp/pulse.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove temporary bridge
        if: always()
        shell: bash
        env: {BRIDGE: '${{ steps.bridge.outputs.bridge }}'}
        run: curl -sS -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null 2>&1 || true
