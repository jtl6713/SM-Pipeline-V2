name: Issue 2970 remaining original preview evidence
on:
  pull_request:
    branches: [main]
    paths:
      - 'repair/scripts/issue2970-remaining-preview-audit.py'
      - '.github/workflows/issue2970-remaining-preview-audit.yml'
  push:
    branches: [main]
    paths:
      - 'repair/scripts/issue2970-remaining-preview-audit.py'
      - '.github/workflows/issue2970-remaining-preview-audit.yml'
permissions:
  contents: read
concurrency:
  group: issue2970-old-preview-audit
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read exact preview and existing source links only
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'numpy==2.2.6'
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          OPENBLAS_NUM_THREADS=1 python repair/scripts/issue2970-remaining-preview-audit.py
