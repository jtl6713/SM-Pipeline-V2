name: Inspect I1 Core
on:
  push:
    branches: [main]
    paths:
      - 'deploy/inspect-i1-core.txt'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - name: Extract modules 1-3 and scenario metadata
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:CLOUDFLARE_API_TOKEN -in deploy/credential-envelope/private.pem.enc -out /tmp/key.pem
          base64 -d deploy/credential-envelope/airtable_pat.ciphertext.b64 >/tmp/pat.enc
          openssl pkeyutl -decrypt -inkey /tmp/key.pem -in /tmp/pat.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -out /tmp/pat.txt
          export AIRTABLE_PAT="$(tr -d '\r\n' </tmp/pat.txt)"
          python - <<'PY'
          import json,os,urllib.request,urllib.parse
          B='appe33zkZn35yirTL';T='tblpHPWeEkyJaF7ql';SID=5514334
          def get(u,h):
            with urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=60) as r:return json.loads(r.read() or b'{}')
          pat=os.environ['AIRTABLE_PAT']; q=urllib.parse.urlencode([('filterByFormula',"AND({Active}=1,OR({Setting_Name}='MAKE_API_TOKEN',{Setting_Name}='MAKE_API_BASE_URL'))"),('fields[]','Setting_Name'),('fields[]','Setting_Value')])
          p=get(f'https://api.airtable.com/v0/{B}/{T}?{q}',{'Authorization':f'Bearer {pat}'})
          v={x['fields']['Setting_Name']:x['fields'].get('Setting_Value','') for x in p['records']}; base=v['MAKE_API_BASE_URL'].rstrip('/'); h={'Authorization':f"Token {v['MAKE_API_TOKEN']}"}
          meta=get(f'{base}/scenarios/{SID}',h); bp=get(f'{base}/scenarios/{SID}/blueprint?draft=false',h); b=bp.get('blueprint') or (bp.get('response') or {}).get('blueprint') or bp
          if isinstance(b,str):b=json.loads(b)
          def flat(flow):
            out=[]
            for n in flow or []:
              out.append(n)
              for rt in n.get('routes') or []:out+=flat(rt.get('flow') or [])
            return out
          mods=[]
          for m in flat(b.get('flow')):
            if int(m.get('id') or -1) in (1,2,3):mods.append(m)
          s=meta.get('scenario') or (meta.get('response') or {}).get('scenario') or meta
          # strip connection IDs/metadata detail; mapper/filters are what we need
          out={'scenario':{'id':s.get('id'),'name':s.get('name'),'isActive':s.get('isActive'),'scheduling':s.get('scheduling'),'hookId':s.get('hookId')},'modules':[{'id':m.get('id'),'module':m.get('module'),'mapper':m.get('mapper'),'parameters':{k:v for k,v in (m.get('parameters') or {}).items() if k!='__IMTCONN__'},'filter':m.get('filter'),'name':((m.get('metadata') or {}).get('designer') or {}).get('name')} for m in mods]}
          os.makedirs('repair/evidence',exist_ok=True);open('repair/evidence/i1-core-inspection.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair/evidence/i1-core-inspection.json
          if ! git diff --cached --quiet; then git commit -m 'evidence: inspect I1 core selector'; git push origin HEAD:main; fi
      - if: always()
        run: rm -f /tmp/key.pem /tmp/pat.enc /tmp/pat.txt
