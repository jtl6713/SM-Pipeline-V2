name: Issue 3159 exact Miami Instagram gallery provider inventory
on:
  pull_request:
    paths:
      - '.github/workflows/issue3159-8357-instagram-owner-readonly.yml'
      - 'repair/scripts/issue3159-8357-instagram-owner-readonly.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue3159-8357-instagram-owner-readonly.yml'
      - 'repair/scripts/issue3159-8357-instagram-owner-readonly.ps1'
permissions:
  contents: read
  statuses: write
concurrency:
  group: ${{ github.event_name == 'push' && 'chicagoshining-studio-api-production-deploy' || format('3159-miami-audit-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false
jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact gallery and GET-only scope
        shell: pwsh
        run: |
          $file='repair/scripts/issue3159-8357-instagram-owner-readonly.ps1'
          $tokens=$null;$errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count){$errors|ForEach-Object{Write-Error $_.Message};exit 1}
          $src=Get-Content -Raw $file
          foreach($required in @('vkwvscgisqsbuwagdvtb','recSiZREAQuoicqm7','recpNlNn6U6eq0M9r','graph.facebook.com','MIAMI_INSTAGRAM_BUSINESS_ACCOUNT_ID','MIAMI_META_GRAPH_API_ACCESS_TOKEN','provider_writes=0','output_writes=0','retry_authorized=$false')){
            if(-not $src.Contains($required)){throw 'required_identity_or_safety_constraint_missing'}
          }
          foreach($bad in @('-Method Post','-Method Patch','-Method Put','-Method Delete','/media_publish','api.airtable.com','Write-Output $secret','Write-Host $secret')){
            if($src.Contains($bad)){throw 'provider_write_or_unsafe_operation_prohibited'}
          }
          Write-Output 'IG3159_EXACT_STATUS_STATIC_PASS'
  live-owner-readback:
    if: github.event_name == 'push'
    needs: static-safety
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPS_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify minute-only scheduler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PYTHONPATH=repair/scripts python - <<'PY'
          from issue3159_cron_containment import call,schedules
          assert schedules(call('GET'))==['* * * * *']
          print('ig3159_pre_crons=minute_only')
          PY
      - name: Obtain existing protected Ops credential
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$OPS_A" "$OPS_B" "$OPS_C"; do
            test -n "$candidate" || continue
            http=$(curl -sS --max-time 20 -o /tmp/p1-4785-catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" 'https://ops.chicagoshining.com/api/catalog' || true)
            if [[ "$http" == 200 ]] && jq -e '.ok==true' /tmp/p1-4785-catalog.json >/dev/null; then
              echo "::add-mask::$candidate"
              echo "P1_4785_OPS_TOKEN=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'Ops authentication unavailable; no provider action';exit 1
      - name: Read exact Miami account, saved containers and bounded media inventory only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re,pathlib
          source=pathlib.Path('repair/scripts/issue3159-8357-instagram-owner-readonly.ps1')
          sha=os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}',sha)
          expected=hashlib.sha256(source.read_bytes()).hexdigest()
          url=f'https://raw.githubusercontent.com/jtl6713/SM-Pipeline-V2/{sha}/{source.as_posix()}'
          command=("$ErrorActionPreference='Stop';"
            "$tmp=Join-Path $env:TEMP ('issue3159-miami8357-'+[guid]::NewGuid().ToString('N')+'.ps1');"
            f"Invoke-WebRequest -Uri '{url}' -OutFile $tmp -UseBasicParsing -TimeoutSec 55;"
            f"if((Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant() -ne '{expected}'){{throw 'audit_source_hash_mismatch'}};"
            "try{& $tmp}finally{Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue}")
          assert len(command)<8000
          pathlib.Path('/tmp/p1-4785-request.json').write_text(json.dumps({'command':command,'confirm':True}))
          PY
          admitted=false
          for attempt in $(seq 1 2); do
            http=$(curl -sS --max-time 30 -o /tmp/p1-4785-start.json -w '%{http_code}' \
              -X POST 'https://ops.chicagoshining.com/api/shell' \
              -H "Authorization: Bearer $P1_4785_OPS_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @/tmp/p1-4785-request.json || true)
            if [[ "$http" == 200 || "$http" == 202 ]]; then admitted=true;break;fi
            if [[ "$http" != 409 ]]; then echo "Ops denied protected status check ($http)";exit 2;fi
            sleep 8
          done
          if [[ "$admitted" != true ]]; then echo 'Ops busy; no provider status call';exit 2;fi
          job=$(jq -er '.job.id // .jobId' /tmp/p1-4785-start.json)
          for n in $(seq 1 130); do
            curl -fsS --max-time 30 -H "Authorization: Bearer $P1_4785_OPS_TOKEN" \
              "https://ops.chicagoshining.com/api/jobs/$job" -o /tmp/p1-4785-job.json
            status=$(jq -r '.job.status // empty' /tmp/p1-4785-job.json)
            if [[ "$status" == ok ]]; then
              jq -r '.job.log // ""' /tmp/p1-4785-job.json | grep '^IG3159_STATUS=' | sed 's/^IG3159_STATUS=//' | jq -s . >/tmp/p1-4785-evidence.json
              # Print the sanitized, allowlisted phase proof even if live acceptance fails.
              jq -c '[.[] | {output,read_only,provider_writes,output_writes,retry_authorized,phase,failure_class,reason,owner_verified,canonical_unchanged,provider_get_calls,inventory_complete,inventory_pages,oldest_timestamp,newest_timestamp,timestamp_order_verified,posts_scanned,child_statuses,exact_caption_candidates}]' /tmp/p1-4785-evidence.json
              jq -e 'length==1 and .[0].output==8357 and .[0].read_only==true and .[0].provider_writes==0 and .[0].output_writes==0 and .[0].retry_authorized==false and .[0].owner_verified==true and .[0].canonical_unchanged==true and (.[0].child_statuses|length)==8 and .[0].provider_get_calls<=14 and .[0].phase=="complete"' /tmp/p1-4785-evidence.json >/dev/null
              exit 0
            elif [[ "$status" == failed ]];then echo 'Ops status job failed; no provider retries';exit 3;fi
            sleep 4
          done
          echo 'Original Instagram inventory unresolved';exit 4
      - name: Retain sanitized status evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue3159-8357-ig-owner-inventory
          path: /tmp/p1-4785-evidence.json
          retention-days: 30
          if-no-files-found: warn
      - name: Verify cron unchanged
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PYTHONPATH=repair/scripts python - <<'PY'
          from issue3159_cron_containment import call,schedules
          assert schedules(call('GET'))==['* * * * *']
          print('ig3159_post_crons=minute_only')
          PY
      - name: Record protected readback receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          STATE=failure
          if [[ "$RESULT" == success ]]; then STATE=success; fi
          jq -nc --arg state "$STATE" --arg url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:"production/issue3159-8357-instagram-owner-inventory",target_url:$url,description:"Read-only exact Miami Instagram owner and inventory evidence"}' >/tmp/tt3159-status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --data-binary @/tmp/tt3159-status.json >/dev/null
