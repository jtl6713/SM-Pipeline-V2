name: Patch Studio SMV1 Exact Test Pulse
on:
  push:
    branches: [main]
    paths: ['deploy/patch-studio-smv1-exact-test-pulse.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Patch exact test-only SMV1 selector pulse
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/studio-api/worker.js'); s=p.read_text()
          def once(old,new,label):
              global s
              c=s.count(old)
              if c!=1: raise SystemExit(f'{label}: expected 1 match, found {c}')
              s=s.replace(old,new,1); print('patched',label)

          anchor='''const ITEM4_SMV1_SCENARIO_ID = 5894885;\nconst ITEM4_P3_SCENARIO_ID = 5531703;'''
          replacement='''const ITEM4_SMV1_SCENARIO_ID = 5894885;\nconst ITEM4_SMV1_BASE_ELIGIBILITY_FORMULA = 'OR(AND({Asset_Kind}="Master Original",{Transfer_Status}="Pending"),AND({Asset_Kind}="Platform Variant",OR({Transfer_Status}="Pending",{Transfer_Status}="Drive Uploaded")),AND(OR({Asset_Kind}="Master Original",{Asset_Kind}="Platform Variant"),{Transfer_Status}="Ready",{Preview_Status}="Pending"))';\nconst ITEM4_SMV1_PRODUCTION_FORMULA = `AND({Test_Run_ID}=BLANK(),${ITEM4_SMV1_BASE_ELIGIBILITY_FORMULA})`;\nconst ITEM4_P3_SCENARIO_ID = 5531703;'''
          once(anchor,replacement,'SMV1 selector constants')

          helper='''\nfunction item4Smv1FormulaQuoted(value) {\n  return String(value || "").replace(/\\\\/g, "\\\\\\\\").replace(/"/g, '\\\\"');\n}\n\nfunction item4Smv1ExactTestFormula(recordId, testRunId) {\n  const rid = item4Smv1FormulaQuoted(recordId);\n  const tid = item4Smv1FormulaQuoted(testRunId);\n  return `AND({Production_Request_Record_ID}="${rid}",{Test_Run_ID}="${tid}",${ITEM4_SMV1_BASE_ELIGIBILITY_FORMULA})`;\n}\n\nasync function item4SetSmv1SelectorFormula(env, formula) {\n  const { makeApiBase, headers } = await phase6MakeApiConfig(env);\n  const getBlueprint = async () => {\n    const response = await fetch(`${makeApiBase}/scenarios/${ITEM4_SMV1_SCENARIO_ID}/blueprint?draft=false`, {method:"GET", headers});\n    const raw = await response.text();\n    if (!response.ok) throw new HttpError(response.status, `SMV1 selector read failed (${response.status}): ${raw.slice(0, 240)}`);\n    const body = raw ? JSON.parse(raw) : {};\n    const wrapped = body?.blueprint ?? body?.response?.blueprint ?? body;\n    return typeof wrapped === "string" ? JSON.parse(wrapped) : wrapped;\n  };\n  const findModule = (flow, id) => {\n    for (const node of flow || []) {\n      if (Number(node?.id) === Number(id)) return node;\n      for (const route of node?.routes || []) {\n        const found = findModule(route?.flow || [], id);\n        if (found) return found;\n      }\n    }\n    return null;\n  };\n  const blueprint = await getBlueprint();\n  const module1 = findModule(blueprint?.flow || [], 1);\n  if (!module1 || module1.module !== "airtable:ActionSearchRecords") throw new HttpError(409, "SMV1 Module 1 selector contract drifted");\n  if (String(module1?.mapper?.maxRecords || "") !== "1") throw new HttpError(409, "SMV1 Module 1 is no longer maxRecords=1");\n  if (String(module1?.mapper?.formula || "") === formula) return false;\n  module1.mapper.formula = formula;\n  const patch = await fetch(`${makeApiBase}/scenarios/${ITEM4_SMV1_SCENARIO_ID}?confirmed=true`, {\n    method:"PATCH", headers, body:JSON.stringify({blueprint:JSON.stringify(blueprint)})\n  });\n  const patchRaw = await patch.text();\n  if (!patch.ok) throw new HttpError(patch.status, `SMV1 selector patch failed (${patch.status}): ${patchRaw.slice(0, 240)}`);\n  const verified = await getBlueprint();\n  const verifiedModule1 = findModule(verified?.flow || [], 1);\n  if (String(verifiedModule1?.mapper?.formula || "") !== formula || String(verifiedModule1?.mapper?.maxRecords || "") !== "1") {\n    throw new HttpError(502, "SMV1 selector verification failed");\n  }\n  return true;\n}\n'''
          once('''async function item4DrainVariantWorker(env, recordId, maxRuns) {''',helper+'''\nasync function item4DrainVariantWorker(env, recordId, maxRuns) {''','selector helper before drain')

          once(
          '''  await item4EnsureSmv1PreviewCacheWorker(env);\n\n  const originalState = await phase6ScenarioState(env, ITEM4_SMV1_SCENARIO_ID);\n  const executionIds = [];''',
          '''  await item4EnsureSmv1PreviewCacheWorker(env);\n\n  const ownerRecord = await airtableFetch(env, PRODUCTION_REQUEST_TABLE, recordId);\n  const testRunId = String(f(ownerRecord, "Test_Run_ID") || "").trim();\n  const originalState = await phase6ScenarioState(env, ITEM4_SMV1_SCENARIO_ID);\n  if (testRunId && originalState.isActive) {\n    throw new HttpError(409, "Test Mode refuses to seize an already-active SMV1 scenario");\n  }\n  const executionIds = [];''',
          'read owner identity and refuse active seizure')

          once(
          '''      const failed = current.filter((row) => item4QueueStatus(row) === "Failed");\n      if (!outstanding.length || failed.length) break;\n\n      if (!originalState.isActive) {''',
          '''      const failed = current.filter((row) => item4QueueStatus(row) === "Failed");\n      if (!outstanding.length || failed.length) break;\n      if (testRunId) {\n        const crossBoundary = current.filter((row) => String(f(row, "Test_Run_ID") || "").trim() !== testRunId);\n        if (crossBoundary.length) throw new HttpError(409, "SMV1 Test Mode queue contains a blank or mismatched Test_Run_ID");\n      }\n\n      if (!originalState.isActive) {''',
          'validate queue identity before pulse')

          once(
          '''        await phase6SetScenarioActive(env, ITEM4_SMV1_SCENARIO_ID, true);\n        await new Promise((resolve) => setTimeout(resolve, 2500));\n        try { await phase6SetScenarioActive(env, ITEM4_SMV1_SCENARIO_ID, false); } catch {}''',
          '''        let exactTestSelectorInstalled = false;\n        try {\n          if (testRunId) {\n            await item4SetSmv1SelectorFormula(env, item4Smv1ExactTestFormula(recordId, testRunId));\n            exactTestSelectorInstalled = true;\n          }\n          await phase6SetScenarioActive(env, ITEM4_SMV1_SCENARIO_ID, true);\n          await new Promise((resolve) => setTimeout(resolve, 2500));\n        } finally {\n          try { await phase6SetScenarioActive(env, ITEM4_SMV1_SCENARIO_ID, false); } catch {}\n          if (exactTestSelectorInstalled) {\n            await item4SetSmv1SelectorFormula(env, ITEM4_SMV1_PRODUCTION_FORMULA);\n          }\n        }''',
          'exact test selector install/restore around pulse')

          once(
          '''  } finally {\n    if (!originalState.isActive) {\n      try { await phase6SetScenarioActive(env, ITEM4_SMV1_SCENARIO_ID, false); } catch {}\n    }\n  }\n\n  return executionIds;\n}''',
          '''  } finally {\n    if (!originalState.isActive) {\n      try { await phase6SetScenarioActive(env, ITEM4_SMV1_SCENARIO_ID, false); } catch {}\n    }\n    if (testRunId) {\n      try { await item4SetSmv1SelectorFormula(env, ITEM4_SMV1_PRODUCTION_FORMULA); } catch {}\n    }\n  }\n\n  return executionIds;\n}''',
          'outer guaranteed selector restoration')

          once(
          '''          studio_smv1_queue_test_identity_v1: true,''',
          '''          studio_smv1_queue_test_identity_v1: true,\n          studio_smv1_exact_test_pulse_v1: true,''',
          'health capability')

          p.write_text(s)
          PY
          node --check apps/studio-api/worker.js
          git diff --check
          grep -q 'studio_smv1_exact_test_pulse_v1: true' apps/studio-api/worker.js
          grep -q 'Test Mode refuses to seize an already-active SMV1 scenario' apps/studio-api/worker.js
          grep -q 'item4SetSmv1SelectorFormula(env, ITEM4_SMV1_PRODUCTION_FORMULA)' apps/studio-api/worker.js
          git config user.name 'SM Pipeline Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/studio-api/worker.js
          git commit -m 'repair: exact Test Mode selector pulse for SMV1'
          git push
