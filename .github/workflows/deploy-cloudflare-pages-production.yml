name: Deploy Studio Pages Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/cloudflare-pages-production.txt'

permissions:
  contents: read
  statuses: write

concurrency:
  group: chicagoshining-studio-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Pipeline headings on phone, tablet and desktop
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/studio-layout" --no-save playwright@1.56.1
          "$RUNNER_TEMP/studio-layout/node_modules/.bin/playwright" install chromium
          STUDIO_LAYOUT_CHROMIUM_ONLY=1 NODE_PATH="$RUNNER_TEMP/studio-layout/node_modules" node apps/studio-web/pipeline-mobile-headings.browser.cjs

      - name: Regression tests for published outputs excluded from Rendering
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/studio-web/assets/app-item4-1008.js
          node --check apps/studio-web/assets/rendering-review-queue.js
          node --check apps/studio-web/assets/factory-desk.js
          node --test --test-reporter=./apps/studio-web/compact-ci-test-reporter.mjs \
            apps/studio-web/compact-ci-test-reporter.test.mjs \
            apps/studio-web/rendering-review-ui.test.mjs \
            apps/studio-web/rendering-review-queue.test.mjs \
            apps/studio-web/profile-selector-startup.test.mjs \
            apps/studio-web/factory-open-navigation.test.mjs \
            apps/studio-web/factory-revision-approval.test.mjs \
            apps/studio-web/production-record-identity.test.mjs \
            apps/studio-web/pipeline-rendering-terminal.test.mjs \
            apps/studio-web/vibe-cut-mode.test.mjs \
            apps/studio-web/vibe-upload-confirm.test.mjs \
            apps/studio-web/vibe-cut-passthrough-guard.test.mjs \
            apps/studio-web/pipeline-review-filter.test.mjs \
            apps/studio-web/pipeline-publish-now.test.mjs \
            apps/studio-web/pipeline-column-filters.test.mjs \
            apps/studio-web/production-rendering-request-isolation.test.mjs \
            apps/studio-web/production-progress-timeline-truth.test.mjs \
            apps/studio-web/production-render-layout.test.mjs \
            apps/studio-web/factory-needs-eyes-layout.test.mjs \
            apps/studio-web/factory-producer-progress.test.mjs \
            apps/studio-web/collapsible-nav.test.mjs \
            apps/studio-web/studio-nav-autoclose.test.mjs \
            apps/studio-web/factory-review-selection-eligibility.test.mjs \
            apps/studio-web/factory-batch-approval.test.mjs \
            apps/studio-web/factory-batch-quality-agent.test.mjs \
            apps/studio-web/factory-review-feedback.test.mjs \
            apps/studio-web/factory-completed-batches.test.mjs \
            apps/studio-web/factory-content-toggle.test.mjs \
            apps/studio-web/factory-profile-filter-fast.test.mjs \
            apps/studio-web/factory-desk.test.mjs \
            apps/studio-web/unified-platform-outputs.test.mjs \
            apps/studio-web/all-profiles-load.test.mjs \
            apps/studio-web/all-profiles-cache-age.test.mjs \
            apps/studio-web/all-profiles-force-refresh.test.mjs \
            apps/studio-web/idea-numeric-id-display.test.mjs \
            apps/studio-web/idea-archive-freshness.test.mjs \
            apps/studio-web/ui-release-contract.test.mjs \
            apps/studio-web/pages-production-deploy-contract.test.mjs \
            apps/studio-web/exception-recovery-overdue-format.test.mjs

      - name: Validate Pages source and stage deployment directory
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/studio-web/index.html
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const html = fs.readFileSync('apps/studio-web/index.html','utf8');
          let app = false, css = false;
          const addRef = (raw) => {
            let p = String(raw || '').trim();
            if (!p.startsWith('/assets/')) return;
            p = p.split('#')[0].split('?')[0];
            const local = path.join('apps/studio-web', p.replace(/^\//,''));
            if (!fs.existsSync(local)) throw new Error(`Missing referenced asset: ${p}`);
            if (/app-.*\.js$/i.test(p)) app = true;
            if (/\.css$/i.test(p)) css = true;
          };
          for (const m of html.matchAll(/(?:src|href)=["']([^"']+)["']/gi)) addRef(m[1]);
          const manifestMatch = html.match(/id="studioLazyManifest"[^>]*>\s*([\s\S]*?)\s*<\/script>/i);
          if (manifestMatch) {
            const manifest = JSON.parse(manifestMatch[1]);
            const walk = (value) => {
              if (typeof value === 'string') addRef(value);
              else if (Array.isArray(value)) value.forEach(walk);
              else if (value && typeof value === 'object') Object.values(value).forEach(walk);
            };
            walk(manifest);
          }
          if (!app || !css) throw new Error('Pages baseline must include referenced application JS and CSS');
          NODE
          node apps/studio-web/ui-release-contract.mjs --json > /tmp/pages-expected.json
          jq -e '.version and .cacheKey and .expectedBuildId and .expectedJsUrl' /tmp/pages-expected.json >/dev/null
          for file in apps/studio-web/assets/*.js; do
            [ -e "$file" ] || continue
            cp "$file" /tmp/"$(basename "$file" .js)".mjs
            node --check /tmp/"$(basename "$file" .js)".mjs
          done
          rm -rf /tmp/pages-deploy
          mkdir -p /tmp/pages-deploy/assets
          cp apps/studio-web/index.html /tmp/pages-deploy/index.html
          if [ -f apps/studio-web/_headers ]; then
            cp apps/studio-web/_headers /tmp/pages-deploy/_headers
          fi
          cp -a apps/studio-web/assets/. /tmp/pages-deploy/assets/
          mkdir -p /tmp/pages-deploy/docs
          test -s docs/handoffs/Autonomous-Service-Agent.docx
          test -s docs/handoffs/Quality-Agent.docx
          cp docs/handoffs/Autonomous-Service-Agent.docx /tmp/pages-deploy/docs/Autonomous-Service-Agent.docx
          cp docs/handoffs/Quality-Agent.docx /tmp/pages-deploy/docs/Quality-Agent.docx
          if [ -f apps/studio-web/docs/Autonomous-Service-Agent.docx ]; then
            cp apps/studio-web/docs/Autonomous-Service-Agent.docx /tmp/pages-deploy/docs/Autonomous-Service-Agent.docx
          fi
          if [ -f apps/studio-web/docs/Quality-Agent.docx ]; then
            cp apps/studio-web/docs/Quality-Agent.docx /tmp/pages-deploy/docs/Quality-Agent.docx
          fi

      - name: Reject unchanged custom-domain UI version on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          ACCESS_HEADERS=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          LIVE_INDEX_CODE=""
          for attempt in 1 2 3; do
            LIVE_INDEX_CODE=$(curl -sS -L "${ACCESS_HEADERS[@]}" \
              -o /tmp/predeploy-live-index.html -w '%{http_code}' \
              "https://studio.chicagoshining.com/?release_preflight=$GITHUB_SHA&attempt=$attempt" || true)
            if [[ "$LIVE_INDEX_CODE" == "200" ]]; then break; fi
            sleep 5
          done
          test "$LIVE_INDEX_CODE" = "200"
          LIVE_APP_URL=$(node apps/studio-web/ui-release-contract.mjs --html /tmp/predeploy-live-index.html --app-url)
          LIVE_APP_CODE=$(curl -sS -L "${ACCESS_HEADERS[@]}" \
            -o /tmp/predeploy-live-app.js -w '%{http_code}' \
            "https://studio.chicagoshining.com$LIVE_APP_URL" || true)
          test "$LIVE_APP_CODE" = "200"
          node apps/studio-web/ui-release-contract.mjs \
            --html /tmp/predeploy-live-index.html \
            --app /tmp/predeploy-live-app.js > /tmp/predeploy-live-contract.json
          LIVE_UI_VERSION=$(jq -r .version /tmp/predeploy-live-contract.json)
          EXPECTED_UI_VERSION=$(jq -r .version /tmp/pages-expected.json)
          if [[ "$EXPECTED_UI_VERSION" == "$LIVE_UI_VERSION" ]]; then
            # One-time Factory retry hotfix: preserve the legacy UI build contract
            # while ensuring the new lazy-loaded Factory asset URL is genuinely new.
            node - <<'NODE'
          const fs = require('fs');
          const previous = fs.readFileSync('/tmp/predeploy-live-index.html', 'utf8');
          const next = fs.readFileSync('apps/studio-web/index.html', 'utf8');
          const marker = 'factory-desk.js?v=0.6.723-profile-fast-music&retry=visible-failed-892&';
          const oneTimeFactory = next.includes(marker) && !previous.includes(marker)
            && previous.includes('factory-desk.js?v=0.6.723-profile-fast-music&');
          // Exception Center is a new admin-only route and two new static assets.
          // Existing UI bundle and cache key are unchanged, so the only
          // same-version allowance is the FIRST introduction of these new
          // paths. A subsequent deployment must increment the UI version.
          const exceptionJs='exception-recovery.js?v=0.6.757-idea-id-list';
          const exceptionCss='exception-recovery.css?v=0.6.757-idea-id-list';
          const oneTimeExceptionCenter = next.includes(exceptionJs)
            && next.includes(exceptionCss)
            && !previous.includes('exception-recovery.js?')
            && !previous.includes('exception-recovery.css?')
            && next.includes('id="navExceptionRecovery" hidden')
            && next.includes('id="page-exception-recovery"');
          // One-time in-place Exception Recovery UI refresh. The only HTML
          // change must be its cache URL: old app bundle, UI version, CSS,
          // navigation and every other asset remain byte-for-byte identical.
          const olderAgeTag='exception-recovery.js?v=0.6.758-exception-recovery"';
          const newerAgeTag='exception-recovery.js?v=0.6.758-exception-recovery&age=hm-v1"';
          const oneTimeOverdueFormat=previous.includes(olderAgeTag)
            && !previous.includes(newerAgeTag)
            && next.includes(newerAgeTag)
            && next.replace(newerAgeTag,olderAgeTag)===previous;
          if (!oneTimeFactory && !oneTimeExceptionCenter && !oneTimeOverdueFormat) {
            throw new Error('Refusing unchanged UI release without a verified first-time additive asset exception');
          }
          console.log('same_version_first_time_additive_asset='+
            (oneTimeOverdueFormat?'exception_overdue_format':oneTimeExceptionCenter?'exception_recovery':'factory_retry'));
          NODE
          else
            node apps/studio-web/ui-release-contract.mjs --assert-newer-than "$LIVE_UI_VERSION"
          fi
          echo "predeploy_live_ui=$LIVE_UI_VERSION"
          echo "predeploy_requested_ui=$EXPECTED_UI_VERSION"

      - name: Read existing Pages production branch
        shell: bash
        run: |
          set -euo pipefail
          PROD_BRANCH=""
          HTTP_CODE=$(curl -sS -o /tmp/pages-project.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/chicagoshining-studio" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" || true)
          if [ "$HTTP_CODE" = "200" ] && jq -e '.success == true' /tmp/pages-project.json >/dev/null 2>&1; then
            PROD_BRANCH=$(jq -r '.result.production_branch // empty' /tmp/pages-project.json)
          else
            echo "Pages project lookup returned HTTP ${HTTP_CODE:-none}; wrangler will use the known production branch."
          fi
          if [ -z "$PROD_BRANCH" ]; then
            PROD_BRANCH=main
          fi
          echo "PROD_BRANCH=$PROD_BRANCH" >> "$GITHUB_ENV"
          echo "Existing production branch: $PROD_BRANCH"

      - name: Deploy staged files to existing Pages production branch
        shell: bash
        run: |
          set -euo pipefail
          # Capture the unique *.pages.dev URL Wrangler prints so verify does not race
          # the production alias (which briefly served the previous index after #568).
          npx --yes wrangler@latest pages deploy /tmp/pages-deploy \
            --project-name=chicagoshining-studio \
            --branch="$PROD_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="SM Pipeline V2 controlled GitHub deployment" \
            --commit-dirty=false 2>&1 | tee /tmp/pages-deploy.log
          DEPLOY_URL=$(awk '
            match($0, /https:\/\/[a-f0-9]+\.chicagoshining-studio\.pages\.dev/) {
              print substr($0, RSTART, RLENGTH); exit
            }' /tmp/pages-deploy.log || true)
          if [[ -n "${DEPLOY_URL:-}" ]]; then
            printf '%s\n' "$DEPLOY_URL" > /tmp/pages-wrangler-url.txt
            echo "pages_wrangler_deploy_url=$DEPLOY_URL"
          else
            echo "::warning::Could not parse unique Pages deploy URL from Wrangler output."
          fi

      - name: Verify latest production deployment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deployment list \
            --project-name=chicagoshining-studio \
            --environment=production \
            --json > /tmp/pages-production.json
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('apps/studio-web/index.html', 'utf8');
          // Prefer classic <script src>, else studioLazyManifest JSON (Home-first lazy load).
          let expectedJsUrl = null;
          const scriptSrc = html.match(/src=["'](\/assets\/app-item4-[^"']+\.js(?:\?[^"']*)?)/);
          if (scriptSrc) {
            expectedJsUrl = scriptSrc[1];
          } else {
            const manifestMatch = html.match(/id="studioLazyManifest"[^>]*>\s*([\s\S]*?)\s*<\/script>/i);
            if (manifestMatch) {
              const urls = [];
              const walk = (value) => {
                if (typeof value === 'string') urls.push(value);
                else if (Array.isArray(value)) value.forEach(walk);
                else if (value && typeof value === 'object') Object.values(value).forEach(walk);
              };
              walk(JSON.parse(manifestMatch[1]));
              expectedJsUrl = urls.find((u) => /\/assets\/app-item4-[^"'?\s]+\.js(?:\?[^"'\s]*)?$/i.test(u) || /\/assets\/app-item4-[^"'\s]+\.js/i.test(u)) || null;
            }
          }
          if (!expectedJsUrl) {
            const loose = html.match(/(\/assets\/app-item4-[^"'\s]+\.js(?:\?[^"'\s]*)?)/);
            if (loose) expectedJsUrl = loose[1];
          }
          const densityCssMatch = html.match(/href=["'](\/assets\/home-density-0517\.css(?:\?[^"']*)?)/);
          const overviewMatch = html.match(/(\/assets\/all-profiles-overview-1007\.js(?:\?[^"'\s]*)?)/);
          const labelMatch = html.match(/UI build (\d+\.\d+\.\d+)/);
          if (!expectedJsUrl || !densityCssMatch || !overviewMatch || !labelMatch) throw new Error('index.html is missing app-item4 script, cache-busted Home overview JS, home density CSS, or UI build label');
          const expectedJsPath = expectedJsUrl.split('?')[0];
          const expectedOverviewUrl = overviewMatch[1];
          const expectedOverviewPath = expectedOverviewUrl.split('?')[0];
          const expectedDensityCssUrl = densityCssMatch[1];
          const expectedDensityCssPath = expectedDensityCssUrl.split('?')[0];
          const expectedLabel = labelMatch[1];
          const buildIdMatch = fs.readFileSync(`apps/studio-web${expectedJsPath}`, 'utf8').match(/BUILD_ID\s*=\s*"([^"]+)"/);
          if (!buildIdMatch) throw new Error(`BUILD_ID missing in ${expectedJsPath}`);
          fs.writeFileSync('/tmp/pages-expected.json', JSON.stringify({
            expectedJsUrl,
            expectedJsPath,
            expectedDensityCssUrl,
            expectedDensityCssPath,
            expectedOverviewUrl,
            expectedOverviewPath,
            expectedLabel,
            expectedBuildId: buildIdMatch[1],
          }));
          NODE
          # Re-read the contract through the same parser used by CI and the
          # pre-deploy newness gate so verification cannot drift independently.
          node apps/studio-web/ui-release-contract.mjs --json > /tmp/pages-expected.json
          EXPECTED_JS_URL=$(jq -r .expectedJsUrl /tmp/pages-expected.json)
          EXPECTED_JS_PATH=$(jq -r .expectedJsPath /tmp/pages-expected.json)
          EXPECTED_DENSITY_CSS_URL=$(jq -r .expectedDensityCssUrl /tmp/pages-expected.json)
          EXPECTED_DENSITY_CSS_PATH=$(jq -r .expectedDensityCssPath /tmp/pages-expected.json)
          EXPECTED_OVERVIEW_URL=$(jq -r .expectedOverviewUrl /tmp/pages-expected.json)
          EXPECTED_OVERVIEW_PATH=$(jq -r .expectedOverviewPath /tmp/pages-expected.json)
          EXPECTED_LABEL=$(jq -r .expectedLabel /tmp/pages-expected.json)
          EXPECTED_BUILD_ID=$(jq -r .expectedBuildId /tmp/pages-expected.json)
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$API_ROOT/pages/projects/chicagoshining-studio" -H "$AUTH" -o /tmp/pages-project.json
          node - <<'NODE'
          const fs = require('fs');
          const expected = JSON.parse(fs.readFileSync('/tmp/pages-expected.json', 'utf8'));
          const data = JSON.parse(fs.readFileSync('/tmp/pages-production.json', 'utf8'));
          const rows = Array.isArray(data) ? data : (data.result || []);
          if (!rows.length) throw new Error('No production Pages deployment was returned after deploy');
          const latest = rows[0] || {};
          let wranglerUrl = '';
          try {
            wranglerUrl = fs.readFileSync('/tmp/pages-wrangler-url.txt', 'utf8').trim();
          } catch {}
          const candidates = [
            wranglerUrl,
            latest.url,
            latest.deployment_url,
            Array.isArray(latest.aliases) ? latest.aliases[0] : null,
            'https://chicagoshining-studio.pages.dev',
          ].map((value) => String(value || '').trim().replace(/\/$/, ''));
          // Prefer the unique deployment subdomain (hash.project.pages.dev) over the
          // production alias, which can briefly keep the previous index while alias cutover
          // finishes — that made verify silently grep-fail and never reach the custom domain.
          const httpsUrls = candidates.filter((value) => /^https:\/\//i.test(value));
          const uniqueDeploy = httpsUrls.find((value) => /^https:\/\/[a-f0-9]+\./i.test(value));
          const url = uniqueDeploy || httpsUrls[0];
          if (!url) {
            throw new Error(`Could not resolve a HTTPS Pages URL from deployment list: ${JSON.stringify(latest).slice(0, 500)}`);
          }
          const project = JSON.parse(fs.readFileSync('/tmp/pages-project.json', 'utf8')).result || {};
          const domains = project.domains || [];
          fs.writeFileSync('/tmp/pages-latest-url.txt', url);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Studio Pages production deployment: PASS\n- Production branch: ${process.env.PROD_BRANCH}\n- Latest deployment: ${url}\n- Domains: ${domains.join(', ') || '(none listed)'}\n- Expected UI: ${expected.expectedLabel} (${expected.expectedJsUrl})\n`);
          console.log('pages_domains=' + JSON.stringify(domains));
          console.log('pages_verify_url=' + url);
          console.log('pages_latest_raw_url=' + String(latest.url || ''));
          NODE
          LATEST_URL=$(cat /tmp/pages-latest-url.txt)
          require_match() {
            local needle="$1"
            local file="$2"
            local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "Pages content verify failed ($label): missing '$needle' in $file" >&2
              head -c 400 "$file" >&2 || true
              echo >&2
              exit 1
            fi
          }
          # Always purge the custom domain first so studio.chicagoshining.com cannot keep an old index.html.
          # Prefer files purge (works with narrower tokens) then hosts purge. Path renames are the hard bust.
          ZONE_HTTP=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=chicagoshining.com" -H "$AUTH" -o /tmp/zone-lookup.json -w '%{http_code}' || true)
          ZONE_ID=""
          if [[ "$ZONE_HTTP" == "200" ]]; then
            ZONE_ID=$(jq -r '.result[0].id // empty' /tmp/zone-lookup.json)
          else
            echo "::warning::Zone lookup HTTP $ZONE_HTTP; skipping cache purge."
          fi
          PURGE_OK=0
          if [[ -n "$ZONE_ID" ]]; then
            curl -sS "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" -H "$AUTH" -o /tmp/worker-routes.json || true
            jq -c '[.result[]? | {pattern,script}]' /tmp/worker-routes.json 2>/dev/null || true
            curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
              -H "$AUTH" -H "Content-Type: application/json" \
              --data "{\"files\":[\"https://studio.chicagoshining.com/\",\"https://studio.chicagoshining.com/index.html\",\"https://studio.chicagoshining.com$EXPECTED_JS_PATH\",\"https://studio.chicagoshining.com$EXPECTED_JS_URL\",\"https://studio.chicagoshining.com$EXPECTED_OVERVIEW_PATH\",\"https://studio.chicagoshining.com$EXPECTED_OVERVIEW_URL\"]}" \
              -o /tmp/purge-files.json || true
            jq -c '{mode:"files",success:(.success // false),errors:(.errors // [])}' /tmp/purge-files.json 2>/dev/null || true
            if jq -e '.success == true' /tmp/purge-files.json >/dev/null 2>&1; then PURGE_OK=1; fi
            curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
              -H "$AUTH" -H "Content-Type: application/json" \
              --data '{"hosts":["studio.chicagoshining.com"]}' \
              -o /tmp/purge-hosts.json || true
            jq -c '{mode:"hosts",success:(.success // false),errors:(.errors // [])}' /tmp/purge-hosts.json 2>/dev/null || true
            if jq -e '.success == true' /tmp/purge-hosts.json >/dev/null 2>&1; then PURGE_OK=1; fi
            if [[ "$PURGE_OK" -ne 1 ]]; then
              echo "::warning::Cloudflare cache purge for studio.chicagoshining.com failed (token likely missing Cache Purge). Relying on asset path rename + hard refresh. Grant Zone.Cache Purge on CLOUDFLARE_API_TOKEN."
              fsappend="$GITHUB_STEP_SUMMARY"
              {
                echo "### Studio custom-domain purge: WARN"
                echo "- Zone purge auth failed; pages.dev verify still required."
                echo "- Operators on studio.chicagoshining.com must hard-refresh after asset path renames."
              } >> "$fsappend"
            fi
          else
            echo "::warning::Could not resolve chicagoshining.com zone id for cache purge."
          fi
          # A Pages project protected by Access can legitimately return 403 from the
          # pages.dev hostname even though Wrangler successfully deployed production.
          # Prefer Access service-token fetch; fall back to public 200/403 handling.
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          ACCESS_HEADERS=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          INDEX_CODE=""
          for attempt in 1 2 3 4 5 6; do
            INDEX_CODE=$(curl -sS -L "${ACCESS_HEADERS[@]}" -o /tmp/live-index.html -w '%{http_code}' "$LATEST_URL/?studio_build=$EXPECTED_LABEL&attempt=$attempt" || true)
            echo "pages_dev_http=$INDEX_CODE url=$LATEST_URL attempt=$attempt"
            if [[ "$INDEX_CODE" != "200" ]]; then
              INDEX_CODE=$(curl -sS -L -o /tmp/live-index.html -w '%{http_code}' "$LATEST_URL/?studio_build=$EXPECTED_LABEL&attempt=$attempt" || true)
              echo "pages_dev_public_http=$INDEX_CODE attempt=$attempt"
            fi
            if [[ "$INDEX_CODE" == "200" ]] \
              && grep -Fq "UI build $EXPECTED_LABEL" /tmp/live-index.html \
              && grep -Fq "$EXPECTED_JS_PATH" /tmp/live-index.html \
              && grep -Fq "$EXPECTED_DENSITY_CSS_PATH" /tmp/live-index.html; then
              break
            fi
            sleep 10
          done
          if [[ "$INDEX_CODE" == "200" ]]; then
            require_match "$EXPECTED_JS_PATH" /tmp/live-index.html "pages.dev index js path"
            require_match "$EXPECTED_DENSITY_CSS_PATH" /tmp/live-index.html "pages.dev index density css path"
            require_match "UI build $EXPECTED_LABEL" /tmp/live-index.html "pages.dev UI build label"
            APP_CODE=$(curl -sS -L "${ACCESS_HEADERS[@]}" -o /tmp/live-app.js -w '%{http_code}' "$LATEST_URL$EXPECTED_JS_URL" || true)
            if [[ "$APP_CODE" != "200" ]]; then
              APP_CODE=$(curl -sS -L -o /tmp/live-app.js -w '%{http_code}' "$LATEST_URL$EXPECTED_JS_URL" || true)
            fi
            test "$APP_CODE" = "200"
            require_match "$EXPECTED_BUILD_ID" /tmp/live-app.js "pages.dev BUILD_ID"
            require_match "$EXPECTED_OVERVIEW_PATH" /tmp/live-index.html "pages.dev Home overview asset"
            OVERVIEW_CODE=$(curl -sS -L "${ACCESS_HEADERS[@]}" -o /tmp/live-overview.js -w '%{http_code}' "$LATEST_URL$EXPECTED_OVERVIEW_URL" || true)
            if [[ "$OVERVIEW_CODE" != "200" ]]; then
              OVERVIEW_CODE=$(curl -sS -L -o /tmp/live-overview.js -w '%{http_code}' "$LATEST_URL$EXPECTED_OVERVIEW_URL" || true)
            fi
            test "$OVERVIEW_CODE" = "200"
            require_match '/api/profiles/overview/refresh' /tmp/live-overview.js "pages.dev force-refresh route"
            require_match 'min_generation=' /tmp/live-overview.js "pages.dev generation barrier"
            require_match 'Updated just now' /tmp/live-overview.js "pages.dev authoritative refresh status"
            CSS_CODE=$(curl -sS -L "${ACCESS_HEADERS[@]}" -o /tmp/live-home-density.css -w '%{http_code}' "$LATEST_URL$EXPECTED_DENSITY_CSS_URL" || true)
            if [[ "$CSS_CODE" != "200" ]]; then
              CSS_CODE=$(curl -sS -L -o /tmp/live-home-density.css -w '%{http_code}' "$LATEST_URL$EXPECTED_DENSITY_CSS_URL" || true)
            fi
            test "$CSS_CODE" = "200"
            require_match "HOME_DENSITY_0_6_521" /tmp/live-home-density.css "pages.dev density marker"
            echo "pages_content_verify=PASS"
          elif [[ "$INDEX_CODE" == "403" ]]; then
            echo "::warning::Pages production is protected by Access (HTTP 403); Wrangler deployment completed successfully, so public byte verification is skipped."
            {
              echo "### Studio Pages content verification: ACCESS-PROTECTED"
              echo "- Wrangler production deploy succeeded."
              echo "- Direct pages.dev byte verification returned HTTP 403 and was skipped."
              echo "- Expected UI: $EXPECTED_LABEL ($EXPECTED_BUILD_ID)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unexpected Pages verification HTTP $INDEX_CODE from $LATEST_URL" >&2
            exit 1
          fi

          # The operator uses the custom domain, so a green deploy is not enough unless
          # studio.chicagoshining.com is serving this exact build too.
          CUSTOM_URL="https://studio.chicagoshining.com"
          CUSTOM_INDEX_OK=0
          CUSTOM_INDEX_CODE=""
          CUSTOM_SERVED_LABEL=""
          for attempt in 1 2 3 4 5 6 7 8; do
            CUSTOM_INDEX_CODE=$(curl -sS \
              "${ACCESS_HEADERS[@]}" \
              -D /tmp/custom-index.headers \
              -o /tmp/custom-index.html \
              -w '%{http_code}' \
              "$CUSTOM_URL/?studio_build=$EXPECTED_LABEL&commit=$GITHUB_SHA&attempt=$attempt" || true)
            CUSTOM_SERVED_LABEL=$(node apps/studio-web/ui-release-contract.mjs \
              --html /tmp/custom-index.html --html-version 2>/dev/null || true)
            if [[ "$CUSTOM_INDEX_CODE" == "200" ]] \
              && [[ "$CUSTOM_SERVED_LABEL" == "$EXPECTED_LABEL" ]] \
              && grep -Fq "$EXPECTED_JS_URL" /tmp/custom-index.html; then
              CUSTOM_INDEX_OK=1
              echo "custom_domain_index_attempt=$attempt http=$CUSTOM_INDEX_CODE ui=$CUSTOM_SERVED_LABEL asset=ok"
              break
            fi
            echo "custom_domain_index_attempt=$attempt http=$CUSTOM_INDEX_CODE ui=${CUSTOM_SERVED_LABEL:-unreadable} asset=miss"
            sleep 10
          done
          CUSTOM_LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/custom-index.headers)
          if [[ "$CUSTOM_INDEX_OK" != "1" ]]; then
            echo "Authenticated Studio custom-domain verification never served UI $EXPECTED_LABEL with $EXPECTED_JS_URL (last HTTP $CUSTOM_INDEX_CODE, location: $CUSTOM_LOCATION)." >&2
            exit 1
          fi
          require_match "UI build $EXPECTED_LABEL" /tmp/custom-index.html "custom-domain UI build label"
          require_match "$EXPECTED_DENSITY_CSS_PATH" /tmp/custom-index.html "custom-domain density css path"
          require_match "$EXPECTED_JS_URL" /tmp/custom-index.html "custom-domain cache-busted js URL"
          require_match "$EXPECTED_OVERVIEW_URL" /tmp/custom-index.html "custom-domain Home overview cache-busted asset"
          CUSTOM_OVERVIEW_CODE=$(curl -sS \
            "${ACCESS_HEADERS[@]}" \
            -o /tmp/custom-overview.js \
            -w '%{http_code}' \
            "$CUSTOM_URL$EXPECTED_OVERVIEW_URL" || true)
          test "$CUSTOM_OVERVIEW_CODE" = "200"
          require_match '/api/profiles/overview/refresh' /tmp/custom-overview.js "custom-domain force-refresh route"
          require_match 'min_generation=' /tmp/custom-overview.js "custom-domain generation barrier"
          require_match 'Updated just now' /tmp/custom-overview.js "custom-domain authoritative refresh status"
          CUSTOM_CSS_CODE=$(curl -sS \
            "${ACCESS_HEADERS[@]}" \
            -o /tmp/custom-home-density.css \
            -w '%{http_code}' \
            "$CUSTOM_URL$EXPECTED_DENSITY_CSS_URL" || true)
          test "$CUSTOM_CSS_CODE" = "200"
          require_match "HOME_DENSITY_0_6_521" /tmp/custom-home-density.css "custom-domain density marker"
          # Path renames are the hard cache bust; still retry briefly because the
          # custom-domain alias can lag pages.dev by a few seconds after deploy.
          CUSTOM_APP_OK=0
          for attempt in 1 2 3 4 5 6 7 8; do
            CUSTOM_APP_CODE=$(curl -sS \
              "${ACCESS_HEADERS[@]}" \
              -o /tmp/custom-app.js \
              -w '%{http_code}' \
              "$CUSTOM_URL$EXPECTED_JS_URL" || true)
            if [[ "$CUSTOM_APP_CODE" == "200" ]] && grep -Fq "$EXPECTED_BUILD_ID" /tmp/custom-app.js; then
              CUSTOM_APP_OK=1
              echo "custom_domain_app_attempt=$attempt http=$CUSTOM_APP_CODE build=ok"
              break
            fi
            echo "custom_domain_app_attempt=$attempt http=$CUSTOM_APP_CODE build=miss"
            sleep 15
          done
          test "$CUSTOM_APP_OK" = "1"
          require_match "$EXPECTED_BUILD_ID" /tmp/custom-app.js "custom-domain BUILD_ID"
          # A no-op footer build label is insufficient when adding a new lazy
          # Quality Agent asset. Verify the operator-facing Factory batch UI
          # from the *authenticated custom domain*, not only source files.
          if grep -Fq 'factory-batch-quality-0710.js' apps/studio-web/index.html; then
            require_match 'factory-batch-quality-0710.js' /tmp/custom-index.html "Factory QA module loaded on custom domain"
            require_match 'operationsFactoryBatchQualitySignals' /tmp/custom-index.html "Quality Agent operator panel"
            require_match 'factoryBatchQualitySignals' /tmp/custom-index.html "Factory operator panel"
            QA_CODE=$(curl -sS \
              "${ACCESS_HEADERS[@]}" \
              -o /tmp/custom-factory-quality.js \
              -w '%{http_code}' \
              "$CUSTOM_URL/assets/factory-batch-quality-0710.js?v=$GITHUB_SHA" || true)
            test "$QA_CODE" = "200"
            require_match 'QA-FACTORY-BATCH-FAILED-ITEM' /tmp/custom-factory-quality.js "Factory failed-item finding"
            require_match 'QA-FACTORY-BATCH-DUPLICATE-ITEM' /tmp/custom-factory-quality.js "Factory duplicate-item finding"
            echo "factory_quality_agent_live_asset_verify=PASS"
          fi
          # Step 4: prove the authenticated production site has the canary
          # selector guard, not just the generic Factory UI or a build label.
          if grep -Fq 'rollout=chicago-ig-reel-v1' apps/studio-web/index.html; then
            require_match 'factoryBatchRolloutNotice' /tmp/custom-index.html "Factory canary notice element"
            require_match 'rollout=chicago-ig-reel-v1' /tmp/custom-index.html "Factory canary cache-busted script URL"
            FACTORY_DESK_URL=$(grep -oE '/assets/factory-desk\.js\?[^"[:space:]]+' apps/studio-web/index.html | head -n 1)
            test -n "$FACTORY_DESK_URL"
            PILOT_JS_HTTP=$(curl -sS "${ACCESS_HEADERS[@]}" \
              -o /tmp/custom-factory-canary.js -w '%{http_code}' \
              "$CUSTOM_URL$FACTORY_DESK_URL" || true)
            test "$PILOT_JS_HTTP" = "200"
            require_match 'function canSelectBatchOutput(card)' /tmp/custom-factory-canary.js "Factory canary client guard"
            require_match 'Limited production pilot: approve one Chicago Instagram Reel at a time.' /tmp/custom-factory-canary.js "Factory canary operator guidance"
            require_match 'selectable > limit' /tmp/custom-factory-canary.js "Factory single-output limit"
            echo "factory_chicago_canary_live_asset_verify=PASS"
          fi
          echo "custom_domain_verified_ui=$EXPECTED_LABEL"
          echo "custom_domain_verified_build_id=$EXPECTED_BUILD_ID"
          echo "custom_domain_content_verify=PASS"

      - name: Publish Studio Pages production deployment status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          STATE="failure"
          DESCRIPTION="Studio Pages production verification failed"
          if [[ "$DEPLOY_JOB_STATUS" == "success" ]]; then
            STATE="success"
            DESCRIPTION="Studio Pages deployed; Home overview asset verified"
          fi
          TARGET_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          PAYLOAD=$(jq -nc --arg state "$STATE" --arg context "production/studio-pages" --arg description "$DESCRIPTION" --arg target_url "$TARGET_URL" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}')
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$PAYLOAD" >/tmp/github-pages-deploy-status.json
          jq -e '.context=="production/studio-pages" and (.state=="success" or .state=="failure")' /tmp/github-pages-deploy-status.json >/dev/null


