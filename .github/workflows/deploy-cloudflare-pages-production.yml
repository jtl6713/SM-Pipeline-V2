name: Deploy Studio Pages Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/cloudflare-pages-production.txt'

permissions:
  contents: read

concurrency:
  group: chicagoshining-studio-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Pages source and stage deployment directory
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/studio-web/index.html
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const html = fs.readFileSync('apps/studio-web/index.html','utf8');
          let app = false, css = false;
          for (const m of html.matchAll(/(?:src|href)=["']([^"']+)["']/gi)) {
            let p = m[1].trim();
            if (!p.startsWith('/assets/')) continue;
            p = p.split('#')[0].split('?')[0];
            const local = path.join('apps/studio-web', p.replace(/^\//,''));
            if (!fs.existsSync(local)) throw new Error(`Missing referenced asset: ${p}`);
            if (/app-.*\.js$/i.test(p)) app = true;
            if (/\.css$/i.test(p)) css = true;
          }
          if (!app || !css) throw new Error('Pages baseline must include referenced application JS and CSS');
          NODE
          for file in apps/studio-web/assets/*.js; do
            [ -e "$file" ] || continue
            cp "$file" /tmp/"$(basename "$file" .js)".mjs
            node --check /tmp/"$(basename "$file" .js)".mjs
          done
          rm -rf /tmp/pages-deploy
          mkdir -p /tmp/pages-deploy/assets
          cp apps/studio-web/index.html /tmp/pages-deploy/index.html
          if [ -f apps/studio-web/_headers ]; then
            cp apps/studio-web/_headers /tmp/pages-deploy/_headers
          fi
          cp -a apps/studio-web/assets/. /tmp/pages-deploy/assets/
          mkdir -p /tmp/pages-deploy/docs
          test -s docs/handoffs/Autonomous-Service-Agent.docx
          test -s docs/handoffs/Quality-Agent.docx
          cp docs/handoffs/Autonomous-Service-Agent.docx /tmp/pages-deploy/docs/Autonomous-Service-Agent.docx
          cp docs/handoffs/Quality-Agent.docx /tmp/pages-deploy/docs/Quality-Agent.docx
          if [ -f apps/studio-web/docs/Autonomous-Service-Agent.docx ]; then
            cp apps/studio-web/docs/Autonomous-Service-Agent.docx /tmp/pages-deploy/docs/Autonomous-Service-Agent.docx
          fi
          if [ -f apps/studio-web/docs/Quality-Agent.docx ]; then
            cp apps/studio-web/docs/Quality-Agent.docx /tmp/pages-deploy/docs/Quality-Agent.docx
          fi

      - name: Read existing Pages production branch
        shell: bash
        run: |
          set -euo pipefail
          PROD_BRANCH=""
          HTTP_CODE=$(curl -sS -o /tmp/pages-project.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/chicagoshining-studio" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" || true)
          if [ "$HTTP_CODE" = "200" ] && jq -e '.success == true' /tmp/pages-project.json >/dev/null 2>&1; then
            PROD_BRANCH=$(jq -r '.result.production_branch // empty' /tmp/pages-project.json)
          else
            echo "Pages project lookup returned HTTP ${HTTP_CODE:-none}; wrangler will use the known production branch."
          fi
          if [ -z "$PROD_BRANCH" ]; then
            PROD_BRANCH=main
          fi
          echo "PROD_BRANCH=$PROD_BRANCH" >> "$GITHUB_ENV"
          echo "Existing production branch: $PROD_BRANCH"

      - name: Deploy staged files to existing Pages production branch
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy /tmp/pages-deploy \
            --project-name=chicagoshining-studio \
            --branch="$PROD_BRANCH" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="SM Pipeline V2 controlled GitHub deployment" \
            --commit-dirty=false

      - name: Verify latest production deployment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deployment list \
            --project-name=chicagoshining-studio \
            --environment=production \
            --json > /tmp/pages-production.json
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('apps/studio-web/index.html', 'utf8');
          const jsMatch = html.match(/src=["'](\/assets\/app-item4-[^"']+\.js(?:\?[^"']*)?)/);
          const densityCssMatch = html.match(/href=["'](\/assets\/home-density-0517\.css(?:\?[^"']*)?)/);
          const labelMatch = html.match(/UI build (\d+\.\d+\.\d+)/);
          if (!jsMatch || !densityCssMatch || !labelMatch) throw new Error('index.html is missing app-item4 script, cache-busted home density CSS, or UI build label');
          const expectedJsUrl = jsMatch[1];
          const expectedJsPath = expectedJsUrl.split('?')[0];
          const expectedDensityCssUrl = densityCssMatch[1];
          const expectedDensityCssPath = expectedDensityCssUrl.split('?')[0];
          const expectedLabel = labelMatch[1];
          const buildIdMatch = fs.readFileSync(`apps/studio-web${expectedJsPath}`, 'utf8').match(/BUILD_ID\s*=\s*"([^"]+)"/);
          if (!buildIdMatch) throw new Error(`BUILD_ID missing in ${expectedJsPath}`);
          fs.writeFileSync('/tmp/pages-expected.json', JSON.stringify({
            expectedJsUrl,
            expectedJsPath,
            expectedDensityCssUrl,
            expectedDensityCssPath,
            expectedLabel,
            expectedBuildId: buildIdMatch[1],
          }));
          NODE
          EXPECTED_JS_URL=$(jq -r .expectedJsUrl /tmp/pages-expected.json)
          EXPECTED_JS_PATH=$(jq -r .expectedJsPath /tmp/pages-expected.json)
          EXPECTED_DENSITY_CSS_URL=$(jq -r .expectedDensityCssUrl /tmp/pages-expected.json)
          EXPECTED_DENSITY_CSS_PATH=$(jq -r .expectedDensityCssPath /tmp/pages-expected.json)
          EXPECTED_LABEL=$(jq -r .expectedLabel /tmp/pages-expected.json)
          EXPECTED_BUILD_ID=$(jq -r .expectedBuildId /tmp/pages-expected.json)
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$API_ROOT/pages/projects/chicagoshining-studio" -H "$AUTH" -o /tmp/pages-project.json
          node - <<'NODE'
          const fs = require('fs');
          const expected = JSON.parse(fs.readFileSync('/tmp/pages-expected.json', 'utf8'));
          const data = JSON.parse(fs.readFileSync('/tmp/pages-production.json', 'utf8'));
          const rows = Array.isArray(data) ? data : (data.result || []);
          if (!rows.length) throw new Error('No production Pages deployment was returned after deploy');
          const latest = rows[0] || {};
          const candidates = [
            latest.url,
            latest.deployment_url,
            Array.isArray(latest.aliases) ? latest.aliases[0] : null,
            'https://chicagoshining-studio.pages.dev',
          ].map((value) => String(value || '').trim().replace(/\/$/, ''));
          // Prefer the unique deployment subdomain (hash.project.pages.dev) over the
          // production alias, which can briefly keep the previous index while alias cutover
          // finishes — that made verify silently grep-fail and never reach the custom domain.
          const httpsUrls = candidates.filter((value) => /^https:\/\//i.test(value));
          const uniqueDeploy = httpsUrls.find((value) => /^https:\/\/[a-f0-9]{8}\./i.test(value));
          const url = uniqueDeploy || httpsUrls[0];
          if (!url) {
            throw new Error(`Could not resolve a HTTPS Pages URL from deployment list: ${JSON.stringify(latest).slice(0, 500)}`);
          }
          const project = JSON.parse(fs.readFileSync('/tmp/pages-project.json', 'utf8')).result || {};
          const domains = project.domains || [];
          fs.writeFileSync('/tmp/pages-latest-url.txt', url);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Studio Pages production deployment: PASS\n- Production branch: ${process.env.PROD_BRANCH}\n- Latest deployment: ${url}\n- Domains: ${domains.join(', ') || '(none listed)'}\n- Expected UI: ${expected.expectedLabel} (${expected.expectedJsUrl})\n`);
          console.log('pages_domains=' + JSON.stringify(domains));
          console.log('pages_verify_url=' + url);
          console.log('pages_latest_raw_url=' + String(latest.url || ''));
          NODE
          LATEST_URL=$(cat /tmp/pages-latest-url.txt)
          require_match() {
            local needle="$1"
            local file="$2"
            local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "Pages content verify failed ($label): missing '$needle' in $file" >&2
              head -c 400 "$file" >&2 || true
              echo >&2
              exit 1
            fi
          }
          # Always purge the custom domain first so studio.chicagoshining.com cannot keep an old index.html.
          # Prefer files purge (works with narrower tokens) then hosts purge. Path renames are the hard bust.
          ZONE_HTTP=$(curl -sS "https://api.cloudflare.com/client/v4/zones?name=chicagoshining.com" -H "$AUTH" -o /tmp/zone-lookup.json -w '%{http_code}' || true)
          ZONE_ID=""
          if [[ "$ZONE_HTTP" == "200" ]]; then
            ZONE_ID=$(jq -r '.result[0].id // empty' /tmp/zone-lookup.json)
          else
            echo "::warning::Zone lookup HTTP $ZONE_HTTP; skipping cache purge."
          fi
          PURGE_OK=0
          if [[ -n "$ZONE_ID" ]]; then
            curl -sS "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/workers/routes" -H "$AUTH" -o /tmp/worker-routes.json || true
            jq -c '[.result[]? | {pattern,script}]' /tmp/worker-routes.json 2>/dev/null || true
            curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
              -H "$AUTH" -H "Content-Type: application/json" \
              --data "{\"files\":[\"https://studio.chicagoshining.com/\",\"https://studio.chicagoshining.com/index.html\",\"https://studio.chicagoshining.com$EXPECTED_JS_PATH\",\"https://studio.chicagoshining.com$EXPECTED_JS_URL\"]}" \
              -o /tmp/purge-files.json || true
            jq -c '{mode:"files",success:(.success // false),errors:(.errors // [])}' /tmp/purge-files.json 2>/dev/null || true
            if jq -e '.success == true' /tmp/purge-files.json >/dev/null 2>&1; then PURGE_OK=1; fi
            curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
              -H "$AUTH" -H "Content-Type: application/json" \
              --data '{"hosts":["studio.chicagoshining.com"]}' \
              -o /tmp/purge-hosts.json || true
            jq -c '{mode:"hosts",success:(.success // false),errors:(.errors // [])}' /tmp/purge-hosts.json 2>/dev/null || true
            if jq -e '.success == true' /tmp/purge-hosts.json >/dev/null 2>&1; then PURGE_OK=1; fi
            if [[ "$PURGE_OK" -ne 1 ]]; then
              echo "::warning::Cloudflare cache purge for studio.chicagoshining.com failed (token likely missing Cache Purge). Relying on asset path rename + hard refresh. Grant Zone.Cache Purge on CLOUDFLARE_API_TOKEN."
              fsappend="$GITHUB_STEP_SUMMARY"
              {
                echo "### Studio custom-domain purge: WARN"
                echo "- Zone purge auth failed; pages.dev verify still required."
                echo "- Operators on studio.chicagoshining.com must hard-refresh after asset path renames."
              } >> "$fsappend"
            fi
          else
            echo "::warning::Could not resolve chicagoshining.com zone id for cache purge."
          fi
          # A Pages project protected by Access can legitimately return 403 from the
          # pages.dev hostname even though Wrangler successfully deployed production.
          # Prefer Access service-token fetch; fall back to public 200/403 handling.
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          ACCESS_HEADERS=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          INDEX_CODE=$(curl -sS -L "${ACCESS_HEADERS[@]}" -o /tmp/live-index.html -w '%{http_code}' "$LATEST_URL/" || true)
          echo "pages_dev_http=$INDEX_CODE url=$LATEST_URL"
          if [[ "$INDEX_CODE" != "200" ]]; then
            INDEX_CODE=$(curl -sS -L -o /tmp/live-index.html -w '%{http_code}' "$LATEST_URL/" || true)
            echo "pages_dev_public_http=$INDEX_CODE"
          fi
          if [[ "$INDEX_CODE" == "200" ]]; then
            require_match "$EXPECTED_JS_PATH" /tmp/live-index.html "pages.dev index js path"
            require_match "$EXPECTED_DENSITY_CSS_PATH" /tmp/live-index.html "pages.dev index density css path"
            require_match "UI build $EXPECTED_LABEL" /tmp/live-index.html "pages.dev UI build label"
            APP_CODE=$(curl -sS -L "${ACCESS_HEADERS[@]}" -o /tmp/live-app.js -w '%{http_code}' "$LATEST_URL$EXPECTED_JS_URL" || true)
            if [[ "$APP_CODE" != "200" ]]; then
              APP_CODE=$(curl -sS -L -o /tmp/live-app.js -w '%{http_code}' "$LATEST_URL$EXPECTED_JS_URL" || true)
            fi
            test "$APP_CODE" = "200"
            require_match "$EXPECTED_BUILD_ID" /tmp/live-app.js "pages.dev BUILD_ID"
            CSS_CODE=$(curl -sS -L "${ACCESS_HEADERS[@]}" -o /tmp/live-home-density.css -w '%{http_code}' "$LATEST_URL$EXPECTED_DENSITY_CSS_URL" || true)
            if [[ "$CSS_CODE" != "200" ]]; then
              CSS_CODE=$(curl -sS -L -o /tmp/live-home-density.css -w '%{http_code}' "$LATEST_URL$EXPECTED_DENSITY_CSS_URL" || true)
            fi
            test "$CSS_CODE" = "200"
            require_match "HOME_DENSITY_0_6_521" /tmp/live-home-density.css "pages.dev density marker"
            echo "pages_content_verify=PASS"
          elif [[ "$INDEX_CODE" == "403" ]]; then
            echo "::warning::Pages production is protected by Access (HTTP 403); Wrangler deployment completed successfully, so public byte verification is skipped."
            {
              echo "### Studio Pages content verification: ACCESS-PROTECTED"
              echo "- Wrangler production deploy succeeded."
              echo "- Direct pages.dev byte verification returned HTTP 403 and was skipped."
              echo "- Expected UI: $EXPECTED_LABEL ($EXPECTED_BUILD_ID)"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Unexpected Pages verification HTTP $INDEX_CODE from $LATEST_URL" >&2
            exit 1
          fi

          # The operator uses the custom domain, so a green deploy is not enough unless
          # studio.chicagoshining.com is serving this exact build too.
          CUSTOM_URL="https://studio.chicagoshining.com"
          CUSTOM_INDEX_CODE=$(curl -sS \
            "${ACCESS_HEADERS[@]}" \
            -D /tmp/custom-index.headers \
            -o /tmp/custom-index.html \
            -w '%{http_code}' \
            "$CUSTOM_URL/?studio_build=$EXPECTED_LABEL&commit=$GITHUB_SHA" || true)
          CUSTOM_LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' /tmp/custom-index.headers)
          echo "custom_domain_http=$CUSTOM_INDEX_CODE"
          if [[ "$CUSTOM_INDEX_CODE" != "200" ]]; then
            echo "Authenticated Studio custom-domain verification failed with HTTP $CUSTOM_INDEX_CODE (location: $CUSTOM_LOCATION)." >&2
            exit 1
          fi
          require_match "UI build $EXPECTED_LABEL" /tmp/custom-index.html "custom-domain UI build label"
          require_match "$EXPECTED_DENSITY_CSS_PATH" /tmp/custom-index.html "custom-domain density css path"
          require_match "$EXPECTED_JS_PATH" /tmp/custom-index.html "custom-domain js path"
          CUSTOM_CSS_CODE=$(curl -sS \
            "${ACCESS_HEADERS[@]}" \
            -o /tmp/custom-home-density.css \
            -w '%{http_code}' \
            "$CUSTOM_URL$EXPECTED_DENSITY_CSS_URL" || true)
          test "$CUSTOM_CSS_CODE" = "200"
          require_match "HOME_DENSITY_0_6_521" /tmp/custom-home-density.css "custom-domain density marker"
          # Path renames are the hard cache bust; still retry briefly because the
          # custom-domain alias can lag pages.dev by a few seconds after deploy.
          CUSTOM_APP_OK=0
          for attempt in 1 2 3 4 5 6; do
            CUSTOM_APP_CODE=$(curl -sS \
              "${ACCESS_HEADERS[@]}" \
              -o /tmp/custom-app.js \
              -w '%{http_code}' \
              "$CUSTOM_URL$EXPECTED_JS_URL" || true)
            if [[ "$CUSTOM_APP_CODE" == "200" ]] && grep -Fq "$EXPECTED_BUILD_ID" /tmp/custom-app.js; then
              CUSTOM_APP_OK=1
              echo "custom_domain_app_attempt=$attempt http=$CUSTOM_APP_CODE build=ok"
              break
            fi
            echo "custom_domain_app_attempt=$attempt http=$CUSTOM_APP_CODE build=miss"
            sleep 15
          done
          test "$CUSTOM_APP_OK" = "1"
          require_match "$EXPECTED_BUILD_ID" /tmp/custom-app.js "custom-domain BUILD_ID"
          echo "custom_domain_content_verify=PASS"
