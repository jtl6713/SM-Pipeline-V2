name: Enable Studio Assets Supabase Reads
# Puts STUDIO_ASSETS_READ_SOURCE=supabase on the Worker. Trigger by pushing
# deploy/enable-studio-assets-reads.txt on main after densify + live verify.
# workflow_dispatch remains for manual re-runs when the token allows it.
on:
  push:
    branches: [main]
    paths:
      - "deploy/enable-studio-assets-reads.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chicagoshining-studio-api-assets-read
  cancel-in-progress: false

jobs:
  put:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
    steps:
      - name: Install Assets read flag without printing secret values
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          target = "https://api.cloudflare.com/client/v4/accounts/{}/workers/scripts/{}".format(
              os.environ["CLOUDFLARE_ACCOUNT_ID"], os.environ["TARGET_WORKER"])
          auth = {"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]}
          def get_json(path):
              req = urllib.request.Request(target + path, headers=auth)
              with urllib.request.urlopen(req, timeout=45) as response:
                  payload = json.loads(response.read().decode())
              if payload.get("success") is not True:
                  raise SystemExit("Cloudflare binding verification response was not successful")
              return payload.get("result")
          def active_bindings():
              versions = get_json("/deployments")
              version_id = max(versions["deployments"][0]["versions"],
                               key=lambda item: item.get("percentage", 0))["version_id"]
              details = get_json("/versions/" + version_id)
              return {row["name"]: row["type"] for row in
                      (details.get("resources") or {}).get("bindings") or []}
          # GET /content returns 405. The deploy verifier reads /content/v2.
          req = urllib.request.Request(target + "/content/v2", headers=auth)
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  script = response.read()
          except urllib.error.HTTPError as error:
              raise SystemExit("Cloudflare refused live Worker source read (HTTP {})".format(error.code))
          if b"0.10.814-supabase-assets-reads" not in script:
              raise SystemExit("Refusing to enable Assets reads: live Worker is not 0.10.814-supabase-assets-reads")
          before = active_bindings()
          expected = {
              "AIRTABLE_PAT": "secret_text",
              "STUDIO_MEDIA": "r2_bucket",
              "STUDIO_CONTENT_READ_SOURCE": "secret_text",
              "STUDIO_FACTORY_OPS_READ_SOURCE": "secret_text",
              "STUDIO_HOME_READ_SOURCE": "secret_text",
              "STUDIO_MUSIC_READ_SOURCE": "secret_text",
              "STUDIO_AUTH_READ_SOURCE": "secret_text",
              "STUDIO_WRITE_SOURCE": "secret_text",
          }
          for name, typ in expected.items():
              if before.get(name) != typ:
                  raise SystemExit("Existing production binding missing or changed: " + name)
          secret = {
              "name": "STUDIO_ASSETS_READ_SOURCE",
              "text": "supabase",
              "type": "secret_text",
          }
          headers = dict(auth, **{"Content-Type": "application/json"})
          put = urllib.request.Request(
              target + "/secrets", headers=headers,
              data=json.dumps(secret).encode(), method="PUT")
          try:
              with urllib.request.urlopen(put, timeout=60) as response:
                  result = json.loads(response.read().decode())
          except urllib.error.HTTPError as error:
              raise SystemExit("Cloudflare refused Assets read flag (HTTP {})".format(error.code))
          entry = result.get("result") or {}
          if (result.get("success") is not True
                  or entry.get("name") != "STUDIO_ASSETS_READ_SOURCE"
                  or entry.get("type") != "secret_text"):
              raise SystemExit("Cloudflare did not confirm Assets read flag")
          after = active_bindings()
          for name, typ in {**expected, "STUDIO_ASSETS_READ_SOURCE": "secret_text"}.items():
              if after.get(name) != typ:
                  raise SystemExit("Required binding missing after Assets flag installation: " + name)
          for name, typ in before.items():
              if after.get(name) != typ:
                  raise SystemExit("Pre-existing Worker binding changed during Assets flag install: " + name)
          print("assets_read_secret_installed=PASS")
          print("auth_read_secret_preserved=PASS")
          print("music_read_secret_preserved=PASS")
          print("write_source_changed=NO")
          PY
