name: Diagnose Runner Cloudflare Access (Read Only)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-runner-cloudflare-access.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      OPS_TOKEN: ${{ secrets.OPS_DASHBOARD_TOKEN }}
    steps:
      - name: Diagnose Cloudflare edge and Access app policy without changing settings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os,urllib.request,urllib.error,urllib.parse
          domain="pipeline.chicagoshining.com"
          pairs_ok=bool(os.environ.get("CF_ACCESS_CLIENT_ID") and os.environ.get("CF_ACCESS_CLIENT_SECRET"))
          print("github_access_service_credential_pair_present="+("YES" if pairs_ok else "NO"))
          def probe(auth=False):
              headers={"Accept":"application/json"}
              if auth and pairs_ok:
                  headers.update({"CF-Access-Client-Id":os.environ["CF_ACCESS_CLIENT_ID"],
                                  "CF-Access-Client-Secret":os.environ["CF_ACCESS_CLIENT_SECRET"]})
              req=urllib.request.Request("https://"+domain+"/health",headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      status=r.status; hdr=r.headers; body=r.read(16384)
              except urllib.error.HTTPError as err:
                  status=err.code;hdr=err.headers;body=err.read(4096)
              except Exception as err:
                  print(("auth" if auth else "anonymous")+"_probe_error="+type(err).__name__)
                  return
              name="auth" if auth else "anonymous"
              print(name+"_http="+str(status))
              print(name+"_content_type="+str(hdr.get("content-type","unknown")).split(";")[0][:55])
              print(name+"_access_edge_headers="+("YES" if hdr.get("cf-ray") or hdr.get("cf-mitigated") else "NO"))
              print(name+"_cf_mitigated="+str(hdr.get("cf-mitigated","none"))[:40])
              print(name+"_server="+str(hdr.get("server","unknown"))[:40])
              print(name+"_access_request_header="+str(bool(hdr.get("cf-access-aud") or hdr.get("cf-access-unauthorized") or hdr.get("cf-access-request-id"))))
              try:
                  result=json.loads(body)
                  print(name+"_body_keys="+",".join(sorted(result.keys()))[:120] if isinstance(result,dict) else name+"_body_type=array")
                  if isinstance(result,dict):
                      import re
                      for field in ("error_code","error_name","error_category","stat"):
                          value=str(result.get(field) if result.get(field) is not None else "")
                          if re.fullmatch(r"[A-Za-z0-9_.:-]{1,100}",value):
                              print(name+"_"+field+"="+value)
                      print(name+"_owner_action_required="+str(result.get("owner_action_required") is True))
                      print(name+"_retryable="+str(result.get("retryable") is True))
                      cf=result.get("cloudflare_error")
                      if isinstance(cf,dict):
                          print(name+"_cloudflare_error_keys="+",".join(sorted(cf.keys()))[:100])
                          for field in ("code","error_code","name"):
                              value=str(cf.get(field) if cf.get(field) is not None else "")
                              if re.fullmatch(r"[A-Za-z0-9_.:-]{1,100}",value):
                                  print(name+"_cloudflare_"+field+"="+value)
                  body_status=json.dumps(result,sort_keys=True).lower()[:4096]
                  markers=["forbidden","unauthorized","access denied","access","not allowed","cloudflare","host","token","authentication","origin","waf","gateway","invalid"]
                  print(name+"_body_error_markers="+",".join(x for x in markers if x in body_status))
              except Exception:
                  print(name+"_body_is_json=NO")
              if status == 200:
                  try:
                      p=json.loads(body)
                      print(name+"_runner_service_verified="+str(p.get("service")=="pipeline-runner"))
                      print(name+"_airtable_write_authority="+str(p.get("studio_write_source")=="airtable"))
                  except Exception:
                      print(name+"_body_valid_json=NO")
          probe(False);probe(True)
          token=os.environ.get("CLOUDFLARE_API_TOKEN") or ""
          account=os.environ.get("CLOUDFLARE_ACCOUNT_ID") or ""
          if not token or not account:
              print("access_app_inventory=SKIPPED_CREDENTIALS")
          else:
              api="https://api.cloudflare.com/client/v4/accounts/"+account+"/access/apps?per_page=100"
              req=urllib.request.Request(api,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      payload=json.load(r)
                  apps=payload.get("result") or []
                  if isinstance(apps,dict):apps=apps.get("items") or []
                  matching=[a for a in apps if domain in [str(a.get("domain") or "")]+[str(x.get("public_domain") or "") for x in a.get("destinations") or []]]
                  print("access_app_inventory=PASS")
                  print("access_app_inventory_total="+str(len(apps)))
                  print("pipeline_access_app_count="+str(len(matching)))
                  for a in matching[:3]:
                      print("pipeline_access_app_type="+str(a.get("type") or "unknown")[:35])
                      policies=a.get("policies") or []
                      print("pipeline_access_app_policy_actions="+",".join(sorted({str(x.get("decision") or "") for x in policies if isinstance(x,dict)}))[:100])
                      appid=str(a.get("id") or "")
                      if appid:
                          purl="https://api.cloudflare.com/client/v4/accounts/"+account+"/access/apps/"+urllib.parse.quote(appid)+"/policies"
                          preq=urllib.request.Request(purl,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
                          try:
                              with urllib.request.urlopen(preq,timeout=20) as r:
                                  pd=json.load(r)
                              found=pd.get("result") or []
                              if isinstance(found,dict):found=found.get("items") or []
                              print("pipeline_access_policy_decisions="+",".join(sorted({str(x.get("decision") or "") for x in found if isinstance(x,dict)}))[:100])
                              print("pipeline_service_auth_policy_present="+str(any(str(x.get("decision") or "").lower()=="non_identity" for x in found if isinstance(x,dict))))
                          except urllib.error.HTTPError as ex:
                              print("pipeline_access_policy_read_http="+str(ex.code))
              except urllib.error.HTTPError as err:
                  print("access_app_inventory_http="+str(err.code))
              except Exception as err:
                  print("access_app_inventory_error="+type(err).__name__)
          # Check Tunnel ingress and zone Access without changing routing or policy.
          if token and account:
              base_headers={"Authorization":"Bearer "+token,"Accept":"application/json"}
              tunnel="f7a22f0f-f760-4e16-a085-3538d22981f1"
              tunnel_url="https://api.cloudflare.com/client/v4/accounts/"+account+"/cfd_tunnel/"+tunnel+"/configurations"
              try:
                  with urllib.request.urlopen(urllib.request.Request(tunnel_url,headers=base_headers),timeout=25) as res:
                      td=json.load(res)
                  ingress=((td.get("result") or {}).get("config") or {}).get("ingress") or []
                  routes=[x for x in ingress if x.get("hostname")==domain]
                  print("tunnel_configuration_read=PASS")
                  print("tunnel_pipeline_route_count="+str(len(routes)))
                  print("tunnel_pipeline_route_to_localhost_3350="+str(any(str(x.get("service") or "").lower() in ("http://localhost:3350","http://127.0.0.1:3350") for x in routes)))
              except urllib.error.HTTPError as err:
                  print("tunnel_configuration_read_http="+str(err.code))
              except Exception as err:
                  print("tunnel_configuration_read_error="+type(err).__name__)
              try:
                  zones_url="https://api.cloudflare.com/client/v4/zones?name=chicagoshining.com"
                  with urllib.request.urlopen(urllib.request.Request(zones_url,headers=base_headers),timeout=25) as res:
                      zd=json.load(res)
                  zones=zd.get("result") or []
                  print("zone_list_read=PASS")
                  print("exact_zone_count="+str(len(zones)))
                  for zone in zones[:1]:
                      z=zone.get("id")
                      url="https://api.cloudflare.com/client/v4/zones/"+str(z)+"/access/apps?per_page=100"
                      try:
                          with urllib.request.urlopen(urllib.request.Request(url,headers=base_headers),timeout=25) as res:
                              pd=json.load(res)
                          apps=pd.get("result") or []
                          if isinstance(apps,dict):apps=apps.get("items") or []
                          print("zone_access_apps_total="+str(len(apps)))
                          print("zone_pipeline_access_app_count="+str(sum(domain in str(a.get("domain") or "") for a in apps)))
                      except urllib.error.HTTPError as err:
                          print("zone_access_apps_http="+str(err.code))
                      durl="https://api.cloudflare.com/client/v4/zones/"+str(z)+"/dns_records?name="+domain
                      try:
                          with urllib.request.urlopen(urllib.request.Request(durl,headers=base_headers),timeout=25) as res:
                              dd=json.load(res)
                          rs=dd.get("result") or []
                          print("pipeline_dns_records_count="+str(len(rs)))
                          print("pipeline_dns_record_types="+",".join(sorted({str(x.get("type")) for x in rs}))[:50])
                          print("pipeline_dns_records_proxied="+str(all(x.get("proxied") is True for x in rs) if rs else "unknown"))
                      except urllib.error.HTTPError as err:
                          print("pipeline_dns_records_http="+str(err.code))
              except urllib.error.HTTPError as err:
                  print("zone_list_http="+str(err.code))
              except Exception as err:
                  print("zone_list_error="+type(err).__name__)
          if token and account:
              worker="https://api.cloudflare.com/client/v4/accounts/"+account+"/workers/scripts/chicagoshining-studio-api"
              try:
                  with urllib.request.urlopen(urllib.request.Request(worker+"/deployments",headers=base_headers),timeout=25) as res:
                      deployments=json.load(res)
                  versions=(deployments.get("result") or {}).get("deployments") or []
                  if versions:
                      active=max(versions[0].get("versions") or [],key=lambda x:x.get("percentage",0))
                      version=active.get("version_id")
                      with urllib.request.urlopen(urllib.request.Request(worker+"/versions/"+str(version),headers=base_headers),timeout=25) as res:
                          version_data=json.load(res)
                      binding_list=((version_data.get("result") or {}).get("resources") or {}).get("bindings") or []
                      bindings={x.get("name"):x.get("type") for x in binding_list}
                      for name in ("CF_ACCESS_CLIENT_ID","CF_ACCESS_CLIENT_SECRET","PIPELINE_RUNNER_SHARED_SECRET","PIPELINE_RUNNER_URL"):
                          print("worker_binding_"+name+"="+str(bindings.get(name) or "absent"))
              except urllib.error.HTTPError as err:
                  print("worker_binding_diagnostic_http="+str(err.code))
              except Exception as err:
                  print("worker_binding_diagnostic_error="+type(err).__name__)
          print("diagnostic_only=YES")
          PY
      - name: Check Windows Runner local health through existing protected Ops interface
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPS_TOKEN:-}" ]]; then
            echo 'ops_token_present=NO'
            exit 0
          fi
          python - <<'PY' > /tmp/runner-ops-readonly.json
          import json
          command = r'''$ErrorActionPreference='Stop'; try { $r=Invoke-WebRequest -Uri 'http://127.0.0.1:3350/health' -UseBasicParsing -TimeoutSec 12; $o=$r.Content|ConvertFrom-Json; Write-Output ('runner_local_http='+$r.StatusCode); Write-Output ('runner_local_service_verified='+($o.service -eq 'pipeline-runner')); Write-Output ('runner_local_airtable_authority='+($o.studio_write_source -eq 'airtable')); Write-Output ('runner_local_asset_ingest_route='+([bool](@($o.jobs|Where-Object {$_.path -eq '/jobs/studio-asset-library'}).Count))); Write-Output ('runner_local_watermark_route='+([bool](@($o.jobs|Where-Object {$_.path -eq '/jobs/studio-asset-watermark'}).Count))) } catch { Write-Output ('runner_local_health_error='+$_.Exception.GetType().Name) }; $t=@(Get-Process -Name cloudflared -ErrorAction SilentlyContinue); Write-Output ('runner_cloudflared_process_running='+($t.Count -gt 0))'''
          print(json.dumps({"command":command,"confirm":True}))
          PY
          code=$(curl -sS --max-time 20 -w '%{http_code}' -o /tmp/ops-start.json -X POST             'https://ops.chicagoshining.com/api/shell'             -H "Authorization: Bearer $OPS_TOKEN"             -H 'Content-Type: application/json'             --data-binary @/tmp/runner-ops-readonly.json || true)
          echo "ops_shell_submit_http=$code"
          if [[ "$code" != "200" && "$code" != "202" ]]; then
            exit 0
          fi
          job=$(jq -r '.job.id // .jobId // empty' /tmp/ops-start.json)
          if [[ -z "$job" ]]; then
            echo 'ops_shell_job_received=NO'
            exit 0
          fi
          for n in $(seq 1 18); do
            curl -sS --max-time 20 -H "Authorization: Bearer $OPS_TOKEN"               "https://ops.chicagoshining.com/api/jobs/$job" -o /tmp/ops-job.json || true
            state=$(jq -r '.job.status // empty' /tmp/ops-job.json 2>/dev/null || true)
            if [[ "$state" == "ok" ]]; then
              jq -r '.job.log // ""' /tmp/ops-job.json                 | grep -E '^runner_(local_|cloudflared_)' || true
              echo 'ops_readonly_probe=COMPLETE'
              exit 0
            fi
            if [[ "$state" == "failed" ]]; then
              echo 'ops_readonly_probe=FAILED'
              exit 0
            fi
            sleep 3
          done
          echo 'ops_readonly_probe=INCOMPLETE'
