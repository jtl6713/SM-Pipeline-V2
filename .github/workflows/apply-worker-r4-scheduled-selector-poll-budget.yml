name: Apply Worker R4 Scheduled Selector Poll Budget

on:
  push:
    branches: [main]
    paths:
      - 'deploy/apply-worker-r4-scheduled-selector-poll-budget.txt'

permissions:
  contents: write

concurrency:
  group: apply-worker-r4-scheduled-selector-poll-budget
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply polling-budget patch only
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(git hash-object apps/studio-api/worker.js)
          python repair/tools/patch_worker_r4_scheduled_selector_poll_budget.py | tee /tmp/patch-output.txt
          cp apps/studio-api/worker.js /tmp/studio-worker.mjs
          node --check /tmp/studio-worker.mjs
          git diff --check
          test "$(git diff --name-only)" = 'apps/studio-api/worker.js'
          grep -q 'r4_scheduled_selector_poll_budget_patch=applied' /tmp/patch-output.txt
          grep -q '}, 24000, 3000);' apps/studio-api/worker.js
          grep -q 'Standalone ACTIVATE/RUN is intentionally disabled' apps/studio-api/worker.js
          AFTER=$(git hash-object apps/studio-api/worker.js)
          test "$BEFORE" != "$AFTER"
          printf '{"before_blob":"%s","after_blob":"%s","scope":"R4 scheduled-selector test polling cadence only"}\n' "$BEFORE" "$AFTER" >/tmp/evidence.json
      - name: Commit patched Studio API source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SM Pipeline Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/studio-api/worker.js
          git commit -m 'fix: reduce R4 selector proof polling subrequests'
          git push origin HEAD:main
      - name: Upload patch evidence
        uses: actions/upload-artifact@v4
        with:
          name: r4-selector-poll-budget-${{ github.run_id }}
          path: /tmp/evidence.json
          retention-days: 30
