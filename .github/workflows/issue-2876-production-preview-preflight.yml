name: Issue 2876 Production Preview Read-Only Preflight

on:
  pull_request:
    paths:
      - 'apps/studio-web/**'
      - '.github/workflows/issue-2876-production-preview-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect actual custom-domain Studio UI (GET only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCESS_CLIENT_ID:-}"
          test -n "${CF_ACCESS_CLIENT_SECRET:-}"
          headers=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID"
                   -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          code=$(curl -sS -L --max-time 25 "${headers[@]}" -o /tmp/issue2876-live-index.html \
            -w '%{http_code}' "https://studio.chicagoshining.com/?qa2876=$GITHUB_SHA")
          test "$code" = 200
          live_app=$(node apps/studio-web/ui-release-contract.mjs \
            --html /tmp/issue2876-live-index.html --app-url)
          case "$live_app" in /assets/app-item4-*.js\?*) ;; *) echo "Unexpected live app asset path"; exit 1;; esac
          code=$(curl -sS -L --max-time 35 "${headers[@]}" -o /tmp/issue2876-live-app.js \
            -w '%{http_code}' "https://studio.chicagoshining.com$live_app")
          test "$code" = 200
          node apps/studio-web/ui-release-contract.mjs \
            --html /tmp/issue2876-live-index.html --app /tmp/issue2876-live-app.js > /tmp/issue2876-live-contract.json
          live_version=$(node apps/studio-web/ui-release-contract.mjs \
            --html /tmp/issue2876-live-index.html --html-version)
          node apps/studio-web/ui-release-contract.mjs --assert-newer-than "$live_version" >/dev/null
          echo "issue2876_source_newer_than_actual_live_ui=true"
          echo "live_version=$live_version"
      - name: Runner /health readiness (GET only, no stage or publish requests)
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -L --max-time 25 -o /tmp/issue2876-health.json -w '%{http_code}' \
            "https://pipeline.chicagoshining.com/health?qa2876=$GITHUB_SHA" || true)
          if [[ "$code" != 200 ]]; then
            echo "::error::Runner public health unavailable (HTTP $code)"; exit 1
          fi
          jq -e '.ok==true and .studio_write_source=="supabase" and .supabase_pipeline_writes==true' \
            /tmp/issue2876-health.json >/dev/null
          echo "issue2876_runner_supabase_health=true"
          echo "Read-only preflight only. No coordinator, rendering, approval, publishing or deployment changes."
