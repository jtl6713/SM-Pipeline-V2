name: Read FB Public Through Worker
on:
  push:
    branches: [main]
    paths: ['deploy/read-fb-public-through-worker.txt']
permissions: {contents: read}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      VERIFY_BRIDGE: chicagoshining-fb-public-diagnostic
    steps:
      - uses: actions/checkout@v6
      - name: Build temporary service-binding diagnostic bridge
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )
          printf '%s' "$TOKEN" >/tmp/diag-token.txt
          cat >/tmp/diag-worker.js <<EOF
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== "/$TOKEN") return new Response("Not found", {status:404});
              const internal = new Request("https://studio.chicagoshining.com/api/admin/fb-public-diagnostic", {
                method:"GET",
                headers:{
                  "Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com",
                  "Origin":"https://studio.chicagoshining.com",
                  "Accept":"application/json"
                }
              });
              const response = await env.STUDIO_API.fetch(internal);
              return new Response(await response.text(), {
                status:response.status,
                headers:{"Content-Type":"application/json","Cache-Control":"no-store"}
              });
            }
          };
          EOF
          cat >/tmp/diag-metadata.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$API_ROOT/workers/scripts/$VERIFY_BRIDGE" -H "$AUTH" >/dev/null || true
          code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X PUT "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/content" -H "$AUTH"             -F 'metadata=@/tmp/diag-metadata.json;type=application/json'             -F 'worker.js=@/tmp/diag-worker.js;type=application/javascript+module;filename=worker.js')
          test "$code" -ge 200 -a "$code" -lt 300
          jq -e '.success==true' /tmp/upload.json >/dev/null
          curl -fsS -X POST "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/subdomain" -H "$AUTH" -H 'Content-Type: application/json'             --data '{"enabled":true,"previews_enabled":false}' >/tmp/subdomain-enable.json
          jq -e '.success==true' /tmp/subdomain-enable.json >/dev/null
      - name: Read live FB-PUBLIC diagnostic
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$API_ROOT/workers/subdomain" -H "$AUTH" -o /tmp/account-subdomain.json
          SUB=$(jq -er '.result.subdomain' /tmp/account-subdomain.json)
          TOKEN=$(cat /tmp/diag-token.txt)
          URL="https://$VERIFY_BRIDGE.$SUB.workers.dev/$TOKEN"
          code=000
          for i in 1 2 3 4 5; do
            code=$(curl -sS --max-time 60 -o /tmp/fb-public-diagnostic.json -w '%{http_code}' "$URL" || true)
            [[ "$code" == "200" ]] && break
            sleep 2
          done
          echo "diagnostic_http=$code"
          cat /tmp/fb-public-diagnostic.json
          test "$code" = "200"
          jq -e '.ok==true' /tmp/fb-public-diagnostic.json >/dev/null
      - name: Delete diagnostic bridge
        if: always()
        shell: bash
        run: |
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$API_ROOT/workers/scripts/$VERIFY_BRIDGE" -H "$AUTH" >/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fb-public-worker-diagnostic-${{ github.run_id }}
          path: /tmp/fb-public-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7
