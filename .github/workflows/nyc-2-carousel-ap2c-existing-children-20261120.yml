name: 'NYC two carousel existing-child AP2C polls only'

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nyc-2-carousel-ap2c-existing-children-20261120.yml'

permissions:
  contents: read

concurrency:
  group: nyc-two-carousel-existing-child-ap2c-20261120
  cancel-in-progress: false

jobs:
  original-children-poll:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - output_id: 9855
            record_id: reccfGD1hDBiG6tIV
            content_id: 2d9e6f32-a67e-47a7-8ebb-dcdead2d7f12
            children: 'rec4BiEp3Zp7ViLPp:18134478985783117;rec0BDXkHb75cGBuK:18134479015783117;rec41rjA4U0B6E3pJ:18134479057783117;recqGV7IHfXSN6czr:18134479093783117'
          - output_id: 9890
            record_id: rec7uB7WQhZLyk28T
            content_id: bff50fe9-6180-4930-ab07-198be07c2193
            children: 'recjpYM2oMVwB2O2b:18134415559783117;recKtSM07PMju63Kg:18134415577783117;recskbQwqDG8ngYcV:18134415640783117;recQSGve7AsPgAv0u:18134415715783117;recnKkgCff3Ac3k9j:18134415775783117;recLmKEP2Q6shcrCv:18134415793783117;recQV50pKd8lAwoYI:18134415835783117;rec6bIPoqoGxZDRBx:18134415883783117'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPS_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - name: Check exact 4 saved children and run native AP2C only
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/ap2c_batch.ps1 <<'PS'
          $ErrorActionPreference="Stop"
          $record="__REC__";$target=__ID__
          $health=Invoke-RestMethod -Uri "http://127.0.0.1:3350/health" -TimeoutSec 18
          if($health.ok -ne $true -or $health.studio_write_source -ne "supabase" -or $health.studio_runner_output_read_source -ne "supabase" -or $health.studio_runner_content_read_source -ne "supabase" -or $health.airtable_activity.any_read -ne $false -or $health.airtable_activity.any_write -ne $false){throw "ap2c_batch_supabase_health_gate"}
          $envpath=Join-Path (Get-Location) "Services\pipeline-runner\service\.env"
          if(-not(Test-Path $envpath)){throw "ap2c_batch_env_missing"}
          function Setting([string]$key){
           $line=@(Get-Content $envpath|Where-Object{$_ -match ("^\s*"+[regex]::Escape($key)+"\s*=")})|Select-Object -Last 1
           if(-not $line){throw "ap2c_batch_missing_setting"}
           return ([string]$line -split '=',2)[1].Trim().Trim('"',"'")
          }
          $secret=Setting "PIPELINE_RUNNER_SHARED_SECRET";$dburl=Setting "SUPABASE_URL";$dbkey=Setting "SUPABASE_SERVICE_ROLE_KEY"
          $h=@{apikey=$dbkey;Authorization=("Bearer "+$dbkey)}
          $base=$dburl.TrimEnd("/")+"/rest/v1"
          $u=$base+"/platform_outputs?airtable_record_id=eq."+$record+"&select=output_number,airtable_record_id,content_item_id,content_profile_id,platform,platform_output_type,review_status,output_status,publish_status,publish_method,auto_publish_enabled,do_not_publish,test_run_id,published_at,platform_post_url,ig_carousel_status,publish_next_retry_at,error_messages"
          function Preflight {
           $p=@(Invoke-RestMethod -Uri $u -Headers $h -TimeoutSec 25)
           if($p.Count -ne 1){throw "ap2c_batch_output_not_unique"}
           $x=$p[0]
           if($x.output_number -ne __ID__ -or $x.content_item_id -ne "__CONTENT__" -or $x.platform -ne "Instagram" -or $x.platform_output_type -ne "Instagram Carousel" -or $x.review_status -ne "Approved" -or $x.output_status -ne "Approved for Publishing" -or $x.publish_status -ne "Ready to Publish" -or $x.publish_method -ne "Automated" -or $x.auto_publish_enabled -ne $true -or $x.do_not_publish -ne $false -or $x.test_run_id -or $x.published_at -or $x.platform_post_url -or $x.ig_carousel_status -ne "Children Processing" -or $x.publish_next_retry_at -or $x.error_messages.IG_Carousel_Parent_Container_ID -or $x.error_messages.IG_Carousel_Published_Media_ID -or $x.error_messages.Platform_Post_ID -or $x.error_messages.Publish_Locked_By -or $x.error_messages.IG_Carousel_Error_Stage -or $x.error_messages.Replace_Transaction_ID){throw "ap2c_batch_parent_gate"}
           $expected=@{}
           foreach($pair in "__CHILD_SPECS__".Split(';')){ $parts=$pair.Split(':'); if($parts.Count -ne 2){throw "ap2c_batch_child_map_invalid"}; $expected[$parts[0]]=$parts[1] }
           $query=$base+"/carousel_slides?airtable_record_id=in.("+($expected.Keys -join ",")+")&select=airtable_record_id,ig_child_container_id,deleted_from_carousel,fields"
           $slideResponse=Invoke-RestMethod -Uri $query -Headers $h -TimeoutSec 25
           $slides=@($slideResponse | ForEach-Object { $_ })
           if($slides.Count -eq 1 -and $slides[0] -is [array]) { $slides=@($slides[0]) }
           Write-Output ("ap2c_batch_supabase_child_count="+$slides.Count)
           if($slides.Count -ne $expected.Count){throw "ap2c_batch_expected_children_required"}
           $orders=@()
           foreach($s in $slides){
            if(-not $expected.ContainsKey([string]$s.airtable_record_id) -or [string]$s.ig_child_container_id -ne $expected[[string]$s.airtable_record_id] -or $s.deleted_from_carousel -eq $true -or [string]$s.fields.IG_Child_Container_Status -ne "IN_PROGRESS" -or [string]$s.fields.IG_Public_Asset_Status -ne "Ready" -or __ID__ -notin @($s.fields.PO_Output_ID)){throw "ap2c_batch_child_identity_or_state_gate"}
            $orders+= [int]$s.fields.'Current Order'
           }
           if((($orders|Sort-Object) -join ",") -ne ((1..$expected.Count) -join ",")){throw "ap2c_batch_child_order_gate"}
           return $x
          }
          $x=Preflight
          $h2=@{"X-Pipeline-Secret"=$secret}
          function Poll([bool]$dry) {
           $body=@{output_record_id=$record;extra=@{dry_run=$dry}}|ConvertTo-Json -Depth 4 -Compress
           return Invoke-RestMethod -Uri "http://127.0.0.1:3350/stages/ap2c" -Method POST -Headers $h2 -ContentType "application/json" -Body $body -TimeoutSec 185
          }
          $dry=Poll $true
          if($dry.status -ne "ok" -or $dry.details.run.dry_run -ne $true -or $dry.details.run.eligibility_reason){throw "ap2c_batch_dry_run_refused"}
          Write-Output "ap2c_batch_dry=PASS"
          $x=Preflight
          $real=Poll $false
          Write-Output ("ap2c_batch_native_status="+[string]$real.status)
          Write-Output ("ap2c_batch_native_reason="+[string]$real.details.run.reason)
          $after=@(Invoke-RestMethod -Uri $u -Headers $h -TimeoutSec 25)
          if($after.Count -ne 1 -or $after[0].published_at -or $after[0].platform_post_url -or $after[0].error_messages.IG_Carousel_Parent_Container_ID){throw "ap2c_batch_unexpected_remote_publication"}
          Write-Output ("ap2c_batch_carousel_state="+[string]$after[0].ig_carousel_status)
          Write-Output "ap2c_batch_no_publication=PASS"
          if($after[0].ig_carousel_status -eq "Children Ready"){Write-Output "ap2c_batch_children_ready=PASS"}
          PS
          sed -i -e 's/__ID__/${{ matrix.output_id }}/g' -e 's/__REC__/${{ matrix.record_id }}/g' -e 's/__CONTENT__/${{ matrix.content_id }}/g' -e 's/__CHILD_SPECS__/${{ matrix.children }}/g' /tmp/ap2c_batch.ps1
          python3 - <<'PY'
          import json,pathlib
          pathlib.Path("/tmp/ap2c_batch-body.json").write_text(json.dumps({"command":pathlib.Path("/tmp/ap2c_batch.ps1").read_text(),"confirm":True}))
          PY
          token=''
          for t in "$OPS_A" "$OPS_B" "$OPS_C"; do
            test -n "$t" || continue
            code=$(curl -sS --max-time 20 -o /tmp/ap2c_batch-auth.json -w '%{http_code}' -H "Authorization: Bearer $t" https://ops.chicagoshining.com/api/catalog || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/ap2c_batch-auth.json >/dev/null; then token="$t"; break; fi
          done
          test -n "$token"
          code=$(curl -sS --max-time 25 -o /tmp/ap2c_batch-job.json -w '%{http_code}' -X POST https://ops.chicagoshining.com/api/shell -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @/tmp/ap2c_batch-body.json || true)
          if [[ "$code" != 200 && "$code" != 202 ]]; then echo "ap2c_batch_accepted=false_http_$code"; exit 2; fi
          job=$(jq -er '.job.id // .jobId' /tmp/ap2c_batch-job.json)
          for n in $(seq 1 70); do
            curl -sS --max-time 25 -H "Authorization: Bearer $token" "https://ops.chicagoshining.com/api/jobs/$job" -o /tmp/ap2c_batch-status.json
            state=$(jq -r '.job.status // empty' /tmp/ap2c_batch-status.json)
            if [[ "$state" == ok ]]; then
              jq -r '.job.log // ""' /tmp/ap2c_batch-status.json | grep '^ap2c_batch_' || true
              exit 0
            elif [[ "$state" == failed ]]; then
              echo "ap2c_batch_runner_job_failed"
              jq -r '.job.log // ""' /tmp/ap2c_batch-status.json | grep -E '^ap2c_batch_|Exception|Error|Traceback|Cannot bind|InvalidOperation' | tail -16 || true
              exit 3
            fi
            sleep 4
          done
          echo "ap2c_batch_job_timed_out"; exit 4
