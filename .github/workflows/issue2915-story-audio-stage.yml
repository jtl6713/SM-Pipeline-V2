name: Issue 2915 Stage Corrected Vizcaya Story
on:
  pull_request:
    paths:
      - 'repair/scripts/issue2915-story-audio-stage.py'
      - '.github/workflows/issue2915-story-audio-stage.yml'
  push:
    branches: [main]
    paths:
      - 'repair/scripts/issue2915-story-audio-stage.py'
      - '.github/workflows/issue2915-story-audio-stage.yml'
permissions:
  contents: read
concurrency:
  group: issue2915-story-audio-stage
  cancel-in-progress: false
jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile and prove exact Story preflight fails closed
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile repair/scripts/issue2915-story-audio-stage.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path('repair/scripts/issue2915-story-audio-stage.py'); s=p.read_text(); tree=ast.parse(s)
          for required in ['resource_slot','circuit_open','recovery_read_only_active','studio_write_source','studio_runner_output_read_source','5628','18116418158139610','source_writes=0','provider_writes=0','factory_approvals=0','hold_preserved=True','candidate_bytes_changed']:
              assert required in s, required
          for node in ast.walk(tree):
              if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute) and isinstance(node.func.value,ast.Name) and node.func.value.id=='requests':
                  assert node.func.attr=='get', node.func.attr
          scope={'RECORD':'rec1Zg5eEJjQKzUDO','PROFILE':'65e9071a-d2fd-4898-88a4-111bf8a3bfb5','OLD_DRIVE_ID':'1CTcy2wE3OrQbgXQn7K5a2NuTXS7H22_j'}
          helper=ast.Module(body=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='assert_exact'],type_ignores=[])
          exec(compile(helper,'story-helper','exec'),scope)
          good=dict(airtable_record_id=scope['RECORD'],output_number=5628,content_number=1018,content_profile_id=scope['PROFILE'],platform='Instagram',format='Story',output_status='Approved for Publishing',review_status='Approved',publish_status='Failed',do_not_publish=True,auto_publish_enabled=False,publish_retry_eligible=False,final_file_url=scope['OLD_DRIVE_ID'],updated_at='version',error_messages={'IG_Story_Container_ID':'18116418158139610'})
          scope['assert_exact'](good)
          for patch in [dict(output_number=5629),dict(do_not_publish=False),dict(publish_retry_eligible=True),dict(auto_publish_enabled=True),dict(published_at='already'),dict(error_messages={'IG_Story_Container_ID':'different'}),dict(final_file_url='different')]:
              try: scope['assert_exact']({**good,**patch})
              except RuntimeError: pass
              else: raise AssertionError('unsafe story state accepted')
          print('ISSUE2915_STORY_STAGE_STATIC_SAFE')
          PY
  stage-owned-media:
    if: github.event_name == 'push'
    needs: static-safety
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate existing Ops runner without exposing credential
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C";do
            [[ -n "$candidate" ]] || continue
            http=$(curl -sS --max-time 20 -o /tmp/issue2915-ops-catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" 'https://ops.chicagoshining.com/api/catalog' || true)
            if [[ "$http" == 200 ]] && jq -e '.ok==true' /tmp/issue2915-ops-catalog.json >/dev/null;then
              echo "::add-mask::$candidate"
              echo "ISSUE2915_OPS_TOKEN=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'Owned R2 staging blocked: Ops unavailable; no media state changed'; exit 1
      - name: Build pinned SHA256 source execution request for original owner runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,json,pathlib
          src=pathlib.Path('repair/scripts/issue2915-story-audio-stage.py')
          expected=hashlib.sha256(src.read_bytes()).hexdigest()
          sha=os.environ['GITHUB_SHA']
          assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha)
          url=f'https://raw.githubusercontent.com/jtl6713/SM-Pipeline-V2/{sha}/{src.as_posix()}'
          command=(
              "$ErrorActionPreference='Stop';"
              "$py=Get-Command python -ErrorAction SilentlyContinue;"
              "if(-not $py){throw 'ops_python_missing'};"
              "$tmp=Join-Path $env:TEMP 'issue2915-story-audio-stage.py';"
              f"$srcUrl='{url}';"
              "Invoke-WebRequest -Uri $srcUrl -Method Get -OutFile $tmp -UseBasicParsing -TimeoutSec 55;"
              "$actual=(Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant();"
              f"if($actual -ne '{expected}'){{throw 'exact_stage_source_checksum_mismatch'}};"
              "try{& python $tmp;"
              "if($LASTEXITCODE -ne 0){throw ('story_audio_python_stage_exit_'+$LASTEXITCODE)}}"
              "finally{Remove-Item $tmp -Force -ErrorAction SilentlyContinue}"
          )
          pathlib.Path('/tmp/issue2915-ops-request.json').write_text(json.dumps({'command':command,'confirm':True}))
          print('IMMUTABLE_ISSUE2915_STAGE_SOURCE_PINNED')
          PY
      - name: Stage verified corrected Story, no output writes
        shell: bash
        run: |
          set -euo pipefail
          accepted=false
          for slot in $(seq 1 32);do
            code=$(curl -sS --max-time 30 -o /tmp/issue2915-ops-start.json -w '%{http_code}' \
              -X POST 'https://ops.chicagoshining.com/api/shell' \
              -H "Authorization: Bearer $ISSUE2915_OPS_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @/tmp/issue2915-ops-request.json || true)
            if [[ "$code" == 200 || "$code" == 202 ]];then accepted=true;break;fi
            if [[ "$code" != 409 ]];then echo "R2 owner runner returned $code";exit 2;fi
            sleep 12
          done
          [[ "$accepted" == true ]] || { echo 'Ops shell busy; no second stage scheduled';exit 2; }
          job=$(jq -er '.job.id // .jobId' /tmp/issue2915-ops-start.json)
          for tick in $(seq 1 480);do
            curl -fsS --max-time 30 -H "Authorization: Bearer $ISSUE2915_OPS_TOKEN" \
              "https://ops.chicagoshining.com/api/jobs/$job" -o /tmp/issue2915-ops-job.json
            status=$(jq -r '.job.status // empty' /tmp/issue2915-ops-job.json)
            if [[ "$status" == ok ]];then
              jq -r '.job.log // ""' /tmp/issue2915-ops-job.json | grep '^ISSUE2915_STORY_AUDIO_STAGE=' | tail -1 \
                | sed 's/^ISSUE2915_STORY_AUDIO_STAGE=//' > /tmp/issue2915-story-stage.json
              jq -e '.verified==true and .output==5628 and .content==1018 and .source_writes==0 and .provider_writes==0 and .factory_approvals==0 and .hold_preserved==true and .geometry=="1080x1920" and .duration_seconds==15.5 and .size==8368028 and .sha256=="e9f4ad61913fe88aad28bcf6df5643bd8586c74c34ab0b2fe1c9b2d37c3a747f"' /tmp/issue2915-story-stage.json >/dev/null
              jq -c '{verified,output,content,updated_at,drive_id,url,sha256,size,geometry,duration_seconds,media_proof,source_writes,provider_writes,factory_approvals,hold_preserved}' /tmp/issue2915-story-stage.json
              exit 0
            elif [[ "$status" == failed ]];then
              echo 'Corrected Story stage failed; no automatic source/approval/provider changes'
              jq -r '.job.log // ""' /tmp/issue2915-ops-job.json | tail -n 23 \
                | sed -E 's#[A-Za-z0-9_./+=-]{28,}#[redacted]#g' \
                | grep -Ev 'Authorization:|Bearer |SUPABASE_SERVICE_ROLE_KEY|R2_UPLOAD_WORKER_SECRET|GOOGLE_REFRESH_TOKEN' || true
              exit 3
            fi
            sleep 4
          done
          echo 'R2 staging job incomplete; do not set public statuses Ready'; exit 4
      - name: Preserve exact candidate CDN hash and review-only receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue2915-story-audio-stage
          path: /tmp/issue2915-story-stage.json
          retention-days: 30
          if-no-files-found: warn
