name: Install Dedicated Studio ElevenLabs Video API Secret

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chicagoshining-studio-api-production
  cancel-in-progress: false

jobs:
  put:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ELEVENLABS_VIDEO_API_KEY: ${{ secrets.ELEVENLABS_VIDEO_API_KEY }}
      TARGET_WORKER: chicagoshining-studio-api
    steps:
      - name: Verify secret presence without printing values
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$ELEVENLABS_VIDEO_API_KEY"
          echo "preflight=PASS; no external generation requested"

      - name: Install video-only secret and verify existing narration bindings survived
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          target = "https://api.cloudflare.com/client/v4/accounts/{}/workers/scripts/{}".format(
              os.environ["CLOUDFLARE_ACCOUNT_ID"],os.environ["TARGET_WORKER"])
          auth = {"Authorization": "Bearer " + os.environ["CLOUDFLARE_API_TOKEN"]}
          def get_json(path):
              req = urllib.request.Request(target + path, headers=auth)
              with urllib.request.urlopen(req, timeout=45) as response:
                  payload = json.loads(response.read().decode())
              if payload.get("success") is not True:
                  raise SystemExit("Cloudflare secret verification response was not successful")
              return payload.get("result")
          def active_bindings():
              versions = get_json("/deployments")
              version_id = max(versions["deployments"][0]["versions"],
                               key=lambda x: x.get("percentage", 0))["version_id"]
              details = get_json("/versions/" + version_id)
              return {row["name"]:row["type"] for row in
                      (details.get("resources") or {}).get("bindings") or []}
          before=active_bindings()
          expected={"AIRTABLE_PAT":"secret_text","STUDIO_MEDIA":"r2_bucket",
                    "ELEVENLABS_API_KEY":"secret_text"}
          for name, typ in expected.items():
              if before.get(name) != typ:
                  raise SystemExit("Existing production binding missing or changed: " + name)
          secret = {"name":"ELEVENLABS_VIDEO_API_KEY",
                    "text":os.environ["ELEVENLABS_VIDEO_API_KEY"],
                    "type":"secret_text"}
          headers = dict(auth, **{"Content-Type":"application/json"})
          req=urllib.request.Request(target + "/secrets",headers=headers,
                                     data=json.dumps(secret).encode(),method="PUT")
          try:
              with urllib.request.urlopen(req,timeout=60) as response:
                  result=json.loads(response.read().decode())
          except urllib.error.HTTPError as error:
              raise SystemExit("Cloudflare refused dedicated video secret (HTTP {})".format(error.code))
          entry=result.get("result") or {}
          if result.get("success") is not True or entry.get("name")!="ELEVENLABS_VIDEO_API_KEY" or entry.get("type")!="secret_text":
              raise SystemExit("Cloudflare did not confirm dedicated video secret")
          after=active_bindings()
          for name,typ in {**expected,"ELEVENLABS_VIDEO_API_KEY":"secret_text"}.items():
              if after.get(name)!=typ:
                  raise SystemExit("Required binding missing after video-secret installation: "+name)
          for name,typ in before.items():
              if after.get(name)!=typ:
                  raise SystemExit("Pre-existing Worker binding changed during secret install: "+name)
          print("video_secret_installed=PASS")
          print("existing_narration_key_preserved=PASS")
          print("source_or_feature_flags_changed=NO")
          print("paid_generation_triggered=NO")
          PY
