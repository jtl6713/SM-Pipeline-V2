name: Apply Item6 Ambiguous Retry Guards

on:
  push:
    branches: [main]
    paths: ['deploy/apply-item6-ambiguous-retry-guards.txt']

permissions: {contents: read}

concurrency:
  group: item6-make-ambiguity-guards
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Patch live Make blueprints with rollback
        shell: bash
        run: bash repair/scripts/apply-item6-ambiguous-retry-guards.sh
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item6-ambiguous-retry-guards-${{ github.run_id }}
          path: /tmp/item6-ambiguous-retry-guards-evidence.json
          if-no-files-found: ignore
          retention-days: 30
