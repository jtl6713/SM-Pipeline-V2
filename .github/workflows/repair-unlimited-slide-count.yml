name: Repair Unlimited Production Slide Count

on:
  push:
    branches: [main]
    paths:
      - 'deploy/repair-unlimited-slide-count.txt'

permissions:
  contents: write

concurrency:
  group: repair-unlimited-production-slide-count
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Patch Worker bridge validation
        run: python repair/scripts/patch_unlimited_slide_bridge.py
      - name: Run focused tests
        run: |
          node --test apps/studio-api/production-unlimited-slide-count.test.mjs apps/studio-api/video-carousel-count-guard.test.mjs
          node --check apps/studio-api/worker.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio-api/worker.js apps/studio-api/*.test.mjs deploy/cloudflare-worker-production.txt
          git diff --cached --quiet && exit 0
          git commit -m "Remove bridge 20-slide validation limit"
          git push origin HEAD:main
