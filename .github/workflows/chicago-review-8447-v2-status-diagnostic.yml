name: Diagnose prior Chicago #8447 V2 Runner result read-only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chicago-review-8447-v2-status-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      OPS_TOKEN: ${{ secrets.OPS_DASHBOARD_TOKEN }}
    steps:
      - name: Read only exact Runner status; do not trigger or retry
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPS_TOKEN"
          cat >/tmp/review-read-status.ps1 <<'PS1'
          $ErrorActionPreference='Stop'
          $envFile=Join-Path (Get-Location) 'Services\pipeline-runner\service\.env'
          if(-not (Test-Path -LiteralPath $envFile)){throw 'runner_env_missing'}
          $line=Get-Content -LiteralPath $envFile | Where-Object {$_ -match '^PIPELINE_RUNNER_SHARED_SECRET\s*='} | Select-Object -First 1
          if(-not $line){throw 'runner_secret_missing'}
          $secret=($line -split '=',2)[1].Trim().Trim('"').Trim([char]39)
          if($secret.Length -lt 24){throw 'runner_secret_invalid'}
          Add-Type -AssemblyName System.Net.Http
          $http=[System.Net.Http.HttpClient]::new()
          $http.Timeout=[TimeSpan]::FromSeconds(20)
          try {
            $req=[System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Get,'http://127.0.0.1:3350/jobs/rendering-review/run-exact/rrjob_26054929500b8abe981e3f6131b5c668209bf9c765edb06c')
            [void]$req.Headers.TryAddWithoutValidation('X-Pipeline-Secret',$secret)
            $response=$http.SendAsync($req).GetAwaiter().GetResult()
            $data=($response.Content.ReadAsStringAsync().GetAwaiter().GetResult()) | ConvertFrom-Json
            Write-Output ('runner_exact_status_http='+[int]$response.StatusCode)
            Write-Output ('runner_exact_status_ok='+[bool]$data.ok)
            Write-Output ('runner_exact_status_state='+[string]$data.state)
            Write-Output ('runner_exact_status_reason='+[string]$data.reason)
            Write-Output ('runner_exact_status_attempt_present='+[bool]$data.attempt_id)
            Write-Output ('runner_exact_status_drive_present='+[bool]$data.drive_file_id)
            if([int]$response.StatusCode -ne 200){throw 'runner_exact_status_unavailable'}
          }finally{$http.Dispose()}
          PS1
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/review-read-status.json').write_text(json.dumps({
            'command':Path('/tmp/review-read-status.ps1').read_text(),'confirm':True
          }))
          PY
          status=$(curl -sS --max-time 25 -o /tmp/review-status-start.json -w '%{http_code}' \
            -X POST https://ops.chicagoshining.com/api/shell \
            -H "Authorization: Bearer $OPS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/review-read-status.json || true)
          if [[ "$status" != "200" && "$status" != "202" ]]; then echo "ops_status_start_http=$status"; exit 1; fi
          JOB=$(jq -r '.job.id // .jobId // empty' /tmp/review-status-start.json)
          test -n "$JOB"
          for n in $(seq 1 45); do
            curl -fsS --max-time 15 -H "Authorization: Bearer $OPS_TOKEN" \
              "https://ops.chicagoshining.com/api/jobs/$JOB" -o /tmp/review-status-result.json
            state=$(jq -r '.job.status // empty' /tmp/review-status-result.json)
            if [[ "$state" == "ok" ]]; then
              jq -r '.job.log // ""' /tmp/review-status-result.json | grep '^runner_exact_status_' | tail -10
              exit 0
            fi
            if [[ "$state" == "failed" ]]; then
              echo 'read_only_status_check_failed'
              exit 1
            fi
            sleep 4
          done
          echo 'read_only_status_unverified'
          exit 1
