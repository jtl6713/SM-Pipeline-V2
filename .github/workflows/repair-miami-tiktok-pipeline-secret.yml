name: Repair Miami TikTok Pipeline Secret

on:
  push:
    branches: [main]
    paths:
      - 'deploy/repair-miami-tiktok-pipeline-secret.txt'

permissions:
  contents: read

concurrency:
  group: repair-miami-tiktok-pipeline-secret
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
      TARGET_WORKER: chicagoshining-tiktok-auth-miami
      SETTING_NAME: MIAMI_TIKTOK_PIPELINE_SECRET
      AIRTABLE_BASE_ID: appe33zkZn35yirTL
      PIPELINE_SETTINGS_TABLE_ID: tblpHPWeEkyJaF7ql
    steps:
      - uses: actions/checkout@v6

      - name: Generate replacement shared secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY' >/tmp/miami-tiktok-secret.txt
          import secrets
          print(secrets.token_urlsafe(48))
          PY
          test -s /tmp/miami-tiktok-secret.txt
          chmod 600 /tmp/miami-tiktok-secret.txt

      - name: Update Miami TikTok Worker pipeline secret
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >/tmp/cf-secret-body.json
          import json
          from pathlib import Path
          secret=Path('/tmp/miami-tiktok-secret.txt').read_text().strip()
          print(json.dumps({"name":"TIKTOK_MAKE_SHARED_SECRET","text":secret,"type":"secret_text"},separators=(',',':')))
          PY
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/secrets"
          code=$(curl -sS -o /tmp/cf-secret-result.json -w '%{http_code}' -X PUT "$API" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/cf-secret-body.json)
          echo "cloudflare_secret_http=$code"
          test "$code" -ge 200 -a "$code" -lt 300
          jq -e '.success==true' /tmp/cf-secret-result.json >/dev/null

      - name: Upsert matching Miami Pipeline Setting
        shell: bash
        run: |
          set -euo pipefail
          PAT=$(printf '%s' "$AIRTABLE_PAT" | tr -d '\r\n')
          test -n "$PAT"
          python - <<'PY' >/tmp/query.txt
          import urllib.parse
          print(urllib.parse.urlencode({
            "filterByFormula":"{Setting_Name}='MIAMI_TIKTOK_PIPELINE_SECRET'",
            "maxRecords":"1",
          }))
          PY
          ROOT="https://api.airtable.com/v0/$AIRTABLE_BASE_ID/$PIPELINE_SETTINGS_TABLE_ID"
          curl -fsS "$ROOT?$(cat /tmp/query.txt)" -H "Authorization: Bearer $PAT" -o /tmp/existing.json
          REC=$(jq -r '.records[0].id // empty' /tmp/existing.json)
          SECRET=$(tr -d '\r\n' </tmp/miami-tiktok-secret.txt)
          SECRET="$SECRET" python - <<'PY' >/tmp/airtable-body.json
          import json,os
          fields={
            "Setting_Name":"MIAMI_TIKTOK_PIPELINE_SECRET",
            "Setting_Value":os.environ["SECRET"],
            "Active":True,
            "Notes":"Miami TikTok Worker shared pipeline secret. Rotated automatically to repair TTD1 401 authentication failures; value intentionally not logged.",
          }
          print(json.dumps({"fields":fields,"typecast":True},separators=(',',':')))
          PY
          if [[ -n "$REC" ]]; then
            code=$(curl -sS -o /tmp/airtable-write.json -w '%{http_code}' -X PATCH "$ROOT/$REC" \
              -H "Authorization: Bearer $PAT" -H 'Content-Type: application/json' --data-binary @/tmp/airtable-body.json)
          else
            code=$(curl -sS -o /tmp/airtable-write.json -w '%{http_code}' -X POST "$ROOT" \
              -H "Authorization: Bearer $PAT" -H 'Content-Type: application/json' --data-binary @/tmp/airtable-body.json)
          fi
          echo "airtable_setting_http=$code"
          test "$code" -ge 200 -a "$code" -lt 300
          jq -e '.id|startswith("rec")' /tmp/airtable-write.json >/dev/null

      - name: Verify authenticated Miami Worker request
        shell: bash
        run: |
          set -euo pipefail
          SECRET=$(tr -d '\r\n' </tmp/miami-tiktok-secret.txt)
          code=$(curl -sS -o /tmp/verify.json -w '%{http_code}' -X POST \
            'https://auth-miami.chicagoshining.com/tiktok/creator-info' \
            -H "X-Pipeline-Secret: $SECRET" \
            -H 'Content-Type: application/json' \
            --data '{}')
          echo "miami_worker_auth_http=$code"
          if jq -e '.error=="Unauthorized"' /tmp/verify.json >/dev/null 2>&1; then
            echo "pipeline_secret_verification=FAILED"
            exit 1
          fi
          test "$code" -ge 200 -a "$code" -lt 300
          echo "pipeline_secret_verification=PASS"
          jq -c '{ok,worker_version:(.worker_version // null),creator_present:((.creator_username // .creator_nickname // "")|length>0)}' /tmp/verify.json

      - name: Destroy transient secrets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for f in /tmp/miami-tiktok-secret.txt /tmp/cf-secret-body.json /tmp/airtable-body.json /tmp/airtable-write.json /tmp/existing.json /tmp/query.txt /tmp/verify.json; do
            if [[ -e "$f" ]]; then shred -u "$f" 2>/dev/null || rm -f "$f"; fi
          done
