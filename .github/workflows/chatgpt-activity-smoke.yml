name: ChatGPT Activity Smoke

on:
  push:
    branches:
      - cursor/ai-activity-logging-fd02

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: POST smoke event
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl -sS -w '\n%{http_code}' -X POST https://tasks.chicagoshining.com/agent-activity/log-event \
            -H 'Content-Type: application/json' \
            -d '{"task_id":1,"agent_id":9,"type":"cursor_action","payload":{"message":"chatgpt handoff smoke"}}')"
          body="$(printf '%s\n' "$result" | sed '$d')"
          code="$(printf '%s\n' "$result" | tail -n 1)"
          echo "HTTP $code"
          echo "$body"
          test "$code" = "200"
          node -e 'const x=JSON.parse(process.argv[1]); if (!x.id) { console.error("missing id"); process.exit(1); } console.log("id=" + x.id);' "$body"
