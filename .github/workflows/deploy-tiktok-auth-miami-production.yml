name: Deploy Miami TikTok Auth Worker

on:
  push:
    branches: [main]
    paths:
      - 'deploy/tiktok-auth-miami-production.txt'

permissions:
  contents: read

concurrency:
  group: tiktok-auth-miami-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-tiktok-auth-miami
      WRANGLER_VERSION: 4.123.0
    steps:
      - uses: actions/checkout@v6

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          cp apps/tiktok-auth-miami/worker.js /tmp/miami-worker.mjs
          node --check /tmp/miami-worker.mjs
          grep -q 'PIPELINE_SECRET_SHA256' apps/tiktok-auth-miami/worker.js
          grep -q 'fingerprintMatch' apps/tiktok-auth-miami/worker.js

      - name: Capture current live version and bindings
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$API/deployments" -H "$AUTH" -o /tmp/deployments-before.json
          PREV=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/deployments-before.json)
          printf '%s' "$PREV" >/tmp/previous-version.txt
          curl -fsS "$API/versions/$PREV" -H "$AUTH" -o /tmp/version-before.json
          jq -e '.success==true' /tmp/version-before.json >/dev/null
          jq -c '[.result.resources.bindings[]?|{name,type}]|sort_by(.name)' /tmp/version-before.json >/tmp/bindings-before.json
          jq -e 'map(.name)|index("TIKTOK_AUTH")!=null and index("TIKTOK_CLIENT_KEY")!=null and index("TIKTOK_CLIENT_SECRET")!=null and index("TIKTOK_MAKE_SHARED_SECRET")!=null and index("TIKTOK_OAUTH_STATE_SECRET")!=null' /tmp/bindings-before.json >/dev/null
          echo "baseline_binding_contract=PASS"

      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/wrangler-miami
          cd /tmp/wrangler-miami
          npm init -y >/dev/null 2>&1
          npm install --no-save "wrangler@$WRANGLER_VERSION" >/dev/null
          test "$(./node_modules/.bin/wrangler --version | tr -d '\r\n')" = "$WRANGLER_VERSION"

      - name: Deploy source preserving existing secrets and vars
        shell: bash
        run: |
          set -euo pipefail
          /tmp/wrangler-miami/node_modules/.bin/wrangler deploy \
            --config apps/tiktok-auth-miami/wrangler.jsonc \
            --keep-vars \
            --message "Miami TikTok pipeline auth alignment ${GITHUB_SHA}" \
            >/tmp/deploy.log 2>&1

      - name: Verify bindings and health
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          NEW=""
          for i in $(seq 1 10); do
            curl -fsS "$API/deployments" -H "$AUTH" -o /tmp/deployments-after.json
            NEW=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/deployments-after.json)
            [[ "$NEW" != "$(cat /tmp/previous-version.txt)" ]] && break
            sleep 2
          done
          test -n "${NEW:-}"
          curl -fsS "$API/versions/$NEW" -H "$AUTH" -o /tmp/version-after.json
          jq -c '[.result.resources.bindings[]?|{name,type}]|sort_by(.name)' /tmp/version-after.json >/tmp/bindings-after.json
          if ! cmp -s /tmp/bindings-before.json /tmp/bindings-after.json; then
            echo "binding contract changed; rolling back" >&2
            PREV=$(cat /tmp/previous-version.txt)
            cat >/tmp/rollback.json <<EOF
          {"strategy":"percentage","versions":[{"version_id":"$PREV","percentage":100}],"annotations":{"workers/message":"Rollback Miami TikTok auth deploy after binding drift"}}
          EOF
            curl -fsS -X POST "$API/deployments?force=true" -H "$AUTH" -H 'Content-Type: application/json' --data-binary @/tmp/rollback.json >/tmp/rollback-result.json
            exit 1
          fi
          code=000
          for i in $(seq 1 10); do
            code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' 'https://auth-miami.chicagoshining.com/health' || true)
            [[ "$code" == "200" ]] && jq -e '.ok==true' /tmp/health.json >/dev/null 2>&1 && break
            sleep 2
          done
          test "$code" = "200"
          jq -e '.ok==true' /tmp/health.json >/dev/null
          echo "miami_tiktok_worker_deploy=PASS"

      - name: Upload sanitized deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miami-tiktok-auth-${{ github.run_id }}
          path: |
            /tmp/bindings-before.json
            /tmp/bindings-after.json
            /tmp/health.json
          if-no-files-found: ignore
          retention-days: 14
