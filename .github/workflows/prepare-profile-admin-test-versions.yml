name: Align Studio Release Regression Cache Expectations

on:
  push:
    branches:
      - feature/profile-admin-creative-guidance-20261018
    paths:
      - '.github/workflows/prepare-profile-admin-test-versions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/profile-admin-creative-guidance-20261018
          persist-credentials: true
      - name: Match regression release assertions to UI 0.6.719
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          replacements = [
              ('0.6.718-factory-toggle-collapse', '0.6.719-profile-creative-guidance'),
              (r'0\.6\.718-factory-toggle-collapse', r'0\.6\.719-profile-creative-guidance'),
              ('0.6.718', '0.6.719'),
              (r'0\.6\.718', r'0\.6\.719'),
          ]
          changed = []
          for path in Path('apps/studio-web').rglob('*.test.mjs'):
              before = path.read_text(encoding='utf-8')
              after = before
              for original, updated in replacements:
                  after = after.replace(original, updated)
              if before != after:
                  path.write_text(after, encoding='utf-8')
                  changed.append(str(path))
          if len(changed) < 10:
              raise SystemExit('Expected at least 10 release assertion references; found ' + str(len(changed)))
          print('Updated release assertions in', len(changed), 'test modules')
          for path in changed:
              print('updated', path)
          PY
          node apps/studio-web/ui-release-contract.mjs
          node --test apps/studio-web/ui-release-contract.test.mjs apps/studio-web/factory-desk.test.mjs apps/studio-web/factory-batch-quality-agent.test.mjs apps/studio-web/profile-admin-creative.test.mjs
      - name: Commit only assertion version updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u apps/studio-web
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Align existing Studio tests with UI 0.6.719 release"
          git push origin HEAD:feature/profile-admin-creative-guidance-20261018
