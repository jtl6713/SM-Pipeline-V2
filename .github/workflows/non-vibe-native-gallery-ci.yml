name: Non-Vibe Native Gallery Foundation CI

on:
  pull_request:
    paths:
      - 'apps/studio-api/rendering-review-gallery-*'
      - 'apps/studio-api/factory-correction-branding-preflight.*'
      - 'services/pipeline-runner/rendering_review/gallery_*'
      - 'services/pipeline-runner/rendering_review/profile_watermark.py'
      - 'services/pipeline-runner/tests/test_rendering_review_gallery_*'
      - 'services/pipeline-runner/tests/test_rendering_review_profile_watermark.py'
      - '.github/workflows/non-vibe-native-gallery-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gallery artifact and original source verification
        run: |
          node --check apps/studio-api/rendering-review-gallery-artifacts.mjs
          node --check apps/studio-api/rendering-review-gallery-source.mjs
          node --check apps/studio-api/factory-correction-branding-preflight.mjs
          node --test apps/studio-api/rendering-review-gallery-artifacts.test.mjs apps/studio-api/rendering-review-gallery-source.test.mjs apps/studio-api/factory-correction-branding-preflight.test.mjs

  gallery-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native-image requirements
        run: python -m pip install --disable-pip-version-check -r services/pipeline-runner/requirements.txt
      - name: Isolated gallery generation, branding and Drive evidence
        env:
          PYTHONPATH: services/pipeline-runner
        run: |
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_gallery_attempt.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_gallery_media_io.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_profile_watermark.py' -v
