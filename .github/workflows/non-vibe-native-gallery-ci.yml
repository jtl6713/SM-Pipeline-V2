name: Non-Vibe Native Gallery Foundation CI

on:
  pull_request:
    paths:
      - 'apps/studio-api/rendering-review-gallery-*'
      - 'apps/studio-api/native-gallery-job-airtable*'
      - 'apps/studio-api/native-gallery-generation-http*'
      - 'apps/studio-api/native-gallery-job-claim*'
      - 'apps/studio-api/native-gallery-launch-ledger*'
      - 'apps/studio-api/native-gallery-hold-enrollment*'
      - 'apps/studio-api/native-gallery-manifest-commit*'
      - 'apps/studio-api/native-gallery-revision-readback*'
      - 'apps/studio-api/native-gallery-preview*'
      - 'apps/studio-api/native-gallery-route-gate*'
      - 'apps/studio-api/native-gallery-creative-decision*'
      - 'apps/studio-api/native-gallery-private-manifest*'
      - 'apps/studio-api/native-gallery-release-gate*'
      - 'apps/studio-api/factory-correction-*.mjs'
      - 'apps/studio-web/assets/factory-desk.js'
      - 'apps/studio-web/assets/factory-layout-0680.css'
      - 'apps/studio-web/index.html'
      - 'apps/studio-web/factory-gallery-inventory-preview.test.mjs'
      - 'apps/studio-api/worker.js'
      - 'services/pipeline-runner/rendering_review/gallery_*'
      - 'services/pipeline-runner/rendering_review/profile_watermark.py'
      - 'services/pipeline-runner/tests/test_rendering_review_gallery_*'
      - 'services/pipeline-runner/tests/test_rendering_review_profile_watermark.py'
      - 'services/pipeline-runner/tests/test_native_gallery_shared_watermark.py'
      - 'services/pipeline-runner/tests/test_native_gallery_source_verification.py'
      - 'services/pipeline-runner/tests/test_native_gallery_source_operations.py'
      - 'services/pipeline-runner/tests/test_native_gallery_review_transition.py'
      - 'services/pipeline-runner/rendering_review/gallery_review_transition.py'
      - 'services/pipeline-runner/tests/test_native_gallery_authoritative.py'
      - 'services/pipeline-runner/tests/test_native_gallery_preflight_http.py'
      - 'services/pipeline-runner/tests/test_native_gallery_claim_client.py'
      - 'services/pipeline-runner/tests/test_native_gallery_claim_http.py'
      - 'services/pipeline-runner/rendering_review/native_gallery_launch_client.py'
      - 'services/pipeline-runner/rendering_review/native_gallery_launch_http.py'
      - 'services/pipeline-runner/tests/test_native_gallery_launch_client.py'
      - 'services/pipeline-runner/tests/test_native_gallery_launch_http.py'
      - 'services/pipeline-runner/tests/test_native_gallery_branding_pixels.py'
      - 'services/pipeline-runner/tests/test_native_gallery_revised_verify.py'
      - 'services/pipeline-runner/tests/test_native_gallery_revised_http.py'
      - 'services/pipeline-runner/tests/test_native_gallery_preview_http.py'
      - 'services/pipeline-runner/app.py'
      - 'services/pipeline-runner/rendering_review/native_gallery_execute_http.py'
      - 'services/pipeline-runner/rendering_review/native_gallery_c5c6_executor.py'
      - 'services/pipeline-runner/rendering_review/native_gallery_rights_registration.py'
      - 'services/pipeline-runner/rendering_review/native_gallery_rights_policy.py'
      - 'services/pipeline-runner/tests/test_native_gallery_execute_http.py'
      - 'services/pipeline-runner/tests/test_native_gallery_rights_registration.py'
      - 'services/pipeline-runner/tests/test_native_gallery_rights_policy.py'
      - 'services/pipeline-runner/tests/test_native_gallery_pinned_generator.py'
      - 'services/pipeline-runner/rendering_review/native_gallery_auto_execute.py'
      - 'services/pipeline-runner/tests/test_native_gallery_auto_execute.py'
      - 'services/pipeline-runner/carousel/image_gen.py'
      - 'services/pipeline-runner/tests/test_native_gallery_c5c6_executor.py'
      - 'services/pipeline-runner/rendering_review/gallery_source_operations.py'
      - '.github/workflows/non-vibe-native-gallery-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gallery-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gallery artifact and original source verification
        run: |
          node --check apps/studio-api/native-gallery-job-airtable.mjs
          node --check apps/studio-api/native-gallery-generation-http.mjs
          node --check apps/studio-api/native-gallery-job-claim.mjs
          node --check apps/studio-api/native-gallery-launch-ledger.mjs
          node --check apps/studio-api/native-gallery-hold-enrollment.mjs
          node --check apps/studio-api/native-gallery-manifest-commit.mjs
          node --check apps/studio-api/native-gallery-revision-readback.mjs
          node --check apps/studio-api/native-gallery-preview.mjs
          node --check apps/studio-api/native-gallery-route-gate.mjs
          node --check apps/studio-api/native-gallery-creative-decision.mjs
          node --check apps/studio-api/native-gallery-private-manifest.mjs
          node --check apps/studio-api/native-gallery-release-gate.mjs
          node --check apps/studio-api/rendering-review-gallery-artifacts.mjs
          node --check apps/studio-api/rendering-review-gallery-source.mjs
          node --check apps/studio-api/rendering-review-gallery-inventory.mjs
          node --check apps/studio-api/rendering-review-gallery-inventory-http.mjs
          node --check apps/studio-api/rendering-review-gallery-selection-preview.mjs
          node --check apps/studio-api/rendering-review-gallery-byte-preflight.mjs
          node --check apps/studio-api/rendering-review-gallery-lifecycle.mjs
          node --check apps/studio-api/rendering-review-gallery-status-http.mjs
          node --check apps/studio-api/factory-correction-branding-preflight.mjs
          node --test apps/studio-api/native-gallery-route-gate.test.mjs
          node --test apps/studio-api/native-gallery-job-airtable.test.mjs apps/studio-api/native-gallery-generation-http.test.mjs apps/studio-api/native-gallery-job-claim.test.mjs apps/studio-api/native-gallery-launch-ledger.test.mjs apps/studio-api/native-gallery-hold-enrollment.test.mjs apps/studio-api/native-gallery-manifest-commit.test.mjs apps/studio-api/native-gallery-revision-readback.test.mjs apps/studio-api/native-gallery-preview.test.mjs apps/studio-api/native-gallery-creative-decision.test.mjs apps/studio-api/native-gallery-private-manifest.test.mjs apps/studio-api/native-gallery-release-gate.test.mjs
          node --test apps/studio-api/rendering-review-gallery-artifacts.test.mjs apps/studio-api/rendering-review-gallery-source.test.mjs apps/studio-api/rendering-review-gallery-inventory.test.mjs apps/studio-api/rendering-review-gallery-inventory-http.test.mjs apps/studio-api/rendering-review-gallery-selection-preview.test.mjs apps/studio-api/rendering-review-gallery-lifecycle.test.mjs apps/studio-api/rendering-review-gallery-status-http.test.mjs apps/studio-api/rendering-review-gallery-byte-preflight.test.mjs apps/studio-api/factory-correction-branding-preflight.test.mjs

  factory-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Profile-scoped Factory matching, durable batch and capability safety
        run: |
          node --test apps/studio-api/factory-correction-authority.test.mjs apps/studio-api/factory-correction-batch.test.mjs apps/studio-api/factory-correction-receipts.test.mjs apps/studio-api/factory-correction-render-capability.test.mjs apps/studio-api/factory-correction-selection.test.mjs
          node --check apps/studio-web/assets/factory-desk.js
          node --test apps/studio-web/factory-gallery-inventory-preview.test.mjs apps/studio-web/factory-review-feedback.test.mjs

  gallery-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native-image requirements
        run: python -m pip install --disable-pip-version-check -r services/pipeline-runner/requirements.txt
      - name: Isolated gallery generation, branding and Drive evidence
        env:
          PYTHONPATH: services/pipeline-runner
        run: |
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_gallery_attempt.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_gallery_media_io.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_profile_watermark.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_shared_watermark.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_source_verification.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_source_operations.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_review_transition.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_authoritative.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_preflight_http.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_claim_client.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_claim_http.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_launch_client.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_launch_http.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_branding_pixels.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_revised_verify.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_revised_http.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_preview_http.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_rights_registration.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_rights_policy.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_pinned_generator.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_auto_execute.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_execute_http.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_native_gallery_c5c6_executor.py' -v
