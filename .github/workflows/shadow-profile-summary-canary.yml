name: Shadow Profile Summary Canary

on:
  workflow_dispatch:
    inputs:
      start_full_reconcile:
        description: 'Start one operator-authorized full Airtable reconciliation'
        required: false
        type: boolean
        default: false
      confirmation:
        description: 'Enter SHADOW-PROFILE-SUMMARY to allow reconcile or parity'
        required: true
        type: string
        default: ''
      measure_samples:
        description: 'Timed GET samples per path'
        required: false
        type: string
        default: '12'

permissions:
  contents: read

concurrency:
  group: chicagoshining-studio-shadow-summary-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      VERIFY_BRIDGE: chicagoshining-studio-shadow-verify
    steps:
      - uses: actions/checkout@v6

      - name: Refuse Home/refill cutover and require confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "SHADOW-PROFILE-SUMMARY"
          echo "shadow_canary_scope=no_home_or_refill_read_cutover"

      - name: Upload one-time service-binding verify bridge
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )
          printf '%s' "$TOKEN" >/tmp/verify-token.txt
          cat >/tmp/verify-worker.js <<EOF
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              const overview = url.pathname === "/$TOKEN/overview";
              const overviewRefresh = url.pathname === "/$TOKEN/overview-refresh";
              const overviewStatus = url.pathname === "/$TOKEN/overview-status";
              const summary = url.pathname === "/$TOKEN/summary";
              const summaryReconcile = url.pathname === "/$TOKEN/summary-reconcile";
              const summaryStatus = url.pathname === "/$TOKEN/summary-status";
              if (!overview && !overviewRefresh && !overviewStatus && !summary && !summaryReconcile && !summaryStatus) return new Response("Not found", {status:404});
              const generation = String(url.searchParams.get("generation") || "");
              const path = summaryReconcile ? "/api/profiles/overview/summary/reconcile"
                : summaryStatus ? "/api/profiles/overview/summary/status"
                : summary ? "/api/profiles/overview/summary"
                : overviewRefresh ? "/api/profiles/overview/refresh"
                : overviewStatus ? "/api/profiles/overview/refresh-status"
                : "/api/profiles/overview" + (generation ? "?min_generation=" + encodeURIComponent(generation) : "");
              const method = (summaryReconcile || overviewRefresh) ? "POST" : "GET";
              const headers = {"Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com","Origin":"https://studio.chicagoshining.com","Accept":"application/json"};
              if (summaryReconcile || overviewRefresh) headers["Content-Type"] = "application/json";
              const internal = new Request("https://studio.chicagoshining.com" + path, {
                method,
                headers,
                body: (summaryReconcile || overviewRefresh) ? "{}" : undefined,
              });
              const started = Date.now();
              const response = await env.STUDIO_API.fetch(internal);
              const text = await response.text();
              return new Response(text, {status:response.status,headers:{"Content-Type":"application/json","Cache-Control":"no-store","X-Shadow-Elapsed-Ms":String(Date.now()-started)}});
            }
          };
          EOF
          cat >/tmp/verify-metadata.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF
          node --check /tmp/verify-worker.js
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$API_ROOT/workers/scripts/$VERIFY_BRIDGE" -H "$AUTH" >/dev/null || true
          code=$(curl -sS -o /tmp/verify-upload.json -w '%{http_code}' -X PUT "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/content" -H "$AUTH" \
            -F 'metadata=@/tmp/verify-metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/verify-worker.js;type=application/javascript+module;filename=worker.js')
          test "$code" -ge 200 -a "$code" -lt 300
          jq -e '.success==true' /tmp/verify-upload.json >/dev/null
          curl -fsS -X POST "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/subdomain" -H "$AUTH" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' >/tmp/verify-subdomain.json
          jq -e '.success==true and .result.enabled==true' /tmp/verify-subdomain.json >/dev/null

      - name: Authoritative Home snapshot, optional reconcile, shadow parity and timings
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$API_ROOT/workers/subdomain" -H "$AUTH" -o /tmp/account-subdomain.json
          SUBDOMAIN=$(jq -er '.result.subdomain' /tmp/account-subdomain.json)
          TOKEN=$(cat /tmp/verify-token.txt)
          BASE="https://$VERIFY_BRIDGE.$SUBDOMAIN.workers.dev/$TOKEN"
          for i in $(seq 1 20); do
            CODE=$(curl -sS --max-time 60 -o /tmp/overview.json -D /tmp/overview.hdr -w '%{http_code}' "$BASE/overview" || true)
            if [[ "$CODE" == "200" ]] && jq -e '.ok==true and (.records|length)>=4' /tmp/overview.json >/dev/null; then
              break
            fi
            sleep 3
          done
          test "$CODE" = "200"
          jq -e '.ok==true and (.records|length)>=4' /tmp/overview.json >/dev/null
          cp /tmp/overview.json /tmp/overview-before.json
          BEFORE_AT=$(jq -r '.snapshot_at // 0' /tmp/overview-before.json)
          BEFORE_GENERATION=$(jq -r '.snapshot_generation // ""' /tmp/overview-before.json)

          if [[ "${{ inputs.start_full_reconcile }}" == "true" ]]; then
            CODE=$(curl -sS --max-time 900 -o /tmp/reconcile-start.json -w '%{http_code}' -X POST "$BASE/summary-reconcile" || true)
            echo "reconcile_start_http=$CODE"
            cat /tmp/reconcile-start.json
            curl -sS --max-time 60 "$BASE/summary-status" -o /tmp/summary-status.json || true
            cat /tmp/summary-status.json || true
            if [[ "$CODE" == "200" ]]; then
              jq -e '.ok==true and .read_cutover_enabled==false and (.completed==true or .started==true)' /tmp/reconcile-start.json >/dev/null
            elif [[ "$CODE" == "503" ]]; then
              echo "reconcile reported a fail-closed error" >&2
              exit 1
            else
              test "$CODE" = "200"
            fi
            echo "Waiting 15s for Airtable cooling after the sequential shadow scan"
            sleep 15

            ACCEPTED=0
            for attempt in 1 2 3 4 5 6; do
              CODE=$(curl -sS --max-time 60 -o /tmp/overview-refresh-start.json -w '%{http_code}' -X POST "$BASE/overview-refresh" || true)
              STATUS=$(jq -r '.refresh.status // .status // ""' /tmp/overview-refresh-start.json 2>/dev/null || true)
              if [[ "$CODE" =~ ^20[02]$ ]] && [[ "$STATUS" == "refreshing" || "$STATUS" == "completed" ]]; then
                ACCEPTED=1
                break
              fi
              START_ERROR=$(jq -r '.error // .refresh.error // ""' /tmp/overview-refresh-start.json 2>/dev/null || true)
              if [[ "$STATUS" == "cooling_down" || "$CODE" == "429" || "$START_ERROR" == *"cooling down"* ]]; then
                RETRY_MS=$(jq -r '.refresh.retry_after_ms // .refresh.cooldown_remaining_ms // 8000' /tmp/overview-refresh-start.json)
                SLEEP_SECS=$(( (RETRY_MS + 999) / 1000 ))
                if (( SLEEP_SECS < 3 )); then SLEEP_SECS=3; fi
                if (( SLEEP_SECS > 20 )); then SLEEP_SECS=20; fi
                echo "Overview refresh cooling down http=$CODE status=$STATUS; sleep ${SLEEP_SECS}s" >&2
                sleep "$SLEEP_SECS"
                continue
              fi
              echo "Overview refresh start failed http=$CODE status=$STATUS" >&2
              cat /tmp/overview-refresh-start.json >&2 || true
              exit 1
            done
            test "$ACCEPTED" = "1"

            COMPLETE=0
            BUDGET_RETRIES=0
            for attempt in $(seq 1 90); do
              curl -fsS --max-time 60 "$BASE/overview-status" -o /tmp/overview-refresh-status.json
              STATUS=$(jq -r '.refresh.status // .status // ""' /tmp/overview-refresh-status.json)
              if [[ "$STATUS" == "completed" ]]; then
                COMPLETE=1
                break
              fi
              if [[ "$STATUS" == "failed" ]]; then
                ERROR=$(jq -r '.refresh.error // ""' /tmp/overview-refresh-status.json)
                if [[ "$ERROR" == *"overview-force-build budget"* || "$ERROR" == *"overview-force-resolve budget"* || "$ERROR" == *"cooling down"* ]] && (( BUDGET_RETRIES < 3 )); then
                  BUDGET_RETRIES=$((BUDGET_RETRIES + 1))
                  echo "Overview force refresh hit budget (retry $BUDGET_RETRIES/3)" >&2
                  sleep 12
                  curl -sS --max-time 60 -o /tmp/overview-refresh-start.json -w '%{http_code}' -X POST "$BASE/overview-refresh" >/dev/null || true
                  sleep 8
                  continue
                fi
                echo "Overview force refresh failed; cannot claim Home/shadow parity against a stale cache" >&2
                cat /tmp/overview-refresh-status.json >&2 || true
                exit 1
              fi
              sleep 2
            done
            test "$COMPLETE" = "1"
            GENERATION=$(jq -er '.refresh.snapshot_generation' /tmp/overview-refresh-status.json)
            SNAPSHOT_AT=$(jq -er '.refresh.snapshot_at' /tmp/overview-refresh-status.json)
            jq -e '.refresh.component_status.outputs=="completed" and .refresh.component_status.ideas=="completed"' /tmp/overview-refresh-status.json >/dev/null
            test -n "$GENERATION"
            test "$GENERATION" != "$BEFORE_GENERATION"
            test "$SNAPSHOT_AT" -gt "$BEFORE_AT"
            curl -fsS --max-time 60 "$BASE/overview?generation=$GENERATION" -o /tmp/overview.json
            jq -e --arg generation "$GENERATION" --argjson at "$SNAPSHOT_AT" '
              .ok==true
              and .snapshot_generation==$generation
              and .snapshot_at==$at
              and (.records|length)>=4
            ' /tmp/overview.json >/dev/null
          fi

          READY=0
          for attempt in $(seq 1 80); do
            CODE=$(curl -sS --max-time 60 -o /tmp/summary.json -D /tmp/summary.hdr -w '%{http_code}' "$BASE/summary" || true)
            if [[ "$CODE" == "200" ]] && jq -e '.ok==true and .source=="durable-profile-summary" and (.records|length)==4 and .degraded!=true' /tmp/summary.json >/dev/null; then
              READY=1
              break
            fi
            echo "summary_wait=$attempt http=$CODE reason=$(jq -r '.reason // .error // empty' /tmp/summary.json 2>/dev/null || true)"
            sleep 8
          done
          test "$READY" = "1"

          echo "$BASE" >/tmp/base-url.txt
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          base=Path('/tmp/base-url.txt').read_text().strip()
          cities=('Chicago','New York','Los Angeles','Miami')
          def row_key(row):
              return str(row.get('city_label') or row.get('name') or row.get('id'))
          def metrics(row):
              return {
                  'approval': int(row.get('approval') or 0),
                  'ideas': int(row.get('ideas') or 0),
                  'manual': int(row.get('manual') or 0),
                  'failed': int(row.get('failed') or 0),
                  'overdue_unpublished': int(row.get('overdue_unpublished') or 0),
                  'scheduled': {
                      name: int((row.get('scheduled') or {}).get(name) or 0)
                      for name in ('Facebook','Instagram','TikTok','YouTube')
                  },
              }
          def load(path):
              return json.loads(Path(path).read_text())
          def pull(url, dest):
              req=urllib.request.Request(url, headers={'Accept':'application/json'})
              with urllib.request.urlopen(req, timeout=60) as res:
                  body=res.read()
              Path(dest).write_bytes(body)
              return json.loads(body.decode())
          def compare(overview, summary):
              left={row_key(r): metrics(r) for r in overview['records']}
              right={row_key(r): metrics(r) for r in summary['records']}
              matched=[]
              mismatches=[]
              for city in cities:
                  l=next((v for k,v in left.items() if city.lower() in k.lower()), None)
                  r=next((v for k,v in right.items() if city.lower() in k.lower()), None)
                  if l is None or r is None:
                      mismatches.append({'city':city,'error':'missing'})
                      continue
                  item={'city':city,'authoritative':l,'shadow':r,'equal':l==r}
                  matched.append(item)
                  if l!=r:
                      mismatches.append(item)
              return matched, mismatches
          overview=load('/tmp/overview.json')
          summary=load('/tmp/summary.json')
          matched, mismatches = compare(overview, summary)
          for attempt in range(1, 7):
              if not mismatches:
                  break
              print('parity_retry='+str(attempt)+' mismatches='+json.dumps([{k:x.get(k) for k in ('city','authoritative','shadow','error') if k in x} for x in mismatches]))
              time.sleep(3)
              summary=pull(base+'/summary', '/tmp/summary.json')
              matched, mismatches = compare(overview, summary)
          Path('/tmp/shadow-parity.json').write_text(json.dumps({
              'ok': not mismatches,
              'summary_version':summary.get('version'),
              'last_reconciled_at':summary.get('last_reconciled_at'),
              'read_source':summary.get('source'),
              'cities':matched,
              'mismatches':mismatches,
          },indent=2))
          if mismatches:
              raise SystemExit('Parity mismatch: '+json.dumps(mismatches))
          print('shadow_parity=PASS cities=4 version='+str(summary.get('version')))
          PY

          echo "$BASE" >/tmp/base-url.txt
          python - <<'PY'
          import json, time, urllib.request
          from pathlib import Path
          base=Path('/tmp/base-url.txt').read_text().strip()
          samples=int("${{ inputs.measure_samples }}".strip() or "12")
          def timed(path):
              times=[]
              errors=0
              for _ in range(samples):
                  req=urllib.request.Request(base+path, headers={'Accept':'application/json'})
                  started=time.perf_counter()
                  try:
                      with urllib.request.urlopen(req, timeout=60) as res:
                          body=json.loads(res.read().decode())
                          elapsed=int((time.perf_counter()-started)*1000)
                          header=res.headers.get('X-Shadow-Elapsed-Ms')
                          if header and header.isdigit():
                              elapsed=int(header)
                          if body.get('ok') is True:
                              times.append(elapsed)
                          else:
                              errors += 1
                  except Exception:
                      errors += 1
              times.sort()
              def pct(p):
                  if not times: return None
                  idx=min(len(times)-1, max(0, int(round((p/100)*(len(times)-1)))))
                  return times[idx]
              return {
                  'samples':samples,
                  'ok':len(times),
                  'errors':errors,
                  'p50_ms':pct(50),
                  'p95_ms':pct(95),
                  'max_ms': max(times) if times else None,
              }
          report={
              'authoritative_home': timed('/overview'),
              'shadow_summary': timed('/summary'),
              'note':'Service-binding measurements. Home production reads remain Airtable/R2 authoritative.',
          }
          Path('/tmp/shadow-timings.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
          jq -e '.ok==true and (.cities|length)==4' /tmp/shadow-parity.json >/dev/null
          echo "shadow_home_reads_remain_off=true"

      - name: Delete verify bridge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          code=$(curl -sS -o /tmp/verify-delete.json -w '%{http_code}' -X DELETE "$API_ROOT/workers/scripts/$VERIFY_BRIDGE" -H "$AUTH")
          if [[ "$code" -ge 200 && "$code" -lt 300 ]]; then jq -e '.success==true' /tmp/verify-delete.json >/dev/null || true; elif [[ "$code" != "404" ]]; then exit 1; fi

      - name: Upload sanitized shadow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadow-profile-summary-${{ github.run_id }}
          path: |
            /tmp/overview.json
            /tmp/overview-before.json
            /tmp/overview-refresh-status.json
            /tmp/summary.json
            /tmp/summary-status.json
            /tmp/reconcile-start.json
            /tmp/shadow-parity.json
            /tmp/shadow-timings.json
          if-no-files-found: ignore
          retention-days: 30
