name: Issue 2374 Factory Protected Media Rework Visibility
on:
  pull_request:
    paths:
      - 'apps/studio-api/factory-protected-media-rework.mjs'
      - 'apps/studio-api/factory-protected-media-rework.test.mjs'
      - 'apps/studio-api/supabase-pipeline-reads.mjs'
      - 'apps/studio-api/worker-functions-02.mjs'
      - 'apps/studio-api/factory-supabase-only-read.test.mjs'
      - 'apps/studio-api/worker-functions-04.mjs'
      - 'apps/studio-api/factory-desk.mjs'
      - 'apps/studio-web/assets/factory-desk.js'
      - '.github/workflows/issue2374-factory-rework-visibility-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/studio-api/factory-protected-media-rework.mjs'
      - 'apps/studio-api/factory-protected-media-rework.test.mjs'
      - 'apps/studio-api/supabase-pipeline-reads.mjs'
      - 'apps/studio-api/worker-functions-02.mjs'
      - 'apps/studio-api/factory-supabase-only-read.test.mjs'
      - 'apps/studio-api/worker-functions-04.mjs'
      - 'apps/studio-api/factory-desk.mjs'
      - 'apps/studio-web/assets/factory-desk.js'
      - '.github/workflows/issue2374-factory-rework-visibility-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-factory-rework-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse all changed JS modules without bundle-time secrets
        run: |
          set -euo pipefail
          for file in             apps/studio-api/factory-protected-media-rework.mjs             apps/studio-api/supabase-pipeline-reads.mjs             apps/studio-api/worker-functions-04.mjs             apps/studio-api/factory-desk.mjs             apps/studio-web/assets/factory-desk.js; do
            node --check "$file"
          done
      - name: Exact marker, owner and publish-hold guard tests
        run: node --test apps/studio-api/factory-protected-media-rework.test.mjs
      - name: Production Supabase Factory no-Airtable fallback behavior
        run: |
          node --check apps/studio-api/worker-functions-02.mjs
          node --test apps/studio-api/factory-supabase-only-read.test.mjs
      - name: Existing Factory desk and client eligibility regression
        run: |
          node --test apps/studio-api/factory-desk.test.mjs
          node --test apps/studio-web/factory-desk.test.mjs
          node --test apps/studio-web/factory-held-creative-review.test.mjs
      - name: No unsafe source mutation or publishing in rework detector
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('apps/studio-api/factory-protected-media-rework.mjs').read_text()
          required=[
            'Studio_Overdue_Preflight_Repair_20261120',
            'row.do_not_publish === true',
            'row.auto_publish_enabled === false',
            'row.publish_retry_eligible === false',
            'fields.Do_Not_Publish === true',
            'can_approve: false',
            'can_retry: false',
            'can_publish: false',
          ]
          for x in required: assert x in s, x
          for forbidden in ('fetch(', 'supabaseRest(', 'airtableFetch(',
                            'media_publish', 'Retry_Eligible: true'):
              assert forbidden not in s, forbidden
          print('issue2374_factory_rework_readonly_gate=PASS')
          PY
