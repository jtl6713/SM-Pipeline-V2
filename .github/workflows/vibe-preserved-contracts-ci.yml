name: Vibe Isolated Renderer Integration CI (no live writes)
on:
  pull_request:
    paths:
      - 'services/pipeline-runner/rendering_review/vibe_*.py'
      - 'services/pipeline-runner/rendering_review/video_watermark_qa.py'
      - 'services/pipeline-runner/tests/test_rendering_review_vibe_*.py'
      - 'services/pipeline-runner/tests/test_rendering_review_video_watermark_qa.py'
      - 'services/remotion-renderer/**/vibe-*'
      - 'services/remotion-renderer/render-server.js'
      - 'services/remotion-renderer/src/Root.tsx'
      - 'services/remotion-renderer/src/ChicagoShiningPhotoSequence.tsx'
      - '.github/workflows/vibe-preserved-contracts-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserved-vibe-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install --disable-pip-version-check -r services/pipeline-runner/requirements.txt
      - name: Vibe isolated input, validation, media and branding contracts
        env:
          PYTHONPATH: services/pipeline-runner
        run: |
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_vibe_*.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_video_watermark_qa.py' -v
      - name: Vibe Remotion music, branding, timing and renderer syntax
        run: |
          node --check services/remotion-renderer/render-server.js
          node --test services/remotion-renderer/vibe-audio-policy.test.js services/remotion-renderer/profile-watermark-policy.test.js services/remotion-renderer/vibe-review-music-policy.test.js services/remotion-renderer/vibe-review-timing.test.js
      - name: Compile exact Vibe timeline and Remotion bundle
        working-directory: services/remotion-renderer
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit
          npm run build
