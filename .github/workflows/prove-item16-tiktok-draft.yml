name: Prove Item 16 TikTok Draft Contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/prove-item16-tiktok-draft.txt'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Read existing TikTok draft contracts without pulsing Make
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m py_compile repair/scripts/prove-item16-tiktok-draft.py
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:CLOUDFLARE_API_TOKEN \
            -in deploy/credential-envelope/private.pem.enc \
            -out /tmp/key.pem
          base64 -d deploy/credential-envelope/airtable_pat.ciphertext.b64 >/tmp/pat.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/key.pem \
            -in /tmp/pat.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out /tmp/pat.txt
          export AIRTABLE_PAT="$(tr -d '\r\n' </tmp/pat.txt)"
          export ITEM16_EVIDENCE="/tmp/item16-tiktok-draft-proof.json"
          python repair/scripts/prove-item16-tiktok-draft.py
          jq -e '.passed == true and .make_scenario_runs == 0 and .tiktok_drafts_created == 0 and .ttd_orch_pulsed == false and .one_key_one_draft == true and .native_contract_terms.ttd1_refuses_existing_publish_id == true and .native_contract_terms.ttd3_email_sent_fence == true' \
            /tmp/item16-tiktok-draft-proof.json >/dev/null

      - name: Upload sanitized Item 16 TikTok evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item16-tiktok-draft-${{ github.run_id }}
          path: /tmp/item16-tiktok-draft-proof.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Destroy transient credentials
        if: always()
        run: rm -f /tmp/key.pem /tmp/pat.enc /tmp/pat.txt /tmp/item16-tiktok-draft-proof.json
