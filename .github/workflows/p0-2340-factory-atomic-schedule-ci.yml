name: P0 2340 Factory Supabase Atomic MAE Approval CI
on:
  pull_request:
    paths:
      - 'apps/studio-api/factory-supabase-approval.mjs'
      - 'apps/studio-api/factory-supabase-approval.test.mjs'
      - 'apps/studio-api/mae-schedule.mjs'
      - '.github/workflows/p0-2340-factory-atomic-schedule-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/studio-api/factory-supabase-approval.mjs'
      - 'apps/studio-api/factory-supabase-approval.test.mjs'
      - 'apps/studio-api/mae-schedule.mjs'
      - '.github/workflows/p0-2340-factory-atomic-schedule-ci.yml'
permissions:
  contents: read
jobs:
  atomic-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Supabase-only source and schedule syntax
        run: |
          node --check apps/studio-api/factory-supabase-approval.mjs
          node --check apps/studio-api/factory-supabase-approval.test.mjs
          node --check apps/studio-api/mae-schedule.mjs
      - name: Test one-CAS future schedule, profile timezone, duplicate prevention and Factory rules
        run: |
          node --test apps/studio-api/factory-supabase-approval.test.mjs
          node --test apps/studio-api/mae-schedule.test.mjs
