name: Vibe Cut P1 Regression
on:
  pull_request:
    paths:
      - 'apps/studio-api/vibe-cut.mjs'
      - 'apps/studio-api/worker-functions-*.mjs'
      - 'apps/studio-api/vibe-cut-idea-contract.test.mjs'
      - 'apps/studio-web/assets/ez-plan.js'
      - 'apps/studio-web/assets/app-item4-1008.js'
      - 'apps/studio-web/vibe-cut-idea-display.test.mjs'
      - '.github/workflows/vibe-cut-p1-regression.yml'
  push:
    branches: [main]
    paths:
      - 'apps/studio-api/vibe-cut.mjs'
      - 'apps/studio-api/worker-functions-*.mjs'
      - 'apps/studio-web/assets/ez-plan.js'
      - 'apps/studio-web/assets/app-item4-1008.js'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check apps/studio-api/vibe-cut.mjs
          node --check apps/studio-api/worker-functions-01.mjs
          node --check apps/studio-api/worker-functions-02.mjs
          node --check apps/studio-web/assets/ez-plan.js
          node --check apps/studio-web/assets/app-item4-1008.js
      - name: Vibe Cut and nearby photo regression suites
        run: |
          node --test \
            apps/studio-api/vibe-cut-idea-contract.test.mjs \
            apps/studio-api/vibe-cut.test.mjs \
            apps/studio-api/vibe-cut-source-regression.test.mjs \
            apps/studio-api/video-carousel-count-guard.test.mjs \
            apps/studio-api/idea-photo-wait.test.mjs \
            apps/studio-web/vibe-cut-idea-display.test.mjs \
            apps/studio-web/vibe-cut-mode.test.mjs \
            apps/studio-web/ez-aspect-plan.test.mjs \
            apps/studio-web/vibe-cut-large-upload.test.mjs
