name: Verify Item7 R4 Exact Entry Post L15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-item7-r4-exact-entry.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCENARIO_ID: '5556716'
    steps:
      - uses: actions/checkout@v6
      - name: Resolve Make API credentials without logging values
        shell: bash
        run: |
          set -euo pipefail; umask 077
          mkdir -p evidence
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:CLOUDFLARE_API_TOKEN -in deploy/credential-envelope/private.pem.enc -out /tmp/key.pem
          base64 -d deploy/credential-envelope/airtable_pat.ciphertext.b64 >/tmp/pat.enc
          openssl pkeyutl -decrypt -inkey /tmp/key.pem -in /tmp/pat.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -out /tmp/pat.txt
          PAT=$(cat /tmp/pat.txt)
          python - <<'PY' >/tmp/q.txt
          import urllib.parse
          f="OR({Setting_Name}='MAKE_API_TOKEN',{Setting_Name}='MAKE_API_BASE_URL')"
          print(urllib.parse.urlencode([('filterByFormula',f),('fields[]','Setting_Name'),('fields[]','Setting_Value'),('fields[]','Active')]))
          PY
          curl -fsS "https://api.airtable.com/v0/appe33zkZn35yirTL/tblpHPWeEkyJaF7ql?$(cat /tmp/q.txt)" -H "Authorization: Bearer $PAT" -o /tmp/settings.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/settings.json')); vals={r['fields'].get('Setting_Name'):r['fields'].get('Setting_Value') for r in d.get('records',[]) if r.get('fields',{}).get('Active')}
          t=str(vals.get('MAKE_API_TOKEN') or '').strip(); b=str(vals.get('MAKE_API_BASE_URL') or '').strip().rstrip('/')
          if not t or not b: raise SystemExit('Missing active Make API settings')
          open('/tmp/make-token.txt','w').write(t); open('/tmp/make-base.txt','w').write(b)
          PY
      - name: Verify live R4 exact contract after L15
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(cat /tmp/make-token.txt); BASE=$(cat /tmp/make-base.txt)
          curl -fsS "$BASE/scenarios/$SCENARIO_ID" -H "Authorization: Token $TOKEN" -H 'Accept: application/json' -o /tmp/scenario.json
          curl -fsS "$BASE/scenarios/$SCENARIO_ID/blueprint" -H "Authorization: Token $TOKEN" -H 'Accept: application/json' -o /tmp/bp-wrap.json
          curl -fsS "$BASE/scenarios/$SCENARIO_ID/interface" -H "Authorization: Token $TOKEN" -H 'Accept: application/json' -o /tmp/interface.json
          python - <<'PY'
          import json
          def scen(d):
              x=d.get('response',d) if isinstance(d,dict) else {}
              if isinstance(x,dict) and isinstance(x.get('scenario'),dict):x=x['scenario']
              return x if isinstance(x,dict) else {}
          def bp(d):
              x=d.get('response',d) if isinstance(d,dict) else d
              if isinstance(x,dict) and 'blueprint' in x:x=x['blueprint']
              if isinstance(x,str):x=json.loads(x)
              return x
          def find(flow,mid):
              for n in flow if isinstance(flow,list) else []:
                  if str(n.get('id'))==str(mid):return n
                  for r in n.get('routes',[]) if isinstance(n.get('routes'),list) else []:
                      z=find(r.get('flow'),mid)
                      if z:return z
              return None
          def count(flow):
              n=0
              for x in flow if isinstance(flow,list) else []:
                  n+=1
                  for r in x.get('routes',[]) if isinstance(x.get('routes'),list) else []:n+=count(r.get('flow'))
              return n
          s=scen(json.load(open('/tmp/scenario.json'))); b=bp(json.load(open('/tmp/bp-wrap.json'))); m=find(b.get('flow'),1); iw=json.load(open('/tmp/interface.json')); iw=iw.get('response',iw); iw=iw.get('interface',iw) if isinstance(iw,dict) else {}; inputs=iw.get('input',[]) if isinstance(iw,dict) else []
          ev={'scenario_active':s.get('isActive',s.get('active')),'schedule':s.get('scheduling',s.get('schedule')),'hook_id':s.get('hookId',s.get('hook_id')),'module_count':count(b.get('flow')),'module_1_type':m.get('module') if m else None,'module_1_id':(m.get('mapper') or {}).get('id') if m else None,'module_1_base':(m.get('mapper') or {}).get('base') if m else None,'module_1_table':(m.get('mapper') or {}).get('table') if m else None,'module_1_name':((m.get('metadata') or {}).get('designer') or {}).get('name') if m else None,'interface_inputs':[{'name':x.get('name'),'required':x.get('required')} for x in inputs if isinstance(x,dict)]}
          print(json.dumps(ev,indent=2,sort_keys=True)); open('evidence/r4-exact-postflight.json','w').write(json.dumps(ev,indent=2,sort_keys=True))
          expected={'test_run_id','output_record_id','platform_output_id','intended_stage','attempt_number','idempotency_key'}
          assert ev['scenario_active'] is False
          assert ev['schedule']=={'type':'indefinitely','interval':900}
          assert ev['hook_id'] is None
          assert ev['module_count']==16
          assert ev['module_1_type']=='airtable:ActionGetRecord'
          assert ev['module_1_id']=='{{var.input.output_record_id}}'
          assert ev['module_1_base']=='appe33zkZn35yirTL'
          assert ev['module_1_table']=='tblrlPeboBthkplH0'
          assert ev['module_1_name']=='1 - Get Exact Platform Output'
          assert {x['name'] for x in ev['interface_inputs']}==expected
          assert all(x['required'] is False for x in ev['interface_inputs'])
          PY
      - name: Destroy transient credentials
        if: always()
        shell: bash
        run: |
          for f in /tmp/key.pem /tmp/pat.enc /tmp/pat.txt /tmp/make-token.txt /tmp/make-base.txt /tmp/settings.json /tmp/q.txt /tmp/scenario.json /tmp/bp-wrap.json /tmp/interface.json; do [[ ! -e "$f" ]] || shred -u "$f" 2>/dev/null || rm -f "$f"; done
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item7-r4-exact-postflight-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
