name: Issue 2959 Exact 19 Live Preflight (No Approvals)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/issue2959-live-19-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue2959-live-19-preflight
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'jtl6713/SM-Pipeline-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      AUDIT_WORKER: studio-factory-2959-live19-preflight
    steps:
      - name: Run temporary service-binding-only Worker and clean up
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          CODE="$(curl -sS --max-time 20 -o /tmp/factory-existing.json -w '%{http_code}' -H "$AUTH" "$API/workers/scripts/$AUDIT_WORKER/settings")"
          if [[ "$CODE" != "404" ]]; then
            echo "::error::Refusing to overwrite existing audit Worker, HTTP $CODE"
            exit 1
          fi
          OWNED=0
          cleanup() {
            if [[ "$OWNED" == "1" ]]; then
              curl -fsS --max-time 20 -X DELETE -H "$AUTH" "$API/workers/scripts/$AUDIT_WORKER" >/dev/null ||
                echo "::warning::Temporary audit Worker requires cleanup; no production Studio Worker was changed"
            fi
          }
          trap cleanup EXIT
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          cat > /tmp/factory-audit-worker.mjs <<'JS'
          export default {
            async fetch(request,env) {
              const path=new URL(request.url).pathname;
              if (request.method !== "GET" || path !== "/preflight") return new Response("Not found",{status:404});
              if (!env.AUDIT_TOKEN || request.headers.get("Authorization") !== "Bearer " + env.AUDIT_TOKEN) return new Response("Unauthorized",{status:401});
              const headers={"Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com","Origin":"https://studio.chicagoshining.com","Accept":"application/json","Content-Type":"application/json"};
              const groups=[
                ["rectw2pvgnBzK3wCN","recJ8jTynJDxsN0hl","rec9uodYpY4L6BvyQ","recCYflzPH65HdbpS","recyEgGuGKIrJw8Ca","recckY9KlAJkWtXxO","recztl5GuZhhS8dGE","rec1EEHHhPAQmbm9X","reco2npIhDFJmhNSM","recauG5u3gDMDyFN0","recnPrM827psgnJbd","rec17r1eQJmcWl4hy","recKsGoKjLnaHdlpg","recaDRS4GJfkKjNQ3","recnlndGlSR6uWNLR","reckBsz193ABJH2Zj"],
                ["recMG942g1KpH2FkS","recHV6did16UCcqFL","recL7CGkpA6a6tAbr"]
              ];
              const results=[];
              // Exact production read-only route; no start_group, no approval, no claim or scheduling writes.
              for(const [i,ids] of groups.entries()){
                const start=Date.now(), request_id="readonly_2959_preflight_20261125_"+i;
                const response=await env.STUDIO_API.fetch(new Request("https://studio.chicagoshining.com/api/factory/approval-batches",{method:"POST",headers,body:JSON.stringify({action:"validate_group",request_id,record_ids:ids})}));
                const body=await response.json().catch(()=>({error:"Non-JSON response"}));
                const records=Array.isArray(body.records)?body.records:[];
                results.push({http:response.status,elapsed_ms:Date.now()-start,request_id,expected_ids:ids,accepted:body.accepted,read_only:body.read_only,preflight_valid:body.preflight_valid,records:records.map(x=>({id:x.id,output_id:x.output_id,profile_id:x.profile_id,review_updated_at:x.review_updated_at,requires_current_approval:x.requires_current_approval,creative_warnings:x.creative_warnings})),error:String(body.error||"").replace(/https?:\/\/\S+/g,"[url]").slice(0,400)});
              }
              return Response.json({read_only:true,output_count:19,results});
            }
          };
          JS
          # Service binding only. No production R2 binding, Airtable secret,
          # workflow approval mutation, or scheduling credentials in this Worker.
          cat >/tmp/factory-audit-metadata.json <<EOF
          {"main_module":"worker.mjs","compatibility_date":"2026-10-01","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"},{"type":"plain_text","name":"AUDIT_TOKEN","text":"$TOKEN"}]}
          EOF
          PUT="$(curl -sS --max-time 30 -o /tmp/factory-audit-put.json -w '%{http_code}' -X PUT "$API/workers/scripts/$AUDIT_WORKER/content" -H "$AUTH" -F 'metadata=@/tmp/factory-audit-metadata.json;type=application/json' -F 'worker.mjs=@/tmp/factory-audit-worker.mjs;type=application/javascript+module;filename=worker.mjs')"
          if ! [[ "$PUT" =~ ^2[0-9][0-9]$ ]] ||
              ! jq -e '.success==true' /tmp/factory-audit-put.json >/dev/null; then
            echo "::error::Temporary service-binding Worker could not be created (HTTP $PUT)"
            jq -c '{success,errors:[.errors[]?|{code}]}' /tmp/factory-audit-put.json || true
            exit 1
          fi
          OWNED=1
          curl -fsS --max-time 20 -X POST -H "$AUTH" -H 'Content-Type: application/json' "$API/workers/scripts/$AUDIT_WORKER/subdomain" --data '{"enabled":true,"previews_enabled":false}' >/tmp/factory-audit-sub.json
          jq -e '.success==true' /tmp/factory-audit-sub.json >/dev/null
          SUBDOMAIN="$(curl -fsS --max-time 20 -H "$AUTH" "$API/workers/subdomain" | jq -er '.result.subdomain')"
          BASE="https://$AUDIT_WORKER.$SUBDOMAIN.workers.dev"
          echo "::add-mask::$TOKEN"
          HTTP="$(curl -sS --max-time 70 -o /tmp/factory-preflight.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$BASE/preflight" || true)"
          echo "FACTORY_EXACT19_PREFLIGHT_HTTP=$HTTP"
          test "$HTTP" = 200
          jq -e '.read_only==true and .output_count==19 and (.results|length)==2 and all(.results[]; .accepted!=true)' /tmp/factory-preflight.json >/dev/null
          jq -c . /tmp/factory-preflight.json
          jq -e 'all(.results[]; .http==200 and .read_only==true and .preflight_valid==true and ([.records[].id]|sort)==(.expected_ids|sort) and all(.records[]; (.review_updated_at|type)=="string"))' /tmp/factory-preflight.json >/dev/null
          echo "FACTORY_EXACT19_PREFLIGHT=PASS"
      - name: Attach sanitized audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue2959-exact19-live-preflight-${{ github.run_id }}
          path: |
            /tmp/factory-preflight.json
            /tmp/factory-desk.json
            /tmp/factory-claims.json
            /tmp/factory-active.json
            /tmp/factory-completed.json
          if-no-files-found: ignore
          retention-days: 10

