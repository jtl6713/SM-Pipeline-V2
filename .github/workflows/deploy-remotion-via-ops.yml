name: Deploy Remotion via Ops Dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-remotion-via-ops.yml'
      - 'deploy/local-services/Deploy-SMService.ps1'
      - 'services/remotion-renderer/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
      EXPECTED_VERSION: '2026-10-10-accept-before-download'
    steps:
      - name: Authenticate to Ops Dashboard
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            if [[ -z "$candidate" ]]; then
              continue
            fi
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == "200" ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then
              selected="$candidate"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            unauth=$(curl -sS --max-time 20 -o /tmp/catalog-unauth.json -w '%{http_code}' "$BASE/api/catalog" || true)
            echo "ops_dashboard_auth=unavailable http=$unauth"
            exit 3
          fi
          echo "ops_dashboard_auth=PASS"
          {
            echo "token<<EOF"
            echo "$selected"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Restart Remotion (recovery start)
        shell: bash
        env:
          OPS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          code=$(curl -sS --max-time 30 -o /tmp/run.json -w '%{http_code}' \
            -X POST "$BASE/api/run" \
            -H "Authorization: Bearer $OPS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"action":"restart-one","service":"remotion-renderer","confirm":true}' || true)
          if [[ "$code" == "409" ]]; then
            JOB=$(jq -r '.jobId // .job.id // empty' /tmp/run.json)
            echo "ops_dashboard_existing_job=$JOB"
          else
            test "$code" = "202"
            jq -e '.ok==true' /tmp/run.json >/dev/null
            JOB=$(jq -r '.job.id // empty' /tmp/run.json)
          fi
          test -n "$JOB"
          for i in $(seq 1 40); do
            code=$(curl -sS --max-time 20 -o /tmp/job.json -w '%{http_code}' \
              -H "Authorization: Bearer $OPS_TOKEN" "$BASE/api/jobs/$JOB" || true)
            if [[ "$code" == "200" ]]; then
              status=$(jq -r '.job.status // empty' /tmp/job.json)
              echo "ops_restart_status=$status"
              case "$status" in
                ok)
                  jq -c '{ok,job:{id:.job.id,status:.job.status,exitCode:.job.exitCode}}' /tmp/job.json
                  exit 0
                  ;;
                failed)
                  jq -c '{ok,job:{id:.job.id,status:.job.status,exitCode:.job.exitCode,log:.job.log}}' /tmp/job.json
                  echo "restart_failed_continuing=1"
                  exit 0
                  ;;
              esac
            fi
            sleep 5
          done
          echo "ops_restart_timeout_continuing=$JOB"
          exit 0

      - name: Wait for Remotion public health after restart
        id: health_after_restart
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code=$(curl -sS --max-time 20 -o /tmp/remotion-health.json -w '%{http_code}' \
              'https://render.chicagoshining.com/health' || true)
            if [[ "$code" == "200" ]] && jq -e '.ok==true' /tmp/remotion-health.json >/dev/null 2>&1; then
              jq -c '{ok,service,version}' /tmp/remotion-health.json
              version=$(jq -r '.version // empty' /tmp/remotion-health.json)
              echo "up=true" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "waiting_public_health attempt=$i http=$code"
            sleep 5
          done
          echo "up=false" >> "$GITHUB_OUTPUT"
          echo "version=" >> "$GITHUB_OUTPUT"
          echo "remotion_still_down_after_restart=1"

      - name: Sync git checkout on render PC
        if: steps.health_after_restart.outputs.version != env.EXPECTED_VERSION
        continue-on-error: true
        shell: bash
        env:
          OPS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          code=$(curl -sS --max-time 30 -o /tmp/run.json -w '%{http_code}' \
            -X POST "$BASE/api/run" \
            -H "Authorization: Bearer $OPS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"action":"sync","confirm":true}' || true)
          if [[ "$code" == "409" ]]; then
            JOB=$(jq -r '.jobId // .job.id // empty' /tmp/run.json)
          else
            test "$code" = "202"
            jq -e '.ok==true' /tmp/run.json >/dev/null
            JOB=$(jq -r '.job.id // empty' /tmp/run.json)
          fi
          test -n "$JOB"
          for i in $(seq 1 60); do
            code=$(curl -sS --max-time 20 -o /tmp/job.json -w '%{http_code}' \
              -H "Authorization: Bearer $OPS_TOKEN" "$BASE/api/jobs/$JOB" || true)
            if [[ "$code" == "200" ]]; then
              status=$(jq -r '.job.status // empty' /tmp/job.json)
              echo "ops_sync_status=$status"
              case "$status" in
                ok) exit 0 ;;
                failed)
                  jq -c '{ok,job:{id:.job.id,status:.job.status,exitCode:.job.exitCode,log:.job.log}}' /tmp/job.json
                  exit 4
                  ;;
              esac
            fi
            sleep 5
          done
          exit 5

      - name: Deploy Remotion renderer through allowlisted Ops action
        if: steps.health_after_restart.outputs.version != env.EXPECTED_VERSION
        shell: bash
        env:
          OPS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          code=$(curl -sS --max-time 30 -o /tmp/run.json -w '%{http_code}' \
            -X POST "$BASE/api/run" \
            -H "Authorization: Bearer $OPS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"action":"deploy","service":"remotion-renderer","confirm":true}' || true)

          if [[ "$code" == "409" ]]; then
            JOB=$(jq -r '.jobId // .job.id // empty' /tmp/run.json)
            echo "ops_dashboard_existing_job=$JOB"
          else
            test "$code" = "202"
            jq -e '.ok==true' /tmp/run.json >/dev/null
            JOB=$(jq -r '.job.id // empty' /tmp/run.json)
          fi
          test -n "$JOB"

          for i in $(seq 1 120); do
            code=$(curl -sS --max-time 20 -o /tmp/job.json -w '%{http_code}' \
              -H "Authorization: Bearer $OPS_TOKEN" "$BASE/api/jobs/$JOB" || true)
            if [[ "$code" == "200" ]]; then
              status=$(jq -r '.job.status // empty' /tmp/job.json)
              echo "ops_job_status=$status"
              case "$status" in
                ok)
                  jq -c '{ok,job:{id:.job.id,status:.job.status,exitCode:.job.exitCode}}' /tmp/job.json
                  exit 0
                  ;;
                failed)
                  jq -c '{ok,job:{id:.job.id,status:.job.status,exitCode:.job.exitCode,log:.job.log}}' /tmp/job.json
                  # If restart already restored public health, do not fail the whole job on deploy.
                  code2=$(curl -sS --max-time 20 -o /tmp/remotion-health.json -w '%{http_code}' \
                    'https://render.chicagoshining.com/health' || true)
                  if [[ "$code2" == "200" ]] && jq -e '.ok==true' /tmp/remotion-health.json >/dev/null 2>&1; then
                    echo "deploy_failed_but_remotion_healthy=1"
                    jq -c '{ok,service,version}' /tmp/remotion-health.json
                    exit 0
                  fi
                  exit 4
                  ;;
              esac
            fi
            sleep 5
          done
          echo "ops_job_timeout=$JOB"
          exit 5

      - name: Verify Remotion public health
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            code=$(curl -sS --max-time 20 -o /tmp/remotion-health.json -w '%{http_code}' \
              'https://render.chicagoshining.com/health' || true)
            if [[ "$code" == "200" ]] && jq -e '.ok==true' /tmp/remotion-health.json >/dev/null 2>&1; then
              jq -c '{ok,service,version,privateDriveImageLocalization,watermarkLocalization}' /tmp/remotion-health.json
              version=$(jq -r '.version // empty' /tmp/remotion-health.json)
              if [[ "$version" == "$EXPECTED_VERSION" ]]; then
                echo "remotion_version_match=1"
              else
                echo "remotion_version_mismatch expected=$EXPECTED_VERSION actual=$version"
              fi
              exit 0
            fi
            sleep 5
          done
          cat /tmp/remotion-health.json || true
          exit 6

