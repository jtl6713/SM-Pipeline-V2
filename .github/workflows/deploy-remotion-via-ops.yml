name: Deploy Remotion via Ops Dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-remotion-via-ops.yml'
      - 'deploy/local-services/Deploy-SMService.ps1'
      - 'services/remotion-renderer/**'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
      EXPECTED_VERSION: '2026-10-17-visual-voiceover-timeline'
    steps:
      - name: Authenticate to Ops Dashboard
        id: auth
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            if [[ -z "$candidate" ]]; then
              continue
            fi
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == "200" ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then
              selected="$candidate"
              break
            fi
          done
          if [[ -z "$selected" ]]; then
            unauth=$(curl -sS --max-time 20 -o /tmp/catalog-unauth.json -w '%{http_code}' "$BASE/api/catalog" || true)
            echo "ops_dashboard_auth=unavailable http=$unauth"
            exit 3
          fi
          echo "ops_dashboard_auth=PASS"
          {
            echo "token<<EOF"
            echo "$selected"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Sync git checkout on render PC
        shell: bash
        env:
          OPS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          JOB=''
          for attempt in $(seq 1 60); do
            code=$(curl -sS --max-time 30 -o /tmp/run.json -w '%{http_code}' \
              -X POST "$BASE/api/run" \
              -H "Authorization: Bearer $OPS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"action":"sync","confirm":true}' || true)
            if [[ "$code" == "202" ]] && jq -e '.ok==true and .job.action=="sync"' /tmp/run.json >/dev/null 2>&1; then
              JOB=$(jq -r '.job.id // empty' /tmp/run.json)
              echo "ops_sync_fresh_job=$JOB"
              break
            fi
            if [[ "$code" == "409" ]]; then
              ACTIVE=$(jq -r '.jobId // .job.id // "unknown"' /tmp/run.json)
              ACTIVE_ACTION=$(jq -r '.job.action // "unknown"' /tmp/run.json)
              ACTIVE_SERVICE=$(jq -r '.job.service // "none"' /tmp/run.json)
              echo "ops_busy attempt=$attempt active_job=$ACTIVE action=$ACTIVE_ACTION service=$ACTIVE_SERVICE waiting_for_fresh_sync"
              sleep 5
              continue
            fi
            echo "Unable to create fresh Ops sync job http=$code" >&2
            cat /tmp/run.json >&2 || true
            exit 2
          done
          test -n "$JOB"
          for i in $(seq 1 60); do
            code=$(curl -sS --max-time 20 -o /tmp/job.json -w '%{http_code}' \
              -H "Authorization: Bearer $OPS_TOKEN" "$BASE/api/jobs/$JOB" || true)
            if [[ "$code" == "200" ]]; then
              status=$(jq -r '.job.status // empty' /tmp/job.json)
              echo "ops_sync_status=$status"
              case "$status" in
                ok)
                  jq -e '.job.action=="sync"' /tmp/job.json >/dev/null
                  exit 0
                  ;;
                failed)
                  jq -c '{ok,job:{id:.job.id,action:.job.action,service:.job.service,status:.job.status,exitCode:.job.exitCode,log:.job.log}}' /tmp/job.json
                  exit 4
                  ;;
              esac
            fi
            sleep 5
          done
          echo "ops_sync_timeout=$JOB" >&2
          exit 5

      - name: Deploy Remotion renderer through allowlisted Ops action
        shell: bash
        env:
          OPS_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          JOB=''
          for attempt in $(seq 1 60); do
            code=$(curl -sS --max-time 30 -o /tmp/run.json -w '%{http_code}' \
              -X POST "$BASE/api/run" \
              -H "Authorization: Bearer $OPS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data '{"action":"deploy","service":"remotion-renderer","confirm":true}' || true)
            if [[ "$code" == "202" ]] && jq -e '.ok==true and .job.action=="deploy" and .job.service=="remotion-renderer"' /tmp/run.json >/dev/null 2>&1; then
              JOB=$(jq -r '.job.id // empty' /tmp/run.json)
              echo "ops_remotion_fresh_deploy_job=$JOB"
              break
            fi
            if [[ "$code" == "409" ]]; then
              ACTIVE=$(jq -r '.jobId // .job.id // "unknown"' /tmp/run.json)
              ACTIVE_ACTION=$(jq -r '.job.action // "unknown"' /tmp/run.json)
              ACTIVE_SERVICE=$(jq -r '.job.service // "none"' /tmp/run.json)
              echo "ops_busy attempt=$attempt active_job=$ACTIVE action=$ACTIVE_ACTION service=$ACTIVE_SERVICE waiting_for_fresh_remotion_deploy"
              sleep 5
              continue
            fi
            echo "Unable to create fresh Remotion deploy job http=$code" >&2
            cat /tmp/run.json >&2 || true
            exit 2
          done
          test -n "$JOB"

          for i in $(seq 1 120); do
            code=$(curl -sS --max-time 20 -o /tmp/job.json -w '%{http_code}' \
              -H "Authorization: Bearer $OPS_TOKEN" "$BASE/api/jobs/$JOB" || true)
            if [[ "$code" == "200" ]]; then
              status=$(jq -r '.job.status // empty' /tmp/job.json)
              echo "ops_job_status=$status"
              case "$status" in
                ok)
                  jq -e '.job.action=="deploy" and .job.service=="remotion-renderer"' /tmp/job.json >/dev/null
                  jq -c '{ok,job:{id:.job.id,action:.job.action,service:.job.service,status:.job.status,exitCode:.job.exitCode}}' /tmp/job.json
                  echo "ops_deploy_log_tail_begin"
                  jq -r '.job.log // ""' /tmp/job.json | tail -n 80
                  echo "ops_deploy_log_tail_end"
                  exit 0
                  ;;
                failed)
                  jq -c '{ok,job:{id:.job.id,action:.job.action,service:.job.service,status:.job.status,exitCode:.job.exitCode,log:.job.log}}' /tmp/job.json
                  exit 4
                  ;;
              esac
            fi
            sleep 5
          done
          echo "ops_job_timeout=$JOB"
          exit 5

      - name: Verify health-first-boot is live
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            code=$(curl -sS --max-time 20 -o /tmp/remotion-health.json -w '%{http_code}' \
              'https://render.chicagoshining.com/health' || true)
            if [[ "$code" == "200" ]] && jq -e --arg v "$EXPECTED_VERSION" \
              '.ok==true and .privateDriveImageLocalization==true and .watermarkLocalization==true and .version==$v' \
              /tmp/remotion-health.json >/dev/null 2>&1; then
              jq -c '{ok,service,version,privateDriveImageLocalization,watermarkLocalization}' /tmp/remotion-health.json
              exit 0
            fi
            echo "waiting_version attempt=$i http=$code body=$(head -c 120 /tmp/remotion-health.json 2>/dev/null | tr '\n' ' ')"
            sleep 5
          done
          cat /tmp/remotion-health.json || true
          exit 6

# 2026-10-10T13:12Z: health-first-boot — register /health before static; defer startup sweep
