name: Deploy Home Column Tooltips (Once)

on:
  push:
    branches: [main]
    paths:
      - 'apps/studio-web/assets/all-profiles-overview-1007.js'

permissions:
  contents: read
  actions: write

concurrency:
  group: home-overview-column-tooltips-deploy-once
  cancel-in-progress: false

jobs:
  dispatch-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Reuse existing authenticated Studio Pages production release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/pages-dispatch-response.json -w '%{http_code}' \
            -X POST "https://api.github.com/repos/$REPOSITORY/actions/workflows/deploy-cloudflare-pages-production.yml/dispatches" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"ref":"main"}')
          if [[ "$status" != "204" ]]; then
            echo "Existing Pages release dispatch failed (HTTP $status)" >&2
            cat /tmp/pages-dispatch-response.json >&2
            exit 1
          fi
          echo "Studio Pages production release dispatched via existing verified workflow"
