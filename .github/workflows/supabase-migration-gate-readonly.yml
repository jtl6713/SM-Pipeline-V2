# Read-only Workstream A probe for Airtable → Supabase cutover.
# Does not flip STUDIO_READ_SOURCE / STUDIO_WRITE_SOURCE. No mutations.
name: Supabase Migration Gate Read-Only
on:
  workflow_dispatch:
  schedule:
    # Catch half-hour cron shortly after :00 / :30 UTC
    # Reprobe after Worker 0.10.776-supabase-mirror-check production deploy.
    - cron: "5,35 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-migration-gate-readonly.yml"
permissions:
  contents: read
  actions: write
concurrency:
  group: supabase-migration-gate-readonly
  cancel-in-progress: false
jobs:
  probe:
    if: github.repository == 'jtl6713/SM-Pipeline-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      # Ephemeral probe Worker name. Must stay unique and unused in the account.
      GATE_WORKER: studio-supabase-gate-readonly-20261109
      STUDIO_ACCESS_EMAIL: joseph.t.logan@gmail.com
    steps:
      - name: Probe Worker health, sync status, mirror-check, and runner health
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CF_ACCESS_CLIENT_ID:-}"
          test -n "${CF_ACCESS_CLIENT_SECRET:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

          # Match proven Pages/Review probes: Access service-token pair only.
          # Do not send Origin or a forged Cf-Access-Authenticated-User-Email
          # on the public custom domain — that returned HTTP 403.
          ACCESS=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
                  -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
                  -H "Accept: application/json")

          health_code=$(curl -sS --max-time 30 "${ACCESS[@]}" \
            -o /tmp/studio-health.json -w '%{http_code}' \
            "https://studio.chicagoshining.com/api/health" || true)
          echo "health_http=$health_code"
          test "$health_code" = "200"
          jq -e 'type=="object"' /tmp/studio-health.json >/dev/null

          runner_code=$(curl -sS --max-time 20 \
            -o /tmp/runner-health.json -w '%{http_code}' \
            "https://pipeline.chicagoshining.com/health" || true)
          echo "runner_http=$runner_code"
          test "$runner_code" = "200"
          jq -e 'type=="object"' /tmp/runner-health.json >/dev/null

          # /api/ops/supabase/* requires tenant_admin. Reach it the same way
          # other readonly production probes do: temporary Worker + service binding
          # + Cf-Access-Authenticated-User-Email (never mutate Studio production).
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          CODE="$(curl -sS --max-time 20 -o /tmp/gate-existing.json -w '%{http_code}' -H "$AUTH" \
            "$API/workers/scripts/$GATE_WORKER/settings" || true)"
          if [[ "$CODE" != "404" ]]; then
            echo "::error::Refusing to overwrite existing gate Worker, HTTP $CODE"
            exit 1
          fi
          OWNED=0
          cleanup() {
            if [[ "$OWNED" == "1" ]]; then
              curl -fsS --max-time 20 -X DELETE -H "$AUTH" "$API/workers/scripts/$GATE_WORKER" >/dev/null ||
                echo "::warning::Temporary gate Worker requires cleanup; Studio production Worker unchanged"
            fi
          }
          trap cleanup EXIT
          TOKEN="$(openssl rand -hex 32)"
          cat > /tmp/gate-worker.mjs <<JS
          export default {
            async fetch(request, env) {
              const path = new URL(request.url).pathname;
              const route = path === "/sync"
                ? "/api/ops/supabase/sync"
                : path === "/mirror-check"
                  ? "/api/ops/supabase/mirror-check?limit=12"
                  : null;
              if (request.method !== "GET" || !route) {
                return new Response("Not found", { status: 404 });
              }
              if (request.headers.get("Authorization") !== "Bearer " + env.GATE_TOKEN) {
                return new Response("Unauthorized", { status: 401 });
              }
              const answer = await env.STUDIO_API.fetch(new Request(
                "https://studio.chicagoshining.com" + route,
                {
                  headers: {
                    "Cf-Access-Authenticated-User-Email": "${STUDIO_ACCESS_EMAIL}",
                    "Origin": "https://studio.chicagoshining.com",
                    "Accept": "application/json",
                  },
                },
              ));
              return new Response(await answer.text(), {
                status: answer.status,
                headers: {
                  "Content-Type": "application/json",
                  "Cache-Control": "no-store",
                },
              });
            },
          };
          JS
          cat >/tmp/gate-metadata.json <<EOF
          {"main_module":"worker.mjs","compatibility_date":"2026-10-01","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"},{"type":"plain_text","name":"GATE_TOKEN","text":"$TOKEN"}]}
          EOF
          PUT="$(curl -sS --max-time 30 -o /tmp/gate-put.json -w '%{http_code}' -X PUT \
            "$API/workers/scripts/$GATE_WORKER/content" -H "$AUTH" \
            -F 'metadata=@/tmp/gate-metadata.json;type=application/json' \
            -F 'worker.mjs=@/tmp/gate-worker.mjs;type=application/javascript+module;filename=worker.mjs')"
          if ! [[ "$PUT" =~ ^2[0-9][0-9]$ ]] || ! jq -e '.success==true' /tmp/gate-put.json >/dev/null; then
            echo "::error::Temporary gate Worker could not be created (HTTP $PUT)"
            jq -c '{success,errors:[.errors[]?|{code,message}]}' /tmp/gate-put.json || true
            exit 1
          fi
          OWNED=1
          curl -fsS --max-time 20 -X POST -H "$AUTH" -H 'Content-Type: application/json' \
            "$API/workers/scripts/$GATE_WORKER/subdomain" \
            --data '{"enabled":true,"previews_enabled":false}' >/tmp/gate-sub.json
          jq -e '.success==true' /tmp/gate-sub.json >/dev/null
          SUBDOMAIN="$(curl -fsS --max-time 20 -H "$AUTH" "$API/workers/subdomain" | jq -er '.result.subdomain')"
          BASE="https://$GATE_WORKER.$SUBDOMAIN.workers.dev"
          sync_code="000"
          for attempt in $(seq 1 12); do
            sync_code="$(curl -sS --max-time 45 -o /tmp/studio-sync.json -w '%{http_code}' \
              -H "Authorization: Bearer $TOKEN" "$BASE/sync" || true)"
            echo "sync_http_attempt_${attempt}=$sync_code"
            if [[ "$sync_code" == "200" ]]; then break; fi
            sleep 3
          done
          test "$sync_code" = "200"
          jq -e 'type=="object"' /tmp/studio-sync.json >/dev/null

          echo '{}' > /tmp/studio-mirror-check.json
          WORKER_VERSION="$(jq -r '.version // empty' /tmp/studio-health.json)"
          echo "worker_version=$WORKER_VERSION"
          if [[ "$WORKER_VERSION" == *supabase-mirror-check* ]]; then
            mirror_code="000"
            for attempt in $(seq 1 12); do
              mirror_code="$(curl -sS --max-time 90 -o /tmp/studio-mirror-check.json -w '%{http_code}' \
                -H "Authorization: Bearer $TOKEN" "$BASE/mirror-check" || true)"
              echo "mirror_http_attempt_${attempt}=$mirror_code"
              if [[ "$mirror_code" == "200" ]]; then break; fi
              sleep 3
            done
            test "$mirror_code" = "200"
            jq -e 'type=="object"' /tmp/studio-mirror-check.json >/dev/null
          else
            echo "WORKSTREAM_A5=SKIPPED_WAITING_FOR_WORKER_0.10.775"
            jq -n '{ok:null,workstream_a5:"SKIPPED",reason:"worker_version_missing_mirror_check",worker_version:$v}' \
              --arg v "$WORKER_VERSION" > /tmp/studio-mirror-check.json
          fi

          python3 - <<'PY'
          import json, sys, time
          from pathlib import Path

          health = json.loads(Path("/tmp/studio-health.json").read_text())
          sync = json.loads(Path("/tmp/studio-sync.json").read_text())
          runner = json.loads(Path("/tmp/runner-health.json").read_text())
          mirror = json.loads(Path("/tmp/studio-mirror-check.json").read_text())
          now = time.time()

          print("=== /api/health (selected) ===")
          for key in (
              "ok",
              "version",
              "studio_read_source",
              "studio_pipeline_read_source",
              "studio_content_read_source",
              "studio_factory_ops_read_source",
              "studio_home_read_source",
              "studio_supabase_configured",
              "studio_supabase_phase5_writes_v1",
              "studio_supabase_phase6_writes_v1",
              "studio_supabase_last_sync_at",
              "studio_supabase_last_sync_ok",
          ):
              print(f"{key}={health.get(key)!r}")

          print("=== /api/ops/supabase/sync (selected) ===")
          last = sync.get("last_sync") or {}
          print(f"configured={sync.get('configured')!r}")
          print(f"read_source={sync.get('read_source')!r}")
          print(f"pipeline_read_source={sync.get('pipeline_read_source')!r}")
          print(f"content_read_source={sync.get('content_read_source')!r}")
          print(f"factory_ops_read_source={sync.get('factory_ops_read_source')!r}")
          print(f"home_read_source={sync.get('home_read_source')!r}")
          print(f"phase5_writes={sync.get('phase5_writes')!r}")
          print(f"phase5_write_tables={sync.get('phase5_write_tables')!r}")
          print(f"phase6_writes={sync.get('phase6_writes')!r}")
          print(f"phase6_write_tables={sync.get('phase6_write_tables')!r}")
          print(f"last_sync.status={last.get('status')!r}")
          print(f"last_sync.ok={last.get('ok')!r}")
          print(f"last_sync.at={last.get('at')!r}")
          print(f"last_sync.finished_at={last.get('finished_at')!r}")
          print(f"last_sync.duration_ms={last.get('duration_ms')!r}")
          print(f"last_sync.error={last.get('error')!r}")
          circuit = last.get("circuit") or {}
          print(f"circuit.open={circuit.get('open')!r}")
          print(f"circuit.failures={circuit.get('failures')!r}")
          print(f"circuit.lastError={circuit.get('lastError')!r}")

          print("=== runner /health (selected) ===")
          for key in ("ok", "version", "studio_write_source", "supabase_pipeline_writes"):
              print(f"{key}={runner.get(key)!r}")

          checks = []

          def check(name, ok, detail=""):
              checks.append((name, bool(ok), detail))
              mark = "PASS" if ok else "FAIL"
              print(f"GATE[{mark}] {name}" + (f" — {detail}" if detail else ""))

          check("health.ok", health.get("ok") is True)
          check(
              "studio_read_source=airtable",
              health.get("studio_read_source") == "airtable",
              f"got {health.get('studio_read_source')!r}",
          )
          check(
              "studio_supabase_phase5_writes_v1",
              health.get("studio_supabase_phase5_writes_v1") is True,
          )
          check(
              "studio_supabase_configured",
              health.get("studio_supabase_configured") is True,
          )
          check(
              "phase5_writes=airtable_sor_write_through",
              sync.get("phase5_writes") == "airtable_sor_write_through",
              f"got {sync.get('phase5_writes')!r}",
          )
          for flag in (
              "studio_pipeline_read_source",
              "studio_content_read_source",
              "studio_factory_ops_read_source",
              "studio_home_read_source",
          ):
              check(
                  f"{flag}=supabase",
                  health.get(flag) == "supabase",
                  f"got {health.get(flag)!r}",
              )
          version = str(health.get("version") or "")
          phase6_flag = health.get("studio_supabase_phase6_writes_v1")
          # Later Worker releases keep the flag and drop the 0.10.784 suffix.
          if phase6_flag is None and "supabase-phase6-request-writes" not in version:
              print("GATE[SKIP] phase6 write-through — health flag absent")
          else:
              check(
                  "studio_supabase_phase6_writes_v1",
                  phase6_flag is True,
                  f"version={version!r}",
              )
              check(
                  "phase6_writes=airtable_sor_write_through",
                  sync.get("phase6_writes") == "airtable_sor_write_through",
                  f"got {sync.get('phase6_writes')!r}",
              )
              tables = sync.get("phase6_write_tables")
              if isinstance(tables, list) and "studio_media_transfer_queue" in tables:
                  check(
                      "phase6_write_tables=production_requests,media_assets,studio_media_transfer_queue",
                      tables == ["production_requests", "media_assets", "studio_media_transfer_queue"],
                      f"got {tables!r}",
                  )
              elif isinstance(tables, list) and "media_assets" in tables:
                  check(
                      "phase6_write_tables=production_requests,media_assets",
                      tables == ["production_requests", "media_assets"],
                      f"got {tables!r}",
                  )
              else:
                  check(
                      "phase6_write_tables=production_requests",
                      tables == ["production_requests"],
                      f"got {tables!r}",
                  )
          check(
              "last_sync completed+ok",
              last.get("status") == "completed" and last.get("ok") is True,
              f"status={last.get('status')!r} ok={last.get('ok')!r} error={last.get('error')!r}",
          )

          at_ms = last.get("at")
          if isinstance(at_ms, (int, float)) and at_ms > 0:
              age_min = (now * 1000 - float(at_ms)) / 60000.0
              check("last_sync age < 40 min", age_min < 40, f"age_min={age_min:.1f}")
          else:
              check("last_sync age < 40 min", False, "missing last_sync.at")

          check(
              "circuit not open",
              circuit.get("open") is not True,
              f"open={circuit.get('open')!r} failures={circuit.get('failures')!r}",
          )
          check(
              "runner.supabase_pipeline_writes",
              runner.get("supabase_pipeline_writes") is True,
          )
          check(
              "runner.studio_write_source=airtable",
              runner.get("studio_write_source") == "airtable",
              f"got {runner.get('studio_write_source')!r}",
          )

          print("=== /api/ops/supabase/mirror-check (A5) ===")
          print(f"workstream_a5={mirror.get('workstream_a5')!r}")
          print(f"sampled_outputs={mirror.get('sampled_outputs')!r}")
          print(f"sampled_content_items={mirror.get('sampled_content_items')!r}")
          print(f"output_missing_in_supabase={mirror.get('output_missing_in_supabase')!r}")
          print(f"content_missing_in_supabase={mirror.get('content_missing_in_supabase')!r}")
          print(f"output_mismatches={mirror.get('output_mismatches')!r}")
          print(f"content_mismatches={mirror.get('content_mismatches')!r}")
          print(f"deletion_guard={mirror.get('deletion_guard')!r}")
          a5 = mirror.get("workstream_a5")
          if a5 == "SKIPPED":
              print("GATE[SKIP] workstream_a5 — waiting for Worker 0.10.776-supabase-mirror-check")
          else:
              check(
                  "workstream_a5=PASS",
                  a5 == "PASS" and mirror.get("ok") is True,
                  f"workstream_a5={a5!r} ok={mirror.get('ok')!r}",
              )
              deletion = mirror.get("deletion_guard") or {}
              check(
                  "deleted_7894_not_in_airtable",
                  deletion.get("airtable_present") is not True,
                  f"airtable_present={deletion.get('airtable_present')!r}",
              )
              check(
                  "deleted_7894_list_strip",
                  deletion.get("list_strip_suppresses") is True,
                  f"list_strip_suppresses={deletion.get('list_strip_suppresses')!r}",
              )

          sample = {
              "probed_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "health": {
                  k: health.get(k)
                  for k in (
                      "ok",
                      "version",
                      "studio_read_source",
                      "studio_pipeline_read_source",
                      "studio_content_read_source",
                      "studio_factory_ops_read_source",
                      "studio_home_read_source",
                      "studio_supabase_configured",
                      "studio_supabase_phase5_writes_v1",
                      "studio_supabase_phase6_writes_v1",
                      "studio_supabase_last_sync_at",
                      "studio_supabase_last_sync_ok",
                  )
              },
              "sync": {
                  "configured": sync.get("configured"),
                  "read_source": sync.get("read_source"),
                  "pipeline_read_source": sync.get("pipeline_read_source"),
                  "content_read_source": sync.get("content_read_source"),
                  "factory_ops_read_source": sync.get("factory_ops_read_source"),
                  "home_read_source": sync.get("home_read_source"),
                  "phase5_writes": sync.get("phase5_writes"),
                  "phase6_writes": sync.get("phase6_writes"),
                  "phase6_write_tables": sync.get("phase6_write_tables"),
                  "last_sync": {
                      "status": last.get("status"),
                      "ok": last.get("ok"),
                      "at": last.get("at"),
                      "finished_at": last.get("finished_at"),
                      "duration_ms": last.get("duration_ms"),
                      "error": last.get("error"),
                      "circuit": circuit,
                  },
              },
              "mirror_check": {
                  "workstream_a5": mirror.get("workstream_a5"),
                  "ok": mirror.get("ok"),
                  "sampled_outputs": mirror.get("sampled_outputs"),
                  "sampled_content_items": mirror.get("sampled_content_items"),
                  "output_missing_in_supabase": mirror.get("output_missing_in_supabase"),
                  "content_missing_in_supabase": mirror.get("content_missing_in_supabase"),
                  "output_mismatches": mirror.get("output_mismatches"),
                  "content_mismatches": mirror.get("content_mismatches"),
                  "deletion_guard": mirror.get("deletion_guard"),
              },
              "runner": {
                  k: runner.get(k)
                  for k in ("ok", "version", "studio_write_source", "supabase_pipeline_writes")
              },
              "checks": [{"name": n, "ok": o, "detail": d} for n, o, d in checks],
              "note": (
                  "A4 (≥3 consecutive completed+ok half-hour syncs) needs multiple "
                  "scheduled runs of this workflow; one probe only proves the latest stamp. "
                  "A5 requires Worker 0.10.776-supabase-mirror-check."
              ),
          }
          Path("/tmp/supabase-migration-gate-sample.json").write_text(
              json.dumps(sample, indent=2) + "\n"
          )

          hard = [c for c in checks if not c[1]]
          if hard:
              print("WORKSTREAM_A_SNAPSHOT=FAIL")
              print("Do not restore Supabase reads (Workstream B) until A4–A5 pass.")
              sys.exit(1)
          print("WORKSTREAM_A_SNAPSHOT=PASS_LATEST_ONLY")
          if a5 == "PASS":
              print("WORKSTREAM_A5=PASS")
          elif a5 == "SKIPPED":
              print("WORKSTREAM_A5=SKIPPED")
          print(
              "Latest stamp looks healthy. Keep scheduled probes until ≥3 consecutive "
              "PASS_LATEST_ONLY runs cover distinct :00/:30 windows before B1."
          )
          PY

      - name: Upload gate sample artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-migration-gate-${{ github.run_id }}
          path: |
            /tmp/studio-health.json
            /tmp/studio-sync.json
            /tmp/studio-mirror-check.json
            /tmp/runner-health.json
            /tmp/supabase-migration-gate-sample.json
          if-no-files-found: warn

      - name: Restore consecutive healthy half-hour streak
        if: success()
        uses: actions/cache/restore@v4
        with:
          path: .supabase-gate-streak
          key: supabase-gate-streak-${{ github.run_id }}
          restore-keys: |
            supabase-gate-streak-

      - name: Update consecutive healthy streak file
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .supabase-gate-streak
          python3 - <<'PY'
          import json
          from pathlib import Path
          sample = json.loads(Path("/tmp/supabase-migration-gate-sample.json").read_text())
          last = (sample.get("sync") or {}).get("last_sync") or {}
          stamp_at = last.get("at")
          path = Path(".supabase-gate-streak/history.json")
          history = []
          if path.exists():
              try:
                  history = json.loads(path.read_text())
              except Exception:
                  history = []
          if not isinstance(history, list):
              history = []
          entry = {
              "probed_at": sample.get("probed_at"),
              "last_sync_at": stamp_at,
              "last_sync_finished_at": last.get("finished_at"),
              "status": last.get("status"),
              "ok": last.get("ok"),
              "run_id": """${{ github.run_id }}""",
          }
          if not history or history[-1].get("last_sync_at") != stamp_at:
              history.append(entry)
          history = history[-12:]
          path.write_text(json.dumps(history, indent=2) + "\n")

          streak = 0
          for row in reversed(history):
              if row.get("status") == "completed" and row.get("ok") is True:
                  streak += 1
              else:
                  break
          print(f"CONSECUTIVE_HEALTHY_SYNCS={streak}")
          print(f"HISTORY_LEN={len(history)}")
          if streak >= 3:
              print("WORKSTREAM_A4_GATE=PASS")
          else:
              print("WORKSTREAM_A4_GATE=INCOMPLETE")
              print(f"Need {3 - streak} more distinct completed+ok half-hour stamps.")
          PY
          cat .supabase-gate-streak/history.json

      - name: Persist streak for next scheduled probe
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .supabase-gate-streak
          key: supabase-gate-streak-${{ github.run_id }}
