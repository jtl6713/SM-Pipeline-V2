name: Main PR Safety Gate

# This job is unconditional for PRs into main, including docs-only and
# workflow-only PRs. Never require a path-filtered deployment check instead.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pr-safety:
    name: pr-safety
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@v6

      - name: Determine whether actual encoded-media regression is required
        id: media_scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          required=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            git fetch --quiet --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only "$BASE_SHA" HEAD > /tmp/pr-changed-paths
            if ! grep -Eq '^(services/remotion-renderer/|services/pipeline-runner/(r4/|r5/|render/|studio_produce/|audio/|p2/|p3/|tests/test_2970_encoded_media_quality\.py|tests/test_r5_studio_revision\.py|config\.py|supabase_pipeline\.py|requirements\.txt)|apps/studio-api/(worker\.js|worker-functions-[0-9]+\.mjs|factory-supabase-approval\.mjs|factory-audio-intent\.mjs|render-queue\.mjs|supabase-pipeline-reads\.mjs)|\.github/(scripts/test-real-remotion-audio\.py|workflows/(main-pr-safety-gate|real-remotion-audio-regression)\.yml))' /tmp/pr-changed-paths; then
              required=false
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "real_encoded_media_regression_required=$required"


      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Studio API syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/studio-api/worker-functions-01.mjs
          node --check apps/studio-api/worker-functions-02.mjs
          node --check apps/studio-api/worker-functions-04.mjs
          node --check apps/studio-api/supabase-pipeline-reads.mjs

      - name: Verify NYC audio handoff and audio-safe render admission
        shell: bash
        run: |
          set -euo pipefail
          node --test apps/studio-api/nyc-audio-handoff-2489.test.mjs

      - name: Run isolated upload recovery assertions
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            apps/studio-api/large-video-upload-recovery.test.mjs \
            apps/studio-api/vibe-preflight-500-boundary.test.mjs


      # The existing unconditional pr-safety check is the enforcement point.
      # A failed real render fails this job; no optional/continue-on-error path.
      - name: Use tested renderer Node version
        if: steps.media_scope.outputs.required == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/remotion-renderer/package-lock.json

      - name: Set up Python for exact media analysis
        if: steps.media_scope.outputs.required == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact renderer dependencies
        if: steps.media_scope.outputs.required == 'true'
        working-directory: services/remotion-renderer
        run: npm ci --no-audit --no-fund

      - name: Require actual encoded audio regression
        if: steps.media_scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          python .github/scripts/test-real-remotion-audio.py
          test -s /tmp/real-remotion-audio-receipt.json

      - name: Require runner encoded-media and R5 admission regressions
        if: steps.media_scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          python -m pip install --quiet -r services/pipeline-runner/requirements.txt pytest
          PYTHONPATH=services/pipeline-runner python -m pytest -q \
            services/pipeline-runner/tests/test_2970_encoded_media_quality.py \
            services/pipeline-runner/tests/test_r5_studio_revision.py

      - name: Archive exact encoded audio regression evidence
        if: always() && steps.media_scope.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: required-real-remotion-audio-receipt
          path: /tmp/real-remotion-audio-receipt.json
          if-no-files-found: warn
          retention-days: 30
