name: Cloudflare Worker Routing Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-worker-routing-diagnostic.yml'
      - 'deploy/cloudflare-worker-routing-diagnostic.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: chicagoshining-studio-api
      STUDIO_ORIGIN: https://studio.chicagoshining.com
    steps:
      - uses: actions/checkout@v6
      - name: Read Worker routing metadata only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/scripts.json
          jq -c --arg name "$WORKER_NAME" '[.result[]? | select(.id==$name) | {id,routes:(.routes // [])}]' /tmp/scripts.json

          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/subdomain.json
          jq -c '{workers_dev:{enabled:.result.enabled,previews_enabled:.result.previews_enabled}}' /tmp/subdomain.json

      - name: Probe Access API permissions read-only
        shell: bash
        run: |
          set -euo pipefail
          call() {
            local label="$1" url="$2" out="/tmp/${1}.json"
            local code
            code=$(curl -sS -o "$out" -w '%{http_code}' "$url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            echo "$label HTTP=$code"
            if jq empty "$out" >/dev/null 2>&1; then
              jq -c --arg label "$label" '{label:$label,success:(.success // false),error_codes:[.errors[]?.code],error_messages:[.errors[]?.message],result_count:(if (.result|type)=="array" then (.result|length) elif (.result|type)=="object" and (.result.items|type)=="array" then (.result.items|length) else null end)}' "$out"
            else
              echo "$label non_json_response"
            fi
          }
          call access_apps "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps"
          call access_service_tokens "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/service_tokens"
