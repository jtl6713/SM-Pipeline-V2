name: Cloudflare Worker Routing Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-worker-routing-diagnostic.yml'
      - 'deploy/cloudflare-worker-routing-diagnostic.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: chicagoshining-studio-api
      STUDIO_ORIGIN: https://studio.chicagoshining.com
    steps:
      - uses: actions/checkout@v6
      - name: Read Worker routing metadata only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/scripts.json
          echo 'TARGET_SCRIPT'
          jq -c --arg name "$WORKER_NAME" '
            [.result[]? | select(.id==$name) | {id,compatibility_date,routes:(.routes // []),tail_consumers:(.tail_consumers // []),usage_model:(.usage_model // null),created_on:(.created_on // null),modified_on:(.modified_on // null)}]
          ' /tmp/scripts.json

          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/domains.json
          echo 'CUSTOM_DOMAINS'
          jq -c --arg service "$WORKER_NAME" '[.result[]? | select(.service==$service) | {hostname,zone_name,environment}]' /tmp/domains.json

          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/subdomain.json
          echo 'WORKERS_DEV'
          jq -c '{enabled:.result.enabled,previews_enabled:.result.previews_enabled}' /tmp/subdomain.json

      - name: Probe Studio health and session ingress read-only
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1"; shift
            local url="$1"; shift
            local out="/tmp/${label}.body" hdr="/tmp/${label}.headers"
            local code
            code=$(curl -sS -L --max-redirs 3 --max-time 20 -D "$hdr" -o "$out" -w '%{http_code}' "$@" "$url" || true)
            echo "$label HTTP=$code"
            if jq empty "$out" >/dev/null 2>&1; then
              jq -c '{ok:(.ok // null),service:(.service // null),version:(.version // null),authenticated:(.authenticated // null),authorized:(.authorized // null),email:(.email // null),role:(.role.name // .role // null),error:(.error // null)}' "$out"
            else
              echo "content_type=$(grep -i '^content-type:' "$hdr" | tail -1 | tr -d '\r' | cut -d' ' -f2- || true)"
              echo "body_marker=$(tr '\n' ' ' < "$out" | sed -E 's/[[:space:]]+/ /g' | grep -o -E '<title>[^<]+|Cloudflare Access|Access denied|Forbidden|Unauthorized' | head -1 || true)"
            fi
          }
          probe health "$STUDIO_ORIGIN/api/health"
          probe session_no_header "$STUDIO_ORIGIN/api/session"
          probe session_spoofed_header "$STUDIO_ORIGIN/api/session" -H 'Cf-Access-Authenticated-User-Email: joseph.t.logan@gmail.com'
