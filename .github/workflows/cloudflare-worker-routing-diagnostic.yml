name: Cloudflare Worker Routing Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-worker-routing-diagnostic.yml'
      - 'deploy/cloudflare-worker-routing-diagnostic.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZONE_NAME: chicagoshining.com
    steps:
      - uses: actions/checkout@v6
      - name: Locate zone and Access applications read-only
        shell: bash
        run: |
          set -euo pipefail
          call() {
            local label="$1" url="$2" out="/tmp/${1}.json"
            local code
            code=$(curl -sS -o "$out" -w '%{http_code}' "$url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
            echo "$label HTTP=$code"
            if jq empty "$out" >/dev/null 2>&1; then
              jq -c --arg label "$label" '{label:$label,success:(.success // false),error_codes:[.errors[]?.code],error_messages:[.errors[]?.message],result_count:(if (.result|type)=="array" then (.result|length) elif (.result|type)=="object" and (.result.items|type)=="array" then (.result.items|length) else null end)}' "$out"
            else
              echo "$label non_json_response"
            fi
          }

          call zones "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME"
          ZONE_ID=$(jq -er '.result[0].id' /tmp/zones.json)
          echo "zone_found=true"

          call zone_access_apps "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/access/apps"
          if jq -e '.success==true' /tmp/zone_access_apps.json >/dev/null; then
            echo 'ZONE_ACCESS_APPS_SANITIZED'
            jq -c '[.result[]? | {id,name,domain,type,session_duration,service_auth_401_redirect,policies_count:((.policies // [])|length)}]' /tmp/zone_access_apps.json
            APP_ID=$(jq -r '.result[]? | select(.domain|startswith("studio.chicagoshining.com")) | .id' /tmp/zone_access_apps.json | head -1)
            if [[ -n "$APP_ID" ]]; then
              call zone_access_policies "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/access/apps/$APP_ID/policies"
              if jq -e '.success==true' /tmp/zone_access_policies.json >/dev/null; then
                echo 'ZONE_ACCESS_POLICIES_SANITIZED'
                jq -c '[.result[]? | {id,name,decision,precedence,include_kinds:[.include[]? | keys[]],require_kinds:[.require[]? | keys[]],exclude_kinds:[.exclude[]? | keys[]]}]' /tmp/zone_access_policies.json
              fi
            fi
          fi
