name: Buckingham C2324 exact music duration backfill
on:
  pull_request:
    paths:
      - 'repair/scripts/buckingham-c2324-music-duration.py'
      - '.github/workflows/buckingham-c2324-music-duration.yml'
  push:
    branches: [main]
    paths:
      - 'repair/scripts/buckingham-c2324-music-duration.py'
      - '.github/workflows/buckingham-c2324-music-duration.yml'
permissions:
  contents: read
concurrency:
  group: buckingham-c2324-music-duration
  cancel-in-progress: false
jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact bounded music metadata backfill
        shell: bash
        run: |
          python3 -m py_compile repair/scripts/buckingham-c2324-music-duration.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path('repair/scripts/buckingham-c2324-music-duration.py').read_text()
          for v in ('recWni5UcEHcq7mdX','recu1x77Gy50AlYLI','probe_audio_duration_bytes','resource_slot','duration_compare_and_set_not_committed'):
              assert v in s
          for v in ('requests.post','requests.delete','requests.put','media_publish'):
              assert v not in s
          PY
  stage-owned-media:
    if: github.event_name == 'push'
    needs: static-safety
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate existing Ops runner without exposing credential
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C";do
            [[ -n "$candidate" ]] || continue
            http=$(curl -sS --max-time 20 -o /tmp/c2324-ops-catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" 'https://ops.chicagoshining.com/api/catalog' || true)
            if [[ "$http" == 200 ]] && jq -e '.ok==true' /tmp/c2324-ops-catalog.json >/dev/null;then
              echo "::add-mask::$candidate"
              echo "C2324_OPS_TOKEN=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'C2324 music duration probe blocked: Ops unavailable; no media state changed'; exit 1
      - name: Build pinned SHA256 source execution request for original owner runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,json,pathlib
          src=pathlib.Path('repair/scripts/buckingham-c2324-music-duration.py')
          expected=hashlib.sha256(src.read_bytes()).hexdigest()
          sha=os.environ['GITHUB_SHA']
          assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha)
          url=f'https://raw.githubusercontent.com/jtl6713/SM-Pipeline-V2/{sha}/{src.as_posix()}'
          command=(
              "$ErrorActionPreference='Stop';"
              "$py=Get-Command python -ErrorAction SilentlyContinue;"
              "if(-not $py){throw 'ops_python_missing'};"
              "$tmp=Join-Path $env:TEMP 'buckingham-c2324-music-duration.py';"
              f"$srcUrl='{url}';"
              "Invoke-WebRequest -Uri $srcUrl -Method Get -OutFile $tmp -UseBasicParsing -TimeoutSec 55;"
              "$actual=(Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant();"
              f"if($actual -ne '{expected}'){{throw 'exact_stage_source_checksum_mismatch'}};"
              "try{& python $tmp;"
              "if($LASTEXITCODE -ne 0){throw ('c2324_music_probe_exit_'+$LASTEXITCODE)}}"
              "finally{Remove-Item $tmp -Force -ErrorAction SilentlyContinue}"
          )
          pathlib.Path('/tmp/c2324-ops-request.json').write_text(json.dumps({'command':command,'confirm':True}))
          print('IMMUTABLE_ISSUE2970_STAGE_SOURCE_PINNED')
          PY
      - name: Measure selected soundtrack and backfill exact metadata
        shell: bash
        run: |
          set -euo pipefail
          accepted=false
          for slot in $(seq 1 12);do
            code=$(curl -sS --max-time 30 -o /tmp/c2324-ops-start.json -w '%{http_code}' \
              -X POST 'https://ops.chicagoshining.com/api/shell' \
              -H "Authorization: Bearer $C2324_OPS_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @/tmp/c2324-ops-request.json || true)
            if [[ "$code" == 200 || "$code" == 202 ]];then accepted=true;break;fi
            if [[ "$code" != 409 ]];then echo "R2 owner runner returned $code";exit 2;fi
            sleep 12
          done
          [[ "$accepted" == true ]] || { echo 'Ops shell busy; no second stage scheduled';exit 2; }
          job=$(jq -er '.job.id // .jobId' /tmp/c2324-ops-start.json)
          for tick in $(seq 1 140);do
            curl -fsS --max-time 30 -H "Authorization: Bearer $C2324_OPS_TOKEN" \
              "https://ops.chicagoshining.com/api/jobs/$job" -o /tmp/c2324-ops-job.json
            status=$(jq -r '.job.status // empty' /tmp/c2324-ops-job.json)
            if [[ "$status" == ok ]];then
              jq -r '.job.log // ""' /tmp/c2324-ops-job.json | grep '^C2324_MUSIC_DURATION=' | tail -1 \
                | sed 's/^C2324_MUSIC_DURATION=//' > /tmp/c2324-music-duration.json
              jq -e '.verified==true and .content==2324 and .music_asset=="recu1x77Gy50AlYLI" and .seconds>0 and .provider_writes==0 and .production_writes==0' /tmp/c2324-music-duration.json >/dev/null
              jq -c . /tmp/c2324-music-duration.json
              exit 0
            elif [[ "$status" == failed ]];then
              echo 'C2324 exact music duration backfill failed; no automatic source/approval/provider changes'
              jq -r '.job.log // ""' /tmp/c2324-ops-job.json | grep -E '^ISSUE2970_(MUSIC_SOURCE|STEM_PROBE)=\{' || true
              jq -r '.job.log // ""' /tmp/c2324-ops-job.json | tail -n 23 \
                | sed -E 's#[A-Za-z0-9_./+=-]{28,}#[redacted]#g' \
                | grep -Ev 'Authorization:|Bearer |SUPABASE_SERVICE_ROLE_KEY|R2_UPLOAD_WORKER_SECRET|GOOGLE_REFRESH_TOKEN' || true
              exit 3
            fi
            sleep 4
          done
          echo 'R2 staging job incomplete; do not set public statuses Ready'; exit 4
      - name: Preserve sanitized candidate checksum and provenance receipts for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buckingham-c2324-music-duration
          path: /tmp/c2324-music-duration.json
          retention-days: 30
          if-no-files-found: warn
