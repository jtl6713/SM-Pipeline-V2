name: Update Ledger Item 3 Complete

on:
  push:
    branches: [main]
    paths:
      - deploy/update-ledger-item3-complete.txt

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Close Item 3 and clear top-five gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('repair/SM_PIPELINE_21_ITEM_LEDGER.md')
          s = p.read_text()
          lines = s.splitlines()

          item3 = "| 3 | Renderer native overlap transitions | **Complete — native overlap and A/V acceptance proven** | Authoritative `Services/Remotion_Renderer` now uses Remotion `TransitionSeries` for true adjacent-scene overlap with duration-neutral compensation, native fade/slide presentations, preserved first-scene reveal, bounded clip audio, and service version `2026-08-17-native-overlap-transitions`. Acceptance job `item3-native-overlap-20260817-071452` completed at 360×640/30 fps with exactly 135 video frames and a 4.500 s video stream; AAC audio is present/non-silent; fade and slide overlap were proven by rendered-frame pixel evidence. Baseline→patched Item-3 lint stayed 2→2, TypeScript stayed 0→0, and both full Remotion bundles passed. Durable evidence: `repair/evidence/item3-native-overlap-acceptance-20260817.json`. | Closed for renderer transition behavior. Reopen only on new evidence of non-overlap, duration drift, A/V regression, or source/version drift. |"
          item6 = "| 6 | Safe republish/replace transaction and duplicate cleanup | **Ready — top-five gate cleared** | Items 1–5 are now complete and verified. No Item 6 mutation has occurred in this closure checkpoint. | Begin bounded exact-output transaction design/proof: safe replacement without duplicate public objects, deterministic reconciliation/cleanup, idempotent retry, rollback-safe last-good state, and no cross-record mutation. |"
          item7 = "| 7 | Fresh edge-to-edge 9:16 normal-path regression | **Blocked by Item 6 completion** | Renderer transition acceptance is complete, but broad normal-path E2E remains intentionally deferred until the safe republish/replace transaction is proven. | After Item 6 closes, run one isolated fresh 9:16 normal-path regression through the approved production path with exact evidence and cleanup. |"

          found3 = found6 = found7 = False
          for i, line in enumerate(lines):
              if line.startswith('Updated:'):
                  lines[i] = 'Updated: 2026-08-17 UTC  '
              elif line.startswith('The top-five repair program remains in progress.'):
                  lines[i] = 'Items 1–5 are now **complete and verified**. The top-five gate is cleared and **Item 6 is authorized as the next repair**. Broad end-to-end acceptance remains deferred: Item 7 may begin only after Item 6 is closed. Every future test must remain exact-record/exact-output addressed, bounded by the repair controls, and leave cost-driving scenarios OFF.'
              elif line.startswith('| 3 |'):
                  lines[i] = item3
                  found3 = True
              elif line.startswith('| 6 |'):
                  lines[i] = item6
                  found6 = True
              elif line.startswith('| 7 |'):
                  lines[i] = item7
                  found7 = True

          if not (found3 and found6 and found7):
              raise SystemExit(f'ledger row precondition failed: item3={found3} item6={found6} item7={found7}')

          out = '\n'.join(lines)
          marker = '## 2026-08-17 Item 3 completion delta — native overlap accepted'
          if marker not in out:
              delta_lines = [
                  '',
                  '',
                  marker,
                  '',
                  '- Authoritative live renderer source was repaired in `D:\\Content Creation\\ChicagoShining Pipeline\\Services\\Remotion_Renderer`; prior source hash preconditions matched before mutation.',
                  '- Native transition implementation uses Remotion `TransitionSeries` with `@remotion/transitions` pinned exactly to `4.0.484`. Outgoing sequence wrappers are extended by each overlap duration so `TransitionSeries` subtraction is duration-neutral relative to the existing voiceover/music/caption frame contract.',
                  '- Validation before service restart: Item-3 ESLint baseline/after = 2/2 (zero new errors), targeted TypeScript baseline/after = 0/0, baseline full Remotion bundle PASS, patched full Remotion bundle PASS.',
                  '- Patched `/health` returned `ok=true`, port `3333`, version `2026-08-17-native-overlap-transitions`.',
                  '- Acceptance render `item3-native-overlap-20260817-071452` completed successfully: 360×640, 30 fps, exactly 135 video frames, 4.500 s video stream, 4.544 s container/audio duration, AAC 48 kHz audio present. Independent post-upload decode confirmed non-silent audio.',
                  '- Fade proof at 1.700 s produced mixed red/green RGBA `[63,127,0,255]`; direct temporal sampling showed red at 1.5 s, mixed frames at 1.6–1.8 s, and green by 1.9 s.',
                  '- Slide proof at 3.200 s simultaneously showed green left `[0,254,1,255]` and blue right `[0,0,254,255]`; temporal sampling showed the spatial overlap entering at 3.1 s and resolving to blue by 3.4 s.',
                  '- Uploaded evidence ZIP SHA-256: `c485fed3eae8d9e13d19b8f5e7e45df7a594378aa12a36ad66426d7999124ad8`. Durable compact evidence is committed at `repair/evidence/item3-native-overlap-acceptance-20260817.json`.',
                  '- No Airtable write, Make run, R2 mutation, email, draft, upload, or platform post was used for this acceptance.',
                  '- Items 1–5 are therefore complete. Item 6 is the next authorized repair; Item 7 broad normal-path E2E remains deferred until Item 6 closure.',
                  ''
              ]
              out += '\n'.join(delta_lines)

          p.write_text(out.rstrip() + '\n')
          PY

          git diff --check
          grep -Fq '| 3 | Renderer native overlap transitions | **Complete — native overlap and A/V acceptance proven**' repair/SM_PIPELINE_21_ITEM_LEDGER.md
          grep -Fq '| 6 | Safe republish/replace transaction and duplicate cleanup | **Ready — top-five gate cleared**' repair/SM_PIPELINE_21_ITEM_LEDGER.md
          grep -Fq 'c485fed3eae8d9e13d19b8f5e7e45df7a594378aa12a36ad66426d7999124ad8' repair/SM_PIPELINE_21_ITEM_LEDGER.md
          grep -Fq 'Items 1–5 are now **complete and verified**' repair/SM_PIPELINE_21_ITEM_LEDGER.md

          if git diff --quiet -- repair/SM_PIPELINE_21_ITEM_LEDGER.md; then
            echo 'Ledger already current.'
            exit 0
          fi

          git config user.name 'SM Pipeline Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add repair/SM_PIPELINE_21_ITEM_LEDGER.md
          git commit -m 'ledger: close Item 3 and clear top-five gate'
          git push
