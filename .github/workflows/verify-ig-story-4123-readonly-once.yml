name: One-time IG Story 4123 existing-container authenticated GET
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ig-story-4123-readonly-once.yml'
permissions:
  contents: read
concurrency:
  group: ig-story-4123-verified-provider-get
  cancel-in-progress: false
jobs:
  read_only:
    if: github.repository == 'jtl6713/SM-Pipeline-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - name: Verify exact owned Chicago container via established Supabase-native runner
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ig4123-readonly.py <<'PY'
          """Single-account, single-container Graph GET with strict Supabase preflight."""
          import json
          from datetime import datetime, timezone
          from config import load_settings
          from airtable.client import AirtableClient
          from airtable.constants import PLATFORM_OUTPUTS_TABLE
          from item4.settings import PipelineSettings
          from ap1_ig.graph import load_instagram_graph_settings
          from publish.destinations import resolve_publish_theme
          import requests
          
          record_id = "recqX08bBrb1ub4ap"
          container_id = "17910781752575604"
          
          def output(**data):
              print("IG4123_RESULT="+json.dumps({"output_id":4123,"container_id":container_id,"read_only":True,**data},sort_keys=True),flush=True)
          
          try:
              settings=load_settings()
              if settings.get("studio_write_source")!="supabase" or settings.get("studio_runner_output_read_source")!="supabase" or not settings.get("supabase_url"):
                  output(status="blocked",reason="supabase_authority_unavailable")
                  raise SystemExit(0)
              client=AirtableClient(settings)
              row=client.get_record(PLATFORM_OUTPUTS_TABLE, record_id)
              f=row.get("fields",{})
              if row.get("id")!=record_id or str(f.get("Output_ID"))!="4123" or str(f.get("IG_Story_Container_ID") or "")!=container_id:
                  output(status="blocked",reason="exact_output_identity_mismatch")
                  raise SystemExit(0)
              if (f.get("Do_Not_Publish") or f.get("Review_Status")!="Approved" or f.get("Output_Status")!="Approved for Publishing"
                  or str(f.get("IG_Story_Status") or "")!="Publishing"
                  or f.get("Published_At") or f.get("IG_Story_Post_ID") or f.get("Platform_Post_ID") or f.get("Platform_Media_ID")):
                  output(status="blocked",reason="publication_state_changed_or_held")
                  raise SystemExit(0)
              retry=f.get("Publish_Next_Retry_At")
              try:
                  retry_at=datetime.fromisoformat(str(retry).replace("Z","+00:00"))
                  if retry_at.tzinfo is None: retry_at=retry_at.replace(tzinfo=timezone.utc)
              except Exception:
                  output(status="blocked",reason="retry_clock_unavailable")
                  raise SystemExit(0)
              if datetime.now(timezone.utc)<retry_at:
                  output(status="blocked",reason="cooldown_active")
                  raise SystemExit(0)
              if resolve_publish_theme(output=row,client=client)!="chicago":
                  output(status="blocked",reason="unexpected_profile_theme")
                  raise SystemExit(0)
              provider=load_instagram_graph_settings(PipelineSettings(client),row,client=client)
              token=provider["token"]
              version=provider["version"]
              if not token or not provider["ig_user_id"] or not version.startswith("v"):
                  output(status="blocked",reason="profile_graph_credentials_missing")
                  raise SystemExit(0)
              # Exactly one authenticated GET; no media_publish, create_story, PATCH, POST or Airtable egress.
              url="https://graph.facebook.com/"+version+"/"+container_id
              response=requests.get(url,params={"fields":"status_code,status"},headers={"Authorization":"Bearer "+token},timeout=25,allow_redirects=False)
              try: body=response.json()
              except ValueError: body={}
              if not isinstance(body,dict): body={}
              error=body.get("error") if isinstance(body.get("error"),dict) else {}
              state=str(body.get("status_code") or "").upper().strip()
              code=error.get("code")
              code=code if isinstance(code,int) and not isinstance(code,bool) else None
              if state not in {"FINISHED","IN_PROGRESS","PUBLISHED","ERROR","EXPIRED"}:
                  state="UNKNOWN"
              output(status="checked",provider_http=response.status_code,container_status=state,
                  provider_error_code=code,provider_error_transient=error.get("is_transient") is True,
                  account_scope_verified_by_config=True,provider_action="GET_only")
          except SystemExit:
              raise
          except Exception:
              output(status="blocked",reason="provider_read_or_supabase_preflight_failed")
          PY
          cat > /tmp/ig4123-readonly.ps1 <<'PS'
          $ErrorActionPreference = "Stop"
          $health = Invoke-RestMethod -Method GET -Uri "http://127.0.0.1:3350/health" -TimeoutSec 15
          if ($health.ok -ne $true -or $health.version -ne "2026-11-20-ig-story-graph-limit-cooldown-v1" -or
              $health.studio_write_source -ne "supabase" -or
              $health.studio_runner_output_read_source -ne "supabase" -or
              $health.studio_runner_content_read_source -ne "supabase" -or
              $health.airtable_activity.any_read -ne $false -or $health.airtable_activity.any_write -ne $false) {
            throw "IG4123 preflight failed: trusted Supabase runner not healthy"
          }
          $root = Join-Path (Get-Location) "Services\pipeline-runner"
          if (-not (Test-Path $root)) { throw "IG4123 runner source unavailable" }
          $env:PYTHONPATH = $root
          $python = Get-Command python -ErrorAction SilentlyContinue
          if (-not $python) { throw "IG4123 Python unavailable" }
          $probePath = Join-Path $env:TEMP ("ig4123-readonly-"+[Guid]::NewGuid().ToString("N")+".py")
          $probe = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("__PYBASE64__"))
          [IO.File]::WriteAllText($probePath,$probe)
          try {
            & $python.Source $probePath
            if ($LASTEXITCODE -ne 0) { throw "IG4123 read-only Python diagnostic failed" }
          } finally {
            Remove-Item $probePath -Force -ErrorAction SilentlyContinue
          }
          PS
          python3 -m py_compile /tmp/ig4123-readonly.py
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          payload=base64.b64encode(Path("/tmp/ig4123-readonly.py").read_bytes()).decode()
          script=Path("/tmp/ig4123-readonly.ps1").read_text().replace("__PYBASE64__",payload)
          Path("/tmp/ig4123-request.json").write_text(json.dumps({"command":script,"confirm":True}))
          print("one_exact_provider_get_scope_built=true")
          PY
          BASE="https://ops.chicagoshining.com"
          selected=""
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C"; do
            if [[ -z "$candidate" ]]; then continue; fi
            http=$(curl -sS --max-time 20 -o /tmp/ig4123-catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$http" == "200" ]] && jq -e '.ok==true' /tmp/ig4123-catalog.json >/dev/null 2>&1; then selected="$candidate"; break; fi
          done
          test -n "$selected"
          http=$(curl -sS --max-time 25 -o /tmp/ig4123-submit.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $selected" -H "Content-Type: application/json" --data-binary @/tmp/ig4123-request.json || true)
          if [[ "$http" != "200" && "$http" != "202" ]]; then echo "ig4123_submit_http=$http"; exit 3; fi
          job=$(jq -r '.job.id // .jobId // empty' /tmp/ig4123-submit.json)
          test -n "$job"
          echo "ig4123_shell_job_accepted=true"
          for i in $(seq 1 40); do
            code=$(curl -sS --max-time 20 -o /tmp/ig4123-job.json -w '%{http_code}' -H "Authorization: Bearer $selected" "$BASE/api/jobs/$job" || true)
            if [[ "$code" == "200" ]]; then
              state=$(jq -r '.job.status // empty' /tmp/ig4123-job.json)
              if [[ "$state" == "ok" ]]; then
                jq -r '.job.log // ""' /tmp/ig4123-job.json | grep '^IG4123_RESULT=' | tail -1 | sed 's/^IG4123_RESULT=//' > /tmp/ig4123-result.json
                jq -e '.output_id==4123 and .container_id=="17910781752575604" and .read_only==true' /tmp/ig4123-result.json >/dev/null
                jq -c '{output_id,container_id,status,reason,provider_http,container_status,provider_error_code,provider_error_transient,provider_action}' /tmp/ig4123-result.json
                exit 0
              fi
              if [[ "$state" == "failed" ]]; then
                echo "ig4123_shell_probe_failed_no_provider_verification"
                # Print only specific known safe exception categories; never raw Ops output.
                jq -r '.job.log // ""' /tmp/ig4123-job.json | grep -E 'IG4123_RESULT=|IG4123 |IG4123_|ModuleNotFoundError|Python unavailable|runner source unavailable|runner not healthy|Traceback|ParserError|CommandNotFoundException' | head -15 || true
                exit 4
              fi
            fi
            sleep 3
          done
          echo "ig4123_shell_probe_status_unavailable"
          exit 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ig-story-4123-readonly-result
          path: /tmp/ig4123-result.json
          retention-days: 14
