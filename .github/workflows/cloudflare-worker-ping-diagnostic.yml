name: Cloudflare Worker Ping Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-worker-ping-diagnostic.yml'
      - 'deploy/cloudflare-worker-ping-diagnostic.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: chicagoshining-studio-api
    steps:
      - uses: actions/checkout@v6

      - name: Capture live Worker and settings
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/extract_worker.py <<'PY'
          import re, sys
          from pathlib import Path
          from email.parser import BytesParser
          from email.policy import default
          hp,bp,op=sys.argv[1:4]
          headers=Path(hp).read_text(encoding='latin-1',errors='replace')
          body=Path(bp).read_bytes()
          ms=re.findall(r'(?im)^content-type:\s*([^\r\n]+)',headers)
          ct=ms[-1].strip() if ms else ''
          if 'multipart/' not in ct.lower(): Path(op).write_bytes(body); raise SystemExit(0)
          msg=BytesParser(policy=default).parsebytes(('Content-Type: '+ct+'\r\nMIME-Version: 1.0\r\n\r\n').encode('latin-1')+body)
          for part in msg.walk():
              if not part.is_multipart() and (part.get_filename()=='worker.js' or part.get_param('name',header='content-disposition')=='worker.js'):
                  Path(op).write_bytes(part.get_payload(decode=True)); break
          else: raise SystemExit('worker.js not found')
          PY
          curl -fsS -D /tmp/live.headers \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/content/v2" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/live.multipart
          python /tmp/extract_worker.py /tmp/live.headers /tmp/live.multipart /tmp/live.js
          node --check /tmp/live.js
          sha256sum /tmp/live.js >/tmp/live.sha256
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/settings.json
          jq -e '.success==true' /tmp/settings.json >/dev/null
          jq '.result as $r | {main_module:"worker.js"} + (if $r.compatibility_date then {compatibility_date:$r.compatibility_date} else {} end) + {compatibility_flags:($r.compatibility_flags // [])}' /tmp/settings.json >/tmp/metadata.json

      - name: Build no-subrequest ping Worker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('/tmp/live.js').read_text(encoding='utf-8')
          marker='      const url = new URL(request.url);\n'
          if marker not in src: raise SystemExit('URL marker not found')
          injected='''      const url = new URL(request.url);\n      if (url.pathname === "/__github_e2e_ping") {\n        return new Response(JSON.stringify({ok:true,kind:"no-subrequest-ping"}), {status:200,headers:{"Content-Type":"application/json","Cache-Control":"no-store"}});\n      }\n'''
          Path('/tmp/ping.js').write_text(src.replace(marker,injected,1),encoding='utf-8')
          PY
          node --check /tmp/ping.js

      - name: Read workers.dev location
        id: workersdev
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/subdomain.json
          echo "subdomain=$(jq -er '.result.subdomain' /tmp/subdomain.json)" >> "$GITHUB_OUTPUT"

      - name: Deploy ping Worker
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/content" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata=@/tmp/metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/ping.js;type=application/javascript+module;filename=worker.js')
          if [[ "$code" -lt 200 || "$code" -ge 300 ]]; then jq '{success,errors,messages}' /tmp/deploy.json >&2; exit 1; fi
          jq -e '.success==true' /tmp/deploy.json >/dev/null

      - name: Invoke no-subrequest ping
        shell: bash
        run: |
          set -euo pipefail
          url="https://$WORKER_NAME.${{ steps.workersdev.outputs.subdomain }}.workers.dev/__github_e2e_ping"
          code=$(curl -sS -o /tmp/ping-result.txt -w '%{http_code}' "$url")
          echo "HTTP=$code"
          cat /tmp/ping-result.txt
          test "$code" -eq 200
          jq -e '.ok==true and .kind=="no-subrequest-ping"' /tmp/ping-result.txt >/dev/null

      - name: Restore exact production Worker and settings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s /tmp/live.js && -s /tmp/metadata.json ]]; then
            code=$(curl -sS -o /tmp/restore.json -w '%{http_code}' -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/content" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -F 'metadata=@/tmp/metadata.json;type=application/json' \
              -F 'worker.js=@/tmp/live.js;type=application/javascript+module;filename=worker.js')
            test "$code" -ge 200 -a "$code" -lt 300
            jq -e '.success==true' /tmp/restore.json >/dev/null
            curl -fsS -D /tmp/restored.headers \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/content/v2" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/restored.multipart
            python /tmp/extract_worker.py /tmp/restored.headers /tmp/restored.multipart /tmp/restored.js
            cmp --silent /tmp/live.js /tmp/restored.js
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/settings-restored.json
            jq -e --slurpfile before /tmp/settings.json '(.result.compatibility_date // null)==($before[0].result.compatibility_date // null) and ((.result.compatibility_flags // [])|sort)==(($before[0].result.compatibility_flags // [])|sort)' /tmp/settings-restored.json >/dev/null
          fi
