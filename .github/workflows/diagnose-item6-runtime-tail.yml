name: Diagnose Item6 Runtime Tail

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-item6-runtime-tail.yml'

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      BRIDGE_WORKER: chicagoshining-item6-tail-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - name: Capture active version and build read-only bridge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$ROOT/workers/scripts/$TARGET_WORKER/deployments" -H "$AUTH" -o /tmp/deployments.json
          ACTIVE=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/deployments.json)
          printf '%s' "$ACTIVE" >/tmp/active.txt
          TOKEN=$(python - <<'PY'
          import secrets; print(secrets.token_urlsafe(32))
          PY
          )
          printf '%s' "$TOKEN" >/tmp/token.txt
          cat >/tmp/bridge.js <<EOF
          export default {async fetch(request,env){
            const u=new URL(request.url);
            if(u.pathname==="/$TOKEN/ready") return Response.json({ok:true});
            if(u.pathname!=="/$TOKEN/execute") return new Response("Not found",{status:404});
            const command={action:"state",test_run_id:"ITEM6_CLEANUP_20260817_1217A",lease_id:"ITEM6_DIAG_NONEXISTENT_LEASE",scenario_id:5813561};
            const r=await env.STUDIO_API.fetch(new Request("https://studio-api.internal/api/admin/repair/control",{method:"POST",headers:{"Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com","Origin":"https://studio.chicagoshining.com","Content-Type":"application/json","Accept":"application/json","Cloudflare-Workers-Version-Overrides":"$TARGET_WORKER=\"$ACTIVE\""},body:JSON.stringify(command)}));
            return new Response(await r.text(),{status:r.status,headers:{"Content-Type":r.headers.get("Content-Type")||"text/plain","Cache-Control":"no-store"}});
          }};
          EOF
          cat >/tmp/metadata.json <<EOF
          {"main_module":"bridge.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF
          node --check /tmp/bridge.js
      - name: Upload bridge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -X PUT "$ROOT/workers/scripts/$BRIDGE_WORKER/content" -H "$AUTH" -F 'metadata=@/tmp/metadata.json;type=application/json' -F 'bridge.js=@/tmp/bridge.js;type=application/javascript+module;filename=bridge.js' -o /tmp/upload.json
          jq -e '.success==true' /tmp/upload.json >/dev/null
          curl -fsS -X POST "$ROOT/workers/scripts/$BRIDGE_WORKER/subdomain" -H "$AUTH" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' >/tmp/sub.json
          curl -fsS "$ROOT/workers/subdomain" -H "$AUTH" -o /tmp/account-subdomain.json
          SUB=$(jq -er '.result.subdomain' /tmp/account-subdomain.json); T=$(cat /tmp/token.txt)
          for i in $(seq 1 20); do
            code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' "https://$BRIDGE_WORKER.$SUB.workers.dev/$T/ready" || true)
            [[ "$code" == 200 ]] && break
            sleep 1
          done
          test "$code" = 200
      - name: Tail exact version and invoke state miss
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE=$(cat /tmp/active.txt)
          SUB=$(jq -er '.result.subdomain' /tmp/account-subdomain.json); T=$(cat /tmp/token.txt)
          : >/tmp/tail.log
          timeout 35s npx --yes wrangler@4 tail "$TARGET_WORKER" --format json --status error --version-id "$ACTIVE" > /tmp/tail.log 2>&1 &
          TAILPID=$!
          sleep 7
          code=$(curl -sS --max-time 30 -o /tmp/result.txt -w '%{http_code}' "https://$BRIDGE_WORKER.$SUB.workers.dev/$T/execute" || true)
          echo "bridge_http=$code"
          cat /tmp/result.txt || true
          sleep 7
          kill "$TAILPID" 2>/dev/null || true
          wait "$TAILPID" 2>/dev/null || true
          echo '---TAIL---'
          cat /tmp/tail.log
          test -s /tmp/tail.log
      - name: Delete bridge
        if: always()
        shell: bash
        run: |
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$ROOT/workers/scripts/$BRIDGE_WORKER" -H "$AUTH" >/dev/null || true
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item6-runtime-tail-${{ github.run_id }}
          path: |
            /tmp/tail.log
            /tmp/result.txt
            /tmp/deployments.json
          if-no-files-found: ignore
          retention-days: 14
