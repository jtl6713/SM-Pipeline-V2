name: Repair Item 9 Native Platform Covers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/repair-item9-native-covers.txt'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Patch Instagram, YouTube, and Facebook native cover attach
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m py_compile repair/scripts/patch-item9-native-covers.py
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:CLOUDFLARE_API_TOKEN \
            -in deploy/credential-envelope/private.pem.enc \
            -out /tmp/key.pem
          base64 -d deploy/credential-envelope/airtable_pat.ciphertext.b64 >/tmp/pat.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/key.pem \
            -in /tmp/pat.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out /tmp/pat.txt
          PAT=$(tr -d '\r\n' </tmp/pat.txt)
          python - <<'PY' >/tmp/settings-query.txt
          import urllib.parse
          formula = "AND({Active}=1,OR({Setting_Name}='MAKE_API_TOKEN',{Setting_Name}='MAKE_API_BASE_URL'))"
          print(urllib.parse.urlencode([
              ("filterByFormula", formula),
              ("fields[]", "Setting_Name"),
              ("fields[]", "Setting_Value"),
          ]))
          PY
          curl -fsS \
            "https://api.airtable.com/v0/appe33zkZn35yirTL/tblpHPWeEkyJaF7ql?$(cat /tmp/settings-query.txt)" \
            -H "Authorization: Bearer $PAT" \
            -o /tmp/settings.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/settings.json").read_text())
          values = {
              row["fields"].get("Setting_Name"): row["fields"].get("Setting_Value")
              for row in data.get("records", [])
          }
          Path("/tmp/make-token.txt").write_text(str(values["MAKE_API_TOKEN"]).strip())
          Path("/tmp/make-base.txt").write_text(str(values["MAKE_API_BASE_URL"]).strip().rstrip("/"))
          PY
          export MAKE_TOKEN="$(cat /tmp/make-token.txt)"
          export MAKE_BASE="$(cat /tmp/make-base.txt)"
          export ITEM9_EVIDENCE="/tmp/item9-cover-proof.json"
          python repair/scripts/patch-item9-native-covers.py
          jq -e '.passed == true and .public_platform_operations == 0' /tmp/item9-cover-proof.json >/dev/null

      - name: Upload sanitized Item 9 cover-contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item9-native-covers-${{ github.run_id }}
          path: /tmp/item9-cover-proof.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Destroy transient credentials
        if: always()
        shell: bash
        run: |
          rm -f /tmp/key.pem /tmp/pat.enc /tmp/pat.txt /tmp/settings-query.txt \
            /tmp/settings.json /tmp/make-token.txt /tmp/make-base.txt \
            /tmp/item9-cover-proof.json
