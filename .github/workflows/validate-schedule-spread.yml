name: Validate Schedule Spread Fix

on:
  push:
    branches: [main]
    paths:
      - 'deploy/validate-schedule-spread.txt'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        shell: bash
        run: |
          set -euo pipefail
          cp apps/studio-web/assets/app-item4-0625.js /tmp/app.mjs
          cp apps/studio-web/assets/ez-plan.js /tmp/ez-plan.mjs
          cp apps/studio-api/worker.js /tmp/worker.mjs
          node --check /tmp/app.mjs
          node --check /tmp/ez-plan.mjs
          node --check /tmp/worker.mjs
      - name: Schedule regression tests
        run: |
          node --test             apps/studio-ez-plan/suggested-schedules.test.mjs             apps/studio-ez-plan/az-schedules.test.mjs             apps/studio-web/pipeline-schedule-grid.test.mjs             apps/studio-api/schedule-override.test.mjs
