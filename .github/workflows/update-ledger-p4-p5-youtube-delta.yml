name: Update Ledger P4 P5 YouTube Delta

on:
  push:
    branches: [main]
    paths: ['deploy/update-ledger-p4-p5-youtube-delta.txt']

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update authoritative 21-item ledger
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('repair/SM_PIPELINE_21_ITEM_LEDGER.md')
          s=p.read_text(encoding='utf-8')
          def row(n,new):
              global s
              pat=rf'^\| {n} \|.*$'
              s2,c=re.subn(pat,new,s,count=1,flags=re.M)
              if c!=1: raise SystemExit(f'ledger row {n} not found exactly once')
              s=s2
          row(2,'| 2 | Stage-specific, exact-output-addressable orchestrators | **In progress — materially advanced; R2→P4/P5 identity seam hardened** | R4 `5556716` live proof and R5 controlled-pulse isolation remain valid. TTD-ORCH `5806668` and AP-CAR-ORCH `5791537` production selectors were explicitly hardened; TTD0–TTD3 and AP0C–AP5C are exact-output webhook workers. I4 `5524092` Module 1 is exact webhook-targeted. Fresh publishing audit reconfirmed IG/FB/TikTok/YT selectors are stage-specific, max-one, and exclude `{Test_Run_ID}` rows. R2 `5569495` Modules 20/21 now pass `test_run_id` to P4; P4 `5533802` Module 42 requires exact `Output_ID` plus matching test identity; P4 propagates identity into Asset Requests/Shots and refuses cross-boundary reconciliation; P5 `5536624` Module 1 excludes test shots. | Continue remaining exact-addressing inventory for C3/C3B/PUB3/SMV1 and other non-Platform-Output workers; preserve normal R5 production batching and all webhook identities. |')
          row(5,'| 5 | Genuine hard test mode | **Partial — durable identity boundary extended through P4/P5 asset-request path** | Durable `Test_Run_ID` is live on Idea Candidates, Production Requests, Content Items, Production Request Outputs, Platform Outputs, Asset Requests, and Asset Request Shots. Production selectors exclude tagged rows. Controller positive/mismatch/blank/non-allowlist acceptance remains proven. R2→P4 now carries test identity; P4 exact entrance matches that identity, propagates it to created/reconciled Asset Requests and Shots, suppresses the real P4 email for test rows, and P5 excludes tagged shots from reminders. | Harden remaining side-effect/worker gaps (C3 email, C3B review actions, PUB3 manual completion, SMV1 and any remaining global asset workers), then prove deterministic cleanup and production-negative behavior end-to-end. |')
          row(11,'| 11 | YouTube OAuth and upload/thumbnail chain | **Upload chain functional — durable OAuth configuration remains** | Output 151 was recovered successfully through exact workers YTP1→YTS1→YTS2→YTS3 while YT-ORCH stayed OFF. Final state: `YouTube_Stage=Complete`, `YouTube_Upload_Status=Uploaded`, `YouTube_Processing_Status=Succeeded`, `Publish_Status=Published Privately`, video ID `4HAhk2Lg7GE`, idempotency key `YT-151-recXaaWhSZmQ9oOsw-oauthretry-4`. Root cause was a truncated local refresh token; automatic token capture and uploader restart on port 3340 corrected it. | Move the Google OAuth app out of short-lived Testing-token behavior / complete the appropriate durable production OAuth configuration, then validate token persistence and the thumbnail portion without republishing Output 151. |')
          row(21,'| 21 | Repair scope/change-control and evidence-backed completion | **Partial — ledger active and current** | Permanent ordered ledger includes R4 target/denial proof, R5 pulse isolation, AP0 versioned proof, controller lease/Test Mode acceptance, current publishing selector audit, C7/C8 exactness, successful YouTube Output 151 recovery, and rollback-safe R2/P4/P5 Test Mode identity hardening. | Continue ledger after each meaningful repair and require deterministic positive/negative evidence before marking each remaining item complete. |')
          marker='## 2026-08-16 continuation delta — P4/P5 Test Mode identity + YouTube recovery\n'
          if marker not in s:
              block='''\n\n## 2026-08-16 continuation delta — P4/P5 Test Mode identity + YouTube recovery\n\n- YouTube Output 151 recovered successfully with video ID `4HAhk2Lg7GE`; exact YTP1→YTS1→YTS2→YTS3 chain completed while YT-ORCH remained OFF. OAuth Testing-mode token lifetime remains the durable configuration gap.\n- Fresh live publishing selector audit reconfirmed IG, Facebook, TikTok, and YouTube selectors exclude test-tagged Platform Outputs and remain stage-specific/max-one.\n- Added durable `Test_Run_ID` to Asset Requests (`fldZFl683gtrEurEM`) and Asset Request Shots (`fldg2LWKkmu7w1Yyj`).\n- R2 `5569495` Modules 20/21 now pass `test_run_id` to P4.\n- P4 `5533802` Module 42 now requires exact Output ID plus matching/blank Test Mode identity; Modules 10/44 propagate identity to Asset Requests; Modules 17/50 propagate identity to Asset Request Shots; Module 44 only reconciles within the same identity boundary; Module 12 suppresses real asset-request email for test-tagged work. Webhook `2567873` and topology/state were preserved.\n- P5 `5536624` Module 1 now filters `{Test_Run_ID}=BLANK()` while preserving its existing view, sort, and 200-record production reminder behavior.\n- Rollback-safe repair run `31988766540` completed successfully with sanitized evidence and no scenario topology/state drift.\n'''
              idx=s.find('\n## Evidence')
              if idx<0: s+=block
              else: s=s[:idx]+block+s[idx:]
          s=re.sub(r'^Updated: .*$', 'Updated: 2026-08-16 UTC  ', s, count=1, flags=re.M)
          p.write_text(s,encoding='utf-8')
      - name: Commit ledger update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SM Pipeline Repair Ledger"
          git config user.email "actions@users.noreply.github.com"
          git add repair/SM_PIPELINE_21_ITEM_LEDGER.md
          git diff --cached --quiet && exit 0
          git commit -m "Update ledger for P4 P5 Test Mode and YouTube recovery"
          git push
