name: Overdue IG recovery - three exact Reels after Facebook wave 2

on:
  workflow_run:
    workflows: ['Overdue recovery wave 2 - eight exact approved Facebook Reels']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: overdue-ig-three-after-fb-wave-20261120
  cancel-in-progress: false

jobs:
  exact-canary:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - {output_number: 3157, record_id: recTcCablBCgvLY0C}
          - {output_number: 2923, record_id: recLYqTD5sjme062r}
          - {output_number: 3365, record_id: recKAEmp0oKm0RtCG}
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - name: Authenticate with existing approved Ops API
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C"; do
            test -n "$candidate" || continue
            code=$(curl -sS --max-time 20 -o /tmp/ops-catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" 'https://ops.chicagoshining.com/api/catalog' || true)
            if [[ "$code" == '200' ]] && jq -e '.ok==true' /tmp/ops-catalog.json >/dev/null; then
              echo "::add-mask::$candidate"
              echo "RECOVERY_OPS_TOKEN=$candidate" >>"$GITHUB_ENV"
              exit 0
            fi
          done
          echo "Approved Ops credential unavailable"; exit 1
      - name: Execute one exact, reviewed, rendered IG Reel through native runner
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/meta-ig-${{ matrix.output_number }}.ps1 <<'PS'
          $ErrorActionPreference="Stop"
          $record="${{ matrix.record_id }}"
          $health=Invoke-RestMethod -Uri "http://127.0.0.1:3350/health" -TimeoutSec 20
          if ($health.ok -ne $true -or $health.studio_write_source -ne "supabase" -or $health.studio_runner_output_read_source -ne "supabase" -or $health.supabase_pipeline_writes -ne $true) { throw "runner_not_supabase_authoritative" }
          $envfile=Join-Path (Get-Location) "Services\pipeline-runner\service\.env"
          if (-not (Test-Path $envfile)) { throw "runner_env_missing" }
          function EnvValue([string]$key) {
             $line=@(Get-Content $envfile | Where-Object {$_ -match ("^\s*"+[regex]::Escape($key)+"\s*=")}) | Select-Object -Last 1
             if (-not $line) { throw "missing_required_env" }
             return ([string]$line -split '=',2)[1].Trim().Trim('"',"'")
          }
          $secret=EnvValue "PIPELINE_RUNNER_SHARED_SECRET"
          $dburl=EnvValue "SUPABASE_URL"
          $dbkey=EnvValue "SUPABASE_SERVICE_ROLE_KEY"
          if (-not $secret -or -not $dburl -or -not $dbkey) { throw "missing_runner_auth" }
          $h=@{apikey=$dbkey;Authorization=("Bearer "+$dbkey)}
          $url=$dburl.TrimEnd("/")+"/rest/v1/platform_outputs?airtable_record_id=eq."+$record+"&select=airtable_record_id,output_number,platform,platform_output_type,review_status,output_status,publish_status,render_status,publish_method,auto_publish_enabled,do_not_publish,test_run_id,published_at,platform_post_url,publish_asset_url,publish_next_retry_at,error_messages"
          $rows=@(Invoke-RestMethod -Uri $url -Headers $h -TimeoutSec 25)
          if ($rows.Count -ne 1) { throw "exact_output_ambiguous" }
          $o=$rows[0]
          if ($o.output_number -ne ${{ matrix.output_number }} -or $o.platform -ne "Instagram" -or $o.platform_output_type -ne "Instagram Reel" -or
              $o.review_status -ne "Approved" -or $o.output_status -ne "Approved for Publishing" -or $o.publish_status -ne "Ready to Publish" -or
              $o.render_status -ne "Rendered" -or $o.publish_method -ne "Automated" -or $o.auto_publish_enabled -ne $true -or $o.do_not_publish -ne $false -or
              $o.test_run_id -or $o.published_at -or $o.platform_post_url -or -not $o.publish_asset_url -or
              $o.error_messages.Platform_Post_ID -or $o.error_messages.Platform_Media_ID -or $o.error_messages.Publish_Locked_By -or
              $o.error_messages.Studio_Render_Review_Hold_Active -or $o.error_messages.Studio_Render_Review_Hold_ID -or $o.error_messages.Studio_Review_Hold_ID -or
              $o.error_messages.Publish_Locked_At -or $o.error_messages.Publish_Started_At -or
              $o.error_messages.Backlog_20261120_Recovery_State -ne "exact_one_shot_retry_ready" -or
              -not ([string]$o.publish_next_retry_at).StartsWith("2099-01-01")) {
              throw "exact_ig_${{ matrix.output_number }}_safety_gate_failed"
          }
          $head=Invoke-WebRequest -Uri $o.publish_asset_url -Method Head -UseBasicParsing -TimeoutSec 40
          if ([int]$head.StatusCode -ne 200 -or $head.Headers["Content-Type"] -notmatch "video/mp4") { throw "ig_public_mp4_unavailable" }
          $headers=@{"X-Pipeline-Secret"=$secret}
          function RunStage([bool]$dry) {
              $body=@{output_record_id=$record;extra=@{dry_run=$dry}} | ConvertTo-Json -Depth 5 -Compress
              return Invoke-RestMethod -Uri "http://127.0.0.1:3350/stages/ap1_ig" -Method POST -Headers $headers -Body $body -ContentType "application/json" -TimeoutSec 240
          }
          $preview=RunStage $true
          if ($preview.status -ne "ok" -or $preview.details.run.dry_run -ne $true -or $preview.details.run.eligibility_reason) { throw "ig_dry_run_refused" }
          Write-Output "ig_${{ matrix.output_number }}_dry_run=PASS"
          $result=RunStage $false
          Write-Output ("ig_${{ matrix.output_number }}_stage_status="+[string]$result.status)
          Write-Output ("ig_${{ matrix.output_number }}_reason="+[string]$result.details.run.reason)
          if ($result.details.run.media_id) { Write-Output ("ig_${{ matrix.output_number }}_media_id="+[string]$result.details.run.media_id) }
          if ($result.details.run.creation_id) { Write-Output ("ig_${{ matrix.output_number }}_creation_id="+[string]$result.details.run.creation_id) }
          if ($result.details.run.permalink) { Write-Output ("ig_${{ matrix.output_number }}_permalink="+[string]$result.details.run.permalink) }
          if ($result.status -eq "error") { throw "ig_runner_stage_error" }
          if ($result.status -eq "skipped" -and $result.details.run.reason -ne "container_in_progress") { throw "ig_runner_stage_skipped" }
          $published=$false
          for ($check=0; $check -lt 18; $check++) {
            Start-Sleep -Seconds 5
            $read=@(Invoke-RestMethod -Uri $url -Headers $h -TimeoutSec 30)
            if ($read.Count -ne 1) { throw "ig_provider_receipt_readback_ambiguous" }
            if ($read[0].publish_status -eq "Published" -and $read[0].published_at -and
                $read[0].platform_post_url -and $read[0].error_messages.Platform_Post_ID) {
              $published=$true
              Write-Output ("ig_confirmed_permalink="+[string]$read[0].platform_post_url)
              break
            }
          }
          if (-not $published) { throw "instagram_publish_receipt_not_confirmed" }
          PS
          python3 - <<'PY'
          import pathlib,json
          pathlib.Path('/tmp/meta-ig-${{ matrix.output_number }}.json').write_text(json.dumps({
             "command":pathlib.Path('/tmp/meta-ig-${{ matrix.output_number }}.ps1').read_text(),
             "confirm":True}))
          PY
          code=$(curl -sS --max-time 30 -o /tmp/ops-start.json -w '%{http_code}' \
             -X POST 'https://ops.chicagoshining.com/api/shell' \
             -H "Authorization: Bearer $RECOVERY_OPS_TOKEN" -H 'Content-Type: application/json' \
             --data-binary @/tmp/meta-ig-${{ matrix.output_number }}.json || true)
          if [[ "$code" != 200 && "$code" != 202 ]]; then echo "Ops rejected exact canary: http=$code"; exit 2; fi
          job=$(jq -er '.job.id // .jobId' /tmp/ops-start.json)
          for n in $(seq 1 150); do
            curl -fsS --max-time 30 -H "Authorization: Bearer $RECOVERY_OPS_TOKEN" \
                "https://ops.chicagoshining.com/api/jobs/$job" -o /tmp/ops-status.json
            status=$(jq -r '.job.status // empty' /tmp/ops-status.json)
            if [[ "$status" == ok ]]; then
              jq -r '.job.log // ""' /tmp/ops-status.json | grep '^ig_${{ matrix.output_number }}_' || true
              exit 0
            elif [[ "$status" == failed ]]; then
              jq -r '.job.log // ""' /tmp/ops-status.json | tail -25
              exit 3
            fi
            sleep 4
          done
          echo "Ops exact canary not confirmed"; exit 4
