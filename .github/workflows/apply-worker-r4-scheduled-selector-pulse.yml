name: Apply Worker R4 Scheduled Selector Pulse

on:
  push:
    branches: [main]
    paths:
      - 'deploy/apply-worker-r4-scheduled-selector-pulse.txt'

permissions:
  contents: write

concurrency:
  group: apply-worker-r4-scheduled-selector-pulse
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply narrowly scoped scheduled-selector pulse patch
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(git hash-object apps/studio-api/worker.js)
          python repair/tools/patch_worker_r4_scheduled_selector_pulse.py | tee /tmp/patch-output.txt
          cp apps/studio-api/worker.js /tmp/studio-worker.mjs
          node --check /tmp/studio-worker.mjs
          git diff --check
          CHANGED=$(git diff --name-only)
          test "$CHANGED" = 'apps/studio-api/worker.js'
          grep -q 'r4_scheduled_selector_pulse_patch=applied' /tmp/patch-output.txt
          grep -q 'repair_r4_scheduled_selector_pulse_v1: true' apps/studio-api/worker.js
          grep -q 'action === "pulse_r4_scheduled_selector"' apps/studio-api/worker.js
          grep -q 'Standalone ACTIVATE/RUN is intentionally disabled' apps/studio-api/worker.js
          AFTER=$(git hash-object apps/studio-api/worker.js)
          test "$BEFORE" != "$AFTER"
          printf '{"before_blob":"%s","after_blob":"%s","scope":"new bounded R4 scheduled-selector test pulse only"}\n' "$BEFORE" "$AFTER" >/tmp/evidence.json
      - name: Commit patched Studio API source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SM Pipeline Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/studio-api/worker.js
          git commit -m 'fix: add bounded R4 scheduled-selector pulse'
          git push origin HEAD:main
      - name: Upload patch evidence
        uses: actions/upload-artifact@v4
        with:
          name: r4-scheduled-selector-pulse-source-${{ github.run_id }}
          path: /tmp/evidence.json
          retention-days: 30
