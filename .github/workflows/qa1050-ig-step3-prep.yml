name: QA1050 IG Carousel Existing-Output Prep via Ops
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa1050-ig-step3-prep.yml'
permissions:
  contents: read
concurrency:
  group: qa1050-ig-step3-exact-prep
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify bounded prepublish stages
        shell: bash
        run: |
          set -euo pipefail
          f='deploy/local-services/qa1050-ig-step3-prepare.ps1'
          grep -Fq "'1023'='rec8okeb4bPKvt6FP'" "$f"
          grep -Fq "'1076'='recsq0S1FeqDP0pZb'" "$f"
          grep -Fq "Invoke-Stage 'ap0c'" "$f"
          grep -Fq "Invoke-Stage 'ap1c'" "$f"
          if grep -Ein 'Invoke-Stage .*(ap3c|ap4c|ap4r|ap5c|yt0|ttd0|publish)' "$f"; then exit 8; fi
      - name: Use existing authorized Ops shell for two exact isolated outputs
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          token=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            test -n "$candidate" || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then token="$candidate"; break; fi
          done
          test -n "$token"
          for target in 1023 1076; do
            jq -Rs --arg t "$target" '{command:("$TargetId = \u0027"+$t+"\u0027\n"+.),confirm:true}' \
              < deploy/local-services/qa1050-ig-step3-prepare.ps1 > /tmp/prep.json
            code=$(curl -sS --max-time 30 -o /tmp/job-submit.json -w '%{http_code}' -X POST "$BASE/api/shell" \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @/tmp/prep.json || true)
            test "$code" == 202
            jq -e '.ok==true and .job.action=="shell" and .job.id!=null' /tmp/job-submit.json >/dev/null
            job=$(jq -r '.job.id' /tmp/job-submit.json)
            echo "Submitted exact prepublish preparation $target"
            completed=''
            for i in $(seq 1 140); do
              code=$(curl -sS --max-time 20 -o /tmp/job.json -w '%{http_code}' -H "Authorization: Bearer $token" "$BASE/api/jobs/$job" || true)
              if [[ "$code" == 200 ]]; then
                status=$(jq -r '.job.status // empty' /tmp/job.json)
                if [[ "$status" == ok || "$status" == failed ]]; then
                  jq -r '.job.log // ""' /tmp/job.json | grep -E '"output_id"|QA1050_IG_PREPARED|failed for output|Exception' || true
                  jq -c '{ok,job:{status:.job.status,exitCode:.job.exitCode}}' /tmp/job.json
                  test "$status" == ok
                  completed=yes
                  break
                fi
              fi
              sleep 2
            done
            test "$completed" == yes
          done
