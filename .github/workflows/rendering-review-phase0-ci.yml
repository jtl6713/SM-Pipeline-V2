name: Rendering Review Phase 0 CI

on:
  pull_request:
    paths:
      - 'apps/studio-api/rendering-review-policy.*'
      - 'apps/studio-api/rendering-review-coordinator.*'
      - 'apps/studio-api/rendering-review-airtable.*'
      - 'apps/studio-api/rendering-review-output-view.*'
      - 'apps/studio-api/rendering-review-workspace.*'
      - 'apps/studio-api/rendering-review-feedback.*'
      - 'apps/studio-api/rendering-review-feedback-http.*'
      - 'apps/studio-api/rendering-review-schedule-owner.*'
      - 'apps/studio-api/rendering-review-enrollment-http.*'
      - 'apps/studio-api/rendering-review-enrollment-wiring.*'
      - 'apps/studio-api/worker.js'
      - 'apps/studio-web/rendering-review-ui.test.mjs'
      - 'apps/studio-web/rendering-review-queue.test.mjs'
      - 'apps/studio-web/assets/rendering-review-queue.*'
      - 'apps/studio-web/index.html'
      - '.github/workflows/rendering-review-phase0-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-review-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check policy and tests syntax
        run: |
          node --check apps/studio-api/rendering-review-policy.mjs
          node --check apps/studio-api/rendering-review-policy.test.mjs
          node --check apps/studio-api/rendering-review-coordinator.mjs
          node --check apps/studio-api/rendering-review-coordinator.test.mjs
          node --check apps/studio-api/rendering-review-airtable.mjs
          node --check apps/studio-api/rendering-review-output-view.mjs
          node --check apps/studio-api/rendering-review-airtable.test.mjs
          node --check apps/studio-api/rendering-review-workspace.mjs
          node --check apps/studio-api/rendering-review-workspace.test.mjs
          node --check apps/studio-api/rendering-review-feedback.mjs
          node --check apps/studio-api/rendering-review-feedback.test.mjs
          node --check apps/studio-api/rendering-review-feedback-http.mjs
          node --check apps/studio-api/rendering-review-feedback-http.test.mjs
          node --check apps/studio-api/rendering-review-schedule-owner.mjs
          node --check apps/studio-api/rendering-review-schedule-owner.test.mjs
          node --check apps/studio-api/rendering-review-enrollment-http.mjs
          node --check apps/studio-api/rendering-review-enrollment-http.test.mjs
          node --check apps/studio-api/rendering-review-enrollment-wiring.mjs
          node --check apps/studio-api/rendering-review-enrollment-wiring.test.mjs
      - name: Chicago pilot lifecycle and safety contracts
        run: node --test apps/studio-api/rendering-review-policy.test.mjs apps/studio-api/rendering-review-coordinator.test.mjs apps/studio-api/rendering-review-airtable.test.mjs apps/studio-api/rendering-review-workspace.test.mjs apps/studio-api/rendering-review-feedback.test.mjs apps/studio-api/rendering-review-feedback-http.test.mjs apps/studio-api/rendering-review-schedule-owner.test.mjs apps/studio-api/rendering-review-enrollment-http.test.mjs apps/studio-api/rendering-review-enrollment-wiring.test.mjs
      - name: Rendering Review read-only Studio interface contracts
        run: |
          node --check apps/studio-web/assets/rendering-review-queue.js
          node --test apps/studio-web/rendering-review-ui.test.mjs apps/studio-web/rendering-review-queue.test.mjs
      - name: Existing producer selective rework regression
        run: node --test apps/studio-api/conversational-producer-plan.test.mjs apps/studio-api/producer-conversation.test.mjs apps/studio-api/output-approval-lease.test.mjs
