name: Rendering Review Phase 0 CI

on:
  pull_request:
    paths:
      - 'apps/studio-api/rendering-review-approval-http.*'
      - 'apps/studio-api/rendering-review-policy.*'
      - 'apps/studio-api/rendering-review-held-redo.*'
      - 'apps/studio-api/rendering-review-factory-entry-gate.test.mjs'
      - 'apps/studio-api/rendering-review-factory-handoff.*'
      - 'apps/studio-api/rendering-review-watermark-policy.*'
      - 'apps/studio-api/rendering-review-factory-return.*'
      - 'apps/studio-api/rendering-review-factory-accept-held.*'
      - 'apps/studio-api/rendering-review-factory-preview.*'
      - 'apps/studio-api/rendering-review-factory-bridge.test.mjs'
      - 'apps/studio-api/rendering-review-plan-preflight.*'
      - 'apps/studio-api/rendering-review-plan-persist.*'
      - 'apps/studio-api/rendering-review-attempt-outbox.*'
      - 'apps/studio-api/rendering-review-job-claim.*'
      - 'apps/studio-api/rendering-review-launch-ledger.*'
      - 'apps/studio-api/rendering-review-completion-http.*'
      - 'services/pipeline-runner/rendering_review/remote_ledger.py'
      - 'services/pipeline-runner/rendering_review/outbox_claim.py'
      - 'services/pipeline-runner/rendering_review/one_job.py'
      - 'services/pipeline-runner/tests/test_rendering_review_variant_binding.py'
      - 'services/pipeline-runner/rendering_review/one_job_http.py'
      - 'services/pipeline-runner/rendering_review/media_http.py'
      - 'services/pipeline-runner/tests/test_rendering_review_media_http.py'
      - 'services/pipeline-runner/tests/test_rendering_review_outbox_claim.py'
      - 'services/pipeline-runner/tests/test_rendering_review_remote_ledger.py'
      - 'apps/studio-api/rendering-review-outbox-airtable.*'
      - 'apps/studio-api/rendering-review-coordinator.*'
      - 'apps/studio-api/rendering-review-airtable.*'
      - 'apps/studio-api/rendering-review-output-view.*'
      - 'apps/studio-api/rendering-review-workspace.*'
      - 'apps/studio-api/rendering-review-attempt-video.*'
      - 'apps/studio-api/rendering-review-feedback.*'
      - 'apps/studio-api/rendering-review-feedback-http.*'
      - 'apps/studio-api/rendering-review-schedule-owner.*'
      - 'apps/studio-api/rendering-review-enrollment-http.*'
      - 'apps/studio-api/rendering-review-enrollment-wiring.*'
      - 'apps/studio-api/rendering-review-enrollment-route.*'
      - 'apps/studio-api/rendering-review-producer-bridge.*'
      - 'apps/studio-api/rendering-review-producer-persist.*'
      - 'apps/studio-api/rendering-review-ig-dispatch-claim.*'
      - 'services/pipeline-runner/publish/review_dispatch_claim.py'
      - 'services/pipeline-runner/ap1_ig/processor.py'
      - 'services/pipeline-runner/tests/test_review_dispatch_claim.py'
      - 'apps/studio-api/worker.js'
      - 'apps/studio-web/rendering-review-ui.test.mjs'
      - 'apps/studio-web/rendering-review-queue.test.mjs'
      - 'apps/studio-web/assets/rendering-review-queue.*'
      - 'apps/studio-web/index.html'
      - '.github/workflows/rendering-review-phase0-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-review-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check policy and tests syntax
        run: |
          node --check apps/studio-api/rendering-review-approval-http.mjs
          node --check apps/studio-api/rendering-review-approval-http.test.mjs
          node --check apps/studio-api/rendering-review-held-redo.mjs
          node --check apps/studio-api/rendering-review-held-redo.test.mjs
          node --check apps/studio-api/rendering-review-policy.mjs
          node --check apps/studio-api/rendering-review-policy.test.mjs
          node --check apps/studio-api/rendering-review-plan-preflight.mjs
          node --check apps/studio-api/rendering-review-plan-preflight.test.mjs
          node --check apps/studio-api/rendering-review-plan-persist.mjs
          node --check apps/studio-api/rendering-review-plan-persist.test.mjs
          node --check apps/studio-api/rendering-review-attempt-outbox.mjs
          node --check apps/studio-api/rendering-review-attempt-outbox.test.mjs
          node --check apps/studio-api/rendering-review-job-claim.mjs
          node --check apps/studio-api/rendering-review-job-claim.test.mjs
          node --check apps/studio-api/rendering-review-launch-ledger.mjs
          node --check apps/studio-api/rendering-review-launch-ledger.test.mjs
          node --check apps/studio-api/rendering-review-completion-http.mjs
          node --check apps/studio-api/rendering-review-completion-http.test.mjs
          node --check apps/studio-api/rendering-review-outbox-airtable.mjs
          node --check apps/studio-api/rendering-review-outbox-airtable.test.mjs
          node --check apps/studio-api/rendering-review-coordinator.mjs
          node --check apps/studio-api/rendering-review-coordinator.test.mjs
          node --check apps/studio-api/rendering-review-airtable.mjs
          node --check apps/studio-api/rendering-review-output-view.mjs
          node --check apps/studio-api/rendering-review-airtable.test.mjs
          node --check apps/studio-api/rendering-review-workspace.mjs
          node --check apps/studio-api/rendering-review-workspace.test.mjs
          node --check apps/studio-api/rendering-review-attempt-video.mjs
          node --check apps/studio-api/rendering-review-attempt-video.test.mjs
          node --check apps/studio-api/rendering-review-feedback.mjs
          node --check apps/studio-api/rendering-review-feedback.test.mjs
          node --check apps/studio-api/rendering-review-feedback-http.mjs
          node --check apps/studio-api/rendering-review-feedback-http.test.mjs
          node --check apps/studio-api/rendering-review-schedule-owner.mjs
          node --check apps/studio-api/rendering-review-schedule-owner.test.mjs
          node --check apps/studio-api/rendering-review-enrollment-http.mjs
          node --check apps/studio-api/rendering-review-enrollment-http.test.mjs
          node --check apps/studio-api/rendering-review-enrollment-wiring.mjs
          node --check apps/studio-api/rendering-review-enrollment-wiring.test.mjs
          node --check apps/studio-api/rendering-review-enrollment-route.test.mjs
          node --check apps/studio-api/rendering-review-producer-bridge.mjs
          node --check apps/studio-api/rendering-review-producer-bridge.test.mjs
          node --check apps/studio-api/rendering-review-producer-persist.mjs
          node --check apps/studio-api/rendering-review-producer-persist.test.mjs
          node --check apps/studio-api/rendering-review-ig-dispatch-claim.mjs
          node --check apps/studio-api/rendering-review-ig-dispatch-claim.test.mjs
      - name: Accepted V2 to Factory handoff unit and fail-safe regression
        run: |
          node --check apps/studio-api/rendering-review-factory-handoff.mjs
          node --check apps/studio-api/rendering-review-factory-handoff.test.mjs apps/studio-api/rendering-review-factory-bridge.test.mjs
          node --test apps/studio-api/rendering-review-watermark-policy.test.mjs apps/studio-api/rendering-review-factory-handoff.test.mjs apps/studio-api/rendering-review-factory-entry-gate.test.mjs
      - name: Chicago pilot lifecycle and safety contracts
        run: node --test apps/studio-api/rendering-review-factory-accept-held.test.mjs apps/studio-api/rendering-review-held-redo.test.mjs apps/studio-api/rendering-review-audio-qa-repair.test.mjs apps/studio-api/rendering-review-approval-http.test.mjs apps/studio-api/rendering-review-completion-http.test.mjs apps/studio-api/rendering-review-launch-ledger.test.mjs apps/studio-api/rendering-review-job-claim.test.mjs apps/studio-api/rendering-review-outbox-airtable.test.mjs apps/studio-api/rendering-review-attempt-outbox.test.mjs apps/studio-api/rendering-review-plan-preflight.test.mjs apps/studio-api/rendering-review-plan-persist.test.mjs apps/studio-api/rendering-review-policy.test.mjs apps/studio-api/rendering-review-coordinator.test.mjs apps/studio-api/rendering-review-airtable.test.mjs apps/studio-api/rendering-review-workspace.test.mjs apps/studio-api/rendering-review-attempt-video.test.mjs apps/studio-api/rendering-review-feedback.test.mjs apps/studio-api/rendering-review-feedback-http.test.mjs apps/studio-api/rendering-review-schedule-owner.test.mjs apps/studio-api/rendering-review-enrollment-http.test.mjs apps/studio-api/rendering-review-enrollment-wiring.test.mjs apps/studio-api/rendering-review-enrollment-route.test.mjs apps/studio-api/rendering-review-producer-bridge.test.mjs apps/studio-api/rendering-review-producer-persist.test.mjs apps/studio-api/rendering-review-ig-dispatch-claim.test.mjs
      - name: Python AP1-IG common owner fail-closed contracts
        run: PYTHONPATH=services/pipeline-runner python -m unittest discover -s services/pipeline-runner/tests -p 'test_review_dispatch_claim.py' -v
      - name: Protected render ledger HTTP bridge tests
        run: PYTHONPATH=services/pipeline-runner python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_remote_ledger.py' -v
      - name: Bounded Runner outbox claim stage (OFF by default)
        run: PYTHONPATH=services/pipeline-runner python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_outbox_claim.py' -v
      - name: Frozen crop-to-Remotion Runner contract (no live calls)
        run: PYTHONPATH=services/pipeline-runner python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_variant_binding.py' -v
      - name: Protected V2 Google Drive stream and hold-ownership tests
        run: |
          python -m pip install --disable-pip-version-check 'Flask>=3,<4' 'requests>=2,<3'
          PYTHONPATH=services/pipeline-runner python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_media_http.py' -v
      - name: V2+ isolated Remotion payload without watermark verification
        run: |
          PYTHONPATH=services/pipeline-runner python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_isolated_render.py' -v
          PYTHONPATH=services/pipeline-runner python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_isolated_launch.py' -v
      - name: Exact one-Reel Runner and Flask route syntax
        run: |
          python -m py_compile services/pipeline-runner/rendering_review/one_job.py
          python -m py_compile services/pipeline-runner/rendering_review/one_job_http.py
          python -m py_compile services/pipeline-runner/rendering_review/media_http.py
          python -m py_compile services/pipeline-runner/app.py
      - name: Rendering Review read-only Studio interface contracts
        run: |
          node --check apps/studio-web/assets/rendering-review-queue.js
          node --test apps/studio-web/rendering-review-ui.test.mjs apps/studio-web/rendering-review-queue.test.mjs
      - name: Existing producer selective rework regression
        run: node --test apps/studio-api/conversational-producer-plan.test.mjs apps/studio-api/producer-conversation.test.mjs apps/studio-api/output-approval-lease.test.mjs
