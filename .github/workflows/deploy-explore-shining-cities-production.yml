name: Deploy Explore Shining Cities Production

on:
  push:
    branches: [main]
    paths:
      - "apps/explore-shining-cities/**"
      - ".github/workflows/deploy-explore-shining-cities-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explore-shining-cities-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: explore-shining-cities
      PUBLIC_DOMAIN: exploreshiningcities.com
      WWW_DOMAIN: www.exploreshoiningcities.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/explore-shining-cities/package.json

      - name: Validate and build public site
        working-directory: apps/explore-shining-cities
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run validate
          npm run build
          test -s dist/index.html
          test -s dist/chicago/index.html
          test -s dist/los-angeles/index.html
          test -s dist/miami/index.html
          test -s dist/new-york/index.html
          test -s dist/sitemap.xml
          test -s dist/robots.txt

      - name: Verify Cloudflare zone
        id: zone
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "https://api.cloudflare.com/client/v4/zones?name=$PUBLIC_DOMAIN&account.id=$CLOUDFLARE_ACCOUNT_ID" \
            -H "$AUTH" -o /tmp/zone.json
          ZONE_ID=$(jq -r '.result[0].id // empty' /tmp/zone.json)
          ZONE_STATUS=$(jq -r '.result[0].status // empty' /tmp/zone.json)
          if [[ -z "$ZONE_ID" ]]; then
            echo "Cloudflare zone $PUBLIC_DOMAIN was not found in this account." >&2
            echo "Add the domain to the existing Cloudflare account before retrying." >&2
            exit 1
          fi
          if [[ "$ZONE_STATUS" != "active" ]]; then
            echo "Cloudflare zone $PUBLIC_DOMAIN exists but is not active (status=$ZONE_STATUS)." >&2
            jq -c '.result[0] | {name,status,name_servers,original_name_servers}' /tmp/zone.json || true
            exit 1
          fi
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
          echo "Cloudflare zone: PASS ($PUBLIC_DOMAIN, $ZONE_STATUS)"

      - name: Create or reuse isolated Pages project
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          CODE=$(curl -sS -o /tmp/pages-project.json -w "%{http_code}" "$API/$PAGES_PROJECT" -H "$AUTH" || true)
          if [[ "$CODE" == "404" ]]; then
            jq -n --arg name "$PAGES_PROJECT" '{name:$name,production_branch:"main"}' > /tmp/pages-project-create-payload.json
            CREATE_CODE=$(curl -sS -o /tmp/pages-project-create.json -w "%{http_code}" -X POST "$API" \
              -H "$AUTH" -H "Content-Type: application/json" \
              --data-binary @/tmp/pages-project-create-payload.json)
            if [[ "$CREATE_CODE" -lt 200 || "$CREATE_CODE" -ge 300 ]]; then
              echo "Pages project create failed (HTTP $CREATE_CODE)" >&2
              jq -c '{success,errors,messages}' /tmp/pages-project-create.json >&2 || cat /tmp/pages-project-create.json >&2
              exit 1
            fi
            jq -e --arg p "$PAGES_PROJECT" '.success == true and .result.name == $p' /tmp/pages-project-create.json >/dev/null
            echo "Pages project created: $PAGES_PROJECT"
          elif [[ "$CODE" == "200" ]]; then
            jq -e '.success == true and .result.name == env.PAGES_PROJECT' /tmp/pages-project.json >/dev/null
            echo "Pages project reused: $PAGES_PROJECT"
          else
            echo "Unexpected Pages project lookup HTTP $CODE" >&2
            cat /tmp/pages-project.json >&2 || true
            exit 1
          fi

      - name: Deploy static site to Pages production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy apps/explore-shining-cities/dist \
            --project-name="$PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Explore Shining Cities production deployment" \
            --commit-dirty=false

      - name: Attach or reset custom domains
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$API" -H "$AUTH" -o /tmp/domains-before.json

          for DOMAIN in "$PUBLIC_DOMAIN" "$WWW_DOMAIN"; do
            EXISTS=false
            STATUS=""
            VERIFY_ERROR=""

            if jq -e --arg d "$DOMAIN" '.result[]? | select(.name == $d)' /tmp/domains-before.json >/dev/null; then
              EXISTS=true
              STATUS=$(jq -r --arg d "$DOMAIN" '.result[]? | select(.name == $d) | .status // ""' /tmp/domains-before.json)
              VERIFY_ERROR=$(jq -r --arg d "$DOMAIN" '.result[]? | select(.name == $d) | .verification_data.error_message // ""' /tmp/domains-before.json)
            fi

            if [[ "$EXISTS" == "true" && ( "$STATUS" == "error" || "$VERIFY_ERROR" == "CNAME record not set" ) ]]; then
              echo "Resetting stale Pages domain association: $DOMAIN (status=$STATUS verification=$VERIFY_ERROR)"
              CODE=$(curl -sS -o "/tmp/domain-${DOMAIN}-delete.json" -w "%{http_code}" -X DELETE "$API/$DOMAIN" -H "$AUTH" || true)
              if [[ "$CODE" -lt 200 || "$CODE" -ge 300 ]]; then
                echo "Failed to detach stale domain $DOMAIN (HTTP $CODE)" >&2
                cat "/tmp/domain-${DOMAIN}-delete.json" >&2 || true
                exit 1
              fi
              jq -e '.success == true' "/tmp/domain-${DOMAIN}-delete.json" >/dev/null
              EXISTS=false
              sleep 2
            fi

            if [[ "$EXISTS" == "true" ]]; then
              echo "Domain already attached and healthy enough to validate: $DOMAIN (status=$STATUS)"
              continue
            fi

            jq -n --arg name "$DOMAIN" '{name:$name}' > "/tmp/domain-${DOMAIN}-payload.json"
            CODE=$(curl -sS -o "/tmp/domain-${DOMAIN}.json" -w "%{http_code}" -X POST "$API" \
              -H "$AUTH" -H "Content-Type: application/json" \
              --data-binary @"/tmp/domain-${DOMAIN}-payload.json")
            if [[ "$CODE" -lt 200 || "$CODE" -ge 300 ]]; then
              echo "Failed to attach $DOMAIN (HTTP $CODE)" >&2
              cat "/tmp/domain-${DOMAIN}.json" >&2
              exit 1
            fi
            jq -e '.success == true' "/tmp/domain-${DOMAIN}.json" >/dev/null
            jq -c '.result | {name,status,validation_data,verification_data}' "/tmp/domain-${DOMAIN}.json"
            echo "Attached domain: $DOMAIN"
          done
      - name: Inspect Pages custom-domain validation
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$API" -H "$AUTH" -o /tmp/domains-after-attach.json
          jq -c '.result[] | {name,status,certificate_authority,validation_data,verification_data}' /tmp/domains-after-attach.json
      - name: Ensure Pages DNS records when authorized
        shell: bash
        env:
          ZONE_ID: ${{ steps.zone.outputs.zone_id }}
        run: |
          set -euo pipefail
          test -n "${ZONE_ID:-}"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          DNS_API="https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"
          TARGET="$PAGES_PROJECT.pages.dev"
          DNS_API_STATE=ok

          for DOMAIN in "$PUBLIC_DOMAIN" "$WWW_DOMAIN"; do
            CODE=$(curl -sS -o "/tmp/dns-$DOMAIN.json" -w "%{http_code}" "$DNS_API?name=$DOMAIN&per_page=100" -H "$AUTH" || true)
            if [[ "$CODE" == "403" ]]; then
              DNS_API_STATE=denied
              echo "::warning::Cloudflare token cannot read/write DNS for $DOMAIN (HTTP 403). Continuing with Pages status checks against the manually configured DNS records."
              echo "Expected Pages DNS target: $DOMAIN -> $TARGET"
              break
            fi
            if [[ "$CODE" != "200" ]]; then
              echo "DNS lookup failed for $DOMAIN (HTTP $CODE)." >&2
              cat "/tmp/dns-$DOMAIN.json" >&2 || true
              exit 1
            fi

            MATCH_ID=$(jq -r --arg d "$DOMAIN" --arg target "$TARGET" '
              .result[]?
              | select(.type == "CNAME" and .name == $d and .content == $target)
              | .id
            ' "/tmp/dns-$DOMAIN.json" | head -n 1)

            if [[ -n "$MATCH_ID" ]]; then
              MATCH_PROXIED=$(jq -r --arg id "$MATCH_ID" '.result[] | select(.id == $id) | .proxied // false' "/tmp/dns-$DOMAIN.json")
              if [[ "$MATCH_PROXIED" != "true" ]]; then
                jq -n --arg type "CNAME" --arg name "$DOMAIN" --arg content "$TARGET"                   '{type:$type,name:$name,content:$content,ttl:1,proxied:true}' > "/tmp/dns-$DOMAIN-payload.json"
                curl -fsS -X PUT "$DNS_API/$MATCH_ID" -H "$AUTH" -H "Content-Type: application/json"                   --data-binary @"/tmp/dns-$DOMAIN-payload.json" -o "/tmp/dns-$DOMAIN-update.json"
                jq -e '.success == true' "/tmp/dns-$DOMAIN-update.json" >/dev/null
                echo "Updated Pages DNS proxy: $DOMAIN -> $TARGET"
              else
                echo "Pages DNS already correct: $DOMAIN -> $TARGET"
              fi
              continue
            fi

            CONFLICT_IDS=$(jq -r --arg d "$DOMAIN" '
              .result[]?
              | select(.name == $d and (.type == "A" or .type == "AAAA" or .type == "CNAME"))
              | .id
            ' "/tmp/dns-$DOMAIN.json")

            if [[ -n "$CONFLICT_IDS" ]]; then
              echo "Replacing existing web-address records for $DOMAIN with the Pages target."
              while IFS= read -r RECORD_ID; do
                [[ -n "$RECORD_ID" ]] || continue
                curl -fsS -X DELETE "$DNS_API/$RECORD_ID" -H "$AUTH" -o "/tmp/dns-delete-$RECORD_ID.json"
                jq -e '.success == true' "/tmp/dns-delete-$RECORD_ID.json" >/dev/null
              done <<< "$CONFLICT_IDS"
            fi

            jq -n --arg type "CNAME" --arg name "$DOMAIN" --arg content "$TARGET"               '{type:$type,name:$name,content:$content,ttl:1,proxied:true}' > "/tmp/dns-$DOMAIN-payload.json"
            curl -fsS -X POST "$DNS_API" -H "$AUTH" -H "Content-Type: application/json"               --data-binary @"/tmp/dns-$DOMAIN-payload.json" -o "/tmp/dns-$DOMAIN-create.json"
            jq -e '.success == true' "/tmp/dns-$DOMAIN-create.json" >/dev/null
            echo "Created Pages DNS: $DOMAIN -> $TARGET"
          done

          echo "EXPLORE_DNS_API=$DNS_API_STATE" >> "$GITHUB_ENV"

      - name: Wait for domain activation
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          MAX_ATTEMPTS=180

          for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
            curl -fsS "$API" -H "$AUTH" -o /tmp/domains.json
            APEX=$(jq -r --arg d "$PUBLIC_DOMAIN" '.result[]? | select(.name == $d) | .status' /tmp/domains.json)
            WWW=$(jq -r --arg d "$WWW_DOMAIN" '.result[]? | select(.name == $d) | .status' /tmp/domains.json)
            echo "domain_status attempt=$ATTEMPT apex=${APEX:-missing} www=${WWW:-missing}"
            if (( ATTEMPT == 1 || ATTEMPT % 6 == 0 )); then
              jq -c '.result[] | {name,status,validation_data,verification_data}' /tmp/domains.json
            fi
            if [[ "$APEX" == "active" && "$WWW" == "active" ]]; then
              exit 0
            fi
            if [[ "$APEX" == "blocked" || "$WWW" == "blocked" ]]; then
              jq -c '.result[] | {name,status,validation_data,verification_data}' /tmp/domains.json >&2
              exit 1
            fi
            if (( ATTEMPT >= 12 )) && [[ "$APEX" == "error" || "$WWW" == "error" ]]; then
              echo "Custom-domain verification remained in error state for at least one minute." >&2
              jq -c '.result[] | {name,status,validation_data,verification_data}' /tmp/domains.json >&2
              exit 1
            fi
            sleep 5
          done

          APEX_CODE=$(curl -sS -L -o /tmp/apex-live -w "%{http_code}" "https://$PUBLIC_DOMAIN/" || true)
          WWW_CODE=$(curl -sS -L -o /tmp/www-live -w "%{http_code}" "https://$WWW_DOMAIN/" || true)
          if [[ "$APEX_CODE" == "200" && "$WWW_CODE" == "200" ]] && grep -Fq "Explore Shining Cities" /tmp/apex-live; then
            echo "Pages API is still pending, but both public domains are serving the production site."
            exit 0
          fi

          echo "Custom domains did not become active within the verification window." >&2
          jq -c '.result[] | {name,status,validation_data,verification_data}' /tmp/domains.json >&2
          if [[ "${EXPLORE_DNS_API:-ok}" == "denied" ]]; then
            echo "Cloudflare DNS API access is not available to this token. Confirm the existing proxied CNAME records remain pointed at $PAGES_PROJECT.pages.dev." >&2
          fi
          exit 1

      - name: Verify production routes and canonical redirect
        shell: bash
        run: |
          set -euo pipefail
          for PATHNAME in "/" "/chicago" "/los-angeles" "/miami" "/new-york" "/chicago/riverwalk" "/miami/vizcaya" "/los-angeles/griffith-observatory" "/new-york/central-park" "/sitemap.xml" "/robots.txt"; do
            CODE=000
            for ATTEMPT in $(seq 1 12); do
              CODE=$(curl -sS -L -o /tmp/live-body -w "%{http_code}" "https://$PUBLIC_DOMAIN$PATHNAME" || true)
              [[ "$CODE" == "200" ]] && break
              sleep 5
            done
            test "$CODE" = "200"
            echo "LIVE $CODE https://$PUBLIC_DOMAIN$PATHNAME"
          done
          grep -Fq "Explore Shining Cities" /tmp/live-body || true
          FINAL=$(curl -sS -L -o /dev/null -w "%{url_effective}" "https://$WWW_DOMAIN/chicago")
          test "$FINAL" = "https://$PUBLIC_DOMAIN/chicago"
          echo "www_canonical_redirect=PASS"

      - name: Record deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Explore Shining Cities production"
            echo "- Pages project: $PAGES_PROJECT"
            echo "- Primary domain: https://$PUBLIC_DOMAIN"
            echo "- Canonical www redirect: https://$WWW_DOMAIN -> https://$PUBLIC_DOMAIN"
            echo "- Source commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
