name: Configure Pipeline Runner Production

on:
  workflow_dispatch:
    inputs:
      pipeline_runner_shared_secret:
        description: 'PIPELINE_RUNNER_SHARED_SECRET (from runtime .env)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNT_ID: cbb5651c94e9bd2efc4594dc87229acb
      TUNNEL_ID: f7a22f0f-f760-4e16-a085-3538d22981f1
      WORKER_NAME: chicagoshining-studio-api
      HOSTNAME: pipeline.chicagoshining.com
      LOCAL_SERVICE: http://localhost:3350
      RUNNER_URL: https://pipeline.chicagoshining.com
      PIPELINE_RUNNER_SHARED_SECRET: ${{ inputs.pipeline_runner_shared_secret }}
    steps:
      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PIPELINE_RUNNER_SHARED_SECRET"

      - name: Merge tunnel ingress for pipeline.chicagoshining.com
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/configurations" \
            -H "$AUTH" -o /tmp/tunnel-before.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/tunnel-before.json').read_text())
          ingress = payload.get('result', {}).get('config', {}).get('ingress') or []
          hostname = 'pipeline.chicagoshining.com'
          kept = []
          for rule in ingress:
              if rule.get('hostname') == hostname:
                  continue
              if not rule.get('hostname') and str(rule.get('service', '')).startswith('http_status:'):
                  continue
              kept.append(rule)
          kept.append({'hostname': hostname, 'service': 'http://localhost:3350', 'originRequest': {}})
          kept.append({'service': 'http_status:404'})
          Path('/tmp/tunnel-after.json').write_text(json.dumps({'config': {'ingress': kept}}))
          PY
          curl -fsS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/configurations" \
            -H "$AUTH" -H 'Content-Type: application/json' \
            --data-binary @/tmp/tunnel-after.json -o /tmp/tunnel-put.json
          jq -e '.success == true' /tmp/tunnel-put.json >/dev/null

      - name: Patch studio-api Worker vars for Python pipeline-runner
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            -H "$AUTH" -o /tmp/settings-before.json
          jq -e '.success == true' /tmp/settings-before.json >/dev/null
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path('/tmp/settings-before.json').read_text())['result']
          bindings = list(result.get('bindings') or [])
          by_name = {str(item.get('name')): item for item in bindings if item.get('name')}
          updates = {
              'STAGE_BACKEND_SMV1': ('plain_text', 'python'),
              'STAGE_BACKEND_R2': ('plain_text', 'python'),
              'STAGE_BACKEND_R3': ('plain_text', 'python'),
              'STAGE_BACKEND_R4': ('plain_text', 'python'),
              'STAGE_BACKEND_R5': ('plain_text', 'python'),
              'STAGE_BACKEND_RR1': ('plain_text', 'python'),
              'STAGE_BACKEND_RR2': ('plain_text', 'python'),
              'STAGE_BACKEND_R2B': ('plain_text', 'python'),
              'STAGE_BACKEND_P2': ('plain_text', 'python'),
              'STAGE_BACKEND_P3': ('plain_text', 'python'),
              'STAGE_BACKEND_P4': ('plain_text', 'python'),
              'STAGE_BACKEND_P5': ('plain_text', 'python'),
              'STAGE_BACKEND_C2': ('plain_text', 'python'),
              'STAGE_BACKEND_C3': ('plain_text', 'python'),
              'PIPELINE_RUNNER_URL': ('plain_text', os.environ['RUNNER_URL']),
              'PIPELINE_RUNNER_SHARED_SECRET': ('secret_text', os.environ['PIPELINE_RUNNER_SHARED_SECRET']),
          }
          for name, (binding_type, text) in updates.items():
              by_name[name] = {'name': name, 'type': binding_type, 'text': text}
          Path('/tmp/settings-patch.json').write_text(json.dumps({'bindings': list(by_name.values())}))
          PY
          curl -fsS -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            -H "$AUTH" \
            -F 'settings=@/tmp/settings-patch.json;type=application/json' \
            -o /tmp/worker-settings-result.json
          jq -e '.success == true' /tmp/worker-settings-result.json >/dev/null

      - name: Verify public health when origin is reachable
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$RUNNER_URL/health" || true)
            if [[ "$code" == "200" ]] && jq -e '.ok == true' /tmp/health.json >/dev/null 2>&1; then
              jq '{ok,service,version,public_base_url}' /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo 'Public route not reachable yet. Tunnel + Worker vars were applied.' >&2
          echo 'Ensure pipeline-runner is running locally on :3350, then re-check /health.' >&2
          exit 2
