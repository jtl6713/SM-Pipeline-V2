name: Verify Drifter watermark through Studio attachment

on:
  push:
    branches: [fix/drifter-watermark]
    paths:
      - '.github/workflows/drifter-watermark-attachment-check.yml'

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      BRIDGE_WORKER: chicagoshining-drifter-check-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - name: Capture active version and build exact draft attachment bridge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$ROOT/workers/scripts/$TARGET_WORKER/deployments" -H "$AUTH" -o /tmp/deployments.json
          ACTIVE=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/deployments.json)
          printf '%s' "$ACTIVE" >/tmp/active.txt
          TOKEN=$(python - <<'PY'
          import secrets; print(secrets.token_urlsafe(32))
          PY
          )
          printf '%s' "$TOKEN" >/tmp/token.txt
          cat >/tmp/bridge.js <<EOF
          export default {async fetch(request,env){
            const u=new URL(request.url);
            if(u.pathname==="/$TOKEN/ready") return Response.json({ok:true});
            if(u.pathname!=="/$TOKEN/execute") return new Response("Not found",{status:404});
            const command={media_asset_ids:["recTeu9UggkFLHVzs","reculpYoVgfVRrZKW","recjv0Cs133avPo2Y"],allow_video:true};
            const r=await env.STUDIO_API.fetch(new Request("https://studio-api.internal/api/production-requests/rec1ECH73s1AOO0P9/assets/library",{method:"POST",headers:{"Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com","Origin":"https://studio.chicagoshining.com","Content-Type":"application/json","Accept":"application/json","Cloudflare-Workers-Version-Overrides":"$TARGET_WORKER=\"$ACTIVE\""},body:JSON.stringify(command)}));
            return new Response(await r.text(),{status:r.status,headers:{"Content-Type":r.headers.get("Content-Type")||"text/plain","Cache-Control":"no-store"}});
          }};
          EOF
          cat >/tmp/metadata.json <<EOF
          {"main_module":"bridge.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF
          node --check /tmp/bridge.js
      - name: Upload bridge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -X PUT "$ROOT/workers/scripts/$BRIDGE_WORKER/content" -H "$AUTH" -F 'metadata=@/tmp/metadata.json;type=application/json' -F 'bridge.js=@/tmp/bridge.js;type=application/javascript+module;filename=bridge.js' -o /tmp/upload.json
          jq -e '.success==true' /tmp/upload.json >/dev/null
          curl -fsS -X POST "$ROOT/workers/scripts/$BRIDGE_WORKER/subdomain" -H "$AUTH" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' >/tmp/sub.json
          curl -fsS "$ROOT/workers/subdomain" -H "$AUTH" -o /tmp/account-subdomain.json
          SUB=$(jq -er '.result.subdomain' /tmp/account-subdomain.json); T=$(cat /tmp/token.txt)
          for i in $(seq 1 20); do
            code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' "https://$BRIDGE_WORKER.$SUB.workers.dev/$T/ready" || true)
            [[ "$code" == 200 ]] && break
            sleep 1
          done
          test "$code" = 200
      - name: Attach only the three selected clips to the existing draft
        shell: bash
        run: |
          set -euo pipefail
          SUB=$(jq -er '.result.subdomain' /tmp/account-subdomain.json); T=$(cat /tmp/token.txt)
          code=$(curl -sS --max-time 180 -o /tmp/result.txt -w '%{http_code}' "https://$BRIDGE_WORKER.$SUB.workers.dev/$T/execute" || true)
          echo "drifter_attachment_http=$code"
          jq -c '{ok,error,message,status,count,attached,assets:(.assets // [] | map({media_asset_record_id,google_drive_file_id,source_google_drive_file_id,mime_type,order}))}' /tmp/result.txt
          [[ "$code" == "200" || "$code" == "201" ]]
      - name: Delete bridge
        if: always()
        shell: bash
        run: |
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$ROOT/workers/scripts/$BRIDGE_WORKER" -H "$AUTH" >/dev/null || true
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drifter-watermark-attachment-${{ github.run_id }}
          path: |
            /tmp/result.txt
            /tmp/deployments.json
          if-no-files-found: ignore
          retention-days: 14
