name: Checkpoint Item7 R2 L7 And Execution Stop Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/checkpoint-item7-r2-l6-failure.yml'

permissions:
  contents: write

concurrency:
  group: item7-ledger-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update permanent Item 7 ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('repair/SM_PIPELINE_21_ITEM_LEDGER.md')
          s=p.read_text()
          row='| 7 | Fresh edge-to-edge 9:16 normal-path regression | **In progress — R2 L8 retry authorized after execution-aware repair** | Output 168 / Content 75 remains exact `Test_Run_ID=ITEM7_9X16_REGRESSION_RUN32060507474`, 9:16, `Do_Not_Publish=true`. L7 `32066445258` proved the explicit `/run` repair works: R2 actually executed and moved only Output 168 to `Selecting` with an exact six-clip request, while selected/render/final fields remained blank; the pulse then failed closed because R2 did not verify inactive. Watchdog closure recorded L7 terminal `budget-exhausted`, `scenario_stopped=true`, and zero Processing repair leases remained. Root cause was narrowed to execution ownership: Make `/run` returns an execution ID, but the controller discarded it. Exact-execution shutdown repair deployed successfully in run `32067087580`: the controller retains the execution ID from its own leased run and, only if normal scenario stop does not verify inactive, force-stops that exact execution before re-verifying scenario shutdown. Output 168 partial L7 residue (`Selecting` + start note) was reset exactly to its proven pre-L7 blank values; Test_Run_ID/DNP and all downstream fields were preserved. | Run fresh R2 L8 from this clean fixture/control-plane state. Require selected assets + clip count, R2 OFF, canonical production selector/schedule restoration, and DNP/Test_Run_ID preservation before R3. |'
          s,n=re.subn(r'^\| 7 \| Fresh edge-to-edge 9:16 normal-path regression \|.*$',row,s,count=1,flags=re.M)
          if n != 1: raise SystemExit('Item 7 row not found')
          marker='- 2026-08-17 Item 7 L7/execution-stop checkpoint:'
          if marker not in s:
              s += '\n'+marker+' L7 `32066445258` proved exact R2 execution but failed closed on inactive verification after Output 168 entered Selecting; watchdog terminalized L7 with scenario_stopped=true. Exact-execution controller repair deployed in `32067087580`, retaining the leased executionId and using exact force-stop only as a fallback before scenario-stop re-verification. Output 168 was restored only in the two fields mutated by L7 (selection status/note), with Test_Run_ID, Do_Not_Publish and all downstream fields preserved; zero Processing repair leases remain. L8 is the next R2 gate; R3 remains blocked.\n'
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair/SM_PIPELINE_21_ITEM_LEDGER.md
          git commit -m 'docs(item7): checkpoint L7 and execution-stop repair'
          git pull --rebase origin main
          git push origin HEAD:main
