name: Checkpoint Item7 R2 L8 Subrequest Failure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/checkpoint-item7-r2-l6-failure.yml'

permissions:
  contents: write

concurrency:
  group: item7-ledger-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update permanent Item 7 ledger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('repair/SM_PIPELINE_21_ITEM_LEDGER.md')
          s=p.read_text()
          row='| 7 | Fresh edge-to-edge 9:16 normal-path regression | **In progress — R2 retry pending after subrequest-budget repair** | Output 168 / Content 75 remains exact `Test_Run_ID=ITEM7_9X16_REGRESSION_RUN32060507474`, 9:16, `Do_Not_Publish=true`. L8 run `32067297719` passed exact preflight and lease acquisition, executed only Output 168, and captured exact Make execution `a76e05c9fcd5469c9adefc8193443717`; Output 168 entered `Selecting` for Exact 6 clips but emitted no selected package or terminal R2 diagnostics within the 90-second checkpoint window. The decisive failure was controller-side Cloudflare subrequest exhaustion: both the exact-execution force-stop and scenario-stop fallback returned `Too many subrequests by single Worker invocation`. Independent safety inspect `32067706933` confirmed R2 was still active with the exact stranded selector immediately after the failed pulse. Fresh watchdog run `32067711473` then terminalized L8 `budget-exhausted` with `scenario_stopped=true`; Output 168 partial `Selecting` residue was reset exactly to its pre-L8 blank selection state while Test_Run_ID/DNP and all downstream fields remained preserved. | Repair Item 7 pulse to reserve subrequest capacity for exact execution/scenario stop and selector restoration, then run a fresh R2 lease. R3 remains blocked until R2 reaches Selected with package + clip count and postflight restoration proof. |'
          s,n=re.subn(r'^\| 7 \| Fresh edge-to-edge 9:16 normal-path regression \|.*$',row,s,count=1,flags=re.M)
          if n != 1: raise SystemExit('Item 7 row not found')
          marker='- 2026-08-17 Item 7 L8/subrequest checkpoint:'
          if marker not in s:
              s += '\n'+marker+' L8 `32067297719` proved exact execution identity but failed because the long checkpoint poll consumed the Worker subrequest budget before exact execution/scenario shutdown. Safety inspect `32067706933` saw R2 active with the exact selector; watchdog `32067711473` then closed L8 budget-exhausted with scenario_stopped=true. Output 168 was restored only in the partial selection status/note fields; Test_Run_ID, Do_Not_Publish and downstream blank state were preserved. Next repair reserves cleanup capacity; R3 blocked.\n'
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair/SM_PIPELINE_21_ITEM_LEDGER.md
          git commit -m 'docs(item7): checkpoint L8 subrequest exhaustion'
          git pull --rebase origin main
          git push origin HEAD:main
