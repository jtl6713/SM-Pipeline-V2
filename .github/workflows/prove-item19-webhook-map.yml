name: Prove Item 19 Webhook Map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/prove-item19-webhook-map.txt'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Map Pipeline Settings webhooks to live scenarios and ping one hook
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m py_compile repair/scripts/prove-item19-webhook-map.py
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:CLOUDFLARE_API_TOKEN \
            -in deploy/credential-envelope/private.pem.enc \
            -out /tmp/key.pem
          base64 -d deploy/credential-envelope/airtable_pat.ciphertext.b64 >/tmp/pat.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/key.pem \
            -in /tmp/pat.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out /tmp/pat.txt
          export AIRTABLE_PAT="$(tr -d '\r\n' </tmp/pat.txt)"
          export ITEM19_EVIDENCE="/tmp/item19-webhook-map-proof.json"
          python repair/scripts/prove-item19-webhook-map.py
          jq -e '.passed == true
            and .make_scenario_runs == 0
            and .hooks_created == 0
            and .hooks_rotated == false
            and .r4.hookId == null
            and .ping.invoked == true
            and .ping.runs_scenario == false
            and (.ping.http == 200 or (.hooks_api_gap == true and (.ping.http == 401 or .ping.http == 403)))
            and .cadenced_scenarios_started == 0' \
            /tmp/item19-webhook-map-proof.json >/dev/null

      - name: Upload sanitized Item 19 webhook-map evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item19-webhook-map-${{ github.run_id }}
          path: /tmp/item19-webhook-map-proof.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Destroy transient credentials
        if: always()
        run: rm -f /tmp/key.pem /tmp/pat.enc /tmp/pat.txt /tmp/item19-webhook-map-proof.json
