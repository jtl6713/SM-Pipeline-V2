name: One-Time Home Tally UI Release 0726
on:
  push:
    branches: [release/home-approved-unpublished-ui-0726-current]
    paths: [.github/workflows/one-time-home-0726.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/home-approved-unpublished-ui-0726-current
          persist-credentials: true
      - name: Upgrade existing current-main Studio UI release references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('apps/studio-web')
          targets=[root/'index.html',root/'assets/app-item4-1008.js',*root.rglob('*.test.mjs')]
          modified=[]
          for path in targets:
              if not path.is_file(): continue
              value=path.read_text()
              patched=(value
                  .replace('0.6.725-music-preview-proxy','0.6.726-approved-unpublished-home')
                  .replace(r'0\\.6\\.725',r'0\\.6\\.726')
                  .replace('0.6.725','0.6.726'))
              if patched!=value:
                  path.write_text(patched)
                  modified.append(str(path))
          app=(root/'assets/app-item4-1008.js').read_text()
          html=(root/'index.html').read_text()
          assert 'item4-0.6.726-approved-unpublished-home' in app, 'missing active app build release'
          assert 'UI build 0.6.726' in html, 'missing user-visible release'
          assert 'all-profiles-overview-1007.js?v=0.6.726-approved-unpublished-home' in html, 'overview asset cache bust missing'
          assert len(modified)>=30, f'unexpectedly few UI release references patched: {len(modified)}'
          marker=Path('deploy/cloudflare-pages-production.txt')
          marker.write_text(marker.read_text().rstrip()+'\\n2026-10-20: UI 0.6.726 Home approved-but-unpublished parentheses release from latest main; guarded Pages deployment and live version verification.\\n')
          print('updated_files='+str(len(modified)))
          for path in modified:print('updated='+path)
          PY
      - name: Commit UI release on feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio-web deploy/cloudflare-pages-production.txt
          git diff --cached --stat
          git diff --cached --quiet && { echo "No changes to commit" >&2; exit 1; }
          git commit -m "release(ui): activate Home approved-unpublished 0.6.726"
          git push origin HEAD:release/home-approved-unpublished-ui-0726-current
