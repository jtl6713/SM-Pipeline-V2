name: Airtable Egress Coverage Audit
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/airtable-evidence-coverage-guard-rebased-20261020
      - feature/automatic-shadow-evidence-20261020
      - feature/durable-airtable-egress-20261020
      - feature/airtable-hourly-rollup-report-20261020
      - feature/automatic-24h-shadow-evidence-20261020
    paths:
      - 'repair/scripts/audit_airtable_egress_paths.py'
      - 'repair/scripts/audit_airtable_egress_paths_test.py'
      - '.github/workflows/shadow-profile-summary-hourly-evidence.yml'
      - '.github/workflows/airtable-egress-coverage-audit.yml'
      - 'repair/scripts/airtable_hourly_rollup.py'
      - 'repair/scripts/airtable_hourly_rollup_test.py'
      - 'repair/scripts/shadow_24h_auto_evidence.py'
      - 'repair/scripts/shadow_24h_auto_evidence_test.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Identify direct Airtable paths and unresolved callers
        shell: bash
        run: |
          set -euo pipefail
          python repair/scripts/audit_airtable_egress_paths.py > airtable-egress-coverage.json
          python - <<'PY'
          import json
          obj=json.load(open('airtable-egress-coverage.json'))
          print('airtable_production_unverified='+str(obj['production_runtime_unverified_count']))
          print('airtable_standalone_unverified='+str(obj['standalone_unverified_count']))
          print('airtable_staging_only='+str(obj['staging_only_count']))
          for p in obj['candidates']:
              if p['scope'] in ('production_runtime_unverified','standalone_unverified'):
                  print(p['scope']+'='+p['path']+' lines='+','.join(map(str,p['lines'])))
          if obj['production_runtime_unverified_count']:
              raise SystemExit('Uninstrumented production-runtime Airtable code path discovered')
          PY
      - name: Verify coverage scope classification
        run: python -m unittest discover -s repair/scripts -p 'audit_airtable_egress_paths_test.py' -v
      - name: Test equal-window reporting safety
        run: python -m unittest discover -s repair/scripts -p 'airtable_request_window_report_test.py' -v
      - name: Test durable hourly window accounting
        run: python -m unittest discover -s repair/scripts -p 'durable_airtable_window_report_test.py' -v
      - name: Test hourly rollup
        run: python -m unittest discover -s repair/scripts -p 'airtable_hourly_rollup_test.py' -v
      - name: Test automatic 24-hour freshness evidence
        run: python -m unittest discover -s repair/scripts -p 'shadow_24h_auto_evidence_test.py' -v
      - name: Store coverage audit
        uses: actions/upload-artifact@v4
        with:
          name: airtable-egress-coverage-${{ github.run_id }}
          path: airtable-egress-coverage.json
          retention-days: 30
