name: Factory Batch Supabase HTTP Boundary (Hermetic Only)
# This is NOT deployed-Worker staging acceptance. The retired staging harness
# used a live Airtable PAT; it must never be run to obtain a green CI result.
# Production Supabase canaries and external-integration audits remain separate
# hard release gates documented in docs/supabase-migration/.
on:
  pull_request:
    paths:
      - 'apps/studio-api/worker.js'
      - 'apps/studio-api/worker-functions-*.mjs'
      - 'apps/studio-api/factory-submit-http-boundary.test.mjs'
      - 'apps/studio-api/factory-batch-approval.test.mjs'
      - 'apps/studio-api/airtable-retirement.test.mjs'
      - '.github/workflows/factory-batch-http-staging.yml'
  push:
    branches: [main]
    paths:
      - 'apps/studio-api/worker.js'
      - 'apps/studio-api/worker-functions-*.mjs'
      - 'apps/studio-api/factory-submit-http-boundary.test.mjs'
      - 'apps/studio-api/factory-batch-approval.test.mjs'
      - 'apps/studio-api/airtable-retirement.test.mjs'
      - '.github/workflows/factory-batch-http-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supabase-hermetic-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical Worker syntax
        run: |
          set -euo pipefail
          node --check apps/studio-api/worker.js
          for src in apps/studio-api/worker-functions-*.mjs; do node --check "$src"; done
      - name: Exercise real Worker HTTP boundary with isolated Supabase fixtures
        run: |
          set -euo pipefail
          node --test --test-reporter=tap \
            apps/studio-api/factory-submit-http-boundary.test.mjs \
            apps/studio-api/factory-batch-approval.test.mjs \
            apps/studio-api/airtable-retirement.test.mjs
      - name: Record remaining release block explicitly
        run: |
          echo 'HERMETIC_SUPABASE_HTTP_BOUNDARY=TESTED'
          echo 'DEPLOYED_STAGING_HTTP=NOT_TESTED'
          echo 'PRODUCTION_SUPABASE_CANARY=NOT_TESTED'
          echo 'LIVE_ZERO_AIRTABLE_EGRESS=NOT_VERIFIED'
