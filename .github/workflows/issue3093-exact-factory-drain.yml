name: Issue 3093 exact Factory continuation
on:
  pull_request:
    branches: [main]
    paths:
      - 'repair/scripts/issue3093-exact-factory-drain.py'
      - 'repair/scripts/issue3093-exact-factory-bridge.mjs'
      - '.github/workflows/issue3093-exact-factory-drain.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue3093-exact-factory-drain.yml'
      - 'repair/scripts/issue3093-exact-factory-drain.py'
      - 'repair/scripts/issue3093-exact-factory-bridge.mjs'
permissions:
  contents: read
  statuses: write
concurrency:
  group: chicagoshining-studio-api-production-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile repair/scripts/issue3093-exact-factory-drain.py
          python - <<'PY'
          import ast
          from pathlib import Path
          text=Path('repair/scripts/issue3093-exact-factory-drain.py').read_text()
          ast.parse(text)
          assert text.count('requests.post(')==1
          assert 'zoo3093-resume' in text and 'allow_redirects=False' in text
          assert 'receipt_mismatch' in text and 'canonical_fence' in text
          for forbidden in ('requests.patch','requests.put','requests.delete','/publish-now'):
              assert forbidden not in text
          print('EXACT_ZOO_FACTORY_SCOPE_PASS')
          PY
      - name: Test exact bridge scope without credentials
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import bridge from "./repair/scripts/issue3093-exact-factory-bridge.mjs";
          const secret="test-only-service-secret-of-32-chars";
          let calls=0;
          const env={STUDIO_API:{fetch:async r=>{
            calls++;
            assert.equal(r.url,"https://studio.chicagoshining.com/api/internal/factory/zoo3093-resume");
            assert.equal(r.method,"POST");
            assert.equal(r.headers.get("X-Pipeline-Secret"),secret);
            assert.equal(await r.text(),"");
            return Response.json({ok:true,request_id:"exact",approved:6,pending:0,complete:true,publication_authorized:false,private:"not-for-output"});
          }}};
          for(const [path,method,header,body] of [["/wrong","POST",secret,""],["/__ZOO_TOKEN__","GET",secret,undefined],["/__ZOO_TOKEN__?x=1","POST",secret,""],["/__ZOO_TOKEN__","POST","bad",""],["/__ZOO_TOKEN__","POST",secret,"{}"]]){
            assert.equal((await bridge.fetch(new Request("https://test.example"+path,{method,headers:{"X-Pipeline-Secret":header},body}),env)).status,404);
          }
          assert.equal(calls,0);
          const r=await bridge.fetch(new Request("https://test.example/__ZOO_TOKEN__",{method:"POST",headers:{"X-Pipeline-Secret":secret}}),env);
          assert.equal(r.status,200);const d=await r.json();assert.equal(d.complete,true);assert.equal(d.private,undefined);assert.equal(calls,1);
          JS
  audit:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - name: Require verified deployment of exact Factory drain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr=$(curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/3194")
          sha=$(jq -er 'select(.merged==true) | .merge_commit_sha' <<<"$pr")
          for i in $(seq 1 90); do
            state=$(curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$sha/status" | jq -r '[.statuses[] | select(.context=="production/studio-api-worker")][0].state // "missing"')
            if [[ "$state" == success ]]; then exit 0; fi
            if [[ "$state" == failure || "$state" == error ]]; then exit 1; fi
            sleep 5
          done
          exit 1
      - name: Verify scheduler still paused before exact recovery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PYTHONPATH=repair/scripts python - <<'PY'
          from issue3159_cron_containment import call,schedules
          assert schedules(call('GET'))==[]
          print('zoo_factory_pre_crons=[]')
          PY
      - name: Create bounded exact service-binding transport
        id: bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          NAME="studio-zoo-factory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          CODE=$(curl -sS --max-time 20 -o /tmp/zoo-bridge-exists.json -w '%{http_code}' "$API/workers/scripts/$NAME/settings" -H "$AUTH")
          test "$CODE" = 404
          printf '%s' "$NAME" >/tmp/zoo-bridge-owned-name
          TOKEN=$(python -c 'import secrets;print(secrets.token_urlsafe(32))')
          echo "::add-mask::$TOKEN"
          sed "s/__ZOO_TOKEN__/$TOKEN/g" repair/scripts/issue3093-exact-factory-bridge.mjs >/tmp/zoo-bridge.js
          printf '%s' '{"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"chicagoshining-studio-api"}]}' >/tmp/zoo-bridge-metadata.json
          curl -fsS --max-time 25 -X PUT "$API/workers/scripts/$NAME/content" -H "$AUTH" -F 'metadata=@/tmp/zoo-bridge-metadata.json;type=application/json' -F 'worker.js=@/tmp/zoo-bridge.js;type=application/javascript+module;filename=worker.js' -o /tmp/zoo-bridge-upload.json
          jq -e '.success==true' /tmp/zoo-bridge-upload.json >/dev/null
          curl -fsS --max-time 25 -X POST "$API/workers/scripts/$NAME/subdomain" -H "$AUTH" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' -o /tmp/zoo-bridge-enabled.json
          jq -e '.success==true and .result.enabled==true' /tmp/zoo-bridge-enabled.json >/dev/null
          SUBDOMAIN=$(curl -fsS --max-time 20 "$API/workers/subdomain" -H "$AUTH" | jq -er '.result.subdomain')
          [[ "$SUBDOMAIN" =~ ^[a-z0-9-]+$ ]]
          BASE="https://$NAME.$SUBDOMAIN.workers.dev"
          READY=false
          for i in $(seq 1 12); do
            CODE=$(curl -sS --max-time 10 -D /tmp/zoo-bridge-denied.headers -o /dev/null -w '%{http_code}' "$BASE/not-authorized" || true)
            if [[ "$CODE" == 404 ]] && grep -qi '^x-zoo-bridge: denied' /tmp/zoo-bridge-denied.headers; then READY=true; break; fi
            sleep 5
          done
          test "$READY" = true
          echo "::add-mask::$BASE/$TOKEN"
          printf '%s' "$BASE/$TOKEN" >/tmp/zoo-bridge-url
      - name: Exact one-shot Zoo Miami recovery through protected Ops
        shell: bash
        env:
          OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
          OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
          OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
        run: |
          set -euo pipefail
          BASE=https://ops.chicagoshining.com
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            [[ -n "$candidate" ]] || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then selected="$candidate"; break; fi
          done
          test -n "$selected"
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          source=Path('repair/scripts/issue3093-exact-factory-drain.py')
          sha=os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}',sha)
          expected=hashlib.sha256(source.read_bytes()).hexdigest()
          url=f'https://raw.githubusercontent.com/jtl6713/SM-Pipeline-V2/{sha}/{source.as_posix()}'
          bridge_url=Path('/tmp/zoo-bridge-url').read_text()
          assert re.fullmatch(r'https://studio-zoo-factory-[0-9]+-[0-9]+\.[a-z0-9-]+\.workers\.dev/[A-Za-z0-9_-]{43}',bridge_url)
          command=("$ErrorActionPreference='Stop';"
            "$tmp=Join-Path $env:TEMP ('issue3093-zoo2340-'+[guid]::NewGuid().ToString('N')+'.py');"
            f"Invoke-WebRequest -Uri '{url}' -OutFile $tmp -UseBasicParsing -TimeoutSec 55;"
            f"if((Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant() -ne '{expected}'){{throw 'audit_source_hash_mismatch'}};"
            f"$env:ZOO_FACTORY_BRIDGE_URL='{bridge_url}';"
            "try{& python $tmp;if($LASTEXITCODE -ne 0){throw 'audit_python_failed'}}finally{Remove-Item Env:ZOO_FACTORY_BRIDGE_URL -ErrorAction SilentlyContinue;Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue}")
          Path('/tmp/request.json').write_text(json.dumps({'command':command,'confirm':True}))
          PY
          job=''
          for attempt in $(seq 1 3); do
            code=$(curl -sS --max-time 20 -o /tmp/start.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $selected" -H 'Content-Type: application/json' --data-binary @/tmp/request.json || true)
            if [[ "$code" == 202 ]]; then job=$(jq -er '.job.id' /tmp/start.json); break; fi
            [[ "$code" == 409 ]] || { echo "audit_ops_http=$code"; exit 1; }
            sleep 5
          done
          test -n "$job"
          echo "audit_job_id=$job"
          for attempt in $(seq 1 120); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $selected" "$BASE/api/jobs/$job" -o /tmp/status.json
            state=$(jq -r '.job.status' /tmp/status.json)
            [[ "$state" == ok || "$state" == failed ]] && break
            sleep 3
          done
          python - <<'PY'
          import json,re
          from pathlib import Path
          job=json.loads(Path('/tmp/status.json').read_text())['job']
          out=job.get('log','')
          lines=out.splitlines()
          for line in lines:
              if line.startswith(('ZOO_FACTORY_HTTP=','ZOO_FACTORY_RESULT=','ZOO_FACTORY_ERROR=')):
                  print(line)
          if job['status']!='ok': raise SystemExit('exact_factory_continuation_incomplete_no_automatic_retry')
          proofs=[line for line in lines if line.startswith('ZOO_FACTORY_RESULT=')]
          assert len(proofs)==1
          proof=json.loads(proofs[0].split('=',1)[1])
          assert proof['request_id']=='e3aff4f8-a9c4-4333-876d-e0523144f293' and proof['approved']==list(range(11366,11372)) and proof['complete'] and not proof['publication_authorized']
          PY
      - name: Remove owned temporary transport and verify absence
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/zoo-bridge-owned-name ]]; then exit 0; fi
          NAME=$(cat /tmp/zoo-bridge-owned-name)
          test "$NAME" = "studio-zoo-factory-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          CODE=$(curl -sS --max-time 20 -X DELETE "$API/workers/scripts/$NAME" -H "$AUTH" -o /tmp/zoo-bridge-delete.json -w '%{http_code}')
          if [[ "$CODE" != 404 ]]; then
            [[ "$CODE" -ge 200 && "$CODE" -lt 300 ]]
            jq -e '.success==true' /tmp/zoo-bridge-delete.json >/dev/null
          fi
          CODE=$(curl -sS --max-time 20 "$API/workers/scripts/$NAME/settings" -H "$AUTH" -o /tmp/zoo-bridge-gone.json -w '%{http_code}')
          test "$CODE" = 404
          rm -f /tmp/zoo-bridge-url /tmp/zoo-bridge.js
          echo 'zoo_factory_bridge_removed=PASS'
      - name: Verify final scheduler remains paused
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PYTHONPATH=repair/scripts python - <<'PY'
          from issue3159_cron_containment import call,schedules
          assert schedules(call('GET'))==[]
          print('zoo_factory_post_crons=[]')
          PY
      - name: Record protected evidence status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          STATE=failure
          if [[ "$RESULT" == success ]]; then STATE=success; fi
          jq -nc --arg state "$STATE" --arg url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:"production/issue3093-exact-factory-drain",target_url:$url,description:"Exact original Zoo Factory continuation"}' >/tmp/media-status.json
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/json' "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" --data-binary @/tmp/media-status.json >/dev/null
