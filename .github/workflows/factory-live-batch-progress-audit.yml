name: Factory Live Progress Audit (Read Only)
on:
  push:
    branches: [main]
    paths:
      - deploy/factory-live-batch-progress-audit.txt
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: factory-live-batch-progress-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'jtl6713/SM-Pipeline-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      AUDIT_WORKER: studio-factory-progress-readonly
    steps:
      - name: Audit approved/pending counts via existing authenticated service binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          CRON_HTTP=$(curl -sS --max-time 25 -o /tmp/studio-cron-schedules.json -w '%{http_code}' -H "$AUTH" "$API/workers/scripts/$TARGET_WORKER/schedules" || true)
          echo "factory_worker_cron_schedule_http=$CRON_HTTP"
          if [[ "$CRON_HTTP" == "200" ]]; then
            jq -c '{success,cron_schedules:(.result.schedules // .result // [])}' /tmp/studio-cron-schedules.json
          else
            jq -c '{success,errors}' /tmp/studio-cron-schedules.json 2>/dev/null || true
          fi
          # Fail closed if another Worker already owns this name.
          EXISTING=$(curl -sS -o /tmp/existing.json -w '%{http_code}' -H "$AUTH" "$API/workers/scripts/$AUDIT_WORKER/settings")
          if [[ "$EXISTING" != "404" ]]; then echo "::error::Auditor Worker name already in use or unavailable: HTTP $EXISTING"; exit 1; fi
          OWNED=0
          cleanup() {
            if [[ "$OWNED" == "1" ]]; then
              curl -fsS --max-time 20 -X DELETE -H "$AUTH" "$API/workers/scripts/$AUDIT_WORKER" >/dev/null || echo "::warning::Ephemeral inspector cleanup failed"
            fi
          }
          trap cleanup EXIT
          TOKEN=$(openssl rand -hex 32)
          cat >/tmp/audit-worker.js <<'EOF'
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (request.method !== "GET" || url.pathname !== "/report") return new Response("Not found", { status:404 });
              if (request.headers.get("Authorization") !== "Bearer " + env.AUDIT_TOKEN) return new Response("Unauthorized", {status:401});
              const internal = new Request("https://studio.chicagoshining.com/api/factory/approval-batches?scope=all&view=active", {
                headers: {
                  "Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com",
                  "Origin":"https://studio.chicagoshining.com",
                  "Accept":"application/json"
                }
              });
              const response = await env.STUDIO_API.fetch(internal);
              return new Response(await response.text(), {status:response.status,
                headers: {"Content-Type":"application/json","Cache-Control":"no-store"}});
            }
          };
          EOF
          cat >/tmp/audit-meta.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"},{"type":"plain_text","name":"AUDIT_TOKEN","text":"$TOKEN"}]}
          EOF
          CODE=$(curl -sS -o /tmp/audit-put.json -w '%{http_code}' -X PUT "$API/workers/scripts/$AUDIT_WORKER/content" -H "$AUTH" -F 'metadata=@/tmp/audit-meta.json;type=application/json' -F 'worker.js=@/tmp/audit-worker.js;type=application/javascript+module;filename=worker.js')
          if ! [[ "$CODE" =~ ^2[0-9][0-9]$ ]] || ! jq -e '.success==true' /tmp/audit-put.json >/dev/null; then
            jq -c '{success,errors}' /tmp/audit-put.json
            exit 1
          fi
          OWNED=1
          curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' "$API/workers/scripts/$AUDIT_WORKER/subdomain" --data '{"enabled":true,"previews_enabled":false}' >/tmp/audit-sub.json
          jq -e '.success==true' /tmp/audit-sub.json >/dev/null
          SUBDOMAIN=$(curl -fsS -H "$AUTH" "$API/workers/subdomain" | jq -er '.result.subdomain')
          URL="https://$AUDIT_WORKER.$SUBDOMAIN.workers.dev/report"
          for ROUND in 1 2; do
            CODE=000
            for ATTEMPT in $(seq 1 30); do
              CODE=$(curl -sS --max-time 65 -o /tmp/factory-live.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL" || true)
              if [[ "$CODE" == "200" ]] && jq -e '.scope=="all" and (.totals.pending|type)=="number" and (.batches|type)=="array"' /tmp/factory-live.json >/dev/null 2>&1; then break; fi
              sleep 3
            done
            if [[ "$CODE" != "200" ]] || ! jq -e '.scope=="all" and (.totals.pending|type)=="number"' /tmp/factory-live.json >/dev/null 2>&1; then
              echo "::error::Factory read-only status unavailable round=$ROUND http=$CODE"
              exit 1
            fi
            echo "FACTORY_LIVE_SAMPLE=$ROUND"
            jq -c '{at:(now|todateiso8601),totals,quality_signals,history_complete,history_scanned, batches:[.batches[] | {job_id,request_id,group,profile_id,status,created_at,updated_at,total,approved_count,pending_count,failed_count,quality_signals,items:(.items // [] | map({id,output_id,platform,format,status,error,next_attempt_ms,attempts,total_attempts})),children:(.children // [] | map({job_id,profile_id,request_id,status,total,approved_count,pending_count,failed_count,updated_at,quality_signals,items:(.items // [] | map({id,output_id,platform,format,status,error,next_attempt_ms,attempts,total_attempts}))}))}]}' /tmp/factory-live.json
            cp /tmp/factory-live.json "/tmp/factory-live-$ROUND.json"
            if [[ "$ROUND" == "1" ]]; then sleep 75; fi
          done
          jq -n --slurpfile a /tmp/factory-live-1.json --slurpfile b /tmp/factory-live-2.json '{before:$a[0].totals,after:$b[0].totals,pending_delta:(($b[0].totals.pending // 0)-($a[0].totals.pending // 0)),approved_delta:(($b[0].totals.approved // 0)-($a[0].totals.approved // 0))}'
