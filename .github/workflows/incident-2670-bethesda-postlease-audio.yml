name: Incident 2670 - Bethesda post-lease one-time voiceover resume
on:
  push:
    branches: [main]
    paths:
      - 'deploy/incident-2670-bethesda-postlease-audio.txt'
permissions:
  contents: read
concurrency:
  group: incident-2670-bethesda-postlease-audio
  cancel-in-progress: false
jobs:
  exact-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify public recovery fence remains active with all-governed producer scope
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 'https://pipeline.chicagoshining.com/health' -o /tmp/2670-health.json
          jq -e '.ok==true and .recovery_read_only==true and .recovery_producer_only_enabled==true and .recovery_producer_scope=="all_governed_requests" and .workload_governor_enabled==true and .i1_durable_jobs==false and .studio_write_source=="supabase" and .airtable_activity.any_activity==false' /tmp/2670-health.json >/dev/null
          echo 'bethesda_public_fence=PASS'
      - name: Verify exact held Bethesda audio state and resume once on Windows
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://ops.chicagoshining.com
          TOKEN=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            test -n "$candidate" || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then TOKEN="$candidate"; break; fi
          done
          test -n "$TOKEN" || { echo 'ops_auth_unavailable'; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          script=Path(".github/scripts/incident-2670-bethesda-postlease-audio.ps1").read_text(encoding="utf-8")
          Path("/tmp/exact-admit.json").write_text(json.dumps({"command":script,"confirm":True}))
          PY
          code=''
          for n in $(seq 1 30); do
            code=$(curl -sS --max-time 30 -o /tmp/launch.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/exact-admit.json || true)
            if [[ "$code" == 202 ]]; then break; fi
            if [[ "$code" != 409 ]]; then echo "ops_shell_http=$code"; exit 1; fi
            sleep 3
          done
          [[ "$code" == 202 ]] || { echo 'ops_shell_busy'; exit 1; }
          job=$(jq -r '.job.id // empty' /tmp/launch.json)
          test -n "$job"
          for n in $(seq 1 90); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN" "$BASE/api/jobs/$job" -o /tmp/job.json
            state=$(jq -r '.job.status // empty' /tmp/job.json)
            if [[ "$state" == ok ]]; then
              jq -r '.job.log // ""' /tmp/job.json | grep -E '^(bethesda_exact_postlease_preflight|bethesda_one_time_resume|bethesda_post_resume_governor|bethesda_publisher_fence|bethesda_p2)=' || true
              jq -e '.job.log|contains("bethesda_publisher_fence=STILL_ON") or contains("bethesda_p2=ALREADY_HAS_VOICEOVER_NO_RESUME")' /tmp/job.json >/dev/null
              echo 'bethesda_postlease_one_time_resume=PASS'
              exit 0
            fi
            if [[ "$state" == failed ]]; then
              echo 'incident_2670_exact_producer_canary=FAILED'
              jq -r '.job.log // ""' /tmp/job.json | tail -n 5 | cut -c1-220
              exit 1
            fi
            sleep 3
          done
          echo 'incident_2670_exact_producer_canary=TIMED_OUT'
          exit 1
