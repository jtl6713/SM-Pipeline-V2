name: Prove Item 9 Native Platform Covers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deploy/prove-item9-native-covers.txt'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: Attach existing YouTube and Facebook covers without starting Make
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python -m pip install --quiet pillow
          python -m py_compile repair/scripts/prove-item9-native-covers.py
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:CLOUDFLARE_API_TOKEN \
            -in deploy/credential-envelope/private.pem.enc \
            -out /tmp/key.pem
          base64 -d deploy/credential-envelope/airtable_pat.ciphertext.b64 >/tmp/pat.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/key.pem \
            -in /tmp/pat.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out /tmp/pat.txt
          export AIRTABLE_PAT="$(tr -d '\r\n' </tmp/pat.txt)"
          export ITEM9_EVIDENCE="/tmp/item9-native-cover-proof.json"
          python repair/scripts/prove-item9-native-covers.py
          jq -e '.passed == true and .make_scenario_runs == 0 and .cadenced_scenarios_started == 0 and .public_posts_created == 0' \
            /tmp/item9-native-cover-proof.json >/dev/null

      - name: Upload sanitized Item 9 platform-cover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item9-native-cover-proof-${{ github.run_id }}
          path: /tmp/item9-native-cover-proof.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Destroy transient credentials
        if: always()
        shell: bash
        run: |
          rm -f /tmp/key.pem /tmp/pat.enc /tmp/pat.txt /tmp/item9-native-cover-proof.json
