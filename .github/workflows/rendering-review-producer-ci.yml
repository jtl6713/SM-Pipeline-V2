name: Rendering Review Producer Evidence CI
on:
  pull_request:
    paths:
      - 'services/pipeline-runner/rendering_review/**'
      - 'services/pipeline-runner/app.py'
      - 'services/pipeline-runner/tests/test_rendering_review_*.py'
      - '.github/workflows/rendering-review-producer-ci.yml'
permissions:
  contents: read
jobs:
  evidence-and-proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/pipeline-runner/requirements.txt
      - run: python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_*.py' -v
        env:
          PYTHONPATH: services/pipeline-runner
