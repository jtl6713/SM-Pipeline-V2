name: E2E Studio API Control

on:
  push:
    branches: [main]
    paths:
      - 'deploy/e2e-studio-api-command.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chicagoshining-e2e-studio-api-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      BRIDGE_WORKER: chicagoshining-e2e-service-bridge
      OWNER_EMAIL: joseph.t.logan@gmail.com
      BRIDGE_RETRY_MAX: "12"
      BRIDGE_RETRY_SLEEP_S: "3"
    steps:
      - uses: actions/checkout@v6

      - name: Validate E2E command
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.correlation_id|type=="string" and length>0' deploy/e2e-studio-api-command.json >/dev/null
          jq -e '.requests|type=="array" and length>0 and length<=12' deploy/e2e-studio-api-command.json >/dev/null
          jq -e 'all(.requests[]; (.method=="GET" or .method=="POST" or .method=="PATCH" or .method=="PUT") and (.path|type=="string"))' deploy/e2e-studio-api-command.json >/dev/null
          jq -e 'all(.requests[]; (.path|test("^/api/production-requests/(recc9H8SXdUnKEMhQ|recVAxLIuTsHHuDZK|recZkbX3A0vk9Z2Wb|receXUsiQZLMlJzAX)(/|$)|^/api/production-request-outputs/rec(D15PEl3x8LnZ7G|GvE1SHoxXPs5Aa|GZm1Si8GhHPP13|wvxu6GketzHWiF)(/|$)|^/api/outputs/rec[A-Za-z0-9]+/(preview|creative)(/|$)|^/api/operations/outputs/rec(j63HvnUhy7bmnr|L8g3QfrbelKtd4)/publish-kick$")))' deploy/e2e-studio-api-command.json >/dev/null

      - name: Capture production deployment identity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/deployments-before.json
          jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id' /tmp/deployments-before.json >/tmp/active-before.txt

      - name: Build one-time service bridge
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(36))
          PY
          )
          printf '%s' "$TOKEN" >/tmp/path-token.txt
          python - <<'PY'
          import json
          from pathlib import Path
          token=Path('/tmp/path-token.txt').read_text()
          command=json.loads(Path('deploy/e2e-studio-api-command.json').read_text())
          requests=json.dumps(command['requests'],separators=(',',':'))
          owner=json.dumps('joseph.t.logan@gmail.com')
          route=json.dumps('/'+token)
          js=f'''export default {{
            async fetch(request, env) {{
              const incoming = new URL(request.url);
              const requestPath = incoming.pathname.replace(/\\/+$/, "") || "/";
              if (requestPath === {route} + "/ready") {{
                return new Response(JSON.stringify({{ok:true,ready:true}}), {{status:200,headers:{{"Content-Type":"application/json","Cache-Control":"no-store"}}}});
              }}
              if (requestPath !== {route}) return new Response("Not found", {{status:404}});
              const requests = {requests};
              const results = [];
              for (const spec of requests) {{
                const method = String(spec.method || "GET").toUpperCase();
                const headers = new Headers({{
                  "Cf-Access-Authenticated-User-Email": {owner},
                  "Accept": "application/json",
                  "Origin": "https://studio.chicagoshining.com"
                }});
                let body;
                if (method !== "GET") {{
                  headers.set("Content-Type","application/json");
                  body = JSON.stringify(spec.body ?? {{}});
                }}
                const internal = new Request("https://studio.chicagoshining.com" + spec.path, {{method,headers,body}});
                try {{
                  const response = await env.STUDIO_API.fetch(internal);
                  const text = await response.text();
                  let parsed;
                  try {{ parsed = text ? JSON.parse(text) : null; }} catch {{ parsed = {{raw:text.slice(0,10000)}}; }}
                  results.push({{name:spec.name || spec.path,path:spec.path,method,status:response.status,ok:response.ok,body:parsed}});
                  if (!response.ok && spec.continue_on_error !== true) break;
                }} catch (error) {{
                  results.push({{name:spec.name || spec.path,path:spec.path,method,status:0,ok:false,body:{{error:String(error)}}}});
                  if (spec.continue_on_error !== true) break;
                }}
              }}
              return new Response(JSON.stringify({{ok:results.every(r=>r.ok),correlation_id:{json.dumps(command['correlation_id'])},results}}), {{status:200,headers:{{"Content-Type":"application/json","Cache-Control":"no-store"}}}});
            }}
          }};'''
          Path('/tmp/worker.js').write_text(js)
          PY
          node --check /tmp/worker.js
          cat >/tmp/metadata.json <<'EOF'
          {
            "main_module":"worker.js",
            "compatibility_date":"2026-08-02",
            "bindings":[{"type":"service","name":"STUDIO_API","service":"chicagoshining-studio-api"}]
          }
          EOF

      - name: Upload temporary bridge
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null || true
          code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER/content" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata=@/tmp/metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/worker.js;type=application/javascript+module;filename=worker.js')
          test "$code" -ge 200 -a "$code" -lt 300
          jq -e '.success==true' /tmp/upload.json >/dev/null
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' -o /tmp/subdomain-enable.json
          jq -e '.success==true and .result.enabled==true' /tmp/subdomain-enable.json >/dev/null
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/account-subdomain.json
          jq -er '.result.subdomain' /tmp/account-subdomain.json >/tmp/account-subdomain.txt

      - name: Execute Studio API requests
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN=$(cat /tmp/account-subdomain.txt)
          TOKEN=$(cat /tmp/path-token.txt)
          URL="https://$BRIDGE_WORKER.$SUBDOMAIN.workers.dev/$TOKEN"
          ready=000
          for i in $(seq 1 "$BRIDGE_RETRY_MAX"); do
            ready=$(curl -sS --max-time 20 -o /tmp/ready.json -w '%{http_code}' "$URL/ready" || true)
            echo "bridge_ready_attempt=$i/$BRIDGE_RETRY_MAX http=$ready"
            [[ "$ready" == "200" ]] && break
            if [[ "$ready" != "404" && "$ready" != "000" && "$ready" != "500" && "$ready" != "502" && "$ready" != "503" && "$ready" != "504" && "$ready" != "520" && "$ready" != "521" && "$ready" != "522" && "$ready" != "523" && "$ready" != "524" && "$ready" != "530" && "$ready" != "1033" ]]; then
              echo "bridge gave up (non-retryable) last_http=$ready"
              exit 1
            fi
            if [[ "$i" -eq "$BRIDGE_RETRY_MAX" ]]; then
              echo "bridge gave up after ${BRIDGE_RETRY_MAX} attempts last_http=$ready"
              exit 1
            fi
            sleep "$BRIDGE_RETRY_SLEEP_S"
          done
          code=$(curl -sS --max-time 420 -o /tmp/result.json -w '%{http_code}' "$URL" || true)
          echo "bridge_http=$code"
          test "$code" -eq 200
          jq -e '.results|type=="array"' /tmp/result.json >/dev/null
          echo 'E2E_RESULT_SANITIZED'
          jq '
            def redact:
              walk(if type=="object" then with_entries(if (.key|test("token|secret|password|api[_-]?key|authorization|webhook|pat$|completion";"i")) then .value="[REDACTED]" else . end) else . end);
            {ok,correlation_id,results:[.results[]|{name,path,method,status,ok,body:(.body|redact)}]}
          ' /tmp/result.json > /tmp/result-sanitized.json
          head -c 24000 /tmp/result-sanitized.json
          echo
          jq -e '.ok==true' /tmp/result.json >/dev/null

      - name: Delete temporary bridge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [[ "$code" -ge 200 && "$code" -lt 300 ]]; then jq -e '.success==true' /tmp/delete.json >/dev/null || true; elif [[ "$code" != "404" ]]; then exit 1; fi

      - name: Verify production unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(cat /tmp/active-before.txt)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/deployments-after.json
          AFTER=$(jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id' /tmp/deployments-after.json)
          echo "production_unchanged=$([[ "$BEFORE" == "$AFTER" ]] && echo true || echo false)"
          test "$BEFORE" = "$AFTER"
