name: Direct Item7 R2 Selector Recovery After L11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-recover-item7-r2-after-l11.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCENARIO_ID: '5569495'
      TEST_RUN_ID: ITEM7_9X16_REGRESSION_RUN32060507474
      OUTPUT_RECORD_ID: recByMge4QPlCOsD2
    steps:
      - uses: actions/checkout@v6
      - name: Resolve Make API credentials without logging values
        shell: bash
        run: |
          set -euo pipefail; umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:CLOUDFLARE_API_TOKEN -in deploy/credential-envelope/private.pem.enc -out /tmp/key.pem
          base64 -d deploy/credential-envelope/airtable_pat.ciphertext.b64 >/tmp/pat.enc
          openssl pkeyutl -decrypt -inkey /tmp/key.pem -in /tmp/pat.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -out /tmp/pat.txt
          PAT=$(cat /tmp/pat.txt)
          python - <<'PY' >/tmp/q.txt
          import urllib.parse
          f="OR({Setting_Name}='MAKE_API_TOKEN',{Setting_Name}='MAKE_API_BASE_URL')"
          print(urllib.parse.urlencode([('filterByFormula',f),('fields[]','Setting_Name'),('fields[]','Setting_Value'),('fields[]','Active')]))
          PY
          curl -fsS "https://api.airtable.com/v0/appe33zkZn35yirTL/tblpHPWeEkyJaF7ql?$(cat /tmp/q.txt)" -H "Authorization: Bearer $PAT" -o /tmp/settings.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/settings.json'))
          vals={r['fields'].get('Setting_Name'):r['fields'].get('Setting_Value') for r in d.get('records',[]) if r.get('fields',{}).get('Active')}
          t=str(vals.get('MAKE_API_TOKEN') or '').strip(); b=str(vals.get('MAKE_API_BASE_URL') or '').strip().rstrip('/')
          if not t or not b: raise SystemExit('Missing active Make API settings')
          open('/tmp/make-token.txt','w').write(t); open('/tmp/make-base.txt','w').write(b)
          PY
      - name: Verify or recover exact R2 selector with rollback guard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          TOKEN=$(cat /tmp/make-token.txt); BASE=$(cat /tmp/make-base.txt); SID="$SCENARIO_ID"
          curl -fsS "$BASE/scenarios/$SID" -H "Authorization: Token $TOKEN" -H 'Accept: application/json' -o /tmp/scenario-before.json
          curl -fsS "$BASE/scenarios/$SID/blueprint" -H "Authorization: Token $TOKEN" -H 'Accept: application/json' -o /tmp/bp-before-wrap.json
          python - <<'PY'
          import copy, json, os
          sid=int(os.environ['SCENARIO_ID']); rid=os.environ['OUTPUT_RECORD_ID']; tr=os.environ['TEST_RUN_ID']
          def scen(d):
              x=d.get('response',d) if isinstance(d,dict) else {}
              if isinstance(x,dict) and isinstance(x.get('scenario'),dict): x=x['scenario']
              return x if isinstance(x,dict) else {}
          def bp(d):
              x=d.get('response',d) if isinstance(d,dict) else d
              if isinstance(x,dict) and 'blueprint' in x:x=x['blueprint']
              if isinstance(x,str):x=json.loads(x)
              if not isinstance(x,dict):raise SystemExit('No live blueprint')
              return x
          def find(flow,mid):
              for n in flow if isinstance(flow,list) else []:
                  if str(n.get('id'))==str(mid): return n
                  for r in n.get('routes',[]) if isinstance(n.get('routes'),list) else []:
                      z=find(r.get('flow'),mid)
                      if z:return z
              return None
          s=scen(json.load(open('/tmp/scenario-before.json')))
          if s.get('isActive',s.get('active')) is not False: raise SystemExit('R2 must be OFF')
          b=bp(json.load(open('/tmp/bp-before-wrap.json'))); m=find(b.get('flow'),1)
          if not m or m.get('module')!='airtable:ActionSearchRecords': raise SystemExit('R2 Module 1 selector not found')
          if str((m.get('mapper') or {}).get('maxRecords',''))!='1': raise SystemExit('R2 maxRecords not 1')
          f=str((m.get('mapper') or {}).get('formula',''))
          canonical=(('{Test_Run_ID}=BLANK()' in f) and ('NOT({Do_Not_Publish})' in f))
          exact_wrapper='AND(RECORD_ID()='+json.dumps(rid)+','
          exact_token='{Test_Run_ID}='+json.dumps(tr)
          exact=(f.startswith(exact_wrapper) and f.endswith(')') and exact_token in f and '{Do_Not_Publish}=1' in f)
          if not canonical and not exact: raise SystemExit('R2 selector is neither canonical nor exact isolated selector')
          ev={'scenario_id':sid,'scenario_active_before':False,'schedule_before':s.get('scheduling',s.get('schedule')),'formula_before':f,'already_canonical':canonical,'exact_selector_observed':exact,'maxRecords':'1'}
          if canonical:
              open('/tmp/no-patch','w').write('1')
              open('evidence/recovery.json','w').write(json.dumps({**ev,'selector_restored':True,'scenario_stopped':True,'schedule_preserved':True,'formula_after':f},indent=2,sort_keys=True))
              raise SystemExit(0)
          recovered=f[len(exact_wrapper):-1].replace(exact_token,'{Test_Run_ID}=BLANK()').replace('{Do_Not_Publish}=1','NOT({Do_Not_Publish})')
          if '{Test_Run_ID}=BLANK()' not in recovered or 'NOT({Do_Not_Publish})' not in recovered: raise SystemExit('Recovered formula failed canonical markers')
          p=copy.deepcopy(b); pm=find(p.get('flow'),1); pm['mapper']['formula']=recovered; p.pop('idSequence',None)
          rb=copy.deepcopy(b); rb.pop('idSequence',None)
          open('/tmp/patch.json','w').write(json.dumps({'blueprint':json.dumps(p,separators=(',',':'))},separators=(',',':')))
          open('/tmp/rollback.json','w').write(json.dumps({'blueprint':json.dumps(rb,separators=(',',':'))},separators=(',',':')))
          open('/tmp/recovery-pre.json','w').write(json.dumps({**ev,'formula_expected_after':recovered},indent=2,sort_keys=True))
          PY
          if [[ -f /tmp/no-patch ]]; then
            cat evidence/recovery.json
            exit 0
          fi
          code=$(curl -sS -o /tmp/patch-response.json -w '%{http_code}' -X PATCH "$BASE/scenarios/$SID?confirmed=true" -H "Authorization: Token $TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary @/tmp/patch.json)
          echo "patch_http=$code"
          [[ "$code" =~ ^2 ]] || { cat /tmp/patch-response.json; exit 1; }
          curl -fsS "$BASE/scenarios/$SID" -H "Authorization: Token $TOKEN" -H 'Accept: application/json' -o /tmp/scenario-after.json
          curl -fsS "$BASE/scenarios/$SID/blueprint" -H "Authorization: Token $TOKEN" -H 'Accept: application/json' -o /tmp/bp-after-wrap.json
          if ! python - <<'PY'
          import copy,json,sys
          def scen(d):
              x=d.get('response',d) if isinstance(d,dict) else {}
              if isinstance(x,dict) and isinstance(x.get('scenario'),dict):x=x['scenario']
              return x if isinstance(x,dict) else {}
          def bp(d):
              x=d.get('response',d) if isinstance(d,dict) else d
              if isinstance(x,dict) and 'blueprint' in x:x=x['blueprint']
              if isinstance(x,str):x=json.loads(x)
              return x
          def find(flow,mid):
              for n in flow if isinstance(flow,list) else []:
                  if str(n.get('id'))==str(mid):return n
                  for r in n.get('routes',[]) if isinstance(n.get('routes'),list) else []:
                      z=find(r.get('flow'),mid)
                      if z:return z
              return None
          pre=json.load(open('/tmp/recovery-pre.json')); sb=scen(json.load(open('/tmp/scenario-before.json'))); sa=scen(json.load(open('/tmp/scenario-after.json'))); bb=bp(json.load(open('/tmp/bp-before-wrap.json'))); ba=bp(json.load(open('/tmp/bp-after-wrap.json')))
          bm=find(bb.get('flow'),1); am=find(ba.get('flow'),1); before=bm['mapper']['formula']; after=am['mapper']['formula']; expected=pre['formula_expected_after']
          norm=copy.deepcopy(ba); find(norm.get('flow'),1)['mapper']['formula']=before
          checks={'scenario_stopped':sa.get('isActive',sa.get('active')) is False,'schedule_preserved':sa.get('scheduling',sa.get('schedule'))==sb.get('scheduling',sb.get('schedule')),'selector_restored':after==expected and '{Test_Run_ID}=BLANK()' in after and 'NOT({Do_Not_Publish})' in after,'only_intended_flow_change':norm.get('flow')==bb.get('flow'),'max_records_preserved':str(am.get('mapper',{}).get('maxRecords',''))=='1'}
          ev={**pre,'formula_after':after,'checks':checks,**checks}
          open('evidence/recovery.json','w').write(json.dumps(ev,indent=2,sort_keys=True)); print(json.dumps(ev,indent=2,sort_keys=True))
          if not all(checks.values()):sys.exit(2)
          PY
          then
            echo 'Recovery verification failed; rolling back exact prior blueprint'
            curl -sS -X PATCH "$BASE/scenarios/$SID?confirmed=true" -H "Authorization: Token $TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary @/tmp/rollback.json >/tmp/rollback-response.json || true
            exit 1
          fi
      - name: Destroy transient credentials and payloads
        if: always()
        shell: bash
        run: |
          for f in /tmp/key.pem /tmp/pat.enc /tmp/pat.txt /tmp/make-token.txt /tmp/make-base.txt /tmp/settings.json /tmp/q.txt /tmp/patch.json /tmp/rollback.json /tmp/bp-before-wrap.json /tmp/bp-after-wrap.json /tmp/scenario-before.json /tmp/scenario-after.json; do [[ ! -e "$f" ]] || shred -u "$f" 2>/dev/null || rm -f "$f"; done
      - name: Save recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item7-r2-direct-recovery-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
