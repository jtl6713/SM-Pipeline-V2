name: Read-only evidence preflight for held Chicago 8447 V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chicago-review-8447-preflight-once.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      OPS_TOKEN: ${{ secrets.OPS_DASHBOARD_TOKEN }}
    steps:
      - name: Check exact queued review evidence, without claim or render
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPS_TOKEN"
          python - <<'PY'
          import json
          from pathlib import Path
          command=r'''$ErrorActionPreference='Stop'
          $service=Join-Path (Get-Location) 'Services\pipeline-runner\service'
          if(-not (Test-Path -LiteralPath $service)){throw 'runner_source_not_found'}
          $py=Join-Path $service '.venv\Scripts\python.exe'
          if(-not (Test-Path -LiteralPath $py)){
            $p=Get-Command python -ErrorAction SilentlyContinue
            if(-not $p){throw 'python_interpreter_unavailable'}
            $py=$p.Source
          }
          $temp=Join-Path $env:TEMP 'chicago-8447-read-only-evidence.py'
          $source=@'
          from dotenv import load_dotenv
          load_dotenv('.env')
          import os
          port=os.environ.get('PORT','3350')
          print('review_preflight_port_numeric='+str(port.isdecimal()))
          # The Ops shell has its own PORT; it is not the service listener.
          # Pin only this read-only subprocess to the actual runner port.
          os.environ['PORT']='3350'
          from airtable.client import AirtableClient
          from integrations.google_drive import GoogleDriveClient
          from rendering_review.one_job import _evidence, _render_sources, ExactReviewRenderDenied
          output='rec0uVrVeiUM6shp9'
          job='rrjob_26054929500b8abe981e3f6131b5c668209bf9c765edb06c'
          client=None
          drive=None
          try:
              client=AirtableClient()
              print('review_preflight_client=PASS type=Airtable')
          except Exception as e:
              print('review_preflight_client=EXCEPTION type='+type(e).__name__)
          try:
              drive=GoogleDriveClient()
              print('review_preflight_drive=PASS')
          except Exception as e:
              print('review_preflight_drive=EXCEPTION type='+type(e).__name__)
          if client is not None and drive is not None:
              try:
                  output_row,item,request,props,plan,source,assets=_evidence(client,drive,output,job)
                  print('review_preflight_evidence=PASS')
                  try:
                      checked=_render_sources(client,request,assets,props,plan)
                      print('review_preflight_media=PASS count='+str(len(checked)))
                  except ExactReviewRenderDenied as e:
                      print('review_preflight_media=DENIED code='+str(e).split(':')[0])
                  except Exception as e:
                      print('review_preflight_media=EXCEPTION type='+type(e).__name__)
              except ExactReviewRenderDenied as e:
                  print('review_preflight_evidence=DENIED code='+str(e).split(':')[0])
              except Exception as e:
                  print('review_preflight_evidence=EXCEPTION type='+type(e).__name__)
          '@
          [System.IO.File]::WriteAllText($temp,$source,[System.Text.UTF8Encoding]::new($false))
          Push-Location $service
          try{
            $env:PYTHONPATH=$service
            & $py $temp
            if($LASTEXITCODE -ne 0){throw 'read_only_python_process_failed'}
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $temp -Force -ErrorAction SilentlyContinue
          }
          '''
          Path('/tmp/chicago-readonly-preflight.json').write_text(json.dumps({'command':command,'confirm':True}),encoding='utf-8')
          PY
          code=$(curl -sS --max-time 20 -o /tmp/ops-preflight.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $OPS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/chicago-readonly-preflight.json https://ops.chicagoshining.com/api/shell)
          [[ "$code" == "200" || "$code" == "202" ]]
          id=$(jq -r '.job.id // .jobId // empty' /tmp/ops-preflight.json); test -n "$id"
          for i in $(seq 1 85); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $OPS_TOKEN" \
              "https://ops.chicagoshining.com/api/jobs/$id" -o /tmp/preflight-result.json
            state=$(jq -r '.job.status // empty' /tmp/preflight-result.json)
            if [[ "$state" == "ok" ]]; then
              jq -r '.job.log // ""' /tmp/preflight-result.json | grep -E '^review_preflight_(port|client|drive|evidence|media)=' || true
              exit 0
            fi
            if [[ "$state" == "failed" ]]; then
              echo 'protected_readonly_preflight_failed=true'
              jq -r '.job.log // ""' /tmp/preflight-result.json | grep -E '^review_preflight_(evidence|media)=' || true
              exit 1
            fi
            sleep 3
          done
          echo 'protected_readonly_preflight_timeout=true'
          exit 1
