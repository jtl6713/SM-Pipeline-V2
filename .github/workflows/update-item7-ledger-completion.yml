name: Update Item7 Ledger Completion

on:
  push:
    branches: [main]
    paths:
      - 'repair/scripts/update-item7-ledger-completion.py'
      - '.github/workflows/update-item7-ledger-completion.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update ledger
        run: |
          set -euo pipefail
          python repair/scripts/update-item7-ledger-completion.py
          git diff --check
          grep -q 'Complete - R2/R3/R4/R5/RR1 accepted on Output 168' repair/SM_PIPELINE_21_ITEM_LEDGER.md
          grep -q '32077730040' repair/SM_PIPELINE_21_ITEM_LEDGER.md
          grep -q '32078647065' repair/SM_PIPELINE_21_ITEM_LEDGER.md
      - name: Commit ledger
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair/SM_PIPELINE_21_ITEM_LEDGER.md
          git commit -m 'docs(item7): mark 9x16 regression complete through RR1'
          git pull --rebase origin main
          git push origin HEAD:main
