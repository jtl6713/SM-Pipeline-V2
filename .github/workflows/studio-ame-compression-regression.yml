name: Studio AME Compression Regression

on:
  pull_request:
    paths:
      - 'services/pipeline-runner/studio_compress/**'
      - 'services/pipeline-runner/tests/test_ame_encoder.py'
      - 'services/pipeline-runner/tests/test_studio_compress.py'
      - '.github/workflows/studio-ame-compression-regression.yml'

permissions:
  contents: read

concurrency:
  group: studio-ame-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test private source selection, AME handoff and fallback
        run: |
          python -m pip install --quiet -r services/pipeline-runner/requirements.txt pytest
          PYTHONPATH=services/pipeline-runner python -m pytest -q \
            services/pipeline-runner/tests/test_ame_encoder.py \
            services/pipeline-runner/tests/test_studio_compress.py
