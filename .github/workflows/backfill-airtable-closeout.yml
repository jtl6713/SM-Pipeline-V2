# Copy the transfer queue and three pipeline settings into Supabase from the
# runner host. The Ops shell allows 8000 characters, so this runs the script
# already in the checkout. The log prints counts only.
name: Backfill Airtable Closeout Copies
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backfill:
    if: github.repository == 'jtl6713/SM-Pipeline-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - name: Copy queue rows and the three settings documents on the runner host
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            if [[ -z "$candidate" ]]; then continue; fi
            code=$(curl -sS --max-time 20 -o /tmp/ops-catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == "200" ]] && jq -e '.ok==true' /tmp/ops-catalog.json >/dev/null 2>&1; then
              selected="$candidate"
              break
            fi
          done
          test -n "$selected"
          wait_job() {
            local job="$1"
            local label="$2"
            for n in $(seq 1 80); do
              curl -sS --max-time 20 -H "Authorization: Bearer $selected" "$BASE/api/jobs/$job" -o /tmp/ops-job.json
              state=$(jq -r '.job.status // empty' /tmp/ops-job.json)
              if [[ "$state" == "ok" ]]; then
                return 0
              fi
              if [[ "$state" == "failed" ]]; then
                echo "${label}_failed"
                jq -r '.job.log // ""' /tmp/ops-job.json | tail -30 | sed -E 's/(AIRTABLE_PAT|SUPABASE_SERVICE_ROLE_KEY|Bearer ).*/[redacted]/'
                return 1
              fi
              sleep 5
            done
            echo "${label}_timeout"
            return 1
          }
          code=$(curl -sS --max-time 20 -o /tmp/sync-job.json -w '%{http_code}' -X POST "$BASE/api/run" \
            -H "Authorization: Bearer $selected" -H 'Content-Type: application/json' \
            --data '{"action":"sync","confirm":true}' || true)
          echo "sync_http=$code"
          test "$code" = "202"
          sync_job=$(jq -r '.job.id // empty' /tmp/sync-job.json)
          test -n "$sync_job"
          wait_job "$sync_job" sync
          python - <<'PY'
          import json
          from pathlib import Path
          command = r'''
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "scripts\backfill-airtable-closeout.py")) { throw "script_missing" }
          $envfile = Join-Path (Get-Location) "Services\pipeline-runner\service\.env"
          if (-not (Test-Path $envfile)) { throw "runner_env_missing" }
          foreach ($line in Get-Content $envfile) {
            if ($line -match '^\s*(AIRTABLE_PAT|SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY)\s*=\s*(.*)$') {
              Set-Item -Path ("Env:" + $Matches[1]) -Value ($Matches[2].Trim().Trim('"').Trim("'"))
            }
          }
          if (-not $env:AIRTABLE_PAT -or -not $env:SUPABASE_URL -or -not $env:SUPABASE_SERVICE_ROLE_KEY) {
            throw "runner_backfill_env_missing"
          }
          python scripts\backfill-airtable-closeout.py
          '''
          Path("/tmp/backfill-closeout.json").write_text(json.dumps({"command": command, "confirm": True}), encoding="utf-8")
          PY
          code=$(curl -sS --max-time 30 -o /tmp/backfill-job.json -w '%{http_code}' -X POST "$BASE/api/shell" \
            -H "Authorization: Bearer $selected" -H 'Content-Type: application/json' \
            --data-binary @/tmp/backfill-closeout.json || true)
          echo "backfill_shell_http=$code"
          if [[ "$code" != "202" ]]; then
            jq -r '.error // empty' /tmp/backfill-job.json
            exit 1
          fi
          job=$(jq -r '.job.id // empty' /tmp/backfill-job.json)
          test -n "$job"
          wait_job "$job" backfill
          jq -r '.job.log // ""' /tmp/ops-job.json | grep -E '^(settings_upserted|settings_present|queue_upserted|queue_supabase|queue_ready_supabase)='
