# Copy the transfer queue and three pipeline settings into Supabase from the
# runner host. The Ops shell allows 8000 characters, so this runs the script
# already in the checkout. The log prints counts only.
name: Backfill Airtable Closeout Copies
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backfill:
    if: github.repository == 'jtl6713/SM-Pipeline-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - name: Copy queue rows and the three settings documents on the runner host
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            if [[ -z "$candidate" ]]; then continue; fi
            code=$(curl -sS --max-time 20 -o /tmp/ops-catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == "200" ]] && jq -e '.ok==true' /tmp/ops-catalog.json >/dev/null 2>&1; then
              selected="$candidate"
              break
            fi
          done
          test -n "$selected"
          wait_job() {
            local job="$1"
            local label="$2"
            for n in $(seq 1 80); do
              curl -sS --max-time 20 -H "Authorization: Bearer $selected" "$BASE/api/jobs/$job" -o /tmp/ops-job.json
              state=$(jq -r '.job.status // empty' /tmp/ops-job.json)
              if [[ "$state" == "ok" ]]; then
                return 0
              fi
              if [[ "$state" == "failed" ]]; then
                echo "${label}_failed"
                jq -r '.job.log // ""' /tmp/ops-job.json | tail -30 | sed -E 's/(AIRTABLE_PAT|SUPABASE_SERVICE_ROLE_KEY|Bearer ).*/[redacted]/'
                return 1
              fi
              sleep 5
            done
            echo "${label}_timeout"
            return 1
          }
          code=$(curl -sS --max-time 20 -o /tmp/sync-job.json -w '%{http_code}' -X POST "$BASE/api/run" \
            -H "Authorization: Bearer $selected" -H 'Content-Type: application/json' \
            --data '{"action":"sync","confirm":true}' || true)
          echo "sync_http=$code"
          test "$code" = "202"
          sync_job=$(jq -r '.job.id // empty' /tmp/sync-job.json)
          test -n "$sync_job"
          wait_job "$sync_job" sync
          run_shell() {
            local label="$1"
            local command="$2"
            python - "$command" <<'PY'
          import json, sys
          from pathlib import Path
          Path("/tmp/backfill-closeout.json").write_text(
              json.dumps({"command": sys.argv[1], "confirm": True}),
              encoding="utf-8",
          )
          PY
            code=$(curl -sS --max-time 30 -o /tmp/backfill-job.json -w '%{http_code}' -X POST "$BASE/api/shell" \
              -H "Authorization: Bearer $selected" -H 'Content-Type: application/json' \
              --data-binary @/tmp/backfill-closeout.json || true)
            echo "${label}_http=$code"
            if [[ "$code" != "202" ]]; then
              jq -r '.error // empty' /tmp/backfill-job.json
              exit 1
            fi
            job=$(jq -r '.job.id // empty' /tmp/backfill-job.json)
            test -n "$job"
            wait_job "$job" "$label"
          }
          start_ps=$(cat <<'PS'
          $ErrorActionPreference = "Stop"
          $repo = "D:\Content Creation\ChicagoShining Pipeline\Source Control\SM-Pipeline-V2"
          $py = Join-Path $repo "scripts\backfill-airtable-closeout.py"
          if (-not (Test-Path $py)) { throw "script_missing" }
          $envfile = "D:\Content Creation\ChicagoShining Pipeline\Services\pipeline-runner\service\.env"
          if (-not (Test-Path $envfile)) { throw "runner_env_missing" }
          foreach ($line in Get-Content $envfile) {
            if ($line -match "^\s*(AIRTABLE_PAT|SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY)\s*=\s*(.*)$") {
              Set-Item -Path ("Env:" + $Matches[1]) -Value ($Matches[2].Trim().Trim([char]34).Trim([char]39))
            }
          }
          if (-not $env:AIRTABLE_PAT -or -not $env:SUPABASE_URL -or -not $env:SUPABASE_SERVICE_ROLE_KEY) { throw "runner_backfill_env_missing" }
          $log = "D:\Content Creation\ChicagoShining Pipeline\Deployment Logs\backfill-closeout.log"
          $err = "D:\Content Creation\ChicagoShining Pipeline\Deployment Logs\backfill-closeout.err"
          if (Test-Path $log) { Remove-Item $log -Force }
          if (Test-Path $err) { Remove-Item $err -Force }
          $python = "D:\Content Creation\ChicagoShining Pipeline\Services\pipeline-runner\service\.venv\Scripts\python.exe"
          if (-not (Test-Path $python)) { throw "python_missing" }
          $env:PYTHONUNBUFFERED = "1"
          $launch = "D:\Content Creation\ChicagoShining Pipeline\Deployment Logs\backfill-closeout-launch.cmd"
          @(
            "@echo off",
            "set PYTHONUNBUFFERED=1",
            "`"$python`" -u `"$py`" > `"$log`" 2> `"$err`""
          ) | Set-Content -Path $launch -Encoding ascii
          $start = New-Object System.Diagnostics.ProcessStartInfo
          $start.FileName = $launch
          $start.UseShellExecute = $true
          $start.WindowStyle = [System.Diagnostics.ProcessWindowStyle]::Hidden
          [System.Diagnostics.Process]::Start($start) | Out-Null
          Write-Output "backfill_started"
          PS
          )
          poll_ps=$(cat <<'PS'
          $log = "D:\Content Creation\ChicagoShining Pipeline\Deployment Logs\backfill-closeout.log"
          $err = "D:\Content Creation\ChicagoShining Pipeline\Deployment Logs\backfill-closeout.err"
          if (Test-Path $log) {
            Select-String -Path $log -Pattern "^(settings_upserted|settings_present|queue_upserted|queue_supabase|queue_ready_supabase)=" | ForEach-Object { $_.Line }
          } else {
            Write-Output "backfill_log_missing"
          }
          if ((Test-Path $err) -and ((Get-Item $err).Length -gt 0)) {
            $line = [string](Get-Content $err -TotalCount 1)
            $safe = $line -replace '(?i)(pat|key|bearer|token|eyJ|sk-).*','[redacted]'
            if ($safe.Length -gt 160) { $safe = $safe.Substring(0,160) }
            Write-Output ("backfill_err_head=" + $safe)
          }
          PS
          )
          run_shell start "$start_ps"
          for n in $(seq 1 40); do
            run_shell poll "$poll_ps"
            if jq -r '.job.log // ""' /tmp/ops-job.json | grep -q '^settings_present='; then
              jq -r '.job.log // ""' /tmp/ops-job.json | grep -E '^(settings_upserted|settings_present|queue_upserted|queue_supabase|queue_ready_supabase)='
              exit 0
            fi
            err_head=$(jq -r '.job.log // ""' /tmp/ops-job.json | grep '^backfill_err_head=' | head -1 || true)
            if [[ -n "$err_head" ]] && ! jq -r '.job.log // ""' /tmp/ops-job.json | grep -q '^settings_upserted='; then
              case "$err_head" in
                *Traceback*|*"http "*|*Error*|*"can't open"*|*"No module"*|*KeyError*)
                  echo "$err_head"
                  echo "backfill_process_error"
                  exit 1
                  ;;
              esac
            fi
            sleep 20
          done
          echo "backfill_still_running"
          exit 1
