# Copy the transfer queue and three pipeline settings into Supabase from the
# runner host. GitHub does not store those secrets. The log prints counts only.
name: Backfill Airtable Closeout Copies
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backfill:
    if: github.repository == 'jtl6713/SM-Pipeline-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Copy queue rows and the three settings documents on the runner host
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            if [[ -z "$candidate" ]]; then continue; fi
            code=$(curl -sS --max-time 20 -o /tmp/ops-catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == "200" ]] && jq -e '.ok==true' /tmp/ops-catalog.json >/dev/null 2>&1; then
              selected="$candidate"
              break
            fi
          done
          test -n "$selected"
          python - <<'PY'
          import json
          from pathlib import Path
          script = Path("scripts/backfill-airtable-closeout.py").read_text(encoding="utf-8")
          ps = r'''
          $ErrorActionPreference = "Stop"
          $envfile = Join-Path (Get-Location) "Services\pipeline-runner\service\.env"
          if (-not (Test-Path $envfile)) { throw "runner_env_missing" }
          foreach ($line in Get-Content $envfile) {
            if ($line -match '^\s*(AIRTABLE_PAT|SUPABASE_URL|SUPABASE_SERVICE_ROLE_KEY)\s*=\s*(.*)$') {
              $value = $Matches[2].Trim().Trim('"').Trim("'")
              Set-Item -Path ("Env:" + $Matches[1]) -Value $value
            }
          }
          if (-not $env:AIRTABLE_PAT -or -not $env:SUPABASE_URL -or -not $env:SUPABASE_SERVICE_ROLE_KEY) {
            throw "runner_backfill_env_missing"
          }
          $py = Join-Path $env:TEMP "backfill-airtable-closeout.py"
          @'
          __SCRIPT__
          '@ | Set-Content -Path $py -Encoding utf8
          python $py
          Remove-Item $py -Force
          '''
          ps = ps.replace("__SCRIPT__", script)
          Path("/tmp/backfill-closeout.ps1").write_text(ps, encoding="utf-8")
          Path("/tmp/backfill-closeout.json").write_text(json.dumps({
              "command": Path("/tmp/backfill-closeout.ps1").read_text(encoding="utf-8"),
              "confirm": True,
          }))
          PY
          code=$(curl -sS --max-time 30 -o /tmp/backfill-job.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $selected" -H 'Content-Type: application/json' --data-binary @/tmp/backfill-closeout.json || true)
          echo "backfill_shell_http=$code"
          if [[ "$code" != "202" && "$code" != "200" ]]; then exit 1; fi
          job=$(jq -r '.job.id // .jobId // empty' /tmp/backfill-job.json)
          test -n "$job"
          for n in $(seq 1 400); do
            curl -sS --max-time 20 -H "Authorization: Bearer $selected" "$BASE/api/jobs/$job" -o /tmp/backfill-status.json
            state=$(jq -r '.job.status // empty' /tmp/backfill-status.json)
            if [[ "$state" == "ok" ]]; then
              jq -r '.job.log // ""' /tmp/backfill-status.json | grep -E '^(settings_upserted|settings_present|queue_upserted|queue_supabase|queue_ready_supabase)='
              exit 0
            fi
            if [[ "$state" == "failed" ]]; then
              echo "backfill_failed"
              jq -r '.job.log // ""' /tmp/backfill-status.json | tail -20 | sed -E 's/(AIRTABLE_PAT|SUPABASE_SERVICE_ROLE_KEY|Bearer ).*/[redacted]/'
              exit 2
            fi
            sleep 6
          done
          echo "backfill_status_timeout"
          exit 3
