name: Cloudflare Studio Service Binding Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-service-binding-diagnostic.yml'
      - 'deploy/cloudflare-service-binding-diagnostic.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      BRIDGE_WORKER: chicagoshining-e2e-service-bridge
    steps:
      - uses: actions/checkout@v6

      - name: Capture production deployment identity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/deployments-before.json
          jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id' /tmp/deployments-before.json >/tmp/active-before.txt
          echo "production_version_captured=true"

      - name: Build one-time service bridge
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(36))
          PY
          )
          printf '%s' "$TOKEN" >/tmp/path-token.txt
          cat >/tmp/worker.js <<EOF
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== "/$TOKEN") return new Response("Not found", { status: 404 });
              const internal = new Request("https://studio.chicagoshining.com/api/session", {
                method: "GET",
                headers: {
                  "Cf-Access-Authenticated-User-Email": "joseph.t.logan@gmail.com",
                  "Accept": "application/json"
                }
              });
              const response = await env.STUDIO_API.fetch(internal);
              const text = await response.text();
              return new Response(text, {
                status: response.status,
                headers: { "Content-Type": response.headers.get("Content-Type") || "application/json", "Cache-Control": "no-store" }
              });
            }
          };
          EOF
          node --check /tmp/worker.js
          cat >/tmp/metadata.json <<'EOF'
          {
            "main_module": "worker.js",
            "compatibility_date": "2026-08-02",
            "bindings": [
              {"type":"service","name":"STUDIO_API","service":"chicagoshining-studio-api"}
            ]
          }
          EOF

      - name: Upload temporary bridge Worker
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null || true
          code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER/content" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata=@/tmp/metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/worker.js;type=application/javascript+module;filename=worker.js')
          echo "bridge_upload_http=$code"
          if [[ "$code" -lt 200 || "$code" -ge 300 ]]; then jq '{success,errors,messages}' /tmp/upload.json >&2 || cat /tmp/upload.json >&2; exit 1; fi
          jq -e '.success==true' /tmp/upload.json >/dev/null

      - name: Enable bridge workers.dev ingress
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/subdomain-enable.json -w '%{http_code}' -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}')
          echo "bridge_subdomain_http=$code"
          test "$code" -ge 200 -a "$code" -lt 300
          jq -e '.success==true and .result.enabled==true' /tmp/subdomain-enable.json >/dev/null
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/account-subdomain.json
          jq -er '.result.subdomain' /tmp/account-subdomain.json >/tmp/account-subdomain.txt

      - name: Invoke Studio session through service binding
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN=$(cat /tmp/account-subdomain.txt)
          TOKEN=$(cat /tmp/path-token.txt)
          URL="https://$BRIDGE_WORKER.$SUBDOMAIN.workers.dev/$TOKEN"
          code=$(curl -sS --retry 4 --retry-delay 2 --max-time 30 -o /tmp/result.json -w '%{http_code}' "$URL")
          echo "bridge_call_http=$code"
          if jq empty /tmp/result.json >/dev/null 2>&1; then
            jq -c '{ok:(.ok // null),authenticated:(.authenticated // null),authorized:(.authorized // null),email:(.email // null),role:(.role.name // .role // null),error:(.error // null)}' /tmp/result.json
          else
            echo "non_json_result" >&2
            head -c 500 /tmp/result.json >&2
          fi
          test "$code" -eq 200
          jq -e '.ok==true and .authorized==true and .email=="joseph.t.logan@gmail.com"' /tmp/result.json >/dev/null

      - name: Delete temporary bridge Worker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "bridge_delete_http=$code"
          if [[ "$code" -ge 200 && "$code" -lt 300 ]]; then
            jq -e '.success==true' /tmp/delete.json >/dev/null || true
          elif [[ "$code" != "404" ]]; then
            jq '{success,errors,messages}' /tmp/delete.json >&2 || cat /tmp/delete.json >&2
            exit 1
          fi

      - name: Verify production deployment unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(cat /tmp/active-before.txt)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/deployments-after.json
          AFTER=$(jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id' /tmp/deployments-after.json)
          echo "production_unchanged=$([[ "$BEFORE" == "$AFTER" ]] && echo true || echo false)"
          test "$BEFORE" = "$AFTER"
