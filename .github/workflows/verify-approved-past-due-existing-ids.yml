name: Verify three existing overdue remote publication IDs (GET only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-approved-past-due-existing-ids.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      VERIFY_BRIDGE: studio-approved-overdue-get-only-verify
    steps:
      - name: Deploy temporary exact allowlisted GET-only service-binding verifier
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )
          printf '%s' "$TOKEN" >/tmp/verification-token
          cat > /tmp/exact-get-only.js <<EOF
          const TOKEN = "$TOKEN";
          const ids = new Set(["recpOX4m8Rnq6xbpN","recWU6HbbmEm200iU","recARfalxM25191R4"]);
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              const session = url.pathname === "/" + TOKEN + "/session";
              const parts=url.pathname.split("/");
              const id=parts[2] || "";
              const receipt=parts.length===3 && parts[1]===TOKEN && ids.has(id);
              if(!session && !receipt) return new Response("Not found",{status:404});
              const path=session ? "/api/session" : "/api/admin/exception-recovery/"+id+"/receipt?authenticated=1";
              const internal=new Request("https://studio.chicagoshining.com"+path,{
                method:"GET",headers:{
                  "Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com",
                  Origin:"https://studio.chicagoshining.com",Accept:"application/json"
                }
              });
              const response=await env.STUDIO_API.fetch(internal);
              const data=await response.json().catch(()=>({}));
              return Response.json(session?
                {http:response.status,authenticated:data?.authenticated===true,authorized:data?.authorized===true}:
                {record_id:id,http:response.status,output_id:data?.output_id||null,
                 platform:data?.platform||null,verified_public:data?.verified_public===true,
                 ownership_verified:data?.ownership_verified===true,
                 verified_delivery:data?.verified_delivery===true,
                 evidence:data?.evidence||null,
                 remote_id:data?.remote_id||null,
                 checked_at:data?.checked_at||null,
                 eligible:data?.verification?.eligible===true,
                 blocked_reason:data?.verification?.blocked_reason||null}, {
                headers:{"Cache-Control":"no-store"}
              });
            }
          };
          EOF
          cat >/tmp/exact-get-only-metadata.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF
          node --check /tmp/exact-get-only.js
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -X DELETE "$API_ROOT/workers/scripts/$VERIFY_BRIDGE" -H "$AUTH" >/dev/null || true
          CODE=$(curl -sS -o /tmp/verify-upload.json -w '%{http_code}' -X PUT "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/content" -H "$AUTH" \
            -F 'metadata=@/tmp/exact-get-only-metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/exact-get-only.js;type=application/javascript+module;filename=worker.js')
          test "$CODE" -ge 200 && test "$CODE" -lt 300
          jq -e '.success==true' /tmp/verify-upload.json >/dev/null
          curl -fsS -X POST "$API_ROOT/workers/scripts/$VERIFY_BRIDGE/subdomain" -H "$AUTH" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' >/tmp/verify-subdomain.json
          jq -e '.success==true and .result.enabled==true' /tmp/verify-subdomain.json >/dev/null
      - name: Verify provider evidence from existing records only
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$API_ROOT/workers/subdomain" -H "$AUTH" -o /tmp/subdomain.json
          SUBDOMAIN=$(jq -er '.result.subdomain' /tmp/subdomain.json)
          TOKEN=$(cat /tmp/verification-token)
          BASE="https://$VERIFY_BRIDGE.$SUBDOMAIN.workers.dev/$TOKEN"
          for I in $(seq 1 30); do
            CODE=$(curl -sS --max-time 30 -o /tmp/verified-session.json -w '%{http_code}' "$BASE/session" || true)
            if [[ "$CODE" == "200" ]] && jq -e '.authenticated==true and .authorized==true' /tmp/verified-session.json >/dev/null 2>&1; then break; fi
            sleep 3
          done
          jq -e '.authenticated==true and .authorized==true' /tmp/verified-session.json >/dev/null
          echo "authenticated_read_only_session=PASS"
          for ID in recpOX4m8Rnq6xbpN recWU6HbbmEm200iU recARfalxM25191R4; do
            curl -fsS --retry 3 --retry-all-errors --retry-delay 2 --max-time 40 "$BASE/$ID" -o "/tmp/$ID.json"
            jq -c '{record_id,output_id,platform,http,verified_public,ownership_verified,verified_delivery,evidence,remote_id,checked_at,eligible,blocked_reason}' "/tmp/$ID.json"
          done
          echo "provider_reads_completed=3; publication_writes=0"
      - name: Destroy temporary verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$API_ROOT/workers/scripts/$VERIFY_BRIDGE" -H "$AUTH" >/dev/null || true
          echo "temporary_get_only_verifier_cleanup=attempted"
