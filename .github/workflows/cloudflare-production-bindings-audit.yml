name: Audit Studio API Production Bindings

on:
  push:
    branches: [main]
    paths:
      - 'deploy/cloudflare-production-bindings-audit.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chicagoshining-studio-api-bindings-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
    steps:
      - uses: actions/checkout@v6

      - name: Read active deployment and version details
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          curl -fsS "$API/deployments" -H "$AUTH" -o /tmp/deployments.json
          jq -e '.success==true' /tmp/deployments.json >/dev/null
          jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id' /tmp/deployments.json >/tmp/active-version.txt
          ACTIVE=$(cat /tmp/active-version.txt)

          curl -fsS "$API/versions/$ACTIVE" -H "$AUTH" -o /tmp/active-version.json
          jq -e '.success==true' /tmp/active-version.json >/dev/null

      - name: Produce sanitized binding evidence only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('repair/scripts')))
          from studio_api_binding_contract import assert_live_contract
          from studio_api_rollback_lifecycle import durable_object_names, sanitize_runtime_flags

          raw=json.loads(Path('/tmp/active-version.json').read_text())
          r=raw.get('result') or {}
          bindings=(r.get('resources') or {}).get('bindings') or []
          got={str(b.get('name') or ''):str(b.get('type') or '') for b in bindings}
          contract=assert_live_contract(got, 'active production Worker')
          plain={str(b['name']):str(b['text']) for b in bindings if b.get('type')=='plain_text' and 'text' in b}
          flags=sanitize_runtime_flags(plain)
          out={
              "worker":"chicagoshining-studio-api",
              "active":{
                  "version_id": r.get("id"),
                  "version_number": r.get("number"),
                  "binding_count": contract["binding_count"],
                  "bindings": contract["bindings"],
                  "contract": contract["contract"],
                  "core_ok": contract["core_ok"],
                  "elevenlabs_present": contract["optional_present"].get("ELEVENLABS_API_KEY"),
                  "elevenlabs_required": False,
                  "durable_object_namespaces": sorted(durable_object_names(bindings)),
                  "feature_flags": flags,
                  "home_and_refill_reads_off": flags.get("STUDIO_HOME_PROFILE_SUMMARY_READS") in ("false","absent")
                      and flags.get("STUDIO_REFILL_PROFILE_SUMMARY_READS") in ("false","absent"),
              },
          }
          Path('/tmp/bindings-audit-sanitized.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Summarize audit
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE=$(jq -r '.active.version_id' /tmp/bindings-audit-sanitized.json)
          ACTIVE_COUNT=$(jq -r '.active.binding_count' /tmp/bindings-audit-sanitized.json)
          CORE_OK=$(jq -r '.active.core_ok' /tmp/bindings-audit-sanitized.json)
          ELEVEN=$(jq -r '.active.elevenlabs_present' /tmp/bindings-audit-sanitized.json)
          DOS=$(jq -c '.active.durable_object_namespaces' /tmp/bindings-audit-sanitized.json)
          FLAGS=$(jq -c '.active.feature_flags' /tmp/bindings-audit-sanitized.json)
          READS_OFF=$(jq -r '.active.home_and_refill_reads_off' /tmp/bindings-audit-sanitized.json)
          {
            echo '### Studio API production binding audit'
            echo "- Active version: $ACTIVE"
            echo "- Active binding count: $ACTIVE_COUNT"
            echo "- Core 10-binding contract: $CORE_OK"
            echo "- ELEVENLABS_API_KEY present: $ELEVEN (optional)"
            echo "- Durable Object namespaces: $DOS"
            echo "- Sanitized feature flags: $FLAGS"
            echo "- Home/refill reads off: $READS_OFF"
            echo '- Evidence includes binding names/types plus named boolean feature flags only.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: studio-api-bindings-audit-${{ github.run_id }}
          path: /tmp/bindings-audit-sanitized.json
          retention-days: 30
