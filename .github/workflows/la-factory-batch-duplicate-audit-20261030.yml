name: LA Factory approval duplicate audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/la-factory-batch-duplicate-audit-20261030.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Create one-time R2 audit Worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/la-audit
          WORKER=chicagoshining-la-batch-audit-once
          printf '%s' "$WORKER" >/tmp/la-audit/worker
          openssl rand -hex 32 >/tmp/la-audit/token
          python3 - <<'PY'
          from pathlib import Path
          secret=Path('/tmp/la-audit/token').read_text().strip()
          worker=r"""const secret="__SECRET__";const profile="recF7UAn0LkMZZrWZ";
          export default {async fetch(req,env){
            if(req.method!=="GET"||new URL(req.url).pathname!=="/audit")return new Response("Not found",{status:404});
            if(req.headers.get("X-Audit-Token")!==secret)return new Response("Forbidden",{status:403});
            const prefix="studio/state/factory-approvals/v2/jobs/"+profile+"/";
            const all=[];let cursor=null,complete=false;
            for(let n=0;n<8;n++){
              const page=await env.STUDIO_MEDIA.list({prefix,limit:200,...(cursor?{cursor}:{})});
              all.push(...(page.objects||[]).map(o=>({key:o.key,uploaded:o.uploaded})));
              if(!page.truncated){complete=true;break;}
              if(!page.cursor||page.cursor===cursor)break;
              cursor=page.cursor;
            }
            all.sort((a,b)=>Date.parse(b.uploaded||0)-Date.parse(a.uploaded||0));
            const jobs=[];
            for(const row of all.slice(0,40)){
              const o=await env.STUDIO_MEDIA.get(row.key);
              if(!o)continue;
              try{const j=JSON.parse(await o.text());
                if(j.schema!=="studio.factory-batch.2")continue;
                jobs.push({id:j.id,request_id:j.request_id,group_request_id:j.group_request_id,
                  profile_id:j.profile_id,created_at:j.created_at,updated_at:j.updated_at,status:j.status,
                  items:(j.items||[]).map(i=>({id:i.id,output_id:i.output_id,content_id:i.content_id,
                    status:i.status,platform:i.platform,title:i.title}))});
              }catch(e){jobs.push({key:row.key,read_error:String(e).slice(0,100)});}
            }
            const overlaps=[];
            for(let i=0;i<jobs.length;i++)for(let k=i+1;k<jobs.length;k++){
              const a=jobs[i],b=jobs[k],ids=new Set((a.items||[]).map(x=>x.id));
              const common=(b.items||[]).filter(x=>ids.has(x.id));
              if(common.length)overlaps.push({jobA:a.request_id,jobB:b.request_id,
                shared_output_ids:common.map(x=>x.output_id),
                exact_same_set:common.length===a.items.length&&common.length===b.items.length});
            }
            return Response.json({ok:true,at:new Date().toISOString(),profile_id:profile,
              total_job_objects:all.length,complete,examined:jobs.length,jobs,overlaps});
          }};
          """
          Path('/tmp/la-audit/worker.js').write_text(worker.replace('__SECRET__',secret))
          PY
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$API/chicagoshining-studio-api/deployments" -H "$AUTH" -o /tmp/la-audit/current.json
          VERSION="$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/la-audit/current.json)"
          curl -fsS "$API/chicagoshining-studio-api/versions/$VERSION" -H "$AUTH" -o /tmp/la-audit/version.json
          BUCKET="$(jq -er '.result.resources.bindings[]|select(.name=="STUDIO_MEDIA" and .type=="r2_bucket")|(.bucket_name//.bucket)' /tmp/la-audit/version.json)"
          META="$(jq -cn --arg b "$BUCKET" '{main_module:"worker.js",bindings:[{name:"STUDIO_MEDIA",type:"r2_bucket",bucket_name:$b}]}')"
          curl -fsS -X PUT "$API/$WORKER" -H "$AUTH" -F "metadata=$META;type=application/json" \
            -F 'worker.js=@/tmp/la-audit/worker.js;type=application/javascript+module' -o /tmp/la-audit/create.json
          jq -e '.success==true' /tmp/la-audit/create.json >/dev/null
          curl -fsS "$API/$WORKER/versions" -H "$AUTH" -o /tmp/la-audit/versions.json
          V="$(jq -er '(.result.items//.result.versions//.result|if type=="array" then . else [] end)|sort_by(.number//0)|last|.id' /tmp/la-audit/versions.json)"
          jq -cn --arg v "$V" '{strategy:"percentage",versions:[{version_id:$v,percentage:100}]}' > /tmp/la-audit/deploy.json
          curl -fsS -X POST "$API/$WORKER/deployments" -H "$AUTH" -H 'Content-Type: application/json' \
            --data-binary @/tmp/la-audit/deploy.json -o /tmp/la-audit/deploy-result.json
          jq -e '.success==true' /tmp/la-audit/deploy-result.json >/dev/null
          curl -fsS -X POST "$API/$WORKER/subdomain" -H "$AUTH" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' -o /tmp/la-audit/route.json
          jq -e '.success==true' /tmp/la-audit/route.json >/dev/null
      - name: Read batch memberships and overlaps
        shell: bash
        run: |
          set -euo pipefail
          WORKER="$(cat /tmp/la-audit/worker)"
          CODE=000
          for attempt in $(seq 1 12); do
            CODE="$(curl -sS -o /tmp/la-audit/audit.json -w '%{http_code}' \
              "https://$WORKER.joseph-t-logan.workers.dev/audit" \
              -H "X-Audit-Token: $(cat /tmp/la-audit/token)" || true)"
            if [[ "$CODE" == 200 ]]; then break; fi
            if [[ "$CODE" != 404 && "$CODE" != 503 && "$CODE" != 000 ]]; then break; fi
            sleep 3
          done
          test "$CODE" = 200
          jq -e '.ok==true and .profile_id=="recF7UAn0LkMZZrWZ"' /tmp/la-audit/audit.json >/dev/null
          echo LA_FACTORY_AUDIT_BEGIN
          jq -c '{at,profile_id,total_job_objects,complete,examined,jobs,overlaps}' /tmp/la-audit/audit.json
          echo LA_FACTORY_AUDIT_END
      - name: Remove temporary Worker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/la-audit/worker || exit 0
          WORKER="$(cat /tmp/la-audit/worker)"
          curl -fsS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/la-audit/delete.json
          jq -e '.success==true' /tmp/la-audit/delete.json >/dev/null
          echo temporary_la_audit_worker_removed=PASS
