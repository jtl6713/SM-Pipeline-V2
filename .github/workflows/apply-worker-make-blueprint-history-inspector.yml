name: Apply Worker Make Blueprint History Inspector

on:
  push:
    branches: [main]
    paths:
      - 'deploy/apply-worker-make-blueprint-history-inspector.txt'

permissions:
  contents: write

concurrency:
  group: studio-worker-source-repair
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply read-only blueprint history inspector source patch
        shell: bash
        run: |
          set -euo pipefail
          python repair/tools/patch_worker_make_blueprint_history_inspector.py
          cp apps/studio-api/worker.js /tmp/studio-worker.mjs
          node --check /tmp/studio-worker.mjs
          grep -q 'inspect_make_blueprint_history' apps/studio-api/worker.js
          grep -q 'INSPECT-MAKE-BLUEPRINT-HISTORY-V1' apps/studio-api/worker.js
      - name: Commit patched Worker source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio-api/worker.js
          if git diff --cached --quiet; then
            echo 'Blueprint history inspector already present.'
            exit 0
          fi
          git commit -m 'Add read-only Make blueprint history inspector'
          git push origin HEAD:main
