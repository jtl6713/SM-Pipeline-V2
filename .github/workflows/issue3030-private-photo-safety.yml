name: Issue 3030 private photo source safety
on:
  pull_request:
    paths:
      - 'apps/studio-api/asset-private-preview-3030*'
      - 'apps/studio-api/worker-functions-03.mjs'
      - 'apps/studio-api/worker.js'
      - 'services/pipeline-runner/asset_private_preview.py'
      - 'services/pipeline-runner/tests/test_asset_private_preview.py'
      - 'services/pipeline-runner/app.py'
      - '.github/workflows/issue3030-private-photo-safety.yml'
permissions:
  contents: read
jobs:
  hermetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -q pytest -r services/pipeline-runner/requirements.txt
      - run: node --test apps/studio-api/asset-private-preview-3030.test.mjs apps/studio-api/media-asset-drive-photo.test.mjs
      - working-directory: services/pipeline-runner
        run: python -m pytest -q tests/test_asset_private_preview.py tests/test_factory_private_preview.py
