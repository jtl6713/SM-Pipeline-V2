name: Read R4 Module Runtime Shape

on:
  push:
    branches: [main]
    paths:
      - 'deploy/read-r4-module-runtime-shape.txt'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Resolve Make API credentials
        shell: bash
        run: |
          set -euo pipefail; umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:CLOUDFLARE_API_TOKEN -in deploy/credential-envelope/private.pem.enc -out /tmp/key.pem
          base64 -d deploy/credential-envelope/airtable_pat.ciphertext.b64 >/tmp/pat.enc
          openssl pkeyutl -decrypt -inkey /tmp/key.pem -in /tmp/pat.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -out /tmp/pat.txt
          PAT=$(cat /tmp/pat.txt)
          python - <<'PY' >/tmp/q.txt
          import urllib.parse
          f="OR({Setting_Name}='MAKE_API_TOKEN',{Setting_Name}='MAKE_API_BASE_URL')"
          print(urllib.parse.urlencode([('filterByFormula',f),('fields[]','Setting_Name'),('fields[]','Setting_Value'),('fields[]','Active')]))
          PY
          curl -fsS "https://api.airtable.com/v0/appe33zkZn35yirTL/tblpHPWeEkyJaF7ql?$(cat /tmp/q.txt)" -H "Authorization: Bearer $PAT" -o /tmp/settings.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/settings.json'))
          vals={r['fields'].get('Setting_Name'):r['fields'].get('Setting_Value') for r in d.get('records',[]) if r.get('fields',{}).get('Active')}
          open('/tmp/make-token.txt','w').write(str(vals['MAKE_API_TOKEN']).strip()); open('/tmp/make-base.txt','w').write(str(vals['MAKE_API_BASE_URL']).strip().rstrip('/'))
          PY
      - name: Read blueprint and latest module logs
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(cat /tmp/make-token.txt); BASE=$(cat /tmp/make-base.txt); SID=5556716
          curl -fsS "$BASE/scenarios/$SID/blueprint" -H "Authorization: Token $TOKEN" -o /tmp/bp.json
          curl -fsS "$BASE/scenarios/$SID/logs?pg%5Blimit%5D=4&pg%5BsortDir%5D=desc" -H "Authorization: Token $TOKEN" -o /tmp/logs.json
          python - <<'PY' >/tmp/module-ids.txt
          import json
          b=json.load(open('/tmp/bp.json')); bp=b.get('blueprint') or (b.get('response') or {}).get('blueprint') or b
          ids=[]
          def walk(flow):
            for n in flow or []:
              ids.append(int(n.get('id')))
              for r in n.get('routes') or []: walk(r.get('flow') or [])
          walk(bp.get('flow') or [])
          print('\n'.join(map(str,ids)))
          PY
          : >/tmp/modulelogs.ndjson
          while read -r MID; do
            code=$(curl -sS -o /tmp/ml.json -w '%{http_code}' "$BASE/scenarios/$SID/modules/$MID/logs?pg%5Blimit%5D=4&pg%5BsortDir%5D=desc" -H "Authorization: Token $TOKEN" || true)
            MID="$MID" CODE="$code" python - <<'PY' >>/tmp/modulelogs.ndjson
          import json,os
          mid=int(os.environ['MID']); code=os.environ['CODE']
          try:d=json.load(open('/tmp/ml.json'))
          except:d={}
          rows=[]
          for r in d.get('moduleLogs',[])[:4]: rows.append({k:r.get(k) for k in ('executionId','timestamp','status','bundles')})
          print(json.dumps({'module_id':mid,'http':code,'logs':rows},separators=(',',':')))
          PY
          done </tmp/module-ids.txt
          python - <<'PY'
          import json,re
          b=json.load(open('/tmp/bp.json')); bp=b.get('blueprint') or (b.get('response') or {}).get('blueprint') or b
          modules=[]
          def clean(v,k=''):
            kl=str(k).lower()
            if any(x in kl for x in ('token','secret','password','authorization','connection')): return '<redacted>'
            if isinstance(v,dict): return {a:clean(x,a) for a,x in v.items()}
            if isinstance(v,list): return [clean(x,k) for x in v]
            if isinstance(v,str) and re.search(r'https?://',v,re.I): return '<redacted-url>'
            return v
          def walk(flow):
            for n in flow or []:
              modules.append({'id':n.get('id'),'module':n.get('module'),'name':((n.get('metadata') or {}).get('designer') or {}).get('name'),'filter':clean(n.get('filter')),'mapper':clean(n.get('mapper')),'parameters':clean(n.get('parameters'))})
              for r in n.get('routes') or []: walk(r.get('flow') or [])
          walk(bp.get('flow') or [])
          logs=[json.loads(x) for x in open('/tmp/modulelogs.ndjson') if x.strip()]
          out={'modules':modules,'module_logs':logs}
          open('/tmp/r4-runtime-shape.json','w').write(json.dumps(out,indent=2,sort_keys=True))
          latest=None
          sl=json.load(open('/tmp/logs.json')).get('scenarioLogs',[])
          for r in sl:
            if r.get('type') in ('auto','manual'):
              latest=r.get('id'); break
          print('latest_execution='+str(latest))
          for row in logs:
            hit=[x for x in row['logs'] if x.get('executionId')==latest]
            if hit: print(json.dumps({'module_id':row['module_id'],'latest':hit[0]},sort_keys=True))
          print(json.dumps([{'id':m['id'],'module':m['module'],'name':m['name']} for m in modules],indent=2))
          PY
      - name: Destroy credentials
        if: always()
        shell: bash
        run: |
          for f in /tmp/key.pem /tmp/pat.enc /tmp/pat.txt /tmp/make-token.txt /tmp/make-base.txt /tmp/settings.json /tmp/bp.json /tmp/logs.json /tmp/ml.json; do [[ ! -e "$f" ]] || shred -u "$f" 2>/dev/null || rm -f "$f"; done
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-module-runtime-shape-${{ github.run_id }}
          path: /tmp/r4-runtime-shape.json
          retention-days: 30
