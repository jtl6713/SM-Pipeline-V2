name: Prepare UI 0.6.720 Single Profile Prompts
on:
  push:
    branches: [fix/profile-admin-selected-existing-guidance-20261018]
    paths:
      - '.github/workflows/prepare-single-profile-prompt-release.yml'
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/profile-admin-selected-existing-guidance-20261018
          persist-credentials: true
      - name: Consistently version HTML, bundled JavaScript, and regression assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old = '0.6.719-profile-creative-guidance'
          new = '0.6.720-single-profile-prompts'
          html = Path('apps/studio-web/index.html')
          app = Path('apps/studio-web/assets/app-item4-1008.js')
          a = html.read_text(encoding='utf-8')
          b = app.read_text(encoding='utf-8')
          if a.count(old) < 20 or ('item4-' + old) not in b or 'UI build 0.6.719' not in a:
              raise SystemExit('Unexpected Studio release baseline; refusing drift')
          html.write_text(a.replace(old, new).replace('UI build 0.6.719', 'UI build 0.6.720'), encoding='utf-8')
          app.write_text(b.replace('item4-' + old, 'item4-' + new), encoding='utf-8')
          count = 0
          for path in Path('apps/studio-web').rglob('*.test.mjs'):
              before = path.read_text(encoding='utf-8')
              after = before.replace(old, new)
              after = after.replace(old.replace('.', chr(92) + '.'), new.replace('.', chr(92) + '.'))
              after = after.replace('0.6.719', '0.6.720')
              after = after.replace('0' + chr(92) + '.6' + chr(92) + '.719', '0' + chr(92) + '.6' + chr(92) + '.720')
              if after != before:
                  path.write_text(after, encoding='utf-8')
                  count += 1
          print('Release updated: UI 0.6.720, updated test modules=', count)
          if count < 10:
              raise SystemExit('Expected broad existing UI release assertions; refusing partial bump')
          PY
          node apps/studio-web/ui-release-contract.mjs
          node --test apps/studio-web/ui-release-contract.test.mjs apps/studio-web/profile-admin-creative.test.mjs apps/studio-web/factory-desk.test.mjs apps/studio-web/factory-batch-quality-agent.test.mjs
      - name: Commit consistent version update on PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u apps/studio-web
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Release UI 0.6.720: single-profile Admin and inherited prompts"
          git push origin HEAD:fix/profile-admin-selected-existing-guidance-20261018
