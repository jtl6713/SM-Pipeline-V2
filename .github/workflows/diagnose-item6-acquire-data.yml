name: Diagnose Item6 Acquire Data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-item6-acquire-data.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Decrypt verified Airtable PAT
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:CLOUDFLARE_API_TOKEN -in deploy/credential-envelope/private.pem.enc -out /tmp/key.pem
          base64 -d deploy/credential-envelope/airtable_pat.ciphertext.b64 >/tmp/pat.enc
          openssl pkeyutl -decrypt -inkey /tmp/key.pem -in /tmp/pat.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -out /tmp/pat.txt
      - name: Read Output 167 and exact scenario lease rows
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $(cat /tmp/pat.txt)"
          BASE='https://api.airtable.com/v0/appe33zkZn35yirTL'
          curl -fsS "$BASE/tblrlPeboBthkplH0/recdCzUqxwQMYcK6g" -H "$AUTH" -o /tmp/output.json
          curl -fsS -G "$BASE/tbltuSt9UibYzxpah" -H "$AUTH" \
            --data-urlencode 'pageSize=100' \
            --data-urlencode 'maxRecords=100' \
            --data-urlencode 'sort[0][field]=Requested_At' \
            --data-urlencode 'sort[0][direction]=desc' \
            --data-urlencode 'filterByFormula=AND({Status}="Processing",FIND("REPAIR_LEASE_V1", {Notes}&"")>0,{Scenario_ID}=5813561)' \
            -o /tmp/leases.json
          echo 'OUTPUT_167='
          jq -c '{id,fields:{Platform:.fields.Platform,Do_Not_Publish:.fields.Do_Not_Publish,Test_Run_ID:.fields.Test_Run_ID,Output_ID:.fields.Output_ID,Replace_Transaction_ID:.fields.Replace_Transaction_ID,Replace_State:.fields.Replace_State}}' /tmp/output.json
          echo 'LEASE_ROWS='
          jq -c '[.records[]|{id,Status:.fields.Status,Scenario_ID:.fields.Scenario_ID,Correlation_ID:.fields.Correlation_ID,Requested_At:.fields.Requested_At,Request_JSON:.fields.Request_JSON,Result_JSON:.fields.Result_JSON,Notes:.fields.Notes}]' /tmp/leases.json
          echo "lease_row_count=$(jq '.records|length' /tmp/leases.json)"
      - name: Replay exact Worker lease-row create then delete it
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $(cat /tmp/pat.txt)"
          URL='https://api.airtable.com/v0/appe33zkZn35yirTL/tbltuSt9UibYzxpah'
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EXP=$(date -u -d '+10 minutes' +%Y-%m-%dT%H:%M:%SZ)
          CONTRACT=$(jq -cn --arg exp "$EXP" '{kind:"REPAIR_LEASE_V1",lease_id:"ITEM6_DIAG_SCHEMA_20260817",test_run_id:"ITEM6_CLEANUP_20260817_1217A",scenario_id:5813561,expires_at:$exp,max_runs:1,max_operations:20,allowed_platform_output_record_ids:["recdCzUqxwQMYcK6g"],allowed_content_item_record_ids:[],deny_fixture_record_ids:[],allow_public_publish:false,explicit_publish_platform:null}')
          BODY=$(jq -cn --arg now "$NOW" --arg contract "$CONTRACT" '{records:[{fields:{Command_ID:"REPAIR-LEASE-DIAG-5813561",Action:"GET_SCENARIO",Scenario_ID:5813561,Scenario_Name:"Repair activation lease 5813561",Request_JSON:$contract,Write_Approved:false,Activation_Approved:false,Status:"Processing",Result_JSON:"{\"kind\":\"REPAIR_LEASE_V1\",\"state\":\"active\",\"operations_used\":0,\"runs_used\":0}",Requested_At:$now,Started_At:$now,Requested_By:"studio-admin",Correlation_ID:"ITEM6_CLEANUP_20260817_1217A",Notes:"REPAIR_LEASE_V1 ITEM6_DIAG_SCHEMA_20260817; exact resource allowlist enforced; standalone RUN disabled; only stage-specific guarded pulses permitted."}}],typecast:true}')
          code=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST "$URL" -H "$AUTH" -H 'Content-Type: application/json' --data "$BODY")
          echo "lease_create_http=$code"
          jq -c '{records:[.records[]? | {id,fields:{Status:.fields.Status,Scenario_ID:.fields.Scenario_ID,Correlation_ID:.fields.Correlation_ID}}],error:(.error//null)}' /tmp/create.json || cat /tmp/create.json
          if [[ "$code" -ge 200 && "$code" -lt 300 ]]; then
            RID=$(jq -er '.records[0].id' /tmp/create.json)
            delcode=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE "$URL/$RID" -H "$AUTH")
            echo "lease_delete_http=$delcode record_id=$RID"
            test "$delcode" = '200'
          fi
          test "$code" -ge 200 -a "$code" -lt 300
      - name: Destroy credential material
        if: always()
        shell: bash
        run: |
          for f in /tmp/key.pem /tmp/pat.enc /tmp/pat.txt; do [[ ! -e "$f" ]] || shred -u "$f" 2>/dev/null || rm -f "$f"; done
