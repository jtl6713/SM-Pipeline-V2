name: Incident 2853 live watchdog selector and workload readback
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/incident-2853-watchdog-live-readback.yml'
      - '.github/scripts/incident-2853-watchdog-live-readback.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/incident-2853-watchdog-live-readback.yml'
permissions:
  contents: read
concurrency:
  group: incident-2853-watchdog-live-readback
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Parse read-only diagnostic
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.github/scripts/incident-2853-watchdog-live-readback.ps1'),
            [ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){$errors | ForEach-Object {Write-Output ('parse_error='+$_.ErrorId+' line='+$_.Extent.StartLineNumber)};throw 'readonly_script_parse_invalid'}
          if((Get-Content '.github/scripts/incident-2853-watchdog-live-readback.ps1' -Raw).Length -gt 7800){throw 'readonly_script_too_large'}
      - name: Compile both embedded read-only Python probes
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('.github/scripts/incident-2853-watchdog-live-readback.ps1').read_text()
          probes=re.findall(r"(?m)^\$(?:code|probe)\s*=\s*@'\n([\s\S]*?)\n'@$",s)
          assert len(probes)==2
          for i, source in enumerate(probes):
              compile(source, f"read_only_probe_{i}", "exec")
          PY
  exact-audio-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check both known failed receipt objects without generating audio
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  return None
          base="https://media.chicagoshining.com/studio/previews/story-voiceover/"
          exact=[
              (11228,"recX91Bo62trG2lJ6/330a613f28cc1e1b813661d124e50c62f546747328b5798d4b623d03bb4b76fe.mp3","f5e251a04e95c9cdaa1b3ec86b2758ad3e7d079ccf1deb8427835904c8aa78ae"),
              (11277,"recgBtukVbv5vAMzS/2e71d62e8373a8a803ce2a1925372903f9a9bd45fa65c867b187bce18346f859.mp3","226eee5e3801d5f36928677ef3493bcecfc61611996209a417063aaa1db8d7f3"),
          ]
          opener=urllib.request.build_opener(NoRedirect())
          for number,key,digest in exact:
              try:
                  req=urllib.request.Request(base+key,headers={"Cache-Control":"no-cache"})
                  with opener.open(req,timeout=20) as response:
                      body=response.read(8388609)
                      result="checksum_match" if len(body)<=8388608 and hashlib.sha256(body).hexdigest()==digest else "checksum_mismatch_or_oversize"
              except urllib.error.HTTPError as exc:
                  result="http_"+str(exc.code)
              except Exception:
                  result="unavailable"
              print("story_cache_exact="+json.dumps({"output_number":number,"result":result}))
          PY
  readback:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Run exact authenticated read-only REST and local queue diagnostic
        shell: bash
        env:
          OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
          OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
          OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
        run: |
          set -euo pipefail
          BASE=https://ops.chicagoshining.com
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            [[ -n "$candidate" ]] || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then selected="$candidate"; break; fi
          done
          test -n "$selected"
          jq -Rs '{command:.,confirm:true}' .github/scripts/incident-2853-watchdog-live-readback.ps1 > /tmp/readonly.json
          job=''
          for attempt in $(seq 1 120); do
            code=$(curl -sS --max-time 20 -o /tmp/start.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $selected" -H 'Content-Type: application/json' --data-binary @/tmp/readonly.json || true)
            if [[ "$code" == 202 ]]; then job=$(jq -er '.job.id' /tmp/start.json); break; fi
            [[ "$code" == 409 ]] || { echo "readonly_ops_launch_http=$code"; exit 1; }
            sleep 5
          done
          [[ -n "$job" ]] || { echo "watchdog2853_ops_busy_no_job"; exit 1; }
          echo "watchdog2853_ops_job_id=$job"
          for attempt in $(seq 1 45); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $selected" "$BASE/api/jobs/$job" -o /tmp/readonly-status.json
            state=$(jq -r '.job.status' /tmp/readonly-status.json)
            [[ "$state" == ok || "$state" == failed ]] && break
            sleep 3
          done
          # Never print the shell command, raw transcript or response body.
          python - <<'PY'
          import json,re
          from pathlib import Path
          data=json.loads(Path('/tmp/readonly-status.json').read_text())
          job=data['job']
          lines=job.get('log','').splitlines()
          for key in ('rest','workload','queue','story'):
              matches=[l.split('=',1)[1] for l in lines if re.match(r'^watchdog2853_'+key+r'=\{.*\}$',l)]
              if len(matches)!=1:
                  print('watchdog2853_'+key+'=UNVERIFIED')
                  continue
              obj=json.loads(matches[0])
              print('watchdog2853_'+key+'='+json.dumps(obj,sort_keys=True,separators=(',',':')))
          errors=sorted(set(re.findall(r'watchdog2853_failed_[a-z_]+', '\n'.join(lines))))
          if errors: print('watchdog2853_error_codes='+','.join(errors))
          if job.get('status')!='ok' or lines.count('watchdog2853_proof=PASS_READONLY')!=1:
              raise SystemExit('watchdog2853_live_proof_failed_or_incomplete')
          for key in ('rest','workload','queue','story'):
              if sum(bool(re.match(r'^watchdog2853_'+key+r'=\{.*\}$',l)) for l in lines)!=1:
                  raise SystemExit('watchdog2853_missing_receipt_'+key)
          print('watchdog2853_proof=PASS_READONLY')
          PY
