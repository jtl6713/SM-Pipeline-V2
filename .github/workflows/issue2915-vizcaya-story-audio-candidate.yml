name: Issue 2915 Vizcaya Story Audio Repair Candidate
on:
  pull_request:
    paths:
      - 'repair/scripts/issue2915-vizcaya-story-audio-candidate.py'
      - '.github/workflows/issue2915-vizcaya-story-audio-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'repair/scripts/issue2915-vizcaya-story-audio-candidate.py'
      - '.github/workflows/issue2915-vizcaya-story-audio-candidate.yml'
permissions:
  contents: read
concurrency:
  group: issue2915-vizcaya-story-audio-candidate
  cancel-in-progress: false
jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact target, no provider mutation, score synthesis and held media candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile repair/scripts/issue2915-vizcaya-story-audio-candidate.py
          python3 - <<'PY'
          import ast, array, hashlib, math, sys, tempfile, wave
          from pathlib import Path
          p=Path('repair/scripts/issue2915-vizcaya-story-audio-candidate.py')
          s=p.read_text(); tree=ast.parse(s)
          for required in ['resource_slot','circuit_open','recovery_read_only_active','studio_write_source','studio_runner_output_read_source','5628','rec1Zg5eEJjQKzUDO','canonical_generated_parent','original_mixed_audio_reused','picture_stream_identical','human_audio_review_required','source_writes','provider_writes','factory_approvals']:
              assert required in s, required
          for forbidden in ['api.airtable.com','graph.facebook.com','media_publish','requests.post','requests.patch','requests.delete','requests.put']:
              assert forbidden not in s, forbidden
          scope=dict(array=array,math=math,sys=sys,wave=wave,RATE=48000)
          helper=ast.Module(body=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in ('require','original_score')],type_ignores=[])
          exec(compile(helper,'score-helper','exec'),scope)
          with tempfile.TemporaryDirectory() as tmp:
              a,b=Path(tmp)/'a.wav',Path(tmp)/'b.wav'
              scope['original_score'](a,2.0); scope['original_score'](b,2.0)
              assert a.read_bytes()==b.read_bytes()
              with wave.open(str(a),'rb') as f:
                  assert (f.getnchannels(),f.getframerate(),f.getnframes())==(2,48000,96000)
                  data=array.array('h');data.frombytes(f.readframes(96000))
                  assert 0<max(abs(x) for x in data)<5000
          assert '"-map","0:v:0","-map","[a]"' in s
          print('ISSUE2915_STORY_AUDIO_STATIC_PASS')
          PY
  stage-owned-media:
    if: github.event_name == 'push'
    needs: static-safety
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate existing Ops runner without exposing credential
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C";do
            [[ -n "$candidate" ]] || continue
            http=$(curl -sS --max-time 20 -o /tmp/issue2915-ops-catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" 'https://ops.chicagoshining.com/api/catalog' || true)
            if [[ "$http" == 200 ]] && jq -e '.ok==true' /tmp/issue2915-ops-catalog.json >/dev/null;then
              echo "::add-mask::$candidate"
              echo "ISSUE2915_OPS_TOKEN=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'Held Story audio staging blocked: Ops unavailable; no media state changed'; exit 1
      - name: Build pinned SHA256 source execution request for original owner runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,json,pathlib
          src=pathlib.Path('repair/scripts/issue2915-vizcaya-story-audio-candidate.py')
          expected=hashlib.sha256(src.read_bytes()).hexdigest()
          sha=os.environ['GITHUB_SHA']
          assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha)
          url=f'https://raw.githubusercontent.com/jtl6713/SM-Pipeline-V2/{sha}/{src.as_posix()}'
          command=(
              "$ErrorActionPreference='Stop';"
              "$py=Get-Command python -ErrorAction SilentlyContinue;"
              "if(-not $py){throw 'ops_python_missing'};"
              "$tmp=Join-Path $env:TEMP 'issue2915-vizcaya-story-audio-candidate.py';"
              f"$srcUrl='{url}';"
              "Invoke-WebRequest -Uri $srcUrl -Method Get -OutFile $tmp -UseBasicParsing -TimeoutSec 55;"
              "$actual=(Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant();"
              f"if($actual -ne '{expected}'){{throw 'exact_stage_source_checksum_mismatch'}};"
              "try{& python $tmp;"
              "if($LASTEXITCODE -ne 0){throw ('vizcaya_story_audio_stage_exit_'+$LASTEXITCODE)}}"
              "finally{Remove-Item $tmp -Force -ErrorAction SilentlyContinue}"
          )
          pathlib.Path('/tmp/issue2915-ops-request.json').write_text(json.dumps({'command':command,'confirm':True}))
          print('IMMUTABLE_ISSUE2915_STAGE_SOURCE_PINNED')
          PY
      - name: Stage corrected Story candidate, no output writes
        shell: bash
        run: |
          set -euo pipefail
          accepted=false
          for slot in $(seq 1 32);do
            code=$(curl -sS --max-time 30 -o /tmp/issue2915-ops-start.json -w '%{http_code}' \
              -X POST 'https://ops.chicagoshining.com/api/shell' \
              -H "Authorization: Bearer $ISSUE2915_OPS_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @/tmp/issue2915-ops-request.json || true)
            if [[ "$code" == 200 || "$code" == 202 ]];then accepted=true;break;fi
            if [[ "$code" != 409 ]];then echo "R2 owner runner returned $code";exit 2;fi
            sleep 12
          done
          [[ "$accepted" == true ]] || { echo 'Ops shell busy; no second stage scheduled';exit 2; }
          job=$(jq -er '.job.id // .jobId' /tmp/issue2915-ops-start.json)
          for tick in $(seq 1 480);do
            curl -fsS --max-time 30 -H "Authorization: Bearer $ISSUE2915_OPS_TOKEN" \
              "https://ops.chicagoshining.com/api/jobs/$job" -o /tmp/issue2915-ops-job.json
            status=$(jq -r '.job.status // empty' /tmp/issue2915-ops-job.json)
            if [[ "$status" == ok ]];then
              jq -r '.job.log // ""' /tmp/issue2915-ops-job.json | grep '^ISSUE2915_STORY_AUDIO_CANDIDATE=' | tail -1 \
                | sed 's/^ISSUE2915_STORY_AUDIO_CANDIDATE=//' > /tmp/issue2915-story-audio-candidate.json
              jq -e '.verified==true and .output==5628 and .content==1018 and .source_writes==0 and .provider_writes==0 and .factory_approvals==0 and .cdn_verified==true and .picture_stream_identical==true and .original_mixed_audio_reused==false and .human_audio_review_required==true and .music_origin=="new_procedural_original_no_samples"' /tmp/issue2915-story-audio-candidate.json >/dev/null
              jq -c '{verified,output,content,source_updated_at,parent_updated_at,source_writes,provider_writes,factory_approvals,original_sha256,narration_sha256,narration_source,narration_seconds,music_origin,music_sha256,picture_stream_identical,original_mixed_audio_reused,video_seconds,geometry,audio,url,sha256,cdn_verified,human_audio_review_required}' /tmp/issue2915-story-audio-candidate.json
              exit 0
            elif [[ "$status" == failed ]];then
              echo 'Owned Held Story audio stage failed; no automatic source/approval/provider changes'
              jq -r '.job.log // ""' /tmp/issue2915-ops-job.json | tail -n 23 \
                | sed -E 's#[A-Za-z0-9_./+=-]{28,}#[redacted]#g' \
                | grep -Ev 'Authorization:|Bearer |SUPABASE_SERVICE_ROLE_KEY|R2_UPLOAD_WORKER_SECRET|GOOGLE_REFRESH_TOKEN' || true
              exit 3
            fi
            sleep 4
          done
          echo 'R2 staging job incomplete; do not set public statuses Ready'; exit 4
      - name: Preserve sanitized candidate checksum and provenance receipts for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue2915-vizcaya-story-audio-candidate
          path: /tmp/issue2915-story-audio-candidate.json
          retention-days: 30
          if-no-files-found: warn
