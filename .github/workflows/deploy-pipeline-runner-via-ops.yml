name: Deploy Pipeline Runner via Ops Dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-pipeline-runner-via-ops.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test runner safety regressions (no external writes)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r services/pipeline-runner/requirements.txt pytest
          PYTHONPATH=services/pipeline-runner python -m pytest -q \
            services/pipeline-runner/tests/test_a2b_existing_lookup.py \
            services/pipeline-runner/tests/test_i1_title_uniqueness.py \
            services/pipeline-runner/tests/test_i1_partial_creation.py \
            services/pipeline-runner/tests/test_idea_chain.py \
            services/pipeline-runner/tests/test_airtable_atomic_upsert.py \
            services/pipeline-runner/tests/test_airtable_egress_monitor.py \
            services/pipeline-runner/tests/test_airtable_durable_egress.py \
            services/pipeline-runner/tests/test_r2_studio_exact_source.py \
            services/pipeline-runner/tests/test_profile_music_policy.py \
            services/pipeline-runner/tests/test_item4_variant_batch.py \
            services/pipeline-runner/tests/test_fbs2_storage_retry.py \
            services/pipeline-runner/tests/test_fbs3_rate_limit_guard.py \
            services/pipeline-runner/tests/test_fbs3_eligibility.py \
            services/pipeline-runner/tests/test_supabase_pipeline_writes.py \
            services/pipeline-runner/tests/test_visual_watermark.py \
            services/pipeline-runner/tests/test_apc_cover_selection_qa1050.py \
            services/pipeline-runner/tests/test_ap1_igs_eligibility.py \
            services/pipeline-runner/tests/test_tiktok_photo_cover.py \
            services/pipeline-runner/tests/test_ttd_email_text.py \
            services/pipeline-runner/tests/test_tiktok_photo_sound_guard.py \
            services/pipeline-runner/tests/test_ttd4_manual_hold_completion.py \
            services/pipeline-runner/tests/test_public_cover.py \
            services/pipeline-runner/tests/test_rendering_review_publication.py \
            services/pipeline-runner/tests/test_rendering_review_producer.py \
            services/pipeline-runner/tests/test_rendering_review_producer_http.py \
            services/pipeline-runner/tests/test_rendering_review_recovery.py \
            services/pipeline-runner/tests/test_rendering_review_http_transport.py \
            services/pipeline-runner/tests/test_rendering_review_audio_qa.py \
            services/pipeline-runner/tests/test_rendering_review_media_http.py \
            services/pipeline-runner/tests/test_ame_encoder.py \
            services/pipeline-runner/tests/test_studio_compress.py

      - name: Deploy Pipeline Runner through allowlisted Ops action
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            if [[ -z "$candidate" ]]; then continue; fi
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}'               -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == "200" ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then
              selected="$candidate"; break
            fi
          done
          test -n "$selected"

          code=$(curl -sS --max-time 30 -o /tmp/run.json -w '%{http_code}'             -X POST "$BASE/api/run"             -H "Authorization: Bearer $selected"             -H 'Content-Type: application/json'             --data '{"action":"deploy","service":"pipeline-runner","confirm":true}' || true)

          if [[ "$code" == "409" ]]; then
            JOB=$(jq -r '.jobId // .job.id // empty' /tmp/run.json)
          else
            test "$code" = "202"
            jq -e '.ok==true' /tmp/run.json >/dev/null
            JOB=$(jq -r '.job.id // empty' /tmp/run.json)
          fi
          test -n "$JOB"

          for i in $(seq 1 100); do
            code=$(curl -sS --max-time 20 -o /tmp/job.json -w '%{http_code}'               -H "Authorization: Bearer $selected" "$BASE/api/jobs/$JOB" || true)
            if [[ "$code" == "200" ]]; then
              status=$(jq -r '.job.status // empty' /tmp/job.json)
              echo "ops_job_status=$status"
              case "$status" in
                ok) jq -c '{ok,job:{id:.job.id,status:.job.status,exitCode:.job.exitCode}}' /tmp/job.json; exit 0 ;;
                failed) jq -c '{ok,job:{id:.job.id,status:.job.status,exitCode:.job.exitCode,log:.job.log}}' /tmp/job.json; exit 4 ;;
              esac
            fi
            sleep 5
          done
          exit 5

      - name: Verify Pipeline Runner health
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(grep '^PIPELINE_RUNNER_CODE_VERSION = ' services/pipeline-runner/config.py | cut -d '"' -f 2)
          test -n "$EXPECTED"
          for i in $(seq 1 18); do
            code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' 'https://pipeline.chicagoshining.com/health' || true)
            if [[ "$code" == "200" ]] && jq -e --arg expected "$EXPECTED" '.ok==true and .version==$expected' /tmp/health.json >/dev/null 2>&1; then
              cat /tmp/health.json
              echo "Verified deployed runner version: $EXPECTED"
              exit 0
            fi
            sleep 5
          done
          cat /tmp/health.json || true
          exit 6

      - name: Verify exact private Chicago V2 video endpoint is authentication-gated
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --max-time 15 -o /tmp/review-media-denied.json -w '%{http_code}' \
            'https://pipeline.chicagoshining.com/jobs/rendering-review/attempt-media/rec0uVrVeiUM6shp9/rrattempt_probe1234' || true)
          test "$status" = "401"
          jq -e '.ok==false and .error=="review_media_auth_required"' /tmp/review-media-denied.json >/dev/null
          echo "chicago_review_private_google_media_route=PASS auth_required=true no_render=true"


      - name: One-time exact Chicago Waterfront compression recovery (no publish)
        if: ${{ success() && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'studio-ame-size-canary-20261030:') }}
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            if [[ -z "$candidate" ]]; then continue; fi
            code=$(curl -sS --max-time 20 -o /tmp/ame-catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == "200" ]] && jq -e '.ok==true' /tmp/ame-catalog.json >/dev/null 2>&1; then
              selected="$candidate"; break
            fi
          done
          test -n "$selected"
          cat > /tmp/chicago-ame-recover.ps1 <<'PS'
          $ErrorActionPreference = "Stop"
          $record = "recZKifUsQgTQBwbR"
          $asset = "59a9b4d684904e5382"
          $health = Invoke-RestMethod -Uri "http://127.0.0.1:3350/health" -TimeoutSec 15
          if ($health.ok -ne $true -or $health.version -ne "2026-10-30-studio-ame-size-guard-v2") { throw "runner_version_mismatch" }
          $ame = $false
          try {
            $bridge = Invoke-RestMethod -Uri "http://127.0.0.1:3344/health" -TimeoutSec 4
            $ame = ($bridge.ok -eq $true -and $bridge.service -eq "chicagoshining-ame-bridge" -and $bridge.delete_watch_source -eq $true)
          } catch {}
          $gui = @(Get-Process -ErrorAction SilentlyContinue | Where-Object {$_.ProcessName -like "Adobe Media Encoder*"}).Count -gt 0
          Write-Output ("ame_bridge_ready=" + $ame)
          Write-Output ("ame_gui_process_present=" + $gui)
          $envfile = Join-Path (Get-Location) "Services\pipeline-runner\service\.env"
          if (-not (Test-Path $envfile)) { throw "runner_env_missing" }
          $line = @(Get-Content $envfile | Where-Object {$_ -match '^\s*PIPELINE_RUNNER_SHARED_SECRET\s*='}) | Select-Object -Last 1
          if (-not $line) { throw "runner_auth_missing" }
          $secret = ([string]$line -split '=', 2)[1].Trim().Trim('"', "'")
          if (-not $secret) { throw "runner_auth_empty" }
          $payload = @{production_request_record_id=$record; source_asset_id=$asset} | ConvertTo-Json -Compress
          $resp = Invoke-RestMethod -Uri "http://127.0.0.1:3350/jobs/studio-compress" -Method POST -Headers @{"X-Pipeline-Secret"=$secret} -Body $payload -ContentType "application/json" -TimeoutSec 15
          if ($resp.accepted -ne $true -or $resp.production_request_record_id -ne $record -or $resp.source_asset_id -ne $asset) { throw "exact_studio_compress_not_accepted" }
          Write-Output ("chicago_exact_compress_accepted=true")
          Write-Output ("chicago_already_running=" + $resp.already_running)
          PS
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/chicago-ame-recover.json').write_text(json.dumps({"command":Path('/tmp/chicago-ame-recover.ps1').read_text(),"confirm":True}))
          PY
          code=$(curl -sS --max-time 20 -o /tmp/chicago-ame-job.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $selected" -H 'Content-Type: application/json' --data-binary @/tmp/chicago-ame-recover.json || true)
          if [[ "$code" != "202" && "$code" != "200" ]]; then echo "exact_chicago_ame_shell_start_failed=$code"; exit 1; fi
          job=$(jq -r '.job.id // .jobId // empty' /tmp/chicago-ame-job.json)
          test -n "$job"
          for n in $(seq 1 30); do
            curl -sS --max-time 20 -H "Authorization: Bearer $selected" "$BASE/api/jobs/$job" -o /tmp/chicago-ame-job-status.json
            state=$(jq -r '.job.status // empty' /tmp/chicago-ame-job-status.json)
            if [[ "$state" == "ok" ]]; then
              jq -r '.job.log // ""' /tmp/chicago-ame-job-status.json | grep -E '^(ame_bridge_ready|ame_gui_process_present|chicago_exact_compress_accepted|chicago_already_running)='
              jq -e '.job.log|contains("chicago_exact_compress_accepted=true")' /tmp/chicago-ame-job-status.json >/dev/null
              exit 0
            fi
            if [[ "$state" == "failed" ]]; then echo "exact_chicago_ame_shell_failed"; exit 2; fi
            sleep 3
          done
          echo "exact_chicago_ame_shell_timeout"; exit 3

