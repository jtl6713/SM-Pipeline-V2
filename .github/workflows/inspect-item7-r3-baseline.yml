name: Inspect Item7 R3 Baseline

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-item7-r3-baseline.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCENARIO_ID: '5557966'
      OUTPUT_RECORD_ID: recByMge4QPlCOsD2
    steps:
      - uses: actions/checkout@v6
      - name: Resolve API credentials without logging values
        shell: bash
        run: |
          set -euo pipefail; umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:CLOUDFLARE_API_TOKEN -in deploy/credential-envelope/private.pem.enc -out /tmp/key.pem
          base64 -d deploy/credential-envelope/airtable_pat.ciphertext.b64 >/tmp/pat.enc
          openssl pkeyutl -decrypt -inkey /tmp/key.pem -in /tmp/pat.enc -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -pkeyopt rsa_mgf1_md:sha256 -out /tmp/pat.txt
          PAT=$(cat /tmp/pat.txt)
          python - <<'PY' >/tmp/q.txt
          import urllib.parse
          f="OR({Setting_Name}='MAKE_API_TOKEN',{Setting_Name}='MAKE_API_BASE_URL')"
          print(urllib.parse.urlencode([('filterByFormula',f),('fields[]','Setting_Name'),('fields[]','Setting_Value'),('fields[]','Active')]))
          PY
          curl -fsS "https://api.airtable.com/v0/appe33zkZn35yirTL/tblpHPWeEkyJaF7ql?$(cat /tmp/q.txt)" -H "Authorization: Bearer $PAT" -o /tmp/settings.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/settings.json')); vals={r['fields'].get('Setting_Name'):r['fields'].get('Setting_Value') for r in d.get('records',[]) if r.get('fields',{}).get('Active')}
          t=str(vals.get('MAKE_API_TOKEN') or '').strip(); b=str(vals.get('MAKE_API_BASE_URL') or '').strip().rstrip('/')
          if not t or not b: raise SystemExit('Missing active Make API settings')
          open('/tmp/make-token.txt','w').write(t); open('/tmp/make-base.txt','w').write(b)
          PY
      - name: Read R3 and exact fixture state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          TOKEN=$(cat /tmp/make-token.txt); BASE=$(cat /tmp/make-base.txt); PAT=$(cat /tmp/pat.txt)
          curl -fsS "$BASE/scenarios/$SCENARIO_ID" -H "Authorization: Token $TOKEN" -H 'Accept: application/json' -o /tmp/scenario.json
          curl -fsS "$BASE/scenarios/$SCENARIO_ID/blueprint" -H "Authorization: Token $TOKEN" -H 'Accept: application/json' -o /tmp/bp-wrap.json
          curl -fsS "https://api.airtable.com/v0/appe33zkZn35yirTL/tblrlPeboBthkplH0/$OUTPUT_RECORD_ID" -H "Authorization: Bearer $PAT" -o /tmp/output.json
          python - <<'PY'
          import json,os
          def scen(d):
              x=d.get('response',d) if isinstance(d,dict) else {}
              if isinstance(x,dict) and isinstance(x.get('scenario'),dict):x=x['scenario']
              return x if isinstance(x,dict) else {}
          def bp(d):
              x=d.get('response',d) if isinstance(d,dict) else d
              if isinstance(x,dict) and 'blueprint' in x:x=x['blueprint']
              if isinstance(x,str):x=json.loads(x)
              return x
          def find(flow,mid):
              for n in flow if isinstance(flow,list) else []:
                  if str(n.get('id'))==str(mid):return n
                  for r in n.get('routes',[]) if isinstance(n.get('routes'),list) else []:
                      z=find(r.get('flow'),mid)
                      if z:return z
              return None
          s=scen(json.load(open('/tmp/scenario.json'))); b=bp(json.load(open('/tmp/bp-wrap.json'))); m=find(b.get('flow'),1); out=json.load(open('/tmp/output.json')); f=out.get('fields',{})
          if not m: raise SystemExit('R3 Module 1 not found')
          ev={'scenario_id':int(os.environ['SCENARIO_ID']),'scenario_name':s.get('name'),'scenario_active':s.get('isActive',s.get('active')),'schedule':s.get('scheduling',s.get('schedule')),'hook_id':s.get('hookId',s.get('hook_id')),'module_1_type':m.get('module'),'module_1_name':((m.get('metadata') or {}).get('designer') or {}).get('name'),'module_1_formula':(m.get('mapper') or {}).get('formula'),'module_1_maxRecords':(m.get('mapper') or {}).get('maxRecords'),'output_record_id':out.get('id'),'output_id':f.get('Output_ID'),'test_run_id':f.get('Test_Run_ID'),'do_not_publish':f.get('Do_Not_Publish'),'asset_selection_status':f.get('Asset_Selection_Status'),'selected_clip_count':f.get('Selected_Clip_Count'),'selected_assets_present':bool(str(f.get('Selected_Assets_JSON') or '').strip()),'render_status':f.get('Render_Status'),'composition_id':f.get('Composition_ID'),'output_filename':f.get('Output_Filename'),'render_clip_list_present':bool(str(f.get('Render_Clip_List_JSON') or '').strip()),'render_total_frames':f.get('Render_Total_Frames')}
          print(json.dumps(ev,indent=2,sort_keys=True)); open('evidence/r3-baseline.json','w').write(json.dumps(ev,indent=2,sort_keys=True))
          if ev['scenario_active'] is not False: raise SystemExit('R3 is not OFF')
          if str(ev['module_1_maxRecords'])!='1': raise SystemExit('R3 maxRecords is not 1')
          PY
      - name: Destroy transient credentials
        if: always()
        shell: bash
        run: |
          for f in /tmp/key.pem /tmp/pat.enc /tmp/pat.txt /tmp/make-token.txt /tmp/make-base.txt /tmp/settings.json /tmp/q.txt /tmp/scenario.json /tmp/bp-wrap.json /tmp/output.json; do [[ ! -e "$f" ]] || shred -u "$f" 2>/dev/null || rm -f "$f"; done
      - name: Save baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item7-r3-baseline-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
