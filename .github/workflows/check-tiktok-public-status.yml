name: Check TikTok Public Status

on:
  push:
    branches: [main]
    paths:
      - 'deploy/check-tiktok-public-status.txt'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read connected TikTok creators
        shell: bash
        run: |
          set -euo pipefail
          for entry in             "chicago|https://auth.chicagoshining.com/tiktok/status"             "la|https://auth-la.chicagoshining.com/tiktok/status"             "nyc|https://auth-nyc.chicagoshining.com/tiktok/status"             "miami|https://auth-miami.chicagoshining.com/tiktok/status"
          do
            name=${entry%%|*}
            url=${entry#*|}
            echo "=== $name ==="
            curl -fsS --max-time 20 "$url" | jq '{ok,authorized,required_scopes_granted,creator_username,creator_nickname,worker_version}'
          done
