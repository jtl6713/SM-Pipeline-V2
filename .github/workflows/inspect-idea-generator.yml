name: Inspect Idea Generator

on:
  push:
    branches: [main]
    paths:
      - 'deploy/inspect-idea-generator.txt'
      - '.github/workflows/inspect-idea-generator.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Inspect Make idea scenarios read-only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:CLOUDFLARE_API_TOKEN \
            -in deploy/credential-envelope/private.pem.enc \
            -out /tmp/key.pem
          base64 -d deploy/credential-envelope/airtable_pat.ciphertext.b64 >/tmp/pat.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/key.pem \
            -in /tmp/pat.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out /tmp/pat.txt
          export AIRTABLE_PAT="$(tr -d '\r\n' </tmp/pat.txt)"
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error, re
          BASE='appe33zkZn35yirTL'; SETTINGS='tblpHPWeEkyJaF7ql'; TEAM=2410882
          def req(url, headers=None):
              r=urllib.request.Request(url, headers=headers or {'User-Agent':'SM-Pipeline-Idea-Inspect/1.0'})
              try:
                  with urllib.request.urlopen(r,timeout=60) as x:
                      raw=x.read().decode('utf-8','replace'); return x.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: p=json.loads(raw) if raw else {}
                  except: p={'raw':raw[:500]}
                  return e.code,p
          pat=os.environ['AIRTABLE_PAT']
          formula="AND({Active}=1,OR({Setting_Name}='MAKE_API_TOKEN',{Setting_Name}='MAKE_API_BASE_URL'))"
          q=urllib.parse.urlencode([('filterByFormula',formula),('fields[]','Setting_Name'),('fields[]','Setting_Value')])
          s,p=req(f'https://api.airtable.com/v0/{BASE}/{SETTINGS}?{q}', {'Authorization':f'Bearer {pat}','User-Agent':'SM-Pipeline-Idea-Inspect/1.0'})
          assert s==200, s
          vals={r['fields'].get('Setting_Name'):r['fields'].get('Setting_Value','') for r in p.get('records',[])}
          base=vals['MAKE_API_BASE_URL'].rstrip('/'); token=vals['MAKE_API_TOKEN']; h={'Authorization':f'Token {token}','User-Agent':'SM-Pipeline-Idea-Inspect/1.0'}
          q=urllib.parse.urlencode({'teamId':TEAM,'pg[limit]':100,'pg[offset]':0,'pg[sortBy]':'id','pg[sortDir]':'desc'})
          s,p=req(f'{base}/scenarios?{q}',h); assert s==200,s
          rows=p.get('scenarios') or (p.get('response') or {}).get('scenarios') or []
          matches=[x for x in rows if re.search(r'(^|\b)I1(\b|\s|[-_:])|idea',str(x.get('name','')),re.I)]
          out={'team_id':TEAM,'matched_count':len(matches),'matches':[]}
          for x in matches:
              sid=int(x['id']); ms,meta=req(f'{base}/scenarios/{sid}',h); bs,bp=req(f'{base}/scenarios/{sid}/blueprint?draft=false',h)
              b=bp.get('blueprint') or (bp.get('response') or {}).get('blueprint') or bp
              if isinstance(b,str):
                  try:b=json.loads(b)
                  except:b={}
              flow=b.get('flow') or [] if isinstance(b,dict) else []
              modules=[]
              for m in flow:
                  mapper=m.get('mapper') or {}; params=m.get('parameters') or {}; designer=(m.get('metadata') or {}).get('designer') or {}
                  modules.append({'id':m.get('id'),'module':m.get('module'),'name':designer.get('name'),'mapper_keys':sorted(map(str,mapper.keys()))[:50],'parameter_keys':sorted(map(str,params.keys()))[:50]})
              mobj=meta.get('scenario') or (meta.get('response') or {}).get('scenario') or meta
              sched=(mobj.get('scheduling') or {}) if isinstance(mobj,dict) else {}
              out['matches'].append({'id':sid,'name':x.get('name'),'list_active':x.get('isActive'),'meta_http':ms,'blueprint_http':bs,'scheduling':sched,'hookId':mobj.get('hookId') if isinstance(mobj,dict) else None,'modules':modules,'blueprint':b})
          text=json.dumps(out,indent=2,ensure_ascii=False)
          text=re.sub(r'(?i)(bearer\s+|token\s+)[A-Za-z0-9._~-]{16,}', r'\1[REDACTED]', text)
          open('/tmp/idea-generator-inspection.json','w',encoding='utf-8').write(text)
          print(json.dumps({'matched_count':len(matches),'matches':[{'id':m['id'],'name':m['name'],'active':m['list_active'],'scheduling':m['scheduling']} for m in out['matches']]},indent=2))
          PY
      - name: Commit sanitized inspection evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair/evidence
          cp /tmp/idea-generator-inspection.json repair/evidence/idea-generator-inspection.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair/evidence/idea-generator-inspection.json
          if ! git diff --cached --quiet; then
            git commit -m 'evidence: capture existing idea generator contract'
            git push origin HEAD:main
          fi
      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: idea-generator-inspection-${{ github.run_id }}
          path: /tmp/idea-generator-inspection.json
          retention-days: 7
      - name: Destroy credentials
        if: always()
        run: rm -f /tmp/key.pem /tmp/pat.enc /tmp/pat.txt /tmp/idea-generator-inspection.json
