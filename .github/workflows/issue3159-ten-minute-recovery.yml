name: Issue 3159 ten-minute governed recovery sweep
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/issue3159-ten-minute-recovery.yml'
      - 'repair/scripts/issue3159-story11252-scheduled-probe.py'
      - 'repair/scripts/issue3159-becky-storage-sweep.py'
      - '.github/scripts/incident-3159-paused-render-inventory.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/issue3159-ten-minute-recovery.yml'
      - 'repair/scripts/issue3159-becky-storage-sweep.py'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Pipeline Runner via Ops Dashboard']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('3159-sweep-pr-{0}', github.event.pull_request.number) || 'issue3159-ten-minute-recovery-sweep' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Parse read-only diagnostic
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.github/scripts/incident-3159-paused-render-inventory.ps1'),
            [ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){$errors | ForEach-Object {Write-Output ('parse_error='+$_.ErrorId+' line='+$_.Extent.StartLineNumber)};throw 'readonly_script_parse_invalid'}
          if((Get-Content '.github/scripts/incident-3159-paused-render-inventory.ps1' -Raw).Length -gt 7800){throw 'readonly_script_too_large'}
      - name: Compile embedded read-only Python queue probe
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('.github/scripts/incident-3159-paused-render-inventory.ps1').read_text()
          probes=re.findall(r"(?m)^\$(?:code|probe)\s*=\s*@'\n([\s\S]*?)\n'@$",s)
          assert len(probes)==1
          for i, source in enumerate(probes):
              compile(source, f"read_only_probe_{i}", "exec")
          PY
      - name: Compile and test exact scheduled action fences
        shell: bash
        run: |
          python -m py_compile repair/scripts/issue3159-story11252-scheduled-probe.py
          python - <<'PY'
          import ast
          from pathlib import Path
          s=Path('repair/scripts/issue3159-story11252-scheduled-probe.py').read_text()
          tree=ast.parse(s)
          assert s.count('requests.post(')==1
          assert 'marker.open("x"' in s and 'if marker.exists()' in s
          assert 'existing_schedule_or_publish_state_requires_reconciliation' in s
          for forbidden in ('requests.patch','requests.put','requests.delete','/publish-now','force-release','UPDATE producer_jobs','DELETE FROM'):
              assert forbidden not in s
          fn=next(x for x in tree.body if isinstance(x,ast.FunctionDef) and x.name=='observe_governor')
          ns={}
          exec(compile(ast.Module(body=[fn],type_ignores=[]),'monitor','exec'),ns)
          check=ns['observe_governor']
          idle=dict(ok=True,enabled=True,active_jobs=0,active_worker_heavy=0,combined_heavy_active=0,queued_jobs=0,paused_jobs=15,max_jobs=2,worker_heavy_limit=1,database_circuit_phase='closed',admission_paused=False,smv1_maintenance_active=False)
          assert not check(idle)[1]
          assert check(dict(idle,database_circuit_phase='open'))[1]
          assert check(dict(idle,max_jobs=3))[1]
          assert check(dict(idle,active_jobs=2,active_worker_heavy=1,combined_heavy_active=3))[1]
          PY
      - name: Validate Becky exact storage cohort and one-shot fences
        shell: bash
        run: |
          python -m py_compile repair/scripts/issue3159-becky-storage-sweep.py
          python - <<'PY'
          import ast,re
          from pathlib import Path
          path=Path('repair/scripts/issue3159-becky-storage-sweep.py')
          s=path.read_text(); tree=ast.parse(s)
          cohort=ast.literal_eval(next(n.value for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='COHORT' for t in n.targets)))
          assert len(cohort)==10 and len({r['request'] for r in cohort})==10
          assert sorted(n for r in cohort for n in r['stories'].values())==[11226,11227,11240,11241,11250,11251,11262,11263,11268,11269,11310,11311,11316,11317,11322,11323,11328,11329,11340,11341]
          deployed=ast.parse(Path('services/pipeline-runner/studio_produce/story_voiceover.py').read_text())
          held=ast.literal_eval(next(n.value for n in deployed.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='HELD_STORAGE_RECOVERY' for t in n.targets)))
          assert held=={i:(r['parent'],r['fingerprint']) for r in cohort if not r.get('history') for i in r['stories']}
          histories=[r for r in cohort if r.get('history')]
          assert len(histories)==1 and sorted(histories[0]['stories'].values())==[11250,11251]
          source=ast.parse(Path('services/pipeline-runner/studio_produce/story_history_recovery.py').read_text())
          h=ast.literal_eval(next(n.value for n in source.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='HISTORY_RECOVERY' for t in n.targets)))
          c=histories[0]; e=h[c['parent']]
          assert e['held'] is True and e['cached_only_required'] is True and e['fingerprint']==c['fingerprint']
          assert e['outputs']==set(c['stories']) and e['sha256']==c['history']['sha256'] and e['created_at']==c['history']['created_at']
          assert c['history']['claim'] in c['stories']
          for r in cohort:
              assert len(r['stories'])==2 and len(r['siblings'])==4
              assert re.fullmatch(r'[a-f0-9]{64}',r['fingerprint'])
          assert s.count('requests.post(')==1 and 'marker.open("x"' in s and 'if recover(candidate)' in s
          for forbidden in ('requests.patch','requests.put','requests.delete','/publish-now','force-release','UPDATE producer_jobs','DELETE FROM'):
              assert forbidden not in s
          assert 'source_or_hold_changed' in s and 'ambiguous_narration_attempt_no_retry' in s
          exceptions=ast.literal_eval(next(n.value for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='CREATIVE_EXCEPTIONS' for t in n.targets)))
          assert set(exceptions)=={'rec2yYRS9aVFeK1r3','recKEr3ODsfNktfRr'}
          assert set(exceptions)<={r['request'] for r in cohort}
          assert s.index('if rid in CREATIVE_EXCEPTIONS:')<s.index('if recover(candidate):')
          ns2={}
          exec(compile(ast.Module(body=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='candidate_priority'],type_ignores=[]),'priority','exec'),ns2)
          assert 11226 in sorted(cohort,key=ns2['candidate_priority'])[0]['stories'].values()
          ordered=sorted(cohort,key=ns2['candidate_priority'])
          assert 11340 in ordered[1]['stories'].values() and 11328 in ordered[2]['stories'].values()
          revisions=ast.literal_eval(next(n.value for n in deployed.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='MARKET_STORY_REVISIONS' for t in n.targets)))
          assert len(revisions)==2
          for rev_parent,spec in revisions.items():
              entry=next(c for c in cohort if c['parent']==rev_parent)
              assert set(entry['stories'])==set(spec['outputs'])
              assert entry['fingerprint']==spec['fingerprint'] and spec['previous_fingerprint']!=spec['fingerprint']
              assert len(spec['clip'])==4 and '#Chicago' not in spec['caption']
          assert 'market_revision_unverified' in s and 'market_parent_changed' in s
          import tempfile,hashlib
          ns3={'LIMIT':64*1024*1024,'hashlib':hashlib}
          exec(compile(ast.Module(body=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in {'require','stream_exact_media','file_sha256'}],type_ignores=[]),'bounded_transfer','exec'),ns3)
          class Response:
              status_code=200
              def __init__(self,chunks,headers=None): self.chunks=chunks;self.headers=headers or {}
              def iter_content(self,_): yield from self.chunks
          with tempfile.TemporaryDirectory() as tmp:
              p=Path(tmp)/'test.mp4'
              ns3['stream_exact_media'](Response([b'abc',b'def'],{'Content-Length':'6'}),p,6)
              assert ns3['file_sha256'](p)==hashlib.sha256(b'abcdef').hexdigest()
              for response,size in [(Response([b'abc']),6),(Response([b'abcdefg']),6),(Response([b'abc'],{'Content-Length':'4'}),3),(Response([]),ns3['LIMIT']+1)]:
                  try: ns3['stream_exact_media'](response,p,size)
                  except RuntimeError: pass
                  else: raise AssertionError('bounded_transfer_accepted_invalid_length')
          assert 'drive_preview_byte_mismatch' in s and 'path.read_bytes()' not in s
          # A second Story can be waiting for its first R4 admission while
          # the first sibling renders. No receipt is expected yet, but no
          # owned render job or completed artifact may exist without one.
          ns={'receipt':lambda r:r.get('receipt',{}),'require':lambda ok,reason: None if ok else (_ for _ in ()).throw(RuntimeError(reason)), 'HISTORY':None,'FINGERPRINT':c['fingerprint'],'PARENT':c['parent'],'re':re}
          exec(compile(ast.Module(body=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name=='require_receipt'],type_ignores=[]),'receipt_observer','exec'),ns)
          ns['require_receipt']({'render_status':'Waiting in Render Queue'})
          for r in ({'render_status':'Rendering'}, {'render_status':'Waiting in Render Queue','remotion_job_id':'job-existing'}, {'render_status':'Waiting in Render Queue','final_file_url':'existing'}):
              try: ns['require_receipt'](r)
              except RuntimeError: pass
              else: raise AssertionError('receipt_fence_not_enforced')
          ns['HISTORY']=c['history']
          claim=dict(fingerprint=c['fingerprint'],url=f"https://media.chicagoshining.com/studio/previews/story-voiceover/{c['parent']}/{c['fingerprint']}.mp3",state='failed')
          row=dict(airtable_record_id=c['history']['claim'],render_status='Blocked',receipt=claim)
          ns['require_receipt'](row)
          for bad in (dict(row,airtable_record_id='wrong'),dict(row,render_status='Rendering'),dict(row,receipt=dict(claim,state='generating')),dict(row,receipt=dict(claim,state='verified',sha256='a'*64))):
              try: ns['require_receipt'](bad)
              except RuntimeError: pass
              else: raise AssertionError('history_receipt_fence_not_enforced')
          ns['require_receipt'](dict(row,receipt=dict(claim,state='verified',sha256='a'*64,history_original_sha256=c['history']['sha256'],history_created_at=c['history']['created_at'])))
          PY
  market-story-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --quiet -r services/pipeline-runner/requirements.txt pytest
          cd services/pipeline-runner
          python -m pytest -q tests/test_2970_story_voiceover.py tests/test_story_voiceover_initialisms.py tests/test_supabase_runner_reads.py
  readback:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    needs: [validate, market-story-regression]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      candidate: ${{ steps.inventory.outputs.candidate }}
      storage_candidate: ${{ steps.inventory.outputs.storage_candidate }}
    steps:
      - uses: actions/checkout@v6
      - name: Avoid competing main-branch protected operations
        id: quiet
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs"
          for status in in_progress queued pending waiting requested; do
            runs=$(curl -fsS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" "$api?branch=main&status=$status&per_page=100")
            jq -e '.total_count <= 100' <<<"$runs" >/dev/null
            if jq -e --argjson own "$GITHUB_RUN_ID" 'any(.workflow_runs[]; .id != $own and .event != "pull_request" and .name != "Issue 3159 ten-minute governed recovery sweep" and .name != "Log Commit" and .name != "Push on main" and .name != "Log CI parts")' <<<"$runs" >/dev/null; then
              echo 'sweep3159_skip=competing_main_workflow'
              exit 0
            fi
          done
          echo 'ok=true' >> "$GITHUB_OUTPUT"
      - name: Read exact paused jobs, output fences and existing audio bytes
        id: inventory
        if: steps.quiet.outputs.ok == 'true'
        shell: bash
        env:
          OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
          OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
          OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
        run: |
          set -euo pipefail
          BASE=https://ops.chicagoshining.com
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            [[ -n "$candidate" ]] || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then selected="$candidate"; break; fi
          done
          test -n "$selected"
          jq -Rs '{command:.,confirm:true}' .github/scripts/incident-3159-paused-render-inventory.ps1 > /tmp/readonly.json
          job=''
          for attempt in $(seq 1 1); do
            code=$(curl -sS --max-time 20 -o /tmp/start.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $selected" -H 'Content-Type: application/json' --data-binary @/tmp/readonly.json || true)
            if [[ "$code" == 202 ]]; then job=$(jq -er '.job.id' /tmp/start.json); break; fi
            [[ "$code" == 409 ]] || { echo "readonly_ops_launch_http=$code"; exit 1; }
            sleep 5
          done
          [[ -n "$job" ]] || { echo 'sweep3159_skip=ops_busy'; exit 0; }
          echo "watchdog2853_ops_job_id=$job"
          for attempt in $(seq 1 45); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $selected" "$BASE/api/jobs/$job" -o /tmp/readonly-status.json
            state=$(jq -r '.job.status' /tmp/readonly-status.json)
            [[ "$state" == ok || "$state" == failed ]] && break
            sleep 3
          done
          # Never print the shell command, raw transcript or response body.
          python - <<'PY'
          import json,re,os
          from pathlib import Path
          data=json.loads(Path('/tmp/readonly-status.json').read_text())
          job=data['job']
          lines=job.get('log','').splitlines()
          health=[json.loads(l.split('=',1)[1]) for l in lines if l.startswith('paused3159_health=')]
          rows=[json.loads(l.split('=',1)[1]) for l in lines if l.startswith('paused3159_row=')]
          proof=[json.loads(l.split('=',1)[1]) for l in lines if l.startswith('paused3159_proof=')]
          if job.get('status')!='ok' or len(health)!=1 or len(proof)!=1 or proof[0]['count']!=len(rows) or len(rows)>24 or proof[0]['writes']!=0 or proof[0]['submissions']!=0:
              raise SystemExit('paused3159_readback_incomplete')
          print('paused3159_health='+json.dumps(health[0],sort_keys=True))
          for row in rows: print('paused3159_row='+json.dumps(row,sort_keys=True))
          print('paused3159_proof='+json.dumps(proof[0],sort_keys=True))
          h=health[0]
          candidate=(h['circuit']=='closed' and h['cap']==2 and h['active']==h['queued']==h['remotion_active']==0 and any(r.get('request_record')=='recp4apT5iDDfphbh' and r.get('job')=='spj-0e8e0ebc1337' and r.get('classification')=='read_only_inventory' for r in rows))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('candidate='+str(candidate).lower()+'\n')
          import ast
          tree=ast.parse(Path('repair/scripts/issue3159-becky-storage-sweep.py').read_text())
          cohort=ast.literal_eval(next(n.value for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='COHORT' for t in n.targets)))
          storage_candidate=(h['circuit']=='closed' and h['cap']==2 and h['active']==h['queued']==h['remotion_active']==0 and any(r.get('request_record')==c['request'] and r.get('job')==c['job'] and r.get('classification')=='read_only_inventory' for r in rows for c in cohort))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('storage_candidate='+str(storage_candidate).lower()+'\n')
          if not rows: print('sweep3159=backlog_zero_no_submissions')
          PY
  recover-storage:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && needs.readback.outputs.storage_candidate == 'true'
    needs: [validate, readback]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      no_submission: ${{ steps.recover.outputs.no_submission }}
    steps:
      - uses: actions/checkout@v6
      - name: Avoid competing main-branch protected operations
        id: quiet
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs"
          for status in in_progress queued pending waiting requested; do
            runs=$(curl -fsS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" "$api?branch=main&status=$status&per_page=100")
            jq -e '.total_count <= 100' <<<"$runs" >/dev/null
            if jq -e --argjson own "$GITHUB_RUN_ID" 'any(.workflow_runs[]; .id != $own and .event != "pull_request" and .name != "Issue 3159 ten-minute governed recovery sweep" and .name != "Log Commit" and .name != "Push on main" and .name != "Log CI parts")' <<<"$runs" >/dev/null; then
              echo 'sweep3159_skip=competing_main_workflow'
              exit 0
            fi
          done
          echo 'ok=true' >> "$GITHUB_OUTPUT"
      - name: Verify exact deployed Runner and second pair proof
        if: steps.quiet.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          statuses=$(curl -fsS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" "$api/commits/124fb31441ff637ce0b60483fd7c3643815ee9c2/status")
          runs=$(curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" "$api/actions/runs?branch=main&event=push&status=success&per_page=100")
          deployed=$(jq -er '[.workflow_runs[] | select(.name=="Deploy Pipeline Runner via Ops Dashboard" and .head_branch=="main" and .conclusion=="success")][0].head_sha' <<<"$runs")
          [[ "$deployed" =~ ^[0-9a-f]{40}$ ]]
          git fetch --quiet --depth=1 origin "$deployed"
          git diff --exit-code "$deployed" "$GITHUB_SHA" -- services/pipeline-runner
          deployed_status=$(curl -fsS --max-time 15 -H "Authorization: Bearer $GH_TOKEN" "$api/commits/$deployed/status")
          test "$(jq -r '[.statuses[] | select(.context=="production/pipeline-runner")][0].state // "pending"' <<<"$deployed_status")" = success
          # The obsolete separate pair workflow recorded failure on this SHA.
          # The consolidated workflow verified BOTH pairs; bind to its actual job.
          proven=$(curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" "$api/actions/runs/46167098212")
          jq -e '.head_sha=="124fb31441ff637ce0b60483fd7c3643815ee9c2" and .status=="completed" and .conclusion=="success"' <<<"$proven" >/dev/null
          jobs=$(curl -fsS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" "$api/actions/runs/46167098212/jobs?per_page=100")
          jq -e 'any(.jobs[]; .id==141047104300 and .name=="audit-second-pair" and .status=="completed" and .conclusion=="success")' <<<"$jobs" >/dev/null
          test "$(jq -r '[.statuses[] | select(.context=="production/issue3159-story11202-pair-probe")][0].state // "pending"' <<<"$statuses")" = success
      - name: Verify scheduler still minute-only before exact recovery
        if: steps.quiet.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PYTHONPATH=repair/scripts python - <<'PY'
          from issue3159_cron_containment import call,schedules
          assert schedules(call('GET'))==['* * * * *']
          print('story3159_pre_crons=minute_only')
          PY
      - name: Becky one exact storage parent recovery through protected Ops
        id: recover
        if: steps.quiet.outputs.ok == 'true'
        shell: bash
        env:
          OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
          OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
          OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
        run: |
          set -euo pipefail
          BASE=https://ops.chicagoshining.com
          selected=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            [[ -n "$candidate" ]] || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then selected="$candidate"; break; fi
          done
          test -n "$selected"
          python - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          source=Path('repair/scripts/issue3159-becky-storage-sweep.py')
          sha=os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}',sha)
          expected=hashlib.sha256(source.read_bytes()).hexdigest()
          url=f'https://raw.githubusercontent.com/jtl6713/SM-Pipeline-V2/{sha}/{source.as_posix()}'
          command=("$ErrorActionPreference='Stop';"
            "$tmp=Join-Path $env:TEMP ('issue3159-becky-storage-'+[guid]::NewGuid().ToString('N')+'.py');"
            f"Invoke-WebRequest -Uri '{url}' -OutFile $tmp -UseBasicParsing -TimeoutSec 55;"
            f"if((Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant() -ne '{expected}'){{throw 'audit_source_hash_mismatch'}};"
            "try{& python $tmp;if($LASTEXITCODE -ne 0){throw 'audit_python_failed'}}finally{Remove-Item -LiteralPath $tmp -Force -ErrorAction SilentlyContinue}")
          Path('/tmp/request.json').write_text(json.dumps({'command':command,'confirm':True}))
          PY
          job=''
          for attempt in $(seq 1 1); do
            code=$(curl -sS --max-time 20 -o /tmp/start.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $selected" -H 'Content-Type: application/json' --data-binary @/tmp/request.json || true)
            if [[ "$code" == 202 ]]; then job=$(jq -er '.job.id' /tmp/start.json); break; fi
            [[ "$code" == 409 ]] || { echo "audit_ops_http=$code"; exit 1; }
            sleep 5
          done
          [[ -n "$job" ]] || { echo "sweep3159_skip=ops_busy"; exit 0; }
          echo "audit_job_id=$job"
          for attempt in $(seq 1 240); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $selected" "$BASE/api/jobs/$job" -o /tmp/status.json
            state=$(jq -r '.job.status' /tmp/status.json)
            [[ "$state" == ok || "$state" == failed ]] && break
            sleep 3
          done
          python - <<'PY'
