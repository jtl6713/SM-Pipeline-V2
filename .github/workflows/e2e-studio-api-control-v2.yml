name: E2E Studio API Control V2

on:
  push:
    branches: [main]
    paths: ['deploy/e2e-studio-api-command-v2.json']

permissions:
  contents: read

concurrency:
  group: chicagoshining-e2e-studio-api-control-v2
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      BRIDGE_WORKER: chicagoshining-e2e-service-bridge-v2
      BRIDGE_RETRY_MAX: "12"
      BRIDGE_RETRY_SLEEP_S: "3"
    steps:
      - uses: actions/checkout@v6

      - name: Validate command and capture production version
        shell: bash
        run: |
          set -euo pipefail
          F=deploy/e2e-studio-api-command-v2.json
          jq -e '.correlation_id|type=="string" and length>0' "$F" >/dev/null
          jq -e '.requests|type=="array" and length>0 and length<=12' "$F" >/dev/null
          jq -e 'all(.requests[]; (.method=="GET" or .method=="POST" or .method=="PATCH" or .method=="PUT") and (.path|type=="string"))' "$F" >/dev/null
          jq -e 'all(.requests[]; (.path|test("^/api/ideas(?:\\?.*)?$|^/api/production-requests/(recc9H8SXdUnKEMhQ|recVAxLIuTsHHuDZK)(/|$)|^/api/production-request-outputs/rec(D15PEl3x8LnZ7G|GvE1SHoxXPs5Aa|GZm1Si8GhHPP13|wvxu6GketzHWiF)(/|$)|^/api/outputs/rec[A-Za-z0-9]+/(preview|creative)(/|$)|^/api/operations/outputs/rec[A-Za-z0-9]+/publish-kick$")))' "$F" >/dev/null
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/before.json
          jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/before.json >/tmp/active-before.txt

      - name: Build and upload one-time service bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,secrets
          from pathlib import Path
          token=secrets.token_urlsafe(36)
          Path('/tmp/token').write_text(token)
          c=json.loads(Path('deploy/e2e-studio-api-command-v2.json').read_text())
          js='''export default {async fetch(request,env){const u=new URL(request.url),p=u.pathname.replace(/\\/+$/,"")||"/";if(p===ROUTE+"/ready")return Response.json({ok:true,ready:true},{headers:{"Cache-Control":"no-store"}});if(p!==ROUTE)return new Response("Not found",{status:404});const specs=SPECS,results=[];for(const s of specs){const m=String(s.method||"GET").toUpperCase(),h=new Headers({"Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com","Accept":"application/json","Origin":"https://studio.chicagoshining.com"});let b;if(m!=="GET"){h.set("Content-Type","application/json");b=JSON.stringify(s.body??{});}const r=await env.STUDIO_API.fetch(new Request("https://studio.chicagoshining.com"+s.path,{method:m,headers:h,body:b}));const t=await r.text();let p;try{p=t?JSON.parse(t):null}catch{p={raw:t.slice(0,10000)}}results.push({name:s.name||s.path,path:s.path,method:m,status:r.status,ok:r.ok,body:p});if(!r.ok&&s.continue_on_error!==true)break;}return Response.json({ok:results.every(x=>x.ok),correlation_id:CORR,results},{headers:{"Cache-Control":"no-store"}})}};'''
          js=js.replace('ROUTE',json.dumps('/'+token)).replace('SPECS',json.dumps(c['requests'],separators=(',',':'))).replace('CORR',json.dumps(c['correlation_id']))
          Path('/tmp/worker.js').write_text(js)
          PY
          node --check /tmp/worker.js
          printf '%s' '{"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"chicagoshining-studio-api"}]}' >/tmp/meta.json
          curl -sS -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null || true
          code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER/content" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -F 'metadata=@/tmp/meta.json;type=application/json' -F 'worker.js=@/tmp/worker.js;type=application/javascript+module;filename=worker.js')
          test "$code" -ge 200 -a "$code" -lt 300 && jq -e '.success==true' /tmp/upload.json >/dev/null
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' -o /tmp/sub.json
          jq -e '.success==true and .result.enabled==true' /tmp/sub.json >/dev/null
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/account-sub.json
          jq -er '.result.subdomain' /tmp/account-sub.json >/tmp/subdomain

      - name: Wait for bridge propagation and execute
        shell: bash
        run: |
          set -euo pipefail
          URL="https://$BRIDGE_WORKER.$(cat /tmp/subdomain).workers.dev/$(cat /tmp/token)"
          ready=000
          for i in $(seq 1 "$BRIDGE_RETRY_MAX"); do
            ready=$(curl -sS --max-time 20 -o /tmp/ready.json -w '%{http_code}' "$URL/ready" || true)
            echo "bridge_ready_attempt=$i/$BRIDGE_RETRY_MAX http=$ready"
            [[ "$ready" == "200" ]] && break
            if [[ "$ready" != "404" && "$ready" != "000" && "$ready" != "502" && "$ready" != "503" && "$ready" != "504" && "$ready" != "530" && "$ready" != "1033" ]]; then
              echo "bridge gave up (non-retryable) last_http=$ready"
              exit 1
            fi
            if [[ "$i" -eq "$BRIDGE_RETRY_MAX" ]]; then
              echo "bridge gave up after ${BRIDGE_RETRY_MAX} attempts last_http=$ready"
              exit 1
            fi
            sleep "$BRIDGE_RETRY_SLEEP_S"
          done
          code=$(curl -sS --max-time 420 -o /tmp/result.json -w '%{http_code}' "$URL" || true)
          echo "bridge_http=$code"
          test "$code" -eq 200
          jq -e '.results|type=="array"' /tmp/result.json >/dev/null
          echo E2E_RESULT_SANITIZED
          jq 'def redact: walk(if type=="object" then with_entries(if (.key|test("token|secret|password|api[_-]?key|authorization|webhook|pat$|completion";"i")) then .value="[REDACTED]" else . end) else . end); {ok,correlation_id,results:[.results[]|{name,path,method,status,ok,body:(.body|redact)}]}' /tmp/result.json | head -c 30000
          echo
          jq -e '.ok==true' /tmp/result.json >/dev/null

      - name: Delete temporary bridge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/delete.json || true

      - name: Verify production unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(cat /tmp/active-before.txt)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/after.json
          AFTER=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/after.json)
          echo "production_unchanged=$([[ "$BEFORE" == "$AFTER" ]] && echo true || echo false)"
          test "$BEFORE" = "$AFTER"
