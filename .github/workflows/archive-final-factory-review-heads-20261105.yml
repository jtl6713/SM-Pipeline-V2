name: Archive and retire final reviewed Factory leftovers (2026-11-05)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-final-factory-review-heads-20261105.yml'
permissions:
  contents: write
  pull-requests: read
  actions: read
concurrency:
  group: final-factory-branch-archive-20261105
  cancel-in-progress: false
jobs:
  archive-then-retire:
    if: github.repository == 'jtl6713/SM-Pipeline-V2' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Exact-head and PR verification, archive every head before retirement
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, time, urllib.parse, urllib.request, urllib.error

          REPO = "jtl6713/SM-Pipeline-V2"
          SELF = "chore/archive-review-factory-leftovers-20261105"
          KEEP = {
              "feat/qa-test-center-foundation-20261031": "4bee5545303e7b40e9d266eec558bebc4f0d3057",
              "feat/vibe-cut-isolated-contracts-20261101": "e8de331811402d983a55fdbc883d53e8c65dd8bf",
          }
          EXPECTED_OPEN = {
              1429: "feat/qa-test-center-foundation-20261031",
              1465: "feat/vibe-cut-isolated-contracts-20261101",
          }
          CANDIDATES = {
              "deploy/factory-needs-eyes-762-pages-894": "e678e6f4cc053f11042cc76085d79054460f0d99",
              "diag/r4-last-launch-receipt-20261103": "e3447c1b8d904341c4dcbd7714422ada6487635f",
              "fix/factory-needs-eyes-review-held-20261105": "2afdc2e528a59570165529e8184b0afd34dc2b2f",
              "fix/pipeline-factory-ready-badge-parity-20261105": "f06e4c6e6ec998b94e361287336da5ea710fb4d8",
              "fix/scripted-short-exact-title-nov5": "58cd126772090e0adadd21b6c379286a27378bb1",
              "repair/drifter-watermark-v2": "ce7c2bbf22b4741bd8e41416cd380aa3cbdd24f3",
          }
          SUPERSEDED = {
              "deploy/factory-needs-eyes-762-pages-894": (1660, 1662),
              "fix/factory-needs-eyes-review-held-20261105": (1657, 1659),
              "fix/scripted-short-exact-title-nov5": (1649, 1651),
          }

          if os.environ.get("GITHUB_REPOSITORY") != REPO or os.environ.get("GITHUB_REF") != "refs/heads/main":
              raise SystemExit("REFUSE: wrong repository or ref")
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          def api(path, method="GET", payload=None):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + REPO + "/" + path,
                  headers=headers, method=method,
                  data=None if payload is None else json.dumps(payload).encode("utf-8"))
              with urllib.request.urlopen(request, timeout=45) as response:
                  value = response.read().decode("utf-8")
                  return json.loads(value) if value else None
          def encode(value):
              return urllib.parse.quote(value, safe="/")
          def inventory():
              rows = api("branches?per_page=100")
              if len(rows) >= 100:
                  raise RuntimeError("REFUSE: incomplete branch inventory")
              return {row["name"]: row for row in rows}
          def check_open():
              prs = api("pulls?state=open&per_page=100")
              if len(prs) >= 100:
                  raise RuntimeError("REFUSE: incomplete open PR inventory")
              actual = {p["number"]: p["head"]["ref"] for p in prs
                        if (p["head"].get("repo") or {}).get("full_name") == REPO}
              if actual != EXPECTED_OPEN:
                  raise RuntimeError("REFUSE: open PR inventory changed " + repr(actual))
          def check_active(name):
              result = api("actions/runs?per_page=100&branch=" + urllib.parse.quote(name, safe=""))
              runs = result.get("workflow_runs", [])
              if len(runs) >= 100:
                  raise RuntimeError("REFUSE: Actions run listing may be incomplete " + name)
              active = [(r["id"], r["status"]) for r in runs if r["status"] != "completed"]
              if active:
                  raise RuntimeError("REFUSE: running jobs on " + name + " " + repr(active))
          def verify_inventory(retired):
              rows = inventory()
              expected = {"main"} | set(KEEP) | (set(CANDIDATES) - retired)
              allowed = expected | {SELF}
              if not expected.issubset(rows) or set(rows) - allowed or set(rows) & retired:
                  raise RuntimeError("REFUSE: branch inventory drift " + repr(sorted(rows)))
              if not rows["main"].get("protected"):
                  raise RuntimeError("REFUSE: main protection missing")
              for name, sha in {**KEEP, **CANDIDATES}.items():
                  if name in retired:
                      continue
                  if rows[name].get("protected") or rows[name]["commit"]["sha"] != sha:
                      raise RuntimeError("REFUSE: protected or moved head " + name)
              check_open()
              return rows

          verify_inventory(set())
          for name in CANDIDATES:
              prs = api("pulls?state=all&per_page=100&head=" +
                        urllib.parse.quote("jtl6713:" + name, safe=""))
              if len(prs) >= 100 or any(p["state"] != "closed" for p in prs):
                  raise RuntimeError("REFUSE: candidate has open/unknown PRs " + name)
              if name in SUPERSEDED:
                  old, replacement = SUPERSEDED[name]
                  old_pr = api("pulls/" + str(old))
                  new_pr = api("pulls/" + str(replacement))
                  if (old_pr["state"] != "closed" or old_pr.get("merged_at")
                      or old_pr["head"]["ref"] != name or not new_pr.get("merged_at")):
                      raise RuntimeError("REFUSE: supersession evidence changed " + name)
              check_active(name)

          own = api("pulls?state=closed&per_page=100&head=" +
                    urllib.parse.quote("jtl6713:" + SELF, safe=""))
          merged = [p for p in own if p.get("merged_at") and p["head"]["ref"] == SELF]
          if len(merged) != 1:
              raise RuntimeError("REFUSE: self cleanup PR is not merged exactly once")
          own_sha = merged[0]["head"]["sha"]
          rows = inventory()
          if SELF in rows and (rows[SELF].get("protected") or rows[SELF]["commit"]["sha"] != own_sha):
              raise RuntimeError("REFUSE: cleanup self branch moved or protected")
          print("PREFLIGHT_OK candidates=6 open_prs=2", flush=True)

          heads = dict(CANDIDATES)
          heads[SELF] = own_sha
          # Preserve every unique unmerged commit, not just work already on main.
          for name, sha in heads.items():
              tag = "archive/factory-review-final-20261105/" + name.replace("/", "--")
              endpoint = "git/ref/tags/" + encode(tag)
              try:
                  existing = api(endpoint)
                  if existing["object"]["sha"] != sha:
                      raise RuntimeError("REFUSE: archive tag collision " + tag)
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  api("git/refs", "POST", {"ref": "refs/tags/" + tag, "sha": sha})
              for attempt in range(12):
                  try:
                      saved = api(endpoint)
                      if saved["object"]["sha"] != sha:
                          raise RuntimeError("REFUSE: archive tag mismatch " + tag)
                      break
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
                      time.sleep(1)
              else:
                  raise RuntimeError("REFUSE: archive tag not verified " + tag)
              print("ARCHIVED " + name + " @ " + sha, flush=True)
          print("ALL_HISTORY_ARCHIVED_BEFORE_ANY_DELETE", flush=True)

          retired = set()
          for name, sha in heads.items():
              rows = verify_inventory(retired)
              if name not in rows:
                  if name != SELF:
                      raise RuntimeError("REFUSE: candidate disappeared " + name)
                  print("SELF_ALREADY_REMOVED " + name, flush=True)
                  continue
              if rows[name]["commit"]["sha"] != sha or rows[name].get("protected"):
                  raise RuntimeError("REFUSE: branch head drift " + name)
              if name in CANDIDATES:
                  check_active(name)
              tag = "archive/factory-review-final-20261105/" + name.replace("/", "--")
              if api("git/ref/tags/" + encode(tag))["object"]["sha"] != sha:
                  raise RuntimeError("REFUSE: archive tag not verified at deletion " + name)
              ref = "refs/heads/" + name
              subprocess.run(["git", "push", "--force-with-lease=" + ref + ":" + sha,
                              "origin", ":" + ref], check=True, timeout=80)
              for attempt in range(12):
                  if name not in inventory():
                      break
                  time.sleep(1)
              else:
                  raise RuntimeError("REFUSE: deletion not confirmed " + name)
              if name in CANDIDATES:
                  retired.add(name)
              print("RETIRED " + name, flush=True)
          final = inventory()
          if set(final) != {"main"} | set(KEEP):
              raise RuntimeError("REFUSE: unexpected final branches " + repr(sorted(final)))
          check_open()
          print("CLEANUP_COMPLETE branches=" + repr(sorted(final)) +
                " archived_heads=" + str(len(heads)), flush=True)
          PY
