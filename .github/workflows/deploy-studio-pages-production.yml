name: Deploy Studio Pages Production (legacy)

# Manual dispatch only. Production Pages deploys on main are owned by
# deploy-cloudflare-pages-production.yml (Access-aware verify + custom-domain check).
# Auto-push from this workflow failed verify without Access headers and raced the
# controlled deploy (UI 0.6.532 merge of #549).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-pages-production-legacy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      PAGES_PROJECT: chicagoshining-studio
      PUBLIC_URL: https://studio.chicagoshining.com
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify Studio source
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/studio-web/index.html
          UI_LABEL=$(grep -oE 'UI build [0-9]+\.[0-9]+\.[0-9]+' apps/studio-web/index.html | head -n1 | awk '{print $3}')
          test -n "$UI_LABEL"
          echo "UI_LABEL=$UI_LABEL" >> "$GITHUB_ENV"
          echo "Studio source UI label: $UI_LABEL"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Deploy Studio to Cloudflare Pages production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest pages deploy apps/studio-web \
            --project-name="$PAGES_PROJECT" \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Studio UI ${UI_LABEL} production deployment" \
            --commit-dirty=false

      - name: Verify production UI
        shell: bash
        run: |
          set -euo pipefail
          ACCESS_HEADERS=()
          if [[ -n "${CF_ACCESS_CLIENT_ID:-}" && -n "${CF_ACCESS_CLIENT_SECRET:-}" ]]; then
            ACCESS_HEADERS=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          for ATTEMPT in $(seq 1 30); do
            BODY=$(curl -fsS "${ACCESS_HEADERS[@]}" "$PUBLIC_URL/?deploy_verify=$GITHUB_SHA" || true)
            if grep -Fq "UI build $UI_LABEL" <<<"$BODY"; then
              echo "Studio production verification PASS: UI $UI_LABEL"
              exit 0
            fi
            echo "Waiting for Studio production UI $UI_LABEL (attempt $ATTEMPT/30)"
            sleep 10
          done
          echo "Studio production did not report UI $UI_LABEL" >&2
          exit 1
