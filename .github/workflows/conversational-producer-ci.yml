name: Conversational Producer CI

on:
  pull_request:
    paths:
      - 'apps/studio-api/conversational-producer-plan.*'
      - 'apps/studio-api/factory-producer-feedback.*'
      - 'apps/studio-api/factory-producer-media-edits.*'
      - 'apps/studio-api/factory-producer-render-evidence.*'
      - 'apps/studio-api/factory-producer-library-append.*'
      - 'apps/studio-api/factory-producer-workflow.test.mjs'
      - 'apps/studio-api/factory-producer-dispatch.test.mjs'
      - 'apps/studio-api/factory-producer-execution-lock.test.mjs'
      - 'apps/studio-api/worker-functions-04.mjs'
      - 'apps/studio-api/worker.js'
      - 'apps/studio-web/assets/factory-desk.js'
      - 'apps/studio-web/factory-review-feedback.test.mjs'
      - '.github/workflows/conversational-producer-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check modules
        run: |
          node --check apps/studio-api/conversational-producer-plan.mjs
          node --check apps/studio-api/factory-producer-feedback.mjs
          node --check apps/studio-api/factory-producer-media-edits.mjs
          node --check apps/studio-api/factory-producer-render-evidence.mjs
          node --check apps/studio-api/factory-producer-library-append.mjs
          node --check apps/studio-api/worker-functions-04.mjs
          node --check apps/studio-api/worker.js
          node --check apps/studio-web/assets/factory-desk.js
      - name: Run producer and Factory contracts
        run: node --test apps/studio-api/conversational-producer-plan.test.mjs apps/studio-api/factory-producer-feedback.test.mjs apps/studio-api/factory-producer-media-edits.test.mjs apps/studio-api/factory-producer-render-evidence.test.mjs apps/studio-api/factory-producer-library-append.test.mjs apps/studio-api/factory-producer-workflow.test.mjs apps/studio-api/factory-producer-dispatch.test.mjs apps/studio-api/factory-producer-execution-lock.test.mjs apps/studio-web/factory-review-feedback.test.mjs
