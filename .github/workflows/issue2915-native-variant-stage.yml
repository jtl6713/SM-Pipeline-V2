name: Issue 2915 Stage Verified High Line Native Variants
on:
  pull_request:
    paths:
      - 'repair/scripts/issue2915-native-variant-stage.py'
      - '.github/workflows/issue2915-native-variant-stage.yml'
  push:
    branches: [main]
    paths:
      - 'repair/scripts/issue2915-native-variant-stage.py'
      - '.github/workflows/issue2915-native-variant-stage.yml'
permissions:
  contents: read
concurrency:
  group: issue2915-native-variant-stage
  cancel-in-progress: false
jobs:
  static-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile stage script and enforce exact hold and no provider write
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile repair/scripts/issue2915-native-variant-stage.py
          python3 - <<'PY'
          import ast
          from pathlib import Path
          p=Path('repair/scripts/issue2915-native-variant-stage.py')
          s=p.read_text(); tree=ast.parse(s)
          for required in ['resource_slot','circuit_open','recovery_read_only_active','studio_write_source','studio_runner_output_read_source','10863','10865','source_writes','provider_writes','factory_approvals','1080x1920','_confirm(url,sha)','studio_transfer_id']:
              assert required in s, required
          for forbidden in ['api.airtable.com','graph.facebook.com','media_publish','requests.post','requests.patch','requests.delete','requests.put']:
              assert forbidden not in s, forbidden
          scope={}
          helper=ast.Module(body=[n for n in tree.body if isinstance(n,ast.FunctionDef) and n.name in ('require_owned','exact_variant')],type_ignores=[])
          exec(compile(helper,'variant-helper','exec'),scope)
          def asset(name,transfer,rights='Owned',profile='p'):
              return dict(asset_name=name,media_class='Image',active=True,do_not_use=False,asset_status='Available',google_drive_file_id='id',metadata=dict(studio_transfer_id=transfer,rights_status=rights,content_profile_airtable_id=profile))
          source=asset('name__4x5__x.jpg','original-4x5')
          good=asset('name__9x16__x.jpg','original-9x16')
          assert scope['exact_variant'](source,[good],'p') is good
          for candidates in [[],[good,good],[asset(good['asset_name'],'other-9x16')],[asset(good['asset_name'],'original-9x16',rights='Unknown')],[asset(good['asset_name'],'original-9x16',profile='other')]]:
              try: scope['exact_variant'](source,candidates,'p')
              except RuntimeError: pass
              else: raise AssertionError('invalid or ambiguous lineage accepted')
          print('ISSUE2915_VARIANT_STATIC_AND_LINEAGE_SAFE')
          PY
  stage-owned-media:
    if: github.event_name == 'push'
    needs: static-safety
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate existing Ops runner without exposing credential
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C";do
            [[ -n "$candidate" ]] || continue
            http=$(curl -sS --max-time 20 -o /tmp/issue2915-ops-catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" 'https://ops.chicagoshining.com/api/catalog' || true)
            if [[ "$http" == 200 ]] && jq -e '.ok==true' /tmp/issue2915-ops-catalog.json >/dev/null;then
              echo "::add-mask::$candidate"
              echo "ISSUE2915_OPS_TOKEN=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'Owned R2 staging blocked: Ops unavailable; no media state changed'; exit 1
      - name: Build pinned SHA256 source execution request for original owner runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,json,pathlib
          src=pathlib.Path('repair/scripts/issue2915-native-variant-stage.py')
          expected=hashlib.sha256(src.read_bytes()).hexdigest()
          sha=os.environ['GITHUB_SHA']
          assert len(sha)==40 and all(c in '0123456789abcdef' for c in sha)
          url=f'https://raw.githubusercontent.com/jtl6713/SM-Pipeline-V2/{sha}/{src.as_posix()}'
          command=(
              "$ErrorActionPreference='Stop';"
              "$py=Get-Command python -ErrorAction SilentlyContinue;"
              "if(-not $py){throw 'ops_python_missing'};"
              "$tmp=Join-Path $env:TEMP 'issue2915-owned-gallery-stage.py';"
              f"$srcUrl='{url}';"
              "Invoke-WebRequest -Uri $srcUrl -Method Get -OutFile $tmp -UseBasicParsing -TimeoutSec 55;"
              "$actual=(Get-FileHash $tmp -Algorithm SHA256).Hash.ToLowerInvariant();"
              f"if($actual -ne '{expected}'){{throw 'exact_stage_source_checksum_mismatch'}};"
              "try{& python $tmp;"
              "if($LASTEXITCODE -ne 0){throw ('nyc_gallery_python_stage_exit_'+$LASTEXITCODE)}}"
              "finally{Remove-Item $tmp -Force -ErrorAction SilentlyContinue}"
          )
          pathlib.Path('/tmp/issue2915-ops-request.json').write_text(json.dumps({'command':command,'confirm':True}))
          print('IMMUTABLE_ISSUE2915_STAGE_SOURCE_PINNED')
          PY
      - name: Stage eight verified owned vertical images, no output writes
        shell: bash
        run: |
          set -euo pipefail
          accepted=false
          for slot in $(seq 1 32);do
            code=$(curl -sS --max-time 30 -o /tmp/issue2915-ops-start.json -w '%{http_code}' \
              -X POST 'https://ops.chicagoshining.com/api/shell' \
              -H "Authorization: Bearer $ISSUE2915_OPS_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @/tmp/issue2915-ops-request.json || true)
            if [[ "$code" == 200 || "$code" == 202 ]];then accepted=true;break;fi
            if [[ "$code" != 409 ]];then echo "R2 owner runner returned $code";exit 2;fi
            sleep 12
          done
          [[ "$accepted" == true ]] || { echo 'Ops shell busy; no second stage scheduled';exit 2; }
          job=$(jq -er '.job.id // .jobId' /tmp/issue2915-ops-start.json)
          for tick in $(seq 1 480);do
            curl -fsS --max-time 30 -H "Authorization: Bearer $ISSUE2915_OPS_TOKEN" \
              "https://ops.chicagoshining.com/api/jobs/$job" -o /tmp/issue2915-ops-job.json
            status=$(jq -r '.job.status // empty' /tmp/issue2915-ops-job.json)
            if [[ "$status" == ok ]];then
              jq -r '.job.log // ""' /tmp/issue2915-ops-job.json | grep '^ISSUE2915_VARIANT_STAGE=' | tail -1 \
                | sed 's/^ISSUE2915_VARIANT_STAGE=//' > /tmp/issue2915-gallery-stage.json
              jq -e '.verified==true and .output==10865 and .source_output==10863 and .source_writes==0 and .provider_writes==0 and .factory_approvals==0 and (.assets|length)==8 and all(.assets[]; .cdn_verified==true and .geometry=="1080x1920")' /tmp/issue2915-gallery-stage.json >/dev/null
              jq -c '{verified,output,source_output,source_updated_at,target_updated_at,source_writes,provider_writes,assets:[.assets[]|{index,media_asset_id,drive_id,asset_name,transfer_id,url,sha256,geometry,cdn_verified}]}' /tmp/issue2915-gallery-stage.json
              exit 0
            elif [[ "$status" == failed ]];then
              echo 'Owned R2 image stage failed; no automatic source/approval/provider changes'
              jq -r '.job.log // ""' /tmp/issue2915-ops-job.json | tail -n 23 \
                | sed -E 's#[A-Za-z0-9_./+=-]{28,}#[redacted]#g' \
                | grep -Ev 'Authorization:|Bearer |SUPABASE_SERVICE_ROLE_KEY|R2_UPLOAD_WORKER_SECRET|GOOGLE_REFRESH_TOKEN' || true
              exit 3
            fi
            sleep 4
          done
          echo 'R2 staging job incomplete; do not set public statuses Ready'; exit 4
      - name: Preserve exact public CDN hash and ownership receipts for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue2915-native-variant-stage
          path: /tmp/issue2915-gallery-stage.json
          retention-days: 30
          if-no-files-found: warn
