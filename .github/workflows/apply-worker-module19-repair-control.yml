name: Apply Worker Module 19 Repair Control Source Patch

on:
  push:
    branches: [main]
    paths:
      - 'deploy/apply-worker-module19-repair-control.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-worker-source-repair
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply exact source patch
        shell: bash
        run: |
          set -euo pipefail
          python repair/tools/patch_worker_make_admin_module19_control.py
          cp apps/studio-api/worker.js /tmp/studio-worker.mjs
          node --check /tmp/studio-worker.mjs
          grep -q 'repair_make_admin_module19_v1: true' apps/studio-api/worker.js
          grep -q 'action === "repair_make_admin_module19"' apps/studio-api/worker.js

      - name: Commit patched Worker source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio-api/worker.js
          if git diff --cached --quiet; then
            echo 'Worker repair control already present.'
            exit 0
          fi
          git commit -m 'Add exact MAKE-ADMIN module 19 repair control'
          git push origin HEAD:main
