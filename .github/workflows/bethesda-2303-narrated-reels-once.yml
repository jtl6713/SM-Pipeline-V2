name: Bethesda 2303 narrated Reel-only one-shot repair
on:
  pull_request:
    paths:
      - '.github/workflows/bethesda-2303-narrated-reels-once.yml'
      - '.github/scripts/bethesda-2303-narrated-reels-once.ps1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bethesda-2303-narrated-reels-once.yml'
permissions:
  contents: read
concurrency:
  group: bethesda-2303-narrated-original-two-reels
  cancel-in-progress: false
jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate one-time PowerShell syntax without execution
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.github/scripts/bethesda-2303-narrated-reels-once.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors.Count -gt 0){$errors|ForEach-Object {Write-Error $_.ToString()};exit 1}
          Write-Output 'bethesda_ps_syntax=PASS'
      - name: Reject publisher calls
        shell: bash
        run: |
          set -euo pipefail
          f=.github/scripts/bethesda-2303-narrated-reels-once.ps1
          grep -Fq "do_not_publish -ne " "$f"
          grep -Fq "Stage 'r4'" "$f"
          grep -Fq "Stage 'r5'" "$f"
          ! grep -Eqi 'stages/(publish|ap1|ttd)|api/outputs/.*/approve|airtable.com' "$f"
          echo 'bethesda_exact_held_r4_r5_only=PASS'
  execute:
    if: github.event_name == 'push'
    needs: syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 36
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify recovery publishing fence
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 https://pipeline.chicagoshining.com/health -o /tmp/bethesda-health.json
          jq -e '.ok==true and .recovery_read_only==true and .recovery_producer_only_enabled==true and .recovery_producer_scope=="all_governed_requests" and .workload_governor_enabled==true and .studio_write_source=="supabase" and .i1_durable_jobs==false and .airtable_activity.any_activity==false' /tmp/bethesda-health.json >/dev/null
          echo 'bethesda_global_publishing_fence=PASS'
      - name: Submit guarded original-Reels-only operation to Windows Ops
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://ops.chicagoshining.com
          TOKEN=''
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C"; do
            [[ -n "$candidate" ]] || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then TOKEN="$candidate";break;fi
          done
          [[ -n "$TOKEN" ]] || { echo 'ops_token_unavailable_no_mutation';exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          code=Path('.github/scripts/bethesda-2303-narrated-reels-once.ps1').read_text(encoding='utf-8')
          Path('/tmp/ops.json').write_text(json.dumps({'command':code,'confirm':True}))
          PY
          status=$(curl -sS --max-time 35 -o /tmp/start.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/ops.json || true)
          [[ "$status" == 202 ]] || { echo "ops_exact_job_not_accepted_http=$status no_retry=true";exit 1; }
          job=$(jq -r '.job.id // .jobId // empty' /tmp/start.json)
          [[ -n "$job" ]] || { echo 'no_exact_job_receipt';exit 1; }
          echo "bethesda_ops_job=$job"
          for i in $(seq 1 225); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN" "$BASE/api/jobs/$job" -o /tmp/status.json
            state=$(jq -r '.job.status // empty' /tmp/status.json)
            if [[ "$state" == ok || "$state" == failed ]]; then
              jq -r '.job.log // ""' /tmp/status.json | grep '^bethesda_' || true
              [[ "$state" == ok ]] || { echo 'repair_failed_closed_do_not_auto_retry=true';exit 1; }
              jq -e '(.job.log // "")|contains("bethesda_2303_two_reel_audio_fix=COMPLETE")' /tmp/status.json >/dev/null
              echo 'bethesda_exact_two_reels_narrated=PASS four_holds_preserved=true'
              exit 0
            fi
            sleep 7
          done
          echo 'bethesda_exact_operation_unconfirmed_no_retry=true'
          exit 1
