name: Checkpoint Item6 Ledger

on:
  push:
    branches: [main]
    paths: ['deploy/checkpoint-item6-ledger.txt']

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Update Item 6 row only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('repair/SM_PIPELINE_21_ITEM_LEDGER.md')
          text=p.read_text()
          lines=text.splitlines()
          prefix='| 6 | Safe republish/replace transaction and duplicate cleanup |'
          hits=[i for i,l in enumerate(lines) if l.startswith(prefix)]
          if len(hits)!=1:
              raise SystemExit(f'Expected exactly one Item 6 row, found {len(hits)}')
          lines[hits[0]]='| 6 | Safe republish/replace transaction and duplicate cleanup | **In progress — live inventory complete; transaction implementation next** | Read-only live audits of all scheduled publisher orchestrators plus 18 active stage workers are complete. Cost-driving orchestrators remain OFF. Existing single-attempt safety primitives were confirmed (Facebook revision/fingerprint/reconciliation, Instagram carousel reconciliation, TikTok draft publish-ID guard/public-post list, YouTube upload idempotency), but no platform has a cross-revision last-good/pending replacement transaction. Instagram Reel/Story and TikTok ambiguous creation paths can still blind-retry, and stage workers do not independently enforce `Test_Run_ID`. No Item 6 Airtable/Make/public-platform mutation has occurred. Durable evidence: `repair/evidence/item6-republish-inventory-20260817.json`. | Implement the minimal exact-output transaction contract: durable last-good snapshot, transaction/revision idempotency, fail-safe ambiguous outcomes, verified replacement before commit, deterministic cleanup/manual-cleanup state, rollback restoration, isolated positive + denial proof. |'
          p.write_text('\n'.join(lines)+'\n')
          PY
          git config user.name 'SM Pipeline Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add repair/SM_PIPELINE_21_ITEM_LEDGER.md
          git diff --cached --check
          git diff --cached --exit-code && { echo 'No ledger change required'; exit 0; } || true
          git commit -m 'item6: checkpoint republish inventory'
          git push origin HEAD:main
