name: Verify Manual Idea Live Deployment

on:
  push:
    branches: [main]
    paths:
      - 'deploy/verify-manual-idea-live-deploy.txt'

permissions:
  contents: write

concurrency:
  group: verify-manual-idea-live-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Capture live Worker and Pages diagnostics
        shell: bash
        run: |
          set -u
          API_ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          WORKER_API="$API_ROOT/workers/scripts/chicagoshining-studio-api"

          curl -fsS "$WORKER_API/deployments" -H "$AUTH" -o /tmp/worker-deployments.json
          curl -fsS "$WORKER_API/content/v2" -H "$AUTH" -o /tmp/worker-content.bin
          if grep -aFq '0.10.36-manual-ideas-run' /tmp/worker-content.bin; then echo true >/tmp/worker-version-ok; else echo false >/tmp/worker-version-ok; fi
          if grep -aFq 'studio_manual_idea_run_v2' /tmp/worker-content.bin; then echo true >/tmp/worker-run-ok; else echo false >/tmp/worker-run-ok; fi

          curl -fsS "$API_ROOT/pages/projects/chicagoshining-studio/deployments?env=production&per_page=10" -H "$AUTH" -o /tmp/pages-deployments.json
          PAGES_URL=$(jq -r '.result[0].url // ""' /tmp/pages-deployments.json)
          case "$PAGES_URL" in http*) ;; "") ;; *) PAGES_URL="https://$PAGES_URL" ;; esac
          PAGE_CODE=000
          if [ -n "$PAGES_URL" ]; then PAGE_CODE=$(curl -sSL --max-time 30 -o /tmp/live-index.html -w '%{http_code}' "$PAGES_URL/" || true); fi
          if [ -s /tmp/live-index.html ] && grep -Fq '0.6.69-idea-progress' /tmp/live-index.html; then echo true >/tmp/pages-version-ok; else echo false >/tmp/pages-version-ok; fi
          if [ -s /tmp/live-index.html ] && grep -Fq 'UI build 0.6.69' /tmp/live-index.html; then echo true >/tmp/pages-build-ok; else echo false >/tmp/pages-build-ok; fi
          printf '%s' "$PAGE_CODE" >/tmp/pages-http-code

          python - <<'PY'
          import hashlib,json
          from datetime import datetime,timezone
          from pathlib import Path
          wd=json.loads(Path('/tmp/worker-deployments.json').read_text())
          pd=json.loads(Path('/tmp/pages-deployments.json').read_text())
          active=max(wd['result']['deployments'][0]['versions'],key=lambda x:x.get('percentage',0))
          page=pd['result'][0]
          rb=Path('/tmp/worker-content.bin').read_bytes()
          idx=Path('/tmp/live-index.html').read_bytes() if Path('/tmp/live-index.html').exists() else b''
          read=lambda p: Path(p).read_text().strip()=='true'
          out={
            'checked_at':datetime.now(timezone.utc).isoformat(),
            'worker':{
              'name':'chicagoshining-studio-api',
              'active_version_id':active.get('version_id'),
              'expected_source_version':'0.10.36-manual-ideas-run',
              'source_marker_present':read('/tmp/worker-version-ok'),
              'explicit_make_run_marker_present':read('/tmp/worker-run-ok'),
              'content_sha256':hashlib.sha256(rb).hexdigest(),
            },
            'pages':{
              'project':'chicagoshining-studio',
              'deployment_id':page.get('id'),
              'deployment_url':page.get('url'),
              'commit_hash':((page.get('deployment_trigger') or {}).get('metadata') or {}).get('commit_hash'),
              'expected_ui_build':'0.6.69-idea-progress',
              'live_index_marker_present':read('/tmp/pages-version-ok'),
              'live_build_label_present':read('/tmp/pages-build-ok'),
              'http_code':Path('/tmp/pages-http-code').read_text().strip(),
              'index_sha256':hashlib.sha256(idx).hexdigest() if idx else None,
            },
          }
          out['pass']=bool(out['worker']['source_marker_present'] and out['worker']['explicit_make_run_marker_present'] and out['pages']['live_index_marker_present'] and out['pages']['live_build_label_present'])
          Path('repair/evidence/manual-idea-live-deploy-20260820.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Commit sanitized verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add repair/evidence/manual-idea-live-deploy-20260820.json
          git commit -m 'evidence: capture manual idea live deployment state' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
