name: Incident 2670 Indexed QA Failure REST Page Proof
on:
  push:
    branches: [main]
    paths: ['deploy/incident-2670-qa-indexed-rest-proof.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: incident-2670-qa-indexed-rest-proof
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPS_TOKEN: ${{ secrets.OPS_DASHBOARD_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Parse read-only PowerShell script before Ops
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.github/scripts/incident-2670-qa-indexed-rest-ops.ps1'),
            [ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){throw 'indexed_qa_ops_script_parse_invalid'}
          Write-Output 'indexed_qa_ops_parser=PASS'
      - name: Check protected Supabase-only Runner and exact indexed source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPS_TOKEN"
          curl -fsS --max-time 20 https://pipeline.chicagoshining.com/health -o /tmp/indexed-qa-health.json
          jq -e '.ok==true and .workload_governor_enabled==true and
            .recovery_read_only==false and .studio_write_source=="supabase" and
            .supabase_pipeline_writes==true and
            .airtable_activity.any_activity==false' /tmp/indexed-qa-health.json >/dev/null
          grep -F 'home_failure_candidate=eq.true' apps/studio-api/supabase-pipeline-reads.mjs >/dev/null
          echo 'indexed_qa_ops_authority=PASS'
      - name: Call exact three indexed PostgREST GETs with existing runner secret
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE='https://ops.chicagoshining.com'
          curl -fsS --max-time 20 -H "Authorization: Bearer $OPS_TOKEN" "$BASE/api/catalog" -o /tmp/indexed-qa-catalog.json
          jq -e '.ok==true' /tmp/indexed-qa-catalog.json >/dev/null
          node --input-type=module - <<'JS' > /tmp/indexed-qa-b64.txt
          import { QA_CENSUS_OUTPUT_SELECT } from './apps/studio-api/supabase-pipeline-reads.mjs';
          if (!QA_CENSUS_OUTPUT_SELECT || QA_CENSUS_OUTPUT_SELECT.length > 6000) {
            throw new Error("indexed_qa_source_select_invalid");
          }
          process.stdout.write(Buffer.from(QA_CENSUS_OUTPUT_SELECT,'utf8').toString('base64'));
          JS
          python3 - <<'PY'
          from pathlib import Path
          import json
          b64=Path('/tmp/indexed-qa-b64.txt').read_text()
          source=Path('.github/scripts/incident-2670-qa-indexed-rest-ops.ps1').read_text()
          source=source.replace('__SELECT_B64__',b64)
          if not 500<len(source)<8000:
              raise SystemExit('indexed_qa_script_too_large')
          Path('/tmp/indexed-qa-ops-body.json').write_text(json.dumps({'command':source,'confirm':True}))
          PY
          code=$(curl -sS --max-time 30 -o /tmp/indexed-qa-start.json -w '%{http_code}' \
            -X POST "$BASE/api/shell" -H "Authorization: Bearer $OPS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/indexed-qa-ops-body.json || true)
          [[ "$code" == 202 || "$code" == 200 ]] || { echo "indexed_qa_ops_http=$code"; exit 1; }
          job=$(jq -r '.job.id // .jobId // empty' /tmp/indexed-qa-start.json)
          test -n "$job"
          for i in $(seq 1 55); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $OPS_TOKEN" \
              "$BASE/api/jobs/$job" -o /tmp/indexed-qa-status.json
            status=$(jq -r '.job.status // empty' /tmp/indexed-qa-status.json)
            if [[ "$status" == ok ]]; then
              jq -r '.job.log // ""' /tmp/indexed-qa-status.json |
                grep '^incident2670_indexed_qa_page_offset_' | tail -3
              jq -r '.job.log // ""' /tmp/indexed-qa-status.json |
                grep -x '^incident2670_indexed_qa_three_pages=PASS_247_DISTINCT_NO_WRITES$' >/dev/null
              echo 'indexed_qa_rest_three_pages=PASS_247_DISTINCT_NO_WRITES'
              exit 0
            fi
            if [[ "$status" == failed ]]; then
              echo 'indexed_qa_rest_three_pages=FAILED_NO_MUTATIONS'
              exit 1
            fi
            sleep 3
          done
          echo 'indexed_qa_rest_three_pages=UNCONFIRMED_TIMEOUT'
          exit 1
