name: Diagnose Pre-production AI Route

on:
  push:
    branches: [main]
    paths:
      - 'deploy/diagnose-preprod-ai-route.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run API source regression tests
        run: node --test apps/studio-api/preproduction-ai.test.mjs
      - name: Print AI route routing context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('apps/studio-api/worker.js').read_text(encoding='utf-8')
          needles=[
            'isProductionRequestAiMastersRoute',
            'generate-ai-masters',
            'generateItem4PreProductionAiMaster',
            'Method not allowed in Phase 2A',
          ]
          for n in needles:
            print(f'\n===== {n} =====')
            start=0
            found=False
            while True:
              i=s.find(n,start)
              if i<0: break
              found=True
              lo=max(0,i-2200); hi=min(len(s),i+5000)
              print(s[lo:hi])
              print('\n--- occurrence end ---')
              start=i+len(n)
            if not found: print('NOT FOUND')
          PY
