name: Diagnose Pre-production AI Count

on:
  push:
    branches: [main]
    paths:
      - 'deploy/diagnose-preprod-ai-route.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Print AI count logic
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('apps/studio-api/worker.js').read_text(encoding='utf-8')
          needles=['item4PreProductionAiRequestedCount','item4ParseEzOrigin','Carousel_Slide_Count_Exact']
          for n in needles:
              print(f'===== {n} =====')
              start=0
              while True:
                  i=s.find(n,start)
                  if i<0: break
                  print(s[max(0,i-1800):min(len(s),i+4500)])
                  print('---')
                  start=i+len(n)
          PY
