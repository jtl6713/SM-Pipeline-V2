name: Cloudflare Connection Check

# Read-only validation of the GitHub -> Cloudflare credential path.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-connection-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Cloudflare identity
        run: npx --yes wrangler@latest whoami --account "$CLOUDFLARE_ACCOUNT_ID" --json

      - name: Verify Studio API Worker access
        run: npx --yes wrangler@latest deployments list --name chicagoshining-studio-api --json > worker-deployments.json

      - name: Verify Studio Pages access
        run: npx --yes wrangler@latest pages deployment list --project-name chicagoshining-studio --json > pages-deployments.json

      - name: Summarize access
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const worker = JSON.parse(fs.readFileSync('worker-deployments.json','utf8'));
          const pages = JSON.parse(fs.readFileSync('pages-deployments.json','utf8'));
          const workerCount = Array.isArray(worker) ? worker.length : (worker?.deployments?.length ?? 'unknown');
          const pagesCount = Array.isArray(pages) ? pages.length : (pages?.result?.length ?? 'unknown');
          console.log(`Cloudflare authentication: PASS`);
          console.log(`Worker chicagoshining-studio-api visible: PASS (recent deployments: ${workerCount})`);
          console.log(`Pages chicagoshining-studio visible: PASS (recent deployments: ${pagesCount})`);
          NODE
