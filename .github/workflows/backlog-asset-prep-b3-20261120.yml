name: Batch B3 - 35 exact-only Facebook Drive-to-R2 prep jobs, no publication
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backlog-asset-prep-b3-20261120.yml'
permissions:
  contents: read
concurrency:
  group: ap0-asset-prep-b3-20261120
  cancel-in-progress: false
jobs:
  exact-prep:
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - {output_number: 2615, record_id: recmkxxBPnGHO1XBU, drive_id: 1NwAhWizMXOQdNLSU-wB1b-q7Y4-7oMWK}
