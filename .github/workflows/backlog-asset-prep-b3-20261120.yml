          - {output_number: 4957, record_id: recO9EfwXTIHcgjY8, drive_id: 18oXQbNPPqGeKb5C6n5uXI5Z0kHBPxy3-}
          - {output_number: 4975, record_id: recn9Nj0t4MvaYAi1, drive_id: 1NA7cOM7ySoTVDNJLDWFH7OSLWwRmY1AN}
          - {output_number: 4981, record_id: rec9njsCsdZhaDwAI, drive_id: 14xnPU6MGpUGgh6zwltpTRxaaMdPYnJt7}
          - {output_number: 4999, record_id: recE0wX8L8QIzLoxJ, drive_id: 1mtuHoLfZinaP272drEb8JJ0pAsskZ79h}
          - {output_number: 5011, record_id: reco4FhR7dntelIzX, drive_id: 1Jrxs9bVfwXFjULtXqjZMHA_ac7IhvnkP}
          - {output_number: 5023, record_id: recTlFWbfYVeSX94n, drive_id: 1-csWFTTuWEMaHHn4NFPv3MPw4zga8TpY}
          - {output_number: 5030, record_id: reckhfn0kQoE81MN5, drive_id: 11AxO2XkngrfIr_aY8hZH-bWiDGow724s}
          - {output_number: 5036, record_id: rec0XSXyycf3aXEGc, drive_id: 1SwxGzhaJp2aGipKSCIwlpiv8cXF_rDnH}
          - {output_number: 5132, record_id: rec3Q5ky6tx7upGBM, drive_id: 16yCf2FVSfSTk385fqqCcnrhU-6tQRw6t}
          - {output_number: 5151, record_id: recOvLa5kvvM9zQjq, drive_id: 1wcYECA_KuEo9cBclKAOvUmZnNuCP3hqg}
          - {output_number: 5169, record_id: rec1Smb1yTlGqYLQv, drive_id: 1JHOA_PsXkxdJPejVGMQJ0R8vfi45O44C}
          - {output_number: 5199, record_id: recsYpJIm13zGr5RD, drive_id: 17UhgACrOFKwrBnsgc93wnNbQMpVBM63_}
          - {output_number: 5307, record_id: recbmmosIe4MmcugT, drive_id: 1KUpUOrbUl3Y4Q3Pe-594gfgUY7tu-jFB}
          - {output_number: 5313, record_id: recjp4TC0oUU7gUMj, drive_id: 1Sd0er9N8fE-l3myQ_NdTaOboJCy0stEv}
          - {output_number: 5319, record_id: recEO8Yq9kT64YDnY, drive_id: 1Iw7uvkQwxVptmzhmMBGyQM6A-mAg1HqC}
          - {output_number: 5367, record_id: recXyw8nPK8B0b3Sc, drive_id: 1zCJ7pgOrrIdrADJLUWsjzNovxwG_0erU}
          - {output_number: 5379, record_id: reclCIZTWxKRtRKeR, drive_id: 1TY5FqzNTRyATZhgYcirC_CmhnaloqEiZ}
          - {output_number: 5385, record_id: recyzxnSvc2o7ZTYw, drive_id: 18zOTWOCQEnvGk8MbwlTRx1iEJErJ9zsD}
          - {output_number: 5397, record_id: recXn92AbAZfwRn7H, drive_id: 1Fk_daMjIMB1gJNQM7zOT7uUaQ_BQ7-IF}
          - {output_number: 5403, record_id: rec0WdtiYvbuTXOve, drive_id: 12m8WhRTQ_lUBi4DF_SUJ9LQy1Xv88h5g}
          - {output_number: 5409, record_id: recVOW4avJqG1KLKi, drive_id: 1z_ptXZcJZISw8r7Bl6iAHNQkG3FrPVwE}
          - {output_number: 5570, record_id: recPISIIpQO1KkoUS, drive_id: 1mXDihk3FhQ032RymiK3mmXtbuacGlARR}
          - {output_number: 5595, record_id: recQSo502EBsWpKfw, drive_id: 1yJqRaOyE8ttCs8OFdzUkGww4UFKXPKyS}
          - {output_number: 5601, record_id: recr7zIPKpkMySMTq, drive_id: 1AULxtc-Jkuwc3tJGaerYOd5DVtwQOKeY}
          - {output_number: 5915, record_id: reclLhI0NaIYuRsgU, drive_id: 1Q0X9qhWxaSeETyGa-Juk57lv_dEMMQZS}
          - {output_number: 6076, record_id: recjF5YXy1gbF9saz, drive_id: 1CrOIR34wEegsMA6kOShsKBXuuUX2RYPz}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - name: Authenticate existing production Ops
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C"; do
            test -n "$candidate" || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" https://ops.chicagoshining.com/api/catalog || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null; then
              echo "::add-mask::$candidate"
              echo "RECOVERY_OPS_TOKEN=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "No authenticated Ops credential"; exit 1
      - name: Prepare precisely output ${{ matrix.output_number }} MP4, NEVER invoke publish stages
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/asset-prep-${{ matrix.output_number }}.ps1 <<'PS'
          $ErrorActionPreference="Stop"
          $id="${{ matrix.record_id }}"
          $expected="${{ matrix.drive_id }}"
          $health=Invoke-RestMethod -Uri "http://127.0.0.1:3350/health" -TimeoutSec 20
          if ($health.ok -ne $true -or $health.studio_write_source -ne "supabase" -or $health.studio_runner_output_read_source -ne "supabase" -or $health.supabase_pipeline_writes -ne $true) { throw "supabase_runner_health_not_ready" }
          $envfile=Join-Path (Get-Location) "Services\pipeline-runner\service\.env"
          if (-not (Test-Path $envfile)) { throw "runner_envfile_missing" }
          function EnvVal([string]$key) {
            $line=@(Get-Content $envfile | Where-Object {$_ -match ("^\s*"+[regex]::Escape($key)+"\s*=")}) | Select-Object -Last 1
            if (-not $line) { throw "required_runner_env_missing" }
            return ([string]$line -split '=',2)[1].Trim().Trim('"',"'")
          }
          $secret=EnvVal "PIPELINE_RUNNER_SHARED_SECRET"
          $base=EnvVal "SUPABASE_URL"
          $dbkey=EnvVal "SUPABASE_SERVICE_ROLE_KEY"
          if (-not $secret -or -not $base -or -not $dbkey) { throw "runner_auth_missing" }
          $dbHead=@{apikey=$dbkey;Authorization=("Bearer "+$dbkey)}
          $uri=$base.TrimEnd("/")+"/rest/v1/platform_outputs?airtable_record_id=eq."+$id+"&select=output_number,airtable_record_id,platform,platform_output_type,review_status,output_status,render_status,publish_status,publish_method,auto_publish_enabled,do_not_publish,test_run_id,published_at,platform_post_url,publish_asset_url,final_file_url,publish_next_retry_at,error_messages"
          function ReadExact {
            $rows=@(Invoke-RestMethod -Uri $uri -Headers $dbHead -TimeoutSec 30)
            if ($rows.Count -ne 1) { throw "output_${{ matrix.output_number }}_missing_or_duplicate" }
            return $rows[0]
          }
          $o=ReadExact
          if ($o.output_number -ne ${{ matrix.output_number }} -or $o.platform -ne "Facebook" -or $o.platform_output_type -ne "Facebook Reel" -or
              $o.review_status -ne "Approved" -or $o.output_status -ne "Approved for Publishing" -or $o.render_status -ne "Rendered" -or
              $o.publish_status -ne "Ready to Publish" -or $o.publish_method -ne "Automated" -or $o.auto_publish_enabled -ne $true -or $o.do_not_publish -ne $false -or
              $o.test_run_id -or $o.published_at -or $o.platform_post_url -or $o.publish_asset_url -or
              $o.error_messages.Platform_Post_ID -or $o.error_messages.Platform_Media_ID -or $o.error_messages.FB_Slideshow_Meta_Video_ID -or
              $o.error_messages.Publish_Locked_By -or $o.error_messages.Publish_Locked_At -or $o.error_messages.Publish_Started_At -or
              $o.error_messages.Studio_Render_Review_Hold_Active -or $o.error_messages.Studio_Render_Review_Hold_ID -or $o.error_messages.Studio_Review_Hold_ID -or
              $o.error_messages.Final_File_ID -ne $expected -or
              $o.final_file_url -ne ("https://drive.google.com/file/d/"+$expected+"/view") -or
              -not ([string]$o.publish_next_retry_at).StartsWith("2099-01-01") -or
              $o.error_messages.Backlog_Prep_20261120_Mode -ne "asset_stage_only_no_publish" -or
              $o.error_messages.Backlog_Prep_20261120_Batch -ne "b3-remaining-facebook") { throw "output_${{ matrix.output_number }}_preflight_denied" }
          $headers=@{"X-Pipeline-Secret"=$secret}
          function Stage([bool]$dry) {
            $payload=@{output_record_id=$id;extra=@{dry_run=$dry}} | ConvertTo-Json -Depth 5 -Compress
            return Invoke-RestMethod -Uri "http://127.0.0.1:3350/stages/ap0" -Method Post -Headers $headers -Body $payload -ContentType "application/json" -TimeoutSec 390
          }
          $pre=Stage $true
          if ($pre.status -ne "ok" -or $pre.details.run.dry_run -ne $true -or $pre.details.run.eligibility_reason) {
            Write-Output ("asset_prep_${{ matrix.output_number }}_preview_status="+[string]$pre.status)
            Write-Output ("asset_prep_${{ matrix.output_number }}_preview_reason="+[string]$pre.details.run.eligibility_reason)
            throw "ap0_dry_run_not_eligible"
          }
          Write-Output "asset_prep_${{ matrix.output_number }}_dry_run=PASS"
          $result=Stage $false
          Write-Output ("asset_prep_${{ matrix.output_number }}_stage_status="+[string]$result.status)
          if ($result.status -ne "ok" -or $result.details.run.processed -ne $true) { throw "ap0_asset_transfer_failed" }
          $fresh=ReadExact
          if ($fresh.published_at -or $fresh.platform_post_url -or $fresh.publish_status -ne "Ready to Publish" -or
              -not ([string]$fresh.publish_next_retry_at).StartsWith("2099-01-01") -or
              -not ([string]$fresh.publish_asset_url).StartsWith("https://media.chicagoshining.com/publish/")) { throw "asset_prep_${{ matrix.output_number }}_readback_failed" }
          $head=Invoke-WebRequest -Uri $fresh.publish_asset_url -Method Head -UseBasicParsing -TimeoutSec 40
          if ([int]$head.StatusCode -ne 200 -or $head.Headers["Content-Type"] -notmatch "video/mp4") { throw "asset_prep_${{ matrix.output_number }}_public_mp4_not_verified" }
          Write-Output "asset_prep_${{ matrix.output_number }}_public_mp4=PASS"
          Write-Output ("asset_prep_${{ matrix.output_number }}_url="+[string]$fresh.publish_asset_url)
          Write-Output "asset_prep_${{ matrix.output_number }}_publish_hold=INTACT"
          PS
          python3 - <<'PY'
          import json,pathlib
          pathlib.Path('/tmp/asset-prep-${{ matrix.output_number }}.json').write_text(json.dumps({
            "command":pathlib.Path('/tmp/asset-prep-${{ matrix.output_number }}.ps1').read_text(),
            "confirm":True}))
          PY
          code=$(curl -sS --max-time 30 -o /tmp/ops-start.json -w '%{http_code}' \
            -X POST https://ops.chicagoshining.com/api/shell \
            -H "Authorization: Bearer $RECOVERY_OPS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/asset-prep-${{ matrix.output_number }}.json || true)
          if [[ "$code" != 200 && "$code" != 202 ]]; then echo "Ops rejected asset job http=$code"; exit 2; fi
          job=$(jq -er '.job.id // .jobId' /tmp/ops-start.json)
          for n in $(seq 1 120); do
            curl -fsS --max-time 25 -H "Authorization: Bearer $RECOVERY_OPS_TOKEN" \
              "https://ops.chicagoshining.com/api/jobs/$job" -o /tmp/ops-status.json
            status=$(jq -r '.job.status // empty' /tmp/ops-status.json)
            if [[ "$status" == ok ]]; then
              jq -r '.job.log // ""' /tmp/ops-status.json | grep '^asset_prep_${{ matrix.output_number }}_' || true
              exit 0
            elif [[ "$status" == failed ]]; then
              jq -r '.job.log // ""' /tmp/ops-status.json | tail -28
              exit 3
            fi
            sleep 5
          done
          echo "Asset job outcome not confirmed"; exit 4
