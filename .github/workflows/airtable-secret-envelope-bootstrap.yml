name: Bootstrap Encrypted Airtable Credential Envelope

on:
  push:
    branches: [main]
    paths:
      - 'deploy/airtable-secret-envelope-bootstrap.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airtable-secret-envelope-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require existing Cloudflare encryption secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"

      - name: Generate one-time RSA envelope and encrypt private key
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/airtable-envelope
          mkdir -p /tmp/airtable-envelope deploy/credential-envelope
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/airtable-envelope/private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/airtable-envelope/private.pem -pubout -out deploy/credential-envelope/public.pem >/dev/null 2>&1
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:CLOUDFLARE_API_TOKEN \
            -in /tmp/airtable-envelope/private.pem \
            -out deploy/credential-envelope/private.pem.enc
          chmod 600 deploy/credential-envelope/private.pem.enc
          rm -f /tmp/airtable-envelope/private.pem
          test -s deploy/credential-envelope/public.pem
          test -s deploy/credential-envelope/private.pem.enc

      - name: Commit only public key and encrypted private key
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/credential-envelope/public.pem deploy/credential-envelope/private.pem.enc
          if git diff --cached --quiet; then
            echo 'Envelope already present; no commit required.'
            exit 0
          fi
          git commit -m 'Generate encrypted Airtable deployment credential envelope'
          git push origin HEAD:main

      - name: Verify repository contains no plaintext private key
        shell: bash
        run: |
          set -euo pipefail
          test ! -e deploy/credential-envelope/private.pem
          ! git grep -n -- 'BEGIN PRIVATE KEY' -- ':!deploy/credential-envelope/public.pem'
          echo 'credential_envelope_bootstrap=PASS'
