name: Verify Encrypted Airtable Credential Envelope

# This historical bootstrap already ran. The committed public key, encrypted
# private key, and ciphertext form one matched set. Never silently regenerate
# only the key pair: that would invalidate the encrypted Airtable credential.
# Deliberate rekeying requires a reviewed PR with the whole matched envelope.
on:
  push:
    branches: [main]
    paths:
      - 'deploy/airtable-secret-envelope-bootstrap.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airtable-secret-envelope-bootstrap
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout existing encrypted envelope
        uses: actions/checkout@v6

      - name: Require versioned encrypted envelope files
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            deploy/credential-envelope/public.pem \
            deploy/credential-envelope/private.pem.enc \
            deploy/credential-envelope/airtable_pat.ciphertext.b64; do
            git ls-files --error-unmatch "$path" >/dev/null
            test -s "$path"
          done
          openssl pkey -pubin \
            -in deploy/credential-envelope/public.pem \
            -noout >/dev/null
          base64 --decode deploy/credential-envelope/airtable_pat.ciphertext.b64 >/dev/null
          test ! -e deploy/credential-envelope/private.pem
          if git grep -n -- 'BEGIN PRIVATE KEY' -- ':!deploy/credential-envelope/public.pem'; then
            echo 'Plaintext private key marker found in tracked repository content' >&2
            exit 1
          fi
          echo 'credential_envelope_present=PASS'
          echo 'credential_envelope_rotation=requires_reviewed_pr'
