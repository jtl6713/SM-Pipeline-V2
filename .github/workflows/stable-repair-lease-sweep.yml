name: Stable Repair Lease Sweep

on:
  push:
    branches: [main]
    paths:
      - 'deploy/stable-repair-lease-sweep.txt'

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRIDGE_WORKER: chicagoshining-repair-control-bridge
    steps:
      - name: Invoke authenticated sweep through stable bridge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS "$ROOT/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/subdomain.json
          SUB=$(jq -er '.result.subdomain' /tmp/subdomain.json)
          URL="https://$BRIDGE_WORKER.$SUB.workers.dev/control"
          SECRET=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          code=$(curl -sS --max-time 90 -o /tmp/sweep.json -w '%{http_code}' -X POST "$URL" -H "Authorization: Bearer $SECRET" -H 'Content-Type: application/json' --data '{"action":"sweep"}' || true)
          unset SECRET
          echo "sweep_http=$code"
          jq -c '{bridge_ok,upstream_status,upstream_ok:(.upstream_json.ok//null),action:(.upstream_json.action//null),swept_count:((.upstream_json.swept//[])|length),swept:(.upstream_json.swept//[]),exception}' /tmp/sweep.json || true
          test "$code" = '200'
          jq -e '.bridge_ok==true and .upstream_status==200 and .upstream_json.ok==true and .upstream_json.action=="sweep"' /tmp/sweep.json >/dev/null

      - name: Save bounded sweep evidence
        uses: actions/upload-artifact@v4
        with:
          name: stable-repair-lease-sweep-${{ github.run_id }}
          path: /tmp/sweep.json
          retention-days: 30
