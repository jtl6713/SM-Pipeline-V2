name: Configure youtube-upload-miami hostname

on:
  push:
    branches:
      - main
    paths:
      - "deploy/local-services/configure-youtube-upload-miami-hostname.ps1"
      - ".github/workflows/configure-youtube-upload-miami-hostname.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configure-youtube-upload-miami-hostname
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCOUNT_ID: cbb5651c94e9bd2efc4594dc87229acb
      TUNNEL_ID: f7a22f0f-f760-4e16-a085-3538d22981f1
      HOSTNAME: youtube-upload-miami.chicagoshining.com
      LOCAL_SERVICE: http://localhost:3343
    steps:
      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Merge tunnel ingress for youtube-upload-miami.chicagoshining.com
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/configurations" \
            -H "$AUTH" -o /tmp/tunnel-before.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("/tmp/tunnel-before.json").read_text())
          ingress = payload.get("result", {}).get("config", {}).get("ingress") or []
          hostname = "youtube-upload-miami.chicagoshining.com"
          kept = []
          for rule in ingress:
              if rule.get("hostname") == hostname:
                  continue
              if not rule.get("hostname") and str(rule.get("service", "")).startswith("http_status:"):
                  continue
              kept.append(rule)
          kept.append({"hostname": hostname, "service": "http://localhost:3343", "originRequest": {}})
          kept.append({"service": "http_status:404"})
          Path("/tmp/tunnel-after.json").write_text(json.dumps({"config": {"ingress": kept}}))
          PY
          curl -fsS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/cfd_tunnel/$TUNNEL_ID/configurations" \
            -H "$AUTH" -H "Content-Type: application/json" \
            --data-binary @/tmp/tunnel-after.json -o /tmp/tunnel-put.json
          jq -e ".success == true" /tmp/tunnel-put.json >/dev/null
          echo "tunnel_ingress=updated"

      - name: Ensure DNS CNAME for youtube-upload-miami.chicagoshining.com
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          TARGET="${TUNNEL_ID}.cfargotunnel.com"
          if ! curl -fsS "https://api.cloudflare.com/client/v4/zones?name=chicagoshining.com" -H "$AUTH" -o /tmp/zone.json; then
            {
              echo "## Miami YouTube DNS needs manual step"
              echo ""
              echo "Tunnel ingress is configured. \`CLOUDFLARE_API_TOKEN\` cannot read zone DNS (403)."
              echo "In Cloudflare DNS for \`chicagoshining.com\`, add a proxied CNAME:"
              echo "\`youtube-upload-miami\` -> \`${TARGET}\`"
              echo ""
              echo "Or open Zero Trust → Networks → Tunnels → Public Hostname and save \`${HOSTNAME}\` -> \`http://localhost:3343\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "dns_cname=manual_required"
            exit 0
          fi
          ZONE_ID=$(jq -er ".result[0].id" /tmp/zone.json)
          curl -fsS "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=${HOSTNAME}" -H "$AUTH" -o /tmp/dns-before.json
          EXISTING=$(jq -r '.result[0].id // empty' /tmp/dns-before.json)
          BODY=$(jq -nc --arg name "$HOSTNAME" --arg content "$TARGET" '{type:"CNAME",name:$name,content:$content,proxied:true,ttl:1}')
          if [[ -n "$EXISTING" ]]; then
            curl -fsS -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$EXISTING" \
              -H "$AUTH" -H "Content-Type: application/json" --data "$BODY" -o /tmp/dns-put.json
          else
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "$AUTH" -H "Content-Type: application/json" --data "$BODY" -o /tmp/dns-put.json
          fi
          if jq -e ".success == true" /tmp/dns-put.json >/dev/null 2>&1; then
            echo "dns_cname=${HOSTNAME}->${TARGET}"
          else
            cat /tmp/dns-put.json || true
            echo "dns_cname=manual_required"
          fi

      - name: Verify public health when listener is up
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            code=$(curl -sS -o /tmp/miami-health.json -w "%{http_code}" "https://youtube-upload-miami.chicagoshining.com/health" || true)
            if [[ "$code" == "200" ]] && jq -e ".ok == true" /tmp/miami-health.json >/dev/null 2>&1; then
              jq . /tmp/miami-health.json
              echo "public_health=PASS"
              exit 0
            fi
            sleep 5
          done
          echo "public_health=WAITING_FOR_LOCAL_LISTENER"
          echo "Tunnel hostname is configured. Start youtube-uploader-miami on this PC (:3343) then re-run VERIFY."
