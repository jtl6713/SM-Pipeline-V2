name: Seven Home past-due Story container GET receipt audits
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seven-home-story-containers-get-20261120.yml'
permissions:
  contents: read
concurrency:
  group: seven-home-story-existing-container-read-20261120
  cancel-in-progress: false
jobs:
  read_only:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - {output_number: 3522, record_id: reco2Iix0eaXJHMGD, container_id: '17910983553575604', theme: chicago}
          - {output_number: 4928, record_id: recKFcUJ8W16Pqxrg, container_id: '17911706079575604', theme: chicago}
          - {output_number: 5208, record_id: recvNRI7DqAC3hUNa, container_id: '18127412254917943', theme: la}
          - {output_number: 5458, record_id: recOEiTqfiBNFrpAq, container_id: '18115994561139610', theme: miami}
          - {output_number: 5628, record_id: rec1Zg5eEJjQKzUDO, container_id: '18116418158139610', theme: miami}
          - {output_number: 2684, record_id: recims0qZBEA0lMnN, container_id: '18133505047783117', theme: nyc}
          - {output_number: 5039, record_id: recssYvd2nxOOqGgq, container_id: '18133360240783117', theme: nyc}
    if: github.repository == 'jtl6713/SM-Pipeline-V2'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - name: Inspect exact Home past-due Story container by authenticated Meta GET only
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ig5-readonly.py <<'PY'
          """Exact one-container read-only GET; fail closed."""
          import os,json,requests
          from datetime import datetime,timezone
          os.environ["PORT"]="3350"
          from config import load_settings
          from airtable.client import AirtableClient
          from airtable.constants import PLATFORM_OUTPUTS_TABLE
          from item4.settings import PipelineSettings
          from ap1_ig.graph import load_instagram_graph_settings
          from publish.destinations import resolve_publish_theme
          n=__NUMBER__;rid="__RECORD__";cid="__CONTAINER__";theme="__THEME__"
          def out(**data):
           print("IG5_RESULT="+json.dumps(dict(output_id=n,container_id=cid,read_only=True,**data)),flush=True)
          stage="settings"
          try:
           s=load_settings()
           if not (s.get("studio_write_source")=="supabase" and s.get("studio_runner_output_read_source")=="supabase" and s.get("studio_runner_content_read_source")=="supabase" and s.get("supabase_url") and s.get("supabase_service_role_key")):
            out(status="blocked",reason="supabase_authority");raise SystemExit
           stage="record"
           c=AirtableClient(s);r=c.get_record(PLATFORM_OUTPUTS_TABLE,rid);f=r.get("fields") or {}
           if r.get("id")!=rid or str(f.get("Output_ID"))!=str(n) or str(f.get("IG_Story_Container_ID") or "")!=cid:
            out(status="blocked",reason="wrong_identity");raise SystemExit
           if (f.get("Platform")!="Instagram" or f.get("Platform_Output_Type")!="Instagram Story" or f.get("Review_Status")!="Approved" or
               f.get("Output_Status")!="Approved for Publishing" or f.get("Publish_Status")!="Ready to Publish" or
               f.get("Render_Status")!="Rendered" or f.get("IG_Story_Status")!="Publishing" or
               f.get("Do_Not_Publish") or f.get("Test_Run_ID") or f.get("Published_At") or
               f.get("Platform_Post_URL") or f.get("IG_Story_Post_ID") or f.get("Platform_Post_ID") or f.get("Platform_Media_ID")):
            out(status="blocked",reason="state_not_safe_for_probe");raise SystemExit
           if "AP1-IGS-POLL" not in str(f.get("Studio_Publish_Dispatch_Note") or "") or f.get("Publish_Error_Stage"):
            out(status="blocked",reason="unexpected_story_poll_checkpoint");raise SystemExit
           retry=f.get("Publish_Next_Retry_At")
           if retry:
            when=datetime.fromisoformat(str(retry).replace("Z","+00:00"))
            if when.tzinfo is None:when=when.replace(tzinfo=timezone.utc)
            if when>datetime.now(timezone.utc):
             out(status="blocked",reason="cooldown");raise SystemExit
           stage="profile"
           if resolve_publish_theme(output=r,client=c)!=theme:
            out(status="blocked",reason="account_scope");raise SystemExit
           p=load_instagram_graph_settings(PipelineSettings(c),r,client=c)
           if not (p.get("token") and p.get("ig_user_id") and p.get("version","").startswith("v")):
            out(status="blocked",reason="missing_provider_credentials");raise SystemExit
           stage="graph_get"
           resp=requests.get("https://graph.facebook.com/"+p["version"]+"/"+cid,params={"fields":"status_code,status"},headers={"Authorization":"Bearer "+p["token"]},timeout=24,allow_redirects=False)
           try:b=resp.json()
           except ValueError:b={}
           if not isinstance(b,dict):b={}
           err=b.get("error") if isinstance(b.get("error"),dict) else {}
           state=str(b.get("status_code") or "").upper()
           if state not in {"FINISHED","IN_PROGRESS","PUBLISHED","ERROR","EXPIRED"}:state="UNKNOWN"
           ec=err.get("code")
           out(status="checked",provider_http=resp.status_code,container_status=state,provider_error_code=ec if type(ec) is int else None,provider_error_transient=err.get("is_transient") is True,provider_action="GET_only")
          except SystemExit:pass
          except Exception as e:out(status="blocked",reason="diagnostic_exception",failure_stage=stage,failure_class=type(e).__name__)
          PY
          cat > /tmp/ig5-readonly.ps1 <<'PS'
          $ErrorActionPreference = "Stop"
          $health = Invoke-RestMethod -Method GET -Uri "http://127.0.0.1:3350/health" -TimeoutSec 15
          if ($health.ok -ne $true -or $health.version -ne "2026-11-20-ig-story-graph-limit-cooldown-v1" -or
              $health.studio_write_source -ne "supabase" -or
              $health.studio_runner_output_read_source -ne "supabase" -or
              $health.studio_runner_content_read_source -ne "supabase" -or
              $health.airtable_activity.any_read -ne $false -or $health.airtable_activity.any_write -ne $false) {
            throw "IG5 preflight failed: trusted Supabase runner not healthy"
          }
          $root = Join-Path (Get-Location) "Services\pipeline-runner\service"
          if (-not (Test-Path $root)) { throw "IG5 runner source unavailable" }
          if (-not (Test-Path (Join-Path $root "config.py"))) { throw "IG5 runner config.py unavailable" }
          Write-Output "IG5_STAGE=runner_root_verified"
          $env:PYTHONPATH = $root
          $python = Get-Command python -ErrorAction SilentlyContinue
          if (-not $python) { throw "IG5 Python unavailable" }
          $probePath = Join-Path $env:TEMP ("ig5-readonly-"+[Guid]::NewGuid().ToString("N")+".py")
          $probe = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String("__PYBASE64__"))
          [IO.File]::WriteAllText($probePath,$probe)
          try {
            Push-Location $root
            # Explicitly add the real runner source directory to sys.path even
            # when the temporary script lives elsewhere on the Windows host.
            Write-Output "IG5_STAGE=python_invoked"
            & $python.Source -c 'import os,sys,runpy;sys.path.insert(0,os.getcwd());runpy.run_path(sys.argv[1])' $probePath
            Write-Output ("IG5_STAGE=python_exit_code_"+$LASTEXITCODE)
            if ($LASTEXITCODE -ne 0) { throw "IG5 read-only Python diagnostic failed" }
          } finally {
            Pop-Location
            Remove-Item $probePath -Force -ErrorAction SilentlyContinue
          }
          PS
          sed -i -e 's/__NUMBER__/${{ matrix.output_number }}/g' -e 's/__RECORD__/${{ matrix.record_id }}/g' -e 's/__CONTAINER__/${{ matrix.container_id }}/g' -e 's/__THEME__/${{ matrix.theme }}/g' /tmp/ig5-readonly.py
          python3 -m py_compile /tmp/ig5-readonly.py
          python3 - <<'PY'
          import base64,json
          from pathlib import Path
          payload=base64.b64encode(Path("/tmp/ig5-readonly.py").read_bytes()).decode()
          script=Path("/tmp/ig5-readonly.ps1").read_text().replace("__PYBASE64__",payload)
          Path("/tmp/ig5-request.json").write_text(json.dumps({"command":script,"confirm":True}))
          print("one_exact_provider_get_scope_built=true")
          PY
          BASE="https://ops.chicagoshining.com"
          selected=""
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C"; do
            if [[ -z "$candidate" ]]; then continue; fi
            http=$(curl -sS --max-time 20 -o /tmp/ig5-catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$http" == "200" ]] && jq -e '.ok==true' /tmp/ig5-catalog.json >/dev/null 2>&1; then selected="$candidate"; break; fi
          done
          test -n "$selected"
          http=$(curl -sS --max-time 25 -o /tmp/ig5-submit.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $selected" -H "Content-Type: application/json" --data-binary @/tmp/ig5-request.json || true)
          if [[ "$http" != "200" && "$http" != "202" ]]; then echo "ig5_submit_http=$http"; exit 3; fi
          job=$(jq -r '.job.id // .jobId // empty' /tmp/ig5-submit.json)
          test -n "$job"
          echo "ig5_shell_job_accepted=true"
          for i in $(seq 1 40); do
            code=$(curl -sS --max-time 20 -o /tmp/ig5-job.json -w '%{http_code}' -H "Authorization: Bearer $selected" "$BASE/api/jobs/$job" || true)
            if [[ "$code" == "200" ]]; then
              state=$(jq -r '.job.status // empty' /tmp/ig5-job.json)
              if [[ "$state" == "ok" ]]; then
                jq -r '.job.log // ""' /tmp/ig5-job.json | grep '^IG5_RESULT=' | tail -1 | sed 's/^IG5_RESULT=//' > /tmp/ig5-result.json
                jq -e --argjson id '${{ matrix.output_number }}' --arg cid '${{ matrix.container_id }}' '.output_id==$id and .container_id==$cid and .read_only==true and (.status=="checked" or .status=="blocked")' /tmp/ig5-result.json >/dev/null
                jq -c '{output_id,container_id,status,reason,failure_stage,failure_class,provider_http,container_status,provider_error_code,provider_error_transient,provider_action}' /tmp/ig5-result.json
                exit 0
              fi
              if [[ "$state" == "failed" ]]; then
                echo "ig5_shell_probe_failed_no_provider_verification"
                # Print only specific known safe exception categories; never raw Ops output.
                jq -r '.job.log // ""' /tmp/ig5-job.json | grep -E 'IG5_STAGE=|IG5_RESULT=|IG5 |IG5_|ModuleNotFoundError|SyntaxError|NameError|ImportError|FileNotFoundError|Traceback|ParserError|CommandNotFoundException' | tail -20 || true
                exit 4
              fi
            fi
            sleep 3
          done
          echo "ig5_shell_probe_status_unavailable"
          exit 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-story-${{ matrix.output_number }}-provider-get-evidence
          path: /tmp/ig5-result.json
          retention-days: 14
