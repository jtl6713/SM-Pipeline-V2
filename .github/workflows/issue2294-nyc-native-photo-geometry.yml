name: Issue 2294 NYC Original Native Photo Geometry Read Only
on:
  pull_request:
    paths:
      - 'repair/manifests/issue2294-nyc-ferry-original-source-16-20261122.json'
      - 'repair/scripts/issue2294-nyc-native-photo-http-readonly.py'
      - '.github/workflows/issue2294-nyc-native-photo-geometry.yml'
  push:
    branches: [main]
    paths:
      - 'repair/manifests/issue2294-nyc-ferry-original-source-16-20261122.json'
      - 'repair/scripts/issue2294-nyc-native-photo-http-readonly.py'
      - '.github/workflows/issue2294-nyc-native-photo-geometry.yml'
permissions:
  contents: read
concurrency:
  group: issue2294-nyc-photo-geometry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  media-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source manifest and prohibit database/provider writes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile repair/scripts/issue2294-nyc-native-photo-http-readonly.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path("repair/scripts/issue2294-nyc-native-photo-http-readonly.py")
          t=p.read_text()
          for forbidden in ("SUPABASE_SERVICE_ROLE_KEY", "AIRTABLE_PAT",
                            "requests.post(", "requests.patch(", "psycopg2", "subprocess.run",
                            "supabaseRest(", "create_records(", "/media_publish"):
              assert forbidden not in t, forbidden
          import json
          m=json.loads(Path("repair/manifests/issue2294-nyc-ferry-original-source-16-20261122.json").read_text())
          assert m["read_only"] is True and m["publication_authorized"] is False
          assert len(m["outputs"])==2 and sum(len(x["images"]) for x in m["outputs"])==16
          assert all(x["release_to_publish_authorized"] is False for x in m["outputs"])
          print("issue2294_original_16_media_audit_static=PASS")
          PY
      - name: Install pinned Pillow for true media header and geometry checks
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: GET all sixteen source images and classify source geometry without modifying anything
        run: python repair/scripts/issue2294-nyc-native-photo-http-readonly.py
      - name: Assert source-only evidence retains all safety prohibitions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("/tmp/issue2294-nyc-native-photo-public-geometry.json").read_text())
          assert r["read_only"] is True and r["db_writes"]==r["provider_writes"]==0
          assert r["publishing_authorized"] is False and r["auto_approve"] is False
          assert r["totals"]["image_attempts"]==16 and len(r["images"])==16
          assert sorted(r["outputs"])==["10992","10993"]
          assert all(v["publishing_authorized"] is False for v in r["outputs"].values())
          print("issue2294_media_geometry_readonly=PASS")
          PY
      - name: Save the exact sixteen-source HTTP/size/ratio/sha evidence for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue2294-nyc-16-public-source-image-geometry
          path: /tmp/issue2294-nyc-native-photo-public-geometry.json
          retention-days: 30
          if-no-files-found: warn
