name: Run Autonomous Produce Once
on:
  push:
    branches: [main]
    paths:
      - deploy/one-time-run-autonomous-now.txt
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BRIDGE: chicagoshining-autonomous-once-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build temporary authenticated Studio service bridge
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(python -c 'import secrets;print(secrets.token_urlsafe(32))')
          printf '%s' "$TOKEN" >/tmp/run-token.txt
          cat >/tmp/bridge.js <<EOF
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== "/$TOKEN" || request.method !== "POST") return new Response("Not found", {status:404});
              const response = await env.STUDIO_API.fetch(new Request("https://studio.chicagoshining.com/api/operations/ideas/run-autonomous", {
                method: "POST",
                headers: {
                  "Cf-Access-Authenticated-User-Email": "joseph.t.logan@gmail.com",
                  "Origin": "https://studio.chicagoshining.com",
                  "Content-Type": "application/json",
                  "Accept": "application/json"
                },
                body: '{"force":true}'
              }));
              return new Response(await response.text(), {status: response.status, headers: {"Content-Type":"application/json","Cache-Control":"no-store"}});
            }
          };
          EOF
          cat >/tmp/bridge-meta.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"chicagoshining-studio-api"}]}
          EOF
          node --check /tmp/bridge.js
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -X PUT "$ROOT/workers/scripts/$BRIDGE/content" -H "$AUTH" -F 'metadata=@/tmp/bridge-meta.json;type=application/json' -F 'worker.js=@/tmp/bridge.js;type=application/javascript+module;filename=worker.js' -o /tmp/bridge-upload.json
          jq -e '.success == true' /tmp/bridge-upload.json >/dev/null
          curl -fsS -X POST "$ROOT/workers/scripts/$BRIDGE/subdomain" -H "$AUTH" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' -o /tmp/bridge-enable.json
          jq -e '.success == true' /tmp/bridge-enable.json >/dev/null
      - name: Wait for Studio API Worker version (avoid racing deploy)
        shell: bash
        run: |
          set -euo pipefail
          # Same push often deploys Worker + triggers this once job in parallel.
          # Poll the live Worker /health via a short-lived service bridge until
          # the version from this commit is serving (or 3 minutes elapse).
          WANT=$(python - <<'PY'
          import pathlib,re
          text=pathlib.Path("apps/studio-api/worker.js").read_text()
          m=re.search(r'version:\s*"([^"]+)"', text)
          print(m.group(1) if m else "")
          PY
          )
          echo "want_worker_version=$WANT"
          test -n "$WANT"
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          HEALTH_TOKEN=$(python -c 'import secrets;print(secrets.token_urlsafe(24))')
          HEALTH_BRIDGE="chicagoshining-autonomous-health-${{ github.run_id }}"
          cat >/tmp/health-bridge.js <<EOF
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== "/$HEALTH_TOKEN" || request.method !== "GET") return new Response("Not found", {status:404});
              const response = await env.STUDIO_API.fetch(new Request("https://studio.chicagoshining.com/api/health", {
                headers: {
                  "Cf-Access-Authenticated-User-Email": "joseph.t.logan@gmail.com",
                  "Origin": "https://studio.chicagoshining.com",
                  "Accept": "application/json"
                }
              }));
              return new Response(await response.text(), {status: response.status, headers: {"Content-Type":"application/json","Cache-Control":"no-store"}});
            }
          };
          EOF
          cat >/tmp/health-bridge-meta.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"chicagoshining-studio-api"}]}
          EOF
          curl -fsS -X PUT "$ROOT/workers/scripts/$HEALTH_BRIDGE/content" -H "$AUTH" -F 'metadata=@/tmp/health-bridge-meta.json;type=application/json' -F 'worker.js=@/tmp/health-bridge.js;type=application/javascript+module;filename=worker.js' -o /tmp/health-upload.json
          jq -e '.success == true' /tmp/health-upload.json >/dev/null
          curl -fsS -X POST "$ROOT/workers/scripts/$HEALTH_BRIDGE/subdomain" -H "$AUTH" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' >/tmp/health-enable.json
          curl -fsS "$ROOT/workers/subdomain" -H "$AUTH" -o /tmp/subdomain.json
          SUB=$(jq -er '.result.subdomain' /tmp/subdomain.json)
          HEALTH_URL="https://$HEALTH_BRIDGE.$SUB.workers.dev/$HEALTH_TOKEN"
          ok=0
          for i in $(seq 1 36); do
            body=$(curl -sS --max-time 20 "$HEALTH_URL" || true)
            ver=$(printf '%s' "$body" | jq -er '.version // empty' 2>/dev/null || true)
            echo "health_attempt=$i version=${ver:-none}"
            if [[ "$ver" == "$WANT" ]]; then ok=1; break; fi
            sleep 5
          done
          curl -sS -X DELETE "$ROOT/workers/scripts/$HEALTH_BRIDGE" -H "$AUTH" >/dev/null || true
          if [[ "$ok" != "1" ]]; then
            echo "worker_version_wait=FAIL want=$WANT"
            exit 1
          fi
          echo "worker_version_wait=PASS want=$WANT"
      - name: Force-run autonomous produce (photo-ready queue)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS "$ROOT/workers/subdomain" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/subdomain.json
          SUB=$(jq -er '.result.subdomain' /tmp/subdomain.json)
          TOKEN=$(cat /tmp/run-token.txt)
          URL="https://$BRIDGE.$SUB.workers.dev/$TOKEN"
          for i in 1 2 3 4 5; do
            code=$(curl -sS --max-time 120 -X POST -o /tmp/run-result.json -w '%{http_code}' "$URL" || true)
            echo "run_http=$code attempt=$i"
            jq -c '{ok,status,skipped,skip_reason,chicago_date,slot,idea_id,production_request_id,resumed,error,message}' /tmp/run-result.json || cat /tmp/run-result.json
            if [[ "$code" == "200" || "$code" == "202" ]] && jq -e '.ok == true' /tmp/run-result.json >/dev/null; then
              echo "autonomous_force_run=PASS"
              exit 0
            fi
            sleep 4
          done
          echo "autonomous_force_run=FAIL"
          exit 1
      - name: Remove temporary service bridge
        if: always()
        shell: bash
        run: |
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl -sS -X DELETE "$ROOT/workers/scripts/$BRIDGE" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null || true
