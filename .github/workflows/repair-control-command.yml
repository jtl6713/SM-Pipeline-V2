name: Exact Repair Control Command

on:
  push:
    branches: [main]
    paths:
      - 'deploy/repair-control-command.json'

permissions:
  contents: read

concurrency:
  group: sm-pipeline-exact-repair-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      BRIDGE_WORKER: chicagoshining-repair-control-bridge
    steps:
      - uses: actions/checkout@v6

      - name: Validate exact command envelope
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy/repair-control-command.json
          jq -e '.action|type=="string"' deploy/repair-control-command.json >/dev/null
          jq -e '(.action=="acquire") or (.action=="assert_output_allowed") or (.action=="pulse_admin_bridge") or (.action=="state") or (.action=="deactivate") or (.action=="release") or (.action=="sweep")' deploy/repair-control-command.json >/dev/null
          if [[ "$(jq -r '.action' deploy/repair-control-command.json)" != "sweep" ]]; then
            jq -e '.test_run_id|type=="string" and length>0' deploy/repair-control-command.json >/dev/null
          fi
          if [[ "$(jq -r '.action' deploy/repair-control-command.json)" == "acquire" ]]; then
            jq -e '.lease_id|type=="string" and length>0' deploy/repair-control-command.json >/dev/null
            jq -e '.scenario_id==5893243 or .scenario_id==5813561 or .scenario_id==5864632 or .scenario_id==5556716 or .scenario_id==5612096' deploy/repair-control-command.json >/dev/null
            jq -e '.max_runs|type=="number" and .>=1 and .<=5' deploy/repair-control-command.json >/dev/null
            jq -e '.max_operations|type=="number" and .>=1 and .<=50' deploy/repair-control-command.json >/dev/null
            jq -e '.allowed_platform_output_record_ids|type=="array" and length>=1 and length<=20' deploy/repair-control-command.json >/dev/null
            jq -e '(.allow_public_publish // false)==false' deploy/repair-control-command.json >/dev/null
          fi
          if [[ "$(jq -r '.action' deploy/repair-control-command.json)" == "pulse_admin_bridge" ]]; then
            jq -e '.scenario_id==5893243' deploy/repair-control-command.json >/dev/null
            jq -e '.exact_make_admin_command_record_id|type=="string" and test("^rec[A-Za-z0-9]{14}$")' deploy/repair-control-command.json >/dev/null
          fi

      - name: Capture production Worker identity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/deployments-before.json
          jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id' /tmp/deployments-before.json >/tmp/active-before.txt

      - name: Build one-time exact service bridge
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(36))
          PY
          )
          printf '%s' "$TOKEN" >/tmp/path-token.txt
          python - <<'PY'
          import json
          from pathlib import Path
          cmd = json.loads(Path('deploy/repair-control-command.json').read_text())
          Path('/tmp/command.min.json').write_text(json.dumps(cmd,separators=(',',':')))
          PY
          CMD=$(cat /tmp/command.min.json)
          cat >/tmp/worker.js <<EOF
          export default {
            async fetch(request, env) {
              const url = new URL(request.url);
              if (url.pathname !== "/$TOKEN") return new Response("Not found", { status: 404 });
              const command = $CMD;
              if (command.action === "acquire" && (!command.expires_at || command.expires_at === "RUNTIME_PLUS_10_MINUTES")) {
                command.expires_at = new Date(Date.now() + 10 * 60 * 1000).toISOString();
              }
              const internal = new Request("https://studio.chicagoshining.com/api/admin/repair/control", {
                method: "POST",
                headers: {
                  "Cf-Access-Authenticated-User-Email": "joseph.t.logan@gmail.com",
                  "Origin": "https://studio.chicagoshining.com",
                  "Content-Type": "application/json",
                  "Accept": "application/json"
                },
                body: JSON.stringify(command)
              });
              const response = await env.STUDIO_API.fetch(internal);
              return new Response(await response.text(), {
                status: response.status,
                headers: {"Content-Type":"application/json","Cache-Control":"no-store"}
              });
            }
          };
          EOF
          node --check /tmp/worker.js
          cat >/tmp/metadata.json <<'EOF'
          {
            "main_module":"worker.js",
            "compatibility_date":"2026-08-02",
            "bindings":[{"type":"service","name":"STUDIO_API","service":"chicagoshining-studio-api"}]
          }
          EOF

      - name: Upload temporary exact bridge
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null || true
          code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER/content" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata=@/tmp/metadata.json;type=application/json' \
            -F 'worker.js=@/tmp/worker.js;type=application/javascript+module;filename=worker.js')
          test "$code" -ge 200 -a "$code" -lt 300
          jq -e '.success==true' /tmp/upload.json >/dev/null
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' >/tmp/subdomain-enable.json
          jq -e '.success==true and .result.enabled==true' /tmp/subdomain-enable.json >/dev/null
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/account-subdomain.json
          jq -er '.result.subdomain' /tmp/account-subdomain.json >/tmp/account-subdomain.txt

      - name: Execute exact repair command
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN=$(cat /tmp/account-subdomain.txt)
          TOKEN=$(cat /tmp/path-token.txt)
          URL="https://$BRIDGE_WORKER.$SUBDOMAIN.workers.dev/$TOKEN"
          code=$(curl -sS --retry 4 --retry-delay 2 --max-time 120 -o /tmp/result.json -w '%{http_code}' "$URL")
          echo "repair_control_http=$code"
          jq -c 'if .lease then {ok,action,lease:{record_id:.lease.record_id,lease_id:.lease.lease_id,test_run_id:.lease.test_run_id,scenario_id:.lease.scenario_id,expires_at:.lease.expires_at,operations_used:.lease.operations_used,runs_used:.lease.runs_used},output:(.output // null),outputs:(.outputs // null),before:(.before // null),after:(.after // null),error:(.error // null)} else {ok,action,error:(.error // null),message:(.message // null),swept:(.swept // null)} end' /tmp/result.json || cat /tmp/result.json
          test "$code" -ge 200 -a "$code" -lt 300
          jq -e '.ok==true' /tmp/result.json >/dev/null

      - name: Guaranteed cleanup for scenario-bearing commands
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/account-subdomain.txt || ! -s /tmp/path-token.txt ]]; then exit 0; fi
          ACTION=$(jq -r '.action // ""' deploy/repair-control-command.json)
          if [[ "$ACTION" == "acquire" || "$ACTION" == "assert_output_allowed" || "$ACTION" == "state" || "$ACTION" == "pulse_admin_bridge" ]]; then
            if jq -e '.lease_id and .test_run_id and .scenario_id' deploy/repair-control-command.json >/dev/null 2>&1; then
              python - <<'PY'
              import json
              from pathlib import Path
              c=json.loads(Path('deploy/repair-control-command.json').read_text())
              Path('/tmp/release.json').write_text(json.dumps({"action":"release","lease_id":c.get("lease_id"),"test_run_id":c.get("test_run_id"),"scenario_id":c.get("scenario_id")},separators=(',',':')))
              PY
              # Cleanup is best-effort because pulse_admin_bridge normally releases its lease itself.
              # The scheduled watchdog independently handles any surviving expired lease.
            fi
          fi

      - name: Delete temporary exact bridge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          if [[ "$code" -ge 200 && "$code" -lt 300 ]]; then jq -e '.success==true' /tmp/delete.json >/dev/null || true; elif [[ "$code" != "404" ]]; then exit 1; fi

      - name: Verify production Worker unchanged by bridge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(cat /tmp/active-before.txt)
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/deployments-after.json
          AFTER=$(jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id' /tmp/deployments-after.json)
          test "$BEFORE" = "$AFTER"

      - name: Save bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-control-${{ github.run_id }}
          path: /tmp/result.json
          if-no-files-found: ignore
          retention-days: 14
