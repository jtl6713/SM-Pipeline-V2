name: Exception Recovery Production Verification
on:
  pull_request:
    paths:
      - 'repair/scripts/exception-recovery-production-audit.mjs'
      - '.github/workflows/exception-recovery-production-verification.yml'
  push:
    branches: [main]
    paths:
      - 'repair/scripts/exception-recovery-production-audit.mjs'
      - '.github/workflows/exception-recovery-production-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exception-recovery-production-verification
  cancel-in-progress: false
jobs:
  contract:
    name: Audit script syntax and safe scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check repair/scripts/exception-recovery-production-audit.mjs
      - run: node --test apps/studio-api/exception-recovery-conversation.test.mjs apps/studio-api/exception-recovery-home-parity.test.mjs apps/studio-api/exception-recovery-autonomous.test.mjs
      - name: Refuse any provider writes or broad output mutations in verification script
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const src=fs.readFileSync('repair/scripts/exception-recovery-production-audit.mjs','utf8');
          if(!src.includes("const message='Please verify the existing Instagram receipt"))throw Error('persistence-only conversation scope missing');
          if(!src.includes("request.method==='POST' && url.pathname==="))throw Error('one exact conversation POST guard missing');
          if(!src.includes("report.counts="))throw Error('counts audit missing');
          for(const forbidden of ["'/api/outputs/publish'","'/api/admin/exception-recovery/'+", 'method:"PATCH"', 'method:"DELETE"']) {
            if(src.includes(forbidden))throw Error('unsafe verification mutation: '+forbidden);
          }
          console.log('scope=conversation-only-write provider=GET output_mutations=none');
          NODE
  live:
    name: Authenticated deployed conversation, provider and counts audit
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed Worker using temporary service-binding bridge
        run: node repair/scripts/exception-recovery-production-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exception-recovery-production-audit
          path: /tmp/exception-recovery-production-audit.json
          retention-days: 14

      - name: Report sanitized production evidence on tracking PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          let r={error:'audit_artifact_unavailable'};
          try{r=JSON.parse(fs.readFileSync('/tmp/exception-recovery-production-audit.json','utf8'));}catch{}
          const clean={
            at:r.completed_at||null,error:r.error||null,
            worker_health:r.worker_health||null,rollout_stage:r.rollout_stage||null,
            action_flag:r.flags?.EXCEPTION_RECOVERY_ACTIONS_ENABLED||'unknown',
            unauthenticated_history_status:r.unauthenticated_history_status,
            unauthenticated_conversation_status:r.unauthenticated_conversation_status,
            administrator_preflight:r.administrator_preflight||null,
            conversation:r.conversation||null,conversation_post_status:r.conversation_post_status||null,
            original_youtube_verified:r.verified===1,
            youtube_candidates:r.youtube_candidates||null,
            instagram_canary:r.instagram_canary||null,
            instagram_canary_status:r.instagram_canary_status||null,
            counts:r.counts||null,
            bridge_deleted:r.temporary_bridge_deleted===true,
          };
          const body='## Production exception verification (automated; no provider writes)\n\n' +
            '```json\n'+JSON.stringify(clean,null,2).slice(0,15500)+'\n```\n' +
            '\nIf evidence is absent, the production canary has NOT been proven. Provider verification and full Home generation match are separate gates.';
          const url='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/issues/1157/comments';
          fetch(url,{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,
            Accept:'application/vnd.github+json','Content-Type':'application/json'},
            body:JSON.stringify({body})}).then(async v=>{
              if(!v.ok)throw Error('github_evidence_comment_http_'+v.status);
              console.log('sanitized_production_evidence_comment=posted');
            }).catch(e=>{console.error(String(e));process.exitCode=1});
          NODE
