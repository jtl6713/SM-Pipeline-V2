name: Publication Recovery Read-Only Canary
on:
  pull_request:
    paths:
      - 'apps/studio-api/exception-recovery-*'
      - 'repair/scripts/publication-recovery-readonly-canary.mjs'
      - '.github/workflows/publication-recovery-readonly-canary.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [Deploy Studio API Worker Production, Deploy Studio Pages Production]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: publication-recovery-readonly-canary
  cancel-in-progress: false
jobs:
  contract:
    name: Canary contract tests (not live provider proof)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check repair/scripts/publication-recovery-readonly-canary.mjs
      - run: node --test apps/studio-api/exception-recovery-profile-chain.test.mjs apps/studio-api/exception-recovery-autonomous.test.mjs
  live:
    name: Deployed authenticated GET-only provider verification
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify through existing production service binding; no exported Airtable credentials
        run: node repair/scripts/publication-recovery-readonly-canary.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-recovery-readonly-canary
          path: /tmp/publication-recovery-canary.json
          retention-days: 30
