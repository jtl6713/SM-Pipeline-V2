name: Incident 2670 Windows PowerShell Parser PR Gate
on:
  pull_request:
    paths:
      - '.github/scripts/incident-2670-windows-runtime-preflight.ps1'
      - '.github/scripts/incident-2670-external-root-windows-denial.ps1'
      - '.github/workflows/incident-2670-windows-preflight-parser-ci.yml'
permissions:
  contents: read
jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Parse protected Windows diagnostic without execution
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.github/scripts/incident-2670-windows-runtime-preflight.ps1'),
            [ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){
            $errors | ForEach-Object { Write-Output ("incident2670_parser_line="+$_.Extent.StartLineNumber) }
            throw 'incident2670_windows_preflight_syntax_failed'
          }
          Write-Output 'incident2670_windows_preflight_parser=PASS'
      - name: Parse nonpublishing Windows root-lease canary
        shell: pwsh
        run: |
          $tokens=$null;$errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.github/scripts/incident-2670-external-root-windows-denial.ps1'),
            [ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){
            $errors | ForEach-Object { Write-Output ("incident2670_lease_parser_line="+$_.Extent.StartLineNumber) }
            throw 'incident2670_windows_lease_syntax_failed'
          }
          Write-Output 'incident2670_windows_lease_parser=PASS'
