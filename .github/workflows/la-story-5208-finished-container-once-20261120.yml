name: Single guarded LA Instagram Story 5208 finished-container publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/la-story-5208-finished-container-once-20261120.yml'

permissions:
  contents: read

concurrency:
  group: la-story-5208-existing-container-once-20261120
  cancel-in-progress: false

jobs:
  exact-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - name: Authenticate with existing approved Ops API
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C"; do
            test -n "$candidate" || continue
            code=$(curl -sS --max-time 20 -o /tmp/ops-catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" 'https://ops.chicagoshining.com/api/catalog' || true)
            if [[ "$code" == '200' ]] && jq -e '.ok==true' /tmp/ops-catalog.json >/dev/null; then
              echo "::add-mask::$candidate"
              echo "RECOVERY_OPS_TOKEN=$candidate" >>"$GITHUB_ENV"
              exit 0
            fi
          done
          echo "Approved Ops credential unavailable"; exit 1
      - name: Resume one existing Meta FINISHED LA Story container; no media create
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/meta-la5208.ps1 <<'PS'
          $ErrorActionPreference="Stop"
          $record="recvNRI7DqAC3hUNa";$container="18127412254917943"
          $health=Invoke-RestMethod -Uri "http://127.0.0.1:3350/health" -TimeoutSec 20
          if($health.ok -ne $true -or $health.version -ne "2026-11-20-ig-story-graph-limit-cooldown-v1" -or $health.studio_write_source -ne "supabase" -or $health.studio_runner_output_read_source -ne "supabase" -or $health.studio_runner_content_read_source -ne "supabase" -or $health.supabase_pipeline_writes -ne $true -or $health.airtable_activity.any_read -ne $false -or $health.airtable_activity.any_write -ne $false){throw "la5208_supabase_runner_gate_failed"}
          $envfile=Join-Path (Get-Location) "Services\pipeline-runner\service\.env"
          if(-not(Test-Path $envfile)){throw "la5208_service_env_missing"}
          function ReadSetting([string]$key){
           $line=@(Get-Content $envfile|Where-Object{$_ -match ("^\s*"+[regex]::Escape($key)+"\s*=")})|Select-Object -Last 1
           if(-not $line){throw "la5208_missing_auth"}
           return ([string]$line -split '=',2)[1].Trim().Trim('"',"'")
          }
          $secret=ReadSetting "PIPELINE_RUNNER_SHARED_SECRET"
          $dburl=ReadSetting "SUPABASE_URL";$dbkey=ReadSetting "SUPABASE_SERVICE_ROLE_KEY"
          if(-not $secret -or -not $dburl -or -not $dbkey){throw "la5208_missing_service_credentials"}
          $h=@{apikey=$dbkey;Authorization=("Bearer "+$dbkey)}
          $url=$dburl.TrimEnd("/")+"/rest/v1/platform_outputs?airtable_record_id=eq."+$record+"&select=airtable_record_id,output_number,content_item_id,platform,platform_output_type,review_status,output_status,publish_status,render_status,publish_method,auto_publish_enabled,do_not_publish,test_run_id,published_at,platform_post_url,publish_next_retry_at,publish_asset_url,error_messages"
          function AssertRecord{
           $rows=@(Invoke-RestMethod -Uri $url -Headers $h -TimeoutSec 20)
           if($rows.Count -ne 1){throw "la5208_ambiguous_record"}
           $o=$rows[0]
           if($o.output_number -ne 5208 -or $o.content_item_id -ne "74c7847d-9695-46de-9e9b-77e0b508955f" -or $o.platform -ne "Instagram" -or $o.platform_output_type -ne "Instagram Story" -or
           $o.review_status -ne "Approved" -or $o.output_status -ne "Approved for Publishing" -or $o.publish_status -ne "Ready to Publish" -or $o.render_status -ne "Rendered" -or
           $o.publish_method -ne "Automated" -or $o.auto_publish_enabled -ne $true -or $o.do_not_publish -ne $false -or $o.test_run_id -or $o.published_at -or $o.platform_post_url -or $o.publish_next_retry_at -or
           $o.error_messages.IG_Story_Status -ne "Publishing" -or $o.error_messages.IG_Story_Container_ID -ne $container -or $o.error_messages.IG_Story_Post_ID -or
           $o.error_messages.Platform_Post_ID -or $o.error_messages.Platform_Media_ID -or $o.error_messages.Publish_Locked_By -or $o.error_messages.Publish_Error_Stage -or $o.error_messages.Replace_Transaction_ID -or
           $o.error_messages.Studio_Render_Review_Hold_Active -or $o.error_messages.Studio_Render_Review_Hold_ID -or $o.error_messages.Studio_Review_Hold_ID){throw "la5208_exact_preflight_failed"}
           if([string]$o.error_messages.Studio_Publish_Dispatch_Note -notmatch "AP1-IGS-POLL"){throw "la5208_unexpected_dispatch_history"}
           $lock=[DateTimeOffset]::Parse([string]$o.error_messages.IG_Story_Locked_At)
           if(([DateTimeOffset]::UtcNow-$lock).TotalHours -ge 23.9){throw "la5208_container_near_expiry"}
           $surl=$dburl.TrimEnd("/")+"/rest/v1/platform_outputs?content_item_id=eq.74c7847d-9695-46de-9e9b-77e0b508955f&platform_output_type=eq.Instagram%20Story&select=output_number,published_at,platform_post_url,error_messages"
           $siblings=@(Invoke-RestMethod -Uri $surl -Headers $h -TimeoutSec 20)
           foreach($s in $siblings){
            if($s.output_number -ne 5208 -and ($s.published_at -or $s.platform_post_url -or $s.error_messages.IG_Story_Post_ID -or $s.error_messages.Platform_Post_ID)){throw "la5208_possible_duplicate_story"}
           }
           return $o
          }
          $o=AssertRecord
          $headers=@{"X-Pipeline-Secret"=$secret}
          function CallPoll([bool]$dry){
           $body=@{output_record_id=$record;extra=@{dry_run=$dry;wait=$false}}|ConvertTo-Json -Depth 4 -Compress
           return Invoke-RestMethod -Uri "http://127.0.0.1:3350/stages/ap1_igs_poll" -Method POST -Headers $headers -Body $body -ContentType "application/json" -TimeoutSec 130
          }
          $dry=CallPoll $true
          if($dry.status -ne "ok" -or $dry.details.run.dry_run -ne $true -or $dry.details.run.eligibility_reason){throw "la5208_native_poll_dry_refused"}
          Write-Output "la5208_native_poll_dry=PASS"
          $o=AssertRecord
          $actual=CallPoll $false
          Write-Output ("la5208_poll_status="+[string]$actual.status)
          Write-Output ("la5208_poll_reason="+[string]$actual.details.run.reason)
          $receipt=@(Invoke-RestMethod -Uri $url -Headers $h -TimeoutSec 20)
          if($receipt.Count -ne 1){throw "la5208_receipt_lookup_failed"}
          $x=$receipt[0]
          $id=[string]$actual.details.run.post_id
          if($actual.status -eq "ok" -and $id -and $x.publish_status -eq "Published" -and $x.published_at -and $x.error_messages.IG_Story_Container_ID -eq $container -and $x.error_messages.IG_Story_Post_ID -eq $id -and $x.error_messages.Platform_Post_ID -eq $id){
           Write-Output ("la5208_meta_post_id="+$id)
           Write-Output "la5208_published_receipt=PASS"
           exit 0
          }
          Write-Output "la5208_published_receipt=NOT_CONFIRMED_NO_RETRY"
          throw "la5208_no_verified_publication_receipt"
          PS
          python3 - <<'PY'
          import pathlib,json
          pathlib.Path('/tmp/meta-la5208.json').write_text(json.dumps({
             "command":pathlib.Path('/tmp/meta-la5208.ps1').read_text(),
             "confirm":True}))
          PY
          code=$(curl -sS --max-time 30 -o /tmp/ops-start.json -w '%{http_code}' \
             -X POST 'https://ops.chicagoshining.com/api/shell' \
             -H "Authorization: Bearer $RECOVERY_OPS_TOKEN" -H 'Content-Type: application/json' \
             --data-binary @/tmp/meta-la5208.json || true)
          if [[ "$code" != 200 && "$code" != 202 ]]; then echo "Ops rejected exact canary: http=$code"; exit 2; fi
          job=$(jq -er '.job.id // .jobId' /tmp/ops-start.json)
          for n in $(seq 1 150); do
            curl -fsS --max-time 30 -H "Authorization: Bearer $RECOVERY_OPS_TOKEN" \
                "https://ops.chicagoshining.com/api/jobs/$job" -o /tmp/ops-status.json
            status=$(jq -r '.job.status // empty' /tmp/ops-status.json)
            if [[ "$status" == ok ]]; then
              jq -r '.job.log // ""' /tmp/ops-status.json | grep '^la5208_' || true
              exit 0
            elif [[ "$status" == failed ]]; then
              jq -r '.job.log // ""' /tmp/ops-status.json | tail -25
              exit 3
            fi
            sleep 4
          done
          echo "Ops exact canary not confirmed"; exit 4
