name: P1 2340 Three Recovered Stories Publish FINISHED
on:
  workflow_run:
    workflows: ["P1 2340 Three Recovered Stories First Containers"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p1-2340-three-story-poll-batch-once
  cancel-in-progress: false
jobs:
  original-story-finished-poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact protected PowerShell script syntax
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'repair/scripts/p1-2340-three-stories-publish-once.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0){$errors|ForEach-Object{Write-Error $_.Message};exit 1}
          Write-Output 'P1_2340_STORY_BATCH_PARSER_OK'
      - name: Reject unbounded provider retries or secrets output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          code=Path('repair/scripts/p1-2340-three-stories-publish-once.ps1').read_text()
          assert "P1_IG_STORY_BATCH_POLL=" in code
          assert "stages/ap1_igs_poll" in code and "quality_agent_recovery_events" in code
          assert "status -ne 'FINISHED'" in code and "one-native-story-publish-v1" in code
          assert code.count(" -Method Post ")==2 and code.count(" -Method Patch ")==0
          for forbidden in ['Invoke-WebRequest -Method Post','-Method Delete','Write-Output $token','Write-Host $token']:
              assert forbidden not in code
          print('p1_2340_exact_eight_per_record_immutable_fences')
          PY
      - name: Authenticate approved Ops without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C"; do
            test -n "$candidate" || continue
            code=$(curl -sS --max-time 20 -o /tmp/p1-2340-ops-catalog.json -w '%{http_code}' \
              -H "Authorization: Bearer $candidate" 'https://ops.chicagoshining.com/api/catalog' || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/p1-2340-ops-catalog.json >/dev/null; then
              echo "::add-mask::$candidate"
              echo "P1_2340_OPS_TOKEN=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'Approved Ops credential unavailable'; exit 1
      - name: GET original FINISHED containers and publish once per unique fenced ID
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json
          pathlib.Path('/tmp/p1-2340-story-poll-request.json').write_text(json.dumps({
            'command':pathlib.Path('repair/scripts/p1-2340-three-stories-publish-once.ps1').read_text(),
            'confirm':True}))
          PY
          code=$(curl -sS --max-time 30 -o /tmp/p1-2340-story-poll-start.json -w '%{http_code}' \
            -X POST 'https://ops.chicagoshining.com/api/shell' \
            -H "Authorization: Bearer $P1_2340_OPS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/p1-2340-story-poll-request.json || true)
          if [[ "$code" != 200 && "$code" != 202 ]]; then
            echo "Ops rejected bounded story-poll request ($code), no replay"; exit 2
          fi
          job=$(jq -er '.job.id // .jobId' /tmp/p1-2340-story-poll-start.json)
          for n in $(seq 1 200); do
            curl -fsS --max-time 30 -H "Authorization: Bearer $P1_2340_OPS_TOKEN" \
              "https://ops.chicagoshining.com/api/jobs/$job" -o /tmp/p1-2340-story-poll-status.json
            status=$(jq -r '.job.status // empty' /tmp/p1-2340-story-poll-status.json)
            if [[ "$status" == ok ]]; then
              jq -r '.job.log // ""' /tmp/p1-2340-story-poll-status.json | grep '^P1_IG_STORY_BATCH_POLL=' | tail -1 | sed 's/^P1_IG_STORY_BATCH_POLL=//' > /tmp/p1-2340-story-poll-report.json
              jq -e '.targets==3 and (.results|length)==3 and .provider_publish_stage_calls<=8' /tmp/p1-2340-story-poll-report.json >/dev/null
              jq -c '{targets,published,provider_publish_stage_calls,results}' /tmp/p1-2340-story-poll-report.json
              exit 0
            elif [[ "$status" == failed ]]; then
              echo 'Original bounded task failed; never replay a fenced provider attempt'
              jq -r '.job.log // ""' /tmp/p1-2340-story-poll-status.json | tail -n 12 \
                | sed -E 's#[A-Za-z0-9_./+=-]{28,}#[redacted]#g; s#https?://[^[:space:]]+#[url]#g' \
                | grep -Ev 'Authorization:|Bearer |Setting_Value|SUPABASE_SERVICE_ROLE_KEY|ACCESS_TOKEN' | tail -n 8 || true
              exit 3
            fi
            sleep 4
          done
          echo 'Bounded original batch still uncertain; do not replay'; exit 4
      - name: Persist sanitized per-output results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-2340-story-poll-exact-eight
          path: /tmp/p1-2340-story-poll-report.json
          retention-days: 30
          if-no-files-found: warn
