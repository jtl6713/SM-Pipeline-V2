name: Issue 3159 second Story pair validation only
on:
  pull_request:
    branches: [main]
    paths:
      - 'repair/scripts/issue3159-story11234-pair-probe.py'
      - '.github/workflows/issue3159-story11234-pair-probe.yml'
permissions:
  contents: read
  statuses: write
concurrency:
  group: chicagoshining-studio-api-production-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m py_compile repair/scripts/issue3159-story11234-pair-probe.py
          python -m pip install -q pillow
          python - <<'PY'
          import ast
          from pathlib import Path
          text=Path('repair/scripts/issue3159-story11234-pair-probe.py').read_text()
          ast.parse(text)
          assert text.count('requests.post(')==1 and '/jobs/studio-produce/resume' in text
          assert 'marker.open("x"' in text and 'before_owner_gate' in text
          for forbidden in ('requests.patch','requests.put','requests.delete','/publish-now','force-release','confirm_half_open_progress','DELETE FROM','UPDATE producer_jobs'):
              assert forbidden not in text
          tree=ast.parse(text)
          fn=next(x for x in tree.body if isinstance(x,ast.FunctionDef) and x.name=='observe_governor')
          ns={}
          exec(compile(ast.Module(body=[fn],type_ignores=[]),'monitor','exec'),ns)
          check=ns['observe_governor']
          idle=dict(ok=True,enabled=True,active_jobs=0,active_worker_heavy=0,combined_heavy_active=0,queued_jobs=0,paused_jobs=18,max_jobs=2,worker_heavy_limit=1,database_circuit_phase='closed',admission_paused=False,smv1_maintenance_active=False)
          assert not check(idle)[1]
          assert not check(dict(idle,active_jobs=1,active_worker_heavy=1,combined_heavy_active=2,queued_jobs=3))[1]
          assert not check(dict(idle,active_jobs=2,combined_heavy_active=2))[1]
          assert 'capacity_exceeded' in check(dict(idle,active_jobs=2,active_worker_heavy=1,combined_heavy_active=3))[1]
          assert 'counter_mismatch' in check(dict(idle,active_jobs=1))[1]
          assert 'circuit_not_closed' in check(dict(idle,database_circuit_phase='open'))[1]
          assert 'counter_contract' in check(dict(idle,active_jobs=None))[1]
          assert 'capacity_config' in check(dict(idle,max_jobs=3))[1]
          print('STORY11234_READONLY_MONITOR_PASS')
          PY
