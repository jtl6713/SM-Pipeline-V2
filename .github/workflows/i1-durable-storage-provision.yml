name: Provision I1 Durable Runner Storage (no activation)
on:
  push:
    branches: [main]
    paths:
      - "deploy/i1-durable-runner-release.txt"
permissions:
  contents: read
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      OPS_TOKEN: ${{ secrets.OPS_DASHBOARD_TOKEN }}
    steps:
      - name: Create persistent Windows ProgramData I1 directory and test SQLite
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPS_TOKEN"
          python - <<'PY' > /tmp/i1-volume.json
          import json
          ps=r'''$ErrorActionPreference='Stop'
          $dir=Join-Path $env:ProgramData 'ChicagoShining\pipeline-runner'
          if (-not (Test-Path $env:ProgramData)) { throw 'programdata_missing' }
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          if (-not (Test-Path $dir -PathType Container)) { throw 'i1_storage_dir_missing' }
          $probe=Join-Path $dir ('i1-sqlite-probe-'+[guid]::NewGuid().ToString('N')+'.sqlite3')
          try {
            $env:I1_SQLITE_PROBE=$probe
            python -c 'import os,sqlite3; p=os.environ["I1_SQLITE_PROBE"]; c=sqlite3.connect(p); c.execute("CREATE TABLE evidence(x INTEGER PRIMARY KEY)"); c.execute("INSERT INTO evidence VALUES(7)"); c.commit(); c.close(); c=sqlite3.connect(p); assert c.execute("SELECT x FROM evidence").fetchone()[0]==7; c.close()'
            if ($LASTEXITCODE -ne 0) { throw 'sqlite_persistent_roundtrip_failed' }
            Write-Output 'i1_storage_directory=provisioned'
            Write-Output 'i1_sqlite_roundtrip=PASS'
            Write-Output 'i1_durable_activation=NOT_ENABLED'
          }
          finally {
            Remove-Item -Path $probe -Force -ErrorAction SilentlyContinue
            Remove-Item -Path ($probe+'-wal') -Force -ErrorAction SilentlyContinue
            Remove-Item -Path ($probe+'-shm') -Force -ErrorAction SilentlyContinue
            Remove-Item Env:I1_SQLITE_PROBE -ErrorAction SilentlyContinue
          }'''
          print(json.dumps({"command":ps,"confirm":True}))
          PY
          code=$(curl -sS --max-time 20 -w '%{http_code}' -o /tmp/provision-start.json \
            -X POST https://ops.chicagoshining.com/api/shell \
            -H "Authorization: Bearer $OPS_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/i1-volume.json)
          if [[ "$code" != "202" && "$code" != "200" ]]; then echo "i1_provision_rejected=$code"; exit 1; fi
          job=$(jq -r '.job.id // .jobId // empty' /tmp/provision-start.json)
          test -n "$job"
          for n in {1..30}; do
            curl -sS --max-time 20 -H "Authorization: Bearer $OPS_TOKEN" \
              "https://ops.chicagoshining.com/api/jobs/$job" -o /tmp/provision-result.json
            status=$(jq -r '.job.status // empty' /tmp/provision-result.json)
            if [[ "$status" == "ok" ]]; then
              jq -r '.job.log // ""' /tmp/provision-result.json | grep '^i1_' || true
              jq -e '.job.log | contains("i1_sqlite_roundtrip=PASS")' /tmp/provision-result.json >/dev/null
              exit 0
            fi
            if [[ "$status" == "failed" ]]; then
              echo "i1_provision_failed"
              jq -r '.job.log // ""' /tmp/provision-result.json | tail -12 | cut -c1-200
              exit 1
            fi
            sleep 3
          done
          echo "i1_provision_timed_out"; exit 1
