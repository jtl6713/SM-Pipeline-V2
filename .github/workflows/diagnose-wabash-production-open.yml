name: Diagnose Wabash Production Open

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wabash-production-open.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      BRIDGE_WORKER: chicagoshining-wabash-diag-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Capture active Worker version and build diagnostic bridge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$ROOT/workers/scripts/$TARGET_WORKER/deployments" -H "$AUTH" -o /tmp/deployments.json
          ACTIVE=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/deployments.json)
          printf '%s' "$ACTIVE" >/tmp/active.txt
          TOKEN=$(python - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )
          printf '%s' "$TOKEN" >/tmp/token.txt
          cat >/tmp/bridge.js <<EOF
          const OWNER="joseph.t.logan@gmail.com";
          async function callApi(env,path,method="GET",body=null){
            const headers=new Headers({
              "Cf-Access-Authenticated-User-Email":OWNER,
              "Origin":"https://studio.chicagoshining.com",
              "Accept":"application/json"
            });
            let payload;
            if(method!=="GET"){
              headers.set("Content-Type","application/json");
              payload=JSON.stringify(body||{});
            }
            const r=await env.STUDIO_API.fetch(new Request("https://studio.chicagoshining.com"+path,{method,headers,body:payload}));
            const text=await r.text();
            let parsed;
            try{ parsed=text?JSON.parse(text):null; }catch{ parsed={raw:text.slice(0,1000)}; }
            return {path,method,status:r.status,ok:r.ok,body:parsed};
          }
          function slim(result){
            const body=result&&result.body||{};
            const record=body.record||null;
            return {
              path:result.path,method:result.method,status:result.status,ok:result.ok,
              error:body.error||body.message||null,
              record:record?{
                id:record.id||null,
                production_request_id:record.production_request_id||null,
                idea_record_id:record.idea_record_id||null,
                idea_title:record.idea_title||null,
                status:record.status||null,
                studio_master_asset_count:record.studio_master_asset_count??null,
                studio_master_asset_status:record.studio_master_asset_status||null,
                studio_item4_state:record.studio_item4_state||null
              }:null
            };
          }
          export default {
            async fetch(request,env){
              const u=new URL(request.url);
              if(u.pathname==="/$TOKEN/ready") return Response.json({ok:true});
              if(u.pathname!=="/$TOKEN/execute") return new Response("Not found",{status:404});
              const steps=[];
              const ideas=await callApi(env,"/api/ideas?limit=100");
              steps.push({
                path:ideas.path,method:ideas.method,status:ideas.status,ok:ideas.ok,
                error:ideas.body?.error||ideas.body?.message||null,
                count:Array.isArray(ideas.body?.records)?ideas.body.records.length:null
              });
              if(!ideas.ok) return Response.json({ok:false,stage:"ideas",steps});
              const idea=(ideas.body.records||[]).find(x=>String(x.title||"").trim().toLowerCase()==="wabash mural spring")
                || (ideas.body.records||[]).find(x=>String(x.title||"").toLowerCase().includes("wabash")&&String(x.title||"").toLowerCase().includes("mural"));
              if(!idea) return Response.json({ok:false,stage:"find_idea",steps,error:"Wabash Mural Spring not found"});
              const summary={
                id:idea.id,
                candidate_id:idea.candidate_id||null,
                title:idea.title||null,
                status:idea.status||null,
                photo_wait_status:idea.photo_wait_status||null,
                production_request_id:idea.production_request_id||null,
                production_request_links:idea.production_request_links||[]
              };
              let direct=null;
              if(idea.production_request_id){
                direct=await callApi(env,"/api/production-requests/"+encodeURIComponent(idea.production_request_id)+"?fields=light");
                steps.push(slim(direct));
              }
              const list=await callApi(env,"/api/production-requests?limit=100");
              steps.push({
                path:list.path,method:list.method,status:list.status,ok:list.ok,
                error:list.body?.error||list.body?.message||null,
                count:Array.isArray(list.body?.records)?list.body.records.length:null,
                matching:(list.body?.records||[]).filter(r=>r.idea_record_id===idea.id||((r.idea_candidate_links||[]).includes(idea.id))).map(r=>({
                  id:r.id,production_request_id:r.production_request_id,status:r.status,
                  studio_master_asset_count:r.studio_master_asset_count??null,
                  studio_master_asset_status:r.studio_master_asset_status||null
                }))
              });
              const post=await callApi(env,"/api/ideas/"+encodeURIComponent(idea.id)+"/production-request","POST",{});
              steps.push(slim(post));
              return Response.json({ok:steps.every(x=>x.ok!==false),idea:summary,steps},{
                headers:{"Cache-Control":"no-store"}
              });
            }
          };
          EOF
          node --check /tmp/bridge.js
          cat >/tmp/metadata.json <<EOF
          {"main_module":"bridge.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF

      - name: Upload temporary diagnostic bridge
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X PUT "$ROOT/workers/scripts/$BRIDGE_WORKER/content" -H "$AUTH"             -F 'metadata=@/tmp/metadata.json;type=application/json'             -F 'bridge.js=@/tmp/bridge.js;type=application/javascript+module;filename=bridge.js')
          test "$code" -ge 200 -a "$code" -lt 300
          jq -e '.success==true' /tmp/upload.json >/dev/null
          curl -fsS -X POST "$ROOT/workers/scripts/$BRIDGE_WORKER/subdomain" -H "$AUTH" -H 'Content-Type: application/json'             --data '{"enabled":true,"previews_enabled":false}' -o /tmp/sub.json
          jq -e '.success==true and .result.enabled==true' /tmp/sub.json >/dev/null
          curl -fsS "$ROOT/workers/subdomain" -H "$AUTH" -o /tmp/account-subdomain.json
          jq -er '.result.subdomain' /tmp/account-subdomain.json >/tmp/subdomain

      - name: Tail production Worker and reproduce Wabash Open Production
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE=$(cat /tmp/active.txt)
          SUB=$(cat /tmp/subdomain)
          TOKEN=$(cat /tmp/token.txt)
          URL="https://$BRIDGE_WORKER.$SUB.workers.dev/$TOKEN"
          for i in $(seq 1 20); do
            code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' "$URL/ready" || true)
            [[ "$code" == 200 ]] && break
            sleep 1
          done
          test "$code" = 200
          : >/tmp/tail.log
          timeout 45s npx --yes wrangler@4 tail "$TARGET_WORKER" --format json --version-id "$ACTIVE" >/tmp/tail.log 2>&1 &
          TAILPID=$!
          sleep 7
          code=$(curl -sS --max-time 120 -o /tmp/result.json -w '%{http_code}' "$URL/execute" || true)
          echo "bridge_http=$code"
          test "$code" = 200
          echo '---WABASH_RESULT---'
          jq . /tmp/result.json
          sleep 7
          kill "$TAILPID" 2>/dev/null || true
          wait "$TAILPID" 2>/dev/null || true
          echo '---TAIL_ERRORS_AND_LOGS---'
          cat /tmp/tail.log
          test -s /tmp/result.json

      - name: Delete diagnostic bridge
        if: always()
        shell: bash
        run: |
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$ROOT/workers/scripts/$BRIDGE_WORKER" -H "$AUTH" >/dev/null || true
