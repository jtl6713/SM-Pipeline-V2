name: Patch Item6 Replace Controller

on:
  push:
    branches: [main]
    paths: ['deploy/patch-item6-replace-controller.txt']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Add exact-output replacement transaction controller
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/studio-api/worker.js')
          s=p.read_text()
          block=Path('repair/patches/item6-replace-controller.js.txt').read_text().rstrip()+"\n\n"
          begin='// ITEM6_REPLACE_TRANSACTION_V1_BEGIN'
          end='// ITEM6_REPLACE_TRANSACTION_V1_END'
          if begin in s or end in s:
              raise SystemExit('Item 6 replacement controller marker already present')
          anchor='async function repairControlAction(env, input) {'
          if s.count(anchor)!=1:
              raise SystemExit(f'Expected one repairControlAction anchor, found {s.count(anchor)}')
          s=s.replace(anchor,block+anchor,1)
          action_anchor='  const lease = await repairFindLease(env, input);\n\n  if (action === "assert_output_allowed") {'
          if s.count(action_anchor)!=1:
              raise SystemExit(f'Expected one repair action dispatch anchor, found {s.count(action_anchor)}')
          action_repl='  const lease = await repairFindLease(env, input);\n\n  if (["replace_transaction_state", "prepare_replace_transaction", "begin_replace_transaction", "verify_replace_transaction", "rollback_replace_transaction", "complete_replace_cleanup"].includes(action)) {\n    return item6ReplaceControlAction(env, action, lease, input);\n  }\n\n  if (action === "assert_output_allowed") {'
          s=s.replace(action_anchor,action_repl,1)
          p.write_text(s)
          PY
          node --check apps/studio-api/worker.js
          git diff --check
          grep -q 'ITEM6_REPLACE_TRANSACTION_V1_BEGIN' apps/studio-api/worker.js
          grep -q 'prepare_replace_transaction' apps/studio-api/worker.js
          grep -q 'Rollback refused because replacement publication already exists' apps/studio-api/worker.js
          git config user.name 'SM Pipeline Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/studio-api/worker.js
          git commit -m 'item6: add exact-output replace transaction controller'
          git push origin HEAD:main
