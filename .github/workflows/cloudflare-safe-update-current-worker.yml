name: Safe Update Current Studio API Worker

on:
  push:
    branches: [main]
    paths:
      - 'deploy/cloudflare-safe-update-current-worker.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chicagoshining-studio-api-production
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      VERIFY_WORKER: chicagoshining-studio-current-update-verify
      WRANGLER_VERSION: 4.123.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate inputs and source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s apps/studio-api/worker.js
          test -s deploy/credential-envelope/private.pem.enc
          test -s deploy/credential-envelope/airtable_pat.ciphertext.b64
          cp apps/studio-api/worker.js /tmp/studio-worker.mjs
          node --check /tmp/studio-worker.mjs
          grep -q 'repair_make_admin_module19_v1: true' apps/studio-api/worker.js
          grep -q 'action === "repair_make_admin_module19"' apps/studio-api/worker.js

      - name: Decrypt Airtable PAT only in runner temp and validate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:CLOUDFLARE_API_TOKEN \
            -in deploy/credential-envelope/private.pem.enc \
            -out /tmp/airtable-envelope-private.pem
          base64 -d deploy/credential-envelope/airtable_pat.ciphertext.b64 >/tmp/airtable-pat.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/airtable-envelope-private.pem \
            -in /tmp/airtable-pat.enc \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256 \
            -out /tmp/airtable-pat.txt
          python - <<'PY'
          from pathlib import Path
          token=Path('/tmp/airtable-pat.txt').read_text().strip()
          if not token.startswith('pat') or len(token)<40: raise SystemExit('Airtable credential structural validation failed')
          Path('/tmp/airtable-pat.txt').write_text(token)
          PY
          code=$(curl -sS -o /tmp/airtable-probe.json -w '%{http_code}' \
            'https://api.airtable.com/v0/appe33zkZn35yirTL/tblrlPeboBthkplH0?maxRecords=1' \
            -H "Authorization: Bearer $(cat /tmp/airtable-pat.txt)")
          test "$code" = '200'

      - name: Install pinned Wrangler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/studio-current-rollout
          cd /tmp/studio-current-rollout
          npm init -y >/dev/null 2>&1
          npm install --no-save "wrangler@$WRANGLER_VERSION" >/dev/null
          test "$(./node_modules/.bin/wrangler --version | tr -d '\r\n')" = "$WRANGLER_VERSION"

      - name: Capture current 100 percent deployment and reconstruct core config
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$API/deployments" -H "$AUTH" -o /tmp/deployments-before.json
          jq -e '.success==true and (.result.deployments[0].versions|length)==1 and .result.deployments[0].versions[0].percentage==100' /tmp/deployments-before.json >/dev/null
          PREV=$(jq -er '.result.deployments[0].versions[0].version_id' /tmp/deployments-before.json)
          printf '%s' "$PREV" >/tmp/previous-version.txt
          curl -fsS "$API/versions/$PREV" -H "$AUTH" -o /tmp/previous-version.json
          python - <<'PY'
          import json
          from pathlib import Path
          core={
            'AIRTABLE_BASE_ID':'plain_text','AIRTABLE_CONTENT_TABLE_ID':'plain_text','AIRTABLE_IDEA_TABLE_ID':'plain_text',
            'AIRTABLE_MEDIA_TABLE_ID':'plain_text','AIRTABLE_MUSIC_VIEW_ID':'plain_text','AIRTABLE_OUTPUT_TABLE_ID':'plain_text',
            'AIRTABLE_PAT':'secret_text','ALLOWED_ORIGINS':'plain_text','I3_DECISION_WEBHOOK_URL':'plain_text','STUDIO_MEDIA':'r2_bucket'
          }
          result=json.loads(Path('/tmp/previous-version.json').read_text())['result']
          bindings=(result.get('resources') or {}).get('bindings') or []
          by_name={str(x.get('name')):x for x in bindings}
          missing={k:v for k,v in core.items() if str(by_name.get(k,{}).get('type'))!=v}
          if missing: raise SystemExit(f'Current active Worker missing core bindings: {missing}')
          plain=[k for k,v in core.items() if v=='plain_text']
          vars_out={k:by_name[k].get('text') for k in plain}
          if any(v is None for v in vars_out.values()): raise SystemExit('Could not recover active non-secret values')
          bucket=by_name['STUDIO_MEDIA'].get('bucket_name') or by_name['STUDIO_MEDIA'].get('bucket')
          if not bucket: raise SystemExit('Could not recover active STUDIO_MEDIA bucket identity')
          cfg={'name':'chicagoshining-studio-api','main':'worker.js','compatibility_date':'2026-08-02','workers_dev':False,'keep_vars':True,'vars':vars_out,'r2_buckets':[{'binding':'STUDIO_MEDIA','bucket_name':bucket}]}
          work=Path('/tmp/studio-current-rollout')
          (work/'wrangler.jsonc').write_text(json.dumps(cfg,indent=2))
          (work/'worker.js').write_bytes(Path('apps/studio-api/worker.js').read_bytes())
          pat=Path('/tmp/airtable-pat.txt').read_text().strip()
          Path('/tmp/secrets.json').write_text(json.dumps({'AIRTABLE_PAT':pat},separators=(',',':')))
          Path('/tmp/previous-binding-audit.json').write_text(json.dumps({'version_id':result.get('id'),'version_number':result.get('number'),'binding_count':len(bindings),'core_binding_count':len(core)},indent=2,sort_keys=True))
          PY
          chmod 600 /tmp/secrets.json

      - name: Capture versions before upload
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/studio-current-rollout
          ./node_modules/.bin/wrangler versions list --name "$TARGET_WORKER" --json >/tmp/versions-before.json

      - name: Upload source as non-live candidate
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/studio-current-rollout
          ./node_modules/.bin/wrangler versions upload --config wrangler.jsonc --keep-vars --strict \
            --secrets-file /tmp/secrets.json --message "Safe current-worker update ${GITHUB_SHA}" >/tmp/version-upload.log 2>&1
          ./node_modules/.bin/wrangler versions list --name "$TARGET_WORKER" --json >/tmp/versions-after.json
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path('/tmp/versions-before.json').read_text()); after=json.loads(Path('/tmp/versions-after.json').read_text())
          def vid(x): return str(x.get('id') or x.get('version_id') or x.get('versionId') or '')
          old={vid(x) for x in before if vid(x)}
          new=[vid(x) for x in after if vid(x) and vid(x) not in old]
          if len(new)!=1: raise SystemExit(f'Expected exactly one new version, found {len(new)}')
          Path('/tmp/new-version.txt').write_text(new[0]); print('candidate_identified=true')
          PY
          shred -u /tmp/secrets.json /tmp/airtable-pat.txt /tmp/airtable-envelope-private.pem /tmp/airtable-pat.enc 2>/dev/null || rm -f /tmp/secrets.json /tmp/airtable-pat.txt /tmp/airtable-envelope-private.pem /tmp/airtable-pat.enc
          echo "version_id=$(cat /tmp/new-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Verify candidate core bindings while production unchanged
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          NEW=$(cat /tmp/new-version.txt); PREV=$(cat /tmp/previous-version.txt)
          curl -fsS "$API/versions/$NEW" -H "$AUTH" -o /tmp/candidate-version.json
          python - <<'PY'
          import json
          from pathlib import Path
          core={'AIRTABLE_BASE_ID':'plain_text','AIRTABLE_CONTENT_TABLE_ID':'plain_text','AIRTABLE_IDEA_TABLE_ID':'plain_text','AIRTABLE_MEDIA_TABLE_ID':'plain_text','AIRTABLE_MUSIC_VIEW_ID':'plain_text','AIRTABLE_OUTPUT_TABLE_ID':'plain_text','AIRTABLE_PAT':'secret_text','ALLOWED_ORIGINS':'plain_text','I3_DECISION_WEBHOOK_URL':'plain_text','STUDIO_MEDIA':'r2_bucket'}
          r=json.loads(Path('/tmp/candidate-version.json').read_text())['result']; got={str(x.get('name')):str(x.get('type')) for x in ((r.get('resources') or {}).get('bindings') or [])}
          missing={k:v for k,v in core.items() if got.get(k)!=v}; unexpected={k:v for k,v in got.items() if k not in core and k!='ELEVENLABS_API_KEY'}
          if missing or unexpected: raise SystemExit(f'Candidate binding contract failed; missing={missing}, unexpected={unexpected}')
          Path('/tmp/candidate-binding-audit.json').write_text(json.dumps({'version_id':r.get('id'),'version_number':r.get('number'),'binding_count':len(got),'core_ok':True},indent=2,sort_keys=True))
          PY
          curl -fsS "$API/deployments" -H "$AUTH" -o /tmp/deployments-pre-split.json
          jq -e --arg prev "$PREV" '(.result.deployments[0].versions|length)==1 and .result.deployments[0].versions[0].version_id==$prev and .result.deployments[0].versions[0].percentage==100' /tmp/deployments-pre-split.json >/dev/null

      - name: Attach candidate at zero percent traffic
        id: split
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(cat /tmp/previous-version.txt); NEW=$(cat /tmp/new-version.txt)
          cd /tmp/studio-current-rollout
          ./node_modules/.bin/wrangler versions deploy "$PREV@100%" "$NEW@0%" --name "$TARGET_WORKER" --message "0-percent smoke current update" -y >/tmp/split.log 2>&1
          echo 'created=true' >> "$GITHUB_OUTPUT"

      - name: Build and upload exact-version verifier
        shell: bash
        run: |
          set -euo pipefail
          NEW=$(cat /tmp/new-version.txt)
          TOKEN=$(python - <<'PY'
          import secrets; print(secrets.token_urlsafe(32))
          PY
          ); printf '%s' "$TOKEN" >/tmp/verify-token.txt
          cat >/tmp/verify-worker.js <<EOF
          export default {async fetch(request,env){const u=new URL(request.url);if(u.pathname!=="/$TOKEN")return new Response("Not found",{status:404});const h={"Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com","Origin":"https://studio.chicagoshining.com","Accept":"application/json","Cloudflare-Workers-Version-Overrides":'$TARGET_WORKER="$NEW"'};async function c(p){const r=await env.STUDIO_API.fetch(new Request("https://studio.chicagoshining.com"+p,{headers:h}));let b={};try{b=JSON.parse(await r.text())}catch{}return{status:r.status,body:b}}const s=await c("/api/session"),x=await c("/api/health"),v=await c("/api/voices");return Response.json({session_status:s.status,authenticated:s.body?.authenticated===true,authorized:s.body?.authorized===true,health_status:x.status,health_ok:x.body?.ok===true,airtable_configured:x.body?.airtable_configured===true,repair_activation_leases_v1:x.body?.repair_activation_leases_v1===true,repair_exact_output_test_mode_v1:x.body?.repair_exact_output_test_mode_v1===true,repair_make_admin_module19_v1:x.body?.repair_make_admin_module19_v1===true,voices_status:v.status,voices_ok:v.body?.ok===true,voice_count:Array.isArray(v.body?.voices)?v.body.voices.length:0})}};
          EOF
          cat >/tmp/verify-metadata.json <<EOF
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF
          node --check /tmp/verify-worker.js
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$ROOT/workers/scripts/$VERIFY_WORKER" -H "$AUTH" >/dev/null || true
          code=$(curl -sS -o /tmp/verify-upload.json -w '%{http_code}' -X PUT "$ROOT/workers/scripts/$VERIFY_WORKER/content" -H "$AUTH" -F 'metadata=@/tmp/verify-metadata.json;type=application/json' -F 'worker.js=@/tmp/verify-worker.js;type=application/javascript+module;filename=worker.js')
          test "$code" -ge 200 -a "$code" -lt 300; jq -e '.success==true' /tmp/verify-upload.json >/dev/null
          curl -fsS -X POST "$ROOT/workers/scripts/$VERIFY_WORKER/subdomain" -H "$AUTH" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' >/dev/null
          curl -fsS "$ROOT/workers/subdomain" -H "$AUTH" -o /tmp/account-subdomain.json

      - name: Smoke test exact candidate at zero traffic
        shell: bash
        run: |
          set -euo pipefail
          SUBDOMAIN=$(jq -er '.result.subdomain' /tmp/account-subdomain.json); TOKEN=$(cat /tmp/verify-token.txt); URL="https://$VERIFY_WORKER.$SUBDOMAIN.workers.dev/$TOKEN"
          passed=false
          for i in $(seq 1 15); do
            code=$(curl -sS --max-time 60 -o /tmp/smoke.json -w '%{http_code}' "$URL" || true)
            if [[ "$code" == '200' ]] && jq -e '.session_status==200 and .authenticated==true and .authorized==true and .health_status==200 and .health_ok==true and .airtable_configured==true and .repair_activation_leases_v1==true and .repair_exact_output_test_mode_v1==true and .repair_make_admin_module19_v1==true and .voices_status==200 and .voices_ok==true and .voice_count>=2' /tmp/smoke.json >/dev/null 2>&1; then passed=true; break; fi
            sleep 2
          done
          test "$passed" = true

      - name: Promote verified candidate to 100 percent
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          NEW=$(cat /tmp/new-version.txt); cd /tmp/studio-current-rollout
          ./node_modules/.bin/wrangler versions deploy "$NEW@100%" --name "$TARGET_WORKER" --message "Promote exact MAKE-ADMIN module19 repair control" -y >/tmp/promote.log 2>&1
          echo 'promoted=true' >> "$GITHUB_OUTPUT"

      - name: Verify final active version
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"; NEW=$(cat /tmp/new-version.txt)
          ok=false
          for i in $(seq 1 10); do curl -fsS "$API/deployments" -H "$AUTH" -o /tmp/final-deployment.json; if jq -e --arg new "$NEW" '(.result.deployments[0].versions|length)==1 and .result.deployments[0].versions[0].version_id==$new and .result.deployments[0].versions[0].percentage==100' /tmp/final-deployment.json >/dev/null; then ok=true; break; fi; sleep 2; done
          test "$ok" = true

      - name: Delete verifier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          code=$(curl -sS -o /tmp/verify-delete.json -w '%{http_code}' -X DELETE "$ROOT/workers/scripts/$VERIFY_WORKER" -H "$AUTH")
          if [[ "$code" != '404' && ( "$code" -lt 200 || "$code" -ge 300 ) ]]; then exit 1; fi

      - name: Automatic rollback to captured prior version on post-split failure
        if: failure() && steps.split.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(cat /tmp/previous-version.txt); cd /tmp/studio-current-rollout
          ./node_modules/.bin/wrangler versions deploy "$PREV@100%" --name "$TARGET_WORKER" --message "Automatic rollback after current-worker safe update failure" -y >/tmp/rollback.log 2>&1

      - name: Destroy transient decrypted material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for f in /tmp/secrets.json /tmp/airtable-pat.txt /tmp/airtable-envelope-private.pem /tmp/airtable-pat.enc; do if [[ -e "$f" ]]; then shred -u "$f" 2>/dev/null || rm -f "$f"; fi; done

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-current-safe-update-${{ github.run_id }}
          path: |
            /tmp/previous-binding-audit.json
            /tmp/candidate-binding-audit.json
            /tmp/smoke.json
          if-no-files-found: ignore
          retention-days: 30
