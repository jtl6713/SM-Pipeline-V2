name: Factory Live-Record UI Staging (No Publishing)
on:
  pull_request:
    paths:
      - "apps/studio-web/factory-submit-recovery.browser.mjs"
      - "apps/studio-web/factory-real-record-ui.staging.mjs"
      - "apps/studio-web/factory-batch-canary-ui.staging.mjs"
      - "apps/studio-web/factory-batch-multi-reel-ui.staging.mjs"
      - "apps/studio-web/factory-batch-reel-story-ui.staging.mjs"
      - "apps/studio-web/factory-global-group-ui.staging.mjs"
      - "apps/studio-web/assets/factory-desk.js"
      - "apps/studio-web/assets/factory-batch-quality-0710.js"
      - "apps/studio-web/assets/factory-batch-quality-0710.css"
      - "apps/studio-web/factory-batch-quality-agent.test.mjs"
      - "apps/studio-web/index.html"
      - ".github/workflows/factory-live-record-ui-staging.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install isolated headless Chromium
        run: |
          npm install --no-save playwright@1.58.2
          # These tests launch headless Chromium only; avoid installing the unused full browser.
          npx playwright install --with-deps --only-shell chromium
      - name: Verify storage quota and AI preference races
        run: node --test apps/studio-web/storage-provider-behavior.test.mjs
      - name: Validate all canonical Factory Quality Agent signals in operator UI
        run: node --test apps/studio-web/factory-batch-quality-agent.test.mjs
      - name: Verify six-output submission survives 503, lost receipts and reload without another click
        run: node apps/studio-web/factory-submit-recovery.browser.mjs
      - name: Validate desktop mobile tablet selection, status, and Quality Agent with 20 audited output IDs
        run: node apps/studio-web/factory-real-record-ui.staging.mjs
      - name: Verify the Chicago Reel-only rollout UI and mobile state restoration
        run: node apps/studio-web/factory-batch-canary-ui.staging.mjs
      - name: Verify five Reel guarded production mode with a simulated browser and no publishing
        run: node apps/studio-web/factory-batch-multi-reel-ui.staging.mjs
      - name: Verify dormant Story v3 mixed-Reel Story selection with no publishing
        run: node apps/studio-web/factory-batch-reel-story-ui.staging.mjs
      - name: Verify independently gated global Factory selection and Activity with two profile children
        run: node apps/studio-web/factory-global-group-ui.staging.mjs
      - name: Save desktop and mobile Factory screen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factory-stage-20-real-record-ids
          path: |
            /tmp/factory-real-stage-desktop.png
            /tmp/factory-real-stage-mobile.png
            /tmp/factory-real-stage-tablet.png
          if-no-files-found: ignore
