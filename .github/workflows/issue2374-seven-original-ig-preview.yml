name: Issue 2374 Original IG Preview Gallery GET Only
on:
  pull_request:
    paths:
      - 'repair/manifests/issue2374-seven-original-ig-preview-candidates-20261121.json'
      - 'repair/scripts/issue2374-seven-original-ig-preview-getonly.py'
      - '.github/workflows/issue2374-seven-original-ig-preview.yml'
  push:
    branches: [main]
    paths:
      - 'repair/manifests/issue2374-seven-original-ig-preview-candidates-20261121.json'
      - 'repair/scripts/issue2374-seven-original-ig-preview-getonly.py'
      - '.github/workflows/issue2374-seven-original-ig-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue2374-seven-ig-preview-getonly
  cancel-in-progress: false
jobs:
  original-image-source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static source safety; candidate URL evidence never releases holds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('repair/manifests/issue2374-seven-original-ig-preview-candidates-20261121.json').read_text())
          assert manifest['output_count']==7 and manifest['original_expected_images']==32
          assert len(manifest['outputs'])==7
          assert {v['output_number'] for v in manifest['outputs']}=={10635,10678,10700,10734,10762,10813,10821}
          assert manifest['do_not_publish'] and manifest['read_only']
          assert not manifest['publish_calls_authorized']
          assert manifest['fresh_factory_approval_required']
          assert all(e['held_verified'] is True for e in manifest['outputs'])
          script=Path('repair/scripts/issue2374-seven-original-ig-preview-getonly.py').read_text()
          for required in ('EXPECTED_IMAGES = 32','MAX_BYTES = 196608','media.chicagoshining.com',
                           'max_workers=6','original_factory_slide_identity_proven',
                           'stage_ingest_authorized','original_image_identity_proven'):
              assert required in script, required
          for forbidden in ('SUPABASE_SERVICE_ROLE_KEY','api.airtable.com',
                            'graph.facebook.com','-Method Post','requests.post',
                            'platform_outputs update','media_publish','PutObject'):
              assert forbidden not in script
          print('original_ig_preview_static_gate=PASS')
          PY
      - name: Install pinned decoder
        run: python -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Check 32 real original preview image headers and 4 by 5 ratios
        run: python repair/scripts/issue2374-seven-original-ig-preview-getonly.py
      - name: Validate nonpublication report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/issue2374-seven-original-ig-preview-http-evidence.json').read_text())
          assert report['read_only'] is True
          assert report['held_outputs']==7
          assert report['candidate_http_gets']==32
          assert len(report['outputs'])==7
          assert report['output_writes']==report['provider_writes']==report['graph_media_creates']==report['publishes']==report['airtable_operations']==0
          assert report['human_review_required'] is True
          assert report['original_image_identity_proven'] is False
          assert all(not x['stage_ingest_authorized'] and x['fresh_factory_approval_required'] for x in report['outputs'])
          print('original_ig_preview_verified_images=',report['real_image_headers'],
                'four_by_five_images=',report['valid_4x5_images'],
                'complete_candidate_folders=',report['valid_full_sequences'])
          PY
      - name: Retain original source image inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue2374-seven-original-ig-preview-http
          path: /tmp/issue2374-seven-original-ig-preview-http-evidence.json
          retention-days: 30
          if-no-files-found: warn
