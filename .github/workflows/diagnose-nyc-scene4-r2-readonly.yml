name: NYC Scene 4 ElevenLabs R2 Receipt (Read Only)

on:
  push:
    branches: [fix/2401-scene-video-accept-state-refresh]
    paths:
      - '.github/workflows/diagnose-nyc-scene4-r2-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/fix/2401-scene-video-accept-state-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect exact R2 video receipt and object metadata (no mutations)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          python - <<'PY'
          import os, json, urllib.request, urllib.error, urllib.parse
          from datetime import datetime, timezone
          BASE = "https://api.cloudflare.com/client/v4/accounts/" + os.environ["CLOUDFLARE_ACCOUNT_ID"]
          AUTH = {"Authorization":"Bearer " + os.environ["CLOUDFLARE_API_TOKEN"],
                  "Accept":"application/json","User-Agent":"ChicagoShining-Readonly-2401/1.0"}
          def call(path):
              req=urllib.request.Request(BASE + path, headers=AUTH, method="GET")
              with urllib.request.urlopen(req, timeout=25) as resp:
                  return json.load(resp)
          def result(path):
              answer=call(path)
              if answer.get("success") is not True: raise ValueError("Cloudflare API reported non-success")
              return answer.get("result")
          script="chicagoshining-studio-api"
          deployments=result("/workers/scripts/"+script+"/deployments")["deployments"]
          live=max(deployments[0]["versions"],key=lambda v:v.get("percentage",0))["version_id"]
          info=result("/workers/scripts/"+script+"/versions/"+live)
          bindings=(info.get("resources") or {}).get("bindings") or []
          r2=[b for b in bindings if b.get("name")=="STUDIO_MEDIA" and b.get("type")=="r2_bucket"]
          if len(r2)!=1: raise SystemExit("read_only_r2_binding=missing_or_ambiguous")
          bucket=str(r2[0].get("bucket_name") or "").strip()
          if not bucket: raise SystemExit("read_only_r2_bucket_name=missing")
          if not all(c.isalnum() or c in "-_" for c in bucket):
              raise SystemExit("read_only_r2_bucket_name=invalid")
          prefix="studio/story-first/ai-video/v1/recJ8E51XIayb6Zy8/scene-4"
          path=f"/r2/buckets/{bucket}/objects"
          print("r2_readonly_target=NYC-idea-2387-scene-4")
          print("paid_generation_submitted=NO")
          print("r2_mutation_performed=NO")
          try:
              listed=call(path+"?"+urllib.parse.urlencode({"prefix":prefix,"per_page":15}))
          except urllib.error.HTTPError as e:
              print("r2_list_http="+str(e.code))
              raise SystemExit("R2 list access not permitted; no mutation performed")
          if not listed.get("success"):
              print("r2_list_success=false")
              raise SystemExit("R2 list denied; no mutation performed")
          objects=listed.get("result") or []
          for ending in (".json",".mp4"):
              found=[o for o in objects if o.get("key")==prefix+ending]
              print("scene4"+ending.replace(".","_")+"_exists="+str(len(found)==1).lower())
              if found:
                  o=found[0]
                  print("scene4"+ending.replace(".","_")+"_size_bytes="+str(o.get("size")))
                  print("scene4"+ending.replace(".","_")+"_modified="+str(o.get("last_modified")))
          if not any(o.get("key")==prefix+".json" for o in objects): 
              raise SystemExit("R2 job receipt missing; preserve any video object for manual review")
          try:
              job=call(path+"/"+prefix+".json")
          except urllib.error.HTTPError as e:
              print("r2_job_get_http="+str(e.code))
              raise SystemExit("Job receipt could not be read; no mutation performed")
          if not isinstance(job,dict): raise SystemExit("R2 receipt invalid shape")
          for field in ("state","idea_id","scene_number","profile_id","attempt","asset_id","approved_at","last_checked_at","accepting_started_at"):
              v=job.get(field)
              if field in ("idea_id","profile_id") and v not in ("recJ8E51XIayb6Zy8","recgtK8Z7eNADNtVy"):
                  raise SystemExit("R2 receipt identity mismatch")
              print("job_"+field+"="+str(v)[:90])
          run=str(job.get("run_id") or "")
          print("job_run_id_prefix="+run[:8])
          print("job_generation_id_present="+str(bool(job.get("generation_id"))).lower())
          print("job_error_kind="+str(job.get("error") or "")[:100])
          print("r2_inspection_read_only=PASS")
          PY
