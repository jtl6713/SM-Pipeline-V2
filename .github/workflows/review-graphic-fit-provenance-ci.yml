name: Review Graphic Fit Provenance CI
on:
  pull_request:
    paths:
      - 'apps/studio-api/rendering-review-catalog-assets.*'
      - 'apps/studio-api/rendering-review-library-prepare.*'
      - 'services/pipeline-runner/integrations/variant_service.py'
      - 'services/pipeline-runner/rendering_review/catalog_render_sources.py'
      - 'services/pipeline-runner/tests/test_rendering_review_catalog_render_sources.py'
      - 'services/pipeline-runner/tests/test_rendering_review_graphic_fit.py'
      - '.github/workflows/review-graphic-fit-provenance-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Runner test requirements
        run: pip install -r services/pipeline-runner/requirements.txt pytest
      - name: Verify exact Worker catalog and queue tests
        run: |
          node --test apps/studio-api/rendering-review-catalog-assets.test.mjs
          node --test apps/studio-api/rendering-review-library-prepare.test.mjs
      - name: Verify Runner Graphic fit and canonical crop provenance
        env:
          PYTHONPATH: services/pipeline-runner
        run: |
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_catalog_render_sources.py' -v
          python -m unittest discover -s services/pipeline-runner/tests -p 'test_rendering_review_graphic_fit.py' -v
          python -m pytest services/pipeline-runner/tests/test_variant_source.py -q
