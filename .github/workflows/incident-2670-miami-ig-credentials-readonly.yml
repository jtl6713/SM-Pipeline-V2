name: Incident 2670 - Miami Instagram credentials GET-only validation
on:
  push:
    branches: [main]
    paths: ['deploy/incident-2670-miami-ig-credential-audit.txt']
permissions:
  contents: read
concurrency:
  group: incident-2670-miami-instagram-get-only
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate GET-only PowerShell no secrets output
        shell: pwsh
        run: |
          $path=Resolve-Path '.github/scripts/incident-2670-miami-ig-credential-get.ps1'
          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if ($errors.Count) {throw 'miami_ig_script_syntax_invalid'}
          $src=[IO.File]::ReadAllText($path)
          if ($src -notmatch 'function Safe-GET' -or $src -match 'Invoke-RestMethod\s+-Method\s+(Post|Patch|Delete)') {throw 'miami_ig_script_mutating_request_prohibited'}
          Write-Output 'incident2670_miami_ig_source=GET_ONLY'
      - name: Validate live recovered runner health before remote GET
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://pipeline.chicagoshining.com/health -o /tmp/health.json
          jq -e '.ok==true and .recovery_read_only==false and
            .workload_governor_enabled==true and
            .studio_write_source=="supabase" and .supabase_pipeline_writes==true and
            .airtable_activity.any_activity==false' /tmp/health.json >/dev/null
          echo 'incident2670_miami_ig_runner_health=PASS'
      - name: Probe current Miami Instagram Graph account identity and publishing quota
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://ops.chicagoshining.com
          TOKEN=''
          for candidate in "$OPS_TOKEN_A" "$OPS_TOKEN_B" "$OPS_TOKEN_C"; do
            [[ -n "$candidate" ]] || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then TOKEN="$candidate";break;fi
          done
          [[ -n "$TOKEN" ]] || { echo 'ops_auth_unavailable';exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          script=Path('.github/scripts/incident-2670-miami-ig-credential-get.ps1').read_text(encoding='utf-8')
          Path('/tmp/miami-ig-get-only.json').write_text(json.dumps({'command':script,'confirm':True}))
          PY
          code=''
          for attempt in $(seq 1 30); do
            code=$(curl -sS --max-time 30 -o /tmp/sent.json -w '%{http_code}' -X POST "$BASE/api/shell" -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/miami-ig-get-only.json || true)
            [[ "$code" != 409 ]] && break
            sleep 3
          done
          [[ "$code" == 202 ]] || { echo "ops_readonly_get_start_http=$code";exit 1; }
          job=$(jq -r '.job.id // empty' /tmp/sent.json)
          [[ -n "$job" ]] || { echo 'ops_job_identity_unavailable';exit 1; }
          for i in $(seq 1 80); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $TOKEN" "$BASE/api/jobs/$job" -o /tmp/probe.json
            state=$(jq -r '.job.status // empty' /tmp/probe.json)
            if [[ "$state" == ok ]]; then
              jq -r '.job.log // ""' /tmp/probe.json | grep '^incident2670_miami_ig_\|^incident2670_meta_provider_writes=\|^incident2670_supabase_output_writes=' || true
              jq -e '.job.log|contains("incident2670_miami_ig_credentials=READ_ONLY_VERIFIED") and contains("incident2670_meta_provider_writes=0") and contains("incident2670_supabase_output_writes=0")' /tmp/probe.json >/dev/null
              echo 'incident2670_miami_ig_graph_get_proof=PASS'
              exit 0
            fi
            if [[ "$state" == failed ]]; then
              jq -r '.job.log // ""' /tmp/probe.json | grep -E '^incident2670_miami_ig_(identity|publish_quota_get)=(PASS|DENIED_HTTP_[0-9]{1,3})$' || true
              echo 'incident2670_miami_ig_graph_get_proof=FAILED_NO_RELEASE'
              exit 3
            fi
            sleep 3
          done
          echo 'incident2670_miami_ig_graph_get_proof=TIMEOUT_NO_RELEASE'
          exit 4
