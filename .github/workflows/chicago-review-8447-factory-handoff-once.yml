name: Chicago 8447 Factory handoff verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chicago-review-8447-factory-handoff-once.yml'
permissions:
  contents: read
jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      CF_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      JOB_SECRET: ${{ secrets.RENDERING_REVIEW_RENDER_JOB_SHARED_SECRET }}
    steps:
      - name: Verify production Worker release
        run: |
          set -euo pipefail
          test -n "$CF_ID"; test -n "$CF_SECRET"; test -n "$JOB_SECRET"
          for i in $(seq 1 60); do
            curl -fsS -H "CF-Access-Client-Id: $CF_ID" -H "CF-Access-Client-Secret: $CF_SECRET" https://studio.chicagoshining.com/api/health -o /tmp/health.json || true
            if jq -e '.ok==true and (.version|startswith("0.10.690-review-v2-factory-handoff"))' /tmp/health.json >/dev/null 2>&1; then break; fi
            sleep 5
          done
          jq -e '.ok==true and (.version|startswith("0.10.690-review-v2-factory-handoff"))' /tmp/health.json
      - name: Promote only the accepted Chicago test revision
        run: |
          set -euo pipefail
          curl -fsS --max-time 160 -X POST 'https://studio.chicagoshining.com/api/internal/rendering-review/factory-handoff' \
            -H 'Content-Type: application/json' \
            -H "X-Rendering-Review-Job-Secret: $JOB_SECRET" \
            -H "CF-Access-Client-Id: $CF_ID" \
            -H "CF-Access-Client-Secret: $CF_SECRET" \
            --data '{"output_id":"rec0uVrVeiUM6shp9","confirm":"PROMOTE-ACCEPTED-REVIEW-TO-FACTORY"}' -o /tmp/handoff.json
          jq -e '.ok==true and .ready_for_factory==true and .artifact_id=="1Qm8H_s1QJRQgsVFG7eexlwtE0xvDn7up" and .preserved_v1_file_id=="1XZ-_ARlXoP5mwILho13f81vmWQlpgTs4" and .factory_mirror_synced==true and .publication_approved==false and .scheduled==false and .published==false' /tmp/handoff.json
