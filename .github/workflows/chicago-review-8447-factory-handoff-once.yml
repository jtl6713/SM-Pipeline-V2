name: Promote accepted Chicago 8447 V2 to Factory once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/chicago-review-8447-factory-handoff-once.yml']
permissions:
  contents: read
concurrency:
  group: chicago-review-8447-factory-handoff-once
  cancel-in-progress: false
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      OPS_TOKEN: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Gate on actual live Worker 0.10.692 after production deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPS_TOKEN"
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"
          installed=false
          for attempt in $(seq 1 100); do
            status=$(curl -sS --max-time 20 -w '%{http_code}' -o /tmp/review-factory-live.json \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              'https://studio.chicagoshining.com/api/health' || true)
            if [[ "$status" == "200" ]] &&
               jq -e '.ok==true and (.version|startswith("0.10.692-render-review-factory-phase2a"))' \
                  /tmp/review-factory-live.json >/dev/null; then
              installed=true
              break
            fi
            sleep 12
          done
          test "$installed" = true
          echo 'production_worker_690_proven_live=true'
      - name: Promote accepted V2 through existing Studio output lease without publication
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/8447-factory-handoff.ps1 <<'PS1'
          $ErrorActionPreference='Stop'
          $p=Join-Path (Get-Location) 'Services\pipeline-runner\service\.env'
          if(-not (Test-Path -LiteralPath $p)){throw 'runner_env_missing'}
          $rows=@(Get-Content -LiteralPath $p)
          $matches=@($rows|Where-Object {$_ -match '^\s*RENDERING_REVIEW_RENDER_JOB_SHARED_SECRET\s*='})
          if($matches.Count -ne 1){throw 'review_handoff_secret_unavailable'}
          $secret=($matches[0] -split '=',2)[1].Trim().Trim('"').Trim([char]39)
          if($secret.Length -lt 24){throw 'review_handoff_secret_invalid'}
          $accessId=($rows|Where-Object {$_ -match '^\s*CF_ACCESS_CLIENT_ID\s*='}|Select-Object -First 1)
          $accessSecret=($rows|Where-Object {$_ -match '^\s*CF_ACCESS_CLIENT_SECRET\s*='}|Select-Object -First 1)
          if(-not $accessId -or -not $accessSecret){throw 'review_handoff_access_unavailable'}
          $clientId=($accessId -split '=',2)[1].Trim().Trim('"').Trim([char]39)
          $clientSecret=($accessSecret -split '=',2)[1].Trim().Trim('"').Trim([char]39)
          Add-Type -AssemblyName System.Net.Http
          $http=[System.Net.Http.HttpClient]::new()
          $http.Timeout=[TimeSpan]::FromSeconds(180)
          try {
            $req=[System.Net.Http.HttpRequestMessage]::new(
              [System.Net.Http.HttpMethod]::Post,
              'https://studio.chicagoshining.com/api/internal/rendering-review/factory-handoff')
            $req.Content=[System.Net.Http.StringContent]::new(
              '{"confirm":"PROMOTE-APPROVED-V2-TO-FACTORY"}',
              [System.Text.Encoding]::UTF8,'application/json')
            [void]$req.Headers.TryAddWithoutValidation('X-Rendering-Review-Job-Secret',$secret)
            [void]$req.Headers.TryAddWithoutValidation('CF-Access-Client-Id',$clientId)
            [void]$req.Headers.TryAddWithoutValidation('CF-Access-Client-Secret',$clientSecret)
            $resp=$http.SendAsync($req).GetAwaiter().GetResult()
            $body=$resp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
            $result=$null
            try {$result=$body|ConvertFrom-Json -ErrorAction Stop} catch {}
            $reason=([string]($result.code ?? $result.error ?? $result.message)) -replace '[^a-zA-Z0-9_ -]',''
            if($reason.Length -gt 120){$reason=$reason.Substring(0,120)}
            Write-Output ('factory_handoff_server_reason='+$reason)
            $assetMatch=([string]$result.artifact_id -eq '1Qm8H_s1QJRQgsVFG7eexlwtE0xvDn7up')
            $originalMatch=([string]$result.original_artifact_id -eq '1XZ-_ARlXoP5mwILho13f81vmWQlpgTs4')
            $safe=($result.scheduled -eq $false -and
              $result.approved_for_publishing -eq $false -and
              $result.public_post_created -eq $false -and
              $result.review_hold_active -eq $false)
            Write-Output ('factory_handoff_http='+[int]$resp.StatusCode+
              ' ok='+[bool]$result.ok+' ready='+[bool]$result.factory_ready+
              ' asset_match='+$assetMatch+' v1_preserved='+$originalMatch+
              ' safe='+$safe+' mirror='+[bool]$result.mirror_synced)
            if([int]$resp.StatusCode -ne 200 -or $result.ok -ne $true -or
               $result.factory_ready -ne $true -or -not $assetMatch -or
               -not $originalMatch -or -not $safe -or $result.mirror_synced -ne $true){
              throw 'factory_handoff_unverified_manual_reconciliation_required'
            }
          } finally {$http.Dispose()}
          PS1
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/8447-factory-job.json').write_text(json.dumps({
            'command':Path('/tmp/8447-factory-handoff.ps1').read_text(),
            'confirm':True
          }))
          PY
          code=$(curl -sS --max-time 25 -w '%{http_code}' -o /tmp/8447-factory-start.json \
            -X POST 'https://ops.chicagoshining.com/api/shell' \
            -H "Authorization: Bearer $OPS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/8447-factory-job.json || true)
          [[ "$code" == "200" || "$code" == "202" ]]
          id=$(jq -r '.job.id // .jobId // empty' /tmp/8447-factory-start.json); test -n "$id"
          for i in $(seq 1 100); do
            curl -fsS --max-time 20 -H "Authorization: Bearer $OPS_TOKEN" \
              "https://ops.chicagoshining.com/api/jobs/$id" -o /tmp/8447-factory-result.json
            status=$(jq -r '.job.status // empty' /tmp/8447-factory-result.json)
            if [[ "$status" == "ok" ]]; then
              jq -r '.job.log // ""' /tmp/8447-factory-result.json | grep '^factory_handoff_http='
              jq -e '(.job.log // "")|contains("ok=True") and contains("ready=True") and contains("asset_match=True") and contains("v1_preserved=True") and contains("safe=True") and contains("mirror=True")' /tmp/8447-factory-result.json >/dev/null
              exit 0
            fi
            if [[ "$status" == "failed" ]]; then
              jq -r '.job.log // ""' /tmp/8447-factory-result.json | grep '^factory_handoff_http=' || true
              echo 'factory_handoff_failed_no_unverified_success=true'
              exit 1
            fi
            sleep 4
          done
          echo 'factory_handoff_outcome_unknown_retry_only_using_same_exact_endpoint=true'
          exit 1
