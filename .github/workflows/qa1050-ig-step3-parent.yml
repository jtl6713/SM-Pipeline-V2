name: QA1050 IG Existing Children Parent Poll via Ops
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa1050-ig-step3-parent.yml'
permissions:
  contents: read
concurrency:
  group: qa1050-ig-step3-parent-only
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      OPS_TOKEN_A: ${{ secrets.OPS_DASHBOARD_TOKEN }}
      OPS_TOKEN_B: ${{ secrets.DASHBOARD_TOKEN }}
      OPS_TOKEN_C: ${{ secrets.OPS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Restrict provider stages to existing child and parent containers
        shell: bash
        run: |
          set -euo pipefail
          f='deploy/local-services/qa1050-ig-step3-parent.ps1'
          grep -Fq "'1023'='rec8okeb4bPKvt6FP'" "$f"
          grep -Fq "'1076'='recsq0S1FeqDP0pZb'" "$f"
          grep -Fq "Poll 'ap2c'" "$f"
          grep -Fq "Poll 'ap3c'" "$f"
          grep -Fq "Poll 'ap3p'" "$f"
          if grep -Ein "Poll '(ap4c|ap4r|ap5c|ap0c|ap1c)'" "$f"; then exit 8; fi
      - name: Execute two exact-ID provider stage polls through existing Ops
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ops.chicagoshining.com'
          token=''
          for candidate in "${OPS_TOKEN_A:-}" "${OPS_TOKEN_B:-}" "${OPS_TOKEN_C:-}"; do
            test -n "$candidate" || continue
            code=$(curl -sS --max-time 20 -o /tmp/catalog.json -w '%{http_code}' -H "Authorization: Bearer $candidate" "$BASE/api/catalog" || true)
            if [[ "$code" == 200 ]] && jq -e '.ok==true' /tmp/catalog.json >/dev/null 2>&1; then token="$candidate"; break; fi
          done
          test -n "$token"
          for target in 1023 1076; do
            jq -Rs --arg t "$target" '{command:("$TargetId = \u0027"+$t+"\u0027\n"+.),confirm:true}' \
              < deploy/local-services/qa1050-ig-step3-parent.ps1 > /tmp/parent.json
            code=$(curl -sS --max-time 30 -o /tmp/job-submit.json -w '%{http_code}' -X POST "$BASE/api/shell" \
              -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary @/tmp/parent.json || true)
            test "$code" == 202
            jq -e '.ok==true and .job.action=="shell" and .job.id!=null' /tmp/job-submit.json >/dev/null
            job=$(jq -r '.job.id' /tmp/job-submit.json)
            echo "Exact-ID child/parent verification submitted $target"
            terminal=''
            for i in $(seq 1 140); do
              code=$(curl -sS --max-time 20 -o /tmp/job.json -w '%{http_code}' -H "Authorization: Bearer $token" "$BASE/api/jobs/$job" || true)
              if [[ "$code" == 200 ]]; then
                status=$(jq -r '.job.status // empty' /tmp/job.json)
                if [[ "$status" == ok || "$status" == failed ]]; then
                  jq -r '.job.log // ""' /tmp/job.json | grep -E '"id"|QA1050_IG_CHILD|QA1050_IG_PARENT|Exception|error' || true
                  jq -c '{ok,job:{status:.job.status,exitCode:.job.exitCode}}' /tmp/job.json
                  test "$status" == ok
                  terminal=yes
                  break
                fi
              fi
              sleep 2
            done
            test "$terminal" == yes
          done
