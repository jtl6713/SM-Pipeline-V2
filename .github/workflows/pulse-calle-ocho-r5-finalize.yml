name: Pulse Calle Ocho R5 Finalize

# Finalize CI 395 IG Reel 1930 after Remotion completed but R5 did not stamp Drive.
on:
  push:
    branches: [cursor/vo-quiet-segment-retry-8481]
    paths:
      - 'deploy/pulse-calle-ocho-r5-finalize.txt'
      - '.github/workflows/pulse-calle-ocho-r5-finalize.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-calle-ocho-r5-finalize
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      BRIDGE_WORKER: chicagoshining-calle-ocho-r5
      OUTPUT_ID: recqEHKBc7pkPrk5k
    steps:
      - uses: actions/checkout@v6

      - name: Capture production Worker identity
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/before.json
          jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/before.json >/tmp/active-before.txt

      - name: Build bridge that pulses r5-done (async R5 / Drive upload)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, secrets
          from pathlib import Path
          token = secrets.token_urlsafe(36)
          Path("/tmp/token").write_text(token)
          # Service-binding path: returns 202 immediately; Studio waitUntil pulses Python R5.
          # creative/render/continue awaits R5 and trips CF 1101 on the bridge.
          specs = [
              {
                  "name": "r5_done",
                  "method": "POST",
                  "path": "/api/hooks/r5-done",
                  "headers": {"Authorization": "Bearer r5done_7kqp2nvm4w8x1c9h3z"},
                  "body": {
                      "jobId": "job-20261007075538-f79518c5",
                      "status": "completed",
                      "renderUrl": "https://render.chicagoshining.com/out/studio-PR-20261007053900-P2KLPF-facebook-reel.mp4",
                  },
              },
          ]
          # Proven classify one-liner + optional per-spec Authorization + try/catch.
          # Accept ROUTE and ROUTE/run (workers.dev sometimes 404s the bare path once).
          js = (
              "export default {async fetch(request,env){"
              "const u=new URL(request.url);const base=ROUTE;"
              "if(u.pathname===base+\"/ready\")return Response.json({ok:true,ready:true},{headers:{\"Cache-Control\":\"no-store\"}});"
              "if(u.pathname!==base && u.pathname!==base+\"/run\")return Response.json({ok:false,error:\"not_found\",pathname:u.pathname,base},{status:404,headers:{\"Cache-Control\":\"no-store\"}});"
              "const specs=SPECS,results=[];"
              "for(const s of specs){"
              "const m=String(s.method||\"GET\").toUpperCase();"
              "const h=new Headers({\"Cf-Access-Authenticated-User-Email\":\"joseph.t.logan@gmail.com\",\"Accept\":\"application/json\",\"Origin\":\"https://studio.chicagoshining.com\"});"
              "if(s.headers){for(const[k,v] of Object.entries(s.headers))h.set(k,v);}"
              "let b;if(m!==\"GET\"){h.set(\"Content-Type\",\"application/json\");b=JSON.stringify(s.body??{});}"
              "try{const r=await env.STUDIO_API.fetch(new Request(\"https://studio.chicagoshining.com\"+s.path,{method:m,headers:h,body:b}));"
              "const t=await r.text();let p;try{p=t?JSON.parse(t):null}catch{p={raw:t.slice(0,10000)}};"
              "results.push({name:s.name||s.path,path:s.path,method:m,status:r.status,ok:r.ok||r.status===202,body:p});}"
              "catch(e){results.push({name:s.name||s.path,path:s.path,method:m,status:0,ok:false,body:{error:String(e&&e.message||e)}});}"
              "}"
              "return Response.json({ok:results.every(x=>x.ok),results},{headers:{\"Cache-Control\":\"no-store\"}})"
              "}};"
          )
          js = js.replace("ROUTE", json.dumps("/" + token)).replace("SPECS", json.dumps(specs, separators=(",", ":")))
          Path("/tmp/worker.js").write_text(js)
          PY
          node --check /tmp/worker.js
          printf '%s' '{"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"chicagoshining-studio-api"}]}' >/tmp/meta.json
          curl -sS -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" >/dev/null || true
          code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER/content" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F 'metadata=@/tmp/meta.json;type=application/json' \
            -F 'worker.js=@/tmp/worker.js;type=application/javascript+module;filename=worker.js')
          echo "bridge_upload_http=$code"
          test "$code" -ge 200 -a "$code" -lt 300
          jq -e '.success==true' /tmp/upload.json >/dev/null
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":false}' -o /tmp/sub.json
          jq -e '.success==true and .result.enabled==true' /tmp/sub.json >/dev/null
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/account-sub.json
          jq -er '.result.subdomain' /tmp/account-sub.json >/tmp/subdomain

      - name: Pulse r5-done for Output 1931
        shell: bash
        run: |
          set -euo pipefail
          URL="https://$BRIDGE_WORKER.$(cat /tmp/subdomain).workers.dev/$(cat /tmp/token)"
          ready=000
          for i in $(seq 1 12); do
            ready=$(curl -sS --max-time 20 -o /tmp/ready.json -w '%{http_code}' "$URL/ready" || true)
            echo "bridge_ready_attempt=$i/12 http=$ready"
            [[ "$ready" == "200" ]] && break
            if [[ "$i" -eq 12 ]]; then
              echo "bridge gave up"
              exit 1
            fi
            sleep 3
          done
          code=000
          for i in $(seq 1 6); do
            code=$(curl -sS --max-time 60 -o /tmp/result.json -w '%{http_code}' \
              -H 'Content-Type: application/json' -d '{}' "$URL" || true)
            echo "bridge_pulse_attempt=$i/6 http=$code body=$(head -c 400 /tmp/result.json || true)"
            [[ "$code" == "200" ]] && break
            code=$(curl -sS --max-time 60 -o /tmp/result.json -w '%{http_code}' \
              -H 'Content-Type: application/json' -d '{}' "$URL/run" || true)
            echo "bridge_run_attempt=$i/6 http=$code body=$(head -c 400 /tmp/result.json || true)"
            [[ "$code" == "200" ]] && break
            sleep 3
          done
          echo "bridge_http=$code"
          test "$code" -eq 200
          jq '{ok,results:[.results[]|{name,path,status,ok,triggered:(.body.triggered//null),eligible:(.body.eligible//null),message:(.body.message//null)}]}' /tmp/result.json
          jq -e '.ok==true' /tmp/result.json >/dev/null

      - name: Delete temporary bridge
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$BRIDGE_WORKER" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/delete.json || true

      - name: Verify production Worker unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/after.json
          after=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/after.json)
          before=$(cat /tmp/active-before.txt)
          test "$after" = "$before"
