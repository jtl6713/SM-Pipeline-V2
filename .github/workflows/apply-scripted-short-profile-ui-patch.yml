name: Apply Scripted Short Profile UI Patch
on:
  push:
    branches: [fix/scripted-short-ui-active-profile-409]
    paths:
      - '.github/workflows/apply-scripted-short-profile-ui-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped patch to existing large UI asset
        run: |
          set -euo pipefail
          node apps/studio-web/patch-scripted-short-profile-scoping.mjs
          node --check apps/studio-web/assets/app-item4-1008.js
          node --test apps/studio-web/scripted-short-profile-routing.test.mjs
          node apps/studio-web/ui-release-contract.mjs --json
          git diff --check
      - name: Commit patched UI without changing main
        run: |
          set -euo pipefail
          git config user.name "SM Pipeline Studio UI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add apps/studio-web/assets/app-item4-1008.js apps/studio-web/index.html
          git commit -m "fix(Studio): profile-scope scripted-short proposal and acceptance in UI 0.6.743"
          git push origin HEAD:fix/scripted-short-ui-active-profile-409
