      - uses: actions/checkout@v6
      - name: Inspect current render jobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          failed=0
          JOB='job-20260927231655-053d0e2f'
          code=$(curl -sS --max-time 30 -o "evidence/$JOB.json" -w '%{http_code}' "https://render.chicagoshining.com/status/$JOB" || true)
          echo "=== $JOB http=$code ==="
          if [[ "$code" == "200" ]]; then
            jq -c '{jobId,status,createdAt,updatedAt,completedAt,exitCode,error,renderUrl,log_tail:((.logs//[])[-18:])}' "evidence/$JOB.json" || cat "evidence/$JOB.json"
