name: Cleanup Failed Remotion Jobs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-item7-render-job.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cleanup known failed Remotion jobs
        shell: bash
        run: |
          set -euo pipefail
          echo '=== health before ==='
          curl -sS --max-time 20 'https://render.chicagoshining.com/health' | jq -c .
          echo '=== cleanup job-20260927231655-053d0e2f ==='
          curl -sS --max-time 20 -X POST 'https://render.chicagoshining.com/cleanup/job-20260927231655-053d0e2f' -H 'Content-Type: application/json' --data '{}' | jq -c '{jobId,ok,removed,errors}'
          echo '=== cleanup job-20260927231537-33de0b97 ==='
