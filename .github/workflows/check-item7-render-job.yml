name: Verify Remotion Localization Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-item7-render-job.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check live Remotion localization capability
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' 'https://render.chicagoshining.com/health' || true)
          echo "http=$code"
          cat /tmp/health.json | jq . || cat /tmp/health.json
          test "$code" = 200
          jq -e '.ok==true and .privateDriveImageLocalization==true and .watermarkLocalization==true and (.version|contains("private-drive-image-localization"))' /tmp/health.json >/dev/null
          echo "remotion_private_drive_localization=PASS"
