name: Inspect Current Remotion Jobs 239

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-item7-render-job.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check health and current jobs
        shell: bash
        run: |
          set -euo pipefail
          echo '=== health ==='
          curl -sS --max-time 20 'https://render.chicagoshining.com/health' | jq -c .
          echo '=== job-20260928002112-832e29b7 ==='
          curl -sS --max-time 20 'https://render.chicagoshining.com/status/job-20260928002112-832e29b7' | jq -c '{jobId,status,createdAt,updatedAt,completedAt,exitCode,error,props:{watermarkUrl:.props.watermarkUrl,watermarkRequired:.props.watermarkRequired},log_tail:((.logs//[])[-25:])}'
          echo '=== job-20260928002100-7ae0a134 ==='
          curl -sS --max-time 20 'https://render.chicagoshining.com/status/job-20260928002100-7ae0a134' | jq -c '{jobId,status,createdAt,updatedAt,completedAt,exitCode,error,props:{watermarkUrl:.props.watermarkUrl,watermarkRequired:.props.watermarkRequired},log_tail:((.logs//[])[-25:])}'
          echo '=== job-20260928002049-db37a26d ==='
          curl -sS --max-time 20 'https://render.chicagoshining.com/status/job-20260928002049-db37a26d' | jq -c '{jobId,status,createdAt,updatedAt,completedAt,exitCode,error,props:{watermarkUrl:.props.watermarkUrl,watermarkRequired:.props.watermarkRequired},log_tail:((.logs//[])[-25:])}'
          echo '=== job-20260928001947-5598e891 ==='
          curl -sS --max-time 20 'https://render.chicagoshining.com/status/job-20260928001947-5598e891' | jq -c '{jobId,status,createdAt,updatedAt,completedAt,exitCode,error,props:{watermarkUrl:.props.watermarkUrl,watermarkRequired:.props.watermarkRequired},log_tail:((.logs//[])[-25:])}'
