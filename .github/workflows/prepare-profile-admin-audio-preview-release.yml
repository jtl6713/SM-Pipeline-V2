name: Prepare Studio Profile Admin Audio Preview UI Release
on:
  push:
    branches: [feat/profile-admin-audio-previews-20261018]
    paths:
      - '.github/workflows/prepare-profile-admin-audio-preview-release.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/profile-admin-audio-previews-20261018
          persist-credentials: true
      - name: Version HTML, app BUILD_ID and all regression expectations
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old = '0.6.720-single-profile-prompts'
          new = '0.6.721-profile-audio-previews'
          html = Path('apps/studio-web/index.html')
          app = Path('apps/studio-web/assets/app-item4-1008.js')
          a = html.read_text(encoding='utf-8')
          b = app.read_text(encoding='utf-8')
          if a.count(old) < 20 or ('item4-' + old) not in b or 'UI build 0.6.720' not in a:
              raise SystemExit('Unexpected Studio release baseline; refusing drift')
          html.write_text(a.replace(old, new).replace('UI build 0.6.720', 'UI build 0.6.721'), encoding='utf-8')
          app.write_text(b.replace('item4-' + old, 'item4-' + new), encoding='utf-8')
          count = 0
          for path in Path('apps/studio-web').rglob('*.test.mjs'):
              before = path.read_text(encoding='utf-8')
              after = before.replace(old, new)
              after = after.replace(old.replace('.', chr(92) + '.'), new.replace('.', chr(92) + '.'))
              after = after.replace('0.6.720', '0.6.721')
              after = after.replace('0' + chr(92) + '.6' + chr(92) + '.720', '0' + chr(92) + '.6' + chr(92) + '.721')
              if before != after:
                  path.write_text(after, encoding='utf-8')
                  count += 1
          print('Release updated: UI 0.6.721, updated test modules=', count)
          if count < 10:
              raise SystemExit('Expected broad existing UI release assertions; refusing partial bump')
          PY
          node apps/studio-web/ui-release-contract.mjs
          node --test apps/studio-web/ui-release-contract.test.mjs apps/studio-web/operations-profile-audio-preview.test.mjs apps/studio-web/profile-admin-creative.test.mjs apps/studio-web/factory-desk.test.mjs
      - name: Commit release update on PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u apps/studio-web
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Release UI 0.6.721: preview voice and autonomous music"
          git push origin HEAD:feat/profile-admin-audio-previews-20261018
