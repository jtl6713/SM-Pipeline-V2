name: Archive and Prune Audited Legacy Branches 2026-10-20

on:
  push:
    branches: [main]
    paths: ['deploy/branch-prune-20261020.txt']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: smv2-branch-prune-20261020
  cancel-in-progress: false

jobs:
  archive-and-prune:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Verify pinned inventory, archive unique heads, then prune
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, urllib.error, urllib.parse, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          manifest = json.loads(pathlib.Path("docs/maintenance/branch-prune-20261020.json").read_text())
          if repo != "jtl6713/SM-Pipeline-V2" or manifest["repo"] != repo:
              raise SystemExit("Repository mismatch; refusing branch cleanup")
          entries = manifest["candidates"]
          keep = {row["branch"] for row in manifest["keep"]}
          names = [row["branch"] for row in entries]
          if len(entries) != 25 or len(set(names)) != 25 or "main" in names or keep.intersection(names):
              raise SystemExit("Pinned inventory count/keep-branch guard failed")
          if len(keep) != 3:
              raise SystemExit("Unexpected number of protected open PR branches")
          headers = {"Authorization": "Bearer " + token,
                     "Accept": "application/vnd.github+json",
                     "Content-Type": "application/json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          def api(path, method="GET", data=None):
              payload = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request("https://api.github.com/repos/" + repo + "/" + path,
                                           headers=headers, method=method, data=payload)
              with urllib.request.urlopen(req, timeout=40) as r:
                  raw = r.read().decode("utf-8")
                  return json.loads(raw) if raw.strip() else {}
          open_prs = api("pulls?state=open&per_page=100")
          open_heads = {p["head"]["ref"] for p in open_prs
                        if (p["head"].get("repo") or {}).get("full_name") == repo}
          if not keep.issubset(open_heads):
              raise SystemExit("Known active PRs changed; refusing cleanup")
          available = []
          archived = []
          # Full preflight before any branch delete. No stale SHA or newly opened PR may pass.
          for row in entries:
              name, expected, closed_pr = row["branch"], row["sha"], row["closed_pr"]
              if name in open_heads:
                  raise SystemExit("New open PR uses candidate branch: " + name)
              quoted = urllib.parse.quote(name, safe="/")
              try:
                  current = api("branches/" + quoted)
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      print("already_absent=" + name)
                      continue
                  raise
              if current["commit"]["sha"] != expected or current.get("protected"):
                  raise SystemExit("Moved/protected branch, stopping: " + name)
              if closed_pr is not None:
                  pr = api("pulls/" + str(closed_pr))
                  if pr["state"] != "closed" or pr["head"]["ref"] != name:
                      raise SystemExit("PR-state mismatch, stopping: " + name)
              comparison = api("compare/main..." + quoted)
              ahead = int(comparison.get("ahead_by", 0))
              if closed_pr is None and ahead > 0:
                  raise SystemExit("Unreviewed unique branch commits, stopping: " + name)
              available.append((name, expected, ahead))
          # Archive all unique historical commits to tags BEFORE deleting a single branch.
          for name, expected, ahead in available:
              if ahead == 0:
                  continue
              tag = "archive/branch-prune-20261020/" + name.replace("/", "--")
              qp = urllib.parse.quote(tag, safe="/")
              try:
                  existing = api("git/ref/tags/" + qp)
                  if existing["object"]["sha"] != expected:
                      raise SystemExit("Archive tag collision for " + name)
              except urllib.error.HTTPError as e:
                  if e.code != 404:
                      raise
                  api("git/refs", method="POST", data={"ref": "refs/tags/" + tag, "sha": expected})
              if api("git/ref/tags/" + qp)["object"]["sha"] != expected:
                  raise SystemExit("Archive verification failure for " + name)
              archived.append((name, tag))
          print("archived_unique_branches=" + str(len(archived)))
          # Delete exact untouched refs only; GH API rejects drifted or protected refs.
          deleted = []
          for name, expected, _ in available:
              quoted = urllib.parse.quote(name, safe="/")
              current = api("branches/" + quoted)
              if current["commit"]["sha"] != expected or current.get("protected"):
                  raise SystemExit("Concurrent change, leaving branch: " + name)
              if name in {p["head"]["ref"] for p in api("pulls?state=open&per_page=100")}:
                  raise SystemExit("Newly opened PR; leaving branch: " + name)
              api("git/refs/heads/" + quoted, method="DELETE")
              deleted.append(name)
              print("deleted=" + name)
          print("deleted_count=" + str(len(deleted)))
          print("retained_open_pr_branches=" + str(len(keep)))
          # Remove the temporary PR branch for this one-shot maintenance change,
          # only after GitHub confirms the PR merged and the pinned head is unchanged.
          self_name = "chore/prune-audited-branches-20261020"
          self_pr = api("pulls/999")
          if not self_pr.get("merged") or self_pr["head"]["ref"] != self_name:
              raise SystemExit("Cleanup PR not verified merged; keep maintenance branch")
          try:
              self_ref = api("branches/" + urllib.parse.quote(self_name, safe="/"))
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
              self_ref = None
          if self_ref is not None:
              if self_ref["commit"]["sha"] != self_pr["head"]["sha"] or self_ref.get("protected"):
                  raise SystemExit("Maintenance branch moved/protected; leave untouched")
              api("git/refs/heads/" + urllib.parse.quote(self_name, safe="/"), method="DELETE")
              print("deleted_maintenance_branch=" + self_name)
          current = api("branches?per_page=100")
          remaining = {b["name"] for b in current}
          if remaining != {"main"} | keep:
              raise SystemExit("Unexpected branches after cleanup: " + repr(sorted(remaining)))
          print("branch_cleanup_verified_remaining=" + ",".join(sorted(remaining)))
          PY
