name: Cloudflare Worker Integrity Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-worker-write-diagnostic.yml'
      - 'deploy/cloudflare-worker-write-diagnostic.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: chicagoshining-studio-api
    steps:
      - uses: actions/checkout@v6
      - name: Verify routing, deployment and binding names without values
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/token.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/settings" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/settings.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/deployments.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/subdomain.json
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/domains.json
          echo 'TOKEN'
          jq '{success,status:(.result.status // null)}' /tmp/token.json
          echo 'BINDINGS_NAME_TYPE_ONLY'
          jq '[.result.bindings[]? | {name,type}] | sort_by(.name)' /tmp/settings.json
          echo 'RUNTIME'
          jq '{compatibility_date:.result.compatibility_date,compatibility_flags:(.result.compatibility_flags // [])}' /tmp/settings.json
          echo 'ACTIVE_DEPLOYMENT'
          jq '{id:.result.deployments[0].id,versions:.result.deployments[0].versions}' /tmp/deployments.json
          echo 'WORKERS_DEV'
          jq '{enabled:.result.enabled,previews_enabled:.result.previews_enabled}' /tmp/subdomain.json
          echo 'CUSTOM_DOMAINS'
          jq --arg service "$WORKER_NAME" '[.result[]? | select(.service==$service) | {hostname,zone_name,environment}]' /tmp/domains.json
