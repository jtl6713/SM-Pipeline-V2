name: Cloudflare Worker Version Integrity Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-worker-write-diagnostic.yml'
      - 'deploy/cloudflare-worker-write-diagnostic.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: chicagoshining-studio-api
    steps:
      - uses: actions/checkout@v6
      - name: Inspect recent version binding metadata only
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/deployments.json
          ACTIVE=$(jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id' /tmp/deployments.json)
          echo "ACTIVE_VERSION=$ACTIVE"
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/versions?per_page=30" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/versions.json
          jq -r '
            (.result |
              if type=="object" and has("versions") then .versions
              elif type=="array" and length>0 and (.[0]|type)=="array" then add
              elif type=="array" then .
              else [] end
            )[] | [.id, (.metadata.created_on // ""), (.metadata.source // ""), (.number // 0)] | @tsv
          ' /tmp/versions.json | while IFS=$'\t' read -r id created source number; do
            curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/versions/$id" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/v.json
            jq -c --arg id "$id" --arg created "$created" --arg source "$source" --argjson number "$number" --arg active "$ACTIVE" '
              {id:$id,created_on:$created,source:$source,number:$number,active:($id==$active),binding_count:(.result.resources.bindings // [] | length),binding_names:([.result.resources.bindings[]?.name] | sort),compatibility_date:(.result.resources.script_runtime.compatibility_date // null),compatibility_flags:(.result.resources.script_runtime.compatibility_flags // []),etag:(.result.resources.script.etag // null)}' /tmp/v.json
          done
