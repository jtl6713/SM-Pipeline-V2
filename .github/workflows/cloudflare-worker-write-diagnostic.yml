name: Cloudflare Worker Version Shape Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-worker-write-diagnostic.yml'
      - 'deploy/cloudflare-worker-write-diagnostic.txt'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: chicagoshining-studio-api
    steps:
      - uses: actions/checkout@v6
      - name: Print sanitized versions response shape
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/deployments" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/deployments.json
          ACTIVE=$(jq -er '.result.deployments[0].versions | max_by(.percentage) | .version_id' /tmp/deployments.json)
          echo "ACTIVE_VERSION=$ACTIVE"

          curl -fsS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/versions?per_page=30" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/versions.json

          echo 'TOP_LEVEL'
          jq -c '{success,errors:(.errors|length),messages:(.messages|length),result_type:(.result|type),result_info:(.result_info // null)}' /tmp/versions.json
          echo 'RESULT_SHAPE'
          jq -c '
            .result |
            if type=="object" then
              {type:"object",keys:(keys|sort),versions_type:(if has("versions") then (.versions|type) else null end),versions_len:(if has("versions") and (.versions|type)=="array" then (.versions|length) else null end)}
            elif type=="array" then
              {type:"array",len:length,first_type:(if length>0 then (.[0]|type) else null end),first_shape:(if length==0 then null elif (.[0]|type)=="object" then {keys:(.[0]|keys|sort),id:(.[0].id // null),number:(.[0].number // null),metadata_keys:((.[0].metadata // {})|keys|sort)} elif (.[0]|type)=="array" then {len:(.[0]|length),first_type:(if (.[0]|length)>0 then (.[0][0]|type) else null end)} else .[0] end)}
            else {type:type} end
          ' /tmp/versions.json

          echo 'SANITIZED_FIRST_PAGE_ENTRIES'
          jq -c '
            .result |
            if type=="object" and has("versions") and (.versions|type)=="array" then .versions
            elif type=="array" and length>0 and (.[0]|type)=="array" then .[0]
            elif type=="array" then .
            else [] end |
            .[:10] |
            map(if type=="object" then {id:(.id // null),number:(.number // null),metadata:{created_on:(.metadata.created_on // null),source:(.metadata.source // null),hasPreview:(.metadata.hasPreview // null)}} else {entry_type:type} end)
          ' /tmp/versions.json
