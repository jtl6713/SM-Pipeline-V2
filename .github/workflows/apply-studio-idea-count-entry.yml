name: Apply Studio Idea Count Entry

on:
  push:
    branches: [main]
    paths:
      - 'deploy/apply-studio-idea-count-entry.txt'

permissions:
  contents: write

concurrency:
  group: apply-studio-idea-count-entry
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply guarded 1-10 numeric count change
        shell: bash
        run: |
          set -euo pipefail
          python repair/tools/patch_studio_idea_count_entry.py
          cp apps/studio-api/worker.js /tmp/studio-worker.mjs
          cp apps/studio-web/assets/app-item4-0619.js /tmp/studio-web.mjs
          node --check /tmp/studio-worker.mjs
          node --check /tmp/studio-web.mjs
          grep -q '0.10.37-manual-idea-count-entry' apps/studio-api/worker.js
          grep -q 'Idea count must be a whole number from 1 to 10' apps/studio-api/worker.js
          grep -q 'type="number" min="1" max="10" step="1" value="5"' apps/studio-web/index.html
          grep -q '0.6.70-idea-count-entry' apps/studio-web/index.html
          grep -q 'Enter a whole number from 1 to 10.' apps/studio-web/assets/app-item4-0619.js

      - name: Commit source change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio-api/worker.js apps/studio-web/index.html apps/studio-web/assets/app-item4-0619.js
          if ! git diff --cached --quiet; then
            git commit -m 'feat(ideas): allow 1-10 manual idea count entry'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
