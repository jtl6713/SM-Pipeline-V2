name: PR 1135 Merge Diagnostic
on:
  push:
    branches: [feature/autonomous-publication-recovery-20261024]
    paths: ['.github/workflows/pr-1135-merge-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect actual merge conflicts without pushing
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SM Pipeline Merge Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          echo "feature_head=$(git rev-parse HEAD)"
          echo "main_head=$(git rev-parse origin/main)"
          git -c rerere.enabled=false merge --no-commit --no-ff origin/main || true
          echo "=== UNMERGED PATHS ==="
          git diff --name-only --diff-filter=U
          echo "=== CONFLICT REGIONS (bounded) ==="
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          names=subprocess.check_output(["git","diff","--name-only","--diff-filter=U"],text=True).splitlines()
          for name in names:
              if not Path(name).is_file(): continue
              lines=Path(name).read_text(errors="replace").splitlines()
              regions=[]
              for i,line in enumerate(lines):
                  if line.startswith("<<<<<<< "):
                      end=next((j for j in range(i+1,len(lines)) if lines[j].startswith(">>>>>>> ")),None)
                      regions.append((i+1,end+1 if end is not None else None,
                                      [x[:160] for x in lines[i:min(len(lines),i+9)]]))
              print(name, "regions", len(regions), "sample",regions[:12])
          PY
          git merge --abort || true
