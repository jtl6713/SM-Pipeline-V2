name: Meta Spam Held Reschedule One Shot

on:
  workflow_run:
    workflows: ["Deploy Studio API Worker Production"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: meta-spam-held-reschedule-one-shot
  cancel-in-progress: false

jobs:
  safe-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Gate to operator-authorized Meta spam commit only
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --format=%B | grep -Fqi "Meta spam-blocked"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Node 22
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check rescheduling script
        if: steps.gate.outputs.enabled == 'true'
        run: node --check repair/scripts/meta-spam-held-reschedule-once.mjs
      - name: Reserve cooldown-paced future dates while retaining hard holds
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node repair/scripts/meta-spam-held-reschedule-once.mjs
      - name: Upload exact results without credentials
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meta-spam-held-reschedule-results
          path: /tmp/meta-spam-held-reschedule-report.json
          if-no-files-found: ignore
          retention-days: 7
