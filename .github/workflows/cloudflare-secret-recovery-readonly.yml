name: Audit Recoverability of Studio API Secrets

on:
  push:
    branches: [main]
    paths:
      - 'deploy/cloudflare-secret-recovery-readonly.txt'

permissions:
  contents: read

concurrency:
  group: chicagoshining-studio-api-secret-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
    steps:
      - uses: actions/checkout@v6

      - name: Verify production remains on known-good v86
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS "$API/deployments" -H "$AUTH" -o /tmp/deployments.json
          ACTIVE=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/deployments.json)
          test "$ACTIVE" = "fbcf7fbd-7935-44dd-b195-094f505b7df6"

      - name: Query secret endpoints without emitting secret values
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          list_code=$(curl -sS -o /tmp/secret-list.raw -w '%{http_code}' "$API/secrets" -H "$AUTH")
          a_code=$(curl -sS -o /tmp/airtable.raw -w '%{http_code}' "$API/secrets/AIRTABLE_PAT" -H "$AUTH")
          e_code=$(curl -sS -o /tmp/elevenlabs.raw -w '%{http_code}' "$API/secrets/ELEVENLABS_API_KEY" -H "$AUTH")

          LIST_CODE="$list_code" A_CODE="$a_code" E_CODE="$e_code" python - <<'PY'
          import json, os
          from pathlib import Path

          def load(path):
              p=Path(path)
              if not p.exists(): return {}
              try: return json.loads(p.read_text())
              except Exception: return {}

          def inspect_one(path, code, expected_name):
              raw=load(path)
              r=raw.get('result') or {}
              value=r.get('text')
              return {
                  'http_status':int(code),
                  'success':raw.get('success') is True,
                  'name_matches':str(r.get('name') or '')==expected_name,
                  'type':str(r.get('type') or ''),
                  'has_nonempty_text_field':isinstance(value,str) and len(value)>0,
              }

          listed=load('/tmp/secret-list.raw')
          listed_names=sorted(str(x.get('name')) for x in (listed.get('result') or []) if x.get('name'))
          out={
              'worker':'chicagoshining-studio-api',
              'active_version':'fbcf7fbd-7935-44dd-b195-094f505b7df6',
              'list_http_status':int(os.environ['LIST_CODE']),
              'listed_expected_secret_names':sorted(set(listed_names)&{'AIRTABLE_PAT','ELEVENLABS_API_KEY'}),
              'airtable_pat':inspect_one('/tmp/airtable.raw',os.environ['A_CODE'],'AIRTABLE_PAT'),
              'elevenlabs_api_key':inspect_one('/tmp/elevenlabs.raw',os.environ['E_CODE'],'ELEVENLABS_API_KEY'),
          }
          Path('/tmp/secret-recovery-sanitized.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

          rm -f /tmp/secret-list.raw /tmp/airtable.raw /tmp/elevenlabs.raw

      - name: Upload sanitized evidence only
        uses: actions/upload-artifact@v4
        with:
          name: studio-api-secret-recovery-audit-${{ github.run_id }}
          path: /tmp/secret-recovery-sanitized.json
          retention-days: 30
