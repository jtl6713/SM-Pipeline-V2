name: Pulse Calle Ocho A3 Classify

# One-shot: classify only Calle Ocho 6/10/11/14 (not Classify All).
on:
  push:
    branches: [main]
    paths:
      - 'deploy/pulse-calle-ocho-classify.txt'
      - '.github/workflows/pulse-calle-ocho-classify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-calle-ocho-classify
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PIPELINE_RUNNER_SHARED_SECRET: ${{ secrets.PIPELINE_RUNNER_SHARED_SECRET }}
      AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
    steps:
      - name: Pulse A3 for four Calle Ocho stills only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PIPELINE_RUNNER_SHARED_SECRET:-}"
          test -n "${AIRTABLE_PAT:-}"
          IDS='["recnUIg8Wp5U9SDEn","recMjeAXaO8hgYmko","recMShoqUg7ppO7AN","recRXsqQ4KtjPQxY2"]'
          code=$(curl -sS --max-time 600 -o /tmp/a3.json -w '%{http_code}' \
            -X POST 'https://pipeline.chicagoshining.com/stages/a3' \
            -H "X-Pipeline-Secret: $PIPELINE_RUNNER_SHARED_SECRET" \
            -H 'Content-Type: application/json' \
            --data "{\"extra\":{\"record_ids\":$IDS,\"trigger_a4\":false,\"wait_for_next\":false,\"drain\":false,\"background\":false}}")
          echo "a3_http=$code"
          head -c 4000 /tmp/a3.json; echo
          test "$code" -ge 200 -a "$code" -lt 300
          jq -e '(.status // "") != "error"' /tmp/a3.json >/dev/null

      - name: Verify Calle Ocho quartet is Classified
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.request

          pat = os.environ["AIRTABLE_PAT"].strip()
          base = "appe33zkZn35yirTL"
          table = "tblSITCujCsJTNcDe"
          ids = [
              "recnUIg8Wp5U9SDEn",  # Calle Ocho 6
              "recMjeAXaO8hgYmko",  # Calle Ocho 10
              "recMShoqUg7ppO7AN",  # Calle Ocho 11
              "recRXsqQ4KtjPQxY2",  # Calle Ocho 14
          ]
          headers = {"Authorization": f"Bearer {pat}"}

          def fetch():
              out = []
              for rid in ids:
                  req = urllib.request.Request(
                      f"https://api.airtable.com/v0/{base}/{table}/{rid}",
                      headers=headers,
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      row = json.loads(response.read().decode("utf-8"))
                  fields = row.get("fields") or {}
                  out.append(
                      {
                          "id": rid,
                          "name": fields.get("Asset Name"),
                          "status": fields.get("Classification_Status"),
                          "keywords": bool(str(fields.get("Search_Keywords") or "").strip()),
                      }
                  )
              return out

          last = []
          for attempt in range(1, 25):
              last = fetch()
              print(f"attempt={attempt} " + json.dumps(last, ensure_ascii=True))
              if all(r["status"] == "Classified" and r["keywords"] for r in last):
                  print("calle_ocho_quartet_classified=true")
                  raise SystemExit(0)
              time.sleep(15)
          print("calle_ocho_quartet_classified=false")
          raise SystemExit(1)
          PY
