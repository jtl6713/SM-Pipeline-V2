name: Home Tally Read-Only Live Parity
on:
  push:
    branches: [main]
    paths:
      - deploy/home-tally-readonly-once.txt
permissions:
  contents: read
concurrency:
  group: home-tally-readonly-live-parity
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read cached Home overview through the existing authenticated service binding
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          name="studio-home-tally-ro-parity-20261020"
          code=$(curl -sS -o /tmp/ro-settings.json -w '%{http_code}' -H "$auth" "$api/workers/scripts/$name/settings")
          if [[ "$code" != "404" ]]; then
            echo "Refusing to overwrite any existing verification Worker (HTTP $code)" >&2
            exit 1
          fi
          created=0
          cleanup() {
            if [[ "$created" == 1 ]]; then
              curl -sS -X DELETE -H "$auth" "$api/workers/scripts/$name" >/dev/null || true
            fi
          }
          trap cleanup EXIT
          token=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          cat > /tmp/ro-worker.js <<JS
          export default {
            async fetch(req, env) {
              if (new URL(req.url).pathname !== "/$token/overview") {
                return new Response("Not found", {status:404});
              }
              const response = await env.STUDIO_API.fetch(new Request("https://studio.chicagoshining.com/api/profiles/overview", {
                method:"GET",
                headers:{
                  "Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com",
                  "Origin":"https://studio.chicagoshining.com",
                  "Accept":"application/json"
                }
              }));
              return new Response(response.body, {
                status:response.status,
                headers:{"Content-Type":"application/json","Cache-Control":"no-store"}
              });
            }
          };
          JS
          cat > /tmp/ro-metadata.json <<'JSON'
          {"main_module":"worker.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"chicagoshining-studio-api"}]}
          JSON
          node --check /tmp/ro-worker.js
          upload=$(curl -sS -o /tmp/ro-upload.json -w '%{http_code}' -X PUT "$api/workers/scripts/$name/content" -H "$auth" -F 'metadata=@/tmp/ro-metadata.json;type=application/json' -F 'worker.js=@/tmp/ro-worker.js;type=application/javascript+module;filename=worker.js')
          if [[ "$upload" -lt 200 || "$upload" -ge 300 ]]; then
            jq -c '{success,errors}' /tmp/ro-upload.json >&2 || true
            exit 1
          fi
          created=1
          jq -e '.success==true' /tmp/ro-upload.json >/dev/null
          curl -fsS -X POST "$api/workers/scripts/$name/subdomain" -H "$auth" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' > /tmp/ro-enable.json
          jq -e '.success==true and .result.enabled==true' /tmp/ro-enable.json >/dev/null
          curl -fsS "$api/workers/subdomain" -H "$auth" > /tmp/ro-subdomain.json
          sub=$(jq -er '.result.subdomain' /tmp/ro-subdomain.json)
          ready=0
          for attempt in $(seq 1 30); do
            code=$(curl -sS --max-time 20 -o /tmp/ro-result.json -w '%{http_code}' "https://$name.$sub.workers.dev/$token/overview" || true)
            if [[ "$code" == "200" ]] && jq -e '.ok==true and (.records|type)=="array" and (.records|length)==4 and (.snapshot_at|numbers)>1792500357592' /tmp/ro-result.json >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 10
          done
          if [[ "$ready" != "1" ]]; then
            echo "Home overview did not advance beyond preexisting snapshot (HTTP $code)" >&2
            exit 1
          fi
          jq -e '[.records[] | (.approval|numbers),(.approved_unpublished|numbers),(.overdue_unpublished|numbers)] | length==12' /tmp/ro-result.json >/dev/null
          jq -c '{ok,cached,stale,refreshing,snapshot_at,snapshot_generation,read_source,records:[.records[]|{id,name,city_label,approval,approved_unpublished,overdue_unpublished,read_source}]}' /tmp/ro-result.json
          echo "home_tally_readonly_snapshot_verified=PASS profiles=4"
          echo "Read-only: no refresh, no Airtable scan, no production code change."
