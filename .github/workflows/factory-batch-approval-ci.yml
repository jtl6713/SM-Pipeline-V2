name: Factory Batch Approval CI
on:
  pull_request:
    paths:
      - "apps/studio-api/**"
      - "apps/studio-web/**"
      - ".github/workflows/factory-batch-approval-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factory-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate syntax
        run: |
          node --check apps/studio-api/worker.js
          node --check apps/studio-api/worker-functions-04.mjs
          node --check apps/studio-api/approve-all-batch.mjs
          node --check apps/studio-api/factory-approval-queue.mjs
          node --check apps/studio-api/factory-approval-groups.mjs
          node --check apps/studio-api/output-approval-lease.mjs
          node --check apps/studio-web/assets/factory-desk.js
      - name: Factory single and batch approval regressions
        run: |
          node --test apps/studio-api/approve-all-batch.test.mjs apps/studio-api/factory-approve.test.mjs apps/studio-api/factory-batch-approval.test.mjs apps/studio-api/factory-approval-queue.test.mjs apps/studio-api/factory-approval-groups.test.mjs apps/studio-api/factory-real-record-publish-route.staging.test.mjs apps/studio-api/output-approval-lease.test.mjs apps/studio-web/factory-desk.test.mjs apps/studio-web/factory-batch-approval.test.mjs
