name: Factory Batch Approval CI
on:
  pull_request:
    paths:
      - "apps/studio-api/**"
      - "apps/studio-web/**"
      - "deploy/factory-batch-production-rollout.json"
      - "repair/scripts/studio_api_binding_contract.py"
      - ".github/workflows/deploy-cloudflare-worker-production.yml"
      - ".github/workflows/factory-batch-approval-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  factory-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate syntax
        run: |
          node --check apps/studio-api/worker.js
          node --check apps/studio-api/worker-functions-04.mjs
          node --check apps/studio-api/approve-all-batch.mjs
          node --check apps/studio-api/factory-approval-queue.mjs
          node --check apps/studio-api/factory-approval-groups.mjs
          node --check apps/studio-api/factory-approval-output-claims.mjs
          node --check apps/studio-api/factory-batch-global-policy.mjs
          node --check apps/studio-api/factory-global-rollout-health.mjs
          node --check apps/studio-api/output-approval-lease.mjs
          node --check apps/studio-web/assets/factory-desk.js
          node --test apps/studio-api/factory-desk.test.mjs apps/studio-api/ops-queue.test.mjs
      - name: Factory single and batch approval regressions
        run: |
          node --check apps/studio-api/schedule-occupancy-90-day.test.mjs
          node --test apps/studio-api/failed-output-monitor.test.mjs
          node --test apps/studio-api/facebook-photo-finalize-priority.test.mjs
          node --test apps/studio-api/facebook-reel-finalize-priority.test.mjs
          node --test apps/studio-api/approved-past-due-quality.test.mjs
          node --test apps/studio-api/facebook-preapproval-recovery.test.mjs apps/studio-api/facebook-story-rate-limit-quality.test.mjs
          node --test apps/studio-api/factory-global-rollout-health.test.mjs
          node --test apps/studio-api/facebook-held-finalize.test.mjs
          node --test apps/studio-api/approved-exception-drilldown.test.mjs
          node --test apps/studio-api/home-pipeline-exception-parity.test.mjs
          node --test apps/studio-web/factory-profile-filter-fast.test.mjs
          node --test apps/studio-web/factory-quality-recovery-progress.test.mjs
          node --test apps/studio-web/factory-batch-quality-agent.test.mjs apps/studio-web/ui-release-contract.test.mjs
          node --test apps/studio-api/schedule-occupancy-90-day.test.mjs
          node --test apps/studio-api/factory-approval-output-claims.test.mjs
          node --test apps/studio-api/approve-all-batch.test.mjs apps/studio-api/factory-approve.test.mjs apps/studio-api/factory-batch-approval.test.mjs apps/studio-api/factory-approval-queue.test.mjs apps/studio-api/factory-approval-groups.test.mjs apps/studio-api/factory-batch-global-policy.test.mjs apps/studio-api/factory-real-record-publish-route.staging.test.mjs apps/studio-api/output-approval-lease.test.mjs apps/studio-web/factory-desk.test.mjs apps/studio-web/factory-batch-approval.test.mjs apps/studio-web/factory-review-selection-eligibility.test.mjs
      - name: Validate signed Factory global deployment contract and reject drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'repair/scripts')
          from studio_api_binding_contract import (
              global_factory_manifest_values,assert_global_factory_binding_tuple,GLOBAL_FACTORY_CAPS,
              GLOBAL_FACTORY_BINDINGS,GLOBAL_FACTORY_CURRENT_MODE)
          manifest=json.loads(Path('deploy/factory-batch-production-rollout.json').read_text())
          original=global_factory_manifest_values(manifest)
          assert assert_global_factory_binding_tuple(original,'signed test') == manifest['global']['stage']
          # The immediately previous signed production tuple is a valid
          # predeploy/rollback source during this mode migration, but it is not
          # a valid release manifest target.
          legacy=dict(zip(GLOBAL_FACTORY_BINDINGS,(
              'true','global_ig_reel_story_v1',
              str(manifest['global']['max_total']),str(manifest['global']['max_per_profile']),
              'explicit-review')))
          assert assert_global_factory_binding_tuple(legacy,'legacy predeploy') == manifest['global']['stage']
          old_manifest=json.loads(json.dumps(manifest))
          old_manifest['global']['mode']='global_ig_reel_story_v1'
          try: global_factory_manifest_values(old_manifest)
          except SystemExit: pass
          else: raise AssertionError('Legacy mode accepted as current release target')
          assert GLOBAL_FACTORY_CURRENT_MODE == 'global_all_platforms_v2'
          for key, value in [
              ('max_total',5),('max_per_profile',3),('mode','invalid'),
              ('production_signoff',''),('stage','unknown')]:
              bad=json.loads(json.dumps(manifest));bad['global'][key]=value
              try: global_factory_manifest_values(bad)
              except SystemExit: pass
              else: raise AssertionError('Release drift not rejected: '+key)
          for key,value in [
              ('FACTORY_BATCH_GLOBAL_MAX_TOTAL','999'),
              ('FACTORY_BATCH_GLOBAL_PRODUCTION_SIGNOFF',''),
              ('FACTORY_BATCH_GLOBAL_APPROVALS_ENABLED','false')]:
              bad={**original,key:value}
              try: assert_global_factory_binding_tuple(bad,'invalid')
              except SystemExit: pass
              else: raise AssertionError('Binding drift not rejected: '+key)
          assert set(GLOBAL_FACTORY_CAPS)=={'pilot','expanded'}
          print('FACTORY_SIGNED_GLOBAL_RELEASE=PASS stage='+manifest['global']['stage'])
          PY
