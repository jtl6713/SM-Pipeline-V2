name: Deploy Item7 R4 Exact Entry Drift V8

on:
  push:
    branches: [main]
    paths:
      - 'repair/scripts/patch-item7-r4-exact-entry-drift-v8.py'
      - '.github/workflows/deploy-item7-r4-exact-entry-drift-v8.yml'

permissions:
  contents: write

concurrency:
  group: item7-controller-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrow controller patch
        run: |
          set -euo pipefail
          python repair/scripts/patch-item7-r4-exact-entry-drift-v8.py apps/studio-api/worker.js
          node --check apps/studio-api/worker.js
          grep -q 'ITEM7_R4_EXACT_ENTRY_DRIFT_V8' apps/studio-api/worker.js
          grep -q 'repair_item7_r4_exact_entry_drift_v8: true' apps/studio-api/worker.js
          git diff --check
          git diff -- apps/studio-api/worker.js > /tmp/item7-r4-exact-entry-v8.diff
          test -s /tmp/item7-r4-exact-entry-v8.diff
      - name: Deploy patched Studio API worker with rollback guard
        run: |
          set -euo pipefail
          bash repair/scripts/deploy-item6-studio-controller-v2.sh
      - name: Persist deployed source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/studio-api/worker.js
          git commit -m 'fix(item7): recognize R4 exact-entry selector drift'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: item7-r4-exact-entry-drift-v8-${{ github.run_id }}
          path: |
            /tmp/item7-r4-exact-entry-v8.diff
            /tmp/item6v2-active-before.txt
            /tmp/item6v2-active-after.txt
            /tmp/item6v2-source-sha256.txt
            /tmp/item6v2-bindings-before.json
            /tmp/item6v2-bindings-after.json
            /tmp/item6v2-dry-run.log
            /tmp/item6v2-deploy.log
          if-no-files-found: ignore
          retention-days: 30
