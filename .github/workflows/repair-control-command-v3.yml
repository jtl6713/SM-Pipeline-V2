name: Exact Repair Control Command V3
on:
  push:
    branches: [main]
    paths: ['deploy/repair-control-command-v3.json']
  issues:
    types: [opened, reopened]
permissions:
  contents: read
concurrency:
  group: sm-pipeline-exact-repair-control-v3
  cancel-in-progress: false
jobs:
  control:
    if: github.event_name == 'push' || (github.event_name == 'issues' && github.event.issue.title == 'ITEM6 CLEANUP PROOF DISPATCH')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKER: chicagoshining-studio-api
      BRIDGE_WORKER: chicagoshining-repair-v3-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate command and capture exact active version
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy/repair-control-command-v3.json
          ACTION=$(jq -er '.action' deploy/repair-control-command-v3.json)
          case "$ACTION" in acquire|assert_output_allowed|state|release|sweep|replace_transaction_state|prepare_replace_transaction|begin_replace_transaction|verify_replace_transaction|rollback_replace_transaction|complete_replace_cleanup) ;; *) exit 1 ;; esac
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$TARGET_WORKER"
          curl -fsS "$API/deployments" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/before.json
          ACTIVE=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/before.json)
          PCT=$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.percentage' /tmp/before.json)
          test "$PCT" = '100'
          printf '%s' "$ACTIVE" >/tmp/active.txt
      - name: Build exact-version bridge
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(python - <<'PY'
          import secrets; print(secrets.token_urlsafe(32))
          PY
          )
          printf '%s' "$TOKEN" >/tmp/token.txt
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('deploy/repair-control-command-v3.json').read_text())
          c.pop('expected_http_status',None)
          c.pop('proof_nonce',None)
          Path('/tmp/cmd.json').write_text(json.dumps(c,separators=(',',':')))
          PY
          CMD=$(cat /tmp/cmd.json); ACTIVE=$(cat /tmp/active.txt)
          cat >/tmp/bridge.js <<EOF
          export default {async fetch(request,env){
            const u=new URL(request.url);
            if(u.pathname==="/$TOKEN/ready") return Response.json({ok:true,ready:true},{headers:{"Cache-Control":"no-store"}});
            if(u.pathname!=="/$TOKEN/execute") return new Response("Not found",{status:404});
            const command=$CMD;
            if(command.action==="acquire" && (!command.expires_at || command.expires_at==="RUNTIME_PLUS_10_MINUTES")) command.expires_at=new Date(Date.now()+10*60*1000).toISOString();
            const r=await env.STUDIO_API.fetch(new Request("https://studio-api.internal/api/admin/repair/control",{method:"POST",headers:{"Cf-Access-Authenticated-User-Email":"joseph.t.logan@gmail.com","Origin":"https://studio.chicagoshining.com","Content-Type":"application/json","Accept":"application/json","Cloudflare-Workers-Version-Overrides":"$TARGET_WORKER=\"$ACTIVE\""},body:JSON.stringify(command)}));
            return new Response(await r.text(),{status:r.status,headers:{"Content-Type":"application/json","Cache-Control":"no-store"}});
          }};
          EOF
          cat >/tmp/metadata.json <<EOF
          {"main_module":"bridge.js","compatibility_date":"2026-08-02","bindings":[{"type":"service","name":"STUDIO_API","service":"$TARGET_WORKER"}]}
          EOF
          node --check /tmp/bridge.js
      - name: Upload bridge and wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          code=$(curl -sS -o /tmp/upload.json -w '%{http_code}' -X PUT "$ROOT/workers/scripts/$BRIDGE_WORKER/content" -H "$AUTH" -F 'metadata=@/tmp/metadata.json;type=application/json' -F 'bridge.js=@/tmp/bridge.js;type=application/javascript+module;filename=bridge.js')
          test "$code" -ge 200 -a "$code" -lt 300; jq -e '.success==true' /tmp/upload.json >/dev/null
          curl -fsS -X POST "$ROOT/workers/scripts/$BRIDGE_WORKER/subdomain" -H "$AUTH" -H 'Content-Type: application/json' --data '{"enabled":true,"previews_enabled":false}' >/tmp/sub.json
          curl -fsS "$ROOT/workers/subdomain" -H "$AUTH" -o /tmp/account-subdomain.json
          SUB=$(jq -er '.result.subdomain' /tmp/account-subdomain.json); T=$(cat /tmp/token.txt)
          ready=false
          for i in $(seq 1 20); do code=$(curl -sS --max-time 20 -o /tmp/ready.json -w '%{http_code}' "https://$BRIDGE_WORKER.$SUB.workers.dev/$T/ready" || true); if [[ "$code" == '200' ]] && jq -e '.ok==true' /tmp/ready.json >/dev/null 2>&1; then ready=true; break; fi; sleep 2; done
          test "$ready" = true
      - name: Execute command exactly once
        shell: bash
        run: |
          set -euo pipefail
          SUB=$(jq -er '.result.subdomain' /tmp/account-subdomain.json); T=$(cat /tmp/token.txt); EXPECTED=$(jq -r '.expected_http_status // 200' deploy/repair-control-command-v3.json)
          code=$(curl -sS --max-time 150 -o /tmp/result.json -w '%{http_code}' "https://$BRIDGE_WORKER.$SUB.workers.dev/$T/execute" || true)
          echo "repair_v3_http=$code expected=$EXPECTED"
          jq -c '{ok,action,error:(.error//null),lease:(.lease//null),output:(.output//null),replace:(.replace//null),idempotent:(.idempotent//null),swept:(.swept//null)}' /tmp/result.json || true
          test "$code" = "$EXPECTED"
          if [[ "$EXPECTED" -ge 200 && "$EXPECTED" -lt 300 ]]; then jq -e '.ok==true' /tmp/result.json >/dev/null; else jq -e '.ok==false' /tmp/result.json >/dev/null; fi
      - name: Delete bridge and verify production unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -sS -X DELETE "$ROOT/workers/scripts/$BRIDGE_WORKER" -H "$AUTH" >/dev/null || true
          curl -fsS "$ROOT/workers/scripts/$TARGET_WORKER/deployments" -H "$AUTH" -o /tmp/after.json
          test "$(cat /tmp/active.txt)" = "$(jq -er '.result.deployments[0].versions|max_by(.percentage)|.version_id' /tmp/after.json)"
      - name: Save evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-control-v3-${{ github.run_id }}
          path: /tmp/result.json
          if-no-files-found: ignore
          retention-days: 14
