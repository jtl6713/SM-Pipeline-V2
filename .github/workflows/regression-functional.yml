name: Regression functional

on:
  pull_request:
    paths:
      - "apps/**"
      - "services/**"
      - "tests/regression/**"
      - "package.json"
      - ".github/workflows/regression-functional.yml"
      - ".github/workflows/regression-suite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermetic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r services/pipeline-runner/requirements.txt
          pip install -r services/timing-engine/requirements.txt

      - name: Hermetic packs
        run: python tests/regression/runner.py hermetic

      - name: Log result to Task Organizer
        if: always()
        continue-on-error: true
        env:
          CONCLUSION: ${{ job.status }}
        run: python scripts/log_task_activity.py --suite "Regression functional" --job hermetic --conclusion "$CONCLUSION"
