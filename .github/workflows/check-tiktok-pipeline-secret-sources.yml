name: Check TikTok Pipeline Secret Sources

on:
  push:
    branches: [main]
    paths:
      - 'deploy/check-tiktok-pipeline-secret-sources.txt'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      TIKTOK_MAKE_SHARED_SECRET_CANDIDATE: ${{ secrets.TIKTOK_MAKE_SHARED_SECRET }}
      TIKTOK_PIPELINE_SECRET_CANDIDATE: ${{ secrets.TIKTOK_PIPELINE_SECRET }}
      R2_UPLOAD_WORKER_SECRET_CANDIDATE: ${{ secrets.R2_UPLOAD_WORKER_SECRET }}
      PIPELINE_RUNNER_SHARED_SECRET_CANDIDATE: ${{ secrets.PIPELINE_RUNNER_SHARED_SECRET }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          for name in [
            "TIKTOK_MAKE_SHARED_SECRET_CANDIDATE",
            "TIKTOK_PIPELINE_SECRET_CANDIDATE",
            "R2_UPLOAD_WORKER_SECRET_CANDIDATE",
            "PIPELINE_RUNNER_SHARED_SECRET_CANDIDATE",
          ]:
              print(f"{name}_present={str(bool(os.environ.get(name,''))).lower()}")
          PY
